<title>Dispatch Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
THESIS: The home screen is the work. Every request is a strip moving through Awaiting approval → Queued → Running → Blocked/paused · Failed → Done, owned by a named skynet role, and selecting one opens its vertical agent → workflow → tasks stepper. Refuses the metrics-dashboard home.
OWN-WORLD: Control-room HMI greys; color only for state (shape + label, never color alone); one process-blue for actions. Flight-progress strips, vertical steppers, dashed cluster containers, chat composers.
STORY: An operator scopes to a tenant (sidebar) and org/site/env (scope bar), sees what is stuck, asks about it in plain words, approves what agents propose, and drills down to Semaphore receipts; fine-grained telemetry is one click away in Grafana.
FIRST VIEWPORT: Sidebar left (tenant switcher, nav with red issue badges, agent roles). Scope bar + iteration on top. Business-domain tiles, collapsible hierarchy, "Ask about current work" composer, then six lanes (Done collapsed). Details panel right, minimizable to a summary rail.
FORM: Prototype C of 3, chosen 2026-10-20 and refined through 30+ review comments; concept-seed returned no roll (degraded); structure pinned by the brief.
-->

<style>

  .lane-collapsed .num { font: 600 11px var(--mono); color: var(--fg3); }
  .lane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 7px; min-width: 0; }
  .lane-h { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; }
  .lane-h b { font-size: 12.5px; flex: 1; }
  .lane-h .num { font: 600 11px var(--mono); color: var(--fg3); }
  .lane .strip-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lane .strip-meta .mono { display: none; }
  .lane-empty { font-size: 12px; color: var(--fg3); padding: 10px 6px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); }
  .c-drill { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 90px); overflow: auto; }
  .c-home.drill-min { grid-template-columns: minmax(0, 1fr) 44px; }

  .site[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .c-tree { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 90px); overflow: auto; }

  .ctxask:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .ctxask input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 14px; }

  @media (max-width: 1100px) { .c-home, .c-home.drill-min, .c-topo { grid-template-columns: 1fr; } .c-rail { position: static; flex-direction: row; min-height: 0; padding: 4px 8px; } .c-rail-label { writing-mode: horizontal-tb; } .c-rail .steps.vert { flex-direction: row; width: 90px; height: 4px; } .c-rail .steps.vert i { flex: 1; height: 4px; } .drill-min .board, .drill-min .board.done-open { grid-template-columns: repeat(3, minmax(0, 1fr)); } .lane-collapsed { flex-direction: row; width: auto; justify-content: center; } .lane-collapsed .vert { writing-mode: horizontal-tb; } .c-tree { position: static; max-height: 340px; } .c-drill { position: static; max-height: none; } }

<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js" integrity="sha384-m/CoPp6wBQz6MoZXP+VveuxfvSx0NGXiQyyakzXVOVHgG1fP5bM/UiO4pSNPV6PT" crossorigin="anonymous"></script>
<script src="data.js"></script>

<script>
const { D, ic, esc, st, comp } = K;
K.opts.tenantInSidebar = true; // the sidebar brand is the only place the tenant shows or changes
let SCOPE = ["Uhstray.io", "Platform", "site-hq", "prod"];
let selKey = "AC-1184";
let drillOpen = true; // the details panel; it also folds away whenever nothing is selected
// the request dashboard from prototype A lives here too, beside the board
const NAVX = [...K.NAV, ["dashboard", "Dashboard", "layout-dashboard"], ["agentrole", "Agent role", "bot"]];
let cur = "home";
let selRole = "service-agent"; // the skynet role shown on the agent-role page
window.onWorkChanged = () => side(cur);
let TARGET = null; // a tenant/org/site/cluster/host picked from the hierarchy
// Work filter: picking an asset shows only work aimed at it or anything beneath it
let FILTER = null; // {kind, name}
const toAsset = (label) => { const [kind, ...rest] = label.split(": "); return { kind, name: rest.join(": ") }; };
// the scope bar (tenant · org · site · env) bounds everything on the board; tiles and tree rows narrow it further
const matchesScope = (w) => w.scope[0] === SCOPE[0] && w.scope[1] === SCOPE[1] && w.scope[2] === SCOPE[2] && w.scope[3] === SCOPE[3];
function matches(w) {
  return matchesScope(w) && (!FILTER || K.workMatches(w, FILTER));
}
// "N workflows running in this scope" banners land here: Work, filtered to that scope
window.onGotoWork = (a) => { FILTER = a; TARGET = `${a.kind}: ${a.name}`; if ((location.hash || "#home") === "#home") route(); else location.hash = "home"; };
window.onScopeChange = (s) => { SCOPE = s; TARGET = null; FILTER = null; topoSel = null; K.dash.state.target = null; route(); K.toast(`Scope: ${s.join(" › ")}`, "crosshair"); };
window.onQueueHere = (label, node) => {
  document.querySelector(".drawer")?.remove();
  if (cur === "topology") {
    mapPick = [];
    const [kind, name] = label.split(": "), t = D.tenants.find((x) => x.name === SCOPE[0]);
    const o = kind === "Site" && t?.orgs.find((x) => x.sites.some((y) => y.name === name));
    if (o) { const site = o.sites.find((y) => y.name === name); SCOPE = [SCOPE[0], o.name, name, site.envs.includes(SCOPE[3]) ? SCOPE[3] : site.envs[0]]; imapNode = null; route(); }
    topoSelect(label, node); return;
  }
  if (cur === "dashboard") { K.dash.state.target = label; route(); document.getElementById("askText")?.focus(); return; }
  TARGET = label; FILTER = toAsset(label);
  if ((location.hash || "#home") !== "#home") location.hash = "home";
  setTimeout(() => { route(); const q = document.getElementById("quickText"); q.focus(); }, 30);
};
const LANES = [["proposed", "Awaiting approval", "hourglass"], ["queued", "Queued", "list-todo"], ["running", "Running", "loader-circle"], ["blocked", "Blocked / paused", "shield-alert"], ["failed", "Failed", "octagon-x"], ["done", "Done", "circle-check"]];
const STUCK = ["blocked", "failed", "paused"];
const laneOf = (w) => (w.state === "paused" ? "blocked" : w.state);
let doneOpen = false; // Done stays collapsed until asked for

function side(cur) {
  const mine = D.work.filter((w) => w.scope[0] === SCOPE[0]), stuck = mine.filter((w) => STUCK.includes(w.state));
  const inT = (hostId) => K.findHost(hostId)?.path[0] === SCOPE[0];
  const downHosts = Object.keys(D.capacity).filter(inT).map((id) => K.findHost(id).h).filter((h) => h.st === "crit"), downVms = D.vms.filter((v) => v.st === "crit" && inT(v.node));
  const counts = { work: mine.filter((w) => w.state !== "done").length, services: K.tenantServices().filter((s) => s.st === "crit").length, stuck: stuck.length, compute: downHosts.length + downVms.length };
  const computeTip = [...downHosts.map((h) => `${h.name} (node)`), ...downVms.map((v) => `${v.name} (VM)`)].join(", ");
  // Work is the board itself (one list, one place), so it has no separate entry
  const groups = [["", ["dashboard", "home"]],["Infrastructure", ["topology", "services", "compute", "telemetry"]], ["Governance", ["access", "secrets", "policy"]], ["Automation", ["agents", "llm", "cicd"]]];
  document.getElementById("side").innerHTML = `<button type="button" class="brand scope-chip tenant-switch" data-level="0" aria-haspopup="listbox" title="Switch tenant"><span class="mark">ac</span><span class="tw"><small>agent-cloud · tenant</small><b>${esc(SCOPE[0])}</b></span>${ic("chevrons-up-down")}</button>` + groups.map(([g, ids]) =>
    (g ? `<div class="grp">${g}</div>` : "") + ids.map((id) => { const [, label, icon] = NAVX.find((n) => n[0] === id);
      const n = id === "home" ? `<span class="n" title="${counts.work} open work items">${counts.work}</span>${counts.stuck ? `<span class="n crit" title="${counts.stuck} blocked, failed or paused: ${esc(stuck.map((w) => w.key).join(", "))}">${counts.stuck}</span>` : ""}`
        : id === "services" && counts.services ? `<span class="n crit" title="${counts.services} down">${counts.services}</span>`
        : id === "compute" && counts.compute ? `<span class="n crit" title="Down: ${esc(computeTip)}">${counts.compute}</span>` : "";
      return `<a href="#${id}" ${id === cur ? 'aria-current="page"' : ""}>${ic(id === "home" ? "list-todo" : icon)}${id === "home" ? "Work" : label}${n}</a>`; }).join("")).join("") +
    // skynet roles: pick one to see only the work it owns or takes part in
    `<div class="grp">Agent roles</div>` + D.agentGroups[0].members.filter((m) => m.dynamic).map((m) => { const L = K.roleLoad(m.name);
      return `<a href="#agentrole" class="role-link" data-role="${m.name}" ${cur === "agentrole" && selRole === m.name ? 'aria-current="page"' : ""}>${K.roleTile(m)}<span class="grow" style="display:grid;min-width:0"><span>${m.name}</span><small class="faint" style="font-weight:500">${m.domain}</small></span>${m.planned ? `<span class="n" title="Not live yet">planned</span>` : L.now.length ? `<span class="n" title="${L.now.length} assigned now">${L.now.length}</span>` : ""}</a>`; }).join("") +
    `<span style="flex:1"></span><a href="#access" title="Signed in via Authentik · platform-admins"><span class="av human" style="background:#15191e">JW</span><span>You<br><small class="faint" style="font-weight:500">via Authentik</small></span></a>`;
}

// business domains, not org/site (the scope bar already picks those): health of the domain's services + its open and stuck work in scope
function domainTiles() {
  const svcs = K.tenantServices(), inScope = D.work.filter((w) => matchesScope(w) && w.state !== "done");
  return D.domains.map(([name, icon]) => {
    const ss = svcs.filter((x) => x.domain === name), worst = ss.some((x) => x.st === "crit") ? "crit" : ss.some((x) => x.st === "warn") ? "warn" : "ok";
    const ws = inScope.filter((w) => K.domainOfWork(w) === name), stuck = ws.filter((w) => STUCK.includes(w.state)).length;
    return `<button class="site ${worst}" type="button" aria-pressed="${FILTER?.kind === "Domain" && FILTER.name === name}" title="Show only ${esc(name)} work"><small class="row" style="gap:4px">${ic(icon)}${ss.length} ${ss.length === 1 ? "service" : "services"}</small><span class="row"><b class="grow">${esc(name)}</b><span class="rollup"><span title="Open work">${ic("list-todo")}${ws.length}</span>${stuck ? `<span title="Blocked, failed or paused" style="color:var(--crit)">${ic("octagon-x")}${stuck}</span>` : ""}</span></span></button>`;
  }).join("");
}

// minimized details: a summary that fits a 44px column (key, state, agent, step progress, what needs you)
function railHtml(sel) {
  if (!sel) return `<aside class="c-rail" aria-label="Details panel, minimized"><button class="iconbtn" disabled aria-label="Select a strip to see its details" title="Select a strip to see its details">${ic("panel-right-open")}</button><span class="c-rail-label">Details</span></aside>`;
  const curStep = sel.steps.find((x) => x[1] !== "done"), a = D.agents[sel.agent];
  const needs = { proposed: ["hourglass", "Needs your approval"], blocked: ["shield-alert", "Blocked by policy"], failed: ["octagon-x", "Failed"], paused: ["circle-pause", "Paused"] }[sel.state];
  const tip = `${sel.key} · ${sel.title} · ${K.stateLabel[sel.state]}${curStep ? ` · step: ${curStep[0]}` : ""} · ${a.name}. Click to open details.`;
  return `<aside class="c-rail has-sel" data-drill-open role="button" tabindex="0" aria-label="${esc(tip)}" title="${esc(tip)}">
    <span class="iconbtn" aria-hidden="true">${ic("panel-right-open")}</span>
    <span class="c-rail-label">${esc(sel.key)}</span>
    ${st(K.stateSt[sel.state], "")}
    <span class="av" style="background:${a.color}" title="${esc(a.name)}">${ic(a.icon)}</span>
    <div class="steps vert" aria-hidden="true">${sel.steps.map((x) => `<i class="${{ done: "done", run: "run", fail: "fail", wait: "wait", todo: "" }[x[1]]}"></i>`).join("")}</div>
    ${needs ? `<span class="rail-needs ${sel.state === "proposed" || sel.state === "paused" ? "warn" : "crit"}" title="${needs[1]}">${ic(needs[0])}</span>` : ""}
  </aside>`;
}

// ---- the Work chat box asks about current work; a new request is the secondary mode ----
let qMode = "ask", lastQA = null;
const selWork = () => D.work.find((w) => w.key === selKey && matches(w));
const qTarget = () => (selWork() ? selWork().key : FILTER ? `${FILTER.kind}: ${FILTER.name}` : qMode === "new" && TARGET ? TARGET : `${SCOPE[2]} · ${SCOPE[3]}`);
const qPlaceholder = () => (qMode === "new" ? (TARGET ? `Tell agent-cloud what to do on ${TARGET}…` : "Describe new work, e.g. “rotate the postiz signing secret”")
  : selWork() ? `Ask about ${selWork().key}: why is it ${K.stateLabel[selWork().state].toLowerCase()}, what's next…` : `Ask about the work in ${qTarget()}…`);
function qChips() {
  if (qMode === "new") return ["Rotate the postiz signing secret", "Upgrade n8n after a database backup", "Give the research team an LLM key"];
  const w = selWork();
  return [...(w ? [`Why is ${w.key} ${K.stateLabel[w.state].toLowerCase()}?`] : []), "What's blocked and what does it need?", "What failed?", "What needs my approval?", "What's running right now?"];
}
function reasonOf(w) {
  if (w.state === "blocked") return w.opa.rule;
  if (w.state === "failed") return (w.log ?? []).filter((l) => l[0] === "err").map((l) => l[1].trim()).pop() ?? "its Semaphore task failed";
  if (w.state === "paused") return w.why ?? "paused";
  if (w.state === "proposed") return w.opa.cond ?? "waiting for approval";
  const cur = w.steps.find((x) => x[1] !== "done");
  return cur ? `${cur[0]} (${K.currentRole(w)})` : "finishing";
}
const NEXT = { blocked: "Propose policy change", failed: "Ask skynet to retry", paused: "Resume", proposed: "Approve and queue" };
function answerWork(q) {
  const t = q.toLowerCase(), inScope = D.work.filter(matches), k = (q.match(/AC-\d+/i) || [])[0]?.toUpperCase();
  // a named key wins; then a category question; only then "this/it" falls back to the selected item

  if (fix) {
    const p = K.parse(fix.dataset.fix, SCOPE); D.work.unshift(p); selKey = p.key; document.querySelector(".drawer")?.remove();
    if ((location.hash || "#home") !== "#home") location.hash = "home"; else route();
    K.toast(`${p.key} proposed. It waits for your approval in Work.`, "sparkles"); return;
  }
  if (e.target.closest("[data-grafana]")) { K.toast("Opens Grafana Explore filtered to this service", "external-link"); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, w = D.work.find((x) => x.key === a.dataset.key);
  if (act === "approve" && w) { w.state = "queued"; w.steps.forEach((x) => x[1] === "wait" && (x[1] = "done")); document.querySelector(".drawer")?.remove(); route(); K.toast(`${w.key} approved. It moved to Queued.`); }
  if (act === "retry") K.toast("skynet will re-plan AC-1169 with the anti-lockout failure attached.", "rotate-ccw");
  if (act === "policy") K.proposePolicy(a.dataset.key);
  if (act === "pause" && w) { w.state = "paused"; w.why = "Paused by you after the current Semaphore task"; route(); K.toast(`${w.key} pauses after its current Semaphore task.`, "circle-pause"); }
  if (act === "resume" && w) { w.state = "running"; route(); K.toast(`${w.key} resumed.`, "play"); }
  if (act === "queue-svc") { location.hash = "home"; setTimeout(() => { const q = document.getElementById("quickText"); q.value = `On ${D.svc(a.dataset.svc).name}: `; q.focus(); }, 40); }
});
document.getElementById("tagsBtn").onclick = (e) => { const on = document.body.classList.toggle("notags"); e.currentTarget.setAttribute("aria-pressed", !on); };
document.getElementById("picksBtn").onclick = () => K.picksDrawer();
document.getElementById("themeBtn").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
// a new proposal (e.g. a policy change) opens selected in Work, details showing
window.onWorkCreated = (w) => { selKey = w.key; drillOpen = true; FILTER = null; TARGET = null; if (!matchesScope(w)) SCOPE = w.scope.slice(); location.hash = "home"; if (location.hash === "#home") route(); };
addEventListener("hashchange", route);
route();
K.initPicks("C");
</script>
