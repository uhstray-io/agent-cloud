# Proposed Dev-only Semaphore definitions. This file is an implementation
# artifact for later review; it is not loaded by setup-templates.yml.
catalog_proposals:
  - name: Backup o11y to PBS (Dev)
    playbook: platform/playbooks/backup-o11y-to-pbs.yml
    repository: agent-cloud dev
    survey_vars:
      - name: expected_repository_sha
        title: Reviewed agent-cloud Dev revision
        type: string
        required: true
      - name: site_config_base_sha
        title: Reviewed site-config integration revision
        type: string
        required: true

  - name: Verify o11y PBS Artifact (Dev)
    playbook: platform/playbooks/verify-o11y-pbs-artifact.yml
    repository: agent-cloud dev
    survey_vars:
      - name: expected_repository_sha
        title: Reviewed agent-cloud Dev revision
        type: string
        required: true
      - name: site_config_base_sha
        title: Reviewed site-config integration revision
        type: string
        required: true

  - name: Sync o11y Protected PBS Copy (Dev)
    playbook: platform/playbooks/sync-o11y-protected-pbs-copy.yml
    repository: agent-cloud dev
    survey_vars:
      - name: expected_repository_sha
        title: Reviewed agent-cloud Dev revision
        type: string
        required: true
      - name: site_config_base_sha
        title: Reviewed site-config integration revision
        type: string
        required: true

  - name: Verify o11y Protected PBS Copy Readiness (Dev)
    playbook: platform/playbooks/verify-o11y-protected-pbs-copy.yml
    repository: agent-cloud dev
    survey_vars:
      - name: expected_repository_sha
        title: Reviewed agent-cloud Dev revision
        type: string
        required: true
      - name: site_config_base_sha
        title: Reviewed site-config integration revision
        type: string
        required: true
