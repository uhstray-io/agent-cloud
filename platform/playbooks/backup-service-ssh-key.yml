---
# backup-service-ssh-key.yml — OPERATOR-SIDE. Copy an SSH keypair out of OpenBao
# into the private site-config clone, in that repo's existing convention
# (secrets/ssh/<name>/id_ed25519 + .pub).
#
# WHY THIS EXISTS
#
# generate-service-ssh-key.yml mints a keypair INTO OpenBao and never emits it;
# distribute-ssh-keys.yml authorizes the public halves of the management key and
# the per-service key on the host. Nothing copies either pair back out. So an
# operator holds no key of their own, and cannot complete the workstation half of
# the two-path access proof that must pass before harden-ssh.yml withdraws
# password authentication (PRINCIPLES.md §5).
#
# The service-onboarding checklist already calls that backup a step. Until now it
# was a step with no mechanism — a manual action recorded in prose, which is
# exactly the failure this repo's engineering principles name: "no manual one-off
# steps — encode them". A host was hardened-ready with no operator key in
# existence and nothing in the repo able to say so.
#
# OPERATOR-SIDE, deliberately NOT a Semaphore template. A Semaphore job runs on
# the orchestrator and cannot write to the operator's site-config clone; a job
# that could would be exfiltrating private keys into its own logs and workspace.
# Same category as platform/semaphore/bootstrap-semaphore-repositories.yml.
#
# READ-ONLY against OpenBao. This playbook never writes, rotates, or deletes a
# secret. Losing a live key is unrecoverable, so the only direction it moves data
# is out.
#
# Auth, in precedence order:
#   BAO_TOKEN                      an operator token (e.g. from an OIDC login)
#   BAO_ROLE_ID / BAO_SECRET_ID    an AppRole, as the Semaphore-run playbooks use
#
# Usage:
#   OPENBAO_ADDR=http://<bao>:8200 BAO_TOKEN=<token> \
#     ansible-playbook platform/playbooks/backup-service-ssh-key.yml \
#       -e service_name=postiz -e site_config_dir=/path/to/site-config
#
#   # the SHARED MANAGEMENT key, which lives one level up in OpenBao:
#   ... -e service_name=management -e bao_ssh_path=secret/data/services/ssh
#
# The written files land inside a git repository. Committing them is the
# operator's call and the operator's action — this playbook does not touch git.

- name: "Back up a service SSH keypair from OpenBao into site-config"
  hosts: localhost
  gather_facts: false
  become: false
  connection: local
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_token: "{{ bao_token | default(lookup('env', 'BAO_TOKEN'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true) | default('', true) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true) | default('', true) }}"
    # KV-v2 read path. Defaulted per service, overridable for the management key,
    # which sits at secret/services/ssh rather than under a service name.
    _bao_ssh_path: "{{ bao_ssh_path | default('secret/data/services/ssh/' ~ service_name, true) }}"
    _dest_dir: "{{ dest_dir | default(site_config_dir ~ '/secrets/ssh/' ~ service_name, true) }}"
    _force: "{{ force_overwrite | default(false) | bool }}"

  tasks:
    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - service_name is defined
          - service_name | length > 0
          - service_name is match('^[a-z0-9][a-z0-9_-]*$')
          - site_config_dir is defined or dest_dir is defined
          - _bao_url | length > 0
        fail_msg: >-
          Pass -e service_name=<name> and -e site_config_dir=<path> (or an explicit
          -e dest_dir=<path>), and set openbao_addr or OPENBAO_ADDR. service_name is
          used to build a filesystem path, so it is restricted to lowercase, digits,
          dash and underscore.

    - name: "Refuse a cleartext secret-store endpoint"
      # The token and the private key both cross this connection. Same shared
      # guard every other play that reaches OpenBao includes — one definition of
      # the rule, never a re-worded copy.
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Require one usable credential"
      ansible.builtin.assert:
        that:
          - (_bao_token | length > 0) or (_bao_role_id | length > 0 and _bao_secret_id | length > 0)
        fail_msg: >-
          No OpenBao credential. Set BAO_TOKEN, or BAO_ROLE_ID and BAO_SECRET_ID.

    - name: "Exchange the AppRole for a token"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      when: _bao_token | length == 0
      no_log: true

    - name: "Settle on the token to use"
      ansible.builtin.set_fact:
        _token: "{{ _bao_token if (_bao_token | length > 0) else _bao_auth.json.auth.client_token }}"
      no_log: true

    - name: "Read the keypair"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/{{ _bao_ssh_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _token }}"
        status_code: [200, 403, 404]
      register: _secret
      no_log: true

    - name: "Report what the store answered (never the material)"
      # Deliberately NOT no_log'd. A credential task that hides its own failure is
      # how a run becomes undiagnosable; the status code and the field NAMES carry
      # no secret. Only values do.
      ansible.builtin.debug:
        msg: >-
          {{ _bao_ssh_path }} -> HTTP {{ _secret.status }},
          fields: {{ (_secret.json.data.data | default({}) | dict2items | map(attribute='key') | sort)
                     if _secret.status == 200 else '(none)' }}

    - name: "Fail with the reason, not a template error"
      ansible.builtin.assert:
        that:
          - _secret.status == 200
          - (_secret.json.data.data.private_key | default('')) | length > 0
          - (_secret.json.data.data.public_key | default('')) | length > 0
        fail_msg: >-
          {{ 'Denied (403) — this credential cannot read ' ~ _bao_ssh_path
             if _secret.status == 403
             else ('Not found (404) at ' ~ _bao_ssh_path ~ ' — generate it first with generate-service-ssh-key.yml'
                   if _secret.status == 404
                   else 'Read ' ~ _bao_ssh_path ~ ' but it carries no public_key/private_key pair') }}

    - name: "Write the pair into site-config"
      # The shared task, not a second copy of it — the generator writes through the
      # same file, so "how a keypair lands on disk" has exactly one definition.
      ansible.builtin.include_tasks: tasks/backup-ssh-key-to-site-config.yml
      vars:
        _bk_private_key: "{{ _secret.json.data.data.private_key }}"
        _bk_public_key: "{{ _secret.json.data.data.public_key }}"
        _bk_dest_dir: "{{ _dest_dir }}"
        _bk_force: "{{ _force }}"

    - name: "Report the source"
      ansible.builtin.debug:
        msg: "source ....... {{ _bao_ssh_path }}"
