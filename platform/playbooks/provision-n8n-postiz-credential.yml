---
# provision-n8n-postiz-credential.yml — create (or heal) the ONE postizApi
# credential inside n8n, as code, from shared custody. The substrate n8n
# workflows authenticate to Postiz with — never a UI paste.
#
# API SURFACE (verified against the n8n public-API spec at tag n8n@2.25.7,
# packages/cli/src/public-api/v1/handlers/credentials/spec/paths/):
#   GET    /api/v1/credentials             list (owner/admin; data NOT included)
#   POST   /api/v1/credentials             create {name, type, data}
#   PATCH  /api/v1/credentials/{id}        update in place (fields optional)
#   POST   /api/v1/credentials/{id}/test   test with STORED data ->
#                                          200 {status: OK|Error, message}
#   auth: X-N8N-API-KEY header (openapi.yml securitySchemes)
#
# CREDENTIAL SHAPE (verified from the pinned npm tarball n8n-nodes-postiz@0.2.17,
# dist/credentials/PostizApi.credentials.js — the repo tip is NOT the authority,
# the tarball we reconcile into the containers is):
#   type 'postizApi', data {apiKey, host}; its connection test calls
#   {host}/public/v1/is-connected, so the self-hosted host is the public
#   TLS-terminated route WITH the /api path (https://postiz.uhstray.io/api).
#
# CUSTODY (per the Postiz automation contract,
# platform/services/postiz/context/use-cases.md):
#   - postiz_api_key is SHARED-READ from secret/services/postiz — never copied
#     under secret/services/n8n; the value exists in exactly one secret path.
#   - n8n_api_key comes from secret/services/n8n (Store n8n API Key mints it).
#
# IDEMPOTENT, self-healing on rotation: list-then-upsert keyed on a fixed
# credential name. Present + stored data passes is-connected -> no change.
# Present + test fails -> PATCH the current shared-read values in, re-test
# (covers a rotated Postiz key). Absent -> create. A failing re-test after a
# PATCH is REPORTED, not fatal — a down Postiz must not wedge provisioning
# (the local-dev degraded case in the change's design).
#
# Every step that carries the n8n API key (header) or the Postiz key (body) is
# no_log; the report holds names, counts and test status only.
#
# Usage (via Semaphore): no survey vars; run against the n8n_svc group.

- name: "Pre-flight: target group is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: n8n_svc
    preflight_group_expected: n8n_svc

- name: "Provision the Postiz credential in n8n"
  hosts: n8n_svc
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _n8n_base: "{{ n8n_base_url | default('http://workflow-n8n:5678') }}"
    # Fixed name and type — one credential, owned by this playbook. Not
    # caller-supplied: a free name would strand previously provisioned copies.
    _cred_name: "Postiz (agent-cloud)"
    _cred_type: "postizApi"
    # The node's is-connected test hits {host}/public/v1/is-connected, so the
    # host carries the /api path of the public TLS route. Local-dev overrides
    # via inventory (n8n_postiz_credential_host on the n8n host).
    _postiz_host: "{{ n8n_postiz_credential_host | default('https://postiz.uhstray.io/api') }}"

  tasks:
    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - _bao_url | length > 0
        fail_msg: "Set openbao_addr (inventory) — both keys live in OpenBao, nowhere else."

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Refuse a cleartext n8n endpoint"
      # The n8n API key (header) and the Postiz key (create/update body) cross it.
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _n8n_base }}"
        _assert_url_label: "n8n"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      delegate_to: localhost
      no_log: true

    - name: "Read the n8n API key (its own path)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/n8n"
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
      register: _n8n_secret
      delegate_to: localhost
      no_log: true

    - name: "Require the n8n API key to exist"
      ansible.builtin.assert:
        that:
          - (_n8n_secret.json.data.data.n8n_api_key | default('')) | length > 0
        fail_msg: >-
          secret/services/n8n holds no n8n_api_key — run Store n8n API Key
          first; it mints and captures the key this playbook authenticates with.

    - name: "Shared-read the Postiz API key (postiz's path — never copied elsewhere)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/postiz"
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
      register: _postiz_secret
      delegate_to: localhost
      no_log: true

    - name: "Require the Postiz API key to exist"
      ansible.builtin.assert:
        that:
          - (_postiz_secret.json.data.data.postiz_api_key | default('')) | length > 0
        fail_msg: >-
          secret/services/postiz holds no postiz_api_key — run Store Postiz API
          Key first (it captures the app-minted key after the first sign-in).

    - name: "List n8n's credentials (data is never included by this endpoint)"
      # ponytail: one page of 100 — this instance holds a handful of credentials;
      # add cursor-following if an instance ever legitimately exceeds it (the
      # assert below turns that into a named failure, not a silent duplicate).
      ansible.builtin.uri:
        url: "{{ _n8n_base }}/api/v1/credentials?limit=100"
        headers:
          X-N8N-API-KEY: "{{ _n8n_secret.json.data.data.n8n_api_key }}"
      register: _list
      no_log: true

    - name: "Find ours by fixed name + type"
      ansible.builtin.set_fact:
        _matches: >-
          {{ _list.json.data | default([])
             | selectattr('name', 'equalto', _cred_name)
             | selectattr('type', 'equalto', _cred_type) | list }}
        _list_truncated: "{{ (_list.json.nextCursor | default(none)) is not none }}"
      no_log: true

    - name: "Refuse ambiguity"
      ansible.builtin.assert:
        that:
          - _matches | length <= 1
          - not (_matches | length == 0 and _list_truncated | bool)
        fail_msg: >-
          Either {{ _matches | length }} credentials are named
          '{{ _cred_name }}' (remove the extras in n8n and re-run), or the
          instance holds >100 credentials and ours was not on the first page —
          this playbook needs cursor-following before it can act safely there.

    - name: "Create the credential (absent)"
      ansible.builtin.uri:
        url: "{{ _n8n_base }}/api/v1/credentials"
        method: POST
        headers:
          X-N8N-API-KEY: "{{ _n8n_secret.json.data.data.n8n_api_key }}"
        body_format: json
        body:
          name: "{{ _cred_name }}"
          type: "{{ _cred_type }}"
          data:
            apiKey: "{{ _postiz_secret.json.data.data.postiz_api_key }}"
            host: "{{ _postiz_host }}"
        status_code: [200]
      register: _create
      when: _matches | length == 0
      changed_when: true
      no_log: true

    - name: "Record which credential we hold"
      ansible.builtin.set_fact:
        _cred_id: "{{ (_create.json.id | default('')) if _matches | length == 0 else _matches[0].id }}"
        _outcome: "{{ 'created' if _matches | length == 0 else 'exists' }}"

    - name: "Test the stored credential (is-connected against the Postiz host)"
      # Tests with the data n8n has STORED — exactly what a workflow would use.
      ansible.builtin.uri:
        url: "{{ _n8n_base }}/api/v1/credentials/{{ _cred_id }}/test"
        method: POST
        headers:
          X-N8N-API-KEY: "{{ _n8n_secret.json.data.data.n8n_api_key }}"
        status_code: [200]
      register: _test
      no_log: true

    - name: "Heal a pre-existing credential whose stored data no longer works"
      # A rotated Postiz key is the usual cause: PATCH the current shared-read
      # values in place (id, name, sharing all preserved), then re-test.
      when: _outcome == 'exists' and (_test.json.status | default('Error')) != 'OK'
      block:
        - name: "Update the credential in place with the current shared-read values"
          ansible.builtin.uri:
            url: "{{ _n8n_base }}/api/v1/credentials/{{ _cred_id }}"
            method: PATCH
            headers:
              X-N8N-API-KEY: "{{ _n8n_secret.json.data.data.n8n_api_key }}"
            body_format: json
            body:
              data:
                apiKey: "{{ _postiz_secret.json.data.data.postiz_api_key }}"
                host: "{{ _postiz_host }}"
            status_code: [200]
          changed_when: true
          no_log: true

        - name: "Re-test after the update"
          ansible.builtin.uri:
            url: "{{ _n8n_base }}/api/v1/credentials/{{ _cred_id }}/test"
            method: POST
            headers:
              X-N8N-API-KEY: "{{ _n8n_secret.json.data.data.n8n_api_key }}"
            status_code: [200]
          register: _test
          no_log: true

        - name: "Record the heal"
          ansible.builtin.set_fact:
            _outcome: "updated"

    - name: "Report (names, outcome and test status — never a value)"
      # A test status other than OK is DEGRADED, not fatal: the credential holds
      # the right host and key, and a down Postiz must not wedge provisioning.
      ansible.builtin.debug:
        msg: >-
          '{{ _cred_name }}' ({{ _cred_type }}) {{ _outcome }} in n8n,
          host {{ _postiz_host }}, is-connected:
          {{ _test.json.status | default('unknown') }}{{ '' if
          (_test.json.status | default('')) == 'OK' else
          ' — DEGRADED: Postiz unreachable or key rejected; the credential is in
          place, re-run the test when Postiz answers' }}.
          Workflow authors inherit the Postiz contract: at most 90 posts/hour
          may be CREATED through this credential (the app enforces its ceiling;
          budget beneath it).

    - name: "Fail only when a fresh create cannot connect AND Postiz was expected up"
      # Greenfield local-dev may run before local Postiz exists — that is the
      # designed degraded path, opted into via -e allow_degraded_test=true.
      ansible.builtin.assert:
        that:
          - (_test.json.status | default('Error')) == 'OK'
            or (allow_degraded_test | default(false) | bool)
        fail_msg: >-
          is-connected did not pass for '{{ _cred_name }}'. If Postiz is known
          to be down (local-dev without a Postiz instance), re-run with
          -e allow_degraded_test=true; otherwise check the Postiz host
          ({{ _postiz_host }}) and the shared key, then re-run.
