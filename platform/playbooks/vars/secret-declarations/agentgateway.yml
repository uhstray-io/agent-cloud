---
# The agentgateway deploy's secret declaration, in its own file so every reader evaluates the SAME
# declaration against its own host: deploy-agentgateway.yml loads it with vars_files, check-secrets.yml
# with include_vars. It is computed (Jinja over inventory), and a computed value read out of a
# playbook as text is only a string, which hid the required `existing` key from the secrets
# step (PR 203 Codex review). test_check_secrets_verdict.py refuses a computed declaration left in a
# playbook's own vars.

# The upstream key is `existing`: surfaced to the templates, never invented.
# Client keys are `random`: generated ONCE per identity and reused on every
# later run, which is exactly "mint if absent, keep if present" (task 4.1);
# rotation is a deliberate separate run, never implicit in a deploy.
# Identities: one personal identity per declared platform admin (`_platform_admins`, the list the
# Authentik admin entries are rendered from: vars/platform-admins.yml, loaded by
# tasks/load-platform-admins.yml), merged with the service identities in `agw_clients` into `agw_identities`.
# It is computed HERE, once, and every reader takes it from here: the declaration below,
# deploy-agentgateway.yml's name checks and render check, the key loop in config.yaml.j2 and
# manage-agentgateway-client-key.yml. An identity's name is the entry's `agw_identity` when set,
# else its `username`; an identity already in `agw_clients` keeps its place, and a name in both is
# merged once (the same `client_<name>` field, so nothing is minted twice).
#
# GATED by `agw_admin_identities_enabled` (default false): the list is non-empty by default, so a
# gateway deploy would otherwise mint a key for every admin before the operator rollout. Off,
# `agw_identities` equals `agw_clients` exactly and the render is what it was before. On, every
# list entry gets an identity (service accounts included) and a bad name is refused. With the
# shared file absent, an inventory `platform_admins` is what the file would have resolved to.
# With the gate on, `platform_admins` MUST be declared for the gateway host: the shared file's own
# default is built from per-user vars that exist only on the Authentik host, so on the gateway it
# would derive placeholder usernames. Undeclared, nothing is derived here and the loader
# (tasks/load-platform-admins.yml, included by every play that reads this) refuses the run.
# Native LISTS built in statement blocks, as below.
_agw_admins: >-
  {{ (_platform_admins | default(platform_admins))
     if ((agw_admin_identities_enabled | default(false) | bool) and platform_admins is defined) else [] }}
_agw_admin_identities: >-
  {%- set out = [] -%}
  {%- for a in _agw_admins -%}
    {%- if out.append({'key': (a['key'] | default('', true)) | string,
                       'name': (a['agw_identity'] | default(a['username'] | default('', true), true)) | string}) -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}
agw_identities: >-
  {%- set out = [] -%}
  {%- for c in agw_clients | default([]) -%}
    {%- if out.append(c) -%}{%- endif -%}
  {%- endfor -%}
  {%- for a in _agw_admin_identities -%}
    {%- if a['name'] not in out and out.append(a['name']) -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}
# Derived names that are also service identities: merged once, reported by name (never refused).
_agw_identity_overlap: >-
  {%- set out = [] -%}
  {%- for a in _agw_admin_identities -%}
    {%- if a['name'] in (agw_clients | default([])) and out.append(a['name']) -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}
# What is wrong with the derived names, one sentence per offending entry (the entry's `key`, else
# its position), empty when nothing is. The playbooks refuse a non-empty list before any restart or
# store write. A reserved name is refused for a derived identity only: `legacy-shared` is rendered
# from the shared vLLM key and `mcp-self` is the gateway's own MCP self-call identity.
_agw_identity_problems: >-
  {%- set out = [] -%}
  {%- for a in _agw_admin_identities -%}
    {%- set who = ('platform_admins entry ' ~ a['key']) if a['key'] else ('platform_admins entry #' ~ loop.index) -%}
    {%- if (_agw_admin_identities | selectattr('name', 'equalto', a['name']) | list | length) > 1
           and out.append(who ~ ': the gateway identity "' ~ a['name'] ~ '" is declared more than once') -%}{%- endif -%}
    {%- if a['name'] in ['legacy-shared', 'mcp-self']
           and out.append(who ~ ': the gateway identity "' ~ a['name']
                          ~ '" is reserved for an internal identity; set agw_identity') -%}{%- endif -%}
    {%- if not (a['name'] is match('^[a-z0-9][a-z0-9-]*$'))
           and out.append(who ~ ': the gateway identity "' ~ a['name']
                          ~ '" is outside ^[a-z0-9][a-z0-9-]*$; set agw_identity to a name that matches') -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}
# A native LIST, built in a statement block whose only output is the list itself (no
# community.general, which is not a declared dependency). Text-built JSON broke on ansible-core
# 2.19+ (PR 213; MISTAKES 10.16).
_client_defs: >-
  {%- set out = [] -%}
  {%- for c in agw_identities -%}
    {%- if out.append({'name': 'client_' ~ c, 'type': 'random', 'length': 48}) -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}
# legacy_shared_key_sha256 lives at this path too but is deliberately NOT declared here: a declared
# `existing` field absent from the store is written back as '' by manage-secrets, which could erase
# a fingerprint an overlapping deploy recorded. tasks/agw-legacy-key-check.yml owns it (CAS write).
# agw_db_password: the gateway's own Postgres (budget usage only) — generated
# once, reused; a new value would orphan the existing data directory.
# agw_oidc_cookie_seed: random seed the env template hashes into the 64-hex
# OIDC session cookie key — stable so UI sessions survive a redeploy.
_secret_definitions: >-
  {{ [{'name': 'vllm_api_key', 'type': 'existing'},
      {'name': 'agw_db_password', 'type': 'random', 'length': 32},
      {'name': 'agw_oidc_cookie_seed', 'type': 'random', 'length': 48}] + _client_defs }}
# The upstream key must be present unless the inventory declares an upstream that takes none
# (agw_upstream_requires_key: false, LM Studio without authentication). manage-secrets enforces
# this list at deploy time and check-secrets reads it, so both agree with the deploy's own assert.
_required_existing_secrets: >-
  {{ ['vllm_api_key'] if agw_upstream_requires_key | default(true) | bool else [] }}
