---
# A weft workspace's secret declaration, in its own file so every reader evaluates the SAME
# declaration against its own host: weft-workspace.yml loads it with vars_files. It is computed
# from inventory, and a computed value left in a playbook's own vars is only a string to a reader
# of the playbook's text (test_check_secrets_verdict.py).
#
# One `existing` key per variable the workspace's weft.toml names (weft_secret_env): its model
# providers' keys and its forge token. Operator-seeded with Seed OpenBao Key and never generated —
# a generated model key is not a model key. All of them are required: weft refuses to start when a
# variable weft.toml names is unset.
_secret_definitions: >-
  {%- set out = [] -%}
  {%- for name in weft_secret_env | default([]) -%}
    {%- if out.append({'name': name, 'type': 'existing'}) -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}
_required_existing_secrets: "{{ weft_secret_env | default([]) }}"
