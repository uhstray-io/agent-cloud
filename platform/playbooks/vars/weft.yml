---
# weft.yml — the facts every weft playbook shares, in one place. Loaded with vars_files; each
# value is lazily templated, so nothing is read until a task uses it. Inventory (site-config)
# overrides any of them by setting the un-prefixed name.
#
# None of these is secret or site-private: the repository, its registry and the workflow that
# signs its images are public facts about weft. The environment's domain, addresses, ids and each
# host's release pin are site-config's (see platform/services/weft-workspace/deployment/README.md).

# Where weft's code and images live.
_weft_repo: "{{ weft_github_repository | default('uhstray-io/weft') }}"
_weft_registry: "{{ weft_registry | default('ghcr.io/uhstray-io') }}"

# THE identity a weft image must be signed by: weft's images.yml, on main. A release promotes the
# digests main built and signs its release.json with this same identity, so one identity covers
# both; an image built from a branch carries that branch's identity and is refused.
_weft_signer: "{{ weft_signer_identity | default('https://github.com/' ~ _weft_repo ~ '/.github/workflows/images.yml@refs/heads/main') }}"
_weft_issuer: "https://token.actions.githubusercontent.com"

# release.json is an OCI artifact beside the images (weft-release:<commit> for every commit main
# published, weft-release:<version> for a release), fetched with oras and verified with cosign.
_weft_oras_image: "{{ weft_oras_image | default('ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179') }}"

# A rack host's pin, `weft_release` in site-config: the version a person chose and the digest of
# that version's signed release.json artifact. The digest is what is verified and fetched; the
# version is checked against the release.json it fetches. A tag alone, a branch or a short commit
# is refused (tasks/weft-release.yml). Staging takes a full commit as well, launched by a person
# through "Deploy weft Staging" (deploy-weft-staging.yml).
_weft_pin_pattern: '^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})@sha256:[0-9a-f]{64}$'
_weft_commit_pattern: '^[0-9a-f]{40}$'

# The images each role runs. A workspace also pulls every agent image its orchestrator starts, so
# a session is never the first thing to find one missing.
_weft_images_by_role:
  workspace: [weft-workspace, weft-builder, weft-proxy, weft-harness-claude-code, weft-harness-opencode]
  door: [weft-door]

# Each role's deployment directory in the monorepo: one service directory per kind of host.
_weft_service_dir_by_role:
  workspace: platform/services/weft-workspace/deployment
  door: platform/services/weft-door/deployment

# Local-dev mode, read from the inventory's identity rather than a variable (plan 24,
# 24-local-mode-from-inventory.md): every host but the controller named <name>-local.
_weft_local: "{{ groups['all'] | local_dev_inventory }}"

# Directories on the VM's own disk (D537: the catalog opens only where one kernel mounts it).
_weft_root: "{{ weft_root | default('/srv/weft') }}"
_weft_door_dir: "{{ weft_door_dir | default('/srv/weft-door') }}"

# A workspace's weft.toml names the agent images, the orchestrator's command and the checkout and
# clone paths the orchestrator runs through the podman socket, so it decides what runs. It lives
# where NO container can write it:
#   - no container mounts the directory: the workspace directory is mounted read-write into the
#     board, which faces the internet;
#   - root owns it (0755, the file 0644, written with become): the orchestrator holds the deploy
#     user's podman socket, so anything the deploy user can write, it can too. Nothing in it is a
#     credential (weft D539), so the containers may read it.
# weft.toml is bind-mounted, read-only, into the containers that read it.
# tasks/weft-release.yml, which every deploy and rollback reaches first, refuses a state directory
# that is a mounted directory or inside one.
_weft_state_root: "{{ weft_state_root | default('/srv/weft-state') }}"
_weft_workspace_state_dir: "{{ _weft_state_root }}/workspaces/{{ weft_workspace_id | default('') }}"
_weft_door_state_dir: "{{ _weft_state_root }}/door"
_weft_workspace_config: "{{ _weft_workspace_state_dir }}/weft.toml"
# Who owns it. Internal: a launch cannot set an underscore name (refuse-internal-extra-vars.yml).
_weft_state_owner: root
_weft_state_group: root

# The directory a role's containers mount and its database lives in. Read only where _weft_role
# is set.
_weft_data_dir: "{{ _weft_workspace_dir if _weft_role == 'workspace' else _weft_door_dir }}"

# The OpenBao subtree for this environment: weft (the rack) or weft-staging. It holds what each
# environment keeps apart, the front door's signing key and each workspace's seal.
_weft_secrets: "{{ weft_secret_root | default('weft') }}"

# How long a deploy waits for health, and how long it watches afterwards before calling it done
# (docs/cicd.md §6.1: 5 and 15 minutes). A failure in either fails the run and leaves the host as
# it is; going back is a person's (rollback-weft-host.yml).
_weft_health_minutes: "{{ weft_health_minutes | default(5) }}"
_weft_watch_minutes: "{{ weft_watch_minutes | default(15) }}"

# The longest one deploy or rollback holds its host's lock (tasks/weft-lock.yml): the health window,
# the watch and the backup with room to spare. A run killed without releasing frees the host after
# this long at most.
_weft_lock_minutes: "{{ weft_lock_minutes | default(60) }}"
