# copied-secret-fields.yml — the OpenBao KV-v2 fields whose live value is copied to another path, as code.
#
# copy-openbao-fields.yml reads each declared source field and writes its value to the target field,
# inside the store. The value is read and written by the playbook's own Ansible process, in memory: it
# is never printed, never written to a file, and never carried through a workstation. A copy is made by
# the Semaphore template "Copy OpenBao Fields". The change that moves a secret to its new owner lists
# the copy here.
#
# The copy never removes the source. Removing a source field is the separate retirement in
# retired-secret-fields.yml ("Retire OpenBao Fields"), which a change lists once the copy has landed and
# nothing reads the source any more.
#
# Fields:
#   from_path / from_field   the source: the KV-v2 path under secret/, as services/<svc>, and the field name
#   to_path / to_field       the target, the same shape
#   copied   the date the copy was declared (the day its entry was added), YYYY-MM-DD, quoted so YAML keeps it
#            a string. It records when the copy was declared, not when the playbook last ran it
#   reason   one line
#
# Entries are kept after a copy: the list is the record of which copies were declared, and when. Each run reads the
# live state and plans every entry as one of four states (see the playbook): source-missing, copied,
# pending, conflict. A target that already holds the source value is copied, a no-op, so a re-run
# converges. A conflict is never overwritten.

copied_secret_fields:
  - from_path: services/nemoclaw
    from_field: gemini_api_key
    to_path: services/honcho
    to_field: gemini_api_key
    copied: "2026-11-11"
    reason: "NemoClaw retired (agent-cloud #1043); honcho owns its Gemini key"
