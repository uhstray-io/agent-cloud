---
# step-ca-issuers.yml — the issuing provisioners, one per leaf profile
# (production-internal-ca design decisions 4 and 5).
#
# Read by deploy-step-ca.yml's Phase 2.5, which creates each provisioner and fixes its
# extended key usage with an x509 template, and by Phase 3, which refuses a running CA
# whose issuers lack those templates. Each `secret` must also be declared in Phase 1's
# _secret_definitions (platform/tests/test_step_ca_deploy.py holds the two together).
_issuers:
  - { name: issuer-server, secret: issuer_server_password, eku: serverAuth }
  - { name: issuer-client, secret: issuer_client_password, eku: clientAuth }
