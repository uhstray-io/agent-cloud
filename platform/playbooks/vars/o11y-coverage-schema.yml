# Public declaration contract. Concrete hostnames, endpoints, and network paths
# are supplied by site-config through estate_coverage_inventory.
o11y_coverage_schema:
  version: 1
  required_target_fields:
    - target_id
    - template_references
    - target_type
    - lifecycle
    - owner
    - runtime
    - service_identity
    - environment
    - signals
    - collection_method
    - budget
    - receipt_reference
  target_types:
    - service
    - agent
    - vm
    - guest
    - runner
    - network
    - dgx
  lifecycle_states:
    - deployed
    - planned
    - retired
    - excluded
  signal_names:
    - logs
    - metrics
    - traces
    - health
    - profiles
  deployed_target_signal_declarations:
    - logs
    - metrics
    - health
    - traces
  signal_fields:
    - applicable
    - selector
    - exception
    - collection_method
    - receipt_reference
    - freshness_seconds
  profile_signal_fields:
    profile_type_id: process_cpu:cpu:nanoseconds:cpu:nanoseconds
    selector_format: '{target_id="<declared target_id>"}'
    note: Optional declaration; omission preserves existing four-signal coverage requirements.
  exception_fields:
    - reason
    - reference
    - alternative_or_manual_plan_for_excluded_traces
  private_fields_site_config_only:
    - inventory_host
    - endpoint
    - network_path
  availability_health_private_fields:
    - endpoint
    - expected_status_codes
    - tls_server_name
    - trust
  availability_health_method: alloy-blackbox-http
  availability_health_selector_format: 'probe_success{job="o11y-availability",target_id="<target_id>",environment="<environment>",cluster="<o11y_cluster>"}'
  availability_trust_values:
    - system
    - internal-ca
  availability_health_budget_fields:
    - interval_seconds
    - scrape_timeout_seconds
    - probe_timeout_seconds
    - body_size_limit_bytes
    - samples_per_scrape
  availability_source_safety_ceilings:
    max_targets: 64
    max_interval_seconds: 3600
    max_probe_timeout_seconds: 10
    max_scrape_timeout_seconds: 30
    max_body_size_limit_bytes: 65536
    max_samples_per_scrape: 256
    max_total_probe_timeout_seconds: 120
    max_series: 384

# site-config supplies this object as an inventory group variable. A declared
# receipt_reference is an intended audit link, not proof that the referenced
# task verified this target/signal. The strict verifier can observe an exact
# signal, but its current Semaphore task ID is unavailable during that run.
# Coverage Census ignores nested self-reported receipts. A later Dev-bound census
# can independently read back successful tasks and bind their IDs to declarations.
#
# estate_coverage_inventory:
#   # Private inventory variables required only when receipt_bindings is nonempty:
#   # estate_coverage_semaphore_project_id: <positive Semaphore project ID>
#   # estate_coverage_semaphore_repository_id: <positive Semaphore repository ID>
#   revision: <lowercase SHA-256 of canonical JSON for {"targets": targets}>
#     Canonical JSON uses sorted object keys, compact separators, and ASCII escaping.
#     Target array order is significant; the revision field is excluded.
#   targets:
#     - target_id: service:example
#       target_type: service
#       lifecycle: deployed
#       owner: platform-team
#       runtime: podman
#       service_identity: example
#       environment: production
#       inventory_host: <private inventory hostname>
#       collection_method: alloy
#       budget: {samples_per_scrape: 1000}
#       receipt_reference: {logs: semaphore/task/123}
#       signals:
#         logs:
#           applicable: true
#           selector: '{target_id="service:example"}'
#           collection_method: alloy
#           receipt_reference: semaphore/task/123
#           freshness_seconds: 3600
#
# Optional private availability health method (all values stay in site-config):
#   signals.health.collection_method: alloy-blackbox-http
#   signals.health.selector: 'probe_success{job="o11y-availability",target_id="service:example",environment="production",cluster="<existing cluster>"}'
#   signals.health.endpoint: https://<RFC1918 IPv4>/healthz
#   signals.health.expected_status_codes: [200]
#   signals.health.tls_server_name: health.<private-domain> # HTTPS only
#   signals.health.trust: system # or internal-ca; HTTPS only
#   budget.health: {interval_seconds: <reviewed>, scrape_timeout_seconds: <reviewed>, probe_timeout_seconds: <reviewed>, body_size_limit_bytes: <reviewed>, samples_per_scrape: <reviewed>}
#         profiles: # optional fifth signal; declarations use the pinned CPU profile type
#           applicable: true
#           selector: '{target_id="service:example"}'
#           profile_type_id: process_cpu:cpu:nanoseconds:cpu:nanoseconds
#           collection_method: alloy
#           receipt_reference: semaphore/task/124
#           freshness_seconds: 3600
