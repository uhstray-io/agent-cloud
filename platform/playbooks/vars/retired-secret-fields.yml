# retired-secret-fields.yml — the OpenBao KV-v2 fields that no live code reads or writes any more.
#
# retire-openbao-fields.yml removes each declared field from its path with a merge-patch null, the
# write the revoke path of manage-agentgateway-client-key.yml uses, so every sibling field keeps its
# value. A field listed here is removed by the Semaphore template "Retire OpenBao Fields"; the change
# that retires a field lists it here, and the change that deletes its last declaration (a deploy's
# `_secret_definitions`, a secret-declarations file) removes that declaration in the same PR.
#
# The playbook refuses, before it reaches OpenBao, any (path, field) pair that a file in the path's
# own scope still declares: vars/secret-declarations/<svc>.yml and deploy-<svc>.yml, for path
# services/<svc>. A deploy that still declares a field would regenerate it on its next run, which
# would undo the removal. A bare field name is never matched across the repository.
#
# Fields:
#   path     the KV-v2 path under secret/, as services/<svc>
#   fields   the field names that were stored under it, retired
#   retired  the date the field was retired, YYYY-MM-DD, quoted so YAML keeps it a string
#   reason   one line
#
# Entries are kept after a removal. A field the store no longer holds is a no-op, so a re-run
# converges, and the list is the record of what was retired and when. The store's live state is not
# read here: the playbook reports which of these fields each path still holds.

retired_secret_fields:
  - path: services/tududi
    fields: [tududi_session_secret, tududi_admin_password, api_token]
    retired: "2026-11-09"
    reason: "tududi retired; Plane replaces it (plan 16)"
  - path: services/authentik
    fields: [tududi_oidc_client_secret]
    retired: "2026-11-09"
    reason: "tududi retired; its OIDC client goes with it (plan 16)"
  - path: services/github
    fields: [tududi_sync_app_key, tududi_sync_app_client_id]
    retired: "2026-11-09"
    reason: "tududi GitHub sync retired in b262d9ba (2026-11-07); its GitHub App is no longer read"
  # The platforms below were removed from the repository on 2026-11-10. Each field is the one the
  # removed deploy declared (_secret_definitions, _shared_reads), the one its removed script wrote
  # (seed_if_absent, store_token_in_openbao) or the one its removed command read (store-n8n-api-key).
  - path: services/n8n
    fields: [db_admin_password, db_user_password, encryption_key, owner_password, owner_totp_secret, n8n_api_key, api_key, url]
    retired: "2026-11-10"
    reason: "n8n retired; its stack, stateful keys and API key go with it"
  - path: services/nocodb
    fields: [api_token, url]
    retired: "2026-11-10"
    reason: "NocoDB retired; no deploy reads or writes these"
  - path: services/uhhcraft
    fields:
      [postgres_password, redis_password, minio_root_user, minio_root_password, session_secret,
       stripe_secret_key, stripe_publishable_key, stripe_webhook_secret, resend_api_key,
       discord_orders_webhook_url, discord_ops_webhook_url, usps_client_id, usps_client_secret,
       printify_api_key, printify_shop_id, hubs_api_key, url]
    retired: "2026-11-10"
    reason: "UhhCraft retired; its storefront and their secrets go with it"
  - path: services/inference-comfyui
    fields: [minio_root_user, minio_root_password, url]
    retired: "2026-11-10"
    reason: "ComfyUI sidecar retired with UhhCraft; no deploy reads or writes these"
  - path: services/inference-hunyuan3d
    fields: [minio_root_user, minio_root_password, url]
    retired: "2026-11-10"
    reason: "Hunyuan3D sidecar retired with UhhCraft; no deploy reads or writes these"
  - path: services/wisbot
    fields: [discord_token]
    retired: "2026-11-10"
    reason: "WisBot retired; no deploy reads or writes its Discord token"
  - path: services/nemoclaw
    fields: [gemini_api_key]
    retired: "2026-11-10"
    reason: "NemoClaw retired; honcho owns its Gemini key at services/honcho:gemini_api_key. Seed that field and run Deploy honcho before this removal"
