---
# deploy-dns.yml — hickory-dns deploy (composable pattern).
#
# Phase 1: Place repo (clone in prod / workspace copy in local) + render
#          named.toml + zone files + .env from inventory vars. NO secrets in
#          Phase 1 — DNS has no runtime credentials; TSIG for RFC 2136 dynamic
#          updates arrives in prod Phase 2.
# Phase 2: Run deploy.sh — container lifecycle (compose up, wait healthy).
# Phase 3: Verify resolution with dig (wildcard answer + a forwarded name).
#
# Source of truth: plan/development/DNS-SERVER-DEPLOYMENT.md
# (local half: plan/development/LOCAL-DEV-DEPLOYMENT.md §5.1).

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# A play over no hosts exits 0 and records a deploy that did nothing as a success
# (docs/MISTAKES.md 2.21), so refuse an absent or empty group first.
- name: "Pre-flight: dns_svc is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: dns_svc
    # Paired so one `-e preflight_group=` cannot redirect the guard (MISTAKES 2.21).
    preflight_group_expected: dns_svc

# ── Phase 1: Place repo + render config ─────────────────────────────────────
- name: "Phase 1: Place repo + render DNS config"
  hosts: dns_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _templates: "{{ playbook_dir }}/../services/dns/deployment/templates"

  tasks:
    # Place the repo (prod clone / local working-tree copy) + ensure the
    # podman/compose entrypoint. Shared with every composable service deploy.
    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Ensure config + zones directories"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config/zones"
        state: directory
        mode: "0755"

    - name: "Render named.toml"
      ansible.builtin.template:
        src: "{{ _templates }}/named.toml.j2"
        dest: "{{ _deploy_dir }}/config/named.toml"
        mode: "0644"

    # The gateway server leaf's SANs (inference-gateway-agentgateway task 7.2). Every
    # agentgateway_svc host with listener TLS publishes one A record per SAN of its server leaf
    # that falls inside dns_zone, pointing at the published bind — the gateway's address when it
    # binds every interface. This replaces the probing hosts' interim /etc/hosts lines once
    # agw_internal_dns_authoritative is declared (tasks/agw-probe-resolution.yml).
    - name: "Derive the gateway server leaf records"
      ansible.builtin.set_fact:
        _dns_agw_records: >-
          {%- set out = [] -%}
          {%- for gw in groups.get('agentgateway_svc', []) -%}
            {%- set hv = hostvars[gw] -%}
            {%- if hv.agw_listener_tls | default(false) | bool -%}
              {%- set leaf = hv.internal_leaves | default([])
                    | selectattr('name', 'equalto', hv.agw_server_leaf | default('agw-server')) | list -%}
              {%- set bind = hv.agw_bind | default('127.0.0.1') -%}
              {%- set target = (hv.ansible_host | default(gw)) if bind in ['0.0.0.0', '::', ''] else bind -%}
              {%- for san in (leaf[0].sans | default([]) if leaf else []) -%}
                {%- if san.endswith('.' ~ dns_zone) -%}
                  {%- set _ = out.append({'name': san[:-(dns_zone | length + 1)], 'type': 'A',
                                          'value': target, 'host': gw, 'fqdn': san}) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    # A record nobody can reach is worse than none: it moves the failure from the deploy to
    # the first probe. A loopback target (a gateway bound to 127.0.0.1) only serves its own
    # host; a non-IPv4 value (an inventory name, an IPv6 bind) cannot be an A record; a name
    # dns_records already declares would give one name two answers. Each octet is 0-255
    # with no leading zero: dig prints the canonical form, so 01.2.3.4 could never pass
    # the Phase 3 string comparison.
    - name: "Refuse a gateway record the zone cannot serve"
      ansible.builtin.assert:
        that:
          - _dns_agw_records | rejectattr('value', 'match', '^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$') | list | length == 0
          - (local_mode | default(false) | bool)
            or (_dns_agw_records | selectattr('value', 'match', '^127\\.') | list | length == 0)
          - _dns_agw_records | map(attribute='name')
            | intersect(dns_records | default([]) | map(attribute='name') | list) | list | length == 0
        fail_msg: >-
          Gateway server leaf records {{ _dns_agw_records | map(attribute='fqdn') | join(', ') }}
          -> {{ _dns_agw_records | map(attribute='value') | join(', ') }}: each must be an IPv4
          address other than loopback (set agw_bind to the gateway's address, or bind 0.0.0.0
          with an IPv4 ansible_host), and no name may also be in dns_records.
        quiet: true

    - name: "Render zone file"
      ansible.builtin.template:
        src: "{{ _templates }}/zone.local-dev.j2"
        dest: "{{ _deploy_dir }}/config/zones/{{ dns_zone }}.zone"
        mode: "0644"

    - name: "Render compose .env"
      ansible.builtin.template:
        src: "{{ _templates }}/env.j2"
        dest: "{{ _deploy_dir }}/.env"
        mode: "0644"

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start DNS container"
  hosts: dns_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        # Force the compose provider on the Mac-direct genesis path (§12A fix #1):
        # detect_runtime falls back to `podman compose` (docker-compose) when
        # brew's podman-compose isn't on the task PATH, which then rejects the
        # podman-compose-built network. Empty (Semaphore path, var unset) is
        # treated as unset by detect_runtime ([ -z ]) -> it derives normally.
        # NOT default(omit): omit leaks its placeholder string into environment
        # (it isn't stripped there), which deploy.sh then tries to run -> rc 127.
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
      register: _deploy
      changed_when: true
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify resolution ──────────────────────────────────────────────
- name: "Phase 3: Verify resolution"
  hosts: dns_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    # Query the running daemon through its own bundled dig (the image ships
    # bind-tools), so the check needs no resolver tooling on the host/container
    # that ran the deploy.
    - name: "Resolve a wildcard name in the zone"
      ansible.builtin.command: >-
        {{ _engine }} exec dns
        dig +short +tcp +time=2 +tries=1 @127.0.0.1 probe.{{ dns_zone }} A
      register: _dig_wild
      changed_when: false
      retries: 5
      delay: 3
      until: _dig_wild.stdout | trim | length > 0
      check_mode: false

    - name: "Assert the wildcard resolves to the configured target"
      ansible.builtin.assert:
        that:
          - (_dig_wild.stdout | trim) == (dns_wildcard_target | default('127.0.0.1'))
        fail_msg: >-
          probe.{{ dns_zone }} resolved to '{{ _dig_wild.stdout | trim }}',
          expected '{{ dns_wildcard_target | default('127.0.0.1') }}'
        success_msg: "*.{{ dns_zone }} -> {{ _dig_wild.stdout | trim }}"
      # Under --check the zone is not re-rendered or reloaded, so live DNS still serves the
      # previous wildcard; comparing it to a changed dns_wildcard_target would fail falsely.
      when: not ansible_check_mode

    - name: "Resolve each gateway server leaf record"
      ansible.builtin.command: >-
        {{ _engine }} exec dns
        dig +short +tcp +time=2 +tries=1 @127.0.0.1 {{ item.fqdn }} A
      loop: "{{ _dns_agw_records | default([]) }}"
      loop_control:
        label: "{{ item.fqdn }}"
      register: _dig_agw
      changed_when: false
      check_mode: false
      failed_when: (_dig_agw.stdout | trim) != item.value
      # Under --check the zone is not re-rendered or reloaded, so live DNS still serves
      # the previous records; comparing them to the new declaration would fail falsely.
      when: not ansible_check_mode

    - name: "Verify forwarding of an external name"
      ansible.builtin.command: >-
        {{ _engine }} exec dns
        dig +short +tcp +time=3 +tries=2 @127.0.0.1 {{ dns_forward_probe | default('one.one.one.one') }} A
      register: _dig_fwd
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          DNS healthy: *.{{ dns_zone }} -> {{ _dig_wild.stdout | trim }};
          forward {{ dns_forward_probe | default('one.one.one.one') }} ->
          {{ _dig_fwd.stdout | trim if (_dig_fwd.stdout | trim | length > 0) else '(no answer — check egress/upstream)' }}

    # Host-side resolver wiring can't run through Semaphore (it's the Mac's
    # /etc/resolver, outside this VM) — point the developer at the idempotent
    # make target instead.
    - name: "Local-dev hint: wire macOS resolution"
      ansible.builtin.debug:
        msg: >-
          To resolve *.{{ dns_zone }} natively on the Mac, run (idempotent):
          make local-dns-resolver
      when: local_mode | default(false) | bool
