---
# backup-credentials-to-site-config.yml — copy credentials out of OpenBao into the
# private site-config repo, on a NEW BRANCH per backup, without any of them ever
# appearing in a log.
#
# WHY IT LOOKS LIKE THIS
#
# The obvious version prints the credential and lets the operator copy it. That
# was built first and rejected: everything a Semaphore job writes to stdout is
# stored in that task's output, and Semaphore v2.17 has no API that clears a
# task's output while keeping the task — DELETE removes the record *including*
# output, all or nothing (verified against the published API spec). So printing
# forces a choice between leaving a live credential in the orchestrator and
# destroying the audit record of the run.
#
# This avoids the choice. The runner already holds the OpenBao AppRole and is a
# git client, so it writes the material straight into a clone of the private repo
# and pushes. Nothing sensitive reaches stdout; the task record survives intact
# and says only which fields moved, and where.
#
#   OpenBao --AppRole--> runner --> site-config clone --> new branch --> push
#     |                    |                                ^
#     `-- deploy key ------+--> 0600 file in the scratch dir, wiped in always:
#                          `-- prints: branch, paths, FIELD NAMES. never values.
#
# A NEW BRANCH EVERY RUN, by request. Deliberately not idempotent in the usual
# sense: each backup is a distinct point-in-time record that someone reviews and
# merges, rather than a moving target on main. Re-running is still SAFE — it
# creates another branch and pushes another commit; it never rewrites history and
# never force-pushes.
#
# HOW IT AUTHENTICATES TO GITHUB — see tasks/site-config-clone.yml. The deploy key
# is read from secret/services/ssh/site-config with the same AppRole token, written
# 0600 into the scratch dir, used for the clone and the push, and wiped with the
# rest of the dir in `always:`. OpenBao is the single source of that key: it was
# seeded once from the operator's copy with Seed OpenBao Key (value as the
# BAO_VALUE environment secret — never a task parameter, which Semaphore persists).
#
# Its PUBLIC half is registered on the site-config GitHub repo as a deploy key
# WITH WRITE ACCESS. Without write it clones fine and fails at push, after the
# material is already in a clone on the runner (which the always: block wipes).
#
# TRUST NOTE. This gives the orchestrator write access to the private credentials
# repo. It already holds the AppRole, so it can already READ every secret; write
# access to the backup repo is a real but small increase on that, and it is what
# buys never printing a credential into a log.
#
# Usage (Semaphore extra vars):
#   -e credential_service=authentik
#   -e credential_fields=jacob_password,andrew_password   # optional; default all

- name: "Back up OpenBao credentials into site-config on a new branch"
  hosts: localhost
  gather_facts: false
  become: false
  connection: local
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true) | default('', true) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true) | default('', true) }}"
    # Built from a validated service name, never taken whole from the caller — a
    # free-form path here would let one invocation walk the entire store into a
    # git repo.
    _bao_path: "secret/data/services/{{ credential_service | default('') }}"
    _key_path: "secret/data/services/ssh/site-config"
    _requested: "{{ (credential_fields | default('')) | split(',') | map('trim') | reject('equalto', '') | list }}"

  tasks:
    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - credential_service is defined
          - credential_service is match('^[a-z0-9][a-z0-9_-]*$')
          - _bao_url | length > 0
        fail_msg: >-
          Pass -e credential_service=<name>. It names both an OpenBao path segment
          and a directory, so it is restricted to lowercase, digits, dash and
          underscore — a free-form value would be a path-traversal parameter in
          two places at once.

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      no_log: true

    - name: "Read the service secret"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/{{ _bao_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 403, 404]
      register: _secret
      no_log: true

    - name: "Fail with the reason, not a template error"
      ansible.builtin.assert:
        that:
          - _secret.status == 200
        fail_msg: >-
          {{ 'Denied (403) reading ' ~ _bao_path ~ ' — the AppRole cannot read it'
             if _secret.status == 403
             else 'Not found (404) at ' ~ _bao_path }}

    - name: "Decide which fields to back up"
      # Default is everything at the path, because that is what a backup means.
      # A caller can narrow it; a caller cannot widen it past this one path.
      ansible.builtin.set_fact:
        _fields: >-
          {{ (_requested if (_requested | length > 0)
              else (_secret.json.data.data.keys() | list)) | sort }}
      no_log: true

    - name: "Refuse a field the path does not hold, or one that cannot be a filename"
      # Each field name becomes `secrets/<service>/<field>.txt`. A name carrying a
      # separator or a dot-segment would write OUTSIDE that directory — and the
      # names come from the store, which this playbook must not trust to be tidy.
      # Closed: exactly the characters a filename may hold, nothing else.
      ansible.builtin.assert:
        that:
          - item in (_secret.json.data.data.keys() | list)
          - item is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - "'..' not in item"
        fail_msg: >-
          Field '{{ item }}' at {{ _bao_path }} is either absent or not a safe
          filename (letters, digits, dot, dash, underscore; no separators, no
          dot-segments).
      loop: "{{ _fields }}"
      no_log: true

    - name: "Report the shape of the work (names only, never values)"
      ansible.builtin.debug:
        msg: "{{ _bao_path }} -> {{ _fields | length }} field(s): {{ _fields | join(', ') }}"

    - name: "Fetch the site-config deploy key"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/{{ _key_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 403, 404]
      register: _key
      no_log: true

    - name: "Say plainly when the deploy key is missing"
      ansible.builtin.assert:
        that:
          - _key.status == 200
          - (_key.json.data.data.private_key | default('')) | length > 0
        fail_msg: >-
          No deploy key at {{ _key_path }} (HTTP {{ _key.status }}). Seed it from the
          operator's copy with the Seed OpenBao Key template — bao_path
          services/ssh/site-config, bao_key private_key, value as the BAO_VALUE
          environment secret — and register its PUBLIC half on the site-config
          GitHub repo as a deploy key WITH WRITE ACCESS.

    # ── Clone, write, push ───────────────────────────────────────────────────
    - name: "Everything below runs inside a block so the scratch dir is always wiped"
      # The clone holds real credentials AND the deploy key. Leaving either on the
      # runner after a failure would be worse than the failure itself, so the wipe
      # is an `always`, not a final task.
      block:
        - name: "Clone site-config on a fresh branch"
          ansible.builtin.include_tasks: tasks/site-config-clone.yml
          vars:
            _sc_deploy_key: "{{ _key.json.data.data.private_key }}"
            _sc_branch_prefix: "backup/{{ credential_service }}"
            _sc_repo_url: "{{ site_config_repo | default('', true) }}"
            _sc_known_hosts: "{{ git_known_hosts_file | default('', true) }}"

        - name: "Create the service secrets directory"
          ansible.builtin.file:
            path: "{{ _sc_clone }}/secrets/{{ credential_service }}"
            state: directory
            mode: "0700"

        - name: "Write each field to its own file"
          # One field per file, matching the convention already in that repo
          # (secrets/<service>/<name>.txt). No trailing newline juggling: the value
          # is written exactly as the store holds it, so a round trip is lossless.
          ansible.builtin.copy:
            content: "{{ _secret.json.data.data[item] }}"
            dest: "{{ _sc_clone }}/secrets/{{ credential_service }}/{{ item }}.txt"
            mode: "0600"
          loop: "{{ _fields }}"
          no_log: true

        - name: "Commit and push"
          ansible.builtin.include_tasks: tasks/site-config-push.yml
          vars:
            _sc_add_path: "secrets/{{ credential_service }}"
            _sc_commit_subject: "secrets({{ credential_service }}): back up {{ _fields | length }} credential(s) from OpenBao"
            _sc_commit_body: >-
              Written by backup-credentials-to-site-config.yml from
              {{ _bao_path }}. Fields: {{ _fields | join(', ') }}.
              Values never passed through the job output.
            _sc_report_what: "{{ _fields | length }} credential file(s) under secrets/{{ credential_service }}/"

      always:
        - name: "Wipe the scratch dir"
          ansible.builtin.file:
            path: "{{ _sc_wd }}"
            state: absent
          when: _sc_wd is defined
