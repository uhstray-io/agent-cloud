---
# backup-credentials-to-site-config.yml — copy credentials out of OpenBao into the
# private site-config repo, on a NEW BRANCH per backup, without any of them ever
# appearing in a log.
#
# WHY IT LOOKS LIKE THIS
#
# The obvious version prints the credential and lets the operator copy it. That
# was built first and rejected: everything a Semaphore job writes to stdout is
# stored in that task's output, and Semaphore v2.17 has no API that clears a
# task's output while keeping the task — DELETE removes the record *including*
# output, all or nothing (verified against the published API spec). So printing
# forces a choice between leaving a live credential in the orchestrator and
# destroying the audit record of the run.
#
# This avoids the choice. The runner already holds the OpenBao AppRole and is a
# git client, so it writes the material straight into a clone of the private repo
# and pushes. Nothing sensitive reaches stdout; the task record survives intact
# and says only which fields moved, and where.
#
#   OpenBao --AppRole--> runner --> site-config clone --> new branch --> push
#                          |
#                          `-- prints: branch, paths, FIELD NAMES. never values.
#
# A NEW BRANCH EVERY RUN, by request. Deliberately not idempotent in the usual
# sense: each backup is a distinct point-in-time record that someone reviews and
# merges, rather than a moving target on main. Re-running is still SAFE — it
# creates another branch and pushes another commit; it never rewrites history and
# never force-pushes.
#
# PREREQUISITES
#   1. A deploy key at secret/services/ssh/site-config. Mint it with
#      generate-service-ssh-key.yml -e service_name=site-config
#   2. Its PUBLIC half registered on the site-config GitHub repo as a deploy key
#      WITH WRITE ACCESS. Without write it clones fine and fails at push, after
#      the material is already in a clone on the runner.
#
# TRUST NOTE. This gives the orchestrator write access to the private credentials
# repo. It already holds the AppRole, so it can already READ every secret; write
# access to the backup repo is a real but small increase on that, and it is what
# buys never printing a credential into a log.
#
# Usage (Semaphore extra vars):
#   -e credential_service=authentik
#   -e credential_fields=jacob_password,andrew_password   # optional; default all

- name: "Back up OpenBao credentials into site-config on a new branch"
  hosts: localhost
  gather_facts: false
  become: false
  connection: local
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true) | default('', true) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true) | default('', true) }}"
    # Built from a validated service name, never taken whole from the caller — a
    # free-form path here would let one invocation walk the entire store into a
    # git repo.
    _bao_path: "secret/data/services/{{ credential_service | default('') }}"
    _key_path: "secret/data/services/ssh/site-config"
    _requested: "{{ (credential_fields | default('')) | split(',') | map('trim') | reject('equalto', '') | list }}"
    _repo_url: "{{ site_config_repo | default('git@github.com:uhstray-io/site-config.git', true) }}"
    # Host keys for the push target, pinned. accept-new is trust-on-first-use, and
    # the first use here is a connection that carries a deploy key and then a
    # credentials commit. files/github_known_hosts holds GitHub's published keys;
    # their fingerprints were checked against GitHub's own /meta endpoint when the
    # file was committed. A different remote supplies its own file.
    _known_hosts: "{{ git_known_hosts_file | default(playbook_dir ~ '/files/github_known_hosts', true) }}"
    _git_ssh: >-
      ssh -i {{ _wd_key | default('DEPLOY_KEY_UNSET') }}
      -o IdentitiesOnly=yes
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ _known_hosts }}

  tasks:
    - name: "Freeze the branch name for this run"
      # set_fact, NOT a play var. A `vars:` entry holding lookup('pipe', 'date')
      # is re-evaluated at EVERY reference, so `git switch -c {{ _branch }}` and
      # `git push origin {{ _branch }}` named two different branches one second
      # apart — the push then failed with "src refspec does not match any", after
      # the credentials had already been written and committed. Measured against a
      # real clone. set_fact evaluates once and stores the result.
      #
      # Seconds, not just the date: two backups an hour apart are two records, and
      # a same-day-only stamp would silently append to the earlier branch.
      #
      # A short random suffix after the second-resolution stamp: two runs started
      # in the same second (two operators, or a retry) would otherwise race to
      # create one branch and the loser's push is rejected after its clone has
      # already been written. lookup('password') with /dev/null generates without
      # storing; it is evaluated once here, inside set_fact, for the same reason
      # the date is.
      ansible.builtin.set_fact:
        _branch: >-
          {{ backup_branch | default('backup/' ~ (credential_service | default('unknown'))
             ~ '-' ~ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ')
             ~ '-' ~ lookup('password', '/dev/null chars=hexdigits length=6') | lower, true) }}

    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - credential_service is defined
          - credential_service is match('^[a-z0-9][a-z0-9_-]*$')
          - _bao_url | length > 0
        fail_msg: >-
          Pass -e credential_service=<name>. It names both an OpenBao path segment
          and a directory, so it is restricted to lowercase, digits, dash and
          underscore — a free-form value would be a path-traversal parameter in
          two places at once.

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      no_log: true

    - name: "Read the service secret"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/{{ _bao_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 403, 404]
      register: _secret
      no_log: true

    - name: "Fail with the reason, not a template error"
      ansible.builtin.assert:
        that:
          - _secret.status == 200
        fail_msg: >-
          {{ 'Denied (403) reading ' ~ _bao_path ~ ' — the AppRole cannot read it'
             if _secret.status == 403
             else 'Not found (404) at ' ~ _bao_path }}

    - name: "Decide which fields to back up"
      # Default is everything at the path, because that is what a backup means.
      # A caller can narrow it; a caller cannot widen it past this one path.
      ansible.builtin.set_fact:
        _fields: >-
          {{ (_requested if (_requested | length > 0)
              else (_secret.json.data.data.keys() | list)) | sort }}
      no_log: true

    - name: "Refuse a field the path does not hold, or one that cannot be a filename"
      # Each field name becomes `secrets/<service>/<field>.txt`. A name carrying a
      # separator or a dot-segment would write OUTSIDE that directory — and the
      # names come from the store, which this playbook must not trust to be tidy.
      # Closed: exactly the characters a filename may hold, nothing else.
      ansible.builtin.assert:
        that:
          - item in (_secret.json.data.data.keys() | list)
          - item is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - "'..' not in item"
        fail_msg: >-
          Field '{{ item }}' at {{ _bao_path }} is either absent or not a safe
          filename (letters, digits, dot, dash, underscore; no separators, no
          dot-segments).
      loop: "{{ _fields }}"
      no_log: true

    - name: "Report the shape of the work (names only, never values)"
      ansible.builtin.debug:
        msg: "{{ _bao_path }} -> {{ _fields | length }} field(s): {{ _fields | join(', ') }}"

    # ── Clone, write, push ───────────────────────────────────────────────────
    - name: "Create a scratch dir for the clone and the deploy key"
      ansible.builtin.tempfile:
        state: directory
        prefix: ".scbackup_"
      register: _wd

    - name: "Name the deploy-key path the git commands will use"
      ansible.builtin.set_fact:
        _wd_key: "{{ _wd.path }}/deploy_key"

    - name: "Refuse to proceed without a pinned host-key file"
      # Fail here, before the clone, rather than let ssh report an unreadable
      # known_hosts as "host key verification failed" mid-run.
      ansible.builtin.stat:
        path: "{{ _known_hosts }}"
      register: _kh
    - name: "Require the host-key file"
      ansible.builtin.assert:
        that:
          - _kh.stat.exists
          - _kh.stat.size > 0
        fail_msg: >-
          No known_hosts file at {{ _known_hosts }}. Strict host-key checking is
          not optional here; pass git_known_hosts_file=<path> for a non-GitHub
          remote.

    - name: "Everything below runs inside a block so the scratch dir is always wiped"
      # The clone holds real credentials AND the deploy key. Leaving either on the
      # runner after a failure would be worse than the failure itself, so the wipe
      # is an `always`, not a final task.
      block:
        - name: "Fetch the site-config deploy key"
          ansible.builtin.uri:
            url: "{{ _bao_url }}/v1/{{ _key_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
            status_code: [200, 403, 404]
          register: _key
          no_log: true

        - name: "Say plainly that the deploy key is missing"
          ansible.builtin.assert:
            that:
              - _key.status == 200
              - (_key.json.data.data.private_key | default('')) | length > 0
            fail_msg: >-
              No deploy key at {{ _key_path }}. Mint one with
              generate-service-ssh-key.yml -e service_name=site-config, then
              register its PUBLIC half on the site-config GitHub repo as a deploy
              key WITH WRITE ACCESS. Without write it clones and fails at push.

        - name: "Materialise the deploy key (runner-local, 0600)"
          ansible.builtin.copy:
            content: "{{ _key.json.data.data.private_key }}"
            dest: "{{ _wd.path }}/deploy_key"
            mode: "0600"
          no_log: true

        - name: "Clone site-config"
          ansible.builtin.command:
            cmd: "git clone --depth 1 {{ _repo_url }} {{ _wd.path }}/site-config"
          environment:
            GIT_SSH_COMMAND: "{{ _git_ssh }}"
          changed_when: true

        - name: "Start a fresh branch for this backup"
          ansible.builtin.command:
            cmd: "git switch -c {{ _branch }}"
            chdir: "{{ _wd.path }}/site-config"
          changed_when: true

        - name: "Create the service secrets directory"
          ansible.builtin.file:
            path: "{{ _wd.path }}/site-config/secrets/{{ credential_service }}"
            state: directory
            mode: "0700"

        - name: "Write each field to its own file"
          # One field per file, matching the convention already in that repo
          # (secrets/<service>/<name>.txt). No trailing newline juggling: the value
          # is written exactly as the store holds it, so a round trip is lossless.
          ansible.builtin.copy:
            content: "{{ _secret.json.data.data[item] }}"
            dest: "{{ _wd.path }}/site-config/secrets/{{ credential_service }}/{{ item }}.txt"
            mode: "0600"
          loop: "{{ _fields }}"
          no_log: true

        - name: "Identify the commit"
          # argv, not cmd. `command` word-splits a cmd string, so a name with
          # spaces arrives as four arguments and git answers "no action
          # specified" — measured against a real clone, not theorised.
          ansible.builtin.command:
            argv: ["git", "config", "user.{{ item.k }}", "{{ item.v }}"]
            chdir: "{{ _wd.path }}/site-config"
          loop:
            - {k: "name", v: "Joseph A. Wisneski IV"}
            - {k: "email", v: "stray@uhstray.io"}
          changed_when: true

        - name: "Stage only this service's directory"
          # Scoped, never `git add -A`. That clone is shallow and clean, but a
          # blanket add is how unrelated working state gets swept into a
          # credentials commit.
          ansible.builtin.command:
            cmd: "git add secrets/{{ credential_service }}"
            chdir: "{{ _wd.path }}/site-config"
          changed_when: true

        - name: "Is there anything to commit?"
          ansible.builtin.command:
            cmd: "git diff --cached --quiet"
            chdir: "{{ _wd.path }}/site-config"
          register: _staged
          changed_when: false
          failed_when: false

        - name: "Commit"
          # argv for the same reason as above. The quotes that look like they
          # protect the message are consumed by YAML, not by a shell — `command`
          # never invokes one.
          ansible.builtin.command:
            argv:
              - git
              - commit
              - "-m"
              - "secrets({{ credential_service }}): back up {{ _fields | length }} credential(s) from OpenBao"
              - "-m"
              - >-
                Written by backup-credentials-to-site-config.yml from
                {{ _bao_path }}. Fields: {{ _fields | join(', ') }}.
                Values never passed through the job output.
            chdir: "{{ _wd.path }}/site-config"
          when: _staged.rc != 0
          changed_when: true

        - name: "Push the branch"
          ansible.builtin.command:
            cmd: "git push origin {{ _branch }}"
            chdir: "{{ _wd.path }}/site-config"
          environment:
            GIT_SSH_COMMAND: "{{ _git_ssh }}"
          when: _staged.rc != 0
          changed_when: true

        - name: "Report"
          ansible.builtin.debug:
            msg: >-
              {{ ('Pushed branch ' ~ _branch ~ ' to site-config with '
                  ~ (_fields | length) ~ ' credential file(s) under secrets/'
                  ~ credential_service ~ '/. Open a PR there to keep it.')
                 if _staged.rc != 0
                 else ('No change — site-config already holds these '
                       ~ (_fields | length) ~ ' value(s). Nothing pushed.') }}

      always:
        - name: "Wipe the scratch dir"
          ansible.builtin.file:
            path: "{{ _wd.path }}"
            state: absent
