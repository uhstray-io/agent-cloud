---
# Read-only NetBox runtime report. Use this before choosing a recovery action.
- name: Audit NetBox runtime
  hosts: netbox_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _compose_path: "{{ monorepo_deploy_path | default('platform/services/netbox/deployment') }}/docker-compose.yml"
  tasks:
    - name: Read host repository revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ _monorepo_dir }}"
      register: _host_revision
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Read tracked Compose changes on host
      ansible.builtin.command:
        argv: [git, --no-optional-locks, status, --porcelain, --, "{{ _compose_path }}"]
        chdir: "{{ _monorepo_dir }}"
      register: _compose_status
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Read host Compose checksum
      ansible.builtin.stat:
        path: "{{ _monorepo_dir }}/{{ _compose_path }}"
        checksum_algorithm: sha256
      register: _compose_file
      check_mode: false
      changed_when: false

    - name: List NetBox containers and their state
      ansible.builtin.command:
        argv: [docker, ps, -a, --filter, name=netbox, --format, "{{ '{{.Names}} {{.Status}}' }}"]
      register: _containers
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Inspect NetBox application container state
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' }}", netbox-netbox-1]
      register: _app
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Inspect NetBox dependency failure state
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} policy={{.HostConfig.RestartPolicy.Name}} finished={{.State.FinishedAt}}' }}"
          - netbox-netbox-1
          - netbox-postgres-1
          - netbox-redis-cache-1
          - netbox-redis-1
          - netbox-hydra-1
          - netbox-diode-reconciler-1
          - netbox-netbox-worker-1
      register: _dependencies
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Inspect NetBox image and named-volume identities
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - >-
            {{ '{{.Name}} image_ref={{.Config.Image}} image_id={{.Image}} volumes={{range .Mounts}}{{if eq .Type "volume"}}{{.Name}}:{{.Destination}},{{end}}{{end}}' }}
          - netbox-netbox-1
          - netbox-postgres-1
          - netbox-redis-cache-1
          - netbox-redis-1
      register: _storage
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Read host boot time
      ansible.builtin.command:
        argv: [uptime, -s]
      register: _boot
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Check the declared NetBox login endpoint
      ansible.builtin.uri:
        url: "{{ service_url | default('http://localhost:8000') }}/login/"
        method: GET
        follow_redirects: none
        status_code: [200, 302]
        timeout: 5
      register: _http
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Report runtime state without secrets
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          repository_revision: "{{ _host_revision.stdout | default('') }}"
          repository_rc: "{{ _host_revision.rc | default('not_run') }}"
          repository_msg: "{{ _host_revision.msg | default('') }}"
          repository_error: "{{ _host_revision.stderr | default('') }}"
          compose_status: "{{ _compose_status.stdout_lines | default([]) }}"
          compose_status_rc: "{{ _compose_status.rc | default('not_run') }}"
          compose_status_msg: "{{ _compose_status.msg | default('') }}"
          compose_status_error: "{{ _compose_status.stderr | default('') }}"
          compose_sha256: "{{ _compose_file.stat.checksum | default('missing') }}"
          containers_rc: "{{ _containers.rc }}"
          containers: "{{ _containers.stdout_lines }}"
          containers_error: "{{ _containers.stderr }}"
          app_rc: "{{ _app.rc }}"
          app_state: "{{ _app.stdout }}"
          app_error: "{{ _app.stderr }}"
          dependencies_rc: "{{ _dependencies.rc }}"
          dependencies: "{{ _dependencies.stdout_lines }}"
          dependencies_error: "{{ _dependencies.stderr }}"
          storage_rc: "{{ _storage.rc }}"
          storage: "{{ _storage.stdout_lines }}"
          storage_error: "{{ _storage.stderr }}"
          boot_rc: "{{ _boot.rc }}"
          boot_time: "{{ _boot.stdout }}"
          boot_error: "{{ _boot.stderr }}"
          http_status: "{{ _http.status | default('unreachable') }}"
          http_message: "{{ _http.msg | default('') }}"
