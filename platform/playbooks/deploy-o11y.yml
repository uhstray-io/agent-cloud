---
# deploy-o11y.yml — observability stack (Grafana+Prometheus+Loki+Alloy+Tempo) deploy.
#
# Phase 1: Place repo + manage-secrets (Grafana admin password from OpenBao) +
#          template .env. The committed config/ (scrape/loki/alloy/grafana
#          provisioning) travels with the repo. Pyroscope uses its own persistent
#          volume and stays private on the observability network.
# Phase 2: deploy.sh — container lifecycle (pull, up, wait Grafana healthy;
#          datasources + dashboards provision on boot).
# Phase 3: Verify service health and, when enabled, live Grafana alert state.
#
# Plan: plan/development/O11Y-DEPLOYMENT.md.

- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Verify the controller checkout before a candidate deploy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the controller checkout revision when a candidate SHA is required
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false
      when: expected_repository_sha is defined

    - name: Require the exact reviewed candidate revision
      ansible.builtin.assert:
        that: _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different revision; no o11y files were placed."
        success_msg: "Semaphore checkout matches {{ expected_repository_sha }}."
      when: expected_repository_sha is defined

    - name: Read candidate checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false
      when: expected_repository_sha is defined

    - name: Require a clean candidate checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "Candidate checkout has uncommitted files; no o11y files were placed."
      when: expected_repository_sha is defined

# ── Phase 1: Place repo + secrets + env ─────────────────────────────────────
- name: "Phase 1: Place repo + manage o11y secrets"
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars_files:
    - vars/secret-declarations/o11y.yml
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _o11y_retention_expansion: >-
      {{ (o11y_prom_retention | default('15d') | string) != '15d' or
         (o11y_loki_retention | default('7d') | string) != '7d' or
         (o11y_tempo_retention | default('168h') | string) != '168h' }}
    # Shared by Alloy and every Prometheus scrape job. Drop known sensitive or
    # request-specific label names while retaining declared bounded dimensions
    # such as service, identity, model, status, device, and GPU labels.
    _o11y_forbidden_metric_label_names_regex: >-
      (?i).*(^|_)(request_id|requestid|user_id|userid|client_id|clientid|session_id|sessionid|trace_id|traceid|span_id|spanid|email|api_key|apikey|access_token|refresh_token|token_value|token_id|password|secret|authorization|cookie|prompt|prompt_text|raw_path|path|http_target|address|remote_addr|remote_address|source_ip|client_ip|timestamp|url|uri|query|query_text)(_|$).*
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _auth_edge_hosts: "{{ groups['caddy_svc'] | default([]) }}"
    _auth_edge_ip: "{{ hostvars[_auth_edge_hosts[0]].ansible_host | default('') if _auth_edge_hosts | length == 1 else '' }}"
    # Synthetic inference probe (change inference-telemetry-production, task 3.3).
    # Off unless inventory enables it; off renders exactly the pre-probe secrets
    # and env files (platform/tests/test_inference_probe.py).
    _probe_enabled: "{{ o11y_inference_probe_enabled | default(false) | bool }}"
    _probe_textfile_dir: /var/lib/node_exporter/textfile
    _probe_user: "{{ ansible_user | default('deploy') }}"
    _probe_unit_dir: /etc/systemd/system
    # Host files an enable creates; a disabled deploy removes whichever of them exist.
    _probe_host_artefacts:
      - "{{ _probe_unit_dir }}/inference-probe.timer"
      - "{{ _probe_unit_dir }}/inference-probe.service"
      - "{{ _probe_textfile_dir }}/inference_probe.prom"
    _probe_present: >-
      {{ _probe_leftovers.results | default([]) | selectattr('stat', 'defined')
         | selectattr('stat.exists') | map(attribute='item') | list }}
    # OIDC client secret is owned by authentik (the IdP); read it here so
    # Grafana's generic_oauth secret matches the provider blueprint. The probe's
    # API key is read the same way from the service that owns it (an agentgateway
    # client identity by default), never copied into secret/services/o11y.
    _shared_reads: >-
      {{ [{'from_service': 'authentik', 'read_keys': ['grafana_oidc_client_secret']}] +
         ([{'from_service': o11y_inference_probe_key_service | default('agentgateway'),
            'read_keys': [o11y_inference_probe_key_field | default('')]}]
          if _probe_enabled | bool else []) }}
    # The probe key goes to its own 0600 file, not .env: Grafana loads .env as its
    # env_file and must not hold the inference key.
    _env_templates: >-
      {{ [{'src': 'env.j2', 'dest': '.env', 'mode': '0600'}] +
         ([{'src': '../probe/inference-probe.env.j2', 'dest': 'probe/inference-probe.env', 'mode': '0600'}]
          if _probe_enabled | bool else []) }}

  tasks:
    - name: "Require a capacity receipt and nonzero Prometheus cap for retention expansion"
      ansible.builtin.assert:
        that:
          - o11y_prom_retention_size | default('0B') | string | trim is match('^[1-9][0-9]*(B|KB|MB|GB|TB|PB|EB)$')
          - o11y_capacity_receipt_id | default('') | string is match('^[1-9][0-9]*$')
        fail_msg: >-
          Production retention differs from the approved 15d / 7d / 168h baseline.
          A nonzero Prometheus size cap and a numeric o11y_capacity_receipt_id that
          references a separately reviewed successful capacity receipt are required.
          The receipt cannot be earned until receiver host metrics,
          seven-day backend growth/CPU/memory history, measured forecast, and the guest
          growth/backup path are verified.
      when: >-
        not (local_mode | default(false) | bool) and
        (_o11y_retention_expansion | bool)

    - name: Require Podman before a retention-expansion volume inspection
      ansible.builtin.assert:
        that: container_engine | default('podman') == 'podman'
        fail_msg: "The production o11y volume-capacity gate currently requires rootless Podman."
      when: >-
        not (local_mode | default(false) | bool) and
        (_o11y_retention_expansion | bool)

    - name: Read o11y volume backing capacity before retention expansion
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/files/inspect-o11y-volume-capacity.py {{ container_engine | default('podman') }} 30"
      register: _o11y_volume_preflight
      changed_when: false
      failed_when: false
      check_mode: false
      when: >-
        not (local_mode | default(false) | bool) and
        (_o11y_retention_expansion | bool)

    - name: Require resolved o11y volumes and at least thirty percent headroom for retention expansion
      ansible.builtin.assert:
        that: _o11y_volume_preflight.rc == 0
        fail_msg: >-
          Production retention expansion is blocked until the existing named volumes resolve
          to their backing filesystems and every backing filesystem has at least 30%
          free space. A clean first deploy is allowed only when all five backend
          containers are absent and guest root has the same headroom. This playbook
          never resizes storage. Read-only volume receipt: {{ _o11y_volume_preflight.stdout | trim }}
      when: >-
        not (local_mode | default(false) | bool) and
        (_o11y_retention_expansion | bool)

    - name: Require the production backing-filesystem capacity receipt
      ansible.builtin.assert:
        that: (_o11y_volume_preflight.stdout | from_json).status in ['observed', 'first_deploy']
        fail_msg: "The sanitized o11y capacity readback did not report an acceptable state."
      when: >-
        not (local_mode | default(false) | bool) and
        (_o11y_retention_expansion | bool)

    - name: "Require the production DNS zone and Caddy origin before rendering Grafana OIDC"
      ansible.builtin.assert:
        that:
          - o11y_zone is defined
          - o11y_zone | default('') is match('^[a-z0-9.-]+$')
          - o11y_zone != 'agent-cloud.test'
          - _auth_edge_hosts | length == 1
          - _auth_edge_ip is match('^[0-9]+(\\.[0-9]+){3}$')
        fail_msg: "Production o11y needs its declared DNS zone and one Caddy origin IP; local test URLs are refused."
      when: not (local_mode | default(false) | bool)

    - name: "Inspect an unfinished production alert canary"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/scrape.d/o11y-prod-canary.yml"
      register: _unfinished_prod_canary
      when: not (local_mode | default(false) | bool)

    - name: "Inspect an unfinished production alert restoration"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/.o11y-alert-canary-active"
      register: _unfinished_prod_restore
      when: not (local_mode | default(false) | bool)

    - name: "Refuse a normal deploy while the production canary needs restoration"
      ansible.builtin.assert:
        that:
          - not _unfinished_prod_canary.stat.exists
          - not _unfinished_prod_restore.stat.exists
        fail_msg: "Production canary restoration is unfinished; run Restore o11y Alert Baseline (Dev) before deploying."
      when: not (local_mode | default(false) | bool)

    - name: "Refuse a normal deploy while the active alert drill needs recovery"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/.o11y-active-alert-drill"
      register: _unfinished_active_alert_drill
      when: not (local_mode | default(false) | bool)

    - name: "Require the active alert drill to be recovered before deploy"
      ansible.builtin.assert:
        that: not _unfinished_active_alert_drill.stat.exists
        fail_msg: "An active production alert drill was interrupted; run Recover o11y Active Alert Drill (Dev) before deploying."
      when: not (local_mode | default(false) | bool)

    - name: "Require the recorded trace rollout gate"
      ansible.builtin.include_tasks: tasks/assert-o11y-trace-rollout.yml
      # Derived metrics activate trace processing and intentionally inherit the
      # shared trace rollout receipts in local-dev as well as production.
      when: >-
        (o11y_trace_rollout_enabled | default(false) | bool) or
        (o11y_trace_derived_metrics_enabled | default(false) | bool) or
        (not (local_mode | default(false) | bool) and
         groups.get('agentgateway_svc', []) | length == 1 and
         hostvars[groups['agentgateway_svc'][0]].agw_otlp_host | default('') | length > 0)

    - name: "Require complete DGX scrape settings when scraping is enabled"
      ansible.builtin.assert:
        that:
          - dgx_spark_nodes | default([]) | length > 0
          - dgx_spark_head_address is defined
          - dgx_spark_head_name is defined
          - dgx_spark_node_exporter_port is defined
          - dgx_spark_api_port is defined
          - not (dgx_spark_gpu_exporter_enabled | default(false) | bool) or dgx_spark_gpu_exporter_port is defined
        fail_msg: "DGX scrape inventory needs the head address/name and enabled collector ports."
      when: dgx_spark_scrape_enabled | default(false) | bool

    - name: "Require a complete declared agentgateway stats endpoint"
      ansible.builtin.assert:
        that:
          - groups.get('agentgateway_svc', []) | length == 1
          - agentgateway_metrics_address | default('') is match('^[A-Za-z0-9.-]+$')
          - agentgateway_metrics_port is defined
          - agentgateway_metrics_port | int > 0
          - agentgateway_metrics_port | int < 65536
        fail_msg: "agentgateway metrics need a declared receiver-reachable address and port."
      when: agentgateway_metrics_address is defined or agentgateway_metrics_port is defined

    - name: "Require the receiver target to match the gateway's published stats listener"
      ansible.builtin.assert:
        # The gateway's own bind defaults to loopback (agentgateway env.j2), which no remote
        # receiver can scrape, so it must be declared; its port defaults to 19002 there too.
        that:
          - hostvars[groups['agentgateway_svc'][0]].agw_stats_bind is defined
          - agentgateway_metrics_address == hostvars[groups['agentgateway_svc'][0]].agw_stats_bind
          - agentgateway_metrics_port | int == hostvars[groups['agentgateway_svc'][0]].agw_stats_port | default(19002) | int
        fail_msg: "The receiver's gateway scrape target differs from the gateway's declared stats bind (agw_stats_bind must be declared)."
      when: agentgateway_metrics_address is defined or agentgateway_metrics_port is defined

    - name: "Require a private declared OTLP bind when agentgateway tracing is enabled"
      ansible.builtin.assert:
        that:
          - o11y_otlp_bind is defined
          - o11y_otlp_bind is match('^[0-9]+(\\.[0-9]+){3}$')
          - o11y_otlp_bind != '127.0.0.1'
          - hostvars[groups['agentgateway_svc'][0]].agw_otlp_host == o11y_otlp_bind ~ ':' ~ (o11y_otlp_port | default(4317) | string)
        fail_msg: "The gateway trace endpoint must equal the receiver's private OTLP bind and port."
      when:
        - not (local_mode | default(false) | bool)
        - groups.get('agentgateway_svc', []) | length == 1
        - hostvars[groups['agentgateway_svc'][0]].agw_otlp_host | default('') | length > 0

    - name: "Require a private bind for the fixed conformance OTLP/HTTP listener"
      ansible.builtin.assert:
        that:
          - o11y_otlp_bind is defined
          - o11y_otlp_bind is match('^[0-9]+(\\.[0-9]+){3}$')
          - o11y_otlp_bind is match('^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)')
        fail_msg: "Production conformance OTLP/HTTP must bind the private interface already declared for OTLP."
      when: not (local_mode | default(false) | bool)

    - name: "Require the observability cluster label"
      ansible.builtin.assert:
        that:
          - (local_mode | default(false) | bool) or o11y_cluster is defined
          - (o11y_cluster | default('agent-cloud-local')) is match('^[A-Za-z0-9_.-]+$')
          - (o11y_environment | default('local' if local_mode | default(false) | bool else 'prod')) in ['local', 'dev', 'prod']
        fail_msg: "Production o11y requires a declared o11y_cluster label containing only letters, digits, dots, underscores, or hyphens."

    - name: "Require numeric capacity and backup/restore receipts before enabling Tempo-derived metrics"
      ansible.builtin.assert:
        that:
          - o11y_capacity_receipt_id | default('') | string is match('^[1-9][0-9]*$')
          - o11y_trace_backup_restore_receipt_id | default('') | string is match('^[1-9][0-9]*$')
        fail_msg: >-
          Tempo-derived metrics are opt-in. Production enablement requires numeric
          capacity and backup/isolated-restore Semaphore receipt IDs; the shared trace
          gate also requires metrics, alert-delivery, retention, and cardinality receipts.
      when:
        - not (local_mode | default(false) | bool)
        - o11y_trace_derived_metrics_enabled | default(false) | bool

    - name: "Require prior config, privacy, and resource receipts before profile collection"
      ansible.builtin.assert:
        that:
          - o11y_profile_pilot_config_receipt_id | default('') | string is match('^[1-9][0-9]*$')
          - o11y_profile_pilot_privacy_receipt_id | default('') | string is match('^[1-9][0-9]*$')
          - o11y_profile_pilot_resource_receipt_id | default('') | string is match('^[1-9][0-9]*$')
        fail_msg: "Profiling remains disabled until private inventory records successful config, privacy, and resource-gate receipt IDs."
      when: o11y_alloy_profile_pilot_enabled | default(false) | bool

    - name: "Require complete synthetic inference probe settings when the probe is enabled"
      ansible.builtin.assert:
        that:
          - o11y_inference_probe_url | default('') is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/v1$')
          - o11y_inference_probe_model | default('') is match('^[A-Za-z0-9._:/@-]+$')
          - o11y_inference_probe_key_service | default('agentgateway') is match('^[a-z0-9-]+$')
          - o11y_inference_probe_key_field | default('') is match('^[A-Za-z0-9_-]+$')
          - o11y_inference_probe_timeout_seconds | default(30) | int >= 1
          - o11y_inference_probe_timeout_seconds | default(30) | int <= 120
        fail_msg: >-
          The inference probe needs o11y_inference_probe_url (https://<host>/v1),
          o11y_inference_probe_model, and o11y_inference_probe_key_field naming the
          OpenBao field that holds its key under secret/services/<o11y_inference_probe_key_service>
          (default agentgateway); the latency budget o11y_inference_probe_timeout_seconds is 1-120.
      when: _probe_enabled | bool

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Render Alloy config with the inventory cluster label"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/o11y/deployment/templates/config.alloy.j2"
        dest: "{{ _deploy_dir }}/config/config.alloy"
        mode: "0644"

    - name: "Render Prometheus config with the inventory cluster label"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/o11y/deployment/templates/prometheus.yml.j2"
        dest: "{{ _deploy_dir }}/config/prometheus.yml"
        mode: "0644"

    - name: Read the placed revision when a candidate SHA is required
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ _monorepo_dir }}"
      register: _placed_revision
      changed_when: false
      check_mode: false
      # Proves what THIS run placed; a dry run places nothing.
      when:
        - not ansible_check_mode
        - expected_repository_sha is defined
        - not (local_mode | default(false) | bool)

    - name: Refuse a receiver checkout that differs from the reviewed candidate
      ansible.builtin.assert:
        that: _placed_revision.stdout == expected_repository_sha
        fail_msg: "Receiver checkout differs from the reviewed o11y candidate; no secrets or containers were changed."
      when:
        - not ansible_check_mode
        - expected_repository_sha is defined
        - not (local_mode | default(false) | bool)

    - name: "Configure o11y alert provisioning from OpenBao"
      ansible.builtin.include_tasks: tasks/o11y-alert-provision.yml

    - name: "Render DGX scrape targets only after source proof enables scraping"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/o11y/deployment/templates/scrape-dgx-spark.yml.j2"
        dest: "{{ _deploy_dir }}/config/scrape.d/dgx-spark.yml"
        mode: "0644"
      register: _dgx_scrape
      when: dgx_spark_scrape_enabled | default(false) | bool

    - name: "Remove DGX scrape targets while scraping is disabled"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config/scrape.d/dgx-spark.yml"
        state: absent
      register: _dgx_scrape_absent
      when: not (dgx_spark_scrape_enabled | default(false) | bool)

    - name: "Render the agentgateway scrape only when inventory declares it"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/o11y/deployment/templates/scrape-agentgateway.yml.j2"
        dest: "{{ _deploy_dir }}/config/scrape.d/agentgateway.yml"
        mode: "0644"
      register: _agentgateway_scrape
      when: agentgateway_metrics_address is defined

    - name: "Remove the agentgateway scrape when inventory does not declare it"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config/scrape.d/agentgateway.yml"
        state: absent
      register: _agentgateway_scrape_absent
      when: agentgateway_metrics_address is not defined

    # Synthetic inference probe. Its environment file (key from OpenBao) was rendered
    # by manage-secrets above; the units and the textfile directory are host config.
    - name: "Install the synthetic inference probe"
      when: _probe_enabled | bool
      become: true
      vars:
        _probe_script: "{{ _deploy_dir }}/probe/inference-probe.sh"
        _probe_env_file: "{{ _deploy_dir }}/probe/inference-probe.env"
      block:
        - name: "Create node_exporter's textfile directory, writable only by the probe user"
          ansible.builtin.file:
            path: "{{ _probe_textfile_dir }}"
            state: directory
            owner: "{{ _probe_user }}"
            mode: "0755"

        - name: "Render the probe service unit"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../services/o11y/deployment/probe/inference-probe.service.j2"
            dest: "{{ _probe_unit_dir }}/inference-probe.service"
            mode: "0644"
          register: _probe_service_unit

        - name: "Install the five-minute probe timer"
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../services/o11y/deployment/probe/inference-probe.timer"
            dest: "{{ _probe_unit_dir }}/inference-probe.timer"
            mode: "0644"
          register: _probe_timer_unit

        # Under --check the two unit files above are only simulated, so on a first enable
        # systemd has no timer to start; activation is a real-run step.
        - name: "Enable and start the probe timer"
          ansible.builtin.systemd_service:
            name: inference-probe.timer
            enabled: true
            state: started
            daemon_reload: "{{ _probe_service_unit.changed or _probe_timer_unit.changed }}"
          when: not ansible_check_mode

    # Disabled: remove every artefact an earlier enable may have left, each on its own,
    # so an interrupted install or removal (a service unit without its timer, a last
    # metrics sample) is still cleaned up. Each privileged step runs only for an artefact
    # that exists, so a host that never ran the probe changes nothing and needs no sudo.
    - name: "Look for probe artefacts an earlier enable left on the host"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ _probe_host_artefacts }}"
      register: _probe_leftovers
      when: not (_probe_enabled | bool)

    - name: "Stop and disable a leftover probe timer"
      ansible.builtin.systemd_service:
        name: inference-probe.timer
        enabled: false
        state: stopped
      become: true
      when:
        - not (_probe_enabled | bool)
        - (_probe_unit_dir ~ '/inference-probe.timer') in _probe_present

    - name: "Remove each leftover probe artefact"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop: "{{ _probe_present }}"
      when: not (_probe_enabled | bool)

    - name: "Reload systemd after removing a probe unit"
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
      when:
        - not (_probe_enabled | bool)
        - _probe_present | select('search', '/inference-probe\\.(service|timer)$') | list | length > 0

    - name: "Remove the probe key file while the probe is disabled"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/probe/inference-probe.env"
        state: absent
      when: not (_probe_enabled | bool)

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start o11y"
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        # The inference probe's overlay adds node_exporter's textfile collector.
        # Empty when the probe is off, which is the pre-probe command line.
        COMPOSE_OVERLAYS: "{{ 'probe/compose.textfile.yml' if (o11y_inference_probe_enabled | default(false) | bool) else '' }}"
        # Operator lever (survey `deploy_force_recreate`, only the literal true): recreate even when every input
        # and image matches — clears a stale bind mount a running container still holds.
        FORCE_RECREATE: "{{ 'true' if ((deploy_force_recreate | default('false') | string | lower) == 'true') else '' }}"
      register: _deploy
      # deploy.sh recreates only when its inputs or images changed (common.sh
      # compose_up_if_changed) and says which on its own line.
      changed_when: "'DEPLOY_CHANGED=true' in _deploy.stdout_lines"
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
- name: "Phase 3: Verify o11y"
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    # A dry run skipped the deploy, so on a fresh host o11y-grafana does not exist and every
    # probe below would fail on it (PR 203 Codex review): check, and stop the dry run there.
    - name: "Dry run: does o11y-grafana exist yet?"
      ansible.builtin.command:
        argv: ["{{ _engine }}", inspect, "o11y-grafana"]
      register: _dry_container
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_check_mode

    - name: "Dry run, o11y-grafana not deployed yet: report"
      ansible.builtin.debug:
        msg: "check mode: o11y-grafana does not exist on this host yet; its verification (Grafana, Prometheus, Alloy, Loki) needs a real deploy."
      when:
        - ansible_check_mode
        - _dry_container.rc != 0

    - name: "Dry run, o11y-grafana not deployed yet: stop"
      ansible.builtin.meta: end_host
      when:
        - ansible_check_mode
        - _dry_container.rc != 0

    - name: "Grafana health (/api/health -> 200)"
      ansible.builtin.command: "{{ _engine }} exec o11y-grafana wget -q -O /dev/null http://127.0.0.1:3000/api/health"
      register: _gf
      changed_when: false
      retries: 6
      delay: 5
      until: _gf.rc == 0
      check_mode: false

    - name: "Prometheus ready (/-/ready)"
      ansible.builtin.command: "{{ _engine }} exec o11y-prometheus wget -q -O /dev/null http://127.0.0.1:9090/-/ready"
      register: _prom
      changed_when: false
      retries: 6
      delay: 5
      until: _prom.rc == 0
      check_mode: false

    - name: Read the receiver-host exporter runtime boundary
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - inspect
          - --format
          - >-
            {% raw %}{"pid_mode":{{json .HostConfig.PidMode}},"mounts":{{json .Mounts}},"ports":{{json .HostConfig.PortBindings}},"networks":{{json .NetworkSettings.Networks}}}{% endraw %}
          - o11y-node-exporter
      register: _receiver_host_runtime
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)

    - name: Require the receiver-host exporter to remain private and read-only
      ansible.builtin.assert:
        that:
          - (_receiver_host_runtime.stdout | from_json).pid_mode in [none, '', 'private']
          - (_receiver_host_runtime.stdout | from_json).ports is none or (_receiver_host_runtime.stdout | from_json).ports == {}
          - (_receiver_host_runtime.stdout | from_json).networks | length == 1
          - (_receiver_host_runtime.stdout | from_json).networks.keys() | first == 'o11y' or (_receiver_host_runtime.stdout | from_json).networks.keys() | first is search('_o11y$')
          - (_receiver_host_runtime.stdout | from_json).mounts | selectattr('Source', 'equalto', '/') | selectattr('Destination', 'equalto', '/host') | selectattr('RW', 'equalto', false) | list | length == 1
        fail_msg: "Receiver-host metrics are not isolated to the private Compose network with a read-only host root and no published port."
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)

    - name: Read receiver-host metrics from the private Prometheus API
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-prometheus
          - wget
          - -qO-
          - >-
            http://127.0.0.1:9090/api/v1/query?query=%7Bjob%3D%22receiver-host%22%2Cservice%3D%22o11y%2Freceiver-host%22%2C__name__%3D~%22node_cpu_seconds_total%7Cnode_memory_MemAvailable_bytes%7Cnode_memory_MemTotal_bytes%7Cnode_load1%7Cnode_filesystem_size_bytes%7Cnode_filesystem_avail_bytes%22%7D
      register: _receiver_host_metrics
      changed_when: false
      check_mode: false
      retries: 12
      delay: 5
      until: >-
        _receiver_host_metrics.rc == 0 and
        _receiver_host_metrics.stdout is search('node_memory_MemAvailable_bytes') and
        _receiver_host_metrics.stdout is search('node_filesystem_avail_bytes')
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)

    - name: Read guest-visible root filesystem size and free bytes
      ansible.builtin.command:
        argv: [df, --block-size=1, "--output=size,avail", /]
      register: _receiver_guest_root_df
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)

    - name: Verify receiver-host metrics and host-versus-guest root filesystem
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/verify-o11y-receiver-host-metrics.py"
        stdin: "{{ {'prometheus': _receiver_host_metrics.stdout, 'guest_df': _receiver_guest_root_df.stdout} | to_json }}"
      delegate_to: localhost
      register: _receiver_host_metrics_check
      changed_when: false
      failed_when: _receiver_host_metrics_check.rc != 0
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)

    # The deploy proves the probe is installed and that a sample THIS run forced reached
    # Prometheus for the configured model. It does NOT fail on a failed inference: that is
    # what the metric is for (its alert rule is task 3.2, still open).
    - name: Verify the synthetic inference probe after a real deploy
      when:
        - o11y_inference_probe_enabled | default(false) | bool
        - not ansible_check_mode
      vars:
        _probe_names: [inference_probe_success, inference_probe_latency_seconds, inference_probe_last_run_timestamp_seconds]
        _probe_query: >-
          {job="receiver-host",model_name="{{ o11y_inference_probe_model }}",__name__=~"{{ _probe_names | join('|') }}"}
      block:
        - name: Require the probe timer to be enabled and active
          ansible.builtin.command:
            argv: [systemctl, is-active, inference-probe.timer]
          register: _probe_timer_active
          changed_when: false
          failed_when: _probe_timer_active.stdout | trim != 'active'

        # Read on the host, whose clock also stamps the sample, before the forced run.
        - name: Record the host time before the forced probe sample
          ansible.builtin.command:
            argv: [date, +%s]
          register: _probe_started
          changed_when: false

        - name: Take one probe sample now instead of waiting for the timer
          ansible.builtin.command:
            argv: [systemctl, start, inference-probe.service]
          become: true
          changed_when: false

        # A series from an earlier run, or for another model, does not count: every probe
        # series must carry the configured model_name, and its last-run timestamp must be
        # no older than the forced sample's start.
        - name: Read the forced probe sample from the private Prometheus API
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-prometheus
              - wget
              - -qO-
              - "http://127.0.0.1:9090/api/v1/query?query={{ _probe_query | urlencode }}"
          register: _probe_metrics
          changed_when: false
          retries: 12
          delay: 5
          until: >-
            _probe_metrics.rc == 0 and
            ((_probe_metrics.stdout | from_json).data.result
             | selectattr('metric.model_name', 'defined')
             | selectattr('metric.model_name', 'equalto', o11y_inference_probe_model)
             | map(attribute='metric.__name__') | unique | sort | list) == (_probe_names | sort | list) and
            ((_probe_metrics.stdout | from_json).data.result
             | selectattr('metric.model_name', 'defined')
             | selectattr('metric.model_name', 'equalto', o11y_inference_probe_model)
             | selectattr('metric.__name__', 'equalto', 'inference_probe_last_run_timestamp_seconds')
             | map(attribute='value') | map('last') | map('float')
             | select('ge', _probe_started.stdout | trim | float) | list | length) > 0

        - name: Report the forced probe sample
          ansible.builtin.debug:
            msg: >-
              {% for r in (_probe_metrics.stdout | from_json).data.result %}{{ r.metric.__name__ }}{model_name={{ r.metric.model_name | default('') }}}={{ r.value[1] }} {% endfor %}

    - name: "Tempo ready (/ready) through the private compose network"
      ansible.builtin.command: "{{ _engine }} exec o11y-grafana wget -q -O /dev/null http://tempo:3200/ready"
      register: _tempo
      changed_when: false
      retries: 8
      delay: 5
      until: _tempo.rc == 0
      check_mode: false
      when: not ansible_check_mode

    - name: Read Tempo's effective metrics-generator configuration
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - curl -fsS http://tempo:3200/status/config
      # Tempo's status config can expose remote-storage credentials.
      register: _tempo_config
      no_log: true
      changed_when: false
      retries: 6
      delay: 5
      until: _tempo_config.rc == 0
      when: not ansible_check_mode

    - name: Require exactly one valid Tempo configuration and bounded metrics settings
      # Parse credential-bearing /status/config output in memory; never stage it as module input.
      ansible.builtin.assert:
        that: >-
          (_tempo_config.stdout
           | tempo_metrics_config_check(o11y_trace_derived_metrics_enabled | default(false) | bool)).valid
        fail_msg: >-
          Tempo's effective config readback failed validation. Sanitized checker result:
          {{ _tempo_config.stdout
             | tempo_metrics_config_check(o11y_trace_derived_metrics_enabled | default(false) | bool) }}
      when: not ansible_check_mode

    - name: "Pyroscope ready (/ready) through the private compose network"
      ansible.builtin.command: "{{ _engine }} exec o11y-grafana wget -q -O /dev/null http://pyroscope:4040/ready"
      register: _pyroscope_ready
      changed_when: false
      retries: 8
      delay: 5
      until: _pyroscope_ready.rc == 0
      when: not ansible_check_mode

    - name: Read the effective Pyroscope storage and retention configuration
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - curl -fsS http://pyroscope:4040/api/v1/status/config
      register: _pyroscope_config
      changed_when: false
      retries: 6
      delay: 5
      until: _pyroscope_config.rc == 0
      when: not ansible_check_mode

    - name: Require private persistent Pyroscope v2 storage and bounded retention
      ansible.builtin.assert:
        that:
          - (_pyroscope_config.stdout | from_yaml).architecture_storage == 'v2'
          - (_pyroscope_config.stdout | from_yaml).storage.backend == 'filesystem'
          - (_pyroscope_config.stdout | from_yaml).storage.filesystem.dir == '/data/storage'
          - (_pyroscope_config.stdout | from_yaml).limits.retention_period in ['168h', '1w']
          - (_pyroscope_config.stdout | from_yaml).metastore.index.cleanup_interval in ['15m', '15m0s']
          - (_pyroscope_config.stdout | from_yaml).self_profiling.disable_push | bool
        fail_msg: "Pyroscope's effective configuration does not match the committed persistent storage and seven-day retention policy."
      when: not ansible_check_mode

    - name: Read the provisioned Pyroscope datasource
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/datasources/uid/pyroscope
      register: _pyroscope_datasource_config
      changed_when: false
      no_log: true
      retries: 6
      delay: 5
      until: _pyroscope_datasource_config.rc == 0
      when: not ansible_check_mode

    - name: Require Grafana's private Pyroscope datasource URL
      ansible.builtin.assert:
        that:
          - (_pyroscope_datasource_config.stdout | from_json).type == 'grafana-pyroscope-datasource'
          - (_pyroscope_datasource_config.stdout | from_json).url == 'http://pyroscope:4040'
        fail_msg: "Grafana's live Pyroscope datasource does not point to the private service."
      when: not ansible_check_mode

    - name: Verify Grafana can proxy the private Pyroscope datasource
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS -o /dev/null --config -
            http://127.0.0.1:3000/api/datasources/proxy/uid/pyroscope/ready
      register: _pyroscope_datasource
      changed_when: false
      no_log: true
      retries: 6
      delay: 5
      until: _pyroscope_datasource.rc == 0
      when: not ansible_check_mode

    - name: Read the live Tempo datasource correlation settings
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/datasources/uid/tempo
      register: _tempo_datasource_config
      changed_when: false
      retries: 6
      delay: 5
      until: _tempo_datasource_config.rc == 0
      when: not ansible_check_mode

    - name: Require live Tempo trace-to-metric and trace-to-log mappings
      ansible.builtin.assert:
        that:
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToMetrics.datasourceUid == 'prometheus'
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToMetrics.tags | selectattr('key', 'equalto', 'service.name') | selectattr('value', 'equalto', 'service') | list | length == 1
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToMetrics.queries | selectattr('name', 'equalto', 'Span calls') | selectattr('query', 'equalto', 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))') | list | length == 1
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToLogsV2.datasourceUid == 'loki'
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToLogsV2.tags | selectattr('key', 'equalto', 'service.name') | selectattr('value', 'equalto', 'service') | list | length == 1
          - (_tempo_datasource_config.stdout | from_json).jsonData.serviceMap.datasourceUid == 'prometheus'
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToProfiles.datasourceUid == 'pyroscope'
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToProfiles.profileTypeId == 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
          - (_tempo_datasource_config.stdout | from_json).jsonData.tracesToProfiles.tags | selectattr('key', 'equalto', 'service.name') | selectattr('value', 'equalto', 'service_name') | list | length == 1
        fail_msg: "Grafana's live Tempo datasource is missing the committed trace correlation mappings."
      when: not ansible_check_mode

    - name: Read the live Loki datasource trace link
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/datasources/uid/loki
      register: _loki_datasource_config
      changed_when: false
      retries: 6
      delay: 5
      until: _loki_datasource_config.rc == 0
      when: not ansible_check_mode

    - name: Require the live Loki log-to-trace link
      ansible.builtin.assert:
        that:
          - (_loki_datasource_config.stdout | from_json).jsonData.derivedFields | selectattr('name', 'equalto', 'TraceID') | selectattr('datasourceUid', 'equalto', 'tempo') | list | length == 1
        fail_msg: "Grafana's live Loki datasource is missing the committed log-to-trace link."
      when: not ansible_check_mode

    - name: "Alloy healthy (collector config loaded)"
      ansible.builtin.command:
        argv: ["{{ _engine }}", inspect, --format, "{% raw %}{{.State.Health.Status}}{% endraw %}", o11y-alloy]
      register: _alloy_health
      changed_when: false
      check_mode: false
      retries: 8
      delay: 5
      until: _alloy_health.rc == 0 and _alloy_health.stdout == 'healthy'

    - name: "Reload Prometheus after remote scrape files change"
      ansible.builtin.uri:
        url: "http://{{ o11y_prom_bind | default('127.0.0.1') }}:{{ o11y_prom_port | default(9090) }}/-/reload"
        method: POST
        status_code: 200
      when:
        - not ansible_check_mode
        - >-
          (_dgx_scrape.changed | default(false)) or
          (_dgx_scrape_absent.changed | default(false)) or
          (_agentgateway_scrape.changed | default(false)) or
          (_agentgateway_scrape_absent.changed | default(false))

    - name: "Loki ready (/ready)"
      ansible.builtin.command: "{{ _engine }} exec o11y-loki wget -q -O /dev/null http://127.0.0.1:3100/ready"
      register: _loki
      changed_when: false
      retries: 8
      delay: 5
      until: _loki.rc == 0
      check_mode: false

    - name: Verify Grafana can query its provisioned data sources
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -sS --config - "http://127.0.0.1:3000/api/datasources/uid/$1/health"
          - datasource-health
          - "{{ item }}"
      loop: [prometheus, loki]
      register: _datasource_health
      changed_when: false
      retries: 6
      delay: 5
      until: _datasource_health.rc == 0 and (_datasource_health.stdout | from_json).status == 'OK'
      when: not ansible_check_mode

    # Grafana's plugin health endpoint is optional. Tempo in the pinned Grafana
    # version returns a JSON response without `status`, even while Tempo is ready.
    # A proxied /ready request proves the provisioned datasource routes to Tempo.
    - name: Verify Grafana can proxy the Tempo datasource
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS -o /dev/null --config -
            http://127.0.0.1:3000/api/datasources/proxy/uid/tempo/ready
      register: _tempo_datasource
      changed_when: false
      retries: 6
      delay: 5
      until: _tempo_datasource.rc == 0
      when: not ansible_check_mode

    - name: Read the provisioned o11y self-monitoring dashboard
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/dashboards/uid/o11y-self-monitoring
      register: _self_dashboard
      changed_when: false
      retries: 6
      delay: 5
      until: _self_dashboard.rc == 0
      when: not ansible_check_mode

    - name: Require the committed self-monitoring dashboard to be active
      ansible.builtin.assert:
        that:
          - (_self_dashboard.stdout | from_json).dashboard.uid == 'o11y-self-monitoring'
          - (_self_dashboard.stdout | from_json).dashboard.panels | length >= 11
          - (_self_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'O11y components up (expected 7)') | list | length == 1
          - (_self_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Tempo spans / sec') | list | length == 1
          - (_self_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Tempo trace bytes / sec') | list | length == 1
          - "'tempo_distributor_spans_received_total' in (_self_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Tempo spans / sec') | map(attribute='targets') | flatten | map(attribute='expr') | join(' ')"
          - "'tempo_distributor_bytes_received_total' in (_self_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Tempo trace bytes / sec') | map(attribute='targets') | flatten | map(attribute='expr') | join(' ')"
          - (_self_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Profile samples written / sec') | list | length == 1
        fail_msg: "Grafana has a stale or incomplete o11y dashboard; redeploy must provision all seven scrape targets and signal-ingestion panels."
      when: not ansible_check_mode

    - name: Read the provisioned agentgateway traffic dashboard
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/dashboards/uid/agentgateway-traffic
      register: _agentgateway_dashboard
      changed_when: false
      retries: 6
      delay: 5
      until: _agentgateway_dashboard.rc == 0
      when: not ansible_check_mode

    - name: Require the committed agentgateway traffic dashboard to be active
      ansible.builtin.assert:
        that:
          - (_agentgateway_dashboard.stdout | from_json).dashboard.uid == 'agentgateway-traffic'
          - (_agentgateway_dashboard.stdout | from_json).dashboard.title == 'Agentgateway operations'
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | length == 14
          - (_agentgateway_dashboard.stdout | from_json).dashboard.templating.list | selectattr('name', 'equalto', 'identity') | list | length == 1
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'LLM tokens by identity, model, and token type') | list | length == 1
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Rejected access records (reason pending sample)') | list | length == 1
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Rate-limited requests (429)') | list | length == 1
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Agentgateway build') | list | length == 1
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Recent access records') | list | length == 1
          - (_agentgateway_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Recent agentgateway traces') | list | length == 1
        fail_msg: "Grafana did not provision the complete Agentgateway operations dashboard."
      when: not ansible_check_mode

    - name: Read the provisioned agentgateway client-view dashboard
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/dashboards/uid/agentgateway-client-view
      register: _agentgateway_client_dashboard
      changed_when: false
      retries: 6
      delay: 5
      until: _agentgateway_client_dashboard.rc == 0
      when: not ansible_check_mode

    - name: Require the committed agentgateway client-view dashboard to be active
      ansible.builtin.assert:
        that:
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.uid == 'agentgateway-client-view'
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.title == 'Agentgateway client view'
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.panels | length == 6
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.templating.list | selectattr('name', 'equalto', 'identity') | list | length == 1
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'First-token latency p50') | list | length == 1
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'First-token latency p95') | list | length == 1
          - (_agentgateway_client_dashboard.stdout | from_json).dashboard.panels | selectattr('title', 'equalto', 'Request duration p95 (HTTP and model)') | list | length == 1
        fail_msg: "Grafana did not provision the complete Agentgateway client-view dashboard."
      when: not ansible_check_mode

    # Every committed dashboard file must be live by its own uid: the asserts above
    # check three dashboards' contents, this checks that none of the rest is missing.
    - name: Verify every provisioned dashboard is live
      when: not ansible_check_mode
      block:
        - name: Find the provisioned dashboard files
          ansible.builtin.find:
            paths: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}/{{ monorepo_deploy_path }}/config/grafana/dashboards"
            patterns: "*.json"
          register: _dashboard_files

        - name: Read the provisioned dashboard files
          ansible.builtin.slurp:
            src: "{{ item.path }}"
          loop: "{{ _dashboard_files.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          register: _dashboard_docs

        - name: Read live Grafana dashboards
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-grafana
              - sh
              - -c
              - >-
                printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
                curl -fsS --config - 'http://127.0.0.1:3000/api/search?type=dash-db&limit=5000'
          register: _live_dashboards
          changed_when: false
          retries: 6
          delay: 5
          until: _live_dashboards.rc == 0

        - name: Require every provisioned dashboard uid to be live
          ansible.builtin.assert:
            that:
              - _dashboard_expected_uids | length > 0
              - _dashboard_expected_uids | length == _dashboard_files.files | length
              - _dashboard_expected_uids | unique | length == _dashboard_expected_uids | length
              - _dashboard_expected_uids | difference(_live_dashboards.stdout | from_json | map(attribute='uid') | list) | length == 0
            fail_msg: >-
              Provisioned dashboards missing from Grafana:
              {{ _dashboard_expected_uids | difference(_live_dashboards.stdout | from_json | map(attribute='uid') | list) }}
          vars:
            _dashboard_expected_uids: >-
              {{ _dashboard_docs.results | map(attribute='content') | map('b64decode')
                 | map('from_json') | map(attribute='uid') | select | list }}

    - name: Verify enabled Grafana alert provisioning after a real deploy
      when:
        - o11y_alerts_enabled | default(false) | bool
        - not ansible_check_mode
      block:
        - name: Read live o11y alert rules
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-grafana
              - sh
              - -c
              - >-
                printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
                curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules
          register: _active_rules
          changed_when: false
          retries: 6
          delay: 5
          until: _active_rules.rc == 0

        # The expected o11y_ rules are the ones in the file Grafana provisioned from (Phase 1
        # rendered it into the placed checkout), so a rule added to the template is checked
        # without editing this list, and a rule the file withdraws must be gone.
        - name: Read the provisioned alert rules file
          ansible.builtin.slurp:
            src: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}/{{ monorepo_deploy_path }}/config/grafana/provisioning/alerting/observability.yml"
          register: _provisioned_rules_file

        # Rule groups are scoped by folder UID, so resolve the provisioned folder titles.
        # /api/folders returns [{uid, title}]; provisioned rules carry folderUID and
        # ruleGroup (Grafana 11.4 alerting OpenAPI, ProvisionedAlertRule:
        # https://raw.githubusercontent.com/grafana/grafana/v11.4.0/pkg/services/ngalert/api/tooling/api.json).
        - name: Read live Grafana folders
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-grafana
              - sh
              - -c
              - >-
                printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
                curl -fsS --config - 'http://127.0.0.1:3000/api/folders?limit=1000'
          register: _live_folders
          changed_when: false

        # The live set must MIRROR the provisioned file: the rules Grafana holds in the
        # file's folder+group scope are exactly the file's rules, each paused and routed
        # field by field as rendered. A uid-prefix filter once let a deploy pass without
        # reading the inference rules back at all (docs/MISTAKES.md 1.21).
        - name: Scope live rules to the provisioned folders and groups
          ansible.builtin.set_fact:
            _o11y_expected_rules: "{{ _o11y_provisioned.groups | default([]) | map(attribute='rules') | flatten | sort(attribute='uid') }}"
            _o11y_withdrawn_uids: "{{ _o11y_provisioned.deleteRules | default([]) | map(attribute='uid') | list }}"
            _o11y_rules: >-
              {{ _active_rules.stdout | from_json
                 | selectattr('folderUID', 'in', _o11y_folder_uids)
                 | selectattr('ruleGroup', 'in', _o11y_provisioned.groups | default([]) | map(attribute='name') | list)
                 | sort(attribute='uid') }}
          vars:
            _o11y_provisioned: "{{ _provisioned_rules_file.content | b64decode | from_yaml }}"
            _o11y_folder_uids: >-
              {{ _live_folders.stdout | from_json
                 | selectattr('title', 'in', _o11y_provisioned.groups | default([]) | map(attribute='folder') | list)
                 | map(attribute='uid') | list }}

        - name: Require the live rule set to equal the provisioned rules
          ansible.builtin.assert:
            that:
              - _o11y_expected_rules | length > 0
              - _o11y_rules | map(attribute='uid') | list == _o11y_expected_rules | map(attribute='uid') | list
              - _o11y_rules | selectattr('uid', 'equalto', 'o11y_service_down') | selectattr('isPaused', 'defined') | selectattr('isPaused', 'equalto', false) | list | length == 1
              - _active_rules.stdout | from_json | map(attribute='uid') | select('in', _o11y_withdrawn_uids) | list | length == 0
            fail_msg: "Live Grafana alert rules do not match the provisioned rules file (missing, extra or withdrawn)."

        # Same uid order on both sides (asserted above), so each field compares rule by
        # rule; an absent or null notification_settings, or field, compares as ''. The
        # durations are strings in the 11.4 AlertRuleNotificationSettings schema.
        - name: Require each live rule's pause and routing to equal the provisioned rule's
          ansible.builtin.assert:
            that:
              - _o11y_rules | map(attribute='isPaused', default='') | list == _o11y_expected_rules | map(attribute='isPaused', default='') | list
              - _live_settings | map(attribute=item, default='') | list == _file_settings | map(attribute=item, default='') | list
            fail_msg: "Live Grafana rules differ from the provisioned file in isPaused or notification_settings.{{ item }}."
          vars:
            _live_settings: "{{ _o11y_rules | map(attribute='notification_settings', default={}) | map('default', {}, true) | list }}"
            _file_settings: "{{ _o11y_expected_rules | map(attribute='notification_settings', default={}) | map('default', {}, true) | list }}"
          loop:
            - receiver
            - group_by
            - group_wait
            - group_interval
            - repeat_interval
            - mute_time_intervals

        - name: Read live Grafana contact points without displaying webhook settings
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-grafana
              - sh
              - -c
              - >-
                printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
                curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/contact-points
          register: _active_contacts
          changed_when: false
          no_log: true

        - name: Count only the intended contact point without its settings
          ansible.builtin.set_fact:
            _o11y_contact_count: >-
              {{ _active_contacts.stdout | from_json |
                 selectattr('uid', 'equalto', 'o11y_ops_discord') | list | length }}
          no_log: true

        - name: Require the o11y Discord contact point to be active
          ansible.builtin.assert:
            that: _o11y_contact_count | int == 1
            fail_msg: "The o11y Discord contact point is absent or duplicated after alert enablement."

    - name: "Report"
      ansible.builtin.debug:
        msg: "o11y healthy — Grafana, Prometheus, Loki, and Tempo answering; Alloy collector healthy."
