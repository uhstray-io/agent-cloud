---
# deploy-o11y.yml — observability stack (Grafana+Prometheus+Loki+Alloy) deploy.
#
# Phase 1: Place repo + manage-secrets (Grafana admin password from OpenBao) +
#          template .env. The committed config/ (scrape/loki/alloy/grafana
#          provisioning) travels with the repo.
# Phase 2: deploy.sh — container lifecycle (pull, up, wait Grafana healthy;
#          datasources + dashboards provision on boot).
# Phase 3: Verify service health and, when enabled, live Grafana alert state.
#
# Plan: plan/development/O11Y-DEPLOYMENT.md.

- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Verify the controller checkout before a candidate deploy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the controller checkout revision when a candidate SHA is required
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false
      when: expected_repository_sha is defined

    - name: Require the exact reviewed candidate revision
      ansible.builtin.assert:
        that: _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different revision; no o11y files were placed."
        success_msg: "Semaphore checkout matches {{ expected_repository_sha }}."
      when: expected_repository_sha is defined

    - name: Read candidate checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false
      when: expected_repository_sha is defined

    - name: Require a clean candidate checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "Candidate checkout has uncommitted files; no o11y files were placed."
      when: expected_repository_sha is defined

# ── Phase 1: Place repo + secrets + env ─────────────────────────────────────
- name: "Phase 1: Place repo + manage o11y secrets"
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars_files:
    - vars/secret-declarations/o11y.yml
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _auth_edge_hosts: "{{ groups['caddy_svc'] | default([]) }}"
    _auth_edge_ip: "{{ hostvars[_auth_edge_hosts[0]].ansible_host | default('') if _auth_edge_hosts | length == 1 else '' }}"
    # OIDC client secret is owned by authentik (the IdP); read it here so
    # Grafana's generic_oauth secret matches the provider blueprint.
    _shared_reads:
      - { from_service: authentik, read_keys: [grafana_oidc_client_secret] }
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }

  tasks:
    - name: "Require the production DNS zone and Caddy origin before rendering Grafana OIDC"
      ansible.builtin.assert:
        that:
          - o11y_zone is defined
          - o11y_zone | default('') is match('^[a-z0-9.-]+$')
          - o11y_zone != 'agent-cloud.test'
          - _auth_edge_hosts | length == 1
          - _auth_edge_ip is match('^[0-9]+(\\.[0-9]+){3}$')
        fail_msg: "Production o11y needs its declared DNS zone and one Caddy origin IP; local test URLs are refused."
      when: not (local_mode | default(false) | bool)

    - name: "Inspect an unfinished production alert canary"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/scrape.d/o11y-prod-canary.yml"
      register: _unfinished_prod_canary
      when: not (local_mode | default(false) | bool)

    - name: "Inspect an unfinished production alert restoration"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/.o11y-alert-canary-active"
      register: _unfinished_prod_restore
      when: not (local_mode | default(false) | bool)

    - name: "Refuse a normal deploy while the production canary needs restoration"
      ansible.builtin.assert:
        that:
          - not _unfinished_prod_canary.stat.exists
          - not _unfinished_prod_restore.stat.exists
        fail_msg: "Production canary restoration is unfinished; run Restore o11y Alert Baseline (Dev) before deploying."
      when: not (local_mode | default(false) | bool)

    - name: "Require complete DGX scrape settings when scraping is enabled"
      ansible.builtin.assert:
        that:
          - dgx_spark_nodes | default([]) | length > 0
          - dgx_spark_head_address is defined
          - dgx_spark_head_name is defined
          - dgx_spark_node_exporter_port is defined
          - dgx_spark_api_port is defined
          - not (dgx_spark_gpu_exporter_enabled | default(false) | bool) or dgx_spark_gpu_exporter_port is defined
        fail_msg: "DGX scrape inventory needs the head address/name and enabled collector ports."
      when: dgx_spark_scrape_enabled | default(false) | bool

    - name: "Require a complete declared agentgateway stats endpoint"
      ansible.builtin.assert:
        that:
          - groups.get('agentgateway_svc', []) | length == 1
          - agentgateway_metrics_address | default('') is match('^[A-Za-z0-9.-]+$')
          - agentgateway_metrics_port is defined
          - agentgateway_metrics_port | int > 0
          - agentgateway_metrics_port | int < 65536
        fail_msg: "agentgateway metrics need a declared receiver-reachable address and port."
      when: agentgateway_metrics_address is defined or agentgateway_metrics_port is defined

    - name: "Require the receiver target to match the gateway's published stats listener"
      ansible.builtin.assert:
        that:
          - agentgateway_metrics_address == hostvars[groups['agentgateway_svc'][0]].agw_stats_bind
          - agentgateway_metrics_port | int == hostvars[groups['agentgateway_svc'][0]].agw_stats_port | int
        fail_msg: "The receiver's gateway scrape target differs from the gateway's declared stats bind."
      when: agentgateway_metrics_address is defined or agentgateway_metrics_port is defined

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: Read the placed revision when a candidate SHA is required
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ _monorepo_dir }}"
      register: _placed_revision
      changed_when: false
      check_mode: false
      # Proves what THIS run placed; a dry run places nothing.
      when:
        - not ansible_check_mode
        - expected_repository_sha is defined
        - not (local_mode | default(false) | bool)

    - name: Refuse a receiver checkout that differs from the reviewed candidate
      ansible.builtin.assert:
        that: _placed_revision.stdout == expected_repository_sha
        fail_msg: "Receiver checkout differs from the reviewed o11y candidate; no secrets or containers were changed."
      when:
        - not ansible_check_mode
        - expected_repository_sha is defined
        - not (local_mode | default(false) | bool)

    - name: "Configure o11y alert provisioning from OpenBao"
      ansible.builtin.include_tasks: tasks/o11y-alert-provision.yml

    - name: "Render DGX scrape targets only after source proof enables scraping"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/o11y/deployment/templates/scrape-dgx-spark.yml.j2"
        dest: "{{ _deploy_dir }}/config/scrape.d/dgx-spark.yml"
        mode: "0644"
      register: _dgx_scrape
      when: dgx_spark_scrape_enabled | default(false) | bool

    - name: "Remove DGX scrape targets while scraping is disabled"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config/scrape.d/dgx-spark.yml"
        state: absent
      register: _dgx_scrape_absent
      when: not (dgx_spark_scrape_enabled | default(false) | bool)

    - name: "Render the agentgateway scrape only when inventory declares it"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/o11y/deployment/templates/scrape-agentgateway.yml.j2"
        dest: "{{ _deploy_dir }}/config/scrape.d/agentgateway.yml"
        mode: "0644"
      register: _agentgateway_scrape
      when: agentgateway_metrics_address is defined

    - name: "Remove the agentgateway scrape when inventory does not declare it"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config/scrape.d/agentgateway.yml"
        state: absent
      register: _agentgateway_scrape_absent
      when: agentgateway_metrics_address is not defined

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start o11y"
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
      register: _deploy
      changed_when: true
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
- name: "Phase 3: Verify o11y"
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    # A dry run skipped the deploy, so on a fresh host o11y-grafana does not exist and every
    # probe below would fail on it (PR 203 Codex review): check, and stop the dry run there.
    - name: "Dry run: does o11y-grafana exist yet?"
      ansible.builtin.command:
        argv: ["{{ _engine }}", inspect, "o11y-grafana"]
      register: _dry_container
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_check_mode

    - name: "Dry run, o11y-grafana not deployed yet: report"
      ansible.builtin.debug:
        msg: "check mode: o11y-grafana does not exist on this host yet; its verification (Grafana, Prometheus, Alloy, Loki) needs a real deploy."
      when:
        - ansible_check_mode
        - _dry_container.rc != 0

    - name: "Dry run, o11y-grafana not deployed yet: stop"
      ansible.builtin.meta: end_host
      when:
        - ansible_check_mode
        - _dry_container.rc != 0

    - name: "Grafana health (/api/health -> 200)"
      ansible.builtin.command: "{{ _engine }} exec o11y-grafana wget -q -O /dev/null http://127.0.0.1:3000/api/health"
      register: _gf
      changed_when: false
      retries: 6
      delay: 5
      until: _gf.rc == 0
      check_mode: false

    - name: "Prometheus ready (/-/ready)"
      ansible.builtin.command: "{{ _engine }} exec o11y-prometheus wget -q -O /dev/null http://127.0.0.1:9090/-/ready"
      register: _prom
      changed_when: false
      retries: 6
      delay: 5
      until: _prom.rc == 0
      check_mode: false

    - name: "Alloy healthy (collector config loaded)"
      ansible.builtin.command:
        argv: ["{{ _engine }}", inspect, --format, "{% raw %}{{.State.Health.Status}}{% endraw %}", o11y-alloy]
      register: _alloy_health
      changed_when: false
      check_mode: false
      retries: 8
      delay: 5
      until: _alloy_health.rc == 0 and _alloy_health.stdout == 'healthy'

    - name: "Reload Prometheus after remote scrape files change"
      ansible.builtin.uri:
        url: "http://{{ o11y_prom_bind | default('127.0.0.1') }}:{{ o11y_prom_port | default(9090) }}/-/reload"
        method: POST
        status_code: 200
      when:
        - not ansible_check_mode
        - >-
          (_dgx_scrape.changed | default(false)) or
          (_dgx_scrape_absent.changed | default(false)) or
          (_agentgateway_scrape.changed | default(false)) or
          (_agentgateway_scrape_absent.changed | default(false))

    - name: "Loki ready (/ready)"
      ansible.builtin.command: "{{ _engine }} exec o11y-loki wget -q -O /dev/null http://127.0.0.1:3100/ready"
      register: _loki
      changed_when: false
      retries: 8
      delay: 5
      until: _loki.rc == 0
      check_mode: false

    - name: Verify enabled Grafana alert provisioning after a real deploy
      when:
        - o11y_alerts_enabled | default(false) | bool
        - not ansible_check_mode
      block:
        - name: Read live o11y alert rules
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-grafana
              - sh
              - -c
              - >-
                printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
                curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules
          register: _active_rules
          changed_when: false
          retries: 6
          delay: 5
          until: _active_rules.rc == 0

        - name: Require the service-down rule and every o11y rule to be active
          ansible.builtin.assert:
            that:
              - _o11y_rules | selectattr('uid', 'equalto', 'o11y_service_down') | list | length == 1
              - _o11y_rules | selectattr('isPaused', 'defined') | selectattr('isPaused', 'equalto', false) | list | length == _o11y_rules | length
            fail_msg: "Grafana has missing or paused o11y rules after alert enablement."
          vars:
            _o11y_rules: "{{ _active_rules.stdout | from_json | selectattr('uid', 'match', '^o11y_') | list }}"

        - name: Read live Grafana contact points without displaying webhook settings
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - o11y-grafana
              - sh
              - -c
              - >-
                printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
                curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/contact-points
          register: _active_contacts
          changed_when: false
          no_log: true

        - name: Count only the intended contact point without its settings
          ansible.builtin.set_fact:
            _o11y_contact_count: >-
              {{ _active_contacts.stdout | from_json |
                 selectattr('uid', 'equalto', 'o11y_ops_discord') | list | length }}
          no_log: true

        - name: Require the o11y Discord contact point to be active
          ansible.builtin.assert:
            that: _o11y_contact_count | int == 1
            fail_msg: "The o11y Discord contact point is absent or duplicated after alert enablement."

    - name: "Report"
      ansible.builtin.debug:
        msg: "o11y healthy — Grafana, Prometheus, and Loki all answering (Grafana behind Caddy for TLS)."
