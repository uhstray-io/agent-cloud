---
# deploy-plane.yml — Plane work tracker, Commercial edition (composable).
#
# Phase 0: Fetch Plane's setup files for the pinned release on the controller and verify each
#          against its sha256 (fetch_setup.py). Plane's EULA forbids redistributing them, so
#          they are never committed (design.md, spike 0.1).
# Phase 1: Place repo, place the fetched docker-compose.yml as compose.yml, manage-secrets
#          (every credential generated once into OpenBao and reused) and render .env from
#          Plane's variables.env with agent-cloud's values (templates/env.j2).
# Phase 2: deploy.sh — container lifecycle with compose.agentcloud.yml always applied.
# Phase 3: First-run configuration (configure_instance.py, inside plane-api): instance setup,
#          invitation-only sign-up and the workspace. In the SAME run as the first start,
#          because until the first admin signs up anyone who reaches /god-mode/ claims it.
# Phase 3b: Get or create the workspace service token (service_token.py) and store it in
#          OpenBao, so sync-plane-projects.yml only ever reads it.
# Phase 4: Verify through the proxy, then record the service-deploy step result.
#
# Plan: plan/development/16-plane-work-management.md
# Change: plan/development/openspec/changes/deploy-plane-work-management/

- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Pre-flight: target group is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: plane_svc
    preflight_group_expected: plane_svc

# ── Phase 0: Fetch and verify the release's setup files (controller) ─────────
- name: "Phase 0: Fetch Plane's setup files"
  hosts: plane_svc
  gather_facts: false
  become: false
  vars:
    _plane_version: "{{ plane_version | default('v3.3.3') }}"
    # Per-file sha256, NOT the zip's: the endpoint stamps entry dates per request (spike 0.1).
    # Moving to another release is a reviewed change here, with the digests read from that
    # release's files.
    _plane_setup_pins:
      v3.3.3:
        compose: ec74ea1b7e1998b81119ce737c971b514292474015b34b4b5fc921f137796872
        variables: fa45732e0c2d36c3e3f9920aaef21314da0c785c793dc929117582e250b3afed
  tasks:
    - name: "Refuse a release without pinned digests"
      ansible.builtin.assert:
        that: _plane_version in _plane_setup_pins
        fail_msg: "plane_version {{ _plane_version }} has no pinned sha256 in deploy-plane.yml; pin it before deploying."
        quiet: true

    # A read: verifies both files in memory and prints them; writes nothing anywhere, so a
    # dry run fetches and verifies for real.
    - name: "Fetch and verify docker-compose.yml and variables.env"  # noqa: run-once[task] — one fetch serves every host
      ansible.builtin.command:
        argv:
          - python3
          - -I
          - "{{ playbook_dir }}/../services/plane/deployment/fetch_setup.py"
          - "{{ _plane_version }}"
          - "{{ _plane_setup_pins[_plane_version].compose }}"
          - "{{ _plane_setup_pins[_plane_version].variables }}"
      register: _plane_setup_fetch
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false

    - name: "Keep the verified files"
      ansible.builtin.set_fact:
        _plane_setup: "{{ _plane_setup_fetch.stdout | from_json }}"

# ── Phase 1: Place repo + Compose file + secrets + .env ─────────────────────
- name: "Phase 1: Place repo + manage plane secrets"
  hosts: plane_svc
  gather_facts: false
  become: false
  vars:
    # Plane's overlays use compose's `!override` / `!reset` merge tags, which Ubuntu 24.04's apt
    # podman-compose (1.0.6) cannot read; 1.6.0 is the release the stack is proven on locally.
    # tasks/install-podman-compose.yml installs it by hash (Joseph, 2026-10-31).
    podman_compose_version: "1.6.0"
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _plane_version: "{{ plane_version | default('v3.3.3') }}"
    _plane_public_url: "{{ plane_public_url }}"
    # Every value is STATEFUL: generated once into OpenBao and reused. Regenerating
    # plane_secret_key ends every session; the datastore passwords lock the app out of its
    # volumes; plane_machine_signature is what the licence binds to (spike 0.2).
    _secret_definitions:
      - { name: plane_secret_key, type: django, length: 50 }
      - { name: plane_live_server_secret_key, type: random, length: 40 }
      - { name: plane_silo_hmac_secret_key, type: random, length: 40 }
      - { name: plane_aes_secret_key, type: random, length: 32 }
      - { name: plane_pi_internal_secret, type: random, length: 40 }
      - { name: plane_cursor_webhook_secret, type: random, length: 40 }
      - { name: plane_db_password, type: random, length: 32 }
      - { name: plane_rabbitmq_password, type: random, length: 32 }
      - { name: plane_minio_password, type: random, length: 32 }
      - { name: plane_machine_signature, type: random, length: 32 }
      # The first instance admin, used only by this playbook's configuration phase.
      - { name: plane_automation_password, type: random, length: 32 }
    # The OIDC client secret is owned by authentik (blueprints/plane-oidc.yaml injects it from
    # the worker's env). Read it read-only, and only when sign-in through Authentik is configured
    # (plane_authentik_base), so a host without OIDC never depends on Deploy Authentik having
    # declared it. Never stored back under secret/services/plane.
    _shared_reads: >-
      {{ [{'from_service': 'authentik', 'read_keys': ['plane_oidc_client_secret']}]
         if plane_authentik_base is defined else [] }}
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }
    _service_url: "{{ plane_public_url | default('') }}"

  tasks:
    # manage-secrets sends the controller AppRole and receives every secret over this
    # connection — refuse a public cleartext endpoint before any of it is sent.
    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Place Plane's verified Compose file as compose.yml"
      ansible.builtin.copy:
        content: "{{ _plane_setup['docker-compose.yml'] }}"
        dest: "{{ _deploy_dir }}/compose.yml"
        mode: "0644"

    - name: "Manage secrets and render .env"
      ansible.builtin.include_tasks: tasks/manage-secrets.yml

    # Plane's API exchanges the OIDC code and reads userinfo server-side, at the IdP's
    # https://auth.<zone>:8443 (a step-ca-minted leaf), so it must trust the step-ca chain.
    # compose.local-ca.yml mounts the COMBINED bundle (step-ca plus the host's public roots) and
    # sets REQUESTS_CA_BUNDLE, which replaces the API's whole trust store. Local-only.
    - name: "Distribute the step-ca root for OIDC TLS trust (local)"
      ansible.builtin.include_tasks: tasks/distribute-ca-root.yml
      vars:
        _ca_root_dest_dir: "{{ _deploy_dir }}"
        _ca_root_combined_dest: "{{ _deploy_dir }}/certs/ca-bundle-combined.crt"
        _ca_engine: "{{ container_engine | default('podman') }}"
      when: local_mode | default(false) | bool

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start plane"
  hosts: plane_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
        FORCE_RECREATE: "{{ 'true' if ((deploy_force_recreate | default('false') | string | lower) == 'true') else '' }}"
      register: _deploy
      changed_when: "'DEPLOY_CHANGED=true' in _deploy.stdout_lines"
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: First-run configuration ────────────────────────────────────────
- name: "Phase 3: Configure plane"
  hosts: plane_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    # Sign-in through Authentik (blueprints/plane-oidc.yaml), set when the inventory names the
    # IdP, and switched OFF when it does not, so removing plane_authentik_base is the kill switch.
    # Self sign-up stays off, so OIDC signs in only people holding a workspace invitation.
    _plane_oidc_settings: >-
      {{ {'IS_OIDC_ENABLED': '0'} if plane_authentik_base is not defined else {
           'IS_OIDC_ENABLED': '1',
           'OIDC_PROVIDER_NAME': 'Authentik',
           'OIDC_CLIENT_ID': 'plane',
           'OIDC_CLIENT_SECRET': _shared.plane_oidc_client_secret,
           'OIDC_AUTHORIZE_URL': plane_authentik_base ~ '/application/o/authorize/',
           'OIDC_TOKEN_URL': plane_authentik_base ~ '/application/o/token/',
           'OIDC_USERINFO_URL': plane_authentik_base ~ '/application/o/userinfo/'} }}

  tasks:
    # Credential task: the admin password goes to the script on stdin, so no_log here and
    # only the non-secret summary is shown below.
    - name: "Converge instance setup, invitation-only sign-up and the workspace"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - -i
          - plane-api
          - python
          - -c
          - "{{ lookup('file', playbook_dir ~ '/../services/plane/deployment/plane_session.py') ~ '\n' ~ lookup('file', playbook_dir ~ '/../services/plane/deployment/configure_instance.py') }}"
        stdin: >-
          {{ {'base': 'http://localhost:8000',
              'host': plane_public_url | urlsplit('hostname'),
              'origin': plane_public_url,
              'email': plane_automation_email,
              'password': _resolved.plane_automation_password,
              'first_name': 'Plane', 'last_name': 'Automation',
              'company': plane_company_name,
              'workspace_slug': plane_workspace_slug,
              'workspace_name': plane_workspace_name,
              'settings': _plane_oidc_settings} | to_json }}
      register: _plane_configure
      # The script prints one JSON line, {"changed", "actions"} or {"error"}, never a credential.
      # Judged below from that line, so a refusal is visible while this task stays no_log.
      changed_when: ((_plane_configure.stdout_lines | default(['{}']) | last) | from_json).changed | default(false) | bool
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: "Keep only the configuration summary"
      ansible.builtin.set_fact:
        _plane_configure_summary: >-
          {{ (_plane_configure.stdout_lines | last | from_json)
             if (_plane_configure.stdout_lines | default([]) | length > 0
                 and (_plane_configure.stdout_lines | last).startswith('{'))
             else {'error': 'the configuration script printed no summary (exit ' ~ _plane_configure.rc ~ ')'} }}
      no_log: true
      when: not ansible_check_mode

    - name: "First-run configuration succeeded"
      ansible.builtin.assert:
        that:
          - _plane_configure.rc == 0
          - _plane_configure_summary.error is not defined
        fail_msg: "plane first-run configuration failed: {{ _plane_configure_summary.error | default('exit ' ~ _plane_configure.rc) }}"
        quiet: true
      when: not ansible_check_mode

    - name: "Show the configuration summary"
      ansible.builtin.debug:
        msg: "{{ _plane_configure_summary.actions | default([]) or ['instance, sign-up and workspace already in place'] }}"
      when: not ansible_check_mode

    # deploy.sh held the proxy (the only way in) while the instance was not set up. Setup is
    # done now, so run it again: the missing proxy is a change, and its staged start opens it.
    - name: "Start the proxy now that the instance is set up"
      ansible.builtin.shell: |
        cd "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}/{{ monorepo_deploy_path }}"
        bash deploy.sh --no-pull
      environment:
        CONTAINER_ENGINE: "{{ _engine }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
      register: _deploy_proxy
      changed_when: "'DEPLOY_CHANGED=true' in _deploy_proxy.stdout_lines"
      failed_when: _deploy_proxy.rc != 0 or 'PLANE_PROXY_HELD=true' in _deploy_proxy.stdout_lines
      when:
        - not ansible_check_mode
        - "'PLANE_PROXY_HELD=true' in (_deploy.stdout_lines | default([]))"

# ── Phase 3b: Workspace service token ───────────────────────────────────────
# The token sync-plane-projects.yml uses for Plane's /api/v1. Plane's route is get-or-create
# (POST only), so minting belongs in this write playbook: the sync only reads it from OpenBao,
# and its dry run therefore never creates a credential. It is workspace-wide and does not
# expire; Plane hands back the same token every deploy, so the store write happens once.
# Plane has NO route to revoke a service token: its token delete and list skip service tokens
# (app/views/api/base.py, app/views/api/workspace.py in the v3.3.3 image). Revocation is an open
# follow-up (change task 4.4); until then the token lives as long as the workspace.
- name: "Phase 3b: Workspace service token"
  hosts: plane_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Mint and store the service token (skipped in check mode: it writes)"
      when: not ansible_check_mode
      block:
        - name: "Refuse a cleartext OpenBao endpoint"
          ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
          vars:
            _assert_bao_url: "{{ _bao_url }}"

        - name: "Get or create the workspace service token (inside plane-api)"
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - -i
              - plane-api
              - python
              - -c
              - "{{ lookup('file', playbook_dir ~ '/../services/plane/deployment/plane_session.py') ~ '\n' ~ lookup('file', playbook_dir ~ '/../services/plane/deployment/service_token.py') }}"
            stdin: >-
              {{ {'base': 'http://localhost:8000',
                  'host': plane_public_url | urlsplit('hostname'),
                  'origin': plane_public_url,
                  'email': plane_automation_email,
                  'password': _resolved.plane_automation_password,
                  'workspace_slug': plane_workspace_slug} | to_json }}
          register: _plane_token_run
          changed_when: false  # Plane's own create is reported below; the store write is the change here
          failed_when: false
          no_log: true

        - name: "Keep the token and a summary without it"
          ansible.builtin.set_fact:
            _plane_token: >-
              {%- set last = _plane_token_run.stdout_lines | default([''], true) | last -%}
              {{ (last | from_json).token | default('') if last.startswith('{') else '' }}
            _plane_token_summary: >-
              {%- set last = _plane_token_run.stdout_lines | default([''], true) | last -%}
              {%- set d = (last | from_json) if last.startswith('{') else {'error': 'the token script printed no summary (exit ' ~ _plane_token_run.rc ~ ')'} -%}
              {{ {'error': d.error} if d.error is defined else {'created': d.created | default(false)} }}
          no_log: true

        - name: "Service token obtained"
          ansible.builtin.assert:
            that:
              - _plane_token_run.rc == 0
              - _plane_token_summary.error is not defined
              - _plane_token | length > 0
            fail_msg: "plane service token: {{ _plane_token_summary.error | default('no token returned (exit ' ~ _plane_token_run.rc ~ ')') }}"
            quiet: true

        - name: "Authenticate to OpenBao (AppRole)"
          ansible.builtin.uri:
            url: "{{ _bao_url }}/v1/auth/approle/login"
            method: POST
            body_format: json
            body:
              role_id: "{{ _bao_role_id }}"
              secret_id: "{{ _bao_secret_id }}"
            status_code: [200]
          register: _bao_auth
          delegate_to: localhost
          changed_when: false
          no_log: true

        - name: "Store it at secret/services/plane:plane_service_token (shared merge path)"
          ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
          vars:
            _bm_url: "{{ _bao_url }}"
            _bm_token: "{{ _bao_auth.json.auth.client_token }}"
            _bm_path: services/plane
            _bm_data: "{{ {'plane_service_token': _plane_token} }}"
            _bm_on_missing: fail
            _bm_missing_msg: "secret/services/plane does not exist; Phase 1 creates it."

        - name: "Report"
          ansible.builtin.debug:
            msg: "workspace service token {{ 'minted' if _plane_token_summary.created else 'already present in Plane' }}; stored in OpenBao (value never shown)"

# ── Phase 4: Verify ─────────────────────────────────────────────────────────
- name: "Phase 4: Verify plane"
  hosts: plane_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    # A dry run skipped the deploy, so on a fresh host the stack does not exist and the probe
    # below would fail on it: check, and stop the dry run there (deploy-agentgateway.yml).
    - name: "Dry run: is the plane proxy running?"
      ansible.builtin.command:
        argv: ["{{ _engine }}", inspect, "--format", "{{ '{{.State.Running}}' }}", "plane-proxy"]
      register: _dry_container
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_check_mode

    - name: "Dry run, plane not running: report"
      ansible.builtin.debug:
        msg: "check mode: plane is not running; its verification (through the proxy) needs a real deploy."
      when:
        - ansible_check_mode
        - _dry_container.rc != 0 or _dry_container.stdout | trim != 'true'

    - name: "Dry run, plane not running: stop"
      ansible.builtin.meta: end_host
      when:
        - ansible_check_mode
        - _dry_container.rc != 0 or _dry_container.stdout | trim != 'true'

    - name: "API answers through the proxy, set up and invitation-only"
      # Through the proxy, not the API port: proves the routing the edge uses. /api/instances/,
      # NOT /: the proxy serves / from the web frontend, which stays up over a dead API
      # (MISTAKES 2.19).
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - plane-api
          - python
          - -c
          - >-
            import json, urllib.request;
            r = urllib.request.Request('http://proxy:80/api/instances/', headers={'Host': '{{ plane_public_url | urlsplit('hostname') }}'});
            d = json.load(urllib.request.urlopen(r, timeout=10));
            assert d['instance']['is_setup_done'], 'instance not set up';
            assert not d['config']['enable_signup'], 'self sign-up is open';
            print('setup done, sign-up closed')
      register: _plane_verify
      changed_when: false
      retries: 10
      delay: 10
      until: _plane_verify.rc == 0
      check_mode: false

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          plane healthy — {{ plane_public_url }} served by the stack's proxy on
          {{ plane_bind | default('127.0.0.1') }}:{{ plane_port | default(8080) }} (TLS at the platform
          Caddy); instance set up, self sign-up closed, workspace {{ plane_workspace_slug }} present.

    # Last: every verify task above passed (a failure stops the play before this records).
    - name: "Record the service-deploy step result"
      ansible.builtin.include_tasks: tasks/emit-service-deploy-result.yml
      vars:
        service_deploy_result_var: _deploy
