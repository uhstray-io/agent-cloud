---
# Read-only receiver-origin check before declaring a production scrape target.
# The survey chooses a fixed kind; private inventory supplies every address/port.
- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Require the reviewed Dev checkout before probing
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require an exact reviewed revision
      ansible.builtin.assert:
        that: expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
        fail_msg: "Pass the exact reviewed Dev commit SHA."

    - name: Read controller revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Refuse a different controller revision
      ansible.builtin.assert:
        that: _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different revision; no probe was sent."

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Refuse an altered controller checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "Semaphore checkout has local changes; no probe was sent."

- name: Probe one inventory-declared metrics endpoint from the o11y receiver
  hosts: o11y_svc
  gather_facts: false
  become: false
  tasks:
    - name: Require one fixed target kind and its inventory declaration
      ansible.builtin.assert:
        that:
          - probe_target | default('') in ['dgx-vllm', 'agentgateway']
          - >-
            probe_target != 'dgx-vllm' or
            (dgx_spark_head_address is defined and dgx_spark_head_name is defined
             and dgx_spark_api_port is defined and
             (dgx_spark_nodes | default([]) | selectattr('name', 'equalto', dgx_spark_head_name) | selectattr('address', 'equalto', dgx_spark_head_address) | list | length) == 1)
          - >-
            probe_target != 'agentgateway' or
            (groups.get('agentgateway_svc', []) | length) == 1
        fail_msg: "Select dgx-vllm or agentgateway with one complete inventory-declared endpoint."

    - name: Resolve the fixed inventory endpoint
      ansible.builtin.set_fact:
        _probe_address: >-
          {{ dgx_spark_head_address if probe_target == 'dgx-vllm'
             else hostvars[groups['agentgateway_svc'][0]].agw_stats_bind }}
        _probe_port: >-
          {{ dgx_spark_api_port if probe_target == 'dgx-vllm'
             else hostvars[groups['agentgateway_svc'][0]].agw_stats_port }}

    - name: Refuse an unusable metrics address or port
      ansible.builtin.assert:
        that:
          - _probe_address is match('^[0-9.]+$')
          - _probe_address not in ['0.0.0.0', '127.0.0.1']
          - _probe_port | int > 0
          - _probe_port | int < 65536
        fail_msg: "The selected inventory endpoint must have a receiver-reachable IPv4 address and port."

    - name: Read the receiver route and chosen source
      ansible.builtin.command:
        argv: [ip, -4, route, get, "{{ _probe_address }}"]
      register: _probe_route
      changed_when: false
      when: not ansible_check_mode

    - name: Require a route with an explicit source address
      ansible.builtin.assert:
        that: _probe_route.stdout is search('(^| )src [0-9]+')
        fail_msg: "The receiver has no proven source route to the selected endpoint."
      when: not ansible_check_mode

    - name: Send one direct bounded metrics request from the receiver
      ansible.builtin.uri:
        url: "http://{{ _probe_address }}:{{ _probe_port }}/metrics"
        method: GET
        use_proxy: false
        return_content: false
        status_code: 200
        timeout: 5
      register: _probe_http
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Refuse a probe result without an HTTP status
      ansible.builtin.assert:
        that: "'status' in _probe_http"
        fail_msg: "The receiver did not execute a valid HTTP probe."
      when: not ansible_check_mode

    - name: Report route and HTTP status without response content
      ansible.builtin.debug:
        msg: >-
          {{ probe_target }} route={{ _probe_route.stdout | trim }};
          metrics HTTP status={{ _probe_http.status }};
          detail={{ _probe_http.msg | default('none') }}.
      when: not ansible_check_mode

    - name: Require a reachable metrics endpoint
      ansible.builtin.assert:
        that: _probe_http.status | int == 200
        fail_msg: "{{ probe_target }} did not answer /metrics with HTTP 200 from the receiver."
      when: not ansible_check_mode
