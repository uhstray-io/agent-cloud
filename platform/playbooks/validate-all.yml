  hosts: netbox_svc
  gather_facts: false
  tasks:
    - name: Check NetBox health
      ansible.builtin.uri:
        url: "{{ service_url }}/login/"
        method: GET
        status_code: [200]
        timeout: 10
      register: _netbox_health
      ignore_errors: true
      check_mode: false

    - name: Report NetBox status
      ansible.builtin.debug:
        msg: "NetBox: {{ 'HEALTHY' if _netbox_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate WisBot"
  hosts: wisbot_svc
  gather_facts: false
  tasks:
    - name: Check WisBot health
      ansible.builtin.uri:
        url: "{{ service_url }}/health"
        method: GET
        status_code: [200]
        timeout: 10
      register: _wisbot_health
      ignore_errors: true
      check_mode: false

    - name: Report WisBot status
      ansible.builtin.debug:
        msg: "WisBot: {{ 'HEALTHY' if _wisbot_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate tududi"
  hosts: tududi_svc
  gather_facts: false
  tasks:
    - name: Check tududi health
      ansible.builtin.uri:
        url: "{{ service_url }}/api/health"
        method: GET
        status_code: [200]
        timeout: 10
      register: _tududi_health
      ignore_errors: true
      check_mode: false

    - name: Report tududi status
      ansible.builtin.debug:
        msg: "tududi: {{ 'HEALTHY' if _tududi_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate console"
  hosts: console_svc
  gather_facts: false
  tasks:
    - name: Check console health (probe /healthz -> 200, inside the container)
      # Same probe the deploy verifies with: the binary's own subcommand, run in the container.
      ansible.builtin.command: "{{ container_engine | default('podman') }} exec console /usr/local/app/server probe /healthz 200"
      register: _console_health
      ignore_errors: true
      changed_when: false
      check_mode: false

    - name: Report console status
      ansible.builtin.debug:
        msg: "console: {{ 'HEALTHY' if _console_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate honcho"
  hosts: honcho_svc
  gather_facts: false
  tasks:
    - name: Check honcho health
      ansible.builtin.uri:
        url: "{{ service_url }}/health"
        method: GET
        status_code: [200]
        timeout: 10
      register: _honcho_health
      ignore_errors: true
      check_mode: false

    - name: Report honcho status
      ansible.builtin.debug:
        msg: "honcho: {{ 'HEALTHY' if _honcho_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate postiz"
  hosts: postiz_svc
  gather_facts: false
  tasks:
    - name: Check postiz health
      ansible.builtin.uri:
        url: "{{ service_url }}/"
        method: GET
        # The app answers 200 or a redirect on / depending on session state;
        # only a 5xx means it is actually broken. Narrower than the other
        # services here because postiz has no unauthenticated health endpoint.
        status_code: [200, 301, 302, 307, 308]
        timeout: 10
      register: _postiz_health
      ignore_errors: true
      check_mode: false

    - name: Report postiz status
      ansible.builtin.debug:
        msg: "postiz: {{ 'HEALTHY' if _postiz_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate plane"
  hosts: plane_svc
  gather_facts: false
  tasks:
    - name: Check plane health
      ansible.builtin.uri:
        # /api/instances/ is unauthenticated and served by the API. The web frontend
        # answers / even when the API is down, so / would report a dead stack as healthy.
        url: "{{ plane_public_url }}/api/instances/"
        method: GET
        status_code: [200]
        timeout: 10
      register: _plane_health
      ignore_errors: true
      check_mode: false

    - name: Report plane status
      ansible.builtin.debug:
        msg: "plane: {{ 'HEALTHY' if _plane_health is succeeded else 'UNHEALTHY' }}"

    - name: Check the Plane MCP server
      ansible.builtin.uri:
        # The OAuth protected-resource document is unauthenticated and served by the MCP server
        # itself; its `resource` names the server's public URL, so it also proves the server was
        # configured with the URL it is reached on. (The MCP endpoints answer a GET with 405.)
        url: "{{ plane_mcp_public_url }}/.well-known/oauth-protected-resource/http/mcp"
        method: GET
        status_code: [200]
        timeout: 10
      register: _plane_mcp_health
      failed_when: >-
        _plane_mcp_health.status | default(0) != 200
        or (_plane_mcp_health.json | default({})).resource | default('') != plane_mcp_public_url ~ '/http/mcp'
      ignore_errors: true
      check_mode: false
      when: plane_mcp_public_url is defined

    - name: Report Plane MCP status
      ansible.builtin.debug:
        msg: "plane-mcp: {{ 'HEALTHY' if _plane_mcp_health is succeeded else 'UNHEALTHY' }}"
      when: plane_mcp_public_url is defined

- name: "Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print validation summary
      ansible.builtin.debug:
        msg: "Validation complete — check individual service results above."
