- name: "Validate postiz"
  hosts: postiz_svc
  gather_facts: false
  tasks:
    - name: Check postiz health
      ansible.builtin.uri:
        url: "{{ service_url }}/"
        method: GET
        # The app answers 200 or a redirect on / depending on session state;
        # only a 5xx means it is actually broken. Narrower than the other
        # services here because postiz has no unauthenticated health endpoint.
        status_code: [200, 301, 302, 307, 308]
        timeout: 10
      register: _postiz_health
      ignore_errors: true
      check_mode: false

    - name: Report postiz status
      ansible.builtin.debug:
        msg: "postiz: {{ 'HEALTHY' if _postiz_health is succeeded else 'UNHEALTHY' }}"

- name: "Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print validation summary
      ansible.builtin.debug:
        msg: "Validation complete — check individual service results above."
