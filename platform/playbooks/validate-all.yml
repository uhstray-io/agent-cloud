---
# validate-all.yml — Validate all deployed services are healthy
# Run after deploy-all.yml or independently for health checks.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Validate OpenBao"
  hosts: openbao_svc
  gather_facts: false
  tasks:
    - name: Check OpenBao health
      ansible.builtin.uri:
        url: "{{ service_url }}/v1/sys/health"
        method: GET
        status_code: "{{ health_status_codes | default([200]) }}"
        timeout: 10
      register: _bao_health
      ignore_errors: true
      check_mode: false

    - name: Report OpenBao status
      ansible.builtin.debug:
        msg: "OpenBao: {{ 'HEALTHY' if _bao_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate NocoDB"
  hosts: nocodb_svc
  gather_facts: false
  tasks:
    - name: Check NocoDB health
      ansible.builtin.uri:
        url: "{{ service_url }}/api/v1/health"
        method: GET
        status_code: [200]
        timeout: 10
      register: _nocodb_health
      ignore_errors: true
      check_mode: false

    - name: Report NocoDB status
      ansible.builtin.debug:
        msg: "NocoDB: {{ 'HEALTHY' if _nocodb_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate n8n"
  hosts: n8n_svc
  gather_facts: false
  tasks:
    - name: Check n8n health
      ansible.builtin.uri:
        url: "{{ service_url }}/healthz"
        method: GET
        status_code: [200]
        timeout: 10
      register: _n8n_health
      ignore_errors: true
      check_mode: false

    - name: Report n8n status
      ansible.builtin.debug:
        msg: "n8n: {{ 'HEALTHY' if _n8n_health is succeeded else 'UNHEALTHY' }}"

- name: "Validate Semaphore"
