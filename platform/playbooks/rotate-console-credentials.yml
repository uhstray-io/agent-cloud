---
# rotate-console-credentials.yml — the Dispatch Console's monthly credential rotation (plan 17, D27).
#
# Rotates the console AppRole's secret_id and, when console_grafana_api_enabled is true, renews the
# Grafana Viewer token. Then it redeploys the console so it carries the new secret_id. Create, verify, retire:
#   1. Pin       the console's deployed commit becomes this run's branch (_console_pinned_branch = SHA,
#                which deploy-console.yml reads before service_branch, so the template's service_branch field
#                has no effect here). Skipped only under local_mode. To deploy a branch, run Deploy console.
#   2. Drift     before any mint, the controller checkout must hold the pinned commit and must agree with it
#                on the console's deploy inputs (see below). Skipped with the pin.
#   3. Create    a new secret_id on the console AppRole. Its role_id does not change. The write is a
#                compare-and-swap on the secret_id read at the start, so a concurrent change refuses it. A
#                refused write destroys the minted secret_id, but only when the store does not hold it.
#   4. Renew     provision-console-grafana-token.yml, which renews only under its 30-day threshold. Imported
#                only when console_grafana_api_enabled is true.
#   5. Redeploy  deploy-console.yml renders the new secret_id into .env. compose_up_if_changed hashes
#                .env (platform/lib/common.sh:196) and recreates the container when it changes.
#   6. Verify    the STORED secret_id is the one minted this run and logs in (200). The proof token is revoked
#                at once. Only then is the replaced secret_id destroyed. Any failure before that leaves the old
#                secret_id valid.
#
# Why the pin: a rotation must not change code. A schedule has no survey to answer, and a commit SHA
# passes assert-placement-branch.yml. The default `main` would be refused from a Dev checkout.
#
# Why the drift check: the pin covers the image, deploy.sh and the compose files, which come from the pinned
# commit. The .env and config/* files are rendered from the CONTROLLER checkout (manage-secrets.yml:205 resolves
# the templates from playbook_dir). Without the check, a rotation would render a template the console never
# deployed into the old image, unseen. The check compares the pinned commit with the controller's HEAD over the
# console's deploy directory, deploy-console.yml, the manage-secrets task that renders the files, and the
# service-onboarding registry that config/workflow.json is rendered from. It refuses on any difference, or when
# the pinned commit is not in the controller checkout, before the mint. Under local_mode the checkout is copied,
# not pinned, so the check is skipped there.
#
# Why Dev-bound and monthly (templates.yml): only the Dev checkout carries this playbook until
# promotion. A monthly run makes about three attempts inside the 90-day secret_id TTL and renews the
# Grafana token well before its 30-day threshold.
#
# Known limits:
#   - The drift check compares committed HEAD, not the controller's working tree. An uncommitted edit to those
#     inputs on the controller is not compared.
#   - A run that fails between steps 3 and 6 leaves its replaced secret_id live. The next successful
#     run retires only the secret_id that was live when it started, so the orphan expires with its
#     90-day TTL.
#   - A refused store write whose read-back also fails leaves the minted secret_id live. The rescue destroys
#     only a secret_id it can prove the store does not hold.
#   - With console_openbao_url unset, deploy does not render the AppRole into .env. The rotation is
#     still proven and retired, and the running console holds no copy to lose.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# A play over no hosts exits 0 and records a rotation that did nothing as a success
# (docs/MISTAKES.md 2.21), so refuse an absent or empty console_svc group first.
- name: "Pre-flight: console_svc is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: console_svc
    preflight_group_expected: console_svc

# Before the first mint. The Grafana token is renewed only when the console's Grafana API is enabled, so
# the o11y group is required only then. A missing o11y group found after the mint would leave the new
# secret_id live.
- name: "Pre-flight: o11y_svc is real (only when the console's Grafana API is enabled)"
  ansible.builtin.import_playbook: preflight-target-group.yml
  when: hostvars[groups['console_svc'][0]].console_grafana_api_enabled | default(false) | bool
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

# ── 1. Pin the commit ───────────────────────────────────────────────────────
- name: "Pin the console's deployed commit (no code change)"
  hosts: console_svc
  gather_facts: false
  become: false
  vars:
    # The same formula deploy-console.yml uses, so the pin reads the checkout the deploy wrote.
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"

  tasks:
    - name: "Refuse Grafana API enabled without its URL (before anything is minted)"
      ansible.builtin.assert:
        that:
          - >-
            not (console_grafana_api_enabled | default(false) | bool)
            or (console_grafana_url | default('', true) | string | trim | length) > 0
        fail_msg: >-
          console_grafana_api_enabled is true but console_grafana_url is unset. The console reads its Grafana
          token only with both. Set console_grafana_url or unset console_grafana_api_enabled. Nothing was rotated.
        quiet: true

    - name: "Read the commit the console is deployed from"
      # Read-only on the target. check_mode false so a dry run still pins the same commit it would deploy.
      ansible.builtin.command:
        argv: [git, -C, "{{ _monorepo_dir }}", rev-parse, HEAD]
      register: _console_head
      failed_when: false
      changed_when: false
      check_mode: false
      when:
        - not (local_mode | default(false) | bool)

    - name: "Refuse a pin when the console was never deployed"
      ansible.builtin.assert:
        that:
          - _console_head.rc == 0
          - (_console_head.stdout | trim) is match('^[0-9a-f]{40}$')
        fail_msg: >-
          console was never deployed: no monorepo commit at {{ _monorepo_dir }}. Run Deploy console first.
        quiet: true
      when:
        - not (local_mode | default(false) | bool)

    - name: "Pin this run to that commit (an internal host fact; deploy-console.yml's _branch reads it first)"
      ansible.builtin.set_fact:
        _console_pinned_branch: "{{ _console_head.stdout | trim }}"
      when:
        - not (local_mode | default(false) | bool)

# ── 2. Refuse a rotation whose controller inputs differ from the pinned commit ──
- name: "Refuse a rotation the controller cannot reproduce from the pinned commit"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    # The pin is a host fact of the console host, set above. Empty when the pin was skipped.
    _drift_pin: "{{ hostvars[groups['console_svc'][0]]._console_pinned_branch | default('') }}"

  tasks:
    - name: "Check that the pinned commit exists in the controller checkout"
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", cat-file, -e, "{{ _drift_pin }}^{commit}"]
      register: _drift_present
      failed_when: false
      changed_when: false
      check_mode: false
      when:
        - not (local_mode | default(false) | bool)
        - _drift_pin | length > 0

    - name: "Compare the console's deploy inputs with the pinned commit (exit 0 = identical)"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ playbook_dir }}/../.."
          - diff
          - --quiet
          - "{{ _drift_pin }}"
          - HEAD
          - --
          - platform/services/console/deployment
          - platform/playbooks/deploy-console.yml
          - platform/playbooks/tasks/manage-secrets.yml
          - platform/workflows/service-onboarding/registry.yml
          # deploy-console.yml also renders flows.json from the app catalog.
          - platform/services/authentik/deployment/app-catalog.yml
      register: _drift_diff
      failed_when: false
      changed_when: false
      check_mode: false
      when:
        - not (local_mode | default(false) | bool)
        - _drift_pin | length > 0

    - name: "Require the controller's console inputs to match the pinned commit (nothing is minted before this)"
      ansible.builtin.assert:
        that:
          - _drift_present.rc == 0
          - _drift_diff.rc == 0
        fail_msg: >-
          the controller's console deploy inputs differ from what the console runs ({{ _drift_pin[:12] }}); redeploy the console from this branch first, then rerun. Nothing was rotated.
        quiet: true
      when:
        - not (local_mode | default(false) | bool)
        - _drift_pin | length > 0

# ── 3. Create the new secret_id ─────────────────────────────────────────────
- name: "Create a new secret_id for the console AppRole"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    # The controller's own OpenBao address, from the inventory or the environment (as the GitHub refresh does).
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _console_role: "console"
    _console_approle_path: "services/approles/console"

  tasks:
    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao as the admin AppRole (Semaphore's)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        follow_redirects: none
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _rot_admin
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Read the console AppRole's stored credentials (a 404 is named by the assert below)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ _console_approle_path }}"
        method: GET
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _rot_admin.json.auth.client_token }}"
        status_code: [200, 404]
      register: _rot_stored
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Decide whether the AppRole was provisioned (no value leaves this task)"
      ansible.builtin.set_fact:
        _console_approle_provisioned: >-
          {{ _rot_stored.status == 200
             and (_rot_stored.json.data.data.role_id | default('')) | length > 0
             and (_rot_stored.json.data.data.secret_id | default('')) | length > 0 }}
      no_log: true

    - name: "Refuse to rotate an AppRole that was never provisioned"
      ansible.builtin.assert:
        that:
          - _console_approle_provisioned | bool
        fail_msg: >-
          secret/services/approles/console is missing role_id or secret_id.
          Run Provision Console AppRole first; nothing was rotated.
        quiet: true

    - name: "Mint a new secret_id (the role_id does not change)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/role/{{ _console_role }}/secret-id"
        method: POST
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _rot_admin.json.auth.client_token }}"
        body_format: json
        body: {}
        status_code: [200]
      register: _rot_new
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode

    - name: "Hold the replaced secret_id in memory for the retire step (never printed)"
      ansible.builtin.set_fact:
        _console_retired_secret_id: "{{ _rot_stored.json.data.data.secret_id }}"
      no_log: true
      when:
        - not ansible_check_mode

    - name: "Store the new secret_id (a refused write destroys it; see the rescue)"
      when:
        - not ansible_check_mode
      block:
        - name: "Store the new secret_id (merge: role_id and siblings kept; refused if the replaced one changed)"
          ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
          vars:
            _bm_url: "{{ _bao_url }}"
            _bm_token: "{{ _rot_admin.json.auth.client_token }}"
            _bm_path: "{{ _console_approle_path }}"
            _bm_data:
              secret_id: "{{ _rot_new.json.data.secret_id }}"
            _bm_on_missing: fail
            _bm_missing_msg: "secret/services/approles/console vanished between the read and the write; nothing was rotated."
            _bm_guard_key: secret_id
            _bm_guard_value: "{{ _console_retired_secret_id }}"
          no_log: true

      rescue:
        - name: "Read back what the store holds after a refused write (no value leaves this task)"
          ansible.builtin.uri:
            url: "{{ _bao_url }}/v1/secret/data/{{ _console_approle_path }}"
            method: GET
            follow_redirects: none
            unredirected_headers: [X-Vault-Token]
            headers:
              X-Vault-Token: "{{ _rot_admin.json.auth.client_token }}"
            status_code: [200]
          register: _rot_after_refusal
          no_log: true
          changed_when: false
          check_mode: false

        - name: "Decide whether the store holds the new secret_id (no value leaves this task)"
          ansible.builtin.set_fact:
            _console_store_holds_new: "{{ (_rot_after_refusal.json.data.data.secret_id | default('')) == (_rot_new.json.data.secret_id | default('')) }}"
          no_log: true

        # The store can write before its read-back fails (bao-merge-keys.yml verifies after the write), so
        # the minted secret_id is destroyed only when the store does not hold it. Destroying a value the
        # store holds would leave the console's next rotation with a dead credential.
        - name: "Destroy the minted secret_id the store does not hold (the replaced one stays valid)"
          ansible.builtin.uri:
            url: "{{ _bao_url }}/v1/auth/approle/role/{{ _console_role }}/secret-id/destroy"
            method: POST
            follow_redirects: none
            unredirected_headers: [X-Vault-Token]
            headers:
              X-Vault-Token: "{{ _rot_admin.json.auth.client_token }}"
            body_format: json
            body:
              secret_id: "{{ _rot_new.json.data.secret_id }}"
            status_code: [200, 204]
          no_log: true
          changed_when: true
          when:
            - not _console_store_holds_new | bool

        - name: "Refuse: the store did not take the new secret_id (named; the minted one is destroyed, nothing was rotated)"
          ansible.builtin.fail:
            msg: >-
              The store did not take the new console secret_id. The minted secret_id was destroyed and the
              replaced secret_id is still valid. Re-run after checking secret/services/approles/console.
          when:
            - not _console_store_holds_new | bool

        - name: "Refuse: the store holds the new secret_id but could not confirm it (kept live; the replaced one is not destroyed)"
          ansible.builtin.fail:
            msg: >-
              The store holds the new console secret_id but its read-back failed. The new secret_id was kept live
              and the replaced one was NOT destroyed. Check secret/services/approles/console before re-running.
          when:
            - _console_store_holds_new | bool

    - name: "Dry run: what a real run would do (names only)"
      ansible.builtin.debug:
        msg: >-
          check mode: a new secret_id would be minted for AppRole console and stored at
          secret/services/approles/console (field secret_id; role_id unchanged). The Grafana token,
          the console redeploy and the retirement of the replaced secret_id would follow.
      when:
        - ansible_check_mode

# ── 4. Renew the Grafana token (only under its 30-day threshold, and only when the Grafana API is enabled) ──
# Imported mid-run, so the nested flag skips its own guard: this play's guard already covered the run
# (test_executor_internal_overrides.py, the nested-import rule).
- name: "Renew the console Grafana token when it is under its threshold"
  ansible.builtin.import_playbook: provision-console-grafana-token.yml
  when: hostvars[groups['console_svc'][0]].console_grafana_api_enabled | default(false) | bool
  vars:
    _extra_var_guard_nested: true

# ── 5. Redeploy the console with the new secret_id ──────────────────────────
- name: "Redeploy the console so it carries the new secret_id"
  ansible.builtin.import_playbook: deploy-console.yml
  vars:
    _extra_var_guard_nested: true

# ── 6. Prove the stored secret_id, then destroy the replaced one ────────────
- name: "Prove the new secret_id, then retire the replaced one"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _console_role: "console"
    _console_approle_path: "services/approles/console"

  tasks:
    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao as the admin AppRole again (the first token may have expired during the deploy)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        follow_redirects: none
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _rot_admin_prove
      no_log: true
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode

    - name: "Read back the stored console credentials"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ _console_approle_path }}"
        method: GET
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _rot_admin_prove.json.auth.client_token }}"
        status_code: [200]
      register: _rot_readback
      no_log: true
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode

    - name: "Prove the stored secret_id logs in (200)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        follow_redirects: none
        body_format: json
        body:
          role_id: "{{ _rot_readback.json.data.data.role_id }}"
          secret_id: "{{ _rot_readback.json.data.data.secret_id }}"
        status_code: [200]
      register: _rot_proof
      no_log: true
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode

    - name: "Revoke the proof token (it proved the stored secret_id; the token is not kept)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/token/revoke-self"
        method: POST
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _rot_proof.json.auth.client_token }}"
        status_code: [200, 204]
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode

    - name: "Decide whether the stored secret_id is the one minted this run and logs in (no value leaves this task)"
      ansible.builtin.set_fact:
        _console_secret_proven: >-
          {{ (_rot_readback.json.data.data.secret_id == _rot_new.json.data.secret_id) and (_rot_proof.status == 200) }}
      no_log: true
      when:
        - not ansible_check_mode

    - name: "Require the stored secret_id to be the one minted this run, and to log in"
      ansible.builtin.assert:
        that:
          - _console_secret_proven | bool
        fail_msg: >-
          The stored console secret_id is not the one minted this run, or it does not log in.
          The replaced secret_id was NOT destroyed.
        quiet: true
      when:
        - not ansible_check_mode

    - name: "Retire the replaced secret_id (destroy it on the role)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/role/{{ _console_role }}/secret-id/destroy"
        method: POST
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _rot_admin_prove.json.auth.client_token }}"
        body_format: json
        body:
          secret_id: "{{ _console_retired_secret_id }}"
        status_code: [200, 204]
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode
        - _rot_new is not skipped

    - name: "Dry run: retirement would follow the proof (names only)"
      ansible.builtin.debug:
        msg: >-
          check mode: the stored secret_id would be proven to log in, then the replaced secret_id
          would be destroyed on AppRole console.
      when:
        - ansible_check_mode

    - name: "Report (names only; no value is printed)"
      ansible.builtin.debug:
        msg: >-
          Console AppRole secret_id rotated: the new one is stored at secret/services/approles/console
          (field secret_id, role_id unchanged), proven to log in, and the replaced one is destroyed.
      when:
        - not ansible_check_mode
