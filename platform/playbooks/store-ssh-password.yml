---
# store-ssh-password.yml — Store the operator's bootstrap login/sudo password in
# OpenBao at secret/services/ssh (fields: become_password + login_password).
#
# Why: passwordless-sudo hardening (harden-ssh.yml) needs the current sudo
# password to write the NOPASSWD sudoers drop-in, and Semaphore needs the login
# password to first reach a not-yet-keyed VM. Storing it in OpenBao makes OpenBao
# the source of truth (the site-config ssh_password.txt is a backup) and lets the
# orchestrator source it from there instead of a plaintext file.
#
# ADDITIVE + idempotent: merges the password fields into secret/services/ssh
# WITHOUT touching the management keypair (public_key/private_key) already there.
#
# Runs from the Semaphore runner (localhost), which holds the OpenBao AppRole.
#
# Take the password from the SSH_PASSWORD environment variable, NOT from an extra
# var, when running under Semaphore. Semaphore persists a task's extra-var JSON in
# its own database and serves it back over the API indefinitely, so `-e
# ssh_password=...` would leave the credential in plaintext outside OpenBao — which
# the platform rules forbid. A Semaphore environment *secret* is encrypted at rest
# and is not returned by the API, and it is how this playbook's three OpenBao
# credentials already arrive. The password now uses the same channel.
#
# The extra var still works for a local run, where the value comes from
# site-config and nothing persists it.
#
# Usage (Semaphore): SSH_PASSWORD supplied as an environment secret
# Usage (local):     -e ssh_password=<pw> -e openbao_addr=https://<bao>:8200
#
# The AppRole secret_id, the returned client token and the password itself all
# cross this connection, so cleartext to a public address is refused outright.
# http:// is still accepted for loopback and RFC1918 — the platform's OpenBao
# sits on an internal VLAN — using the same assert as seed-postiz-secrets.yml
# rather than a second, differently-worded rule.

- name: "Store bootstrap SSH/sudo password in OpenBao"
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    # `| default(x, true)` so an empty extra var falls through to the environment
    # rather than satisfying the lookup with an empty string.
    # The ENVIRONMENT WINS. Inverted deliberately: with the extra var first, a
    # Semaphore run that passed `-e ssh_password=...` would use it even though the
    # environment secret was present, and Semaphore would persist that value in its
    # database — the leak this playbook is supposed to close. Reversing the order
    # removes the footgun without needing a "local-only mode" flag: wherever the
    # secret is configured it takes precedence, and the extra var remains available
    # for a local run, where nothing persists it.
    _ssh_password: "{{ lookup('env', 'SSH_PASSWORD') | default(ssh_password | default(''), true) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - _ssh_password | length > 0
          - _bao_url | length > 0
        fail_msg: "Supply the password as the SSH_PASSWORD environment secret (Semaphore) or -e ssh_password=... (local), and ensure openbao_addr (or OPENBAO_ADDR) + AppRole creds are set."
      no_log: true

    # One shared definition, in tasks/assert-bao-transport.yml, so the rule cannot
    # drift between the playbooks that enforce it.
    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      no_log: true

    - name: "Fetch existing secret/services/ssh (preserve keypair fields)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/ssh"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _existing
      no_log: true

    - name: "Merge password fields into secret/services/ssh (keypair preserved)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/ssh"
        method: POST
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        body_format: json
        body:
          data: >-
            {{ (_existing.json.data.data | default({}))
               | combine({'become_password': _ssh_password, 'login_password': _ssh_password}) }}
      no_log: true

    - name: "Report"
      ansible.builtin.debug:
        msg: "Stored become_password + login_password at secret/services/ssh (management keypair preserved)."
