---
# refuse-internal-extra-vars.yml — refuse a run in which an extra var sets an internal
# (underscore-prefixed) name, before the run has set any of them.
#
# Extra vars outrank everything a playbook defines: play vars, vars_files, block and task
# vars, include params, registered vars and set_facts (ansible-core variable precedence,
# entries 12-21 against 22,
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html#understanding-variable-precedence).
# So `-e '_fw_group_errors=[]'` replaces the verdict Apply Firewall computes, and the step
# result it records says pass for a host that failed; the collector carries that to NetBox
# and Loki. This repository names a playbook's internal values with a leading underscore,
# so an underscore-prefixed extra var is one of them by definition.
#
# Mechanism: hostvars holds a host's inventory vars, facts, set_facts, registered vars and
# extra vars, but not play, block or task vars, and by default no underscore-prefixed name
# (verified on ansible-core 2.21; platform/tests/test_executor_internal_overrides.py pins
# both). As the first play of a run, before anything is registered or set, an underscore
# name in hostvars came from outside the playbook. Nothing is written, so a name a playbook
# defines as a play or task var keeps its value. The set_fact probe of
# tasks/refuse-var-overrides.yml cannot guard those: set_fact outranks play and task vars,
# so its probe value would shadow them for the rest of the run.
#
# One rule instead of a per-playbook list: it also covers the names the run's task files
# and imported playbooks define, and a name added later needs no list edit.
#
# RESERVED PREFIX. hostvars also holds inventory vars, so the leading underscore is reserved
# for playbook internals: no inventory (site-config included) may define an underscore-
# prefixed variable, and one that did is refused exactly like a forged extra var, because
# the two cannot be told apart. platform/tests/test_executor_internal_overrides.py holds the
# example inventories to it; site-config defined none when this landed.
#
# The escalation and connection passwords are refused by name too: the playbooks resolve them
# from OpenBao (set_fact of ansible_become_password, add_host of ansible_password), and an
# extra var under any alias would replace that. The pattern refuses ansible_password and any
# ansible_<x>_pass or ansible_<x>_password. That covers every alias ansible-core's own become
# and ssh plugins read, and any other plugin's that follows the same naming; a plugin that
# names its password variable otherwise is not covered. The core aliases are each plugin's
# documented `vars` for the option, read from ansible-core 2.21's
# DOCUMENTATION blocks: become_pass in plugins/become/sudo.py (ansible_become_password,
# ansible_become_pass, ansible_sudo_pass), su.py (+ ansible_su_pass) and runas.py
# (+ ansible_runas_pass); password in plugins/connection/ssh.py (ansible_password,
# ansible_ssh_pass, ansible_ssh_password). Also
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/sudo_become.html and
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/ssh_connection.html.
# Semaphore's own login and become keys are unaffected: it passes their passwords as
# --ask-pass / --ask-become-pass answers on stdin (Semaphore v2.17.31
# services/tasks/LocalJob.go, the AccessKeyLoginPassword cases, about lines 379-403), which
# are CLI prompts, not variables, so they never reach hostvars
# (test_executor_internal_overrides.py runs the guard with both prompts answered).
#
# CONNECTION IDENTITY. The inventory legitimately defines where a run connects and as whom
# (ansible_host, ansible_user, ansible_connection, ...), so a forged `-e ansible_host=...`
# is indistinguishable from the inventory's own value in hostvars, and extra vars outrank the
# inventory. Host-key checking is off under Semaphore, so a forged ansible_host would send
# the run, and the OpenBao-derived become password it hands to sudo, to a host the launcher
# chose; ansible_ssh_common_args carries a ProxyCommand and ansible_connection=local moves a
# remote run onto the controller (service-deployment-workflow task 7.10, from the PR #459
# review). So the second task asks where the value came from: the extra_var_names filter
# (filter_plugins/extra_var_names.py) returns the NAMES of the command-line extra vars, and
# any of the names below among them refuses the run. An inventory or Semaphore environment
# that sets one is refused too; neither does today (no honest -e caller in this repository,
# and none in the live Semaphore environments). Names only, never values. The list is every
# option of the ssh connection and sudo become plugins that can move the connection, change
# who it runs as, run another binary or key it, or switch host-key checking, read from the
# installed ansible-core's DOCUMENTATION (the password aliases are the pattern above). A name
# added by a later ansible-core is caught by the test that re-reads it, not by this play.
# platform/tests/test_connection_identity_vars.py pins the list and runs every name.
#
# Usage — the FIRST entry of every playbook Semaphore launches (every templates.yml
# playbook), before any play or import:
#
#   - name: "Refuse extra vars that set internal names"
#     ansible.builtin.import_playbook: refuse-internal-extra-vars.yml
#
# NESTED RUNS. A guarded playbook imported by another one after work has begun (Clean
# Deploy imports Deploy) would find the importer's own facts in hostvars and refuse an
# honest run. The importer's guard already covered the run, so the import passes
#
#     vars:
#       _extra_var_guard_nested: true
#
# and this play skips. That flag is an import var, which hostvars does not hold; the same
# name sent as an extra var IS in hostvars, so the check runs and refuses it.
# platform/tests/test_executor_internal_overrides.py requires every import of a guarded
# playbook to pass the flag, and every playbook that passes it to start with the guard.
#
# It runs under --check and under any --tags (tag `always`). Like every play it is skipped
# by a --limit that excludes localhost, and by --start-at-task (preflight-target-group.yml
# states the same --limit limitation). A failed guard ends the whole run: no later play
# starts once every host of a play has failed.

- name: "Refuse extra vars that set internal names"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: "Refuse an extra var that sets an internal name"
      ansible.builtin.assert:
        that: hostvars[inventory_hostname].keys() | select('match', '_|ansible_(password|\w+_pass|\w+_password)$') | list | length == 0
        fail_msg: >-
          Refusing to run: {{ hostvars[inventory_hostname].keys() | select('match', '_|ansible_(password|\w+_pass|\w+_password)$') | sort | join(', ') }}
          set from outside the playbook. Underscore-prefixed names and the become and
          connection passwords (every alias) are RESERVED for playbook internals: an extra var outranks the value the playbook
          computes, which would let a forged value decide a verdict or the step result it
          records, and an inventory var of the same name is refused alike, since the two
          cannot be told apart. Rename the colliding variable.
        quiet: true
      when: not (_extra_var_guard_nested is defined and '_extra_var_guard_nested' not in hostvars[inventory_hostname])

    - name: "Refuse an extra var that sets the connection identity"
      ansible.builtin.assert:
        that: _conn_forged | length == 0
        fail_msg: >-
          Refusing to run: {{ _conn_forged | join(', ') }} set as an extra var. The connection
          identity (host, user, port, connection type, ssh arguments, become method, user and
          flags, key file) comes from the inventory alone: an extra var outranks it, and with
          host-key checking off it would send the run, and the credentials it carries, to a
          target the launcher chose. Set it in the inventory instead.
        quiet: true
      vars:
        # Underscore names: an extra var of either is refused by the first task, which ends the
        # run before this one starts. Task vars are not in hostvars, so that task never sees them.
        _conn_names:
          - ansible_host
          - ansible_ssh_host
          - ansible_user
          - ansible_ssh_user
          - ansible_port
          - ansible_ssh_port
          - ansible_connection
          - ansible_ssh_common_args
          - ansible_ssh_extra_args
          - ansible_ssh_args
          - ansible_ssh_executable
          - ansible_scp_extra_args
          - ansible_sftp_extra_args
          - ansible_become_method
          - ansible_become_user
          - ansible_become_exe
          - ansible_become_flags
          - ansible_private_key_file
          - ansible_ssh_private_key_file
          - ansible_private_key
          - ansible_ssh_private_key
          - ansible_private_key_passphrase
          - ansible_ssh_private_key_passphrase
          - ansible_scp_executable
          - ansible_sftp_executable
          - ansible_ssh_pkcs11_provider
          - ansible_sudo_user
          - ansible_sudo_exe
          - ansible_sudo_flags
          - ansible_sudo_chdir
          - ansible_host_key_checking
          - ansible_ssh_host_key_checking
        _conn_forged: "{{ _conn_names | intersect('' | extra_var_names) | sort }}"
      when: not (_extra_var_guard_nested is defined and '_extra_var_guard_nested' not in hostvars[inventory_hostname])
