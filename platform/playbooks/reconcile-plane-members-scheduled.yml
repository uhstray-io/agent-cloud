---
# reconcile-plane-members-scheduled.yml — the scheduled, APPLYING run of reconcile-plane-members.yml.
#
# Plane workspace membership follows the Authentik groups (change task 2.7). A Semaphore schedule
# cannot answer a survey, and reconcile-plane-members.yml is read-only unless `apply` is true, so
# a schedule on that template would only ever report. This wrapper sets `apply` for the imported
# plays instead. Everything else is the reconcile's own: the mass-removal refusal still holds
# (an apply that would remove more than half the workspace, or with no desired members, is refused
# unless allow_mass_removal=true, which this wrapper never sets), --check still never applies, and
# an explicit `-e apply=false` still wins over this play-level value.
#
# Registered on a schedule only after a production apply succeeded (Semaphore task 11753,
# 2026-11-03), as task 2.7 requires.

# First, as in every launchable playbook: an extra var outranks every value set below, so one
# that sets an internal (underscore-prefixed) name is refused before anything runs.
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Reconcile Plane workspace members (scheduled apply)"
  ansible.builtin.import_playbook: reconcile-plane-members.yml
  vars:
    apply: "true"
