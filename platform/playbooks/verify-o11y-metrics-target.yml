---
# Read-only production receipt for one named Prometheus target and metric family.
- name: Require the reviewed metrics verification inputs
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read the controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Refuse a different revision or incomplete target
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - _controller_revision.stdout == expected_repository_sha
          - _controller_changes.stdout | length == 0
          - groups.get('o11y_svc', []) | length == 1
          - expected_service | default('') is match('^[a-z][a-z0-9-]*$')
          - expected_instance | default('') is match('^[a-zA-Z0-9.-]+:[0-9]+$')
          - expected_metric | default('') is match('^[a-zA-Z_:][a-zA-Z0-9_:]*$')
          - expected_metric != 'up'
        fail_msg: "Use the exact reviewed Dev revision and one declared service, instance, and metric."

- name: Prove the target and its metric are collected
  hosts: o11y_svc
  gather_facts: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
  tasks:
    - name: Verify the target's healthy scrape
      ansible.builtin.include_tasks: tasks/verify-o11y-metrics.yml

    - name: Query the named metric from the exact target
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - wget
          - -q
          - -O
          - "-"
          - "http://prometheus:9090/api/v1/query?query={{ (expected_metric ~ '{service=\"' ~ expected_service ~ '\",instance=\"' ~ expected_instance ~ '\"}') | urlencode }}"
      register: _metric_query
      changed_when: false
      check_mode: false

    - name: Require a live named metric series
      ansible.builtin.assert:
        that:
          - _metric_json.status == 'success'
          - _metric_json.data.result | length > 0
        fail_msg: "Prometheus has no {{ expected_metric }} series for {{ expected_service }} at {{ expected_instance }}."
        success_msg: "Prometheus has healthy {{ expected_service }} at {{ expected_instance }} and {{ expected_metric }} series."
      vars:
        _metric_json: "{{ _metric_query.stdout | from_json }}"
