---
# restore-n8n-db.yml — DESTRUCTIVE: overwrite the composable n8n stack's
# database with a named pg_dump (design D7). The paired backup is
# backup-n8n-db.yml; together they are the standing upgrade/rollback tool and,
# composed once, the prod cutover's data path.
#
# This play addresses EXACTLY ONE stack — the composable one. The Postgres
# container is deliberately NOT parameterized here (unlike the backup): a
# destructive play whose target can be aimed half at one stack and half at
# another (stop these app containers, restore into that other database) is a
# wrong-target hazard, not flexibility.
#
# The dump file is REQUIRED and EXPLICIT (-e n8n_dump_file=<path>) — never
# "the latest one", which two runs a minute apart would resolve differently.
#
# Sequence: stop the n8n app containers (Postgres itself stays up) -> load the
# dump into a fresh STAGING database (--single-transaction, ON_ERROR_STOP) ->
# only on success, swap staging into place, keeping the prior live database
# as <name>_prev until the NEXT restore -> start the app containers. The
# start lives in an `always:` block, and the live database is never dropped
# before the dump has provably loaded — a failed restore must leave the data
# intact AND the service running, never either gone.
# n8n re-runs its schema migrations at boot, so restoring an older version's
# dump under a newer image is the UPGRADE path, not an error — watch the app
# container's logs on a major jump.

# Ansible exits 0 on "no hosts matched" — the false green
# preflight-target-group.yml exists to stop.
- name: "Pre-flight: target group is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: n8n_svc
    preflight_group_expected: n8n_svc

- name: "Restore the n8n database from a named dump"
  hosts: n8n_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    _pg_container: workflow-n8n-postgres
    _db_user: "{{ n8n_db_user | default('n8n_admin') }}"
    _db_name: "{{ n8n_db_name | default('n8n') }}"
    # The role n8n connects as (compose DB_POSTGRESDB_USER); the recreated
    # database is owned by it so boot migrations have schema rights.
    _db_app_user: "{{ n8n_db_app_user | default('n8n_user') }}"
    # The dump restores into STAGING first; the live database is replaced only
    # after the whole dump has loaded, and the prior live database survives as
    # _prev_db until the NEXT restore — so a bad dump can never destroy the
    # only copy of the data.
    _staging_db: "{{ _db_name }}_restore_staging"
    _prev_db: "{{ _db_name }}_prev"
    _app_containers: [workflow-n8n, workflow-n8n-worker]
    # Same default + override as deploy-n8n.yml Phase 3, so whatever hostname
    # works for the deploy's verify works here.
    _n8n_base: "{{ n8n_base_url | default('http://workflow-n8n:5678') }}"

  tasks:
    - name: "Require an explicit dump file"
      ansible.builtin.assert:
        that:
          - n8n_dump_file is defined
          - n8n_dump_file | length > 0
        fail_msg: >-
          Pass -e n8n_dump_file=<path> explicitly (backup-n8n-db.yml's report
          names it). This play never guesses "the latest dump".

    - name: "Assert the dump exists and is non-empty"
      ansible.builtin.stat:
        path: "{{ n8n_dump_file }}"
      register: _dump
      failed_when: not _dump.stat.exists or _dump.stat.size == 0

    - name: "Assert the Postgres container is running"
      ansible.builtin.command:
        argv: ["{{ _engine }}", "inspect", "--format", "{{ '{{.State.Running}}' }}", "{{ _pg_container }}"]
      register: _pg_state
      changed_when: false
      failed_when: _pg_state.rc != 0 or _pg_state.stdout != 'true'

    - name: "Restore with the app stopped; ALWAYS start it back up"
      block:
        - name: "Stop the n8n app containers (one call — Postgres stays up)"
          ansible.builtin.command:
            argv: "{{ [_engine, 'stop'] + _app_containers }}"
          changed_when: true

        - name: "Recreate the staging database (a --clean dump cannot cross schema generations)"
          # The dump's --clean statements drop objects one by one, which fails
          # the moment the TARGET schema is a different n8n generation — its
          # migrations add tables holding FK constraints onto objects the dump
          # wants to drop (seen live in prod: a 2.8.3 dump against a
          # 2.25.7-migrated database). So the dump loads into a fresh, empty
          # STAGING database, and the live one is not touched until the whole
          # dump has provably loaded. Cluster-level roles survive; table
          # ownership comes from the dump's own statements; n8n's boot
          # migrations lift the restored data to the running version.
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - "{{ _pg_container }}"
              - psql
              - "-U"
              - "{{ _db_user }}"
              - "-d"
              - postgres
              - "-c"
              - "DROP DATABASE IF EXISTS {{ _staging_db }} WITH (FORCE);"
              - "-c"
              - "CREATE DATABASE {{ _staging_db }} OWNER {{ _db_app_user }};"
          changed_when: true

        - name: "Restore the dump into staging (single transaction, stop on first error)"
          # stdin comes from the host file; the dump's content never enters the
          # run record. A failure here leaves the LIVE database untouched —
          # the always: block below restarts the app on exactly the data it
          # had. Every interpolation is shell-quoted — the dump path arrives
          # as a survey string.
          ansible.builtin.shell: >-
            {{ _engine | quote }} exec -i {{ _pg_container | quote }}
            psql -U {{ _db_user | quote }} -d {{ _staging_db | quote }}
            -v ON_ERROR_STOP=1 --single-transaction
            < {{ n8n_dump_file | quote }} > /dev/null
          changed_when: true

        - name: "Swap staging into place (prior live database kept as {{ _prev_db }})"
          # Only reached when the dump fully loaded. Renames are catalog
          # operations; the app containers are stopped, so nothing is
          # connected to the live database. Each statement runs as its own
          # psql command (DROP/ALTER DATABASE refuse transaction blocks). The
          # prior live database is RETAINED under _prev_db until the next
          # restore drops it — a restore that health-checks green tonight can
          # still be second-guessed tomorrow.
          ansible.builtin.command:
            argv:
              - "{{ _engine }}"
              - exec
              - "{{ _pg_container }}"
              - psql
              - "-U"
              - "{{ _db_user }}"
              - "-d"
              - postgres
              - "-c"
              - "DROP DATABASE IF EXISTS {{ _prev_db }} WITH (FORCE);"
              - "-c"
              - "ALTER DATABASE {{ _db_name }} RENAME TO {{ _prev_db }};"
              - "-c"
              - "ALTER DATABASE {{ _staging_db }} RENAME TO {{ _db_name }};"
          changed_when: true

      always:
        - name: "Start the n8n app containers (n8n re-runs migrations at boot)"
          ansible.builtin.command:
            argv: "{{ [_engine, 'start'] + _app_containers }}"
          changed_when: true

    - name: "Wait for n8n health (/healthz -> 200; migrations may take a while)"
      ansible.builtin.uri:
        url: "{{ _n8n_base }}/healthz"
        status_code: [200]
      register: _n8n
      retries: 24
      delay: 5
      until: _n8n.status == 200

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          Restored {{ _db_name }} in {{ _pg_container }} from {{ n8n_dump_file }}
          and n8n answered /healthz. The pre-restore database is retained as
          {{ _prev_db }} until the next restore drops it. On a version jump,
          confirm workflows execute and stored credentials decrypt before
          calling the restore validated — the schema migrations n8n ran at
          boot are one-way.
