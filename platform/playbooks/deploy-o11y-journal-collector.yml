        msg: "Collector journal diagnostic: entry_count={{ (_journal_directory_survey.stdout | from_json).entry_count }}, permission_denied_target={{ (_journal_directory_survey.stdout | from_json).permission_denied_target }}"

- name: Repair only the journal positions volume root ownership
  hosts: o11y_svc
  gather_facts: false
  become: false
  tasks:
    - name: Leave the repair play unless the explicit repair action was selected
      ansible.builtin.meta: end_host
      when: journal_collector_action | default('apply') != 'repair-positions'
      tags: [always]

    - name: Run the separately selected guarded positions repair
      ansible.builtin.command:
        argv: [python3, "-", repair-positions]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/o11y-journal-positions.py') }}"
        stdin_add_newline: false
      register: _journal_positions_repair
      changed_when: (_journal_positions_repair.stdout | default('{}') | from_json).status == 'repaired'
      failed_when: false
      when: not ansible_check_mode

    - name: Record positions repair as unverified in check mode
      ansible.builtin.set_fact:
        _journal_positions_repair:
          rc: 0
          stdout: '{"status":"check_mode_unverified","reason":"not_run"}'
      when: ansible_check_mode

    - name: Require repair completion or explicit check-mode unverified state
      ansible.builtin.assert:
        that:
          - _journal_positions_repair.rc | default(1) == 0
          - (_journal_positions_repair.stdout | default('{}') | from_json).status in ['repaired', 'already_correct', 'check_mode_unverified']
        fail_msg: >-
          Positions repair outcome={{ (_journal_positions_repair.stdout | default('{}') | from_json).status }}.
          Treat the reason as {{ (_journal_positions_repair.stdout | default('{}') | from_json).get('reason', 'unverified') }}.
          Failed pending checks={{ (_journal_positions_repair.stdout | default('{}') | from_json).get('pending_repair_diagnostic', {}).get('failed_checks', []) }}.
            Treat an uncertain result as requiring a fresh survey before any retry.
            No recursive tree ownership change is performed; root mode or owner/group may already have changed before an uncertain result.
        quiet: true

    - name: Report bounded positions repair outcome
      ansible.builtin.debug:
        msg: "Positions repair: {{ (_journal_positions_repair.stdout | default('{}') | from_json).status }} ({{ (_journal_positions_repair.stdout | default('{}') | from_json).reason }})"
      changed_when: false
