          - (_journal_directory_survey.stdout | from_json).entry_count | int <= 80
          - (_journal_directory_survey.stdout | from_json).permission_denied_target in ['journal', 'positions', 'config', 'other', 'none', 'unavailable']
        fail_msg: "The standard journal directory survey failed without exposing journal data."
