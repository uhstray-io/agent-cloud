_free_inodes","graphroot_free_bytes","graphroot_free_inodes"]},"live_diagnostic":{"top_level":{"seed_file":"unverified","journal_component":"unverified","other_files":"unverified","other_directories":"unverified","other_symlinks":"unverified","other_kinds":"unverified","receiver_component":"unverified","exporter_component":"unverified"},"role_metadata":{"receiver":{"owner":"unverified","access":"unverified","acl":"unverified","mount":"unverified","children":"unverified"},"exporter":{"owner":"unverified","access":"unverified","acl":"unverified","mount":"unverified","children":"unverified"}},"unmatched_directories":{"count":"unverified","owner":{"matches_collector":"unverified","mismatch":"unverified","unverified":"unverified"},"access":{"read_write_execute":"unverified","blocked":"unverified","unverified":"unverified"},"acl":{"absent":"unverified","present":"unverified","unverified":"unverified"},"mount":{"clear":"unverified","ambiguous":"unverified","unverified":"unverified"},"children":{"empty":"unverified","nonempty":"unverified","unverified":"unverified"}}}}'
      when: ansible_check_mode

    - name: Require bounded positions-volume survey fields
