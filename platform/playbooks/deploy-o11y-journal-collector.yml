      ansible.builtin.assert:
        that:
          - _journal_directory_survey.rc | default(1) == 0
          - (_journal_directory_survey.stdout | default('{}') | from_json).result in ['/var/log/journal', '/run/log/journal', 'ambiguous', 'none', 'probe_unavailable', 'check_mode_unverified']
