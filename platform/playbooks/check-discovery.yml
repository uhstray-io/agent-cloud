---
# Read-only incident evidence. No GPS repair, raw logs, secret mint or restart.
# Container inspection is a bounded CLI read (01-automation-model: GI spine).
- name: "Validate discovery diagnostic scope before connecting"
  hosts: localhost
  connection: local
  any_errors_fatal: true
  gather_facts: false
  tasks:
    - name: "Require the declared NetBox target and explicit log window"
      ansible.builtin.assert:
        that:
          - groups.get('netbox_svc', []) | length > 0
          - discovery_log_since is defined
          - discovery_log_until is defined
          - discovery_expected_revision | default('') is match('^[a-f0-9]{40}$')
        fail_msg: "discovery_scope_missing: require netbox_svc, exact reviewed revision and zoned ISO since/until timestamps."

    - name: "Read the actual controller checkout revision"
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir }}/../.."
      register: _discovery_revision
      changed_when: false
      check_mode: false

    - name: "Check diagnostic source matches the committed checkout"
      ansible.builtin.command:
        argv:
          - git
          - status
          - --porcelain
          - --
          - platform/playbooks/check-discovery.yml
          - platform/playbooks/files/discovery-diagnostics.py
          - platform/playbooks/tasks/resolve-become-password.yml
          - platform/playbooks/tasks/assert-bao-transport.yml
        chdir: "{{ playbook_dir }}/../.."
      register: _discovery_dirty
      changed_when: false
      check_mode: false

    - name: "Require the reviewed diagnostic revision before target access"
      ansible.builtin.assert:
        that:
          - _discovery_revision.stdout == discovery_expected_revision
          - _discovery_dirty.stdout | length == 0
        fail_msg: "discovery_revision_mismatch: reviewed committed diagnostic source is required."

    - name: "Validate the zoned log window locally before target access"
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
            import json, runpy, sys
            try:
                module = runpy.run_path(sys.argv[1])
                module['validate_window'](json.load(sys.stdin))
            except Exception:
                sys.exit('discovery_window_invalid: require zoned ISO timestamps with since before until.')
          - "{{ playbook_dir }}/files/discovery-diagnostics.py"
        stdin: "{{ {'since': discovery_log_since, 'until': discovery_log_until} | to_json }}"
      changed_when: false
      check_mode: false

- name: "Read NetBox discovery incident evidence"
  hosts: netbox_svc
  gather_facts: false
  become: false
  tasks:
    - name: "Resolve existing privilege escalation through OpenBao"
      ansible.builtin.include_tasks: tasks/resolve-become-password.yml

    - name: "Collect bounded sanitized evidence without modifying NetBox or containers"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('file', 'files/discovery-diagnostics.py') }}"
        stdin: >-
          {{ {'runtime': container_engine | default('docker'),
              'since': discovery_log_since, 'until': discovery_log_until} | to_json }}
      become: true
      register: _discovery_diagnostic
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "Require a completed collector response before parsing evidence"
      ansible.builtin.assert:
        that:
          - _discovery_diagnostic.rc | default(-1) == 3
          - (_discovery_diagnostic.stdout | default('')) is match('^\s*\{')
        fail_msg: "discovery_collector_unavailable: collector did not return its structured evidence."

    - name: "Report the sanitized diagnostic evidence"
      ansible.builtin.debug:
        msg: "{{ _discovery_diagnostic.stdout | from_json }}"

    - name: "Refuse to mistake baseline collection for discovery recovery"
      ansible.builtin.fail:
        msg: >-
          discovery_acceptance_unverified: inspect the reported read failures and log coverage.
          Text signals and aggregate counts do not prove source collection or reconciliation.
          Preserve this evidence before any separately authorized deployment.
