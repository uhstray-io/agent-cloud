---
# deploy-github-runner.yml — stand up one self-hosted GitHub Actions runner.
#
# Composed from the existing pattern: credentials -> place -> deploy -> verify. The
# runner-specific parts are the credential chain and the isolation config; everything
# else reuses what the platform already has.
#
# WHY THE CREDENTIAL WORK IS DELEGATED TO THE CONTROLLER, not run on the host:
# a runner host is semi-trusted (it executes repository-authored code) and is DENIED
# network access to OpenBao by its firewall declaration. So it cannot fetch its own
# secret even if it held a credential — which is the point. The controller mints a
# registration token and hands it over in memory; nothing durable lands on the host.
#
# A registration token is SINGLE USE, so it is minted per host. Nothing here is
# run_once: two runners need two tokens, and reusing one would fail the second host
# with a message about an expired credential that is really a reuse.
#
# Usage (via Semaphore):
#   -e target_service=github_runner_svc
#   -e github_app_client_id=...        (installation id is discovered, not declared)
#   App private key: read from OpenBao at
#   secret/services/github-runner:app_private_key. NOT from an environment secret and
#   never a survey var — Semaphore persists survey values, and one authoritative channel
#   for a private key is the point of having a secret store.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# A play over no hosts exits 0 and records a deploy that did nothing as a success
# (docs/MISTAKES.md 2.21). preflight-target-group.yml refuses a survey-driven group, so
# the guard is inline: it reads the SAME target_service as the work, so one override
# moves both, and it only proves that group is populated (check-secrets.yml form).
- name: "Pre-flight: target group is real"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: "Require target_service to name a populated inventory group"
      ansible.builtin.assert:
        that: (groups.get(target_service | default('github_runner_svc'), []) | length) > 0
        fail_msg: "target_service '{{ target_service | default('github_runner_svc') }}' matches no hosts in this inventory: nothing would be deployed."

- name: "Deploy GitHub Actions self-hosted runner"
  hosts: "{{ target_service | default('github_runner_svc') }}"
  gather_facts: true
  become: true

  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # This deploy reads its one secret directly rather than through manage-secrets; declared so
    # Check Secrets knows the deploy cannot run without it (PR 203 Codex review).
    _required_existing_secrets: [app_private_key]
    _org: "{{ github_org | default('uhstray-io') }}"
    # The JWT issuer. Upstream recommends the App's CLIENT ID and accepts the app id;
    # both are opaque strings here, so either is taken and the client id wins when both
    # are declared. The App's OAuth client SECRET is not used by App authentication at
    # all and is deliberately absent from this playbook.
    _app_id: >-
      {{ github_app_client_id
         | default(lookup('env', 'GITHUB_APP_CLIENT_ID'), true)
         | default(github_app_id, true)
         | default(lookup('env', 'GITHUB_APP_ID'), true)
         | default('', true) }}
    _install_id: "{{ github_app_installation_id | default(lookup('env', 'GITHUB_APP_INSTALLATION_ID'), true) | default('', true) }}"
    _home: "{{ github_runner_home | default('/opt/actions-runner') }}"
    _account: "{{ github_runner_account | default('ghrunner') }}"
    _rver: "{{ github_runner_version | default('2.336.0') }}"
    # Where the monorepo lands ON THE TARGET, and where this service's deploy.sh sits
    # inside it. The script runs on the host, so it must be reached by a path that exists
    # there — playbook_dir is the CONTROLLER's checkout and resolving a remote command
    # against it yields rc=127. Templates are the opposite case: `template:` reads its src
    # on the controller, so playbook_dir is correct for those and wrong here.
    #
    # monorepo_deploy_path is the path WITHIN the repo — that is what
    # platform/playbooks/README.md defines and what all twelve other services pass to
    # tasks/manage-secrets.yml and friends. An earlier version of this play read it as the
    # repo ROOT, which only worked because the inventory had been set to an absolute path
    # to match. Anyone following the documented convention would have produced
    # <deploy-path>/<deploy-path>/deploy.sh and an rc=127.
    #
    # The root default is under /opt rather than the peer services' ~ansible_user,
    # deliberately: deploy.sh executes as the unprivileged RUNNER account, which cannot be
    # relied on to read another user's home directory.
    _monorepo_dir: "{{ local_monorepo_dir | default('/opt/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _hver: "{{ github_runner_hooks_version | default('0.8.1') }}"

  tasks:
    - name: "Validate the declaration"
      ansible.builtin.assert:
        that:
          - _bao_url | length > 0
          - _app_id | length > 0
          - github_runner_name | default('') | length > 0
          - (github_runner_labels | default([])) | length > 0
          - github_runner_group | default('') | length > 0
          - monorepo_deploy_path | default('') | length > 0
          # CONTAINED. Non-empty is not enough: this value is concatenated onto the repo
          # root and the result is EXECUTED, so `../../etc` would run a script from
          # outside the checkout. Reject an absolute path and any parent traversal.
          - not (monorepo_deploy_path | default('') is match('^/'))
          - "'..' not in ((monorepo_deploy_path | default('')).split('/'))"
        fail_msg: >-
          Need the OpenBao address, the App's client id (or app id), and this host's
          github_runner_name / github_runner_labels / github_runner_group in inventory.
          The declaration is the allocation — a runner without declared labels cannot be
          targeted by a workflow, and a runner without a group would land in the default
          group, which may admit repositories this plane must not serve.
          monorepo_deploy_path is the path WITHIN the repo to this service's deploy.sh —
          relative, and with no `..` component: it is concatenated onto the repo root and
          the result is executed.
        success_msg: "Declaration complete for {{ github_runner_name }}."

    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    # ── host prerequisites ─────────────────────────────────────────────────
    - name: "Place the monorepo on the target"
      # Shared Phase-1 preamble every composable deploy uses — the install script has to
      # exist on the host that runs it.
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Wait for a freshly-booted host to accept package installs"
      ansible.builtin.include_tasks: tasks/wait-for-apt.yml

    - name: "Install the runner's OS prerequisites"
      # unzip for the container-hooks archive; the runner bundles its own Node, so no
      # Node package is needed and pinning one would be a second version to drift.
      #
      # `acl` is not optional here, and its absence is nasty. Everything below runs as the
      # dedicated unprivileged account, and Ansible needs setfacl to hand its temporary
      # files to a become target that is neither root nor the connecting user. Without it
      # the register step dies in the become plumbing — a failure raised outside the
      # normal result path, so `failed_when: false` does NOT catch it and, under the
      # no_log the token requires, it surfaces as a censored fatal with no cause. Three
      # runs went into finding a missing package.
      ansible.builtin.apt:
        name: [curl, unzip, tar, ca-certificates, acl]
        state: present
        update_cache: true

    - name: "Create the unprivileged runner account"
      # No sudo entry, ever. This account is what makes the spec's "a job cannot
      # escalate to host administration" true, and it is deliberately NOT ansible_user,
      # which holds NOPASSWD sudo after hardening.
      ansible.builtin.user:
        name: "{{ _account }}"
        home: "{{ _home }}"
        shell: /bin/bash
        create_home: true
        state: present
      register: _runner_user

    - name: "Read the subordinate id files"
      # Rootless podman maps a container's users onto the account's /etc/subuid and
      # /etc/subgid ranges through newuidmap/newgidmap, and refuses multi-id images without
      # them. useradd allocates both for a new non-system account, but an account created
      # another way, or a file edited by hand, leaves them out. Asserted here, before
      # anything is registered, so a missing range fails the deploy and not the first job.
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/subuid, /etc/subgid]
      register: _subid_files
      check_mode: false

    - name: "Require a subordinate uid and gid range of at least 65536 for the runner account"
      # A line is `name-or-uid:start:count`, with no whitespace, so splitting the file on
      # whitespace yields its lines. 65536 is podman's own default size and the
      # least that maps an image using uid/gid 65534 (nobody). Summed, because an account
      # may hold more than one range.
      vars:
        _subid_owner: "^({{ _account | regex_escape }}{{ ('|' ~ _runner_user.uid) if (_runner_user.uid | default('') | string | length) > 0 else '' }}):[0-9]+:[0-9]+$"
        _subid_counts: >-
          {{ _subid_files.results
             | map(attribute='content') | map('b64decode') | map('split')
             | map('select', 'match', _subid_owner)
             | map('map', 'split', ':') | map('map', 'last') | map('map', 'int') | map('sum')
             | list }}
      ansible.builtin.assert:
        that:
          - _subid_counts | length == 2
          - _subid_counts[0] >= 65536
          - _subid_counts[1] >= 65536
        fail_msg: >-
          {{ _account }} holds {{ _subid_counts[0] | default('?') }} subordinate uids in
          /etc/subuid and {{ _subid_counts[1] | default('?') }} gids in /etc/subgid; rootless
          container jobs need at least 65536 of each. Add a range, for example
          `usermod --add-subuids 165536-231071 --add-subgids 165536-231071 {{ _account }}`
          with a start that overlaps no other account's range, then redeploy.
        success_msg: "{{ _account }} holds {{ _subid_counts[0] }} subordinate uids and {{ _subid_counts[1] }} gids."
      # A check-mode run against a host that does not have the account yet has nothing to
      # read; the real run creates the account, and useradd allocates the ranges.
      when: not (ansible_check_mode and (_runner_user.changed | default(false)))

    - name: "Confirm the runner account holds no sudo rights"
      # Asserted rather than assumed: a host that was once used for something else may
      # carry a stale sudoers entry, and the isolation claim rests on this being false.
      ansible.builtin.command: "sudo -l -U {{ _account }}"
      register: _sudocheck
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Refuse to proceed if the runner account can escalate"
      ansible.builtin.assert:
        that:
          - "'(ALL' not in (_sudocheck.stdout | default(''))"
          - "'NOPASSWD' not in (_sudocheck.stdout | default(''))"
        fail_msg: >-
          {{ _account }} appears to have sudo rights. A runner executes
          repository-authored code; granting it host administration defeats every other
          control here. Remove the sudoers entry before deploying.

    # ── setuid surface a job can reach ─────────────────────────────────────
    # The runner unit cannot set no_new_privs (rootless podman needs the setuid
    # newuidmap/newgidmap; see actions-runner.service.j2), so every setuid or setgid
    # program on the host can be executed by repository code as the runner account. These
    # are the ones a runner host has no use for: account self-service (chfn, chsh, passwd,
    # gpasswd, newgrp, chage, expiry), su (Ansible escalates with sudo, never su),
    # ssh-keysign (host-based SSH authentication, unused), the polkit authentication agent
    # helper (nothing here authenticates to polkit interactively), and crontab's setgid (a
    # user crontab is one way for a job to leave work running after it ends; systemd user
    # timers remain another, see Known limitations in the service CLAUDE.md). Root's use of
    # each is unaffected: only the privilege an unprivileged caller would gain is removed.
    #
    # dpkg-statoverride, not chmod: dpkg re-applies an override on every package upgrade,
    # where a chmod is silently undone by the next security update of the package.
    #
    # Deliberately KEPT: sudo (Ansible's own escalation path; the runner account has no
    # sudoers entry, asserted above), newuidmap/newgidmap (the reason no_new_privs is off),
    # fusermount3 (podman's fuse-overlayfs fallback), and mount/umount (they only honour
    # fstab entries marked `user`, and these hosts declare none).
    - name: "Remove the setuid and setgid bits a runner host does not use"
      ansible.builtin.shell: |
        set -euo pipefail
        f={{ item.path | quote }}
        if [ ! -e "$f" ]; then echo absent; exit 0; fi
        # An existing override prints as `owner group mode path`; the mode is compared
        # as a number because dpkg does not promise to print a leading zero.
        cur=$(dpkg-statoverride --list "$f" || true)
        co='' cg='' cm=''
        if [ -n "$cur" ]; then read -r co cg cm _ <<<"$cur"; fi
        if [ "$co" = {{ item.owner }} ] && [ "$cg" = {{ item.group }} ] && [ -n "$cm" ] \
           && [ "$((8#$cm))" -eq "$((8#{{ item.mode }}))" ] && [ ! -u "$f" ] && [ ! -g "$f" ]; then
          echo kept; exit 0
        fi
        if [ -n "$cur" ]; then dpkg-statoverride --remove "$f"; fi
        dpkg-statoverride --update --add {{ item.owner }} {{ item.group }} {{ item.mode }} "$f"
        echo changed
      args:
        executable: /bin/bash
      loop: "{{ _runner_setuid_strip }}"
      loop_control:
        label: "{{ item.path }}"
      vars:
        _runner_setuid_strip:
          - { path: /usr/bin/chfn, owner: root, group: root, mode: "0755" }
          - { path: /usr/bin/chsh, owner: root, group: root, mode: "0755" }
          - { path: /usr/bin/gpasswd, owner: root, group: root, mode: "0755" }
          - { path: /usr/bin/newgrp, owner: root, group: root, mode: "0755" }
          - { path: /usr/bin/passwd, owner: root, group: root, mode: "0755" }
          - { path: /usr/bin/su, owner: root, group: root, mode: "0755" }
          - { path: /usr/bin/chage, owner: root, group: shadow, mode: "0755" }
          - { path: /usr/bin/expiry, owner: root, group: shadow, mode: "0755" }
          - { path: /usr/bin/crontab, owner: root, group: crontab, mode: "0755" }
          - { path: /usr/lib/openssh/ssh-keysign, owner: root, group: root, mode: "0755" }
          - { path: /usr/lib/polkit-1/polkit-agent-helper-1, owner: root, group: root, mode: "0755" }
      register: _setuid_strip
      changed_when: "'changed' in _setuid_strip.stdout"
      when: not ansible_check_mode

    - name: "Read back the mode of each stripped helper"
      # Read from the file, not from the override database: the claim is about what a job
      # can execute, and only the inode says that.
      ansible.builtin.stat:
        path: "{{ item.item.path }}"
      loop: "{{ _setuid_strip.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path }}"
      register: _setuid_after
      when: not ansible_check_mode

    - name: "Require every stripped helper to carry no setuid or setgid bit"
      ansible.builtin.assert:
        that:
          - _setuid_still | length == 0
        fail_msg: "Still setuid or setgid after the override: {{ _setuid_still | join(', ') }}"
        success_msg: "No setuid or setgid bit on the helpers a runner host does not use."
      vars:
        _setuid_still: >-
          {{ _setuid_after.results | default([])
             | selectattr('stat', 'defined') | map(attribute='stat')
             | selectattr('exists') | rejectattr('isuid', 'false') | map(attribute='path') | list
             | union(_setuid_after.results | default([])
               | selectattr('stat', 'defined') | map(attribute='stat')
               | selectattr('exists') | rejectattr('isgid', 'false') | map(attribute='path') | list) }}
      when: not ansible_check_mode

    - name: "Enable lingering so the runner survives logout and reboot"
      ansible.builtin.include_tasks: tasks/enable-linger.yml
      vars:
        linger_user: "{{ _account }}"

    # ── pinned artefact digests (from the release metadata, not hardcoded) ──
    - name: "Fetch the release metadata for the pinned versions"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ item.repo }}/releases/tags/v{{ item.ver }}"
        method: GET
        headers:
          Accept: "application/vnd.github+json"
        status_code: [200]
      register: _releases
      loop:
        - { repo: "actions/runner", ver: "{{ _rver }}", asset: "actions-runner-linux-x64-{{ _rver }}.tar.gz" }
        - { repo: "actions/runner-container-hooks", ver: "{{ _hver }}", asset: "actions-runner-hooks-docker-{{ _hver }}.zip" }
      loop_control:
        label: "{{ item.repo }} v{{ item.ver }}"
      delegate_to: localhost
      become: false
      check_mode: false

    - name: "Extract each artefact's published digest"
      # Both releases expose a per-asset `digest` field ("sha256:..."), so no release-body
      # parsing is involved and the same code covers both artefacts.
      ansible.builtin.set_fact:
        _runner_sha256: "{{ ((_releases.results[0].json.assets | selectattr('name', 'equalto', 'actions-runner-linux-x64-' ~ _rver ~ '.tar.gz') | first).digest | default('')) | regex_replace('^sha256:', '') }}"
        _hooks_sha256: "{{ ((_releases.results[1].json.assets | selectattr('name', 'equalto', 'actions-runner-hooks-docker-' ~ _hver ~ '.zip') | first).digest | default('')) | regex_replace('^sha256:', '') }}"

    - name: "Require a digest for both artefacts"
      ansible.builtin.assert:
        that:
          - _runner_sha256 | length == 64
          - _hooks_sha256 | length == 64
        fail_msg: >-
          Could not read a published sha256 for runner v{{ _rver }} and/or hooks
          v{{ _hver }}. Refusing to install an unverified artefact — "no digest" and
          "unverified" are the same state from here.
        success_msg: "Digests resolved for runner v{{ _rver }} and hooks v{{ _hver }}."

    # ── credentials (no_log boundary, delegated to the controller) ──────────
    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Read the App private key from OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/github-runner"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200]
      register: _app_secret
      delegate_to: localhost
      become: false
      no_log: true
      check_mode: false

    - name: "Mint a single-use runner registration token"
      # Runs on the CONTROLLER: the runner host is firewalled away from the secret store
      # by design, so it could not do this itself. The key goes in on STDIN and the
      # token comes back on stdout — neither ever appears in argv, which is
      # world-readable through /proc.
      #
      # Python, not shell: the first version used openssl and jq, and this image has
      # neither, which surfaced from inside the no_log boundary as an unexplained
      # credential failure. ansible_playbook_python is used deliberately — a bare
      # `python3` may be a different build without the packages Ansible's interpreter has.
      #
      # `cryptography` is required and is DECLARED in
      # platform/requirements-controller.txt. It is present on the current controller
      # (verified: a registration succeeded through this path), but nothing declared it
      # before, and an undeclared dependency that disappears on an image rebuild fails
      # inside a no_log boundary — see the classification below, which names it.
      ansible.builtin.command:
        cmd: >-
          {{ ansible_playbook_python }}
          {{ playbook_dir }}/../lib/github_app_token.py registration-token
          --issuer {{ _app_id | quote }} --org {{ _org | quote }} --key -
        stdin: "{{ _app_secret.json.data.data.app_private_key }}"
      register: _regtoken
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      no_log: true
      check_mode: false

    # ── diagnosing a credential failure without printing the credential ────
    # Surfacing the helper's stderr is deliberate and safe: it emits only fixed
    # diagnostic strings, tokens are written to STDOUT, and curl runs with -sf so no
    # response body reaches stderr either. Diagnosability was bought without widening
    # what is exposed.
    #
    # no_log is correct on the mint (the token crosses it), but a no_log task that
    # simply fails leaves a Semaphore run undiagnosable — the failure mode AGENTS.md
    # calls out. The resolution is not to widen no_log but to emit a CLASSIFICATION:
    # the helper's stderr is matched against its own known messages and only the verdict
    # is printed. Shapes, counts and verdicts are safe; values are not.
    - name: "Classify the outcome without exposing any credential"
      ansible.builtin.set_fact:
        # Matches the PEM armour prefix WITHOUT spelling out the full header: the
        # secret-scanning hooks (rightly) reject that literal in source, and a shape
        # check does not need it.
        _pem_has_header: "{{ (_app_secret.json.data.data.app_private_key | default('')) is match('^-----BEGIN') }}"
        _pem_lines: "{{ ((_app_secret.json.data.data.app_private_key | default('')).split('\n')) | length }}"
        _mint_verdict: >-
          {{ 'OK' if (_regtoken.rc | default(1)) == 0
             else 'a required tool or library is missing on the controller' if ((_regtoken.rc | default(0)) == 127 or 'cryptography' in (_regtoken.stderr | default('')) or 'not found' in (_regtoken.stderr | default('')))
             else 'the stored key could not be parsed as a PEM private key' if ('could not be parsed' in (_regtoken.stderr | default('')))
             else 'the App authenticates but is installed nowhere' if ('no installations' in (_regtoken.stderr | default('')))
             else 'the App is installed, but not on this organisation' if ('not on' in (_regtoken.stderr | default('')))
             else 'the assertion was rejected — issuer or key mismatch' if ('could not list installations' in (_regtoken.stderr | default('')))
             else 'the App lacks organisation self-hosted-runners write' if ('could not obtain a runner' in (_regtoken.stderr | default('')))
             else 'unclassified failure' }}
      no_log: true

    - name: "Report the credential outcome (verdict and shapes only)"
      ansible.builtin.debug:
        msg: >-
          mint rc={{ _regtoken.rc | default('?') }} -> {{ _mint_verdict }};
          stored key: PEM armour present={{ _pem_has_header }},
          lines={{ _pem_lines }} (a 2048-bit RSA PEM is ~27 lines; 1 means the
          newlines were lost in transit).
          Helper stderr: {{ (_regtoken.stderr | default('')) | trim }}

    - name: "Fail if no registration token was minted"
      ansible.builtin.assert:
        that:
          - (_regtoken.rc | default(1)) == 0
          - (_regtoken.stdout | default('')) | length > 0
        fail_msg: "No registration token: {{ _mint_verdict }}."
        success_msg: "Registration token minted."

    # ── configuration (visible: these must stay diagnosable) ───────────────
    - name: "Render the runner's configuration"
      ansible.builtin.file:
        path: "{{ _home }}/config"
        state: directory
        owner: "{{ _account }}"
        group: "{{ _account }}"
        mode: "0750"

    - name: "Pin the resolved values the templates read"
      # The templates read the RAW inventory names, and the play's `_`-prefixed copies are
      # defined FROM those names (`_rver: github_runner_version | default(...)`). Mapping a
      # raw name back to its copy in a task's `vars` makes the name refer to itself, and
      # ansible-core fails the render with "Recursive loop detected in template". set_fact
      # resolves each copy once, here, where the raw name is not yet shadowed.
      ansible.builtin.set_fact:
        _tpl_home: "{{ _home }}"
        _tpl_org: "{{ _org }}"
        _tpl_rver: "{{ _rver }}"
        _tpl_hver: "{{ _hver }}"

    - name: "Template the runner's declaration, job env and job hooks"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/github-runner/deployment/templates/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ _account }}"
        group: "{{ _account }}"
        mode: "{{ item.mode }}"
      # The templates read the RAW inventory names, while this play resolves defaulted
      # `_`-prefixed copies. Mapping them here means a declaration that relies on a play
      # default still renders — otherwise the first host to omit, say,
      # github_runner_hooks_version fails with an undefined-variable error at render time.
      vars:
        github_runner_home: "{{ _tpl_home }}"
        github_org: "{{ _tpl_org }}"
        github_runner_version: "{{ _tpl_rver }}"
        github_runner_hooks_version: "{{ _tpl_hver }}"
      loop:
        - { src: "runner.env.j2", dest: "{{ _home }}/config/runner.env", mode: "0640" }
        - { src: "runner-dotenv.j2", dest: "{{ _home }}/.env", mode: "0640" }
        - { src: "job-cleanup.sh.j2", dest: "{{ _home }}/job-cleanup.sh", mode: "0750" }
        - { src: "job-started.sh.j2", dest: "{{ _home }}/job-started.sh", mode: "0750" }
      loop_control:
        label: "{{ item.dest }}"
      register: _runner_files

    - name: "Create the account's systemd user-unit directory"
      # systemd --user only reads units from this path, and it does not exist on a fresh
      # account. Templating the unit straight in fails on the missing parent, which is a
      # confusing way to learn that the directory is the prerequisite.
      ansible.builtin.file:
        path: "{{ _home }}/.config/systemd/user"
        state: directory
        owner: "{{ _account }}"
        group: "{{ _account }}"
        mode: "0755"

    - name: "Install the runner's systemd user unit"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/github-runner/deployment/templates/actions-runner.service.j2"
        dest: "{{ _home }}/.config/systemd/user/actions-runner.service"
        owner: "{{ _account }}"
        group: "{{ _account }}"
        mode: "0644"
      vars:
        github_runner_home: "{{ _tpl_home }}"
      register: _runner_unit

    # ── install + register ─────────────────────────────────────────────────
    - name: "Install and register the runner"
      # The token arrives on stdin. `no_log` covers only this task: the install and the
      # verification below stay visible, because a censored deploy is an undiagnosable one
      # (AGENTS.md — no_log is for the credential boundary, not the whole run).
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s' "$REG_TOKEN" | {{ _deploy_dir }}/deploy.sh configure
      args:
        executable: /bin/bash
      environment:
        REG_TOKEN: "{{ _regtoken.stdout }}"
        RUNNER_ENV_FILE: "{{ _home }}/config/runner.env"
      become: true
      become_user: "{{ _account }}"
      register: _configured
      changed_when: "'registered' in (_configured.stdout | default(''))"
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    # Same reasoning as the mint: no_log belongs on the step the token crosses, but a
    # no_log step that merely fails is undiagnosable. The script never echoes the token
    # and the runner's own configuration masks secrets it is given, so its output is safe
    # to surface — and surfacing it is what turns "failed" into something actionable.
    - name: "Report the registration outcome"
      ansible.builtin.debug:
        msg: >-
          register rc={{ _configured.rc | default('?') }}
          {{ ('stdout: ' ~ ((_configured.stdout | default('')) | trim)) if (_configured.stdout | default('')) | length > 0 else '' }}
          {{ ('stderr: ' ~ ((_configured.stderr | default('')) | trim)) if (_configured.stderr | default('')) | length > 0 else '' }}

    - name: "Fail if the runner did not register"
      ansible.builtin.assert:
        that:
          - (_configured.rc | default(1)) == 0
        fail_msg: "The runner did not register — see the reported rc and output above."
        success_msg: "Runner registered."
      # The register step is skipped under --check, so it leaves no rc to judge. Without
      # this guard every dry run stopped here (Semaphore task 4631), before the read-only
      # service checks below, which do run in check mode.
      when: not ansible_check_mode

    - name: "Resolve the runner account's uid"
      # Looked up, not assumed. systemd --user talks to a bus under /run/user/<uid>, and
      # a hardcoded 1000/1001 is a guess that silently targets the wrong user's bus on a
      # host where accounts were created in a different order.
      ansible.builtin.getent:
        database: passwd
        key: "{{ _account }}"

    - name: "Record the uid and the user bus it implies"
      ansible.builtin.set_fact:
        _runner_uid: "{{ getent_passwd[_account][1] }}"

    - name: "Create the directory for the runner's own docker wrapper"
      # Not the runner's bin/: that holds the runner's own binaries, from its archive.
      ansible.builtin.file:
        path: "{{ _home }}/_bin"
        state: directory
        owner: "{{ _account }}"
        group: "{{ _account }}"
        mode: "0750"

    - name: "Install the docker wrapper the container hooks run"
      # The hooks start `docker` with only the job's environment variables, which include
      # HOME=/github/home and no XDG_* directories, so rootless podman looked for its
      # configuration and its image store under a path that exists only inside the job
      # container. Every container job failed in "Initialize containers" with `cannot
      # resolve /github/home`. The wrapper sets the account's own directories and runs
      # podman unchanged; the runner's PATH (.env) lists _bin first. Templated after the
      # uid lookup because XDG_RUNTIME_DIR is /run/user/<uid>. The full reasoning is in
      # docker-wrapper.sh.j2 and the service CLAUDE.md, "Container jobs under rootless
      # podman".
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/github-runner/deployment/templates/docker-wrapper.sh.j2"
        dest: "{{ _home }}/_bin/docker"
        owner: "{{ _account }}"
        group: "{{ _account }}"
        mode: "0750"
      vars:
        github_runner_home: "{{ _tpl_home }}"
        github_runner_uid: "{{ _runner_uid }}"

    - name: "Give job containers the runner account's own podman socket, never root's"
      # The runner mounts /var/run/docker.sock into every job container; the path is
      # hardcoded upstream and no setting removes it (see the task file). podman-docker
      # links it to root's socket, which the account cannot reach, so every container job
      # failed in "Initialize containers". Pointed at the account's rootless socket, a job
      # container gets what a plain job on this host already has (it runs as this
      # account), and no account gets root's socket. Options weighed and isolation
      # reasoning: the service CLAUDE.md, "Container jobs under rootless podman".
      ansible.builtin.include_tasks: tasks/podman-user-docker-socket.yml
      vars:
        pds_user: "{{ _account }}"
        pds_uid: "{{ _runner_uid }}"

    - name: "Reload the account's systemd and start the runner"
      ansible.builtin.systemd_service:
        name: actions-runner.service
        scope: user
        daemon_reload: true
        enabled: true
        # RESTART when the unit or the runner's .env changed. A running process keeps the
        # properties it was started with (no_new_privs above all: it can never be
        # cleared), and the runner reads .env only when it starts
        # (Runner.Listener/Program.cs), so `started` alone would leave either change inert
        # on a runner that is already up until the host next reboots. A restart sends
        # SIGTERM to the runner and waits up to TimeoutStopSec for it, so an in-flight job
        # on this host may be cut short.
        state: >-
          {{ 'restarted'
             if (_runner_unit.changed | default(false))
                or ('runner-dotenv.j2' in (_runner_files.results | default([])
                    | selectattr('changed') | map(attribute='item.src') | list))
             else 'started' }}
      become: true
      become_user: "{{ _account }}"
      # Without XDG_RUNTIME_DIR, `systemctl --user` reports "Failed to connect to bus:
      # No medium found" — sudo does not set it, and lingering creates the runtime
      # directory but cannot tell a non-login shell where it is.
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ _runner_uid }}"

    # ── verify (deliberately NOT no_log) ───────────────────────────────────
    - name: "Confirm the runner service is active"
      ansible.builtin.command: "systemctl --user is-active actions-runner.service"
      become: true
      become_user: "{{ _account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ _runner_uid }}"
      register: _active
      changed_when: false
      # EXACT match, not a substring. `systemctl --user is-active` prints "inactive" for a
      # stopped unit, and "inactive" CONTAINS "active" — so `'active' not in stdout` was
      # False for a dead runner and this gate passed it. The final verification reported
      # success for a runner serving nothing.
      failed_when: "(_active.stdout | default('') | trim) != 'active'"
      check_mode: false

    # Rootless containers are proved in the context jobs actually run in. A check run
    # through become_user is a sudo session from the SSH login: it is not a descendant of
    # the runner unit and inherits none of its properties. That is how this deploy reported
    # "rootless containers mapped" on 2026-10-11 while every job, all of them descendants of
    # a unit with NoNewPrivileges=true, failed with "newuidmap: write to uid_map failed:
    # Operation not permitted". Two checks, because each sees what the other cannot.
    - name: "Confirm the running runner service carries no no_new_privs and no private user namespace"
      # Read from the kernel, for the service's own main process: every job is a
      # descendant and inherits exactly this. NoNewPrivs is the effective bit, so it also
      # catches the unit options that set it implicitly. The user-namespace link must equal
      # this shell's, which is the host's: PrivateUsers= (and the options that imply it in a
      # user unit) would put the runner in a namespace that maps no subordinate range.
      ansible.builtin.shell: |
        set -euo pipefail
        pid=$(systemctl --user show --property=MainPID --value actions-runner.service)
        if [ -z "$pid" ] || [ "$pid" -eq 0 ]; then echo "no main process"; exit 1; fi
        awk '$1 == "NoNewPrivs:" { print "NoNewPrivs=" $2 }' "/proc/$pid/status"
        if [ "$(readlink "/proc/$pid/ns/user")" = "$(readlink /proc/self/ns/user)" ]; then
          echo "userns=host"
        else
          echo "userns=private"
        fi
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ _account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ _runner_uid }}"
      register: _runner_privs
      changed_when: false
      failed_when: >-
        _runner_privs.rc != 0
        or 'NoNewPrivs=0' not in _runner_privs.stdout_lines
        or 'userns=host' not in _runner_privs.stdout_lines
      check_mode: false

    - name: "Confirm rootless podman maps the account's ranges from inside the user manager"
      # Exercises newuidmap/newgidmap for real, in a transient unit of the SAME user
      # manager as the runner, carrying the runner unit's own NoNewPrivileges value read
      # back from systemd. A unit that set it would fail here exactly as its jobs would.
      # `system migrate` stops podman's pause process first: while one is alive, podman
      # joins its namespace and never calls the helpers, so the check would prove nothing.
      # More than one line in each map proves a subordinate range, not just the account.
      # No image is pulled: the hosts' egress is restricted and the question is the
      # mapping, not the registry.
      ansible.builtin.shell: |
        set -euo pipefail
        nnp=$(systemctl --user show --property=NoNewPrivileges --value actions-runner.service)
        systemd-run --user --wait --pipe --collect --quiet \
          --property=NoNewPrivileges="$nnp" \
          /bin/sh -c 'podman system migrate \
            && echo uid_map && podman unshare cat /proc/self/uid_map \
            && echo gid_map && podman unshare cat /proc/self/gid_map'
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ _account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ _runner_uid }}"
      register: _uidmap
      changed_when: false
      failed_when: >-
        _uidmap.rc != 0
        or 'uid_map' not in _uidmap.stdout_lines
        or 'gid_map' not in _uidmap.stdout_lines
        or (_uidmap.stdout_lines.index('gid_map') - _uidmap.stdout_lines.index('uid_map') - 1) < 2
        or ((_uidmap.stdout_lines | length) - _uidmap.stdout_lines.index('gid_map') - 1) < 2
      check_mode: false

    - name: "Confirm a job container can be created with the runner's mounts, from inside the user manager"
      # The uid-map check above passed while every `container:` job still failed in
      # "Initialize containers" (2026-10-11): podman refused bind sources that Docker would
      # have created, and the Docker socket path led to root's socket. This repeats the
      # hooks' own `docker create`, with the mount set the runner hands them
      # (ContainerOperationProvider.cs:301-318, ContainerInfo.cs:59), in a transient unit of
      # the same user manager with the runner unit's NoNewPrivileges value, after running
      # the deployed job-started hook exactly as a job runs it. The image is imported from a
      # one-file archive, so no registry is involved; the container is created, never
      # started, then removed. `_ping` on the mounted socket path must reach the account's
      # own podman.
      #
      # Hook-shaped in ENVIRONMENT too, not only in arguments. The hooks resolve `docker`
      # with the runner's PATH and then start it with the job's variables only
      # (runner-container-hooks v0.8.1, utils.ts optionsWithDockerEnvs): `create` gets
      # HOME=/github/home and nothing else of the runner's, while `pull` gets no HOME at
      # all. The first version of this probe ran `docker` with the user manager's own
      # environment, passed, and every container job still failed with `cannot resolve
      # /github/home` (docs/MISTAKES.md 10.25). So `docker` is resolved from the PATH in
      # the deployed .env and must be the wrapper; the import runs under `env -i` as the
      # hooks' pull does, after `system migrate` stops any pause process so the empty
      # environment must map the subordinate range itself; the create runs under `env -i
      # HOME=/github/home GITHUB_ACTIONS=true CI=true` with `-e HOME`, and must find the
      # imported image, so both calls use one store; and the created container must
      # carry HOME=/github/home, so the wrapper did not change the job's HOME.
      ansible.builtin.shell: |
        set -euo pipefail
        nnp=$(systemctl --user show --property=NoNewPrivileges --value actions-runner.service)
        systemd-run --user --wait --pipe --collect --quiet \
          --property=NoNewPrivileges="$nnp" \
          /bin/bash -s <<'PROBE'
        set -euo pipefail
        H={{ _home | quote }}
        W="$H/_work"
        "$H/job-started.sh"
        runner_path=$(sed -n 's/^PATH=//p' "$H/.env")
        dk=$(PATH="$runner_path" command -v docker)
        echo "docker=$dk"
        [ "$dk" = "$H/_bin/docker" ]
        probe="gh-runner-mount-probe-$$"
        img="localhost/$probe:latest"
        src=$(mktemp -d)
        trap 'env -i "$dk" rm -f "$probe" >/dev/null 2>&1 || true; env -i "$dk" rmi -f "$img" >/dev/null 2>&1 || true; rm -rf "$src"' EXIT
        mkdir "$src/root"
        : > "$src/root/.probe"
        tar -C "$src/root" -cf "$src/rootfs.tar" .
        env -i "$dk" system migrate
        env -i "$dk" import "$src/rootfs.tar" "$img" >/dev/null
        env -i "$dk" image exists "$img"
        echo "import=ok"
        env -i HOME=/github/home GITHUB_ACTIONS=true CI=true "$dk" create --name "$probe" \
          -e HOME -e GITHUB_ACTIONS=true -e CI=true \
          -v=/var/run/docker.sock:/var/run/docker.sock \
          -v="$W":/__w \
          -v="$H/externals":/__e:ro \
          -v="$W/_temp":/__w/_temp \
          -v="$W/_actions":/__w/_actions \
          -v="$W/_tool":/__w/_tool \
          -v="$W/_temp/_github_home":/github/home \
          -v="$W/_temp/_github_workflow":/github/workflow \
          --entrypoint tail "$img" -f /dev/null >/dev/null
        echo "create=ok"
        cfg=$(env -i "$dk" inspect "$probe")
        if grep -qF '"HOME=/github/home"' <<<"$cfg"; then
          echo "home=job"
        fi
        echo "ping=$(curl -sf --unix-socket /var/run/docker.sock http://d/_ping)"
        PROBE
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ _account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ _runner_uid }}"
      register: _mountprobe
      changed_when: false
      failed_when: >-
        _mountprobe.rc != 0
        or ('docker=' ~ _home ~ '/_bin/docker') not in _mountprobe.stdout_lines
        or 'import=ok' not in _mountprobe.stdout_lines
        or 'create=ok' not in _mountprobe.stdout_lines
        or 'home=job' not in _mountprobe.stdout_lines
        or 'ping=OK' not in _mountprobe.stdout_lines
      # It creates and removes a container, so a dry run skips it.
      when: not ansible_check_mode

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ github_runner_name }} installed (runner v{{ _rver }}, hooks v{{ _hver }}),
          service {{ _active.stdout | trim }}, labels
          {{ (github_runner_labels | default([])) | join(',') }}, group
          {{ github_runner_group }}, no_new_privs off on the running service, rootless
          containers mapped from inside the user manager
          ({{ _uidmap.stdout_lines.index('gid_map') - _uidmap.stdout_lines.index('uid_map') - 1 }}
          uid map lines), a job container created with the runner's mounts and the
          account's own podman socket, through the runner's docker wrapper with the
          hooks' own environment. Confirm it is ONLINE at the organisation with
          verify-github-runners.yml before routing work to it.
