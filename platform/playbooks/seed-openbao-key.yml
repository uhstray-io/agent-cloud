---
# seed-openbao-key.yml — Seed (merge) a single key/value into an OpenBao KV-v2
# secret WITHOUT disturbing the other keys already at that path.
#
# Why: some shared secrets are owned by one service but read by another via a
# manage-secrets `_shared_read` (e.g. honcho's deriver reads
# `secret/services/nemoclaw:gemini_api_key`). When such a key is missing from
# OpenBao, the reader's deploy fails its shared-read assertion. This playbook is
# the code-managed, idempotent way to place that one key — the deploy automation
# then sources it from OpenBao itself (no key ever touches a container or file
# by hand, and it survives redeploys). It replaces the forbidden "ad-hoc curl
# into OpenBao" one-off (see agent-cloud CLAUDE.md: changes flow through code).
#
# ADDITIVE + idempotent + concurrency-safe: an existing path is updated with the
# server-side KV-v2 PATCH (JSON merge-patch), so OpenBao merges {bao_key} into
# the CURRENT secret version — sibling keys are preserved even if they changed
# after our read (a GET->combine->POST read-modify-write could clobber them).
# A brand-new path is created with POST. Either way the write happens only when
# the value actually changed, so re-runs converge without churning KV versions.
#
# The value is passed in as an extra var (no_log) and is never committed. Runs
# from the Semaphore runner (localhost), which holds the OpenBao AppRole (its
# wildcard policy grants `patch` on secret/data/services/*).
#
# Usage (via Semaphore):
#   -e bao_path=services/nemoclaw -e bao_key=gemini_api_key
#   BAO_VALUE supplied as a Semaphore environment SECRET (encrypted at rest, not
#   returned by the API). Do NOT pass -e bao_value=... under Semaphore: it
#   persists the extra-var JSON and serves it back over its API. The extra-var
#   form is for a LOCAL run only.
#   -e openbao_addr=https://<bao>:8200   (AppRole creds injected by Semaphore env)
# openbao_addr must be https, OR http only to a loopback/RFC1918 host (the
# internal OpenBao VLAN) — the transport guard below refuses public cleartext.

- name: "Seed a single key into an OpenBao KV-v2 secret path"
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # The ENVIRONMENT WINS over the extra var. Semaphore persists a task's
    # extra-var JSON in its own database and serves it back over its API
    # indefinitely, so `-e bao_value=...` leaves the secret in plaintext outside
    # OpenBao — the opposite of what this playbook is for. A Semaphore environment
    # secret is encrypted at rest and its value is not returned by the API, and it
    # is the same channel this playbook's AppRole credentials already arrive on.
    # Environment first, so a stray extra var cannot override a configured secret.
    # The extra var still serves a local run, where nothing persists it.
    _bao_value: "{{ lookup('env', 'BAO_VALUE') | default(bao_value | default(''), true) }}"

  tasks:
    # Non-secret validation stays VISIBLE (no no_log) so a missing path/key/url
    # fails with a readable message — no_log is scoped to the secret check only
    # (agent-cloud CLAUDE.md: no_log is for credential-bearing steps).
    - name: "Validate non-secret inputs"
      ansible.builtin.assert:
        that:
          - bao_path is defined and bao_path | length > 0
          - bao_key is defined and bao_key | length > 0
          - _bao_url | length > 0
        fail_msg: >-
          Pass -e bao_path=services/<svc> -e bao_key=<key> and ensure
          openbao_addr (or OPENBAO_ADDR) + AppRole creds are set.

    - name: "Validate the secret value is present"
      ansible.builtin.assert:
        that:
          - _bao_value | length > 0
        fail_msg: >-
          Supply the value as the BAO_VALUE environment secret (Semaphore) or
          -e bao_value=<secret> (local run).
      no_log: true

    # role_id/secret_id/bao_value cross the wire to _bao_url — refuse to send
    # secret material over public cleartext. https is always allowed; http is
    # allowed ONLY to loopback/RFC1918 (the internal OpenBao VLAN).
    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"
    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      no_log: true

    - name: "Merge the key (shared write path: fetch, patch-or-create, verify)"
      # tasks/bao-merge-keys.yml is THE merge-patch implementation: GET for
      # idempotency and existence, server-side merge-PATCH preserving siblings
      # (no read-modify-write race), POST only for a brand-new path, and a
      # verified round trip after any actual write.
      ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
      vars:
        _bm_url: "{{ _bao_url }}"
        _bm_token: "{{ _bao_auth.json.auth.client_token }}"
        _bm_path: "{{ bao_path }}"
        _bm_data: "{{ {bao_key: _bao_value} }}"
        _bm_on_missing: create

    - name: "Report the outcome (name only, value not logged)"
      ansible.builtin.debug:
        msg: >-
          Key '{{ bao_key }}' at secret/{{ bao_path }}:
          {{ 'created' if (_bm_create is changed)
             else ('patched' if (_bm_patch is changed) else 'already up to date') }}.
