---
# apply-cloudflare-tofu.yml — run the Cloudflare OpenTofu root via Semaphore.
#
# OpenBao-wrapper: reads EVERYTHING it needs (secrets AND service config) from
# OpenBao secret/services/cloudflare — matching the platform's service pattern
# where config lives alongside secrets (e.g. secret/services/semaphore:url).
# This makes it a self-contained `hosts: localhost` orchestration task: no
# inventory group vars (which a localhost play cannot read) and no laptop-run
# tofu. Secrets exist only in the task process env (not echoed); plan/apply
# output stays visible.
#
# OpenBao secret/services/cloudflare keys:
#   api_token, r2_access_key_id, r2_secret_access_key   (secrets)
#   r2_s3_endpoint     R2 S3 endpoint (https://<acct>.r2.cloudflarestorage.com)
#   caddy_origin_ip    public origin IP the platform A-records point at
#   zone_name      (optional) apex zone; default uhstray.io
#   tfstate_bucket (optional) R2 state bucket; default uhstray-tfstate
# Launch overrides: -e cloudflare_zone=... -e cloudflare_tfstate_bucket=...
#
# tofu state lives in Cloudflare R2. See platform/infra/cloudflare/ +
# plan/development/13-cloudflare-iac.md.
# Usage (Semaphore): survey var tofu_action = plan (default, read-only) |
# apply (gated change; run after reviewing the plan).

- name: "Cloudflare OpenTofu — {{ tofu_action | default('plan') }}"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tofu_action: plan
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _tf_dir: "{{ playbook_dir }}/../infra/cloudflare"
    _cf_api: "https://api.cloudflare.com/client/v4"

  tasks:
    - name: "Pre-flight validation"
      ansible.builtin.assert:
        that:
          - tofu_action in ['plan', 'apply']
          - _bao_url | length > 0
        fail_msg: "Pass tofu_action=plan|apply and ensure openbao_addr (or OPENBAO_ADDR) + AppRole creds are set."

    - name: "Refuse a cleartext secret-store endpoint"
      # The AppRole secret_id, the token, and the Cloudflare API token all cross
      # this connection. This was the one OpenBao-reaching play without the shared
      # guard — hidden by a hand-kept list in the coverage test, found the moment
      # that test derived its population instead (2026-08-27).
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      no_log: true

    - name: "Read Cloudflare secrets + config from OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/cloudflare"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200]
      register: _cf_secret
      no_log: true

    - name: "Resolve config (launch override -> OpenBao -> default)"
      ansible.builtin.set_fact:
        _cf: "{{ _cf_secret.json.data.data }}"
        _zone_name: "{{ cloudflare_zone | default(_cf_secret.json.data.data.zone_name | default('uhstray.io', true), true) }}"
        _bucket: "{{ cloudflare_tfstate_bucket | default(_cf_secret.json.data.data.tfstate_bucket | default('uhstray-tfstate', true), true) }}"
        _r2_endpoint: "{{ _cf_secret.json.data.data.r2_s3_endpoint | default('', true) }}"
        _caddy_ip: "{{ _cf_secret.json.data.data.caddy_origin_ip | default('', true) }}"
      no_log: true

    - name: "Validate resolved config (presence only; no values shown)"
      ansible.builtin.assert:
        that:
          - _zone_name | length > 0
          - _bucket | length > 0
          - _r2_endpoint | length > 0
          - _caddy_ip | length > 0
        fail_msg: >-
          Missing Cloudflare config in OpenBao secret/services/cloudflare
          (need r2_s3_endpoint + caddy_origin_ip; zone_name/tfstate_bucket optional).

    - name: "Look up the zone id for {{ _zone_name }}"
      ansible.builtin.uri:
        url: "{{ _cf_api }}/zones?name={{ _zone_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _cf.api_token }}"
        status_code: [200]
      register: _cf_zone
      no_log: true

    - name: "Assert the zone was found (guard the index below)"
      ansible.builtin.assert:
        that:
          - (_cf_zone.json.result | default([]) | length) > 0
        fail_msg: >-
          Cloudflare returned no zone named '{{ _zone_name }}'. Check
          secret/services/cloudflare:zone_name (or -e cloudflare_zone=) and that the
          API token can read that zone.

    - name: "Set the zone id fact"
      ansible.builtin.set_fact:
        _zone_id: "{{ _cf_zone.json.result[0].id }}"

    # Templated backend config (nested `endpoints` object is unreliable via the
    # -backend-config KEY=VALUE CLI form). Runner's ephemeral workspace only;
    # gitignored, never committed.
    - name: "Write the R2 backend config"
      ansible.builtin.copy:
        dest: "{{ _tf_dir }}/backend.hcl"
        mode: "0600"
        content: |
          bucket = "{{ _bucket }}"
          key    = "cloudflare/terraform.tfstate"
          endpoints = { s3 = "{{ _r2_endpoint }}" }
      no_log: true

    - name: "OpenTofu init (R2 backend)"
      ansible.builtin.command:
        chdir: "{{ _tf_dir }}"
        argv:
          - tofu
          - init
          - -input=false
          - -reconfigure
          - -backend-config=backend.hcl
      environment:
        AWS_ACCESS_KEY_ID: "{{ _cf.r2_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ _cf.r2_secret_access_key }}"
      register: _tf_init
      changed_when: false

    - name: "OpenTofu {{ tofu_action }}"
      ansible.builtin.command:
        chdir: "{{ _tf_dir }}"
        argv: "{{ ['tofu', tofu_action, '-input=false'] + (['-auto-approve'] if tofu_action == 'apply' else []) }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ _cf.r2_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ _cf.r2_secret_access_key }}"
        CLOUDFLARE_API_TOKEN: "{{ _cf.api_token }}"
        TF_VAR_zone_id: "{{ _zone_id }}"
        TF_VAR_caddy_origin_ip: "{{ _caddy_ip }}"
      register: _tf_run
      changed_when: "tofu_action == 'apply' and 'Apply complete' in (_tf_run.stdout | default(''))"

    - name: "Show OpenTofu output for action {{ tofu_action }}"
      ansible.builtin.debug:
        var: _tf_run.stdout_lines
