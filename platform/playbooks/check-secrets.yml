---
# check-secrets.yml — Read-only secret inventory from OpenBao
#
# Lists all secrets for a service. Reports present, missing, empty.
# Does NOT generate or modify anything, so it runs identically under --check
# (both OpenBao calls set check_mode: false) and every task is tagged `verify`.
# Records the workflow step result for step secrets-approle. Pass requires both registry
# criteria to be PROVEN, not implied by a path that happens to exist:
#   - every `existing`-typed secret the service's own deploy-<service>.yml declares
#     (_secret_definitions) is present and non-empty. random/django secrets are generated by
#     that deploy, so they may legitimately be absent before it runs. No declaration found
#     fails closed: the criterion cannot be checked.
#   - the service AppRole exists with the service policy, when the service declares one: a
#     committed platform/services/openbao/deployment/config/policies/<service>.hcl (role,
#     policy and file share one name, tasks/manage-approle.yml). Without that file the
#     AppRole is not applicable and recorded as such.
#
# Usage: -e "target_service=netbox_svc"

- name: "Check secrets for {{ target_service | default('(unset)') }}"
  hosts: "{{ target_service }}"
  gather_facts: false
  become: false
  tags: [verify]
  vars:
    target_service: "ungrouped"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _deploy_raw: "{{ lookup('file', playbook_dir ~ '/deploy-' ~ service_name ~ '.yml', errors='ignore') | default('', true) }}"
    # A computed declaration lives in vars/secret-declarations/<service>.yml (loaded below), so it is
    # EVALUATED against this host exactly as the deploy evaluates it. Otherwise the list in the
    # deploy playbook's own vars. A computed one left there is only a string here: fail closed.
    _secrets_vars_file: "{{ playbook_dir }}/vars/secret-declarations/{{ service_name }}.yml"
    _play_declared: >-
      {{ ((_deploy_raw | from_yaml) if _deploy_raw else []) | selectattr('vars', 'defined') | map(attribute='vars')
         | selectattr('_secret_definitions', 'defined') | map(attribute='_secret_definitions') | flatten }}
    _declared: >-
      {{ _secret_definitions if (_secret_definitions is defined and _secret_definitions is not string)
         else _play_declared }}
    _unevaluated: "{{ _declared | select('string') | list | length > 0 }}"
    # The names that must be present: the service's own _required_existing_secrets when it declares
    # one (the list manage-secrets enforces, which can depend on inventory, e.g. a keyless
    # agentgateway upstream), else every `existing`-typed declaration.
    _required: >-
      {{ _required_existing_secrets
         if (_required_existing_secrets is defined and _required_existing_secrets is not string)
         else (_declared | reject('string') | selectattr('type', 'equalto', 'existing') | map(attribute='name') | list) }}
    _approle_policy_file: "{{ playbook_dir }}/../services/openbao/deployment/config/policies/{{ service_name }}.hcl"
    _approle_declared: "{{ _approle_policy_file is file }}"

  tasks:
    - name: "Load the service's computed secret declaration (evaluated against this host)"
      ansible.builtin.include_vars:
        file: "{{ _secrets_vars_file }}"
      when: _secrets_vars_file is file

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      no_log: true
      # A POST that only mints a read token: runs under --check, changes nothing.
      check_mode: false
      changed_when: false

    - name: "Fetch secrets from OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/{{ service_name }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _bao_data
      delegate_to: localhost
      no_log: true
      check_mode: false

    - name: "Read the service AppRole and its policy (when the service declares one)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/{{ item }}/{{ service_name }}"
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      loop: [auth/approle/role, sys/policies/acl]
      register: _approle
      delegate_to: localhost
      no_log: true
      check_mode: false
      when: _approle_declared | bool

    - name: "Report secrets"
      ansible.builtin.debug:
        msg: |
          {{ service_name }} secrets in OpenBao:
          {% if _bao_data.status == 404 %}
            NO SECRETS FOUND at secret/services/{{ service_name }}
          {% else %}
          {% for key, value in (_bao_data.json.data.data | default({})) | dictsort %}
            {{ '  PRESENT' if value | length > 0 else '  EMPTY  ' }}  {{ key }}
          {% endfor %}
            Total: {{ _bao_data.json.data.data | default({}) | length }} keys
          {% endif %}

    - name: "Record the step result"
      ansible.builtin.include_tasks: tasks/emit-step-result.yml
      vars:
        _found: "{{ _bao_data.status != 404 }}"
        _stored: "{{ (_bao_data.json.data.data | default({})) if _found else {} }}"
        _missing: "{{ _required | reject('in', _stored.keys() | list) | list }}"
        _empty: "{{ _stored | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}"
        _approle_state: >-
          {{ 'not-applicable' if not (_approle_declared | bool)
             else ('present' if (_approle.results | map(attribute='status') | list) == [200, 200]
                   and service_name in (_approle.results[0].json.data.token_policies | default([]))
                   else 'missing') }}
        _errors: >-
          {{ (['no deploy-' ~ service_name ~ '.yml declaration: the required secrets cannot be checked'] if not _deploy_raw else [])
             + (['deploy-' ~ service_name ~ '.yml computes _secret_definitions in its own vars, which cannot be evaluated here: move it to vars/secret-declarations/' ~ service_name ~ '.yml']
                if (_unevaluated | bool) else [])
             + (['no secrets at secret/services/' ~ service_name] if not _found else [])
             + (['missing keys: ' ~ (_missing | join(', '))] if _missing else [])
             + (['empty keys: ' ~ (_empty | join(', '))] if _empty else [])
             + (['AppRole ' ~ service_name ~ ' or its policy is missing, or the role does not carry the policy']
                if _approle_state == 'missing' else []) }}
        step_result_step: secrets-approle
        step_result_status: "{{ 'pass' if (_errors | length == 0) else 'fail' }}"
        step_result_evidence:
          path_found: "{{ _found }}"
          key_count: "{{ _stored | length }}"
          missing: "{{ _missing }}"
          empty: "{{ _empty }}"
          approle: "{{ _approle_state }}"
        step_result_error: "{{ _errors | join('; ') }}"
