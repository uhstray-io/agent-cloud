---
# follow-weft-main.yml — staging follows weft's main. Runs on a Semaphore timer every five minutes
# ("Follow weft main"), inside the rack: it reads GitHub and acts, and GitHub never reaches it.
#
#   1. ask GitHub for the newest commit on main whose images.yml run succeeded (so its images
#      and release.json are signed and published)
#   2. if staging already runs it, or rolled it back once, or a deploy holds a staging host: stop
#   3. record a GitHub deployment, environment `staging`, on that commit (in_progress)
#   4. deploy it to the staging front door, then to the staging workspace — each the same steps
#      as any deploy, with the automatic rollback
#   5. healthy: the deployment becomes `success`, which weft's release.yml requires before it
#      will release that commit; Discord says what staging now runs. A rollback marks it `failure`.
#
# Staging follows main without a person's approval because Jacob decided it (weft's D533): the AI
# Invariant lets a deploy follow a target a person authored, and this covers staging only, which
# holds no company's data. Company workspaces change only through Roll Out weft Release.
#
# Inventory: weft_staging_door (one host) and weft_staging_workspace (one host), with
# weft_environment=staging and weft_secret_root=weft-staging. With neither declared this does
# nothing, so the timer can exist before staging does.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Follow weft main: is there anything to deploy"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/weft.yml
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _door_hosts: "{{ groups['weft_staging_door'] | default([]) }}"
    _workspace_hosts: "{{ groups['weft_staging_workspace'] | default([]) }}"

  tasks:
    - name: "Nothing to follow without a staging deployment"
      ansible.builtin.debug:
        msg: "No weft_staging_door / weft_staging_workspace hosts are declared; staging does not exist yet."
      when: (_door_hosts + _workspace_hosts) | length == 0

    - name: "End: no staging"
      ansible.builtin.meta: end_play
      when: (_door_hosts + _workspace_hosts) | length == 0

    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Read the GitHub token and the Discord webhook"
      ansible.builtin.include_tasks: tasks/weft-credentials.yml
      vars:
        _weft_need_github: true

    - name: "Ask GitHub for main's newest published commit"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ _weft_repo }}/actions/workflows/images.yml/runs?branch=main&event=push&status=success&per_page=1"
        headers:
          Authorization: "Bearer {{ _weft_github_token }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: [200]
        follow_redirects: none
      register: _weft_runs
      check_mode: false
      no_log: true

    - name: "Take its commit"
      ansible.builtin.set_fact:
        _weft_newest: "{{ (_weft_runs.json.workflow_runs | first).head_sha }}"
      when: _weft_runs.json.workflow_runs | length > 0

    - name: "End: main has published nothing yet"
      ansible.builtin.meta: end_play
      when: _weft_newest is not defined

    - name: "Read what staging runs"
      ansible.builtin.include_tasks: tasks/weft-environment-state.yml
      vars:
        _wes_hosts: "{{ _door_hosts + _workspace_hosts }}"

    - name: "Decide"
      ansible.builtin.set_fact:
        _weft_locked: "{{ _weft_state | dict2items | selectattr('value.locked') | map(attribute='key') | list }}"
        _weft_refused_by: "{{ _weft_state | dict2items | selectattr('value.refused', 'contains', _weft_newest) | map(attribute='key') | list }}"
        _weft_behind: "{{ _weft_state | dict2items | rejectattr('value.commit', 'equalto', _weft_newest) | map(attribute='key') | list }}"
        _weft_previous: "{{ _weft_state[(_workspace_hosts + _door_hosts) | first].commit }}"

    - name: "Say why nothing is deployed"
      ansible.builtin.debug:
        msg: >-
          {{ ('A deploy holds ' ~ (_weft_locked | join(', ')) ~ '; if none is running, remove its '
              ~ 'deploying/ directory after looking at the host.') if _weft_locked | length > 0
             else (('Staging rolled ' ~ _weft_newest[:12] ~ ' back already; waiting for the next merge.')
                   if _weft_refused_by | length > 0
             else ('Staging already runs ' ~ _weft_newest[:12] ~ '.')) }}
      when: _weft_locked | length > 0 or _weft_refused_by | length > 0 or _weft_behind | length == 0

    - name: "End: nothing to deploy"
      ansible.builtin.meta: end_play
      when: _weft_locked | length > 0 or _weft_refused_by | length > 0 or _weft_behind | length == 0

    - name: "Ask GitHub what merged since staging's commit"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ _weft_repo }}/compare/{{ _weft_previous }}...{{ _weft_newest }}"
        headers:
          Authorization: "Bearer {{ _weft_github_token }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: [200]
        follow_redirects: none
      register: _weft_compare
      check_mode: false
      no_log: true
      when: _weft_previous | length > 0

    # A merge commit's message is "Merge pull request #N from <branch>", a blank line, then the
    # pull request's title. Titles only: the bodies are long and the link is one click away.
    - name: "Name the pull requests"
      ansible.builtin.set_fact:
        _weft_notes: >-
          {%- set titles = [] -%}
          {%- for commit in (_weft_compare.json.commits | default([])) -%}
          {%- set message = commit.commit.message -%}
          {%- if message.startswith('Merge pull request #') -%}
          {%- set number = message.split(' ')[3] -%}
          {%- set parts = message.split('\n\n', 1) -%}
          {%- set _ = titles.append(number ~ ' ' ~ (parts[1].split('\n')[0] if parts | length > 1 else '')) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ('Merged: ' ~ (titles | join('; ')) ~ '.') if titles | length > 0 else '' }}

    - name: "Record the staging deployment on GitHub"
      ansible.builtin.include_tasks: tasks/weft-github-deployment.yml
      vars:
        _wgd_action: create
        _wgd_sha: "{{ _weft_newest }}"
        _wgd_environment: staging

    - name: "Mark it in progress"
      ansible.builtin.include_tasks: tasks/weft-github-deployment.yml
      vars:
        _wgd_action: status
        _wgd_id: "{{ _weft_github_deployment_id | default('') }}"
        _wgd_state: in_progress
        _wgd_description: "Deploying {{ _weft_newest[:12] }} to staging"

    # The deploy plays below run only on the hosts added here, so a tick with nothing to deploy
    # places nothing, renders nothing and reloads nothing.
    - name: "Queue the staging front door"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: weft_follow_door
      loop: "{{ _door_hosts }}"
      when: item in _weft_behind

    - name: "Queue the staging workspace"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: weft_follow_workspace
      loop: "{{ _workspace_hosts }}"
      when: item in _weft_behind

- name: "Follow weft main: the front door"
  ansible.builtin.import_playbook: weft-door.yml
  vars:
    weft_release: "{{ hostvars['localhost']['_weft_newest'] | default('') }}"
    weft_door_hosts: weft_follow_door
    weft_edge_workspace_hosts: weft_staging_workspace

- name: "Follow weft main: the workspace"
  ansible.builtin.import_playbook: weft-workspace.yml
  vars:
    weft_release: "{{ hostvars['localhost']['_weft_newest'] | default('') }}"
    weft_workspace_hosts: weft_follow_workspace

- name: "Follow weft main: staging is healthy"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/weft.yml
  tasks:
    - name: "Mark the GitHub deployment a success"
      ansible.builtin.include_tasks: tasks/weft-github-deployment.yml
      vars:
        _wgd_action: status
        _wgd_id: "{{ _weft_github_deployment_id | default('') }}"
        _wgd_state: success
        _wgd_description: "Staging is healthy on {{ _weft_newest[:12] }}"
      when: _weft_github_deployment_id | default('') | string | length > 0
