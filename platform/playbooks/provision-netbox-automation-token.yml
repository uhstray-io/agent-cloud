---
# provision-netbox-automation-token.yml — one-time bootstrap for build #1.
#
# Mints the dedicated, scoped NetBox API token that create-netbox-device.yml reads
# at secret/services/netbox:automation_api_token, and stores it in OpenBao.
# Idempotent: a no-op if the token already exists there. REST token creation needs
# an existing token, so the first one is minted server-side via the NetBox Django
# shell — same exec pattern as cleanup-netbox.yml.
#
# ponytail: the Django snippet targets NetBox v4 (users.models.{Token,ObjectPermission},
# core.models.ObjectType). It runs via Semaphore against the live NetBox — not
# testable in this repo — so verify those model paths on first run if the version
# differs. The single ObjectPermission grants view+add scoped to the dcim/ipam/extras
# objects the executor touches (not superuser); a stricter view-vs-add split is the
# upgrade path if that over-grant ever matters.

- name: "Provision scoped NetBox automation token"
  hosts: netbox_svc
  gather_facts: false
  become: false

  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'BAO_ADDR')) | default('http://127.0.0.1:8200', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _manage: "{{ container_engine | default('docker') }} exec -i {{ netbox_app_container | default('netbox-netbox-1') }} /opt/netbox/netbox/manage.py shell"
    # One mint, several least-privilege identities. device-writer is the original (Build #1:
    # create-netbox-device); workflow-collector may only view and change virtual machines,
    # which is what the conformance collector writes (their custom fields).
    _profiles:
      device-writer:
        user: "{{ netbox_automation_user | default('skynet-automation') }}"
        permission: skynet-device-write
        actions: [view, add]
        object_types: [dcim.device, dcim.site, dcim.devicetype, dcim.devicerole, dcim.interface, ipam.ipaddress, extras.tag]
        # netbox-allocate-ip reads prefixes: view only, as its own permission
        view_object_types: [ipam.prefix]
        view_permission: skynet-ipam-prefix-view
        field: automation_api_token
        description: skynet build #1 automation (create-netbox-device)
      workflow-collector:
        user: workflow-collector
        permission: workflow-collector-vm
        actions: [view, change]
        object_types: [virtualization.virtualmachine]
        field: collector_api_token
        description: service deployment workflow conformance collector
      vm-recorder:
        user: workflow-vm-recorder
        permission: workflow-vm-record
        actions: [view, add]
        object_types: [virtualization.virtualmachine]
        # read-only, a second permission: placing a VM needs its cluster, never adding one
        view_object_types: [virtualization.cluster]
        field: vm_recorder_api_token
        description: service deployment workflow VM record (validate-address)
    _profile: "{{ _profiles[netbox_token_profile | default('device-writer')] }}"
    _user: "{{ _profile.user }}"

  tasks:
    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Read the NetBox secret (does the token already exist?)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/netbox"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _nb_secret
      delegate_to: localhost
      no_log: true
      check_mode: false

    # Converged on EVERY run, before the skip below: a scope added to a profile has to reach
    # the identity whose token already exists, and the token itself is never re-minted for it.
    # The `|` below is a Django QuerySet union inside Python, not a shell pipe.
    - name: "Converge the identity and its scoped permissions"
      ansible.builtin.command:
        cmd: "{{ _manage }}"
        stdin: |
          from django.contrib.auth import get_user_model
          from users.models import ObjectPermission
          from core.models import ObjectType

          # The NetBox 4.5 User model has no is_staff field (FieldError, 2026-09-22).
          user, changed = get_user_model().objects.get_or_create(
              username="{{ _user }}", defaults={"is_active": True},
          )
          scopes = [("{{ _profile.permission }}", {{ _profile.actions | to_json }}, {{ _profile.object_types | to_json }})]
          if {{ _profile.view_object_types | default([]) | to_json }}:
              scopes.append(("{{ _profile.view_permission | default(_profile.permission ~ '-view') }}", ["view"],
                             {{ _profile.view_object_types | default([]) | to_json }}))
          for name, actions, types in scopes:
              wanted = {ObjectType.objects.get_by_natural_key(*t.split(".")).pk for t in types}
              perm, created = ObjectPermission.objects.get_or_create(
                  name=name, defaults={"enabled": True, "actions": actions},
              )
              changed |= created
              if not perm.enabled or perm.actions != actions:
                  perm.enabled, perm.actions = True, actions
                  perm.save(update_fields=["enabled", "actions"])
                  changed = True
              if set(perm.object_types.values_list("pk", flat=True)) != wanted:
                  perm.object_types.set(list(wanted))
                  changed = True
              if not perm.users.filter(pk=user.pk).exists():
                  perm.users.add(user)
                  changed = True
          print("changed" if changed else "unchanged")
      register: _permissions
      changed_when: _permissions.stdout_lines | last | trim == 'changed'
      when: not ansible_check_mode

    - name: "Already provisioned — skip (idempotent)"
      when: (_nb_secret.json.data.data[_profile.field] | default('')) | length > 0
      block:
        - name: "Report skip"
          ansible.builtin.debug:
            msg: "{{ _profile.field }} already present at secret/services/netbox — nothing to do."
        - name: "End play"
          ansible.builtin.meta: end_play

    - name: "Mint the dedicated scoped token via the NetBox Django shell"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        user = get_user_model().objects.get(username="{{ _user }}")
        # NetBox 4.5 v2 token: the secret exists ONLY at creation (hashed with the pepper,
        # never stored), so an existing token cannot be recovered and a new one is minted.
        # This task runs only when OpenBao holds no token (the skip above). The stored value
        # is the full bearer credential the API expects: nbt_<key>.<token>.
        minted = Token.objects.create(
            user=user, description="{{ _profile.description }}",
        )
        print(f"nbt_{minted.key}.{minted.token}" if getattr(minted, "version", 1) == 2 else minted.key)
        PYSCRIPT
      register: _mint
      changed_when: true
      no_log: true
      when: not ansible_check_mode

    - name: "Sanity-check the minted token (v2 nbt_<12>.<40>, or a legacy 40-char v1)"
      ansible.builtin.assert:
        that:
          - (_mint.stdout_lines | default([]) | length) > 0
          - >-
            (_mint.stdout_lines | last | trim) is match('^nbt_[A-Za-z0-9]{12}\\.[A-Za-z0-9]{40}$')
            or (_mint.stdout_lines | last | trim | length) == 40
        fail_msg: "NetBox Django shell did not return a token of a known shape — mint failed; check the run."
      no_log: true

    - name: "Store the token in OpenBao (merge-patch: siblings preserved, write verified)"
      # The shared merge task, not a read-modify-POST: two profiles and the Diode credential
      # task all write secret/services/netbox, and a whole-document POST drops a sibling
      # written between our read and our write.
      ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
      vars:
        _bm_url: "{{ _bao_url }}"
        _bm_token: "{{ _bao_auth.json.auth.client_token }}"
        _bm_path: services/netbox
        _bm_data: "{{ {_profile.field: (_mint.stdout_lines | last | trim)} }}"
      when: not ansible_check_mode

    - name: "Provisioned"
      ansible.builtin.debug:
        msg: "Minted + stored {{ _profile.field }} for NetBox user '{{ _user }}'."
