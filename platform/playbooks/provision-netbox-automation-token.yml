---
# provision-netbox-automation-token.yml — one-time bootstrap for build #1.
#
# Mints the dedicated, scoped NetBox API token that create-netbox-device.yml and
# netbox-allocate-ip.yml read at secret/services/netbox:automation_api_token, and
# stores it in OpenBao.
# Idempotent: a no-op if the token already exists there. REST token creation needs
# an existing token, so the first one is minted server-side via the NetBox Django
# shell — same exec pattern as cleanup-netbox.yml.
#
# The Django snippet targets NetBox v4.5+ (users.models.{Token,ObjectPermission},
# core.models.ObjectType). A v2 token's plaintext is available only at creation,
# so an orphaned token is refused rather than storing its public key as a secret.
# replace_unrecoverable_token=true explicitly revokes exactly one orphan before minting.
# The single ObjectPermission grants view+add scoped to the dcim/ipam/extras
# objects the executor touches (not superuser); a stricter view-vs-add split is the
# upgrade path if that over-grant ever matters.

- name: "Provision scoped NetBox automation token"
  hosts: netbox_svc
  gather_facts: false
  become: false

  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'BAO_ADDR')) | default('http://127.0.0.1:8200', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _manage: "docker exec -i netbox-netbox-1 /opt/netbox/netbox/manage.py shell"
    _user: "{{ netbox_automation_user | default('skynet-automation') }}"

  tasks:
    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      no_log: true

    - name: "Read the NetBox secret (does the token already exist?)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/netbox"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _nb_secret
      delegate_to: localhost
      no_log: true

    # The `|` below is a Django QuerySet union inside Python, not a shell pipe.
    - name: "Ensure NetBox automation user and scoped permissions"  # noqa: risky-shell-pipe
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import ObjectPermission
        from core.models import ObjectType

        user, changed = get_user_model().objects.get_or_create(
            username="{{ _user }}",
            defaults={"is_active": True},
        )
        scopes = [
            (
                "skynet-device-write", ["view", "add"],
                ObjectType.objects.filter(
                    app_label="dcim", model__in=["device", "site", "devicetype", "devicerole", "interface"]
                ) | ObjectType.objects.filter(app_label="ipam", model="ipaddress")
                  | ObjectType.objects.filter(app_label="extras", model="tag"),
            ),
            (
                "skynet-ipam-prefix-view", ["view"],
                ObjectType.objects.filter(app_label="ipam", model="prefix"),
            ),
        ]
        for name, actions, types in scopes:
            perm, created = ObjectPermission.objects.get_or_create(
                name=name, defaults={"enabled": True, "actions": actions},
            )
            changed |= created
            if not perm.enabled or perm.actions != actions:
                perm.enabled, perm.actions = True, actions
                perm.save(update_fields=["enabled", "actions"])
                changed = True
            if set(perm.object_types.values_list("pk", flat=True)) != set(types.values_list("pk", flat=True)):
                perm.object_types.set(types)
                changed = True
            if not perm.users.filter(pk=user.pk).exists():
                perm.users.add(user)
                changed = True
        print("changed" if changed else "unchanged")
        PYSCRIPT
      register: _permissions
      changed_when: (_permissions.stdout_lines | default([]) | last | default('') | trim) == 'changed'

    - name: "Already provisioned — skip (idempotent)"
      when: (_nb_secret.json.data.data.automation_api_token | default('')) | length > 0
      block:
        - name: "Report skip"
          ansible.builtin.debug:
            msg: "automation_api_token already present at secret/services/netbox — nothing to do."
        - name: "End play"
          ansible.builtin.meta: end_play

    - name: "Check for a dedicated token whose plaintext is absent from OpenBao"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        user = get_user_model().objects.get(username="{{ _user }}")
        print(Token.objects.filter(
            user=user, description="skynet build #1 automation (create-netbox-device)",
        ).count())
        PYSCRIPT
      register: _orphaned_token
      changed_when: false

    - name: "Refuse an unrecoverable dedicated token"
      ansible.builtin.assert:
        that: >-
          (_orphaned_token.stdout_lines | last | trim | int) == 0 or
          (replace_unrecoverable_token | default(false) | bool and
           (_orphaned_token.stdout_lines | last | trim | int) == 1)
        fail_msg: "NetBox has a dedicated token without its OpenBao bearer value; replacement requires replace_unrecoverable_token=true and exactly one matching token."

    - name: "Revoke exactly one unrecoverable dedicated token when explicitly requested"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        user = get_user_model().objects.get(username="{{ _user }}")
        matches = Token.objects.filter(
            user=user, description="skynet build #1 automation (create-netbox-device)",
        )
        if matches.count() != 1:
            raise RuntimeError("Expected exactly one unrecoverable dedicated token")
        matches.delete()
        print("revoked")
        PYSCRIPT
      when: (_orphaned_token.stdout_lines | last | trim | int) == 1

    - name: "Mint the dedicated scoped token via the NetBox Django shell"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        user = get_user_model().objects.get(username="{{ _user }}")
        issued = Token.objects.create(
            user=user, version=2,
            description="skynet build #1 automation (create-netbox-device)",
        )
        print(issued.get_auth_header_prefix().removeprefix("Bearer ") + issued.token)
        PYSCRIPT
      register: _mint
      changed_when: true
      no_log: true

    - name: "Sanity-check the minted NetBox v2 bearer token"
      ansible.builtin.assert:
        that:
          - (_mint.stdout_lines | default([]) | length) > 0
          - (_mint.stdout_lines | last | trim) is match('^nbt_[A-Za-z0-9]{12}\.[A-Za-z0-9]{40}$')
        fail_msg: "NetBox Django shell did not return a v2 bearer token — mint failed; check the run."
      no_log: true

    - name: "Store the token in OpenBao (patch, preserving other fields)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/netbox"
        method: POST
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        body_format: json
        body:
          data: "{{ (_nb_secret.json.data.data | default({})) | combine({'automation_api_token': (_mint.stdout_lines | last | trim)}) }}"
        status_code: [200, 204]
      delegate_to: localhost
      no_log: true

    - name: "Provisioned"
      ansible.builtin.debug:
        msg: "Minted + stored automation_api_token for NetBox user '{{ _user }}'."
