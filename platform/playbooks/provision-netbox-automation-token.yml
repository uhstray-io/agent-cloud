---
# provision-netbox-automation-token.yml — one-time bootstrap for build #1.
#
# Mints the dedicated, scoped NetBox API token that create-netbox-device.yml and
# netbox-allocate-ip.yml read at secret/services/netbox:automation_api_token, and
# stores it in OpenBao.
# Idempotent: a no-op if the token already exists there. REST token creation needs
# an existing token, so the first one is minted server-side via the NetBox Django
# shell — same exec pattern as cleanup-netbox.yml.
#
# The Django snippet targets NetBox v4.5+ (users.models.{Token,ObjectPermission},
# core.models.ObjectType). A v2 token's plaintext is available only at creation,
# so an orphaned token is refused rather than storing its public key as a secret.
# replace_unrecoverable_token=true explicitly revokes exactly one orphan before minting.
# The single ObjectPermission grants view+add scoped to the dcim/ipam/extras
# objects the executor touches (not superuser); a stricter view-vs-add split is the
# upgrade path if that over-grant ever matters.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Provision scoped NetBox automation token"
  hosts: netbox_svc
  gather_facts: false
  become: false

  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'BAO_ADDR')) | default('http://127.0.0.1:8200', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # The configured engine and container: local-dev runs podman and names it netbox_netbox_1.
    _manage: "{{ container_engine | default('docker') }} exec -i {{ netbox_app_container | default('netbox-netbox-1') }} /opt/netbox/netbox/manage.py shell"
    # One mint, several least-privilege identities. device-writer is the original (Build #1:
    # create-netbox-device); workflow-collector may only view and change virtual machines,
    # which is what the conformance collector writes (their custom fields).
    _profiles:
      device-writer:
        user: "{{ netbox_automation_user | default('skynet-automation') }}"
        permission: skynet-device-write
        actions: [view, add]
        object_types: [dcim.device, dcim.site, dcim.devicetype, dcim.devicerole, dcim.interface, ipam.ipaddress, extras.tag]
        # netbox-allocate-ip reads prefixes: view only, as its own permission
        view_object_types: [ipam.prefix]
        view_permission: skynet-ipam-prefix-view
        field: automation_api_token
        description: skynet build #1 automation (create-netbox-device)
      workflow-collector:
        user: workflow-collector
        permission: workflow-collector-vm
        actions: [view, change]
        object_types: [virtualization.virtualmachine]
        field: collector_api_token
        description: service deployment workflow conformance collector
      vm-recorder:
        user: workflow-vm-recorder
        permission: workflow-vm-record
        actions: [view, add]
        object_types: [virtualization.virtualmachine]
        # read-only, a second permission: placing a VM needs its cluster, never adding one
        view_object_types: [virtualization.cluster]
        field: vm_recorder_api_token
        description: service deployment workflow VM record (validate-address)
      # Duplicate-VM reconciliation (reconcile-netbox-duplicate-vms.yml): view every VM, change one (the
      # custom-field PATCH), delete one (the bare record). The read-only views are the interfaces it refuses
      # on, the cluster and the tenant names it reports. Nothing here can add a VM.
      # Least privilege, one ObjectPermission per grant. NetBox ORs a user's permissions, so a grant without a
      # constraint would widen a constrained one. Constraints are a Django filter (qs_filter_from_constraints:
      # Q(**constraint)); a null or empty entry grants unconstrained access (netbox v4.5.0,
      # netbox/utilities/permissions.py). NetBox applies them where the viewset calls restrict(): the
      # virtual-machine endpoints do, so the change and delete scopes bind. The changelog endpoint does NOT
      # (netbox/core/api/views.py ObjectChangeViewSet is a plain DRF viewset), and has_perm ignores constraints
      # (netbox/netbox/authentication/__init__.py ObjectPermissionMixin.has_perm), so the changelog scope is
      # unconstrained: a constraint there would look like a restriction and restrict nothing.
      # The change and delete constraints are disjoint: one needs comments that start with VMID: (never empty),
      # the other needs empty comments. So no record can match both.
      vm-reconciler:
        user: workflow-vm-reconciler
        permission: workflow-vm-reconcile-vm-view
        actions: [view]
        object_types: [virtualization.virtualmachine]
        view_object_types: [virtualization.vminterface, virtualization.cluster, tenancy.tenant]
        view_permission: workflow-vm-reconcile-view
        extra_scopes:
          - permission: workflow-vm-reconcile-changelog-view
            actions: [view]
            object_types: [core.objectchange]
          # The PATCH targets a discovery record only: a VMID comment, and vcpus set (discovery always sets it).
          - permission: workflow-vm-reconcile-change
            actions: [change]
            object_types: [virtualization.virtualmachine]
            constraints: {comments__startswith: "VMID:", vcpus__isnull: false}
          # The DELETE targets a bare record only: the marker description, no vcpus, and empty comments (the
          # shape validate-address-free.yml creates: its POST sets no comments, and NetBox stores blank text).
          - permission: workflow-vm-reconcile-delete
            actions: [delete]
            object_types: [virtualization.virtualmachine]
            constraints: {description: "Declared by the service deployment workflow (validate-address)", vcpus__isnull: true, comments: ""}
        token_write_enabled: true
        field: vm_reconciler_api_token
        description: service deployment workflow duplicate VM reconciliation
      # Dispatch Console (plan 17, D22-D24): view only, on the six types the v1 console reads. D24 v1 reads
      # prefixes only: no IP addresses and no interfaces. No add, change or delete anywhere. token_write_enabled
      # is false on the token itself as well: NetBox's Token model declares write_enabled = BooleanField(default=True)
      # (netbox/users/models/tokens.py at tag v4.5.0), so the token refuses writes even if a permission is widened.
      console:
        user: console
        permission: console-readonly
        actions: [view]
        object_types: [dcim.site, dcim.device, virtualization.cluster, virtualization.virtualmachine, ipam.prefix, extras.tag]
        token_write_enabled: false
        field: console_api_token
        description: Dispatch Console read-only inventory (Phase 3)
    # The survey is a closed list; an API launch or -e can still pass anything, so blank (or
    # whitespace) means the original profile and the assert below refuses the rest.
    _profile_name: "{{ (netbox_token_profile | default('') | trim) or 'device-writer' }}"
    _profile: "{{ _profiles[_profile_name] }}"
    _user: "{{ _profile.user }}"
    # Every ObjectPermission the profile declares, by name: the set the dedicated user must end up holding exactly.
    _declared_perm_names: >-
      {{ [_profile.permission]
         + ([_profile.view_permission | default(_profile.permission ~ '-view')] if (_profile.view_object_types | default([])) else [])
         + (_profile.extra_scopes | default([]) | map(attribute='permission') | list) }}

  tasks:
    - name: "Refuse an unknown token profile"
      ansible.builtin.assert:
        that: _profile_name in _profiles
        fail_msg: >-
          netbox_token_profile {{ _profile_name | to_json }} is not one of
          {{ _profiles | list | join(', ') }}.
        quiet: true

    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Read the NetBox secret (does the token already exist?)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/netbox"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _nb_secret
      delegate_to: localhost
      no_log: true
      check_mode: false

    # The `|` below is a Django QuerySet union inside Python, not a shell pipe.
    # The console token must be view-only, so its user must hold no superuser or group rights: a permission
    # granted through a group the user joins would widen it. Read before anything is written, console profile only.
    # NetBox's User model (netbox/users/models/users.py, v4.5.0) is AbstractBaseUser + PermissionsMixin and declares
    # no is_staff, so the staff flag is read with getattr.
    - name: "Read the console user's superuser and group rights (console profile only)"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model

        user = get_user_model().objects.filter(username="{{ _user }}").first()
        if user is None:
            print("absent")
        elif user.is_superuser or getattr(user, "is_staff", False) or user.groups.exists():
            print("elevated")
        else:
            print("plain")
        PYSCRIPT
      register: _console_user_rights
      changed_when: false
      check_mode: false
      when: _profile_name == 'console'

    - name: "Refuse a console user that holds superuser or group rights"
      ansible.builtin.assert:
        that: (_console_user_rights.stdout_lines | default([]) | last | default('') | trim) != 'elevated'
        fail_msg: >-
          NetBox user '{{ _user }}' holds superuser or group rights. The console token is view-only, so those rights
          must go before this runs: remove the user's superuser flag and group memberships in NetBox, then rerun.
        quiet: true
      when: _profile_name == 'console'

    - name: "Ensure NetBox automation user and scoped permissions"  # noqa: risky-shell-pipe
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import ObjectPermission
        from core.models import ObjectType
        import json

        user, changed = get_user_model().objects.get_or_create(
            username="{{ _user }}",
            defaults={"is_active": True},
        )
        # (name, actions, object types, constraints): None is unconstrained. Extra scopes arrive as JSON, so
        # true/null in a constraint stay valid Python.
        scopes = [("{{ _profile.permission }}", {{ _profile.actions | to_json }}, {{ _profile.object_types | to_json }}, None)]
        if {{ _profile.view_object_types | default([]) | to_json }}:
            scopes.append(("{{ _profile.view_permission | default(_profile.permission ~ '-view') }}", ["view"],
                           {{ _profile.view_object_types | default([]) | to_json }}, None))
        scopes += [(s["permission"], s["actions"], s["object_types"], s.get("constraints")) for s in
                   json.loads({{ (_profile.extra_scopes | default([])) | to_json | to_json }})]
        for name, actions, types, constraints in scopes:
            wanted = {ObjectType.objects.get_by_natural_key(*t.split(".")).pk for t in types}
            perm, created = ObjectPermission.objects.get_or_create(
                name=name, defaults={"enabled": True, "actions": actions, "constraints": constraints},
            )
            changed |= created
            if not perm.enabled or perm.actions != actions or perm.constraints != constraints:
                perm.enabled, perm.actions = True, actions
                perm.constraints = constraints
                perm.save(update_fields=["enabled", "actions", "constraints"])
                changed = True
            if set(perm.object_types.values_list("pk", flat=True)) != wanted:
                perm.object_types.set(list(wanted))
                changed = True
            if not perm.users.filter(pk=user.pk).exists():
                perm.users.add(user)
                changed = True
        # Exact convergence: the dedicated user holds the declared permissions and nothing else. Detach only (the
        # ObjectPermission objects stay); a grant made by hand on this user is detached too. Names are printed.
        declared = [name for name, *_ in scopes]
        stale = list(ObjectPermission.objects.filter(users=user).exclude(name__in=declared).order_by("name"))
        for perm in stale:
            print("removed: " + perm.name)
            perm.users.remove(user)
            changed = True
        print("changed" if changed else "unchanged")
        PYSCRIPT
      register: _permissions
      changed_when: (_permissions.stdout_lines | default([]) | last | default('') | trim) == 'changed'
      when: not ansible_check_mode

    - name: "Show the permissions removed from the dedicated user"
      ansible.builtin.debug:
        msg: "{{ _permissions.stdout_lines | select('match', '^removed: ') | list }}"
      when: not ansible_check_mode

    # The dry run changes nothing: it only reads which permissions a real run would detach.
    - name: "Dry run: report the permissions the dedicated user would lose"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import ObjectPermission

        user = get_user_model().objects.filter(username="{{ _user }}").first()
        declared = {{ _declared_perm_names | to_json }}
        if user is not None:
            for name in ObjectPermission.objects.filter(users=user).exclude(name__in=declared).order_by("name").values_list("name", flat=True):
                print("would remove: " + name)
        PYSCRIPT
      register: _would_remove
      changed_when: false
      check_mode: false
      when: ansible_check_mode

    - name: "Dry run: show the permissions that would be removed"
      ansible.builtin.debug:
        var: _would_remove.stdout_lines
      when: ansible_check_mode

    - name: "Already provisioned — skip (idempotent)"
      when: (_nb_secret.json.data.data[_profile.field] | default('')) | length > 0
      block:
        - name: "Report skip"
          ansible.builtin.debug:
            msg: "{{ _profile.field }} already present at secret/services/netbox — nothing to do."
        - name: "End play"
          ansible.builtin.meta: end_play

    - name: "Check for a dedicated token whose plaintext is absent from OpenBao"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        # A dry run skips creating the user, so an absent user has no tokens (0), not an error.
        user = get_user_model().objects.filter(username="{{ _user }}").first()
        print(0 if user is None else Token.objects.filter(
            user=user, description="{{ _profile.description }}",
        ).count())
        PYSCRIPT
      register: _orphaned_token
      changed_when: false
      check_mode: false

    - name: "Refuse an unrecoverable dedicated token"
      ansible.builtin.assert:
        that: >-
          (_orphaned_token.stdout_lines | last | trim | int) == 0 or
          (replace_unrecoverable_token | default(false) | bool and
           (_orphaned_token.stdout_lines | last | trim | int) == 1)
        fail_msg: "NetBox has a dedicated token without its OpenBao bearer value; replacement requires replace_unrecoverable_token=true and exactly one matching token."

    # A dry run writes no user, permission or token, so the mint and its sanity check below have
    # nothing to read: report what a real run would do and stop (PR 203 check-mode retrofit).
    - name: "Dry run: report the planned mint"
      ansible.builtin.debug:
        msg: >-
          check mode: {{ 'one unrecoverable dedicated token would be revoked, then ' if
          (_orphaned_token.stdout_lines | last | trim | int) == 1 else '' }}a scoped v2 token for
          {{ _user }} would be minted and stored at secret/services/netbox:{{ _profile.field }}.
      when: ansible_check_mode

    - name: "Dry run: stop before the revoke and mint"
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: "Revoke exactly one unrecoverable dedicated token when explicitly requested"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        user = get_user_model().objects.get(username="{{ _user }}")
        matches = Token.objects.filter(
            user=user, description="{{ _profile.description }}",
        )
        if matches.count() != 1:
            raise RuntimeError("Expected exactly one unrecoverable dedicated token")
        matches.delete()
        print("revoked")
        PYSCRIPT
      when: not ansible_check_mode and (_orphaned_token.stdout_lines | last | trim | int) == 1

    - name: "Mint the dedicated scoped token via the NetBox Django shell"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        from django.contrib.auth import get_user_model
        from users.models import Token

        user = get_user_model().objects.get(username="{{ _user }}")
        issued = Token.objects.create(
            user=user, version=2,
            description="{{ _profile.description }}",
            {{ 'write_enabled=False,' if not (_profile.token_write_enabled | default(true)) else '' }}
        )
        print(issued.get_auth_header_prefix().removeprefix("Bearer ") + issued.token)
        PYSCRIPT
      register: _mint
      changed_when: true
      no_log: true
      when: not ansible_check_mode

    - name: "Sanity-check the minted NetBox v2 bearer token"
      ansible.builtin.assert:
        that:
          - (_mint.stdout_lines | default([]) | length) > 0
          - (_mint.stdout_lines | last | trim) is match('^nbt_[A-Za-z0-9]{12}\.[A-Za-z0-9]{40}$')
        fail_msg: "NetBox Django shell did not return a v2 bearer token — mint failed; check the run."
      no_log: true

    - name: "Store the token in OpenBao (patch, preserving other fields)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/netbox"
        method: POST
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        body_format: json
        body:
          data: "{{ (_nb_secret.json.data.data | default({})) | combine({_profile.field: (_mint.stdout_lines | last | trim)}) }}"
        status_code: [200, 204]
      delegate_to: localhost
      no_log: true
      when: not ansible_check_mode

    - name: "Provisioned"
      ansible.builtin.debug:
        msg: "Minted + stored {{ _profile.field }} for NetBox user '{{ _user }}'."
