---
# reconcile-netbox-duplicate-vms.yml — remove the duplicate VM records one service left in NetBox.
#
# Two records exist for one VM when the workflow's validate-address step created a bare record before Proxmox
# discovery reconciled the VM by name (validate-address-free.yml: the marker description, no vcpus, no comments).
# Discovery's record is the one that stays: Proxmox discovery recreates it on every sync. A same-name pair
# qualifies only when the group holds exactly two records, one bare and one discovery record (its comments start
# with "VMID:" and its vcpus is set: platform/services/netbox/deployment/workers/proxmox_discovery/proxmox_discovery/__init__.py
# writes both). Any other group of more than one record is
# ambiguous and is never touched.
#
# Runs on the netbox_svc host through the NetBox Django shell, in the same exec pattern as
# provision-netbox-automation-token.yml. There is NO API token and no OpenBao read. The script has the shell's full
# authority, so its guards are code, and the reviewed Semaphore template is the only way in.
#
# Why there is no API token (review of 82ed8032, checked against NetBox v4.5.0):
#   1. The changelog API (core.objectchange) returns prechange and postchange data of every object type, including
#      Webhook.secret and DataSource.parameters. ObjectChangeViewSet (netbox/core/api/views.py) does not call
#      restrict(). A token that reads the changelog to judge provenance can read those values.
#   2. An ObjectPermission's constraints bind only where a view calls restrict(). A user who gains a group or
#      superuser grant is not checked against them. (The review's claim; not re-verified in this playbook.)
#   3. A token limited to deleting bare records could delete any record this playbook would refuse, because the
#      limit sits on the token and not in the playbook's logic.
#
# For each candidate pair, inside one transaction (nothing is written before the whole plan is known):
#   origin    bare: its only create entry in the changelog is by workflow-vm-recorder. Discovery: created by another
#             account. Anything else, including a pruned changelog, is unverified_origin and untouched.
#   refusal   a bare record holding an interface or a primary IP is refused and untouched. The other pairs of the run
#             proceed, and the play fails after printing the plan.
#   fields    ac_workflow_status, ac_failed_steps and ac_last_run move as ONE unit, and only when the bare record's
#             ac_last_run is set and newer than discovery's (or discovery has none). No field is taken from one run
#             and another field from a different run.
#   write     PATCH the discovery record (the three fields only) and read it back. Then DELETE each bare record and check
#             it is gone. Every PATCH happens before the first DELETE. A real run writes; a dry run does not.
#   verify    after the commit the state is read back from the database, and the play fails if it is not as planned.
#
# Limits, stated and not hidden:
#   - NetBox prunes changelog entries after CHANGELOG_RETENTION days (default 90, netbox/netbox/config/parameters.py).
#     A pair whose creation entry was pruned reads unverified_origin and is never reconciled.
#   - Changes made by this script leave NO changelog entry: netbox/core/signals.py handle_changed_object returns when
#     there is no current request, and the Django shell has none. The Semaphore task output is the only record of a run.
#   - The origin check trusts the user_name NetBox stores on each changelog entry.
#
# Inputs (Semaphore survey, or -e):
#   reconcile_names  optional JSON list of VM names, e.g. ["dns"]; blank = every verified pair
#
# Check mode (--check) runs the same plan with dry_run=true, prints it, and writes nothing. A refusal fails the dry
# run as well, so the dry run exits non-zero exactly when the real run would refuse.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Reconcile duplicate NetBox VM records (workflow bare record, discovery record kept)"
  hosts: netbox_svc
  gather_facts: false
  become: false

  vars:
    # The same exec pattern as provision-netbox-automation-token.yml: the configured engine and container.
    _manage: "{{ container_engine | default('docker') }} exec -i {{ netbox_app_container | default('netbox-netbox-1') }} /opt/netbox/netbox/manage.py shell"
    # The Python the NetBox shell runs. The shell receives PARAMS (dry_run, names) on the line above this body.
    # No Jinja markers in it: Ansible templates variable values, so a brace pair here would be evaluated.
    _reconcile_body: |
      import json
      from datetime import datetime, timezone

      from core.models import ObjectChange
      from django.db import transaction
      from virtualization.models import VirtualMachine

      MARKER = "Declared by the service deployment workflow (validate-address)"
      RECORDER = "workflow-vm-recorder"
      FIELDS = ["ac_workflow_status", "ac_failed_steps", "ac_last_run"]
      PREFIX = "RECONCILE_RESULT "


      def empty(value):
          return value is None or value in ("", {}, [])


      def stamp(value):
          # A run stamp: None when unset. Raises ValueError when the value cannot be read as a datetime.
          if empty(value):
              return None
          text = str(value).strip()
          if text.endswith("Z"):
              text = text[:-1] + "+00:00"
          parsed = datetime.fromisoformat(text)
          return parsed if parsed.tzinfo else parsed.replace(tzinfo=timezone.utc)


      def row_of(vm):
          return {
              "id": vm.id,
              "name": vm.name,
              "cluster_id": vm.cluster_id,
              "cluster": vm.cluster.name if vm.cluster else "none",
              "tenant": vm.tenant.name if vm.tenant else "none",
              "created": str(vm.created),
              "description": vm.description or "",
              "vcpus": vm.vcpus,
              "comments": vm.comments or "",
              "interface_count": vm.interface_count,
              "primary_ip4_id": vm.primary_ip4_id,
              "primary_ip6_id": vm.primary_ip6_id,
              "fields": dict(vm.custom_field_data or {}),
          }


      def is_bare(row):
          return row["description"] == MARKER and row["vcpus"] is None and row["comments"] == ""


      def is_disc(row):
          return row["comments"].startswith("VMID:") and row["vcpus"] is not None


      def blockers(row):
          reasons = []
          if row["interface_count"] is None:
              reasons.append("interface count unknown")
          elif row["interface_count"] > 0:
              reasons.append("has interfaces")
          if row["primary_ip4_id"] is not None or row["primary_ip6_id"] is not None:
              reasons.append("has a primary IP")
          return reasons


      def origin_verified(bare_creators, disc_creators):
          # The bare record's only create entry is the recorder's. The discovery record was created by another account.
          return bare_creators == [RECORDER] and len(disc_creators) > 0 and RECORDER not in disc_creators


      def take_bare_run(bare_fields, disc_fields):
          # The three workflow fields move as one unit, from a bare run whose stamp is set and newer than discovery's
          # (or discovery has no stamp). Raises ValueError for an unreadable stamp.
          bare_at = stamp(bare_fields.get("ac_last_run"))
          disc_at = stamp(disc_fields.get("ac_last_run"))
          return bare_at is not None and (disc_at is None or bare_at > disc_at)


      def reconcile():
          dry_run = bool(PARAMS["dry_run"])
          wanted = set(name.lower() for name in PARAMS["names"])
          ok = True
          errors = []
          ambiguous = []
          plan = []
          writes = []
          with transaction.atomic():
              groups = {}
              for vm in VirtualMachine.objects.select_related("cluster", "tenant"):
                  row = row_of(vm)
                  groups.setdefault((row["name"].lower(), row["cluster_id"]), []).append(row)
              candidates = []
              for key in sorted(groups, key=lambda k: (k[0], k[1])):
                  group = groups[key]
                  if len(group) < 2:
                      continue
                  bares = [r for r in group if is_bare(r)]
                  discs = [r for r in group if is_disc(r)]
                  if len(group) == 2 and len(bares) == 1 and len(discs) == 1:
                      candidates.append((bares[0], discs[0]))
                  else:
                      ambiguous.append({"name": group[0]["name"], "cluster": group[0]["cluster"], "count": len(group)})

              ids = [row["id"] for pair in candidates for row in pair]
              creators = {}
              if ids:
                  changes = ObjectChange.objects.filter(
                      changed_object_type__app_label="virtualization",
                      changed_object_type__model="virtualmachine",
                      changed_object_id__in=ids,
                      action="create",
                  )
                  for change in changes:
                      creators.setdefault(change.changed_object_id, []).append(change.user_name)

              verified_names = set()
              for bare, disc in candidates:
                  verified = origin_verified(creators.get(bare["id"], []), creators.get(disc["id"], []))
                  if verified:
                      verified_names.add(bare["name"].lower())
                  if wanted and bare["name"].lower() not in wanted:
                      continue
                  entry = {"bare": bare, "disc": disc, "action": "", "moved": [], "values": None}
                  if not verified:
                      entry["action"] = "unverified_origin"
                  else:
                      try:
                          take = take_bare_run(bare["fields"], disc["fields"])
                          reasons = blockers(bare)
                      except ValueError:
                          take, reasons = False, ["unparseable_last_run"]
                      if reasons:
                          entry["action"] = "refused:" + ", ".join(reasons)
                      else:
                          entry["action"] = "would_merge" if dry_run else "merged"
                          if take:
                              entry["values"] = {f: bare["fields"].get(f) for f in FIELDS}
                              entry["moved"] = list(FIELDS)
                  plan.append(entry)

              missing = sorted(wanted - verified_names)
              if missing:
                  ok = False
                  errors.append("names no verified duplicate pair: " + ", ".join(missing))
              for entry in plan:
                  if entry["action"].startswith("refused:"):
                      ok = False
                      errors.append("refused, not written: %s in cluster %s (%s)" % (
                          entry["bare"]["name"], entry["bare"]["cluster"], entry["action"][len("refused:"):]))

              # A name that matches no verified pair stops the run before any write. A refused pair is left alone and
              # the other pairs proceed. Nothing is written in a dry run.
              if not missing and not dry_run:
                  writes = [e for e in plan if e["action"] == "merged"]
              for e in writes:
                  # Re-read both records under a row lock and re-check the shape and the refusal before any write.
                  e["bare_obj"] = VirtualMachine.objects.select_for_update().get(pk=e["bare"]["id"])
                  e["disc_obj"] = VirtualMachine.objects.select_for_update().get(pk=e["disc"]["id"])
                  if not (is_bare(row_of(e["bare_obj"])) and is_disc(row_of(e["disc_obj"]))
                          and not blockers(row_of(e["bare_obj"]))):
                      raise RuntimeError("a pair changed between the read and the write; nothing was committed")
              for e in writes:
                  if e["values"] is not None:
                      disc_obj = e["disc_obj"]
                      disc_obj.custom_field_data = {**(disc_obj.custom_field_data or {}), **e["values"]}
                      disc_obj.save()
                      disc_obj.refresh_from_db()
                      held = disc_obj.custom_field_data or {}
                      if any(held.get(f) != e["values"][f] for f in FIELDS):
                          raise RuntimeError("a discovery record did not hold the moved fields; nothing was committed")
              for e in writes:
                  e["bare_obj"].delete()
              for e in writes:
                  if VirtualMachine.objects.filter(pk=e["bare"]["id"]).exists():
                      raise RuntimeError("a bare record still exists after its delete; nothing was committed")
              if not writes:
                  transaction.set_rollback(True)

          # The commit is done: read the committed state back from the database.
          for e in writes:
              if VirtualMachine.objects.filter(pk=e["bare"]["id"]).exists():
                  ok = False
                  errors.append("bare record still present after commit: %s in cluster %s" % (
                      e["bare"]["name"], e["bare"]["cluster"]))
              if e["values"] is not None:
                  kept = VirtualMachine.objects.get(pk=e["disc"]["id"]).custom_field_data or {}
                  if any(kept.get(f) != e["values"][f] for f in FIELDS):
                      ok = False
                      errors.append("discovery record lacks the moved fields after commit: %s in cluster %s" % (
                          e["disc"]["name"], e["disc"]["cluster"]))

          pairs = []
          for e in plan:
              bare, disc = e["bare"], e["disc"]
              pairs.append({
                  "name": bare["name"],
                  "cluster": bare["cluster"],
                  "bare_id": bare["id"],
                  "bare_tenant": bare["tenant"],
                  "bare_created": bare["created"],
                  "disc_id": disc["id"],
                  "disc_tenant": disc["tenant"],
                  "disc_created": disc["created"],
                  "action": e["action"],
                  "moved": e["moved"],
              })
          result = {"ok": ok, "dry_run": dry_run, "pairs": pairs, "ambiguous": ambiguous, "errors": errors}
          print(PREFIX + json.dumps(result, sort_keys=True))


      reconcile()

  tasks:
    # ── the selection the operator asked for ────────────────────────────────────────────
    # The Semaphore survey passes a JSON string; `-e reconcile_names='["dns"]'` arrives as a list.
    # Both are accepted; a blank survey value means every verified pair.
    - name: "Hold the requested VM names (a JSON list)"
      ansible.builtin.set_fact:
        _names: >-
          {{ reconcile_names if (reconcile_names is defined and reconcile_names is sequence and reconcile_names is not string)
             else (((reconcile_names | default('')) | string | trim | from_json)
                   if ((reconcile_names | default('')) | string | trim | length) > 0 else []) }}

    - name: "Refuse a reconcile_names value that is not a JSON list of strings"
      ansible.builtin.assert:
        that: >-
          _names is sequence and _names is not string
          and (_names | select('string') | list | length) == (_names | length)
        fail_msg: 'reconcile_names must be a JSON list of VM names, for example ["dns"], or blank for every pair.'
        quiet: true

    # ── the plan (check mode): the same script with dry_run true, and nothing is written ─────
    # Read-only by construction: dry_run is hard-coded true, the transaction is rolled back, and the write path is
    # never reached. It runs under check mode on purpose, so a dry run prints the plan and exits non-zero on refusal.
    - name: "Dry run: plan the reconciliation in the NetBox Django shell (nothing is written)"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        import json
        PARAMS = json.loads({{ {'dry_run': true, 'names': _names} | to_json | to_json }})
        {{ _reconcile_body }}
        PYSCRIPT
      # Its own name: Ansible stores a skipped task's result under its register name, so a shared name would let the
      # skipped real task overwrite this result (the dry run's output was lost that way).
      register: _reconcile_dry
      when: ansible_check_mode
      check_mode: false
      changed_when: false

    # ── the reconciliation (a real run): the same script with dry_run false, in one transaction ──
    - name: "Reconcile in the NetBox Django shell (one transaction; refused pairs are left untouched)"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        import json
        PARAMS = json.loads({{ {'dry_run': false, 'names': _names} | to_json | to_json }})
        {{ _reconcile_body }}
        PYSCRIPT
      register: _reconcile_real
      when: not ansible_check_mode
      changed_when: true

    # ── the result: exactly one line, names and ids only ──────────────────────────────────
    - name: "Hold the result line the NetBox shell printed"
      ansible.builtin.set_fact:
        # The conditional reads only the branch that ran, so the skipped task's result is never touched.
        _result_lines: "{{ ((_reconcile_dry if ansible_check_mode else _reconcile_real).stdout_lines | default([])) | select('match', '^RECONCILE_RESULT ') | list }}"

    - name: "Require exactly one result line"
      ansible.builtin.assert:
        that: _result_lines | length == 1
        fail_msg: "The NetBox shell printed {{ _result_lines | length }} result line(s), expected 1. Nothing is judged from that output."
        quiet: true

    - name: "Hold the parsed result (names and ids only)"
      ansible.builtin.set_fact:
        _result: "{{ _result_lines[0] | regex_replace('^RECONCILE_RESULT ', '') | from_json }}"

    - name: "Show the result (names and ids only)"
      ansible.builtin.debug:
        var: _result

    - name: "Require every selected pair to be reconciled"
      ansible.builtin.assert:
        that: _result.ok | bool
        fail_msg: >-
          {{ 'Dry run: ' if ansible_check_mode else '' }}not every selected pair was reconciled: {{ _result.errors | join('; ') }}.
          A refused pair is left untouched; the play fails here so the run is not reported as a success.
        quiet: true

    - name: "Summarise the run (names and counts only)"
      ansible.builtin.debug:
        msg: >-
          {{ 'check mode: nothing changed; ' if ansible_check_mode else '' }}{{
          _result.pairs | selectattr('action', 'in', ['merged', 'would_merge']) | list | length }} pair(s)
          {{ 'would be' if ansible_check_mode else 'were' }} reconciled;
          {{ _result.pairs | selectattr('action', 'equalto', 'unverified_origin') | list | length }} unverified origin, not touched;
          {{ _result.ambiguous | length }} ambiguous group(s), not touched.
