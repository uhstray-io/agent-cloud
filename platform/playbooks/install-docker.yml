---
# install-docker.yml — Install Docker CE on target hosts (official repo)
#
# Idempotent: skips if Docker is already installed.
# Requires become (sudo).
#
# Usage: -e "target_service=netbox_svc"

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Install Docker on {{ target_service | default('(unset)') }}"
  hosts: "{{ target_service }}"
  gather_facts: false
  become: true
  vars:
    target_service: "ungrouped"

  tasks:
    - name: "Resolve the sudo password (host may not be hardened yet)"
      # Play-level become means even fact gathering escalates, so this must be the
      # first task or the play dies at "Gathering Facts" with ok=0 on any host that
      # still requires a sudo password. See the task file for the measured failure.
      ansible.builtin.include_tasks: tasks/resolve-become-password.yml

    - name: "Gather facts now that escalation is possible"
      # Gathering is deferred, not skipped. Automatic gathering would have run
      # BEFORE the resolver above and escalated without a password, killing the
      # play at "Gathering Facts" — which is exactly what happened before this.
      ansible.builtin.setup:

    - name: "Check if Docker is installed"
      ansible.builtin.command: docker --version
      register: _docker_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Install Docker CE"
      when: _docker_check.rc != 0
      block:
        - name: "Add Docker's apt repository"
          # Shared with install-podman.yml, which installs only the Docker CLI client.
          ansible.builtin.include_tasks: tasks/add-docker-apt-repo.yml

        - name: "Install Docker packages"
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

    - name: "Add user to docker group — {{ ansible_user }}"
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: "Ensure Docker service is running"
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: "Verify Docker"
      ansible.builtin.command: docker --version
      become: false
      register: _docker_ver
      changed_when: false
      check_mode: false

    - name: "Docker ready"
      ansible.builtin.debug:
        msg: "{{ _docker_ver.stdout }}"
