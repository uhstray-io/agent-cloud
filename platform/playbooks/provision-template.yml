---
# provision-template.yml — Create a reusable VM template on Proxmox: Ubuntu 24.04
# (ubuntu-2404-template, the default) or, with -e template_os=windows, Windows Server 2025
# (windows-server-2025-template). Run via Semaphore or:
#   ansible-playbook -i inventory/local.yml playbooks/provision-template.yml

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml
  tags: [always]

- name: Preflight the fixed restore-target OpenBao destination before any credential lookup
  ansible.builtin.import_playbook: preflight-o11y-restore-target-inputs.yml
  tags: [always]

- name: "Pre-validate: Cluster ready for template creation"
  ansible.builtin.import_playbook: proxmox-validate.yml
  vars:
    _extra_var_guard_nested: true

- name: "Create the VM Template (Ubuntu 24.04 or Windows Server 2025)"
  hosts: localhost
  connection: local
  gather_facts: true
  module_defaults:
    ansible.builtin.uri:
      validate_certs: false
      headers:
        Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
  vars:
    _project_root: "{{ project_root | default(playbook_dir + '/..') }}"
    # The Proxmox connection comes from OpenBao (secret/services/proxmox), the same record
    # the imported validation play reads; Semaphore supplies no other input. An operator
    # run that passes pve_token_secret / PVE_TOKEN_SECRET skips the store and must pass
    # pve_host and pve_token_id too. Play vars do not cross the play boundary, so this
    # play reads the store itself rather than relying on the validation play.
    _pve_operator_secret: "{{ pve_token_secret | default(lookup('env', 'PVE_TOKEN_SECRET'), true) | default('', true) }}"
    _openbao_hosts: "{{ groups['openbao_svc'] | default([]) }}"
    _openbao_host: "{{ (_openbao_hosts | first) | default('') if (_openbao_hosts | length == 1) else '' }}"
    _bao_url: "{{ hostvars[_openbao_host].service_url | default('') if _openbao_host else '' }}"
    _bao_role_id: "{{ lookup('env', 'BAO_ROLE_ID') }}"
    _bao_secret_id: "{{ lookup('env', 'BAO_SECRET_ID') }}"
    _pve_data: >-
      {{ {} if (_pve_operator_secret | length > 0)
         else lookup('community.hashi_vault.hashi_vault', 'secret/data/services/proxmox',
                     url=_bao_url, auth_method='approle',
                     role_id=_bao_role_id, secret_id=_bao_secret_id) }}
    # Placeholders until "Resolve the Proxmox connection" sets them as facts, which take
    # precedence over play vars. module_defaults is templated for EVERY task, fact
    # gathering and the resolution itself included, and ansible-core before 2.19 fails
    # the task on an undefined name there (Semaphore task 3177). The refusals below run
    # before any request, so an empty value never reaches Proxmox.
    _pve_host: ""
    _pve_token_id: ""
    _pve_secret: ""
    _os: "{{ template_os | default('ubuntu', true) }}"
    # `default(..., true)`: a blank survey value falls back like an absent one.
    _node: "{{ target_node | default('alphacentauri', true) }}"
    _vmid: "{{ template_vmid | default(9000, true) }}"
    _name: "{{ 'windows-server-2025-template' if _os == 'windows' else 'ubuntu-2404-template' }}"
    _storage: "{{ vm_storage | default('vm-lvms') }}"
    _ubuntu_iso: "{{ ubuntu_iso | default('SharedISOs:iso/ubuntu-24.04.3-live-server-amd64.iso') }}"
    _disk: "{{ disk_size | default('64G' if _os == 'windows' else '20G') }}"
    _cores: "{{ cores | default(4 if _os == 'windows' else 2) }}"
    _mem: "{{ memory | default(8192 if _os == 'windows' else 2048) }}"
    _seed_path: "{{ _project_root }}/proxmox/cloud-init/autoinstall-seed.iso"
    _seed_volid: "local:iso/autoinstall-seed.iso"
    _ssh_pub: "{{ ssh_public_key | default(lookup('env', 'SSH_PUBLIC_KEY')) }}"
    # Windows only. The ISOs are instance values (volid form <storage>:iso/<file>.iso) that
    # inventory or the survey supplies, so there is no default.
    _win_iso: "{{ windows_iso | default('') }}"
    _virtio_iso: "{{ virtio_iso | default('') }}"
    _win_image_index: "{{ windows_image_index | default(2) }}"
    _win_seed_storage: "{{ seed_iso_storage | default('local', true) }}"
    _win_seed_file: "windows-seed-{{ _vmid }}.iso"
    _win_seed_volid: "{{ _win_seed_storage }}:iso/{{ _win_seed_file }}"
    _win_dir: "{{ playbook_dir | dirname }}/hypervisor/proxmox/windows"
    # A conditional expression: the store is read only when no key is passed, and only on the
    # Windows path, which is the only one that renders this var.
    _win_ssh_pub: >-
      {{ ssh_public_key if (ssh_public_key | default('') | length > 0)
         else lookup('community.hashi_vault.hashi_vault', 'secret/data/services/ssh:public_key',
                     url=_bao_url, auth_method='approle',
                     role_id=_bao_role_id, secret_id=_bao_secret_id) }}

  tasks:
    # Every hard failure below (a vmid collision, the create, the autoinstall waits) is caught,
    # so the step result is still recorded: this play's only host failing would end the run
    # before any later task or play (D10 review, PR 416).
    - name: "Create or adopt the template"
      block:
        - name: "Refuse an unknown template_os"
          ansible.builtin.assert:
            that: _os in ['ubuntu', 'windows']
            fail_msg: "template_os must be ubuntu or windows, not {{ _os }}."

        # Both reach request paths, and the survey now passes them: refuse anything that is not a
        # plain node name or a number before any request.
        - name: "Refuse a malformed target_node or template_vmid"
          ansible.builtin.assert:
            that:
              - "_node | string is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\\Z')"
              - "_vmid | string is match('^[1-9][0-9]*\\Z')"
            fail_msg: "target_node must be a node name and template_vmid a positive integer."

        # No Windows default vmid or node: the Ubuntu default 9000 would collide with the Ubuntu
        # template, and instance values belong in inventory or the survey.
        - name: "Require template_vmid and target_node for a Windows template"
          ansible.builtin.assert:
            that:
              - template_vmid | default('') | string | length > 0
              - target_node | default('') | string | length > 0
            fail_msg: "A Windows template needs -e template_vmid=<n> and -e target_node=<node>; there is no default."
          when: _os == 'windows'

        - name: "Require the Windows installer ISO volid"
          ansible.builtin.assert:
            that: _win_iso is match('^[^:/]+:iso/[^/]+\\.iso$')
            fail_msg: "windows_iso must be a volid of the form <storage>:iso/<file>.iso, not '{{ _win_iso }}'."
          when: _os == 'windows'

        - name: "Require the VirtIO driver ISO volid"
          ansible.builtin.assert:
            that: _virtio_iso is match('^[^:/]+:iso/[^/]+\\.iso$')
            fail_msg: "virtio_iso must be a volid of the form <storage>:iso/<file>.iso, not '{{ _virtio_iso }}'."
          when: _os == 'windows'

        # The storage name reaches request paths.
        - name: "Require a plain seed ISO storage name"
          ansible.builtin.assert:
            that: "_win_seed_storage is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\\Z')"
            fail_msg: "seed_iso_storage must be a storage name, not '{{ _win_seed_storage }}'."
          when: _os == 'windows'

        - name: "Require a source for the Proxmox connection"
          ansible.builtin.assert:
            that: (_pve_operator_secret | length > 0) or (_bao_url | length > 0)
            fail_msg: >-
              Require private inventory with exactly one openbao_svc.service_url matching
              openbao_addr and protected BAO_ROLE_ID / BAO_SECRET_ID environment credentials
              for the restore-target guard. For Proxmox credentials, use the OpenBao record
              or provide a protected pve_token_secret / PVE_TOKEN_SECRET.

        # The AppRole secret_id and the Proxmox token cross this connection.
        - name: "Refuse a cleartext OpenBao endpoint"
          ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
          vars:
            _assert_bao_url: "{{ _bao_url }}"
          when: _pve_operator_secret | length == 0

        # Resolved once into facts: the store is read a single time, and the facts outlive
        # this play for the step-result plays that follow.
        - name: "Resolve the Proxmox connection"
          ansible.builtin.set_fact:
            _pve_host: "{{ pve_host | default(_pve_data.url | default(''), true) }}"
            _pve_token_id: "{{ pve_token_id | default(_pve_data.token_id | default(''), true) }}"
            _pve_secret: >-
              {{ _pve_operator_secret if (_pve_operator_secret | length > 0)
                 else (_pve_data.api_token | default('')) }}
          no_log: true

        # The token id names a real Proxmox user, so it comes from the store or the run.
        - name: "Require the Proxmox token id"
          ansible.builtin.assert:
            that: _pve_token_id | length > 0
            fail_msg: >-
              secret/services/proxmox has no token_id (or an operator run passed no
              -e pve_token_id=<user>@<realm>!<token-name>); there is no built-in default.

        - name: "Check if template VM already exists"
          ansible.builtin.uri:
            url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/config"
            method: GET
          register: _existing_tmpl
          failed_when: _existing_tmpl.status | default(-1) not in [200, 404, 500]
          check_mode: false

        # An existing template is not a reason to end the play: the step result below still has to
        # be recorded, and the template still has to be proven (D10 review 2026-10-02).
        - name: "Note whether the template already exists"
          ansible.builtin.set_fact:
            _tmpl_present: "{{ _existing_tmpl.status == 200 and (_existing_tmpl.json.data.template | default(0) | int == 1) }}"

        - name: "Fail if VMID taken by non-template"
          ansible.builtin.fail:
            msg: "VMID {{ _vmid }} exists but is not a template."
          when: _existing_tmpl.status == 200 and (_existing_tmpl.json.data.template | default(0) | int != 1)

        - name: "Fail if VMID holds a VM of the other OS"
          ansible.builtin.fail:
            msg: >-
              VMID {{ _vmid }} holds a {{ 'windows' if _vmid_is_windows else 'linux' }} VM;
              a {{ _os }} template cannot use it.
          vars:
            # Every Windows ostype Proxmox lists: w2k, w2k3, w2k8, win7, win8, win10, win11, wvista, wxp.
            _vmid_is_windows: "{{ (_existing_tmpl.json.data.ostype | default('')) is match('^(w2k|win|wvista|wxp)') }}"
          when:
            - _existing_tmpl.status == 200
            - (_vmid_is_windows | bool) != (_os == 'windows')

        - name: "Fail if VMID holds a template with another name"
          ansible.builtin.fail:
            msg: "VMID {{ _vmid }} holds '{{ _existing_tmpl.json.data.name | default('') }}', not {{ _name }}."
          when:
            - _os == 'windows'
            - _existing_tmpl.status == 200
            - (_existing_tmpl.json.data.name | default('')) != _name

        - name: "List cluster VMs to find the Windows template name elsewhere"
          ansible.builtin.uri:
            url: "{{ _pve_host }}/api2/json/cluster/resources?type=vm"
            method: GET
          register: _win_resources
          check_mode: false
          when: _os == 'windows'

        - name: "Fail if the Windows template name is used by another VMID"
          ansible.builtin.fail:
            msg: "{{ _name }} already exists at another VMID than {{ _vmid }}."
          when:
            - _os == 'windows'
            - >-
              _win_resources.json.data | default([], true)
              | selectattr('name', 'defined') | selectattr('name', 'equalto', _name)
              | map(attribute='vmid') | map('int') | reject('equalto', _vmid | int) | list | length > 0

        # A vmid is unique across the cluster, but the config read above asks one node only. A 200
        # on this node is already judged by the template, OS and name checks above.
        - name: "Fail if the Windows VMID is held on another node or under another name"
          ansible.builtin.fail:
            msg: "VMID {{ _vmid }} is already used by another VM in the cluster."
          when:
            - _os == 'windows'
            - _existing_tmpl.status != 200
            - >-
              _win_resources.json.data | default([], true)
              | selectattr('vmid', 'defined') | selectattr('vmid', 'equalto', _vmid | int)
              | list | length > 0

        - name: "Guard template VMID before seed preparation"
          ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
          vars:
            _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
          tags: [always]

        - name: "Create the template when it does not exist yet"
          when:
            - not (_tmpl_present | bool)
            - _os == 'ubuntu'
          block:
            - name: "Build autoinstall seed ISO"
              ansible.builtin.command:
                cmd: "bash {{ _project_root }}/proxmox/cloud-init/build-seed-iso.sh {{ _seed_path }}"
                creates: "{{ _seed_path }}"
              register: _seed_build
              notify: "Show seed ISO build output"

            - name: "Check if seed ISO already uploaded"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/local/content"
                method: GET
              register: _local_content
              check_mode: false

            - name: "Upload seed ISO via uri module"
              when: _local_content.json.data | selectattr('volid', 'equalto', _seed_volid) | list | length == 0
              block:
                - name: "Guard template VMID before seed upload"
                  ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
                  vars:
                    _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
                  tags: [always]

                - name: "Attempt upload via uri module"
                  ansible.builtin.uri:
                    url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/local/upload"
                    method: POST
                    body_format: form-multipart
                    body:
                      content:
                        content: "iso"
                      filename:
                        content: "{{ lookup('file', _seed_path) }}"
                        filename: "autoinstall-seed.iso"
                        mime_type: "application/octet-stream"
                  register: _upload_result
                  when: not ansible_check_mode
              rescue:
                - name: "Refresh reserved-target guard before seed-upload fallback"
                  ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
                  vars:
                    _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
                  tags: [always]

                - name: "Upload seed ISO via curl (fallback)"
                  ansible.builtin.command:
                    cmd: >
                      curl -s -k -X POST
                      "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/local/upload"
                      -H "Authorization: PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
                      -F "content=iso"
                      -F "filename=@{{ _seed_path }}"
                  register: _upload_fallback
                  changed_when: true
                  no_log: true
                  when: not ansible_check_mode

            - name: "Guard template VMID before creation"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Create template VM"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu"
                method: POST
                body_format: form-urlencoded
                body:
                  vmid: "{{ _vmid }}"
                  name: "{{ _name }}"
                  ostype: "l26"
                  cores: "{{ _cores }}"
                  memory: "{{ _mem }}"
                  scsihw: "virtio-scsi-pci"
                  scsi0: "{{ _storage }}:{{ _disk | regex_replace('G', '') }}"
                  ide0: "{{ _ubuntu_iso }},media=cdrom"
                  ide1: "{{ _seed_volid }},media=cdrom"
                  net0: "virtio,bridge=vmbr0,firewall=0"
                  boot: "order=ide0;scsi0"
                  agent: "1"
                  serial0: "socket"
                  vga: "serial0"
                status_code: [200]
              register: _create_result
              when: not ansible_check_mode

            - name: "Wait for VM creation task"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/tasks/{{ _create_result.json.data }}/status"
                method: GET
              register: _task_status
              until: _task_status.json.data.status == "stopped"
              retries: 30
              delay: 5
              when:
                - not ansible_check_mode
                - _create_result.json.data is defined and _create_result.json.data is string

            - name: "Guard template VMID before start"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Start VM for autoinstall"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/status/start"
                method: POST
                status_code: [200]
              when: not ansible_check_mode

            - name: "Autoinstall in progress"
              ansible.builtin.debug:
                msg: "VM {{ _vmid }} started on {{ _node }}. Autoinstall running (5-15 min)..."

            - name: "Wait for VM to be running"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/status/current"
                method: GET
              register: _vm_status
              until: _vm_status.json.data.status == "running"
              retries: 12
              delay: 10
              when: not ansible_check_mode

            - name: "Wait for autoinstall to complete (VM stops when done)"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/status/current"
                method: GET
              register: _vm_status
              until: _vm_status.json.data.status == "stopped"
              retries: 60
              delay: 15
              when: not ansible_check_mode

            - name: "Guard template VMID before post-install config"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Post-install: remove CDs, add cloud-init, set defaults"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/config"
                method: PUT
                body_format: form-urlencoded
                body:
                  ide0: "none,media=cdrom"
                  ide1: "none,media=cdrom"
                  ide2: "{{ _storage }}:cloudinit"
                  boot: "order=scsi0"
                  ciuser: "{{ ci_user | default(ansible_user) }}"
                  sshkeys: "{{ _ssh_pub | urlencode }}"
                  ipconfig0: "ip=dhcp"
                  nameserver: "{{ nameserver | default(gateway | default('')) }}"
                status_code: [200]
              when: not ansible_check_mode

            - name: "Guard template VMID before template conversion"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Convert VM to template"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/template"
                method: POST
                status_code: [200]
              when: not ansible_check_mode

            - name: "Template creation complete"
              ansible.builtin.debug:
                msg: |
                  Template {{ _vmid }} ({{ _name }}) created on {{ _node }}.
                  Storage: {{ _storage }}, Disk: {{ _disk }}
                  Cloud-init enabled. Ready for cloning.

        - name: "Create the Windows template when it does not exist yet"
          when:
            - not (_tmpl_present | bool)
            - _os == 'windows'
          block:
            - name: "Make a private directory for the Windows seed"
              ansible.builtin.tempfile:
                state: directory
                suffix: -winseed
              register: _win_seed_tmp
              when: not ansible_check_mode

            - name: "Make the seed source directory"
              ansible.builtin.file:
                path: "{{ _win_seed_tmp.path }}/src"
                state: directory
                mode: "0700"
              when: not ansible_check_mode

            # Used once by the unattended install and never stored; the first-logon script replaces
            # it. The template is reached by the management key the first-logon script installs.
            # Each clone's administrator password is to be set from the secret store at
            # provisioning (design D3, task 4.2; not built yet).
            - name: "Generate the one-time Administrator password"
              ansible.builtin.set_fact:
                _win_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
              no_log: true
              when: not ansible_check_mode

            - name: "Render the answer file"
              ansible.builtin.template:
                src: "{{ _win_dir }}/autounattend.xml.j2"
                dest: "{{ _win_seed_tmp.path }}/src/Autounattend.xml"
                mode: "0600"
              no_log: true
              when: not ansible_check_mode

            # One line, written to its own seed file: the first-logon script copies it and never
            # parses it.
            - name: "Require an OpenSSH public key for the first-logon script"
              ansible.builtin.assert:
                that:
                  - "_win_ssh_pub is match('^(ssh|ecdsa)-[A-Za-z0-9-]+ [A-Za-z0-9+/]+=*( [^\\n]*)?\\Z')"
                fail_msg: "The management public key is not an OpenSSH public key."
              when: not ansible_check_mode

            - name: "Write the management public key"
              ansible.builtin.copy:
                content: "{{ _win_ssh_pub }}\n"
                dest: "{{ _win_seed_tmp.path }}/src/management.pub"
                mode: "0600"
              when: not ansible_check_mode

            - name: "Copy the first-logon script"
              ansible.builtin.copy:
                src: "{{ _win_dir }}/first-logon.ps1"
                dest: "{{ _win_seed_tmp.path }}/src/first-logon.ps1"
                mode: "0600"
              when: not ansible_check_mode

            - name: "Copy the clone unattend file"
              ansible.builtin.copy:
                src: "{{ _win_dir }}/clone-unattend.xml"
                dest: "{{ _win_seed_tmp.path }}/src/clone-unattend.xml"
                mode: "0600"
              when: not ansible_check_mode

            - name: "Build the Windows seed ISO"
              ansible.builtin.command:
                cmd: "bash {{ _win_dir }}/build-seed-iso.sh {{ _win_seed_tmp.path }}/src {{ _win_seed_tmp.path }}/{{ _win_seed_file }}"
                creates: "{{ _win_seed_tmp.path }}/{{ _win_seed_file }}"
              when: not ansible_check_mode

            - name: "Guard template VMID before Windows seed upload"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            # A run killed before its always section leaves its seed behind under this same name.
            - name: "Look for a seed left by an earlier run"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/{{ _win_seed_storage }}/content"
                method: GET
              register: _win_seed_before
              check_mode: false

            - name: "Delete a seed left by an earlier run"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/{{ _win_seed_storage | urlencode }}/content/{{ _win_seed_volid | urlencode }}?delay=30"
                method: DELETE
                timeout: 60
                status_code: [200]
              when:
                - not ansible_check_mode
                - _win_seed_volid in (_win_seed_before.json.data | default([], true) | map(attribute='volid') | list)

            # The ISO holds the one-time password. curl, not the uri module: the uri module's
            # form-multipart sends a file part base64-encoded, which arrives as the ISO only if the
            # receiver decodes Content-Transfer-Encoding (not verified for Proxmox), or with its line
            # endings rewritten under 7or8bit (ansible.module_utils.urls.prepare_multipart). The
            # token reaches curl on stdin (-H @-), never in argv.
            - name: "Upload the Windows seed ISO"
              ansible.builtin.command:
                argv:
                  - curl
                  - --silent
                  - --show-error
                  - --fail
                  - --insecure
                  - --request
                  - POST
                  - --header
                  - "@-"
                  - --form
                  - content=iso
                  - --form
                  - "filename=@{{ _win_seed_tmp.path }}/{{ _win_seed_file }}"
                  - "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/{{ _win_seed_storage }}/upload"
                stdin: "Authorization: PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
              register: _win_upload
              no_log: true
              when: not ansible_check_mode

            # Proxmox answers {"data": <task id>} when the upload runs as a task.
            - name: "Read the seed upload task id"
              ansible.builtin.set_fact:
                _win_upload_upid: "{{ (_win_upload.stdout | default('{}', true) | from_json).data | default('', true) }}"
              when: not ansible_check_mode

            - name: "Wait for the seed upload task"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/tasks/{{ _win_upload_upid }}/status"
                method: GET
              register: _win_upload_task
              until: _win_upload_task.json.data.status == "stopped"
              retries: 30
              delay: 5
              when:
                - not ansible_check_mode
                - _win_upload_upid | default('') is string
                - _win_upload_upid | default('') | length > 0

            - name: "Fail if the seed upload task failed"
              ansible.builtin.fail:
                msg: "Seed upload failed: {{ _win_upload_task.json.data.exitstatus }}"
              when:
                - _win_upload_task.json is defined
                - _win_upload_task.json.data.exitstatus | default('OK') != 'OK'

            - name: "Guard template VMID before Windows creation"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Create the Windows template VM"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu"
                method: POST
                body_format: form-urlencoded
                body:
                  vmid: "{{ _vmid }}"
                  name: "{{ _name }}"
                  ostype: "win11"
                  machine: "q35"
                  bios: "ovmf"
                  efidisk0: "{{ _storage }}:1,efitype=4m,pre-enrolled-keys=1"
                  tpmstate0: "{{ _storage }}:1,version=v2.0"
                  cpu: "host"
                  cores: "{{ _cores }}"
                  memory: "{{ _mem }}"
                  scsihw: "virtio-scsi-single"
                  scsi0: "{{ _storage }}:{{ _disk | regex_replace('G', '') }}"
                  ide0: "{{ _win_iso }},media=cdrom"
                  ide1: "{{ _virtio_iso }},media=cdrom"
                  ide3: "{{ _win_seed_volid }},media=cdrom"
                  net0: "virtio,bridge=vmbr0,firewall=0"
                  boot: "order=scsi0;ide0"
                  agent: "1"
                  tags: "windows"
                status_code: [200]
              register: _win_create
              when: not ansible_check_mode

            - name: "Wait for Windows VM creation task"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/tasks/{{ _win_create.json.data }}/status"
                method: GET
              register: _win_create_task
              until: _win_create_task.json.data.status == "stopped"
              retries: 30
              delay: 5
              when:
                - not ansible_check_mode
                - _win_create.json.data is defined and _win_create.json.data is string

            - name: "Fail if the Windows VM creation task failed"
              ansible.builtin.fail:
                msg: "VM creation failed: {{ _win_create_task.json.data.exitstatus }}"
              when:
                - _win_create_task.json is defined
                - _win_create_task.json.data.exitstatus | default('OK') != 'OK'

            - name: "Guard template VMID before Windows start"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Start VM for the unattended install"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/status/start"
                method: POST
                status_code: [200]
              when: not ansible_check_mode

            - name: "Wait for the Windows VM to be running"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/status/current"
                method: GET
              register: _win_vm_status
              until: _win_vm_status.json.data.status == "running"
              retries: 12
              delay: 10
              when: not ansible_check_mode

            - name: "Wait for unattended install and sysprep (VM powers off)"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/status/current"
                method: GET
              register: _win_vm_status
              until: _win_vm_status.json.data.status == "stopped"
              retries: 120
              delay: 30
              when: not ansible_check_mode

            - name: "Guard template VMID before Windows post-install config"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Post-install: remove the install CDs, add a cloud-init drive"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/config"
                method: PUT
                body_format: form-urlencoded
                body:
                  ide0: "none,media=cdrom"
                  ide1: "none,media=cdrom"
                  ide3: "none,media=cdrom"
                  ide2: "{{ _storage }}:cloudinit"
                  boot: "order=scsi0"
                status_code: [200]
              when: not ansible_check_mode

            - name: "Guard template VMID before Windows template conversion"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Convert the Windows VM to a template"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/template"
                method: POST
                status_code: [200]
              when: not ansible_check_mode

            - name: "Windows template creation complete"
              ansible.builtin.debug:
                msg: "Template {{ _vmid }} ({{ _name }}) created on {{ _node }}. Storage: {{ _storage }}, Disk: {{ _disk }}."
          # The seed ISO holds the one-time password, so it is removed whether the build passed or
          # failed. Only the exact volid this run uploaded, on the storage it went to (L-008).
          always:
            # First, so a failed remote step below cannot leave the password-bearing ISO on the
            # controller.
            - name: "Remove the local seed directory"
              ansible.builtin.file:
                path: "{{ _win_seed_tmp.path }}"
                state: absent
              when: _win_seed_tmp.path is defined

            - name: "Guard template VMID before detaching the seed ISO"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Detach the seed ISO so its volume can be deleted"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/config"
                method: PUT
                body_format: form-urlencoded
                body:
                  ide3: "none,media=cdrom"
                status_code: [200]
              failed_when: false
              when:
                - not ansible_check_mode
                - _win_create.json.data is defined

            - name: "Guard template VMID before deleting the seed ISO"
              ansible.builtin.include_tasks: tasks/guard-o11y-restore-target.yml
              vars:
                _o11y_restore_target_guard_candidates: ["{{ _vmid }}"]
              tags: [always]

            - name: "Delete the uploaded seed ISO"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/{{ _win_seed_storage | urlencode }}/content/{{ _win_seed_volid | urlencode }}?delay=30"
                method: DELETE
                timeout: 60
                status_code: [200]
              # The read-back below decides: a refused delete must not skip it.
              failed_when: false
              when:
                - not ansible_check_mode
                - _win_upload is defined and _win_upload is not skipped

            - name: "Read back the seed storage content"
              ansible.builtin.uri:
                url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/{{ _win_seed_storage }}/content"
                method: GET
              register: _win_seed_content
              when:
                - not ansible_check_mode
                - _win_upload is defined and _win_upload is not skipped

            - name: "Require the seed ISO to be gone"
              ansible.builtin.assert:
                that: _win_seed_volid not in (_win_seed_content.json.data | default([], true) | map(attribute='volid') | list)
                fail_msg: "seed ISO {{ _win_seed_volid }} is still on storage {{ _win_seed_storage }}"
              when:
                - not ansible_check_mode
                - _win_upload is defined and _win_upload is not skipped

      rescue:
        - name: "Remember why the template step failed"
          ansible.builtin.set_fact:
            _tmpl_hard_error: >-
              {{ ansible_failed_task.name | default('a task') }}:
              {{ '(details hidden: the task is no_log)' if (ansible_failed_task.no_log | default(false) | bool)
                 else (ansible_failed_result.msg | default('failed')) }}

    # Read back, never assume: the step's criteria are a template at the declared vmid on the
    # declared node, carrying a cloud-init drive (registry step vm-template).
    - name: "Read back the template for the step result"
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/qemu/{{ _vmid }}/config"
        method: GET
      register: _tmpl_after
      failed_when: false
      changed_when: false
      check_mode: false
      # A refused or unresolved connection sends nothing; the step records the refusal.
      when: (_pve_token_id | default('') | length > 0) and (_pve_host | default('') | length > 0)

    # The cloud-init drive may sit on any drive key. This playbook builds with ide2 = "<storage>:cloudinit"
    # (the post-install PUT above), but an adopted template can be built by other code (live template
    # 9000 carries it on ide0, Semaphore task 3287) and still clone and cloud-init correctly, and the
    # registry criterion ("a cloud-init drive is attached to the template") names no key. The check
    # still matches a DRIVE key holding a volume named "...-cloudinit", not any value mentioning
    # cloudinit, so unrelated metadata (a description, a tag) cannot pass as the drive (PR 416 review).
    - name: "Decide the template step"
      ansible.builtin.set_fact:
        _tmpl_errors: >-
          {{ ([_tmpl_hard_error] if _tmpl_hard_error is defined else [])
             + ([] if (_tmpl_after.status | default(-1)) == 200
                   and ((_tmpl_after.json.data | default({}, true)).template | default(0) | int == 1)
                else ['vmid ' ~ _vmid ~ ' on ' ~ _node ~ ' is not a template (HTTP '
                      ~ (_tmpl_after.status | default('none')) ~ ')'])
             + ([] if _tmpl_ci_keys | length > 0
                else ['template ' ~ _vmid ~ ' has no cloud-init drive (no cloudinit volume on any drive key)']) }}
        # The drive key(s) that carry it, as step evidence (key names only, never a value).
        _tmpl_cloudinit_drive: "{{ _tmpl_ci_keys | join(',') }}"
        # A dry run against a node with no template yet would create one; nothing to prove.
        _tmpl_dry_absent: >-
          {{ ansible_check_mode and not (_tmpl_present | default(false) | bool)
             and _tmpl_hard_error is not defined }}
      vars:
        _tmpl_ci_volume: '^[^,=]+:([^,=]*-)?cloudinit(,|$)'
        # `default({}, true)`: Proxmox can answer 200 with "data": null, which a plain default
        # keeps, and dict2items on null would fail before the step result is recorded.
        # The drive keys that hold a cloud-init volume. Key names only: no other config value is
        # reported or recorded.
        _tmpl_ci_keys: >-
          {{ (_tmpl_after.json.data | default({}, true)) | dict2items
             | selectattr('key', 'match', '^(ide|sata|scsi|virtio)[0-9]+$')
             | selectattr('value', 'string')
             | selectattr('value', 'search', _tmpl_ci_volume)
             | map(attribute='key') | sort | list }}

    - name: "Record the step result"
      ansible.builtin.include_tasks: tasks/emit-step-result.yml
      vars:
        step_result_service: "{{ target_service | default('') }}"
        step_result_step: vm-template
        step_result_status: >-
          {{ 'skip' if (_tmpl_dry_absent | bool)
             else ('pass' if (_tmpl_errors | length == 0) else 'fail') }}
        step_result_evidence:
          template_vmid: "{{ _vmid | int }}"
          node: "{{ _node }}"
          cloudinit_drive: "{{ _tmpl_cloudinit_drive }}"
        step_result_error: "{{ _tmpl_errors | join('; ') }}"

    - name: "Fail when the template step did not pass"
      ansible.builtin.fail:
        msg: "{{ _tmpl_errors | join('; ') }}"
      when:
        - not (_tmpl_dry_absent | bool)
        - _tmpl_errors | length > 0

  handlers:
    - name: "Show seed ISO build output"
      ansible.builtin.debug:
        var: _seed_build.stdout_lines

- name: "Post-validate: Template exists and is ready"
  ansible.builtin.import_playbook: proxmox-validate.yml
  vars:
    _extra_var_guard_nested: true
