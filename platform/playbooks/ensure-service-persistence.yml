---
# ensure-service-persistence.yml — make a service's containers start at boot.
#
# The SETUP half of workflow step systemd-enablement; verify-service-persistence.yml is the
# read-only check that records the step. It changes host boot settings only and restarts
# nothing, so it is safe on a running service, the orchestrator's own host included:
#
#   rootless podman   linger for the service account plus podman's USER boot unit
#                     (tasks/enable-linger.yml, the same task every composable deploy runs)
#   rootful podman    the SYSTEM podman-restart.service enabled
#   docker            docker.service enabled (Docker restarts `always` containers itself)
#
# podman-restart.service starts only `restart: always` containers. A ROOTFUL podman container on
# another policy (a legacy compose file's drift; the repo's compose declares `always`,
# test_restart_policy.bats) gets its own boot unit instead: `podman generate systemd --name`,
# without --new, runs `podman start` on the EXISTING container. It is installed and enabled,
# never started, so the running container is not touched, which matters on the orchestrator's
# own host. Changing the policy in place needs `podman update --restart`, which the Ubuntu
# 24.04 podman (4.9.3) does not have (PR 284 CI). `podman generate systemd` is deprecated in
# favour of Quadlet; moving these services to the composable layout is the real fix.
# A ROOTLESS container on another policy is refused by name: its deploy sets `always`.
# `no` is left alone (a one-shot init container; verify-service-persistence.yml judges it).
#
# Idempotent and check-mode safe (--check reports what would change, writes nothing).
#
# Usage (Semaphore): -e target_service=tududi_svc

- name: "Ensure the service starts at boot: {{ target_service | default('(unset)') }}"
  hosts: "{{ target_service | default('ungrouped') }}"
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    _local: "{{ local_mode | default(false) | bool }}"
    _rootful: "{{ podman_rootful | default(false) | bool }}"

  tasks:
    - name: "Rootless podman: linger and the user boot unit"
      ansible.builtin.include_tasks: tasks/enable-linger.yml
      when:
        - _engine == 'podman'
        - not _rootful

    - name: "Rootful podman: the system boot unit"
      ansible.builtin.systemd_service:
        name: podman-restart.service
        enabled: true
      become: true
      when:
        - _engine == 'podman'
        - _rootful
        - not _local

    - name: "Docker: the engine starts at boot"
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
      become: true
      when:
        - _engine == 'docker'
        - not _local

    - name: "Podman: list the service's containers"
      ansible.builtin.include_tasks: tasks/list-service-containers.yml
      vars:
        _lsc_fields: [Names]
        _lsc_all: true
      when: _engine == 'podman'

    - name: "Podman: refuse to report convergence from a failed listing"
      # list-service-containers never fails the play; an engine error would otherwise read as
      # "nothing to change" (PR 284 review).
      ansible.builtin.assert:
        that: _lsc.rc == 0
        fail_msg: "listing {{ _deploy_dir }}'s containers failed: {{ _lsc.stderr | default('') }}"
      when: _engine == 'podman'

    - name: "Podman: read each container's restart policy"
      ansible.builtin.command:
        argv: ["podman", "inspect", "--format", "{{ '{{' }}.HostConfig.RestartPolicy.Name{{ '}}' }}", "{{ item }}"]
      loop: "{{ _lsc.stdout_lines | default([]) if _engine == 'podman' else [] }}"
      become: "{{ _rootful }}"
      register: _ensure_policies
      changed_when: false
      check_mode: false

    - name: "Podman: the containers a boot unit would not start"
      ansible.builtin.set_fact:
        _needs_unit: >-
          {{ _ensure_policies.results | default([]) | rejectattr('skipped', 'defined')
             | rejectattr('stdout', 'in', ['always', 'no']) | map(attribute='item') | list }}

    - name: "Rootless podman: refuse a container not on restart always"
      ansible.builtin.assert:
        that: _needs_unit | length == 0
        fail_msg: >-
          not on restart: always, so podman's boot unit will not start them: {{ _needs_unit | join(', ') }}.
          Redeploy the service; its compose declares always.
      when:
        - _engine == 'podman'
        - not _rootful

    - name: "Rootful podman: generate a boot unit for each such container"
      ansible.builtin.command:
        argv: [podman, generate, systemd, --name, --no-header, --restart-policy, always, "{{ item }}"]
      loop: "{{ _needs_unit if _rootful else [] }}"
      become: true
      register: _units
      changed_when: false
      check_mode: false

    - name: "Rootful podman: the generated unit starts that existing container"
      ansible.builtin.assert:
        that:
          - "'[Unit]' in _units.results[_i].stdout"
          - "('podman start ' ~ item) in _units.results[_i].stdout"
        fail_msg: "podman generate systemd did not produce a start unit for {{ item }}"
      loop: "{{ _needs_unit if _rootful else [] }}"
      loop_control:
        index_var: _i

    - name: "Rootful podman: install the unit"
      ansible.builtin.copy:
        # From [Unit]: anything podman prints before it (a deprecation notice) is not unit text.
        content: "{{ _units.results[_i].stdout[_units.results[_i].stdout.find('[Unit]') :] }}\n"
        dest: "/etc/systemd/system/container-{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ _needs_unit if _rootful else [] }}"
      loop_control:
        index_var: _i
      become: true

    - name: "Rootful podman: enable the unit at boot (not started now)"
      ansible.builtin.systemd_service:
        name: "container-{{ item }}.service"
        enabled: true
        daemon_reload: true
      loop: "{{ _needs_unit if _rootful else [] }}"
      become: true
      # Under --check the unit file was not written, so there is nothing to enable yet.
      when: not ansible_check_mode

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ _engine }}{{ ' (rootful)' if _rootful else (' (rootless)' if _engine == 'podman' else '') }}
          boot start {{ 'would be ' if ansible_check_mode else '' }}ensured; own boot unit
          {{ 'would be ' if ansible_check_mode else '' }}installed for:
          {{ (_needs_unit | default([]) if _rootful else []) or 'none' }}. Check it with Verify Service Persistence.
