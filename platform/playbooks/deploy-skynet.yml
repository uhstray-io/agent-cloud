---
# deploy-skynet.yml — skynet orchestration API deploy (composable).
#
# Phase 1: Refuse invalid inputs before anything changes; place repo + manage-secrets
#          (api_token, db_password and read_token generated once into OpenBao, reused
#          thereafter; semaphore_api_token is the svc-skynet account's token, read and
#          never generated; the agentgateway role keys shared-read, because the gateway
#          enrolls them for skynet's agents); template .env; distribute the trust bundle the
#          overlay names (local: step-ca root; production: root + intermediate + this VM's public
#          roots, because SSL_CERT_FILE replaces the whole trust store).
# Phase 2: registry login (GHCR package is private) + image pre-flight + deploy.sh
#          (container lifecycle only).
# Phase 3: Verify inside the skynet container: /skynet/healthz answers 200, an
#          authenticated run request is accepted (400 for the verify graph name,
#          which no graph carries), and the same request without a token is 401.
#          The read token lists runs (200) and cannot start one (401).
#
# skynet is a two-container rootless-podman stack (skynet API on the CI-built GHCR
# image pinned by digest, and its own Postgres). The API listens on 8080 inside the
# container and is published on skynet_publish_bind:skynet_publish_port (default
# 127.0.0.1:8380). Production declares the VM's LAN address in inventory; the firewall
# declaration must admit only the Dispatch Console VM and the gateway VM. The gateway's
# /skynet/ route (agentgateway task 3.3) reads secret/services/skynet:api_token through a
# shared read and is NOT enabled by this deploy; it stays off until this deploy has run once.
#
# Deploy order on a host: Provision skynet Semaphore Access (once, writes the token this
# deploy reads) -> agentgateway (route off) -> skynet -> agentgateway (route on, later).
#
# Plan: OpenSpec change service-deployment-workflow, task 3.7
# (plan/development/openspec/changes/service-deployment-workflow/tasks.md); design in
# plan/development/15-service-deployment-workflow-agents.md.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# A play over no hosts exits 0 and records a deploy that did nothing as a success
# (docs/MISTAKES.md 2.21), so refuse an absent or empty group first.
- name: "Pre-flight: skynet_svc is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: skynet_svc
    # Paired so one `-e preflight_group=` cannot redirect the guard (MISTAKES 2.21).
    preflight_group_expected: skynet_svc

# ── Phase 1: Refuse invalid inputs, place repo + secrets + env ──────────────
- name: "Phase 1: Place repo + manage skynet secrets"
  hosts: skynet_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    # place-monorepo.yml asserts _branch is defined outside local_mode (:23-29). Production clones
    # service_branch (the (Dev) template's generator default is dev; the base template defaults to main).
    _branch: "{{ service_branch | default('main') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # The generated secrets must be STABLE across redeploys: a new api_token would break the
    # gateway's /skynet/ route until its backend token is re-read, a new db_password would lock
    # skynet out of the existing Postgres volume, and a new read_token would break the Dispatch
    # Console's read path (it shared-reads secret/services/skynet:read_token). manage-secrets
    # generates each once into OpenBao and reuses it on later runs.
    # semaphore_api_token is type existing: NEVER generated. It is the token of the svc-skynet
    # account (project role guest, read-only, interim since 2026-10-31; launch rights return only
    # through the planned narrow launcher), written to secret/services/skynet by
    # "Provision skynet Semaphore Access", which must run first. _required_existing_secrets stops
    # the run before any OpenBao write when it is absent; the monorepo is already placed by then
    # (manage-secrets runs after place-monorepo), which is harmless and re-run safe.
    _secret_definitions:
      - { name: api_token, type: random, length: 48 }
      - { name: db_password, type: random, length: 32 }
      - { name: read_token, type: random, length: 48 }
      - { name: semaphore_api_token, type: existing }
    _required_existing_secrets: [semaphore_api_token]
    # The agentgateway owns one client_<role> key per skynet role identity (declared in
    # its agw_clients). Read-only: skynet presents these to the gateway, never stores
    # them back under secret/services/skynet. Every key must exist, or manage-secrets
    # stops by name; the gateway deploy that enrolls the roles has to run first.
    _shared_reads:
      - from_service: agentgateway
        read_keys:
          - client_infra-agent
          - client_security-agent
          - client_o11y-agent
          - client_service-agent
          - client_network-agent
          - client_skynet-eval
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }

  tasks:
    # Read-only check of the credential path before anything is written: a refused
    # run must not have already placed the repo or written a secret.
    - name: "Transport guard: the OpenBao endpoint must not be cleartext public"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    # Inputs are refused BEFORE the repo is placed or any OpenBao write happens. Each
    # refusal names its variable and the fix, so a bad inventory reads as a bad input,
    # not as a failed deploy.
    - name: "Refuse skynet_image unless it is a digest-pinned skynet-tier2 reference"
      ansible.builtin.assert:
        that:
          - (skynet_image | default('', true) | string) is match('^ghcr[.]io/uhstray-io/skynet-tier2@sha256:[0-9a-f]{64}$')
        fail_msg: >-
          skynet_image must be a digest-pinned reference of the form
          ghcr.io/uhstray-io/skynet-tier2@sha256:<64 lowercase hex>, the digest skynet CI
          publishes. A tag drifts and is refused. Set it in the inventory and re-run.

    - name: "Refuse skynet_gateway_url unless it is https"
      ansible.builtin.assert:
        that:
          - (skynet_gateway_url | default('', true) | string) is match('^https://')
        fail_msg: "skynet_gateway_url must be an https:// URL (the public inference edge). Set it in the inventory and re-run."

    - name: "Refuse skynet_opa_url unless it is https"
      ansible.builtin.assert:
        that:
          - (skynet_opa_url | default('', true) | string) is match('^https://')
        fail_msg: "skynet_opa_url must be an https:// URL (the OPA decision API, which skynet calls over TLS). Set it in the inventory and re-run."

    - name: "Refuse skynet_semaphore_url unless it is https"
      ansible.builtin.assert:
        that:
          - (skynet_semaphore_url | default('', true) | string) is match('^https://')
        fail_msg: "skynet_semaphore_url must be an https:// URL (the Semaphore API skynet dispatches to). Set it in the inventory and re-run."

    - name: "Refuse skynet_semaphore_catalog outside production and local"
      ansible.builtin.assert:
        that:
          - (skynet_semaphore_catalog | default('', true) | string) in ['production', 'local']
        fail_msg: "skynet_semaphore_catalog must be 'production' or 'local'. Set it in the inventory and re-run."

    - name: "Refuse skynet_semaphore_project unless it is a positive integer id"
      ansible.builtin.assert:
        that:
          - (skynet_semaphore_project | default('', true) | string) is match('^[1-9][0-9]*$')
        fail_msg: >-
          skynet_semaphore_project must be the integer id of the agent-cloud project in
          Semaphore (a positive whole number, not a name or a boolean). Set it in the
          inventory and re-run.

    - name: "Refuse an empty skynet_model"
      ansible.builtin.assert:
        that:
          - (skynet_model | default('', true) | string | trim | length) > 0
        fail_msg: "Declare skynet_model (the model skynet's graph requests through the gateway) in inventory."

    # Optional: unset, the compose defaults apply (127.0.0.1:8380). A declared value is checked
    # here, before anything changes. 0.0.0.0 is refused: the API must not listen on every interface. Octets with a
    # leading zero are refused too: podman rejects them, so 00.0.0.0 would fail at compose up.
    - name: "Refuse skynet_publish_bind unless it is one non-wildcard IPv4 address"
      ansible.builtin.assert:
        that:
          - (skynet_publish_bind | string) is match('^(?!0[.]0[.]0[.]0$)((0|[1-9][0-9]{0,2})[.]){3}(0|[1-9][0-9]{0,2})$')
          - ((skynet_publish_bind | string).split('.') | map('int') | max) <= 255
        fail_msg: >-
          skynet_publish_bind must be one IPv4 address to publish the skynet API on: the VM's own
          LAN address in production, 127.0.0.1 for loopback. 0.0.0.0 is refused. Set it in the
          inventory and re-run.
      when: skynet_publish_bind is defined

    # Production publishes for the Dispatch Console on another VM, so the loopback default would
    # leave the API unreachable while every probe here (inside the container) still passes.
    - name: "Refuse a production run whose skynet_publish_bind is unset or loopback"
      ansible.builtin.assert:
        that:
          - skynet_publish_bind is defined
          - not ((skynet_publish_bind | string) is match('^127[.]'))
        fail_msg: >-
          Production skynet must publish on the VM's own LAN address so the Dispatch Console can reach
          it: declare skynet_publish_bind (not a 127.x address) in the inventory and re-run.
      when: not (local_mode | default(false) | bool)

    - name: "Refuse skynet_publish_port unless it is a whole port number from 1024 to 65535"
      ansible.builtin.assert:
        that:
          - (skynet_publish_port | string) is match('^[0-9]{4,5}$')
          - (skynet_publish_port | string | int) >= 1024
          - (skynet_publish_port | string | int) <= 65535
        fail_msg: >-
          skynet_publish_port must be a whole port number from 1024 to 65535 (the host port the
          skynet API is published on; 8380 by default). Set it in the inventory and re-run.
      when: skynet_publish_port is defined

    # Production only. skynet reaches OPA over https with an internal-CA leaf for a name that has no
    # production DNS record, so compose.prod.yml maps that name to the declared address, and the CA
    # root is read from the step_ca_svc host. Both are checked before anything changes.
    - name: "Refuse a production run without a step_ca_svc host to read the CA root from"
      ansible.builtin.assert:
        that:
          - (groups['step_ca_svc'] | default([]) | length) > 0
        fail_msg: >-
          Production skynet reads the step-ca root and intermediate from the step_ca_svc group, and that
          group is empty. Declare the CA host in the inventory and re-run.
      when: not (local_mode | default(false) | bool)

    - name: "Refuse skynet_opa_ip unless it is one non-wildcard IPv4 address in production"
      ansible.builtin.assert:
        that:
          - (skynet_opa_ip | default('', true) | string) is match('^(?!0[.]0[.]0[.]0$)((0|[1-9][0-9]{0,2})[.]){3}(0|[1-9][0-9]{0,2})$')
          - ((skynet_opa_ip | default('', true) | string).split('.') | map('int') | max) <= 255
        fail_msg: >-
          skynet_opa_ip must be the IPv4 address of the OPA host. The production OPA name has no DNS
          record, so the container maps that name to this address. 0.0.0.0 is refused. Set it in the
          inventory and re-run.
      when: not (local_mode | default(false) | bool)

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Manage secrets and template env file"
      ansible.builtin.include_tasks: tasks/manage-secrets.yml

    # Local: skynet's calls to the local OPA, Semaphore and gateway run over https with step-ca
    # leaves. Distribute the step-ca root and intermediate into ./certs; compose.local.yml mounts it
    # and sets SSL_CERT_FILE. Every local endpoint is a step-ca leaf, so no public roots are needed.
    - name: "Distribute the step-ca root for internal TLS trust (local)"
      ansible.builtin.include_tasks: tasks/distribute-ca-root.yml
      vars:
        _ca_root_dest_dir: "{{ _deploy_dir }}"
        _ca_engine: "{{ container_engine | default('podman') }}"
      when: local_mode | default(false) | bool

    # Production: OPA's leaf is signed by the internal CA, and SSL_CERT_FILE (compose.prod.yml)
    # replaces the whole trust store. The bundle therefore carries the CA root and intermediate AND
    # this VM's public roots (the gateway and Semaphore are public-chain hosts). The root is read from
    # the step_ca_svc host's container, and the bundle lands in ./certs, which compose.prod.yml mounts.
    - name: "Distribute the step-ca root and the public roots for internal TLS trust (production)"
      ansible.builtin.include_tasks: tasks/distribute-ca-root.yml
      vars:
        _ca_root_dest_dir: "{{ _deploy_dir }}"
        _ca_host: "{{ groups['step_ca_svc'] | first }}"
        _ca_root_combined_dest: "{{ _deploy_dir ~ '/certs/ca-bundle-combined.crt' }}"
      when: not (local_mode | default(false) | bool)

    - name: "Create convenience symlink ~/skynet -> deploy dir"
      # Points ~/skynet at the deployment dir in the composable monorepo clone.
      ansible.builtin.file:
        src: "{{ _deploy_dir }}"
        dest: "{{ local_home_dir | default('/home/' ~ (ansible_user | default('deploy')), true) }}/{{ service_name }}"
        state: link
        force: true
      register: _symlink_result
      # Best-effort: tolerate a permission-denied home, surface any other failure.
      failed_when: >-
        _symlink_result is failed
        and 'permission denied' not in (_symlink_result.msg | default('') | lower)

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start skynet"
  hosts: skynet_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _engine: "{{ container_engine | default('podman') }}"
    # Same resolution as Phase 1, so the guard checks the endpoint the play actually uses.
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"

  tasks:
    - name: "Transport guard: the OpenBao endpoint must not be cleartext public"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    # The GHCR package is PRIVATE, in local mode too: a fresh VM cannot pull the digest
    # anonymously. Log the deploy user's podman into ghcr.io first (PAT from OpenBao
    # secret/services/github, read:packages).
    - name: "Registry login for the private GHCR image"
      ansible.builtin.include_tasks: tasks/registry-login.yml

    # Pre-flight: the skynet image is a CI-published private digest that nothing builds on
    # the VM, so it must be obtainable before deploy.sh runs. The pull warms the same
    # cache deploy.sh reuses (idempotent). A failed pull is tolerated only when the digest
    # is already in the local image store. Skipped under --check: a pull is a change.
    - name: "Pre-flight: pull the pinned skynet image"
      ansible.builtin.command: "{{ _engine }} pull {{ skynet_image }}"
      register: _skynet_pull
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: "Pre-flight: fall back to the local image store when the pull failed"
      ansible.builtin.command: "{{ _engine }} image exists {{ skynet_image }}"
      register: _skynet_local_img
      changed_when: false
      failed_when: false
      when:
        - not ansible_check_mode
        - _skynet_pull.rc | default(1) != 0
      check_mode: false

    - name: "Pre-flight: require the pinned skynet image before deploying"
      ansible.builtin.assert:
        that:
          - (_skynet_pull.rc | default(1)) == 0 or (_skynet_local_img.rc | default(1)) == 0
        fail_msg: >-
          skynet image {{ skynet_image }} is not pullable from GHCR and is not in the local
          image store. Publish it first (the skynet CI image build), confirm this host can
          pull from ghcr.io with the PAT in secret/services/github, then re-run this deploy.
        success_msg: "skynet image {{ skynet_image }} is available — proceeding."
      when: not ansible_check_mode

    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        # Force the compose provider on the Mac-direct genesis path; empty on the
        # Semaphore path (detect_runtime derives it). NOT default(omit) — omit
        # leaks its placeholder into environment (rc 127).
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
        # Operator lever (survey `deploy_force_recreate`, only the literal true): recreate even when every input
        # and image matches — clears a stale bind mount a running container still holds.
        FORCE_RECREATE: "{{ 'true' if ((deploy_force_recreate | default('false') | string | lower) == 'true') else '' }}"
      register: _deploy
      # deploy.sh recreates only when its inputs or images changed (common.sh
      # compose_up_if_changed) and says which on its own line.
      changed_when: "'DEPLOY_CHANGED=true' in _deploy.stdout_lines"
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
- name: "Phase 3: Verify skynet"
  hosts: skynet_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    # Every check runs INSIDE the container, so it never depends on a published port or
    # on Caddy. The bearer token is read from the container's own environment by the
    # probe script; it never appears in argv, the task output, or this file.
    - name: "Container health (GET /skynet/healthz -> 200, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import urllib.request
            print(urllib.request.urlopen('http://127.0.0.1:8080/skynet/healthz', timeout=5).status)
      register: _skynet_health
      changed_when: false
      retries: 10
      delay: 6
      until: _skynet_health.rc == 0
      check_mode: false

    - name: "Assert healthz answered 200"
      ansible.builtin.assert:
        that:
          - _skynet_health.stdout | trim == '200'
        fail_msg: "skynet /skynet/healthz did not answer 200 (got {{ _skynet_health.stdout | trim }})."

    # The authenticated probe POSTs a run for a graph that does not exist. A 400 proves
    # the server is up AND the bearer was accepted, because auth is checked before the
    # graph is looked up. Anything else (401 = token rejected, 404/5xx = wrong route or
    # broken server) fails the deploy.
    - name: "Authenticated run request is accepted (POST /skynet/runs -> 400, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import os
            import urllib.error
            import urllib.request
            request = urllib.request.Request(
                'http://127.0.0.1:8080/skynet/runs',
                data=b'{"graph": "__agent_cloud_verify__", "input": {}}',
                headers={'Authorization': 'Bearer ' + os.environ['SKYNET_API_TOKEN'], 'Content-Type': 'application/json'},
                method='POST',
            )
            try:
                print(urllib.request.urlopen(request, timeout=10).status)
            except urllib.error.HTTPError as error:
                print(error.code)
      register: _skynet_authed
      changed_when: false
      check_mode: false

    - name: "Assert the authenticated run request got 400 (auth accepted, unknown graph)"
      ansible.builtin.assert:
        that:
          - _skynet_authed.stdout | trim == '400'
        fail_msg: >-
          skynet authenticated POST /skynet/runs answered {{ _skynet_authed.stdout | trim }}, not 400.
          401 means the bearer was rejected (api_token and the container's SKYNET_API_TOKEN disagree);
          anything else means the route or the server is wrong.

    # The same request with no Authorization header must be refused before anything else.
    - name: "Unauthenticated run request is refused (POST /skynet/runs -> 401, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import urllib.error
            import urllib.request
            request = urllib.request.Request(
                'http://127.0.0.1:8080/skynet/runs',
                data=b'{"graph": "__agent_cloud_verify__", "input": {}}',
                headers={'Content-Type': 'application/json'},
                method='POST',
            )
            try:
                print(urllib.request.urlopen(request, timeout=10).status)
            except urllib.error.HTTPError as error:
                print(error.code)
      register: _skynet_unauthed
      changed_when: false
      check_mode: false

    - name: "Assert the unauthenticated run request got 401"
      ansible.builtin.assert:
        that:
          - _skynet_unauthed.stdout | trim == '401'
        fail_msg: >-
          skynet unauthenticated POST /skynet/runs answered {{ _skynet_unauthed.stdout | trim }}, not 401.
          The run endpoint is reachable without a bearer token.

    # The read token (SKYNET_READ_TOKEN, the Dispatch Console's bearer) reads run state and must
    # never start a run. Both probes run inside the container with the token from its environment.
    - name: "Read token lists runs (GET /skynet/runs -> 200, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import os
            import urllib.error
            import urllib.request
            request = urllib.request.Request(
                'http://127.0.0.1:8080/skynet/runs',
                headers={'Authorization': 'Bearer ' + os.environ['SKYNET_READ_TOKEN']},
                method='GET',
            )
            try:
                print(urllib.request.urlopen(request, timeout=10).status)
            except urllib.error.HTTPError as error:
                print(error.code)
      register: _skynet_read_list
      changed_when: false
      check_mode: false

    - name: "Assert the read token lists runs (200)"
      ansible.builtin.assert:
        that:
          - _skynet_read_list.stdout | trim == '200'
        fail_msg: >-
          skynet GET /skynet/runs with the read token answered {{ _skynet_read_list.stdout | trim }}, not 200.
          401 means SKYNET_READ_TOKEN is not accepted (read_token and the container's value disagree, or
          the image predates the read token); anything else means the route or the server is wrong.

    - name: "Read token cannot start a run (POST /skynet/runs -> 401, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import os
            import urllib.error
            import urllib.request
            request = urllib.request.Request(
                'http://127.0.0.1:8080/skynet/runs',
                data=b'{"graph": "__agent_cloud_verify__", "input": {}}',
                headers={'Authorization': 'Bearer ' + os.environ['SKYNET_READ_TOKEN'], 'Content-Type': 'application/json'},
                method='POST',
            )
            try:
                print(urllib.request.urlopen(request, timeout=10).status)
            except urllib.error.HTTPError as error:
                print(error.code)
      register: _skynet_read_post
      changed_when: false
      check_mode: false

    - name: "Assert the read token is refused on POST /skynet/runs (401)"
      ansible.builtin.assert:
        that:
          - _skynet_read_post.stdout | trim == '401'
        fail_msg: >-
          skynet POST /skynet/runs with the READ token answered {{ _skynet_read_post.stdout | trim }}, not 401.
          Anything but 401 means the read-only bearer can start runs. Stop and fix the server before use.

    # skynet gates every action on OPA, so the deploy proves skynet's OWN client gets a decision back:
    # skynet.policy.opa.OPAClient against SKYNET_OPA_URL, inside the container, through whatever the
    # container trusts and resolves (production: the combined bundle and the OPA name mapping in
    # compose.prod.yml). The input names a service and action no policy knows, so OPA's default deny
    # (agent_actions.rego: default allow := false) must answer deny. An allow means the policy failed
    # open; an exception means TLS, name resolution, the firewall or the decision contract is broken.
    # OPA decisions are pure: this changes nothing.
    - name: "OPA decision through skynet's own client (default deny, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import os
            from skynet.policy.opa import DecisionInput, OPAClient
            with OPAClient(os.environ['SKYNET_OPA_URL'], timeout=10.0) as client:
                decision = client.decide(DecisionInput(agent='skynet', service='__agent_cloud_verify__', action='verify'))
            print('decision=' + ('allow' if decision.allowed else 'deny'))
      register: _skynet_opa
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Assert skynet reached OPA and was denied by default"
      ansible.builtin.assert:
        that:
          - _skynet_opa.rc == 0
          - (_skynet_opa.stdout_lines | last | default('')) == 'decision=deny'
        fail_msg: >-
          skynet's OPA client did not get the expected default deny (rc {{ _skynet_opa.rc }}, last line
          '{{ _skynet_opa.stdout_lines | last | default('') }}'; error tail:
          {{ (_skynet_opa.stderr_lines | default([]))[-3:] | join(' | ') }}). decision=allow means the OPA
          policy failed open. A failure names the cause: certificate verify failed (the trust bundle),
          name resolution (the OPA host mapping), a refused or timed-out connection (OPA's firewall
          admits skynet_svc), or OPAContractError (the decision path or rule).

    # OPA's authorization policy admits skynet's decision and health calls and nothing else. skynet
    # gets the same transport as its decision probe above (urllib, the container's trust store) and
    # asks for a write to a path no policy reads. OPA must refuse it with 401; anything else means
    # the authorization policy is missing or admits writes. The probe path is outside every package,
    # so a write that got through changes no decision.
    - name: "Skynet cannot write to OPA (PUT /v1/data -> 401, inside the container)"
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - skynet
          - python
          - -c
          - |
            import os
            import urllib.error
            import urllib.request
            request = urllib.request.Request(
                os.environ['SKYNET_OPA_URL'] + '/v1/data/agentcloud_write_probe',
                data=b'{}',
                headers={'Content-Type': 'application/json'},
                method='PUT',
            )
            try:
                print(urllib.request.urlopen(request, timeout=10).status)
            except urllib.error.HTTPError as error:
                print(error.code)
      register: _skynet_opa_write
      changed_when: false
      check_mode: false

    - name: "Assert skynet's OPA write was refused (401)"
      ansible.builtin.assert:
        that:
          - _skynet_opa_write.stdout | trim == '401'
        fail_msg: >-
          skynet's PUT to OPA /v1/data answered {{ _skynet_opa_write.stdout | trim }}, not 401. 200
          means OPA accepted a write from skynet; 400 means the authorization policy is not loaded
          (the bundle refused it instead); anything else means the path or the server is wrong.

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          skynet healthy — /skynet/healthz 200; run endpoint 400 with the api token and 401 without
          (inside the container, :8080); read token lists runs (200) and cannot start one (401);
          skynet's own OPA client got OPA's default deny over {{ skynet_opa_url | default('its OPA URL') }},
          and OPA refused skynet's write to /v1/data (401).
          Published on skynet_publish_bind:skynet_publish_port; the gateway's /skynet/ route is separate.

    # Last: every verify task above passed (a failure stops the play before this records).
    - name: "Record the service-deploy step result"
      ansible.builtin.include_tasks: tasks/emit-service-deploy-result.yml
      vars:
        service_deploy_result_var: _deploy
