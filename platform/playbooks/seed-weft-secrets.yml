---
# seed-weft-secrets.yml — put in OpenBao the credentials weft's pipeline needs that no deploy
# generates, and say which are still missing. Run once per installation, and again after a
# credential is revoked. Idempotent: a second run changes nothing.
#
#   secret/services/weft/discord:webhook_url
#       Made HERE: the platform's Discord bot (secret/services/discord:bot_token) reconciles ONE
#       bot-owned webhook named "weft deploys" in the declared channel (weft-dev), and its URL is
#       stored. Same mechanism as the o11y alert webhook (tasks/reconcile-discord-webhook.yml), so
#       nobody pastes a webhook URL into anything.
#   secret/services/weft/github:token
#       CHECKED here, never made: a GitHub token is minted by a person on GitHub, then stored with
#       Seed OpenBao Key (its value as the isolated BAO_VALUE input, never a survey variable).
#       Semaphore uses it to read weft's repository and to write deployment records.
#   secret/services/<root>/workspaces/<id>:<VAR>
#       CHECKED here, never made: each workspace's provider and forge keys, the variables its
#       weft_secret_env names, stored the same way. A generated model key is not a model key.
#
# The front door's signing key is NOT seeded: Deploy weft Front Door generates it once, so the key
# and the public half every workspace needs are always made together.
#
# Declared in site-config (group vars of the front door's group): weft_discord_guild_id and
# weft_discord_channel_id, the channel's numeric ids.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Seed weft's Discord webhook; check the rest"
  hosts: "{{ weft_door_hosts | default('weft_door') }}"
  gather_facts: false
  vars_files:
    - vars/weft.yml
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _workspace_hosts: "{{ groups[weft_workspace_hosts | default('weft_workspaces')] | default([]) }}"

  tasks:
    - name: "Require OpenBao and the declared channel"
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - _bao_url | length > 0
          - weft_discord_guild_id | default('') | string is match('^[0-9]{17,21}$')
          - weft_discord_channel_id | default('') | string is match('^[0-9]{17,21}$')
        fail_msg: >-
          Declare weft_discord_guild_id and weft_discord_channel_id (numeric ids) for the front
          door's group, and run this against exactly one front door host.

    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      changed_when: false
      check_mode: false
      delegate_to: localhost
      no_log: true

    - name: "Read the platform's Discord bot credential"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/discord"
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _discord_secret
      check_mode: false
      delegate_to: localhost
      no_log: true

    - name: "Reconcile the 'weft deploys' webhook in the declared channel"
      ansible.builtin.include_tasks: tasks/reconcile-discord-webhook.yml
      vars:
        _dw_bot_token: "{{ (_discord_secret.json | default({})).data.data.bot_token | default('') }}"
        _dw_guild_id: "{{ weft_discord_guild_id | string }}"
        _dw_channel_id: "{{ weft_discord_channel_id | string }}"
        _dw_name: weft deploys
      no_log: true

    - name: "Store the webhook URL in OpenBao"
      ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
      vars:
        _bm_url: "{{ _bao_url }}"
        _bm_token: "{{ _bao_auth.json.auth.client_token }}"
        _bm_path: services/weft/discord
        _bm_data:
          webhook_url: "{{ _dw_url }}"
      when: _dw_url is defined
      no_log: true

    - name: "Read the GitHub token's path"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/weft/github"
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _weft_github_secret
      check_mode: false
      delegate_to: localhost
      no_log: true

    - name: "Read each workspace's path"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/{{ hostvars[item].weft_secret_root | default('weft') }}/workspaces/{{ hostvars[item].weft_workspace_id }}"
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      loop: "{{ _workspace_hosts }}"
      register: _weft_workspace_secrets
      check_mode: false
      delegate_to: localhost
      no_log: true

    # Names only, computed in a no_log task, then printed from the clean result: a visible task
    # never loops over or prints the protected responses above.
    - name: "Work out which credentials are missing (names only)"
      ansible.builtin.set_fact:
        _weft_missing: >-
          {%- set missing = [] -%}
          {%- if _weft_github_secret.status != 200 or not (_weft_github_secret.json.data.data.token | default('')) -%}
          {%- set _ = missing.append('services/weft/github:token') -%}
          {%- endif -%}
          {%- for result in _weft_workspace_secrets.results | default([]) -%}
          {%- set host = _workspace_hosts[loop.index0] -%}
          {%- set have = (result.json | default({})).data.data | default({}) if result.status == 200 else {} -%}
          {%- for name in hostvars[host].weft_secret_env | default([]) if not (have[name] | default('')) -%}
          {%- set _ = missing.append('services/' ~ (hostvars[host].weft_secret_root | default('weft')) ~ '/workspaces/' ~ hostvars[host].weft_workspace_id ~ ':' ~ name) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ missing }}
      no_log: true

    - name: "Report (names only)"
      ansible.builtin.debug:
        msg: >-
          weft deploy webhook: {{ 'stored in OpenBao' if _dw_url is defined else 'not stored (check mode)' }}.
          {{ ('Still to seed with Seed OpenBao Key: ' ~ (_weft_missing | join(', ')) ~ '.')
             if _weft_missing | length > 0 else 'Every other credential weft needs is present.' }}
