---
# deploy-agentgateway.yml — the inference edge gateway (agentgateway) deploy
# (composable).
#
# Phase 1: Place repo + manage-secrets (the upstream vLLM key is `existing` —
#          seeded by a deliberate separate step, NEVER generated here; one
#          per-client key per inventory identity, generated once into OpenBao
#          and reused, rotated only by an explicit run) + render .env and
#          config.yaml (identities as sha256 hashes, no plaintext key).
# Phase 2: deploy.sh — container lifecycle using the images pulled before validation;
#          recreate ONLY when config.yaml, .env, the compose files in use, ./certs or
#          the image changed since the running gateway started — otherwise in-flight
#          streams are left alone; db healthy, ready.
# Phase 3: Verify — readiness answers, an unenrolled request is 401 at the gateway,
#          then the keyed round-trip as one enrolled identity: /v1/models lists every
#          model it may use and one chat completion comes back from the upstream. The
#          key travels as a `uri` header from the target, never on any process's argv.
#          With agw_mcp_enabled the verify also proves /mcp: keyless 401, an authenticated `initialize`
#          and a non-empty `tools/list`; with it false, that a keyed `initialize` is not an MCP reply.
#          Skipped under --check (nothing new to prove).
#
# Change: plan/development/openspec/changes/inference-gateway-agentgateway
# Design: identities/limits §4, no retry/timeouts §3, telemetry §6.
#
# Inventory (agentgateway_svc host):
#   agw_upstream_base_url  e.g. http://<head>:8000/v1 (prod) or
#                          http://host.containers.internal:1234/v1 (local LM Studio)
#   agw_models             [{name, upstream_model?}] one entry per served name
#   agw_clients            [names] one API-key identity each -> secret field client_<name>
#   agw_admin_identities_enabled (default false) gate for the personal identities below: off,
#                          agw_identities == agw_clients and the admin list is not read
#   platform_admins        (REQUIRED when the gate is on, else the deploy refuses: declare it for this
#                          host, the shared file's default is built from per-user vars that exist only on
#                          the Authentik host)
#   platform admin list    (read only when the gate is on: `_platform_admins` from
#                          vars/platform-admins.yml, the list the Authentik admin entries are rendered
#                          from) one personal identity per entry, service accounts included: its
#                          `agw_identity` if set, else its `username`. Merged with agw_clients into
#                          agw_identities (vars/secret-declarations/agentgateway.yml); a name in both
#                          is one identity (the same client_<name>), reported as an overlap
#   agw_client_policies    (optional) {name: {allowed_models: [...], tokens_per_hour: N}}
#                          rotate/revoke: manage-agentgateway-client-key.yml
#   legacy_shared_expires  (optional) ISO date ending the shared-key grace period: before it the
#                          shared vLLM key is enrolled as identity `legacy-shared` (budget from
#                          agw_client_policies.legacy-shared); on/after it the identity is dropped
#                          and the deploy fails until vllm_api_key is rotated. Absent = no identity
#   agw_rate_requests_per_minute_total  (optional) one global request bucket
#   agw_rate_tokens_per_hour             (optional) per-identity token budget (needs the db)
#   agw_upstream_requires_key            (default true) refuse a deploy with an empty vllm_api_key;
#                                        false makes the key optional (still sent when present)
#   agw_otlp_host          (optional) declared o11y Alloy OTLP host:port
#   agw_oidc_issuer / agw_ui_redirect_uri / agw_ui_admin_group  operator UI OIDC (defaults local)
#   agw_ui_enabled                       (default true) false = no UI listener, no OIDC, no Authentik read
#   agw_mcp_enabled                      (default false) serve MCP at /mcp on the default gateway (key-gated by the same
#                                        identities as /v1, minus legacy-shared and mcp-self) and render the loopback
#                                        gateway its target calls; false renders none of it and the verify asserts /mcp
#                                        is not served
#   agw_mcp_openapi_targets              (required when enabled) [{name, schema}]: each an OpenAPI target over this
#                                        gateway's own /v1, the schema a .json file in deployment/mcp-schemas/; nothing
#                                        else is accepted (_agw_mcp_problems)
#   agw_loopback_port                    (default 4002) the loopback gateway's port, never published

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# ── Pre-flight: refuse to "succeed" against a group the inventory lacks ──────
# Ansible treats a play whose hosts: matches nothing as a no-op and exits 0, so a
# missing group looks exactly like a deploy that worked (preflight-target-group.yml
# header; seen on this very playbook 2026-09-17: three "no hosts matched", task green,
# zero containers).
- name: "Pre-flight"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: agentgateway_svc
    preflight_group_expected: agentgateway_svc

# ── Phase 1: Place repo + secrets + rendered config ────────────────────────
- name: "Phase 1: Place repo + manage agentgateway secrets"
  hosts: agentgateway_svc
  gather_facts: false
  become: false
  vars_files:
    - vars/secret-declarations/agentgateway.yml
    - vars/agw-deploy-env.yml
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    # The shipped MCP target schemas, on the controller beside config.yaml.j2 (the template src's directory).
    _agw_mcp_schema_dir: "{{ playbook_dir ~ '/../services/' ~ service_name ~ '/deployment/mcp-schemas' }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _tls: "{{ agw_listener_tls | default(false) | bool }}"
    _server_leaf: "{{ agw_server_leaf | default('agw-server') }}"
    _verifier_leaf: "{{ agw_verifier_leaf | default('agw-verifier') }}"
    _allowlist: "{{ agw_client_cert_allowlist | default(['caddy']) }}"
    # config.yaml.previous (rollback) is kept only when the rendered config holds no raw key.
    _keep_previous: "{{ not ((agw_plaintext_keys | default(false) | bool) and (local_mode | default(false) | bool)) }}"
    # Shared-key grace period (gateway tasks 4.7, 5.1). legacy_shared_expires is an ISO date
    # (YYYY-MM-DD) in inventory; absent means no grace period is declared and no `legacy-shared`
    # identity is rendered. Today is the controller's UTC date; agw_today overrides it for tests
    # only. ISO dates compare correctly as strings.
    _legacy_expires: "{{ legacy_shared_expires | default('', true) | string }}"
    _agw_today: "{{ agw_today | default(now(utc=true).strftime('%Y-%m-%d')) | string }}"
    _legacy_shared_active: "{{ (_legacy_expires | length > 0) and (_agw_today < _legacy_expires) }}"
    _legacy_shared_retired: "{{ (_legacy_expires | length > 0) and (_agw_today >= _legacy_expires) }}"
    # The recorded fingerprint, from the store read manage-secrets already made (`_existing`). It is
    # deliberately NOT declared in _secret_definitions: manage-secrets writes every declared field
    # back, so an absent one would be stored as '' and an overlapping deploy could erase a recorded
    # fingerprint. Only tasks/agw-legacy-key-check.yml writes it.
    _legacy_fp_recorded: "{{ (_existing | default({})).legacy_shared_key_sha256 | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # The UI's OIDC client secret is owned by authentik (the IdP). Read-only, so the
    # gateway's clientSecret matches what agentgateway-oidc.yaml injected via !Env.
    # Skipped with agw_ui_enabled: false, so /v1 deploys before that client exists.
    _shared_reads: >-
      {{ [{'from_service': 'authentik', 'read_keys': ['agentgateway_oidc_client_secret']}]
         if (agw_ui_enabled | default(true) | bool) else [] }}
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }
      # 0644 on purpose: the gateway image runs as a non-root user and the file is
      # rendered by the deploy user, so 0640 was "Permission denied" (task 594,
      # 2026-09-17). Safe because the file holds sha256 hashes and identity names
      # only — every credential is an env reference resolved from the 0600 .env.
      - { src: config.yaml.j2, dest: config.yaml, mode: "0644" }

  tasks:
    - name: "Refuse to render a gateway with no upstream or no served model"
      ansible.builtin.assert:
        that:
          - agw_upstream_base_url is defined
          - agw_upstream_base_url | length > 0
          - agw_models is defined
          - agw_models | length > 0
        fail_msg: >-
          agentgateway_svc needs agw_upstream_base_url and a non-empty agw_models
          list in inventory — an empty gateway would answer 404 for every model.

    # The shared admin list, loaded only when admin identities are enabled
    # (tasks/load-platform-admins.yml); every play that reads agw_identities includes it.
    - name: "Load the shared platform admin list"
      ansible.builtin.include_tasks: tasks/load-platform-admins.yml

    # One personal identity per declared platform admin joins agw_clients in agw_identities
    # (vars/secret-declarations/agentgateway.yml). A derived name that repeats, is reserved
    # (legacy-shared, mcp-self) or falls outside the charset below is refused here, naming the
    # entry, before anything is rendered or restarted.
    - name: "Refuse derived admin identities that collide, are reserved or are malformed"
      ansible.builtin.assert:
        that: _agw_identity_problems | length == 0
        fail_msg: >-
          platform_admins cannot be turned into gateway identities: {{ _agw_identity_problems | join('; ') }}.
        quiet: true

    # A name in both platform_admins and agw_clients is the same identity (the same client_<name>
    # field), merged once. Reported by name so the migration overlap is visible; names only.
    - name: "Report identities declared in both platform_admins and agw_clients"
      ansible.builtin.debug:
        msg: >-
          Merged once, migration overlap (platform_admins and agw_clients): {{ _agw_identity_overlap | join(', ') }}.
      when: _agw_identity_overlap | length > 0

    # Names are interpolated into YAML, JSON (the secret definitions) and a CEL
    # string literal; restrict them to a charset that is inert in all three.
    - name: "Refuse identity or group names outside the safe charset"
      ansible.builtin.assert:
        that:
          - (agw_identities | reject('match', '^[a-z0-9][a-z0-9-]*$') | list) | length == 0
          - agw_ui_admin_group | default('platform-admins') is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: >-
          agw_identities (agw_clients plus the names derived from platform_admins) and agw_ui_admin_group
          must match ^[a-z0-9][a-z0-9-]*$
          (offending identities: {{ agw_identities | reject('match', '^[a-z0-9][a-z0-9-]*$') | list }}).

    # The MCP declaration (agentgateway-mcp tasks 3.2, 3.7, 3.8): an allowlist, refused before anything is
    # rendered or restarted, naming the entry. A target is only {name, schema}; its kind, host and the
    # listener it reaches are not inputs (vars/secret-declarations/agentgateway.yml, _agw_mcp_problems).
    - name: "Refuse an MCP declaration that cannot render a safe target"
      ansible.builtin.assert:
        that: _agw_mcp_problems | length == 0
        fail_msg: "agw_mcp_enabled cannot be rendered: {{ _agw_mcp_problems | join('; ') }}."
        quiet: true

    # `legacy-shared` is rendered from the vLLM key's fingerprint, never minted as a client key,
    # and its expiry must be a real calendar date in ISO form, or the string comparison above
    # means nothing. The parse rejects a non-date (2026-13-01, 2026-02-30), the round trip rejects
    # an unpadded form the parse accepts (2026-1-5), and the rescue names the reason.
    - name: "Refuse a malformed shared-key expiry or legacy-shared declared as a client"
      block:
        - name: "Parse legacy_shared_expires as a calendar date"
          ansible.builtin.assert:
            that:
              - _legacy_expires | length == 0
                or (_legacy_expires | to_datetime('%Y-%m-%d')).strftime('%Y-%m-%d') == _legacy_expires
              - "'legacy-shared' not in (agw_clients | default([]))"
            quiet: true
      rescue:
        - name: "Report the malformed expiry or reserved client name"
          ansible.builtin.fail:
            msg: >-
              legacy_shared_expires must be a real calendar date (YYYY-MM-DD), and legacy-shared is
              not an agw_clients entry: the deploy enrols it from the shared vLLM key while the
              grace period runs.

    # Plaintext keys in the rendered config are a LOCAL-DEV convenience only; the
    # template ignores the flag outside local_mode, and this makes a prod
    # inventory that sets it fail loudly instead of silently being ignored.
    - name: "Refuse agw_plaintext_keys outside local_mode"
      ansible.builtin.assert:
        that: not (agw_plaintext_keys | default(false) | bool) or (local_mode | default(false) | bool)
        fail_msg: "agw_plaintext_keys renders raw client keys into config.yaml; it is only allowed with local_mode: true."

    # Listener TLS (production-internal-ca task 5.2, gateway task 6.1). Every check here runs
    # before any file is rendered or any container restarted, so a bad declaration cannot take
    # the gateway down. The SAN rule is rendered from these declarations (config.yaml.j2).
    - name: "Refuse a client-certificate allowlist entry that names no declared client leaf"
      ansible.builtin.assert:
        that: _undeclared | length == 0
        fail_msg: >-
          agw_client_cert_allowlist names {{ _undeclared | join(', ') }}, which no internal_leaves
          entry declares as a client-profile leaf; declare it in site-config or drop it from the list.
        quiet: true
      vars:
        _undeclared: >-
          {{ _allowlist | difference(internal_leaves | default([]) | selectattr('profile', 'equalto', 'client')
             | map(attribute='name') | list) }}
      when: _tls

    - name: "Refuse listener TLS without the server leaf and the verifier declared for this host"
      ansible.builtin.assert:
        that:
          - _srv | length == 1
          - _srv[0].profile == 'server' and _srv[0].host == inventory_hostname
          # The container mounts <deploy>/certs at /certs, so the leaf must live directly under it.
          - _srv[0].dir == _deploy_dir ~ '/certs/' ~ _server_leaf
          - _ver | length == 1
          - _ver[0].profile == 'client' and _ver[0].host == inventory_hostname
          # The deploy's own probes present the verifier: outside the allowlist they would be 403.
          - _verifier_leaf in _allowlist
          # The probes and Caddy verify the gateway by this name, so the leaf must carry it.
          - (agw_tls_server_name | default('gateway.' ~ (dns_site | default('')) ~ '.' ~ (dns_zone | default('')))) in _srv[0].sans
        fail_msg: >-
          With agw_listener_tls, internal_leaves must declare `{{ _server_leaf }}` (server, host
          {{ inventory_hostname }}, dir {{ _deploy_dir }}/certs/{{ _server_leaf }}) and `{{ _verifier_leaf }}`
          (client, host {{ inventory_hostname }}), and agw_client_cert_allowlist must include {{ _verifier_leaf }}.
        quiet: true
      vars:
        _srv: "{{ internal_leaves | default([]) | selectattr('name', 'equalto', _server_leaf) | list }}"
        _ver: "{{ internal_leaves | default([]) | selectattr('name', 'equalto', _verifier_leaf) | list }}"
      when: _tls

    - name: "Read the issued server and verifier leaves"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ _deploy_dir }}/certs/{{ _server_leaf }}/current/cert.pem"
        - "{{ _deploy_dir }}/certs/{{ _server_leaf }}/current/key.pem"
        - "{{ (internal_leaves | default([]) | selectattr('name', 'equalto', _verifier_leaf) | first).dir }}/current/cert.pem"
      register: _leaf_files
      when: _tls

    - name: "Refuse listener TLS before its leaves are issued"
      ansible.builtin.assert:
        that: _leaf_files.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Issue the leaves first (Issue Internal Leaf (Dev), leaf_name={{ _server_leaf }} and
          {{ _verifier_leaf }}); missing: {{ _leaf_files.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}.
        quiet: true
      when: _tls

    # Rootless production runs the gateway with userns keep-id (compose.tls.yml), so its
    # non-root user (65532) owns the deploy account's files and can read the 0600 key
    # (measured 2026-10-02 with podman-compose 1.0.6: without it, "Permission denied").
    # `keep-id:uid=,gid=` needs podman 4.3 or later.
    - name: "Read the podman version for keep-id"
      ansible.builtin.command:
        argv: ["{{ container_engine | default('podman') }}", version, --format, "{{ '{{.Client.Version}}' }}"]
      register: _podman_version
      changed_when: false
      check_mode: false
      when: _tls and not (local_mode | default(false) | bool)

    - name: "Refuse keep-id on a podman older than 4.3"
      ansible.builtin.assert:
        that: _podman_version.stdout is version('4.3', '>=')
        fail_msg: "Listener TLS needs podman 4.3 or later for userns keep-id; this host has {{ _podman_version.stdout }}."
        quiet: true
      when: _tls and not (local_mode | default(false) | bool)

    # Local-dev runs the gateway on a rootful socket, where keep-id does not apply: the local
    # overlay runs the container as the key owner instead (AGW_RUN_AS in .env).
    - name: "Read the deploy account's uid:gid for the local key owner"
      ansible.builtin.command:
        argv: [sh, -c, 'printf "%s:%s" "$(id -u)" "$(id -g)"']
      register: _key_owner
      changed_when: false
      check_mode: false
      when: _tls and (local_mode | default(false) | bool)

    - name: "Require a declared o11y receiver for agentgateway tracing"
      ansible.builtin.assert:
        that:
          - groups.get('o11y_svc', []) | length == 1
          - agw_otlp_host is match('^[A-Za-z0-9.-]+:[0-9]{1,5}$')
          - agw_otlp_host == (hostvars[groups['o11y_svc'][0]].o11y_otlp_bind | default('')) ~ ':' ~ (hostvars[groups['o11y_svc'][0]].o11y_otlp_port | default(4317) | string)
          - agw_trace_sampling | default(0.05) | float > 0
          - agw_trace_sampling | default(0.05) | float <= 0.1
        fail_msg: "Gateway tracing needs the declared o11y OTLP listener and sampling in (0, 0.1]."
      when: agw_otlp_host | default('') | length > 0

    - name: "Require the recorded trace rollout gate before gateway tracing"
      ansible.builtin.include_tasks: tasks/assert-o11y-trace-rollout.yml
      when: agw_otlp_host | default('') | length > 0

    - name: "Require the declared receiver's Tempo to answer before gateway tracing"
      ansible.builtin.command:
        argv:
          - "{{ hostvars[groups['o11y_svc'][0]].container_engine | default('podman') }}"
          - exec
          - o11y-grafana
          - wget
          - -q
          - -O
          - /dev/null
          - http://tempo:3200/ready
      delegate_to: "{{ groups.get('o11y_svc', []) | first | default(inventory_hostname) }}"
      changed_when: false
      check_mode: false
      when: agw_otlp_host | default('') | length > 0

    - name: "Require the gateway host to reach Alloy's declared OTLP listener"
      ansible.builtin.wait_for:
        host: "{{ agw_otlp_host.split(':')[0] }}"
        port: "{{ agw_otlp_host.split(':')[1] | int }}"
        timeout: 5
        state: started
      changed_when: false
      check_mode: false
      when: agw_otlp_host | default('') | length > 0

    # The AppRole secret_id, the token OpenBao returns and every secret read cross
    # this connection — refuse a public cleartext endpoint before any of it is sent.
    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml


    # Rollback (rollback-inference-route.yml, gateway-config mode; gateway task 4.6) puts back
    # the config.yaml the last change replaced, kept here as config.yaml.previous. The render is
    # the shared manage-secrets step, which reports no per-file change, so the current file is
    # staged as config.yaml.replaced first and compared by checksum afterwards: .previous is
    # written only when the render changed config.yaml. A first deploy has nothing to keep, and
    # an unchanged render leaves .previous alone, so a re-run never replaces the last-good copy
    # with the current one. Both names are gitignored, which is also what keeps local-dev's
    # rsync --delete off them.
    #
    # Raw keys are never kept. Under the local-dev agw_plaintext_keys flag nothing is staged,
    # and a staged copy is promoted only when it carries no `- key:` entry (config.yaml.j2 writes
    # that shape only under the flag; hashed entries are `- keyHash:`), so a config rendered
    # with the flag and replaced after it was turned off is discarded, not kept past its keys'
    # rotation. With that, .previous only ever holds hashes and names, like config.yaml, and
    # keeps its 0644 mode (the gateway's non-root user reads it once rollback puts it back).
    - name: "Read the current config.yaml and any copy an interrupted run staged"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/{{ item }}"
        get_checksum: true
      loop: [config.yaml, config.yaml.replaced]
      register: _cfg_before
      when: _keep_previous and not ansible_check_mode

    # A run interrupted after the render but before the promotion leaves the config that was
    # live before it staged, and a config.yaml that differs from it: that copy is the last-good
    # one, so it is kept now rather than lost to the restage below.
    - name: "Does the interrupted run's staged copy carry a raw client key?"
      ansible.builtin.command:
        argv: [grep, -qE, '^[[:space:]]*- key:', "{{ _deploy_dir }}/config.yaml.replaced"]
      register: _cfg_left_raw
      changed_when: false
      failed_when: false
      when:
        - _keep_previous and not ansible_check_mode
        - _cfg_before.results[1].stat.exists

    - name: "Keep the interrupted run's staged copy as config.yaml.previous"
      ansible.builtin.command:
        argv: [mv, -f, "{{ _deploy_dir }}/config.yaml.replaced", "{{ _deploy_dir }}/config.yaml.previous"]
      changed_when: true
      when:
        - _keep_previous and not ansible_check_mode
        - _cfg_before.results[1].stat.exists
        - _cfg_before.results[0].stat.exists
        - _cfg_before.results[0].stat.checksum != _cfg_before.results[1].stat.checksum
        # rc 1 is "no match"; a read error (rc 2) is treated as a raw key and discarded.
        - _cfg_left_raw.rc == 1

    - name: "Stage the config.yaml this render may replace"
      ansible.builtin.copy:
        src: "{{ _deploy_dir }}/config.yaml"
        dest: "{{ _deploy_dir }}/config.yaml.replaced"
        remote_src: true
        mode: preserve
      # Scratch: on an unchanged render it is dropped again, so the run changed nothing.
      changed_when: false
      when: _keep_previous and not ansible_check_mode and _cfg_before.results[0].stat.exists

    - name: "Drop a staged copy no config.yaml backs (nothing to keep)"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config.yaml.replaced"
        state: absent
      changed_when: false
      when: _keep_previous and not ansible_check_mode and not _cfg_before.results[0].stat.exists

    # The shipped schema of each declared MCP target, read on the CONTROLLER from the same checkout that
    # holds config.yaml.j2 (the template `src` is controller-side too), so it is the same revision as the
    # template and exists under --check, which places no monorepo on the target (a first dry run of a
    # revision that adds a schema would otherwise fail on a file the target does not have yet). It is embedded
    # in the render as one compact JSON string (nothing to mount, and a schema edit is a config change the
    # change-aware deploy sees). The name is a bare file name by the refusal above, so it cannot leave
    # mcp-schemas/. The content is public (an OpenAPI description), so these tasks are visible.
    - name: "Read the shipped OpenAPI schema of each declared MCP target"
      ansible.builtin.set_fact:
        _agw_mcp_schema_raw: >-
          {%- set out = {} -%}
          {%- for t in agw_mcp_openapi_targets -%}
            {%- if out.update({t.schema: lookup('ansible.builtin.file', _agw_mcp_schema_dir ~ '/' ~ t.schema)}) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: agw_mcp_enabled | default(false) | bool

    - name: "Refuse a target schema that is not an OpenAPI document with paths"
      ansible.builtin.assert:
        that:
          - (_agw_mcp_schema_raw[item.schema] | from_json).openapi is defined
          - (_agw_mcp_schema_raw[item.schema] | from_json).paths | length > 0
        fail_msg: "The schema of MCP target {{ item.name }} ({{ item.schema }}) is not an OpenAPI document with paths."
        quiet: true
      loop: "{{ agw_mcp_openapi_targets | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: agw_mcp_enabled | default(false) | bool

    - name: "Hold each schema as compact JSON for the render"
      ansible.builtin.set_fact:
        _agw_mcp_schemas: >-
          {%- set out = {} -%}
          {%- for name, text in _agw_mcp_schema_raw.items() -%}
            {%- if out.update({name: (text | from_json | to_json(separators=(',', ':')))}) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: agw_mcp_enabled | default(false) | bool

    - name: "Manage secrets and render env + config"
      ansible.builtin.include_tasks: tasks/manage-secrets.yml

    - name: "Read the rendered config.yaml and the staged one"
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/{{ item }}"
        get_checksum: true
      loop: [config.yaml, config.yaml.replaced]
      register: _cfg_after
      when: _keep_previous and not ansible_check_mode

    - name: "Does the staged copy carry a raw client key?"
      ansible.builtin.command:
        argv: [grep, -qE, '^[[:space:]]*- key:', "{{ _deploy_dir }}/config.yaml.replaced"]
      register: _cfg_staged_raw
      changed_when: false
      failed_when: false
      when:
        - _keep_previous and not ansible_check_mode
        - _cfg_after.results[1].stat.exists

    - name: "Keep the replaced config as config.yaml.previous (only when the render changed it)"
      ansible.builtin.command:
        argv: [mv, -f, "{{ _deploy_dir }}/config.yaml.replaced", "{{ _deploy_dir }}/config.yaml.previous"]
      changed_when: true
      when:
        - _keep_previous and not ansible_check_mode
        - _cfg_after.results[1].stat.exists
        - _cfg_after.results[0].stat.checksum != _cfg_after.results[1].stat.checksum
        - _cfg_staged_raw.rc == 1

    - name: "Drop the staged copy (still there when the render changed nothing, or it held a raw key)"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config.yaml.replaced"
        state: absent
      changed_when: false
      when: _keep_previous and not ansible_check_mode

    # The render must enrol exactly the identities declared: every name in agw_identities (plus
    # `legacy-shared` while its grace period runs) with one key entry each, nothing else. That
    # catches a templating fault (a key loop that skips or repeats a name), not a membership
    # drift: the identities are derived from the declared admin list, so "derived equals
    # declared" holds by construction (the Authentik verify is the drift guard). The reader prints
    # names and a count only, never a hash or key, so the task needs no no_log.
    - name: "Read the identity names and key-entry count the render wrote"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, re, sys
            text = open(sys.argv[1], encoding="utf-8").read()
            # The llm block only: it runs from `llm:` to the next top-level key, so another policy's
            # key list (the mcp one) is never counted as this one's.
            block = text.split("\nllm:\n", 1)[1] if "\nllm:\n" in text else ""
            block = re.split(r"^[^\s#]", block, maxsplit=1, flags=re.M)[0]
            # The mcp block the same way, and the loopback gateway: whether each was rendered, whether the
            # mcp block carries its own strict key policy, and the identities that policy enrols.
            mcp = text.split("\nmcp:\n", 1)[1] if "\nmcp:\n" in text else None
            if mcp is not None:
                mcp = re.split(r"^[^\s#]", mcp, maxsplit=1, flags=re.M)[0]
            names = r"^[ \t]+metadata:\n[ \t]+name: (\S+)[ \t]*$"
            print(json.dumps({
                "names": re.findall(names, block, re.M),
                "entries": len(re.findall(r"^[ \t]*- (?:keyHash|key):", block, re.M)),
                "mcp": mcp is not None,
                "mcp_apikey": bool(mcp and re.search(r"^    apiKey:$", mcp, re.M) and re.search(r"^      mode: strict$", mcp, re.M)),
                "mcp_names": re.findall(names, mcp, re.M) if mcp else [],
                "mcp_entries": len(re.findall(r"^[ \t]*- (?:keyHash|key):", mcp, re.M)) if mcp else 0,
                "loopback": bool(re.search(r"^  loopback:$", text, re.M)),
            }))
          - "{{ _deploy_dir }}/config.yaml"
      register: _agw_render_read
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    # One assert per property, each with its own message, so a missing name, an extra name and a
    # wrong count are told apart (and each can be broken on its own in the tests).
    - name: "Require the rendered config to enrol every declared identity"
      ansible.builtin.assert:
        that: _missing | length == 0
        fail_msg: "The rendered config.yaml does not enrol these declared identities: {{ _missing | join(', ') }}."
        quiet: true
      vars:
        _expected: "{{ agw_identities + (['legacy-shared'] if _legacy_shared_active | bool else []) }}"
        _missing: "{{ _expected | difference((_agw_render_read.stdout | from_json).names) | sort }}"
      when: not ansible_check_mode

    - name: "Require the rendered config to enrol only declared identities"
      ansible.builtin.assert:
        that: _extra | length == 0
        fail_msg: "The rendered config.yaml enrols identities that are not declared: {{ _extra | join(', ') }}."
        quiet: true
      vars:
        _expected: "{{ agw_identities + (['legacy-shared'] if _legacy_shared_active | bool else []) }}"
        _extra: "{{ (_agw_render_read.stdout | from_json).names | difference(_expected) | sort }}"
      when: not ansible_check_mode

    - name: "Require the rendered config to hold one key entry per declared identity"
      ansible.builtin.assert:
        that: (_agw_render_read.stdout | from_json).entries | int == _expected | length
        fail_msg: >-
          The rendered config.yaml holds {{ (_agw_render_read.stdout | from_json).entries }} key entries
          for {{ _expected | length }} declared identities (a name rendered twice or a key without a name).
        quiet: true
      vars:
        _expected: "{{ agw_identities + (['legacy-shared'] if _legacy_shared_active | bool else []) }}"
      when: not ansible_check_mode

    # The MCP surface in the render (agentgateway-mcp tasks 3.2, 3.7). One assert per property again. Names and
    # counts only. The first two are the fail-closed ones: an mcp block with no key policy answers every
    # request (spike 1.1), so it must never reach a restart; and with the flag false nothing MCP may render.
    - name: "Require the rendered MCP surface to match agw_mcp_enabled"
      ansible.builtin.assert:
        that:
          - _render.mcp | bool == (agw_mcp_enabled | default(false) | bool)
          - _render.loopback | bool == (agw_mcp_enabled | default(false) | bool)
        fail_msg: >-
          The rendered config.yaml has an mcp block: {{ _render.mcp }}, a loopback gateway: {{ _render.loopback }},
          but agw_mcp_enabled is {{ agw_mcp_enabled | default(false) | bool }}; the two must agree.
        quiet: true
      vars:
        _render: "{{ _agw_render_read.stdout | from_json }}"
      when: not ansible_check_mode

    - name: "Require the rendered mcp block to carry its own strict key policy"
      ansible.builtin.assert:
        that: not (_render.mcp | bool) or (_render.mcp_apikey | bool)
        fail_msg: >-
          The rendered config.yaml has an mcp block with no strict apiKey policy: /mcp would answer every
          request without a key.
        quiet: true
      vars:
        _render: "{{ _agw_render_read.stdout | from_json }}"
      when: not ansible_check_mode

    - name: "Require the mcp key policy to enrol exactly the client identities"
      ansible.builtin.assert:
        that:
          - _missing | length == 0
          - _extra | length == 0
          - _render.mcp_entries | int == _expected | length
        fail_msg: >-
          The rendered mcp key policy does not enrol exactly the admin-derived personal identities (never an
          agw_clients service client, mcp-self or legacy-shared): missing {{ _missing | join(', ') }}; not allowed
          {{ _extra | join(', ') }}; {{ _render.mcp_entries }} key entries for {{ _expected | length }} identities.
        quiet: true
      vars:
        _render: "{{ _agw_render_read.stdout | from_json }}"
        _expected: "{{ _agw_admin_identities | map(attribute='name') | reject('equalto', 'mcp-self') | list }}"
        _missing: "{{ _expected | difference(_render.mcp_names) | sort }}"
        _extra: "{{ _render.mcp_names | difference(_expected) | sort }}"
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool

    # vllm_api_key is `existing`: manage-secrets renders it empty when the store has
    # none, and an empty key starts a gateway that is ready but answers every client
    # with the upstream's invalid_api_key. Refuse that unless the inventory declares
    # the upstream takes no key (agw_upstream_requires_key: false — LM Studio without
    # authentication). Checks presence only; the value is never printed. Reads `_resolved`, the
    # fact manage-secrets sets: `secrets` exists only inside its template task, so here it was
    # undefined, defaulted to '' and refused every keyed upstream (Semaphore task 1177).
    - name: "Refuse to deploy without the upstream key when the upstream requires one"
      ansible.builtin.assert:
        that: (_resolved.vllm_api_key | default('') | length > 0) or not (agw_upstream_requires_key | default(true) | bool)
        fail_msg: >-
          secret/services/{{ service_name }}:vllm_api_key is empty. Seed it (Seed OpenBao Key,
          value staged by scripts/semaphore-seed-input.py) before deploying, or set
          agw_upstream_requires_key: false for an upstream that takes no key.
        success_msg: "Upstream key present (or not required by this upstream)."

    # Shared-key retirement (gateway task 5.1): while the grace period runs, record the shared
    # key's sha256 fingerprint once; on or after legacy_shared_expires the render above has
    # already dropped `legacy-shared`. The comparison lives in its own credential task file and
    # yields booleans only; the verdict play at the END fails the deploy on them, AFTER Phase 2
    # has rolled out the config without the identity, so the expired key stops working first.
    - name: "Shared-key retirement: record the fingerprint, compare the vLLM key with it"
      ansible.builtin.include_tasks: tasks/agw-legacy-key-check.yml
      when: _legacy_expires | length > 0

    # The gateway's OIDC discovery/token calls reach the IdP at https://auth.<zone>:8443
    # (step-ca-minted leaf) — distribute the trust bundle into ./certs; compose.local.yml
    # mounts it and sets SSL_CERT_FILE. Local-only (prod IdP uses a public chain).
    # Local: the OIDC trust bundle. With listener TLS (any environment): the same bundle is the
    # gateway's `tls.root` and the probes' `ca_path`, so production needs it too.
    - name: "Distribute the step-ca trust bundle into ./certs"
      ansible.builtin.include_tasks: tasks/distribute-ca-root.yml
      vars:
        _ca_root_dest_dir: "{{ _deploy_dir }}"
        # The task resolves the CA host's own container_engine (review of af16a670: `omit` is a
        # module-argument placeholder, not a way to leave a task variable unset).
        _ca_host: "{{ inventory_hostname if (local_mode | default(false) | bool) else (groups['step_ca_svc'] | first) }}"
      when: (local_mode | default(false) | bool) or _tls

    # Pull through deploy.sh's shared Compose resolver first; validation and deployment
    # then use this same local image without either step pulling a mutable tag again.
    # The pull-only mode verifies rendered files and uses the same Compose files/env as
    # the real deploy, but exits before deciding or changing any container.
    - name: "Require the rendered Compose image to match the reviewed pin"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ _monorepo_dir }}/platform/playbooks/files/check-agentgateway-rendered-image.py"
          - "{{ _deploy_dir }}/.env"
      register: _agw_rendered_image
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: "Refuse image pull when the rendered Compose image differs from the reviewed pin"
      ansible.builtin.assert:
        that:
          - _agw_rendered_image.rc == 0
          - (_agw_rendered_image.stdout | from_json).status == 'pass'
          - (_agw_rendered_image.stdout | from_json).image == 'cr.agentgateway.dev/agentgateway:v1.5.0'
        fail_msg: "The rendered Compose image does not match the reviewed agentgateway v1.5.0 pin."
        quiet: true
      when: not ansible_check_mode

    - name: "Pull the deployment images once before config validation"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh --pull-only
      # The one deploy.sh environment (vars/agw-deploy-env.yml), shared with the rollback.
      environment: "{{ _agw_deploy_env }}"
      register: _agw_image_pull
      changed_when: false
      when: not ansible_check_mode

    # Task 5.7: exercise the exact pulled local binary against the rendered config before
    # deploy.sh can recreate either container (tasks/agw-validate-config.yml, shared with the
    # inference-route rollback). Run after certificate/trust preparation because the validation
    # container gets the same read-only ./certs mount as Compose. The env file is passed by path
    # (never expanded into argv); diagnostics are hidden because parser errors may contain
    # configuration text.
    - name: "Check the rendered config against the pinned image (tasks/agw-validate-config.yml)"
      ansible.builtin.include_tasks: tasks/agw-validate-config.yml
      vars:
        _agw_vc_config: config.yaml
        _agw_vc_refusal: >-
          The rendered agentgateway config validator failed; no gateway container was recreated

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start agentgateway"
  hosts: agentgateway_svc
  gather_facts: false
  become: false
  vars_files:
    - vars/agw-deploy-env.yml
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Confirm the validated image ID is still selected for deployment"
      ansible.builtin.command:
        argv:
          - "{{ container_engine | default('podman') }}"
          - image
          - inspect
          - --format
          - "{{ '{{.Id}}' }}"
          - cr.agentgateway.dev/agentgateway:v1.5.0
      register: _agw_deploy_image_id
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: "Refuse deployment if the validated image tag moved"
      ansible.builtin.assert:
        that:
          - _agw_deploy_image_id.rc == 0
          - (_agw_deploy_image_id.stdout | trim | regex_replace('^sha256:', '')) == (_agw_validated_image_id.stdout | trim | regex_replace('^sha256:', ''))
        fail_msg: "The local v1.5.0 tag changed after validation; no gateway container was recreated."
        quiet: true
      when: not ansible_check_mode

    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh --no-pull
      # The one deploy.sh environment (vars/agw-deploy-env.yml), shared with the rollback:
      # compose provider, local-mode flag and the listener-TLS overlay that mounts ./certs.
      environment: "{{ _agw_deploy_env }}"
      register: _deploy
      # Change-aware (task 1.12): deploy.sh recreates only when the rendered inputs or the
      # image differ from what the running gateway started with, and says which on its last
      # line. A run that left the gateway alone is not a change.
      changed_when: "_deploy.stdout_lines | select('match', '^deploy-result: recreated') | list | length > 0"
      when: not ansible_check_mode

    - name: "Read the running gateway image ID after deployment"
      ansible.builtin.command:
        argv:
          - "{{ container_engine | default('podman') }}"
          - inspect
          - --format
          - "{{ '{{.Image}}' }}"
          - agentgateway
      register: _agw_deployed_image_id
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: "Require the running gateway to use the image validated before recreation"
      ansible.builtin.assert:
        that:
          - _agw_deployed_image_id.rc == 0
          - (_agw_deployed_image_id.stdout | trim | regex_replace('^sha256:', '')) is match('^[0-9a-f]{64}$')
          - (_agw_deployed_image_id.stdout | trim | regex_replace('^sha256:', '')) == (_agw_validated_image_id.stdout | trim | regex_replace('^sha256:', ''))
        fail_msg: "The running gateway image ID does not match the image validated before recreation."
        quiet: true
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
# Probes run from the SIBLING db container (busybox wget over the compose
# network): the gateway image has no shell, and a loopback probe is wrong from
# the local control plane, where this play executes inside the Semaphore
# container rather than on the host that publishes the port. Same probe on
# every path — local, prod VM — so the verify cannot pass for the wrong reason.
# The compose-network probes address the gateway by IP (gateway-addr.sh): by name,
# a VM named `agentgateway` resolved it to the db container itself (task 1215).
- name: "Phase 3: Verify agentgateway"
  hosts: agentgateway_svc
  gather_facts: false
  become: false
  # agw_identities for the default verifying identity below (a play's vars_files do not cross plays).
  vars_files:
    - vars/secret-declarations/agentgateway.yml
  vars:
    # The keyed round-trip is sent as agw_verify_client, else the first identity: agw_clients first,
    # then the personal identities derived from the admin list, so it runs whenever any identity is
    # enrolled. The fallback to agw_clients is for a caller that lacks the declaration.
    _verify_default: "{{ (agw_identities | default(agw_clients | default([]))) | first | default('') }}"
    _engine: "{{ container_engine | default('podman') }}"
    # The access-log lines of the MCP chat call's own /v1 request: the internal identity, on the loopback listener,
    # on the chat path. The match runs on the host (awk, colour codes stripped), so the registered stdout is the
    # one number `_mcp_log_hits` reads and no log line ever reaches the task output (task 4.6).
    _mcp_log_hits: "{{ (_mcp_log.stdout | default('0')) | trim | int }}"
    _probe: "{{ _engine }} exec agentgateway-db wget -q -O - -T 5"
    _tls: "{{ agw_listener_tls | default(false) | bool }}"
    # The name the probes use with listener TLS: one of the server leaf's SANs, and the name
    # Caddy verifies too (production-internal-ca amendment 2026-09-29).
    _agw_server_name: "{{ agw_tls_server_name | default('gateway.' ~ (dns_site | default('')) ~ '.' ~ (dns_zone | default(''))) }}"
    _agw_probe_ip: "{{ '127.0.0.1' if (agw_bind | default('127.0.0.1')) in ['0.0.0.0', '::', ''] else agw_bind | default('127.0.0.1') }}"
    # The plain probe URL: the published port (an unspecified bind is reached on loopback);
    # local-dev, where the target is the Semaphore container, declares agw_verify_base_url.
    _plain_url: >-
      {{ agw_verify_base_url | default('http://' ~ _agw_probe_ip ~ ':' ~ (agw_port | default('4000'))) }}
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    # The shared-key grace period, as Phase 1 reads it (the same four expressions; a play's vars
    # do not cross plays, and test_agw_legacy_retirement.py asserts the copies stay equal).
    _legacy_expires: "{{ legacy_shared_expires | default('', true) | string }}"
    _agw_today: "{{ agw_today | default(now(utc=true).strftime('%Y-%m-%d')) | string }}"
    _legacy_shared_active: "{{ (_legacy_expires | length > 0) and (_agw_today < _legacy_expires) }}"
    _legacy_shared_retired: "{{ (_legacy_expires | length > 0) and (_agw_today >= _legacy_expires) }}"

  tasks:
    # The admin list the identities above derive from (a no-op with the gate off).
    - name: "Load the shared platform admin list"
      ansible.builtin.include_tasks: tasks/load-platform-admins.yml

    # A dry run skipped the deploy, so on a fresh host agentgateway does not exist and every
    # probe below would fail on it (PR 203 Codex review): check, and stop the dry run there.
    - name: "Dry run: is agentgateway running?"
      ansible.builtin.command:
        argv: ["{{ _engine }}", inspect, "--format", "{{ '{{.State.Running}}' }}", "agentgateway"]
      register: _dry_container
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_check_mode

    - name: "Dry run, agentgateway not running: report"
      ansible.builtin.debug:
        msg: "check mode: agentgateway is not running; its verification (readiness, the 401, the keyed round-trip) needs a real deploy."
      when:
        - ansible_check_mode
        - _dry_container.rc != 0 or _dry_container.stdout | trim != 'true'

    - name: "Dry run, agentgateway not running: stop"
      ansible.builtin.meta: end_host
      when:
        - ansible_check_mode
        - _dry_container.rc != 0 or _dry_container.stdout | trim != 'true'

    - name: "Find the gateway's address on its compose network"
      ansible.builtin.command:
        argv: ["{{ _deploy_dir }}/gateway-addr.sh"]
      environment:
        CONTAINER_ENGINE: "{{ _engine }}"
      register: _gw_addr
      changed_when: false
      check_mode: false

    - name: "Readiness listener answers (via the compose network)"
      ansible.builtin.command: "{{ _probe }} http://{{ _gw_addr.stdout }}:19001/healthz/ready"
      # Single shot: deploy.sh already waited up to 90 s for exactly this and fails
      # hard, so a retry here would only re-prove a fact in hand.
      register: _ready
      changed_when: false
      check_mode: false
      # Proves THIS run's container; a dry run started none, so there is nothing to prove.
      when: not ansible_check_mode

    # A stopped gateway has no healthy metric, so this is a post-start receipt,
    # not a prerequisite that makes recovery impossible. Allow the next scrape
    # (15 s interval) to arrive after readiness; an instant query can otherwise
    # return the previous container's last good sample.
    - name: "Mark gateway readiness time on the receiver"
      ansible.builtin.command:
        argv: [date, +%s]
      delegate_to: "{{ groups.get('o11y_svc', []) | first | default(inventory_hostname) }}"
      register: _gateway_ready_epoch
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode
        - agw_otlp_host | default('') | length > 0

    - name: "Require the receiver to collect the restarted gateway"
      ansible.builtin.command:
        argv:
          - "{{ hostvars[groups['o11y_svc'][0]].container_engine | default('podman') }}"
          - exec
          - o11y-prometheus
          - wget
          - -q
          - -O
          - '-'
          - "{{ 'http://127.0.0.1:9090/api/v1/query?query=' ~ ('timestamp(agentgateway_config_synchronized{job=\"agentgateway\"}) and agentgateway_config_synchronized{job=\"agentgateway\"} == 1' | urlencode) }}"
      delegate_to: "{{ groups.get('o11y_svc', []) | first | default(inventory_hostname) }}"
      register: _gateway_metric_gate
      changed_when: false
      check_mode: false
      retries: 18
      delay: 5
      until: >-
        _gateway_metric_gate.rc == 0
        and _gateway_metric_gate.stdout is match('^\\{')
        and (_gateway_metric_gate.stdout | from_json).status == 'success'
        and (_gateway_metric_gate.stdout | from_json).data.result | length == 1
        and ((_gateway_metric_gate.stdout | from_json).data.result[0].value[1] | float)
            > (_gateway_ready_epoch.stdout | float)
      when:
        - not ansible_check_mode
        - agw_otlp_host | default('') | length > 0

    # All three probes below go through the one gateway probe path (tasks/agw-probe.yml, task
    # 6.1a): a `uri` call from this host to the published port. With listener TLS it presents
    # the verifier's client leaf and names the server leaf's SAN, which the interim hosts line
    # maps to the published bind (task 7.2 removes it once internal DNS serves the name).
    - name: "Probe path: the base URL, the presented leaf and the trust bundle"
      ansible.builtin.set_fact:
        # A declared agw_verify_base_url wins in both modes: local-dev runs this play inside the
        # Semaphore container, where the published loopback is not the gateway (review of
        # af16a670); with listener TLS it is declared in the SAN form. Without it (production)
        # the probes name the server leaf's SAN, mapped by the hosts line below.
        _agwp_base: >-
          {{ agw_verify_base_url if (agw_verify_base_url is defined)
             else (('https://' ~ _agw_server_name ~ ':' ~ (agw_port | default('4000'))) if _tls else _plain_url) }}
        _agwp_leaf_dir: >-
          {{ (internal_leaves | default([]) | selectattr('name', 'equalto', agw_verifier_leaf | default('agw-verifier'))
             | map(attribute='dir') | first | default('')) if _tls else '' }}
        _agwp_ca: "{{ _deploy_dir }}/certs/step-ca-bundle.crt"

    - name: "Probe path: resolve the sudo password for the hosts line"
      ansible.builtin.include_tasks: tasks/resolve-become-password.yml
      when: _tls and not ansible_check_mode and agw_verify_base_url is not defined

    # The one resolution step (tasks/agw-probe-resolution.yml): the interim hosts line while
    # agw_internal_dns_authoritative is false, the internal zone's record once it is true.
    - name: "Probe path: resolve the server leaf's name (task 7.2)"
      ansible.builtin.include_tasks: tasks/agw-probe-resolution.yml
      vars:
        _agwr_name: "{{ _agw_server_name }}"
        _agwr_ip: "{{ _agw_probe_ip }}"
      when: _tls and not ansible_check_mode and agw_verify_base_url is not defined

    - name: "An unenrolled request is refused at the gateway (401, never reaches the upstream)"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /v1/models
        _agwp_status: [401]
      when: not ansible_check_mode

    - name: "Require the keyless refusal"
      ansible.builtin.assert:
        that: (_agwp_out.status | int) == 401
        fail_msg: >-
          Keyless /v1/models at {{ _agwp_base }} answered {{ _agwp_out.status }} {{ _agwp_out.msg }};
          strict API keys must refuse it with 401{{ ' (403 means the presented leaf is not on the
          SAN allowlist)' if _tls else '' }}.
        quiet: true
      when: not ansible_check_mode

    # The keyed round-trip: one enrolled identity lists the served models and completes one
    # chat request, which the gateway can only answer by reaching agw_upstream_base_url. The
    # probes are `uri` calls from the target to the gateway's published port, so the key is a
    # module argument, never any process's argv: a shell probe in the db container put it on
    # wget's command line (PR 221 Codex review). The two key-bearing probes are no_log and never
    # fail themselves; the asserts after them carry the diagnosis (status, model names). A dry
    # run skips them: it renders no new key and restarts nothing, so it has no gateway state of
    # its own to prove.
    #
    # The identity may be restricted to some models (agw_client_policies.<name>.allowed_models):
    # it is checked against, and asks for, only models it may use. The URL is the published
    # port (an unspecified bind is reached on loopback); local-dev, where the target is the
    # Semaphore container, declares agw_verify_base_url. `select('in', ...)` keeps allowed_models
    # order so `_verify_models[0]` is the same model every run; `intersect` is a set operation
    # whose order follows per-process hashing (test_no_first_of_set_operation.py).
    - name: "Keyed probes: pick the verifying identity, its models and the gateway URL"
      ansible.builtin.set_fact:
        _verify_client: "{{ agw_verify_client | default(_verify_default) }}"
        _verify_models: >-
          {{ ((agw_client_policies | default({}))[agw_verify_client | default(_verify_default)]
              | default({})).allowed_models
             | default(agw_models | map(attribute='name') | list)
             | select('in', agw_models | map(attribute='name') | list) | list }}
        _verify_url: "{{ _agwp_base }}"

    - name: "Keyed probes: the identity may use at least one declared model"
      ansible.builtin.assert:
        that: _verify_models | length > 0
        fail_msg: "{{ _verify_client }} is allowed none of the declared agw_models; set agw_verify_client to one that is."
      when:
        - not ansible_check_mode
        - _verify_client | length > 0

    - name: "An enrolled identity lists the served models"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /v1/models
        _agwp_status: [200]
        _agwp_key: "{{ _resolved['client_' ~ _verify_client] }}"
      when:
        - not ansible_check_mode
        - _verify_client | length > 0

    - name: "Keyed probes: keep the listing's response"
      ansible.builtin.set_fact:
        _keyed_models: "{{ _agwp_out }}"
      when:
        - not ansible_check_mode
        - _verify_client | length > 0

    # The gateway's own request bucket, when spent, answers 429 with the plain-text body
    # `rate limit exceeded` (measured on local-dev, 2026-09-23). Only that refusal is the
    # gateway's policy, not a routing fault: a redeploy does not fail on it, and the report says
    # the round-trip was not proven on this run, so the deploy FAILS on it unless the operator
    # accepts an unproven redeploy with -e agw_verify_allow_unproven=true. Any other 429 (one
    # relayed from the upstream, or a budget refusal, whose body was not measured) fails like any
    # other status, flag or not.
    - name: "Keyed probes: note a policy refusal"
      ansible.builtin.set_fact:
        _verify_refused: >-
          {{ (_keyed_models.status | default(-1) | int) == 429
             and (_keyed_models.content | default('') | trim) == 'rate limit exceeded' }}
      when:
        - not ansible_check_mode
        - _verify_client | length > 0

    - name: "Require every model this identity may use in the keyed listing"
      ansible.builtin.assert:
        that:
          - (_keyed_models.status | int) == 200
          - _verify_models is subset(_keyed_models.json.data | map(attribute='id') | list)
        fail_msg: >-
          Keyed /v1/models as {{ _verify_client }} at {{ _verify_url }}: expected
          {{ _verify_models | join(', ') }};
          {% if (_keyed_models.status | int) == 200 %}listed
          {{ _keyed_models.json.data | map(attribute='id') | join(', ') }}{% else %}HTTP
          {{ _keyed_models.status }} {{ _keyed_models.msg | default('') }}{% endif %}
      when:
        - not ansible_check_mode
        - _verify_client | length > 0
        - not (_verify_refused | bool)

    # The shared vLLM key is the credential every client held before the gateway. During the grace
    # period the gateway must admit it as `legacy-shared`, or the route switch to the gateway
    # would 401 every client still holding it; once retired it must be refused. Only the status is
    # kept and asserted: the response body of a keyed call is never printed. The status list lets
    # the call return 401/403/429 so the assert below, not the probe, reports the failure.
    - name: "The shared key is admitted as legacy-shared (grace period)"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /v1/models
        _agwp_status: [200, 401, 403, 429]
        _agwp_key: "{{ _resolved.vllm_api_key }}"
      when:
        - not ansible_check_mode
        - _legacy_shared_active | bool

    - name: "Shared-key grace period: keep the probe's status"
      ansible.builtin.set_fact:
        _legacy_probe_status: "{{ _agwp_out.status | int }}"
      when:
        - not ansible_check_mode
        - _legacy_shared_active | bool

    - name: "Require the shared key to be admitted until legacy_shared_expires"
      ansible.builtin.assert:
        that: _legacy_probe_status | int == 200
        fail_msg: >-
          The shared vLLM key was not admitted at the gateway as legacy-shared (HTTP
          {{ _legacy_probe_status }}) although legacy_shared_expires ({{ legacy_shared_expires }})
          has not passed. Clients still holding the shared key would get 401 after the route
          switch. Check that the vLLM key in OpenBao is the one the recorded fingerprint was taken
          from, and that legacy-shared is rendered into the running gateway.
        success_msg: "The shared key is admitted as legacy-shared until {{ legacy_shared_expires }}."
      when:
        - not ansible_check_mode
        - _legacy_shared_active | bool

    - name: "The shared key is refused once retired"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /v1/models
        _agwp_status: [200, 401, 403, 429]
        _agwp_key: "{{ _resolved.vllm_api_key }}"
      when:
        - not ansible_check_mode
        - _legacy_shared_retired | bool

    - name: "Shared-key retirement: keep the probe's status"
      ansible.builtin.set_fact:
        _retired_probe_status: "{{ _agwp_out.status | int }}"
      when:
        - not ansible_check_mode
        - _legacy_shared_retired | bool

    - name: "Require the shared key to be refused after legacy_shared_expires"
      ansible.builtin.assert:
        that: _retired_probe_status | int == 401
        fail_msg: >-
          The shared vLLM key was answered with HTTP {{ _retired_probe_status }} at the gateway,
          not 401, although legacy_shared_expires ({{ legacy_shared_expires }}) has passed: the
          retired identity is still admitted.
        success_msg: "The shared key is refused at the gateway after {{ legacy_shared_expires }}."
      when:
        - not ansible_check_mode
        - _legacy_shared_retired | bool

    - name: "An enrolled identity completes one chat request through the upstream"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /v1/chat/completions
        _agwp_method: POST
        _agwp_status: [200]
        _agwp_timeout: 120
        _agwp_key: "{{ _resolved['client_' ~ _verify_client] }}"
        _agwp_body:
          model: "{{ _verify_models[0] }}"
          max_tokens: 64
          messages: [{role: user, content: "Reply with one word: pong"}]
      when:
        - not ansible_check_mode
        - _verify_client | length > 0
        - not (_verify_refused | bool)

    - name: "Keyed probes: keep the completion's response"
      ansible.builtin.set_fact:
        _keyed_chat: "{{ _agwp_out }}"
      when:
        - not ansible_check_mode
        - _verify_client | length > 0
        - not (_verify_refused | bool)

    - name: "Keyed probes: note a policy refusal of the completion"
      ansible.builtin.set_fact:
        _verify_refused: >-
          {{ (_keyed_chat.status | default(-1) | int) == 429
             and (_keyed_chat.content | default('') | trim) == 'rate limit exceeded' }}
      when:
        - not ansible_check_mode
        - _verify_client | length > 0
        - _keyed_chat is defined

    - name: "Refuse to report success when the round-trip was not proven"
      ansible.builtin.assert:
        that: not (_verify_refused | bool) or (agw_verify_allow_unproven | default(false) | bool)
        fail_msg: >-
          The gateway's own request bucket refused {{ _verify_client }} (HTTP 429, rate limit
          exceeded), so this run did not prove the gateway reaches {{ agw_upstream_base_url }}.
          Rerun after the window, or -e agw_verify_allow_unproven=true to accept an unproven
          redeploy.
      when:
        - not ansible_check_mode
        - _verify_client | length > 0

    - name: "Require a completion the upstream produced"
      # The gateway answers a completion only by reaching agw_upstream_base_url; `model` is the
      # upstream's own served name (local-dev: openai/gpt-oss-20b), and usage is its count.
      ansible.builtin.assert:
        that:
          - (_keyed_chat.status | int) == 200
          - _keyed_chat.json.object == 'chat.completion'
          - _keyed_chat.json.choices | length > 0
          - (_keyed_chat.json.usage.completion_tokens | default(0) | int) > 0
        fail_msg: >-
          Keyed chat completion as {{ _verify_client }} for {{ _verify_models[0] }} failed:
          HTTP {{ _keyed_chat.status }} {{ _keyed_chat.msg | default('') }}
      when:
        - not ansible_check_mode
        - _verify_client | length > 0
        - not (_verify_refused | bool)

    # ── MCP (agentgateway-mcp task 3.4) ─────────────────────────────────────────────────────────
    # agw_mcp_enabled true: a request with no key is 401 (answered before any target is contacted), an
    # authenticated `initialize` returns an MCP session, and `tools/list` shows at least one tool. The last
    # is a check of its own because the validator accepts an mcpAuthorization rule that names a wrong field,
    # which then denies every tool without a word (spike 1.1, 1.3): an empty list fails the deploy, it does
    # not pass. agw_mcp_enabled false: a KEYED `initialize` must not be an MCP reply (keyless is 401 with MCP
    # on or off, since the /v1 route answers any path with the key check first, so it proves nothing).
    # Every verdict reads the BODY: a self-call 401/403 comes back as HTTP 200 with the error in a tool
    # result, and the gateway's own rate-limit refusal is HTTP 200 with JSON-RPC error -32003 (spike 1.5,
    # 1.7). With MCP on the identity is an admin-derived one (the only kind /mcp admits); never mcp-self. A check that cannot run reports
    # itself unproven, and an unproven MCP check fails the deploy unless agw_verify_allow_unproven accepts it,
    # exactly as the keyed /v1 round-trip does. Every call is the one probe path: the key is a `uri` header
    # from this host, never any process's argv, and no key-bearing step is added to the no_log set.
    - name: "MCP probes: pick the identity and the requests"
      ansible.builtin.set_fact:
        _mcp_client: >-
          {%- set pick = agw_verify_client | default(_verify_default) -%}
          {%- set admins = _agw_admin_identities | default([]) | map(attribute='name') | reject('equalto', 'mcp-self') | list -%}
          {%- if agw_mcp_enabled | default(false) | bool -%}
            {{ pick if pick in admins else (admins | first | default('')) }}
          {%- else -%}
            {{ pick if pick != 'mcp-self' else ((agw_identities | default(agw_clients | default([]))) | reject('equalto', 'mcp-self') | first | default('')) }}
          {%- endif -%}
        _mcp_headers: {Accept: "application/json, text/event-stream"}
        _mcp_initialize:
          jsonrpc: "2.0"
          id: 1
          method: initialize
          params: {protocolVersion: "2025-03-26", capabilities: {}, clientInfo: {name: agw-verify, version: "1"}}
        _mcp_tools_list: {jsonrpc: "2.0", id: 2, method: tools/list}
        _mcp_unproven: false
      when: not ansible_check_mode

    - name: "MCP: a request with no key is refused before any target is contacted"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /mcp
        _agwp_method: POST
        _agwp_status: [200, 400, 401, 403, 429]
        _agwp_headers: "{{ _mcp_headers }}"
        _agwp_body: "{{ _mcp_initialize }}"
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool

    - name: "Require the keyless MCP refusal"
      ansible.builtin.assert:
        that: (_agwp_out.status | int) == 401
        fail_msg: >-
          Keyless POST /mcp at {{ _agwp_base }} answered {{ _agwp_out.status }}; with MCP enabled the
          gateway must refuse a request with no key with 401 and reach no target (an mcp block with no key
          policy answers every request).
        quiet: true
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool

    - name: "MCP: an enrolled identity initialises a session"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /mcp
        _agwp_method: POST
        _agwp_status: [200, 400, 401, 403, 429]
        _agwp_headers: "{{ _mcp_headers }}"
        _agwp_body: "{{ _mcp_initialize }}"
        _agwp_rpc: true
        _agwp_key: "{{ _resolved['client_' ~ _mcp_client] }}"
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0

    - name: "MCP: keep the initialize response"
      ansible.builtin.set_fact:
        _mcp_init: "{{ _agwp_out }}"
        _mcp_init_refused: >-
          {{ (_agwp_out.rpc.get('error', {}).get('code', 0) | int) == -32003
             or ((_agwp_out.status | int) == 429 and (_agwp_out.content | default('') | trim) == 'rate limit exceeded') }}
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0

    - name: "Require an MCP session for an enrolled identity"
      ansible.builtin.assert:
        that:
          - (_mcp_init.status | int) == 200
          - _mcp_init.rpc.get('result', {}).get('serverInfo') is not none
          - "'error' not in _mcp_init.rpc"
        fail_msg: >-
          Authenticated MCP initialize as {{ _mcp_client }} at {{ _agwp_base }}/mcp answered HTTP
          {{ _mcp_init.status }}{{ ' (JSON-RPC error ' ~ _mcp_init.rpc.error.get('code', '') ~ ')' if 'error' in _mcp_init.rpc else '' }};
          an enrolled identity must get an MCP session.
        quiet: true
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)

    - name: "MCP: an enrolled identity lists the tools"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /mcp
        _agwp_method: POST
        _agwp_status: [200, 400, 401, 403, 429]
        _agwp_headers: "{{ _mcp_headers }}"
        _agwp_body: "{{ _mcp_tools_list }}"
        _agwp_rpc: true
        _agwp_key: "{{ _resolved['client_' ~ _mcp_client] }}"
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)

    - name: "MCP: keep the tool listing"
      ansible.builtin.set_fact:
        _mcp_tools: "{{ _agwp_out }}"
        _mcp_tools_refused: >-
          {{ (_agwp_out.rpc.get('error', {}).get('code', 0) | int) == -32003
             or ((_agwp_out.status | int) == 429 and (_agwp_out.content | default('') | trim) == 'rate limit exceeded') }}
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)

    - name: "Require an authorised tool to be listed"
      ansible.builtin.assert:
        that:
          - (_mcp_tools.status | int) == 200
          - "'error' not in _mcp_tools.rpc"
          - _mcp_tools.rpc.get('result', {}).get('tools', []) | length > 0
        fail_msg: >-
          MCP tools/list as {{ _mcp_client }} at {{ _agwp_base }}/mcp listed no tool (HTTP {{ _mcp_tools.status }}).
          An authorization rule that names a wrong field denies every tool without an error, so an empty
          listing is a failed deploy.
        quiet: true
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)

    # Task 4.6: one model call through the chat tool, as the admin identity that listed the tools. Body-based
    # (a self-call refusal is HTTP 200 with the error in the result, spike 1.5): the result must not be an error
    # and must carry a completion. Then the gateway's access log must show the /v1 request the self-call made:
    # identity mcp-self, listener loopback, the chat path. Only the count of matching lines is kept, never a line.
    - name: "MCP: pick the chat tool and the model"
      ansible.builtin.set_fact:
        _mcp_chat_tool: >-
          {{ _mcp_tools.rpc.get('result', {}).get('tools', []) | map(attribute='name')
             | select('search', '(^|_)chat_completions$') | first | default('') }}
        _mcp_model: "{{ agw_models | map(attribute='name') | first }}"
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)

    - name: "Require the chat tool to be listed"
      ansible.builtin.assert:
        that: _mcp_chat_tool | length > 0
        fail_msg: >-
          MCP tools/list as {{ _mcp_client }} does not show the chat tool (an operationId ending in
          chat_completions); the first MCP target is the gateway's own /v1 schema.
        quiet: true
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)

    - name: "MCP: read the engine's clock before the model call"
      ansible.builtin.command:
        argv: ["{{ _engine }}", exec, agentgateway-db, date, -u, "+%Y-%m-%dT%H:%M:%SZ"]
      register: _mcp_clock
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)

    - name: "MCP: an enrolled identity makes one model call through the chat tool"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /mcp
        _agwp_method: POST
        _agwp_status: [200, 400, 401, 403, 429]
        _agwp_timeout: 120
        _agwp_headers: "{{ _mcp_headers }}"
        _agwp_rpc: true
        _agwp_key: "{{ _resolved['client_' ~ _mcp_client] }}"
        _agwp_body:
          jsonrpc: "2.0"
          id: 3
          method: tools/call
          params:
            name: "{{ _mcp_chat_tool }}"
            arguments:
              body:
                model: "{{ _mcp_model }}"
                max_tokens: 16
                messages: [{role: user, content: "Reply with one word: pong"}]
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)
        - _mcp_chat_tool | length > 0

    - name: "MCP: keep the model call's response"
      ansible.builtin.set_fact:
        _mcp_call: "{{ _agwp_out }}"
        _mcp_call_refused: >-
          {{ (_agwp_out.rpc.get('error', {}).get('code', 0) | int) == -32003
             or ((_agwp_out.status | int) == 429 and (_agwp_out.content | default('') | trim) == 'rate limit exceeded') }}
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)
        - _mcp_chat_tool | length > 0

    - name: "Require a completion from the chat tool"
      ansible.builtin.assert:
        that:
          - (_mcp_call.status | int) == 200
          - "'error' not in _mcp_call.rpc"
          - not (_mcp_call.rpc.get('result', {}).get('isError', false) | bool)
          - _mcp_call.rpc.get('result', {}).get('structuredContent', {}).get('choices', []) | length > 0
        fail_msg: >-
          The MCP chat tool call as {{ _mcp_client }} at {{ _agwp_base }}/mcp for {{ _mcp_model }} returned no
          completion (HTTP {{ _mcp_call.status }}, tool error: {{ _mcp_call.rpc.get('result', {}).get('isError', false) }}).
          A self-call refusal comes back as HTTP 200 with the error in the tool result.
        quiet: true
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)
        - _mcp_chat_tool | length > 0
        - not (_mcp_call_refused | bool)

    # The match runs on the host and prints a count, so no log line (client addresses, paths) can reach the task
    # output, with or without a failure: the task needs no no_log. pipefail makes a failed `logs` fail the task
    # instead of counting zero lines. The line is written when the self-call's response completes, so allow it a
    # moment to appear.
    - name: "MCP: count the access-log lines of the model call's /v1 request"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          {{ _engine }} logs --since '{{ _mcp_clock.stdout | trim }}' agentgateway 2>&1 \
            | awk '{ gsub(/\033\[[0-9;]*m/, "") }
                   /listener=loopback/ && /identity="mcp-self"/ && /http\.path="\/v1\/chat\/completions"/ { n++ }
                   END { print n + 0 }'
      register: _mcp_log
      changed_when: false
      # Retries exhausted is not a failure of this task: the assert below judges the count and names it.
      failed_when: false
      check_mode: false
      retries: 5
      delay: 2
      until: (_mcp_log_hits | int) > 0
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)
        - _mcp_chat_tool | length > 0
        - not (_mcp_call_refused | bool)

    - name: "Require the model call's /v1 request to be logged as mcp-self on the loopback listener"
      ansible.builtin.assert:
        that: (_mcp_log_hits | int) > 0
        fail_msg: >-
          No access-log line from the last minutes shows a /v1/chat/completions request on the loopback
          listener as identity mcp-self ({{ _mcp_log_hits }} matching lines; log read exit {{ _mcp_log.rc | default('?') }}), so the MCP chat call was not
          attributed to the internal identity. Log lines are never printed.
        quiet: true
      when:
        - not ansible_check_mode
        - agw_mcp_enabled | default(false) | bool
        - _mcp_client | length > 0
        - not (_mcp_init_refused | bool)
        - not (_mcp_tools_refused | bool)
        - _mcp_chat_tool | length > 0
        - not (_mcp_call_refused | bool)

    - name: "MCP: with MCP disabled a keyed initialize is not an MCP reply"
      ansible.builtin.include_tasks: tasks/agw-probe.yml
      vars:
        _agwp_path: /mcp
        _agwp_method: POST
        _agwp_status: [200, 202, 400, 401, 403, 404, 405, 415, 422, 429]
        _agwp_headers: "{{ _mcp_headers }}"
        _agwp_body: "{{ _mcp_initialize }}"
        _agwp_rpc: true
        _agwp_key: "{{ _resolved['client_' ~ _mcp_client] }}"
      when:
        - not ansible_check_mode
        - not (agw_mcp_enabled | default(false) | bool)
        - _mcp_client | length > 0

    - name: "MCP: keep the disabled-endpoint response"
      ansible.builtin.set_fact:
        _mcp_off: "{{ _agwp_out }}"
      when:
        - not ansible_check_mode
        - not (agw_mcp_enabled | default(false) | bool)
        - _mcp_client | length > 0

    - name: "Require /mcp not to be served while MCP is disabled"
      ansible.builtin.assert:
        that:
          - (_mcp_off.status | int) not in [200, 202]
          - "'result' not in _mcp_off.rpc"
        fail_msg: >-
          Keyed POST /mcp at {{ _agwp_base }} as {{ _mcp_client }} answered HTTP {{ _mcp_off.status }} with an
          MCP reply although agw_mcp_enabled is false; the endpoint must not be served.
        quiet: true
      when:
        - not ansible_check_mode
        - not (agw_mcp_enabled | default(false) | bool)
        - _mcp_client | length > 0
        - (_mcp_off.status | int) != 429

    # Unproven, never passed: MCP on with no identity that may call it, or the gateway's own bucket refusing
    # a probe; MCP off with the probe refused by that bucket. (MCP off and no identity at all is the same
    # "not run" the keyed /v1 round-trip reports, and does not fail a gateway with no clients.)
    - name: "MCP: record whether the checks were proven"
      ansible.builtin.set_fact:
        _mcp_unproven: >-
          {{ (agw_mcp_enabled | default(false) | bool)
               and (_mcp_client | length == 0 or (_mcp_init_refused | default(false) | bool) or (_mcp_tools_refused | default(false) | bool) or (_mcp_call_refused | default(false) | bool))
             or (not (agw_mcp_enabled | default(false) | bool)
               and _mcp_client | length > 0 and ((_mcp_off | default({})).get('status', 0) | int) == 429) }}
      when: not ansible_check_mode

    - name: "Refuse an unproven MCP check unless it is accepted"
      ansible.builtin.assert:
        that: not (_mcp_unproven | bool) or (agw_verify_allow_unproven | default(false) | bool)
        fail_msg: >-
          The MCP checks were not proven on this run (no identity that may call /mcp, or the gateway's own
          request bucket refused a probe). Rerun after the window, or -e agw_verify_allow_unproven=true to
          accept an unproven redeploy.
        quiet: true
      when: not ansible_check_mode

    - name: "Report the MCP checks"
      ansible.builtin.debug:
        msg: >-
          {% if ansible_check_mode %}Check mode: the MCP checks run only in a real run.
          {% elif agw_mcp_enabled | default(false) | bool and (_mcp_unproven | bool) %}WARNING: the MCP checks were
          NOT proven on this run (accepted by agw_verify_allow_unproven).
          {% elif agw_mcp_enabled | default(false) | bool %}MCP: /mcp without a key is 401; as {{ _mcp_client }}
          initialize returned a session, tools/list listed
          {{ _mcp_tools.rpc.result.tools | map(attribute='name') | join(', ') }}, and one chat call returned a
          completion logged as mcp-self on the loopback listener.
          {% elif _mcp_client | length > 0 %}MCP is disabled: a keyed initialize at /mcp is not an MCP reply (HTTP
          {{ _mcp_off.status }}).
          {% else %}MCP is disabled; no enrolled identity, so /mcp was not probed.{% endif %}

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          agentgateway ready — /healthz/ready answers on the compose network; unauthenticated
          /v1/models is 401 at the gateway.
          {% if ansible_check_mode %}Check mode: the keyed round-trip runs only in a real run.
          {% elif _verify_client | length > 0 and (_verify_refused | bool) %}WARNING: the keyed
          round-trip was NOT proven on this run: the gateway's own request bucket refused
          {{ _verify_client }} (HTTP 429, rate limit exceeded); accepted by
          agw_verify_allow_unproven=true. Rerun the verify after the window.
          {% elif _verify_client | length > 0 %}As {{ _verify_client }}: /v1/models lists
          {{ _verify_models | join(', ') }}; one chat completion for
          {{ _verify_models[0] }} came back from upstream model
          {{ _keyed_chat.json.model }} at {{ agw_upstream_base_url }}
          ({{ _keyed_chat.json.usage.completion_tokens }} completion tokens).
          {% else %}No enrolled identity (agw_identities is empty): the keyed round-trip was not
          run.{% endif %}

    # Last: every verify task above passed (a failure stops the play before this records).
    # `verified` is false when the keyed round-trip was refused by the gateway's own request
    # bucket and the run accepted that as unproven (agw_verify_allow_unproven): the evidence key
    # stays a boolean and does not claim a proof the run did not make.
    - name: "Gather this host's service-deploy result"
      ansible.builtin.set_fact:
        _service_deploy_result:
          skipped: "{{ _deploy is not defined or _deploy is skipped }}"
          changed: "{{ (_deploy | default({})).changed | default(false) }}"
          verified: "{{ not (_verify_refused | default(false) | bool) and not (_mcp_unproven | default(false) | bool) }}"

    - name: "Record the service-deploy step result"
      ansible.builtin.include_tasks: tasks/emit-service-deploy-result.yml
      vars:
        service_deploy_result_var: _service_deploy_result

# ── Phase 4: Shared-key retirement verdict (gateway task 5.1) ──────────────
# Last on purpose: a failure here must not stop Phase 2 from removing the expired identity from
# the running gateway. Reads only the booleans Phase 1's credential task set.
- name: "Phase 4: Shared-key retirement verdict"
  hosts: agentgateway_svc
  gather_facts: false
  become: false
  tasks:
    - name: "Refuse retirement with no recorded pre-rotation fingerprint"
      ansible.builtin.assert:
        that: not (_legacy_fp_missing | bool)
        fail_msg: >-
          legacy_shared_expires has passed and legacy-shared is no longer enrolled, but
          secret/services/{{ service_name }} holds no legacy_shared_key_sha256, so the deploy cannot
          prove the shared vLLM key was rotated. Record it by deploying before the expiry date, or
          seed the fingerprint of the pre-rotation key.
      when: _legacy_shared_retired_now | default(false) | bool

    - name: "Refuse retirement while the vLLM key is still the shared key"
      ansible.builtin.assert:
        that: not (_legacy_key_unrotated | bool)
        fail_msg: >-
          legacy_shared_expires has passed and legacy-shared is no longer enrolled at the gateway, but
          secret/services/{{ service_name }}:vllm_api_key still matches the pre-rotation shared key,
          which therefore still works directly at vLLM. Rotate VLLM_API_KEY at vLLM and in OpenBao
          (dgx-spark), then re-run the deploy.
        success_msg: "The vLLM key differs from the retired shared key."
      when: _legacy_shared_retired_now | default(false) | bool
