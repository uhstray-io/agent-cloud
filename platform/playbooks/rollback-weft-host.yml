---
# rollback-weft-host.yml — a PERSON takes one weft host (a workspace or a front door) back to an
# earlier release, from a backup set they name ("Roll Back weft Host"). DESTRUCTIVE to what people
# wrote since that backup: the current database is set aside (never deleted) and the backup is put
# in its place.
#
# Nothing rolls back by itself. A deploy whose health or watch fails stops there, leaves the host
# as it is and prints the backup set it took. The release to go back to is the host's previous
# pin, which is in site-config's history: the person reverts the host's weft_release in a
# site-config pull request and syncs the inventory first, and this deploys whatever the host is
# pinned to now, verified like any deploy. So the release a host goes back to is one a person wrote
# down, never one read from the host.
#
#   weft_rollback_host=<one inventory host>     which host
#   confirm_rollback=<that same host name>      no default: the launch names the host twice
#   weft_restore_from=<backup set>              a set under the host's deploys/ directory, never
#                                               "the latest": the person says which copy they mean
#   weft_rollback_reason=<one line>             kept in the task's log
#   weft_staging_release=<commit or pin>        staging only, which has no pin in site-config
#
# `restore` refuses while anything has the database open, refuses a copy that does not verify, and
# refuses one newer than the release's binary, each before anything moves.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# A host pattern that matches nothing is a play that exits 0 having done nothing (MISTAKES 2.21).
- name: "Pre-flight: the host is a declared weft host"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Require one inventory host of a weft group"
      ansible.builtin.assert:
        that:
          - weft_rollback_host | default('') in (groups['weft_door'] | default([])) + (groups['weft_workspaces'] | default([]))
            + (groups['weft_staging_door'] | default([])) + (groups['weft_staging_workspace'] | default([]))
        fail_msg: "weft_rollback_host must name one host of weft_door, weft_workspaces or the staging pair. Nothing was changed."

- name: "Roll back one weft host by hand"
  hosts: "{{ weft_rollback_host | default('weft_none') }}"
  gather_facts: false
  become: false
  vars_files:
    - vars/weft.yml
  vars:
    _bao_url: "{{ openbao_addr | default('') }}"
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _weft_role: "{{ 'workspace' if weft_workspace_id is defined else 'door' }}"
    _weft_workspace_dir: "{{ _weft_root }}/{{ weft_workspace_id | default('') }}"
    _weft_state_dir: "{{ _weft_workspace_state_dir if _weft_role == 'workspace' else _weft_door_state_dir }}"
    _weft_deploy_dir: "{{ _monorepo_dir }}/{{ _weft_service_dir_by_role[_weft_role] }}"
    _weft_label: "{{ ('workspace ' ~ weft_workspace_id) if _weft_role == 'workspace' else 'front door' }}"
    _weft_podman_socket: "/run/user/{{ _weft_uid.stdout }}/podman/podman.sock"
    _weft_deploy_env:
      CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
      LOCAL_MODE: "{{ 'true' if (_weft_local | bool) else '' }}"
      COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
    _weft_health_argv: >-
      {{ ['bash', 'deploy.sh', 'health', '--since', _weft_started.stdout,
          '--board', 'https://' ~ weft_workspace_name ~ '.' ~ weft_domain, '--workspace', weft_workspace_id]
         if _weft_role == 'workspace' else ['bash', 'deploy.sh', 'health'] }}

  tasks:
    - name: "Require one named weft host, confirmed, a backup set and a reason"
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - group_names | intersect(['weft_door', 'weft_workspaces', 'weft_staging_door', 'weft_staging_workspace']) | length > 0
          - confirm_rollback | default('') == inventory_hostname
          # One set directly under deploys/: never '.' or '..', which would name a directory above it.
          - weft_restore_from | default('') is match('^' ~ (_weft_data_dir | regex_escape) ~ '/deploys/(?!\\.{1,2}/?$)[A-Za-z0-9._-]+/?$')
          - weft_rollback_reason | default('') | trim | length > 0
        fail_msg: >-
          Name exactly one weft host, repeat its name in confirm_rollback, and give
          weft_restore_from (a set under {{ _weft_data_dir }}/deploys/) and weft_rollback_reason.
          Nothing was changed.

    # Staging has no pin in site-config: it runs what a person launched Deploy weft Staging with,
    # so its rollback is told the same way. Ignored on the rack, whose pin is site-config's.
    - name: "Staging: go back to the commit or pin the person names"
      ansible.builtin.set_fact:
        _weft_pin_override: "{{ weft_staging_release }}"
      when:
        - weft_environment | default('') == 'staging'
        - weft_staging_release | default('') | length > 0

    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    # weft.toml is root's (vars/weft.yml), so a workspace's rollback escalates to render it.
    - name: "Resolve the sudo password (host may not be hardened yet)"
      ansible.builtin.include_tasks: tasks/resolve-become-password.yml

    - name: "Read the front door's public key, for the restored release's weft.toml"
      ansible.builtin.set_fact:
        _shared:
          public_key: >-
            {{ lookup('community.hashi_vault.hashi_vault',
                      'secret/data/services/' ~ _weft_secrets ~ '/door:public_key',
                      url=_bao_url, auth_method='approle',
                      role_id=(bao_role_id | default(lookup('env', 'BAO_ROLE_ID'))),
                      secret_id=(bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')))) }}
      no_log: true
      when: _weft_role == 'workspace'

    - name: "Require the backup set to exist"
      ansible.builtin.stat:
        path: "{{ weft_restore_from }}/backup.json"
      register: _weft_named_set
      failed_when: not _weft_named_set.stat.exists

    - name: "Read the deploy user's id"
      ansible.builtin.command: id -u
      register: _weft_uid
      changed_when: false
      check_mode: false

    - name: "Verify and pull the release the host is pinned to now"
      ansible.builtin.include_tasks: tasks/weft-release.yml

    - name: "Check mode: report and stop here"
      ansible.builtin.debug:
        msg: "check mode: {{ _weft_label }} would be rolled back to {{ weft_release }} from {{ weft_restore_from }}."
      when: ansible_check_mode

    - name: "Check mode: end this host"
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: "Read the release the rendered .env names (it labels the set-aside database)"
      ansible.builtin.command:
        argv: [sed, -n, 's/^WEFT_RELEASE=//p', "{{ _weft_deploy_dir }}/.env"]
      register: _weft_env_release
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Name both sides"
      ansible.builtin.set_fact:
        _weft_leaving: "{{ (_weft_env_release.stdout | default('') | trim) or 'unknown' }}"
        _weft_to: "{{ _weft_release_name }}"

    - name: "Report the rollback"
      ansible.builtin.debug:
        msg: "{{ _weft_label }}: from {{ _weft_leaving }} back to {{ _weft_to }}, restoring {{ weft_restore_from }}: {{ weft_rollback_reason }}"

    - name: "Note when the rollback started"
      ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%SZ
      register: _weft_started
      changed_when: false
      check_mode: false

    - name: "Workspace: the release's whisper model, before the stop"
      ansible.builtin.include_tasks: tasks/weft-whisper-model.yml
      when: _weft_role == 'workspace'

    # The deploy's record (tasks/weft-deploy.yml): until this rollback comes back healthy, a
    # re-launched deploy must not take the host for one already on its pin.
    - name: "Mark this host deploying {{ _weft_release_digest }}"
      ansible.builtin.copy:
        content: "deploying {{ _weft_release_digest }}\n"
        dest: "{{ _weft_state_dir }}/deploy.state"
        owner: "{{ _weft_state_owner }}"
        group: "{{ _weft_state_group }}"
        mode: "0644"
      become: true
      when: not ansible_check_mode

    - name: "Restore and start {{ _weft_to }}"
      block:
        - name: "Stop every container of {{ _weft_label }}"
          ansible.builtin.command:
            argv: [bash, deploy.sh, stop]
            chdir: "{{ _weft_deploy_dir }}"
          environment: "{{ _weft_deploy_env }}"
          changed_when: true
          when: not ansible_check_mode

        - name: "Render .env for {{ _weft_to }}"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../services/weft-{{ _weft_role }}/deployment/templates/{{ _weft_role }}.env.j2"
            dest: "{{ _weft_deploy_dir }}/.env"
            mode: "0600"

        - name: "Render the workspace's files for {{ _weft_to }}"
          ansible.builtin.include_tasks: tasks/weft-workspace-files.yml
          when: _weft_role == 'workspace'

        - name: "Restore the named backup, setting the current database aside"
          ansible.builtin.command:
            argv: [bash, deploy.sh, restore, --from, "{{ weft_restore_from }}", --label, "failed-{{ _weft_leaving }}"]
            chdir: "{{ _weft_deploy_dir }}"
          environment: "{{ _weft_deploy_env }}"
          changed_when: true
          when: not ansible_check_mode

        - name: "Start {{ _weft_to }}"
          ansible.builtin.command:
            argv: [bash, deploy.sh, up]
            chdir: "{{ _weft_deploy_dir }}"
          environment: "{{ _weft_deploy_env }}"
          changed_when: true
          when: not ansible_check_mode

        - name: "Health of {{ _weft_to }}"
          ansible.builtin.command:
            argv: "{{ _weft_health_argv }}"
            chdir: "{{ _weft_deploy_dir }}"
          environment: "{{ _weft_deploy_env }}"
          register: _weft_rollback_health
          changed_when: false
          check_mode: false
          retries: "{{ (_weft_health_minutes | int) * 6 }}"
          delay: 10
          until: _weft_rollback_health.rc == 0

        - name: "Mark this host healthy at {{ _weft_release_digest }}"
          ansible.builtin.copy:
            content: "healthy {{ _weft_release_digest }}\n"
            dest: "{{ _weft_state_dir }}/deploy.state"
            owner: "{{ _weft_state_owner }}"
            group: "{{ _weft_state_group }}"
            mode: "0644"
          become: true
          when: not ansible_check_mode

        - name: "Rolled back"
          ansible.builtin.debug:
            msg: >-
              {{ _weft_label }} runs {{ _weft_to }} from {{ weft_restore_from }}. What was written on
              {{ _weft_leaving }} is kept beside the database as its failed-{{ _weft_leaving }} copy.

      rescue:
        - name: "Stop everything and leave every file where it is"
          ansible.builtin.command:
            argv: [bash, deploy.sh, stop]
            chdir: "{{ _weft_deploy_dir }}"
          environment: "{{ _weft_deploy_env }}"
          changed_when: true
          failed_when: false
          when: not ansible_check_mode

        - name: "Fail: the rollback did not come back healthy"
          ansible.builtin.fail:
            msg: >-
              {{ _weft_label }}: going back to {{ _weft_to }} failed at
              '{{ ansible_failed_task.name | default('unknown step') }}'. Every container is stopped
              and no file was deleted. Look at the containers' logs before anything else; a Proxmox
              snapshot of the VM, if one was taken before the rollout, is the last resort.
