# Read-only, Dev-bound survey of receiver-host container log-source readiness.

- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Require the reviewed checkout"
  ansible.builtin.import_playbook: require-reviewed-checkout.yml

- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Survey receiver-host log sources without changing host state
  hosts: o11y_svc
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    _log_survey: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/survey-o11y-log-source.py') }}"
    _survey_refusal_reasons:
      - container_metadata_unavailable
      - no_running_o11y_containers
      - alloy_source_unverified
      - survey_failed
  tasks:
    - name: Require one receiver and production mode
      ansible.builtin.assert:
        that:
          - groups['o11y_svc'] | length == 1
          - not (local_mode | default(false) | bool)
        fail_msg: "This read-only survey requires one o11y receiver and production mode."
        quiet: true
      delegate_to: localhost
      tags: [always]

    - name: Classify receiver log-source metadata
      ansible.builtin.command:
        argv: [python3, -]
        stdin: "{{ _log_survey }}"
        stdin_add_newline: false
      register: _log_source_report
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Require the survey helper to complete
      ansible.builtin.assert:
        that: (_log_source_report.rc | default(1)) == 0
        fail_msg: "Receiver log-source survey failed (survey_failed); no metadata is reported."
        quiet: true
      tags: [always]

    - name: Require a sanitized survey result
      ansible.builtin.assert:
        that:
          - (_log_source_report.stdout | from_json).status == 'observed'
        fail_msg: >-
          Receiver log-source metadata is unavailable
          ({{ ((_log_source_report.stdout | from_json).reason | default('unclassified'))
          if ((_log_source_report.stdout | from_json).reason | default('unclassified'))
          in _survey_refusal_reasons else 'unclassified' }}); no source is assumed.
        quiet: true
      tags: [always]

    - name: Report bounded log-source categories and counts
      ansible.builtin.debug:
        msg: "{{ _log_source_report.stdout | from_json }}"
      changed_when: false
      tags: [always]
