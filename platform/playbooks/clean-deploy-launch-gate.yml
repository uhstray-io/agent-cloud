---
# clean-deploy-launch-gate.yml — Destroy and redeploy the launch gate from scratch.
#
# The gate holds no database and no state of its own: its containers go, and the rendered inputs (.env,
# config.json, certs/) are re-rendered by the deploy. The caller and Semaphore tokens come back from OpenBao
# unchanged, and the server leaf is re-issued (or kept if the one on disk is still current, see
# deploy-launch-gate.yml). Local-dev shares one deploy tree, so the clone is NOT removed (clean-service.yml
# branches on local_mode).
#
# Uses composable tasks/clean-service.yml then runs deploy-launch-gate.yml.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Clean launch-gate deployment"
  hosts: launch_gate_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
  tasks:
    - name: "Destroy existing deployment"
      ansible.builtin.include_tasks: tasks/clean-service.yml

- name: "Fresh deploy"
  import_playbook: deploy-launch-gate.yml
  vars:
    _extra_var_guard_nested: true
