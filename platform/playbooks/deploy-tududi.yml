---
# deploy-tududi.yml — self-hosted to-do app (tududi) deploy (composable).
#
# Phase 1: Place repo + manage-secrets (session secret + break-glass admin
#          password — generated once into OpenBao, reused thereafter; OIDC client
#          secret shared-read from authentik, which owns it) + template .env.
# Phase 2: deploy.sh — container lifecycle (pull, up, wait healthy; first boot
#          creates the SQLite schema).
# Phase 3: Verify the container is healthy + /api/health answers.
#
# tududi is a single rootless-podman container (SQLite) with native OIDC to
# Authentik (blueprints/tududi-oidc.yaml, applied by Deploy Authentik). Caddy +
# inventory are wired separately (see the plan).
# Plan: plan/development/11-tududi-honcho-deployment.md (Service A — tududi).

# ── Phase 1: Place repo + secrets + env ─────────────────────────────────────
- name: "Phase 1: Place repo + manage tududi secrets"
  hosts: tududi_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # session_secret + break-glass admin password must be STABLE across redeploys
    # (a new session secret invalidates every logged-in session) — manage-secrets
    # generates once into OpenBao and reuses on later runs.
    _secret_definitions:
      - { name: tududi_session_secret, type: random, length: 64 }
      - { name: tududi_admin_password, type: random, length: 24 }
    # The OIDC client secret is owned by authentik (the IdP). Read it (read-only)
    # so tududi's OIDC_CLIENT_SECRET matches the value tududi-oidc.yaml injected
    # into the provider via !Env. Never stored back under secret/services/tududi.
    _shared_reads:
      - { from_service: authentik, read_keys: [tududi_oidc_client_secret] }
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }

  tasks:
    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    # Rootless podman is daemonless — without user lingering the container stops
    # for good on a VM reboot (05-platform-infra §11). enable-linger self-gates
    # on local_mode (local-dev uses the developer's podman machine).
    - name: "Enable rootless linger so tududi survives a reboot"
      ansible.builtin.include_tasks: tasks/enable-linger.yml

    - name: "Manage secrets and template env file"
      ansible.builtin.include_tasks: tasks/manage-secrets.yml

    # tududi's Node backend does server-side OIDC discovery/token calls to the
    # IdP at https://auth.<zone>:8443 (step-ca-minted leaf) — distribute the
    # step-ca trust bundle into ./certs; compose.local.yml mounts it and sets
    # NODE_EXTRA_CA_CERTS. Local-only (prod IdP uses its own trust chain).
    - name: "Distribute the step-ca root for OIDC TLS trust (local)"
      ansible.builtin.include_tasks: tasks/distribute-ca-root.yml
      vars:
        _ca_root_dest_dir: "{{ _deploy_dir }}"
        _ca_engine: "{{ container_engine | default('podman') }}"
      when: local_mode | default(false) | bool

    - name: "Create convenience symlink ~/tududi -> deploy dir"
      # Points ~/tududi at the deployment dir in the composable monorepo clone.
      ansible.builtin.file:
        src: "{{ _deploy_dir }}"
        dest: "{{ local_home_dir | default('/home/' ~ (ansible_user | default('deploy')), true) }}/{{ service_name }}"
        state: link
        force: true
      register: _symlink_result
      # Best-effort: tolerate a permission-denied home, surface any other failure.
      failed_when: >-
        _symlink_result is failed
        and 'permission denied' not in (_symlink_result.msg | default('') | lower)

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start tududi"
  hosts: tududi_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        # Force the compose provider on the Mac-direct genesis path; empty on the
        # Semaphore path (detect_runtime derives it). NOT default(omit) — omit
        # leaks its placeholder into environment (rc 127).
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
      register: _deploy
      changed_when: true

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
- name: "Phase 3: Verify tududi"
  hosts: tududi_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    - name: "Container health (GET /api/health -> 200, inside the container)"
      # Exec inside the container so the check never depends on the published
      # bind/port or the central Caddy. node is guaranteed in the (Node) image;
      # exit 0 only on HTTP 200 from the unauthenticated /api/health endpoint.
      # setTimeout(5000) bounds the probe: ansible.builtin.command has no
      # task-level timeout and http.get has no default request timeout, so a
      # stuck /api/health would hang the whole deploy. On timeout, destroy the
      # request and exit non-zero so `until`/`retries` re-probes instead.
      ansible.builtin.command: >-
        {{ _engine }} exec tududi
        node -e "const http=require('http');const req=http.get('http://127.0.0.1:3002/api/health',r=>process.exit(r.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});"
      register: _tududi_health
      changed_when: false
      retries: 10
      delay: 6
      until: _tududi_health.rc == 0

    - name: "Report"
      ansible.builtin.debug:
        msg: "tududi healthy — container up, /api/health answering on :3002 (behind Caddy for TLS)."
