# copy-openbao-fields.yml — copy OpenBao KV-v2 fields between paths, server side, as code.
#
# platform/playbooks/vars/copied-secret-fields.yml declares each copy. A value goes from its source
# field to its target field inside the store: this playbook's own Ansible process reads it and writes
# it, in memory. It is never printed, never written to a file, and never carried through a workstation,
# so the value does not leave OpenBao on the way to its new path.
#
# Order, and why:
#   1. Extra vars that set internal names are refused (refuse-internal-extra-vars.yml).
#   2. The declaration is checked for shape before OpenBao is reached: at least one entry; each path as
#      services/<name>; each field a lowercase name; no entry that copies a field onto itself; no target
#      (path, field) named by two entries; no entry whose source (path, field) is another entry's target (a
#      chained copy, whose source is read before that write). A refusal names the entry and changes nothing.
#   3. The transport guard, then the AppRole login. The login is a credential task (no_log).
#   4. Each source path and each target path is read. The reads also run in check mode. Every entry is
#      then planned into exactly one state, from the live values and vars/retired-secret-fields.yml. A source
#      that is missing (its path or field absent, or its value empty) is decided first: when its (path, field)
#      is listed as retired, the retirement decides it, otherwise it is source-missing. Only a source that is
#      not missing reaches the target checks, so a retired source that still holds a value is planned by the
#      same rules as any other source.
#        source-retired                 the source is missing and listed as retired, and the target field holds a
#                                       value other than '' (a no-op: the source is gone, so nothing is compared)
#        source-retired-target-missing  the source is missing and listed as retired, and the target field is absent or ''
#        source-missing                 the source is missing and not listed as retired
#        pending                        the target path is absent, or the target field is absent (the copy writes it)
#        copied                         the target field already holds the source value (no write)
#        conflict                       the target field holds a different value, an empty one included
#      Presence is key membership, not truthiness. The comparison runs in a no_log step, so only field
#      NAMES and states reach the output.
#   5. A source-missing, source-retired-target-missing or conflict entry refuses the whole run before any
#      write. A conflict is never overwritten: the target may already own a value that differs from the
#      declared source.
#   6. On a live run only, each pending entry is written through tasks/bao-merge-keys.yml. A target path
#      that is absent is created (a compare-and-swap with cas 0). An existing one takes a version-checked
#      update that keeps every sibling field, and _bm_guard_absent_keys makes the write refuse if the
#      target field is present in the read it is based on.
#   7. Each pending target is read back, and it must equal its source value. The run fails if one does not.
#
# Check mode is a dry run: the plan is printed; the merge, the read-back and its comparison are skipped.
# Run the Dev template in Semaphore's Dry run first, and read the plan.
#
# Known limit: the value written is the one read at plan time (step 4). A source rotated between that read
# and the write is copied at its earlier value. The read-back in step 7 compares each target with that same
# plan-time read, so it proves the copy matches the plan, not that it matches the source as it stands when
# the run ends. A run that must carry a rotated value runs again after the rotation.
#
# OpenBao is reached at openbao_addr, as the shared-environment playbooks read it, else at the single host
# of the openbao_svc group. The AppRole comes from BAO_ROLE_ID / BAO_SECRET_ID, or the bao_role_id /
# bao_secret_id extra vars the other OpenBao playbooks accept. Field values are never printed.

- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Copy declared OpenBao KV-v2 fields between paths"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    _copied: "{{ (lookup('file', playbook_dir ~ '/vars/copied-secret-fields.yml') | from_yaml).copied_secret_fields | default([], true) }}"
    # The retired fields (vars/retired-secret-fields.yml). A missing file reads as nothing retired, as does an empty
    # list. That fails closed: a copy whose source is then gone plans source-missing and refuses.
    _retired_file: "{{ playbook_dir ~ '/vars/retired-secret-fields.yml' }}"
    _retired: "{{ ((lookup('file', _retired_file) if _retired_file is exists else '') | from_yaml).retired_secret_fields | default([], true) }}"
    # Each retired (path, field) as services/<svc>/<field>: the form a copy's source is compared in.
    _retired_sources: "{{ _retired_sources_json | from_json }}"
    _retired_sources_json: >-
      {% set sources = [] %}
      {% for r in _retired %}{% for f in r.fields %}{% set _ = sources.append(r.path ~ '/' ~ f) %}{% endfor %}{% endfor %}
      {{ sources | to_json }}
    # openbao_addr first, as the shared-environment playbooks read it (see retire-openbao-fields.yml for why).
    # The inventory's single openbao_svc host stays the fallback for an environment without it.
    _bao_url: "{{ openbao_addr | default(hostvars[(groups['openbao_svc'] | default([]) | first)].service_url | default('') if (groups['openbao_svc'] | default([]) | length == 1) else '', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Require a well-formed declaration (paths, field names, no empty list, no self-copy, no shared target)"
      ansible.builtin.assert:
        that:
          - _copied | length > 0
          - _copied | map(attribute='from_path') | select('match', '^services/[a-z0-9-]+$') | list | length == _copied | length
          - _copied | map(attribute='to_path') | select('match', '^services/[a-z0-9-]+$') | list | length == _copied | length
          - _field_names | select('match', '^[a-z][a-z0-9_]*$') | list | length == _field_names | length
          - _problems | length == 0
        fail_msg: >-
          platform/playbooks/vars/copied-secret-fields.yml must list at least one copy, each path as
          services/<name>, each field a lowercase name, no entry that copies a field onto itself, no
          target named by two entries, and no copy from a field another entry writes (a chained copy).
          Nothing was changed: {{ _problems | to_json }}
      vars:
        _field_names: "{{ (_copied | map(attribute='from_field') | list) + (_copied | map(attribute='to_field') | list) }}"
        _problems: "{{ _problems_json | from_json }}"
        _problems_json: >-
          {% set problems = [] %}
          {% set targets = [] %}
          {% for entry in _copied %}
          {% set target = entry.to_path ~ '/' ~ entry.to_field %}
          {% if target in targets %}
          {% set _ = problems.append('target ' ~ target ~ ' is named by two entries') %}
          {% endif %}
          {% set _ = targets.append(target) %}
          {% endfor %}
          {% for entry in _copied %}
          {% set source = entry.from_path ~ '/' ~ entry.from_field %}
          {% set target = entry.to_path ~ '/' ~ entry.to_field %}
          {% if source == target %}
          {% set _ = problems.append('copies ' ~ target ~ ' onto itself') %}
          {% endif %}
          {# A chained copy reads a source that another entry writes. The plan reads every source before any write, so that
             entry would copy the value the field held before the run, not the one written here. Refused, not ordered. #}
          {% if source != target and source in targets %}
          {% set _ = problems.append('copies ' ~ source ~ ', which another entry writes (chained copy)') %}
          {% endif %}
          {% endfor %}
          {{ problems | to_json }}

    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body: { role_id: "{{ _bao_role_id }}", secret_id: "{{ _bao_secret_id }}" }
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      changed_when: false
      check_mode: false
      no_log: true

    - name: "Read each source path (a read, also in check mode; the values are never printed)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ item.from_path }}"
        method: GET
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        # 404: the source path does not exist, which plans the entry as source-missing (source-retired when it is retired).
        status_code: [200, 404]
      loop: "{{ _copied }}"
      loop_control:
        label: "{{ item.from_path }}"
      register: _src_reads
      delegate_to: localhost
      changed_when: false
      check_mode: false
      no_log: true

    - name: "Read each target path (a read, also in check mode; the values are never printed)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ item.to_path }}"
        method: GET
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        # 404: the target path does not exist, which plans the entry as pending.
        status_code: [200, 404]
      loop: "{{ _copied }}"
      loop_control:
        label: "{{ item.to_path }}"
      register: _dst_reads
      delegate_to: localhost
      changed_when: false
      check_mode: false
      no_log: true

    - name: "Plan each copy from the live state (states and field NAMES only; values are compared here, never printed)"
      ansible.builtin.set_fact:
        _plan: "{{ _plan_json | from_json }}"
      vars:
        # Indexed by loop position: result i is the read of declared entry i, for both the source and the target.
        _plan_json: >-
          {% set plan = [] %}
          {% for entry in _copied %}
          {% set src = _src_reads.results[loop.index0] %}
          {% set dst = _dst_reads.results[loop.index0] %}
          {% set src_held = (src.json.data.data | default({}, true)) if src.status == 200 else {} %}
          {% set dst_held = (dst.json.data.data | default({}, true)) if dst.status == 200 else {} %}
          {% set src_value = src_held[entry.from_field] if entry.from_field in src_held else none %}
          {% set dst_value = dst_held[entry.to_field] if entry.to_field in dst_held else none %}
          {# A missing source is decided by the retirement when its (path, field) is listed as retired: the source is gone, so nothing is compared. #}
          {% if src_value is none or src_value == '' %}
          {% if (entry.from_path ~ '/' ~ entry.from_field) in _retired_sources %}
          {% if dst_value is none or dst_value == '' %}
          {% set state = 'source-retired-target-missing' %}
          {% else %}
          {% set state = 'source-retired' %}
          {% endif %}
          {% else %}
          {% set state = 'source-missing' %}
          {% endif %}
          {% elif entry.to_field not in dst_held %}
          {% set state = 'pending' %}
          {% elif dst_held[entry.to_field] == src_value %}
          {% set state = 'copied' %}
          {% else %}
          {% set state = 'conflict' %}
          {% endif %}
          {% set _ = plan.append({'index': loop.index0, 'from_path': entry.from_path, 'from_field': entry.from_field, 'to_path': entry.to_path, 'to_field': entry.to_field, 'state': state}) %}
          {% endfor %}
          {{ plan | to_json }}
      no_log: true

    - name: "Report the plan (paths, fields and states; no values)"
      ansible.builtin.debug:
        msg:
          - "{{ 'Dry run (check mode): nothing is written.' if ansible_check_mode else 'Live run.' }}"
          - >-
            {% for p in _plan %}{{ p.to_path }}/{{ p.to_field }} from {{ p.from_path }}/{{ p.from_field }}: {{ p.state }}{{ '; ' if not loop.last }}{% endfor %}

    - name: "Refuse a copy whose source is missing or retired without its target held, or whose target holds a different value (before any write)"
      ansible.builtin.assert:
        that: _blocked | length == 0
        fail_msg: >-
          Nothing was written. A copy is refused when its source is missing, when its source is retired and its
          target holds no value, or when its target holds a different value (names and states only):
          {{ _blocked | to_json }}
      vars:
        _blocked: "{{ _plan | selectattr('state', 'in', ['source-missing', 'source-retired-target-missing', 'conflict']) | list }}"

    - name: "Write each pending target (live only: a version-checked merge per target, verified by the shared task)"
      # The shared task owns the write and its own verify. It runs only for a pending entry, so the target is
      # never overwritten: the guard refuses a target field that is present in the read it is based on.
      ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
      vars:
        _bm_url: "{{ _bao_url }}"
        _bm_token: "{{ _bao_auth.json.auth.client_token }}"
        _bm_path: "{{ item.to_path }}"
        _bm_data: "{{ {item.to_field: _src_reads.results[item.index].json.data.data[item.from_field]} }}"
        _bm_on_missing: create
        _bm_guard_absent_keys: ["{{ item.to_field }}"]
      loop: "{{ _plan | selectattr('state', 'equalto', 'pending') | list }}"
      loop_control:
        label: "{{ item.to_path }}"
      when: not ansible_check_mode

    - name: "Read each pending target back (live only; the values are never printed)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ item.to_path }}"
        method: GET
        follow_redirects: none
        unredirected_headers: [X-Vault-Token]
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      loop: "{{ _plan | selectattr('state', 'equalto', 'pending') | list }}"
      loop_control:
        label: "{{ item.to_path }}"
      register: _dst_readback
      delegate_to: localhost
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: "Compare each pending target with its source after the write (names only)"
      ansible.builtin.set_fact:
        _copy_unequal: "{{ _copy_unequal_json | from_json }}"
      vars:
        # Second line of defence, behind tasks/bao-merge-keys.yml, which already reads back the keys it merged in
        # the same run. This comparison is against the source as read at plan time (the known limit in the
        # header), so it catches a write that landed on the wrong value, not a source rotated after the plan.
        # Indexed by loop position over the same pending list the read-back looped over.
        _copy_unequal_json: >-
          {% set bad = [] %}
          {% for p in _plan | selectattr('state', 'equalto', 'pending') | list %}
          {% set read = _dst_readback.results[loop.index0] %}
          {% set held = (read.json.data.data | default({}, true)) if read.status == 200 else {} %}
          {% set src_value = _src_reads.results[p.index].json.data.data[p.from_field] %}
          {% if not (p.to_field in held and held[p.to_field] == src_value) %}
          {% set _ = bad.append({'to_path': p.to_path, 'to_field': p.to_field}) %}
          {% endif %}
          {% endfor %}
          {{ bad | to_json }}
      no_log: true
      when: not ansible_check_mode

    - name: "Require every pending target to equal its source after the write (names only)"
      ansible.builtin.assert:
        that: _copy_unequal | length == 0
        fail_msg: "A copied field does not equal its source after the write, so the copy is incomplete (names only): {{ _copy_unequal | to_json }}"
      when: not ansible_check_mode

    - name: "Summarise the copy"
      ansible.builtin.debug:
        msg:
          - "Mode: {{ 'dry run (check mode), nothing written' if ansible_check_mode else 'live' }}"
          - >-
            {{ 'Would be written' if ansible_check_mode else 'Written' }}:
            {% for p in _plan if p.state == 'pending' %}{{ p.to_path }}/{{ p.to_field }}{{ ', ' if not loop.last }}{% else %}none{% endfor %}
          - >-
            Already copied (no-op): {% for p in _plan if p.state == 'copied' %}{{ p.to_path }}/{{ p.to_field }}{{ ', ' if not loop.last }}{% else %}none{% endfor %}
          - >-
            Source retired, target held (no-op): {% for p in _plan if p.state == 'source-retired' %}{{ p.to_path }}/{{ p.to_field }}{{ ', ' if not loop.last }}{% else %}none{% endfor %}
