---
# deploy-orb-agent.yml — Standalone Orb Agent deployment
#
# Independent workflow — runs after netbox deploy or on its own.
# Creates fresh Diode credentials, fetches orb-agent AppRole from OpenBao,
# templates agent.yaml, starts the privileged orb-agent container.
#
# Run via Semaphore: "Deploy Orb Agent" template

- name: "Manage Diode credentials"
  hosts: netbox_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Local-dev: confine discovery to local networks (or disable it)"
      # platform/netbox-local: a laptop never scans or syncs beyond local-dev.
      ansible.builtin.include_tasks: tasks/assert-local-discovery-scope.yml
      when: local_mode | default(false) | bool

    # Disabling discovery converges to NO agent: one left from an earlier run with targets would
    # keep scanning with its old configuration while this run reports discovery disabled
    # (PR 195 Codex review). Local-only: production never takes this path.
    - name: "Local-dev, discovery disabled: remove a previously started orb agent"
      ansible.builtin.shell: |
        if {{ container_engine | default('podman') }} container inspect netbox-orb-agent >/dev/null 2>&1; then
          {{ container_engine | default('podman') }} rm -f netbox-orb-agent >/dev/null && echo removed
        fi
      register: _orb_removed
      changed_when: "'removed' in _orb_removed.stdout"
      when:
        - not ansible_check_mode
        - local_mode | default(false) | bool
        - not (_local_discovery_enabled | default(false) | bool)

    - name: "Local-dev: stop here when no local discovery target is declared"
      ansible.builtin.meta: end_host
      when:
        - local_mode | default(false) | bool
        - not (_local_discovery_enabled | default(false) | bool)

    - name: "Manage Diode orb-agent credentials"
      ansible.builtin.include_tasks: tasks/manage-diode-credentials.yml

- name: "Template agent config and deploy"
  hosts: netbox_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

    _branch: "{{ service_branch | default('main') }}"

  tasks:
    - name: "Local-dev: stop here when local discovery is disabled (decided in play 1)"
      ansible.builtin.meta: end_host
      when:
        - local_mode | default(false) | bool
        - not (_local_discovery_enabled | default(false) | bool)

    - name: "Place the monorepo (clone in production, copy the working tree in local-dev)"
      # Was a bare git clone, which in local-dev would overwrite the placed working tree.
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Fetch orb-agent AppRole credentials from OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/approles/orb-agent"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200]
      register: _orb_approle_resp
      delegate_to: localhost
      no_log: true
      check_mode: false

    - name: "Set orb-agent AppRole facts"
      ansible.builtin.set_fact:
        _orb_approle: "{{ _orb_approle_resp.json.data.data }}"
      no_log: true

    - name: "Template agent.yaml with orb-agent AppRole"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/{{ service_name }}/deployment/templates/agent.yaml.j2"
        dest: "{{ _deploy_dir }}/discovery/agent.yaml"
        mode: "0644"

    - name: "Deploy Orb Agent"
      ansible.builtin.include_tasks: tasks/deploy-orb-agent.yml
