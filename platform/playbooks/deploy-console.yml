---
# deploy-console.yml — the Dispatch Console deploy (composable).
#
# Phase 1: Production guard on the console_svc host vars (skipped for local_mode), transport guard on
#          the OpenBao endpoint, then place the repo, create config/, and manage-secrets. The console's
#          own secret is its Semaphore API token, which this play
#          reads and never generates: Provision Console Semaphore Access (provision-console-semaphore-access.yml)
#          creates it, and this play stops before any write when it is absent. The OIDC client secret
#          is shared-read from authentik, which owns it. Template .env, config/scope.json and
#          config/workflow.json (the service-onboarding registry's steps: id, order, owner, label),
#          config/flows.json (the D24 edges, names only), config/proxmox-ca.pem (always, empty when unset) and
#          config/gateway.json (task 8.3a: the agentgateway clients, budgets and models, names and figures only; always,
#          empty lists when no agentgateway_svc host). The gateway file reads the agentgateway host's vars through the
#          _console_gw_* expressions below, never a key, a client_<name> field, an address or a port. Also
#          config/role-map.json (always; the Access page's role map, from vars/access-role-map.yml). Also
#          config/catalog.json (always; the Request a service page's list, 8.4 D38: names and host counts from the deploy
#          templates in platform/semaphore/templates.yml, never an address). The Authentik
#          directory token (8.2b) is shared-read only when console_authentik_api_url is set.
#          Phase 3 (D22-D24) reads NetBox and Proxmox only when their URL vars are set, and refuses a
#          netbox_site slug declared on two sites or a private key given as the Proxmox CA.
#          The console's own AppRole (D27) is shared-read only when console_openbao_url is set. The Grafana Viewer
#          token (D26) is shared-read only when console_grafana_api_enabled is true AND console_grafana_url is set;
#          console_grafana_url alone is only the deep-link base and reads nothing. The Policy page's GitHub repo and ref
#          (D36) render with the OpenBao block, and a value the console would refuse is refused here by name.
# Phase 2: deploy.sh — builds the image on THIS host from platform/services/console (there is no
#          registry), then container lifecycle (compose_up_if_changed, wait healthy).
# Phase 3: Verify inside the container: `probe /healthz 200`, and an unauthenticated `/v1/me`
#          answers 401 (Phase 1 acceptance: the API refuses without a session).
#
# The runtime image is distroless, so the probes run the binary's own `probe` subcommand. No shell
# and no curl are assumed.
#
# Order: Deploy Authentik must have run first. It owns `console_oidc_client_secret` in
# secret/services/authentik; without it, the shared read below stops this play by name.
# Plan: plan/development/17-dispatch-console.md (Phase 1 — skeleton, login and deployment path).

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# A play over no hosts exits 0 and records a deploy that did nothing as a success
# (docs/MISTAKES.md 2.21), so refuse an absent or empty group first.
- name: "Pre-flight: console_svc is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: console_svc
    # Paired so one `-e preflight_group=` cannot redirect the guard (MISTAKES 2.21).
    preflight_group_expected: console_svc

# ── Phase 1: Place repo + secrets + config ──────────────────────────────────
- name: "Phase 1: Place repo + manage console secrets and config"
  hosts: console_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    # rotate-console-credentials.yml pins its run to the deployed commit with _console_pinned_branch. An extra var
    # cannot set that name (the guard refuses internal names). Otherwise the survey's service_branch, default main.
    _branch: "{{ _console_pinned_branch | default(service_branch | default('main')) }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # The Semaphore API token is provisioned by provision-console-semaphore-access.yml (the svc-console
    # account, guest role) and only READ here: type `existing` never generates it. A missing token fails
    # before any write, because manage-secrets checks _required_existing_secrets first. manage-secrets
    # words that failure generically; this comment names the play that creates the token.
    _secret_definitions:
      - { name: semaphore_api_token, type: existing }
    _required_existing_secrets: [semaphore_api_token]
    # The OIDC client secret is owned by authentik (the IdP). Read it read-only so the console's
    # CONSOLE_OIDC_CLIENT_SECRET matches the value the console provider was created with. It is
    # never stored back under secret/services/console.
    # Phase 3 reads (D22). Each is read only when its URL var is set: a deploy without them stays
    # "unconfigured" and needs no token. A set URL with its token missing fails the shared read by name.
    _console_oidc_reads:
      - { from_service: authentik, read_keys: [console_oidc_client_secret] }
    _console_netbox_reads: >-
      {{ [{'from_service': 'netbox', 'read_keys': ['console_api_token']}]
         if (console_netbox_url | default('', true) | string | trim | length) > 0 else [] }}
    _console_proxmox_reads: >-
      {{ [{'from_service': 'proxmox', 'read_keys': ['console_token_id', 'console_token']}]
         if (console_proxmox_url | default('', true) | string | trim | length) > 0 else [] }}
    # The console's own AppRole (D27): role_id and secret_id, read only when console_openbao_url is set. Written by
    # provision-console-approle.yml and rotated by rotate-console-credentials.yml; this play only reads them.
    _console_openbao_reads: >-
      {{ [{'from_service': 'approles/console', 'read_keys': ['role_id', 'secret_id']}]
         if (console_openbao_url | default('', true) | string | trim | length) > 0 else [] }}
    # The Grafana Viewer token (D26): read only when console_grafana_api_enabled is true AND console_grafana_url is
    # set (env.j2 renders it on the same two). provision-console-grafana-token.yml must have stored it, or the
    # shared read fails by name.
    _console_grafana_reads: >-
      {{ [{'from_service': 'o11y', 'read_keys': ['console_grafana_token']}]
         if (console_grafana_api_enabled | default(false) | bool)
            and (console_grafana_url | default('', true) | string | trim | length) > 0 else [] }}
    # The Authentik directory token (Access page, 8.2b): a view-only service account's token, read only when
    # console_authentik_api_url is set (env.j2 renders CONSOLE_AUTHENTIK_URL and CONSOLE_AUTHENTIK_TOKEN on the same
    # condition). A separate entry from the OIDC read above, which always runs; manage-secrets loops entry by entry.
    _console_authentik_directory_reads: >-
      {{ [{'from_service': 'authentik', 'read_keys': ['console_directory_token']}]
         if (console_authentik_api_url | default('', true) | string | trim | length) > 0 else [] }}
    _shared_reads: "{{ _console_oidc_reads + _console_netbox_reads + _console_proxmox_reads + _console_openbao_reads + _console_grafana_reads + _console_authentik_directory_reads }}"
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }
      # Not secrets, so 0644. config/ is created below before manage-secrets templates into it.
      - { src: scope.json.j2, dest: config/scope.json, mode: "0644" }
      # The steps the console labels a skynet run with, rendered from the registry so the console never
      # keeps a second copy of the step list.
      - { src: workflow.json.j2, dest: config/workflow.json, mode: "0644" }
      # The data-flow edges (D24), names only: from the authentik, caddy and o11y declarations below.
      - { src: flows.json.j2, dest: config/flows.json, mode: "0644" }
      # The Proxmox CA (public PEM from console_proxmox_ca_pem). Always rendered, empty when unset, so the
      # compose bind mount always has a file; CONSOLE_PROXMOX_CA_FILE is set only when the PEM is set.
      - { src: proxmox-ca.pem.j2, dest: config/proxmox-ca.pem, mode: "0644" }
      # The agentgateway clients, budgets and models (task 8.3a), names and figures only. Always rendered: empty
      # lists when no agentgateway_svc host exists. Bind-mounted read-only (compose.yml); deploy.sh hashes it.
      - { src: gateway.json.j2, dest: config/gateway.json, mode: "0644" }
      # The Access page's role map (8.2b): the authoritative table as data, always rendered. Not a secret.
      - { src: role-map.json.j2, dest: config/role-map.json, mode: "0644" }
      # The Request a service page's list (8.4, D38): names and host counts only, always rendered (an empty list when no
      # deploy template qualifies). Bind-mounted read-only (compose.yml); deploy.sh hashes it.
      - { src: catalog.json.j2, dest: config/catalog.json, mode: "0644" }
    # The role map (8.2b) is read on the controller. Its source is pinned against the authoritative table in
    # plan/architecture/04-credentials-access.md by platform/tests/test_console_access_role_map.py.
    _access_role_map: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/vars/access-role-map.yml') | from_yaml }}"
    # The deploy templates the Request a service page lists (8.4, D38), read on the controller. catalog.json.j2 keeps
    # the `Deploy <name>` templates whose playbook is deploy-<service>.yml (not Deploy All Services), counts each
    # service's hosts in the group its playbook targets (else <service>_svc), and keeps one entry per service.
    # NOT a rotation pin: templates.yml changes many times a week, and the catalog holds names and counts, not code.
    # Pinning it would make the monthly rotation refuse, and the secret_id would expire while the rotation waited.
    _console_catalog_templates: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../semaphore/templates.yml') | from_yaml).templates }}"
    # Flow inputs (D24). The authentik apps mirror deploy-authentik.yml: an undefined authentik_apps on the
    # authentik host means the whole catalog, and an explicit [] is an empty selection. No authentik host
    # means no oidc edges. Only names are read: never an address, never a port.
    _console_authentik_catalog: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../services/authentik/deployment/app-catalog.yml') | from_yaml).authentik_app_catalog }}"
    _console_authentik_apps: >-
      {{ (hostvars[groups['authentik_svc'][0]].authentik_apps | default(_console_authentik_catalog.keys() | list))
         if (groups['authentik_svc'] | default([]) | length > 0) else [] }}
    _console_caddy_sites: "{{ (hostvars[groups['caddy_svc'][0]].caddy_managed_sites | default('', true) | string) if (groups['caddy_svc'] | default([]) | length > 0) else '' }}"
    _console_o11y_targets: "{{ (hostvars[groups['o11y_svc'][0]].o11y_expected_metrics_targets | default([])) if (groups['o11y_svc'] | default([]) | length > 0) else [] }}"
    # The agentgateway clients, budgets and models for config/gateway.json (task 8.3a). Each expression reads the
    # agentgateway host's own vars and applies the same default the gateway's config.yaml.j2 applies, so the file
    # carries what the gateway enforces. Only these named vars are read: no key, no client_<name> field, no address,
    # no port. No agentgateway_svc host means an empty list or the gateway's own default, and gateway.json.j2 renders
    # empty lists. _console_gw_host is '' then, so the hostvars lookups are never evaluated.
    # The console reads the FIRST agentgateway_svc host (single-gateway topology; prod has one host).
    _console_gw_host: "{{ groups['agentgateway_svc'][0] if (groups['agentgateway_svc'] | default([]) | length > 0) else '' }}"
    _console_gw_clients: "{{ hostvars[_console_gw_host].agw_clients | default([]) if (_console_gw_host | length > 0) else [] }}"
    _console_gw_policies: "{{ hostvars[_console_gw_host].agw_client_policies | default({}) if (_console_gw_host | length > 0) else {} }}"
    _console_gw_tiers: "{{ hostvars[_console_gw_host].agw_tier_tokens_per_hour | default({}) if (_console_gw_host | length > 0) else {} }}"
    _console_gw_default_tokens: "{{ hostvars[_console_gw_host].agw_rate_tokens_per_hour | default(2000000) if (_console_gw_host | length > 0) else 2000000 }}"
    _console_gw_models: "{{ hostvars[_console_gw_host].agw_models | default([]) if (_console_gw_host | length > 0) else [] }}"
    _console_gw_openrouter_identities: "{{ hostvars[_console_gw_host].agw_openrouter_identities | default([]) if (_console_gw_host | length > 0) else [] }}"
    _console_gw_openrouter_admins: "{{ hostvars[_console_gw_host].agw_openrouter_admins | default(false) if (_console_gw_host | length > 0) else false }}"
    _console_gw_admin_gate: "{{ hostvars[_console_gw_host].agw_admin_identities_enabled | default(false) if (_console_gw_host | length > 0) else false }}"
    _console_gw_platform_admins: "{{ hostvars[_console_gw_host].platform_admins | default([]) if (_console_gw_host | length > 0) else [] }}"
    # The service-onboarding workflow registry: the one definition of the steps (read on the controller).
    _workflow_registry: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../workflows/service-onboarding/registry.yml') | from_yaml }}"
    # The console_svc host vars a production console cannot run without. The guard task below checks them.
    _console_prod_required:
      - console_base_url
      - console_oidc_issuer
      - console_semaphore_api_url
      - console_semaphore_ui_url
      - console_semaphore_project

  tasks:
    # GUARD: refuse a production deploy before anything is written, when a console_svc host var is unset,
    # empty or still an agent-cloud.test (local-dev) value. Mirrors the Authentik promotion guard in
    # deploy-authentik.yml. Skipped for local_mode: local-dev runs on the agent-cloud.test defaults.
    # Brace check: an unrendered "{{ ... }}" value would pass the other two checks with its braces intact.
    - name: "Production guard: the console's host vars are set and not local-dev defaults"
      ansible.builtin.assert:
        that:
          - "(lookup('vars', item, default='')) | string | length > 0"
          - "'agent-cloud.test' not in (lookup('vars', item, default='') | string)"
          - "('{' ~ '{') not in (lookup('vars', item, default='') | string)"
        fail_msg: >-
          Production guard: console_svc host var '{{ item }}' must be set to a production value
          (in site-config), not empty, not an agent-cloud.test default and not an unresolved
          template. Refusing to deploy the console.
        quiet: true
      loop: "{{ _console_prod_required }}"
      when: not (local_mode | default(false) | bool)

    # A netbox_site slug names one NetBox site. Two sites claiming it would join one site's NetBox
    # clusters and VMs under another (D23: a wrong join shows another site's hosts), so refuse before
    # anything is rendered or placed. A site without the key is "not mapped" and is not checked here. A
    # site that declares the key must declare a non-empty string slug with no whitespace; anything else is a
    # named error, never silently ignored.
    - name: "Collect the sites that declare netbox_site across console_tenants"
      ansible.builtin.set_fact:
        _console_netbox_sites: >-
          {{ console_tenants | default([]) | selectattr('orgs', 'defined') | map(attribute='orgs') | flatten
             | selectattr('sites', 'defined') | map(attribute='sites') | flatten
             | selectattr('netbox_site', 'defined') | list }}

    - name: "Collect the netbox_site slugs declared across console_tenants"
      ansible.builtin.set_fact:
        _console_netbox_site_slugs: "{{ _console_netbox_sites | map(attribute='netbox_site') | list }}"

    - name: "Refuse an empty or null netbox_site"
      ansible.builtin.assert:
        that: item.netbox_site is not none and (item.netbox_site | string | trim | length) > 0
        fail_msg: "netbox_site is empty on site '{{ item.id | default('?') }}' (null or blank). Give it a NetBox site slug, or remove the key."
        quiet: true
      loop: "{{ _console_netbox_sites }}"

    - name: "Refuse a netbox_site that is not a string"
      ansible.builtin.assert:
        that: item.netbox_site is string
        fail_msg: "netbox_site on site '{{ item.id | default('?') }}' must be a string slug."
        quiet: true
      loop: "{{ _console_netbox_sites }}"

    # Compared exactly as written: a slug is refused, never trimmed, if it carries whitespace of any kind.
    - name: "Refuse a netbox_site with surrounding or internal whitespace"
      ansible.builtin.assert:
        that: (item.netbox_site | trim == item.netbox_site) and (item.netbox_site.split() | length == 1)
        fail_msg: "netbox_site on site '{{ item.id | default('?') }}' has surrounding or internal whitespace. A NetBox slug carries none."
        quiet: true
      loop: "{{ _console_netbox_sites }}"

    # One assert per unique slug: a slug declared twice fails its own iteration and is named. (A set_fact
    # accumulator inside a loop does not carry across items, so it cannot collect the duplicates.)
    - name: "Refuse a netbox_site slug declared on more than one site"
      ansible.builtin.assert:
        that: (_console_netbox_site_slugs | select('equalto', item) | list | length) == 1
        fail_msg: >-
          console_tenants declares netbox_site '{{ item }}' on more than one site (each slug names one NetBox
          site). Give each site its own slug.
        quiet: true
      loop: "{{ _console_netbox_site_slugs | unique | list }}"

    # The Proxmox CA is public: a certificate only. A private key pasted here would be rendered into a
    # file the container mounts, so refuse one by name before anything is rendered.
    - name: "Refuse a Proxmox CA that is not a public certificate"
      ansible.builtin.assert:
        that:
          - (console_proxmox_ca_pem | default('', true) | string | length) == 0 or '-----BEGIN CERTIFICATE-----' in (console_proxmox_ca_pem | string)
          - "'PRIVATE KEY' not in (console_proxmox_ca_pem | default('', true) | string)"
        fail_msg: "console_proxmox_ca_pem must be the public CA certificate (BEGIN CERTIFICATE), never a private key."
        quiet: true

    # The Grafana API switch and its URL are one feature: the token is rendered and read only when both are set.
    # Enabled without the URL would read nothing and say nothing, so refuse it by name before anything is placed.
    - name: "Refuse console_grafana_api_enabled without console_grafana_url"
      ansible.builtin.assert:
        that:
          - not (console_grafana_api_enabled | default(false) | bool) or (console_grafana_url | default('', true) | string | trim | length) > 0
        fail_msg: "console_grafana_api_enabled is true but console_grafana_url is unset. Set the URL or unset the switch."
        quiet: true

    # The Policy page's GitHub source (D36) is rendered only with the OpenBao block (env.j2). A value the console would
    # refuse at startup is refused here first, by the same rules (server/config.rs: github_repo_valid and
    # github_ref_valid), so a bad inventory value fails before anything is placed. Checked only when OpenBao is set.
    - name: "Refuse a console_github_repo or console_github_ref the console would refuse"
      ansible.builtin.assert:
        # Trimmed first, as server/config.rs trims the value it reads.
        that:
          - (console_github_repo | default('uhstray-io/agent-cloud') | string | trim) is match('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')
          - (console_github_repo | default('uhstray-io/agent-cloud') | string | trim).split('/')[1] not in ['.', '..']
          - (console_github_ref | default('dev') | string | trim) is match('^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$')
          - "'..' not in (console_github_ref | default('dev') | string | trim)"
          - (console_github_ref | default('dev') | string | trim).split('/') | select('equalto', '.') | list | length == 0
        fail_msg: >-
          console_github_repo must be owner/name (letters, digits and hyphens; letters, digits, dots, underscores and
          hyphens, never . or ..) and console_github_ref a branch or tag name (slash-separated segments of letters,
          digits, dots, underscores and hyphens, no empty or . segment, no ..). Refusing to deploy the console.
        quiet: true
      when: (console_openbao_url | default('', true) | string | trim | length) > 0

    # Read-only check of the credential path before anything is written: a refused run must not
    # have already placed the repo or written a secret (deploy-skynet.yml pattern).
    - name: "Transport guard: the OpenBao endpoint must not be cleartext public"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    # manage-secrets templates into this directory but does not create parent directories.
    # config/ is gitignored, so it is never in the repo.
    - name: "Create the config directory for the rendered scope file"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/config"
        state: directory
        mode: "0755"

    - name: "Manage secrets and template env + scope files"
      ansible.builtin.include_tasks: tasks/manage-secrets.yml

    # The console's Rust backend makes server-side OIDC calls to the IdP at
    # https://auth.<zone>:8443 (step-ca-minted leaf). Distribute the step-ca trust bundle into
    # ./certs; compose.local.yml mounts it and sets CONSOLE_EXTRA_CA_FILE. Local-only.
    - name: "Distribute the step-ca root for OIDC TLS trust (local)"
      ansible.builtin.include_tasks: tasks/distribute-ca-root.yml
      vars:
        _ca_root_dest_dir: "{{ _deploy_dir }}"
        _ca_engine: "{{ container_engine | default('podman') }}"
      when: local_mode | default(false) | bool

    - name: "Create convenience symlink ~/console -> deploy dir"
      # Points ~/console at the deployment dir in the composable monorepo clone.
      ansible.builtin.file:
        src: "{{ _deploy_dir }}"
        dest: "{{ local_home_dir | default('/home/' ~ (ansible_user | default('deploy')), true) }}/{{ service_name }}"
        state: link
        force: true
      register: _symlink_result
      # Best-effort: tolerate a permission-denied home, surface any other failure.
      failed_when: >-
        _symlink_result is failed
        and 'permission denied' not in (_symlink_result.msg | default('') | lower)

# ── Phase 2: Build the image + container lifecycle ──────────────────────────
- name: "Phase 2: Build the console image and start the container"
  hosts: console_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (host image build + container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        # Force the compose provider on the Mac-direct genesis path; empty on the
        # Semaphore path (detect_runtime derives it). NOT default(omit) — omit
        # leaks its placeholder into environment (rc 127).
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
        # Operator lever (survey `deploy_force_recreate`, only the literal true): recreate even when every input
        # and image matches — clears a stale bind mount a running container still holds.
        FORCE_RECREATE: "{{ 'true' if ((deploy_force_recreate | default('false') | string | lower) == 'true') else '' }}"
        # Operator lever (survey `console_force_rebuild`, only the literal true): rebuild the image even when
        # its build inputs match the image on this host.
        CONSOLE_FORCE_REBUILD: "{{ 'true' if ((console_force_rebuild | default('false') | string | lower) == 'true') else '' }}"
        # Local podman only: a seccomp profile path on the engine (see deploy.sh build_console_image).
        CONSOLE_BUILD_SECCOMP: "{{ console_build_seccomp | default('') }}"
      register: _deploy
      # deploy.sh recreates only when its inputs or images changed (common.sh
      # compose_up_if_changed) and says which on its own line.
      changed_when: "'DEPLOY_CHANGED=true' in _deploy.stdout_lines"
      when: not ansible_check_mode

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
- name: "Phase 3: Verify console"
  hosts: console_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"

  tasks:
    - name: "Container health (probe /healthz -> 200, inside the container)"
      # Exec inside the container so the check never depends on the published bind/port or on
      # central Caddy. The probe subcommand exits 0 only on the expected status.
      ansible.builtin.command: "{{ _engine }} exec console /usr/local/app/server probe /healthz 200"
      register: _console_health
      changed_when: false
      retries: 10
      delay: 6
      until: _console_health.rc == 0
      check_mode: false

    - name: "Unauthenticated API refuses (probe /v1/me -> 401, inside the container)"
      # Phase 1 acceptance: every /v1 route answers 401 without a session.
      ansible.builtin.command: "{{ _engine }} exec console /usr/local/app/server probe /v1/me 401"
      register: _console_api
      changed_when: false
      retries: 5
      delay: 3
      until: _console_api.rc == 0
      check_mode: false

    - name: "Report"
      ansible.builtin.debug:
        msg: "console healthy — /healthz answers 200 and unauthenticated /v1/me answers 401, both inside the container."

    # Last: every verify task above passed (a failure stops the play before this records).
    - name: "Record the service-deploy step result"
      ansible.builtin.include_tasks: tasks/emit-service-deploy-result.yml
      vars:
        service_deploy_result_var: _deploy
