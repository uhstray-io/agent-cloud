---
# seed-n8n-secrets.yml — migration Task 0 (pre-seed) for an EXISTING n8n.
#
# Reads the LIVE values from the n8n host's config/n8n.env and writes the
# STATEFUL secrets into OpenBao at secret/services/n8n, using the exact keys the
# composable deploy expects (encryption_key, db_admin_password, db_user_password).
# This makes the first composable deploy-n8n.yml run FETCH (not generate) them,
# so N8N_ENCRYPTION_KEY is preserved and stored workflow credentials stay
# decryptable.
#
# NON-DESTRUCTIVE: reads the host file + writes OpenBao; does NOT touch the
# running n8n. Run BEFORE the composable cutover, then verify with check-secrets,
# then diff the rendered .env. Skip entirely for a greenfield host (no data).
# Plan: plan/development/nocodb-n8n-composable-migration.md (Task 0).

- name: "Pre-seed n8n stateful secrets into OpenBao (Task 0)"
  hosts: n8n_svc
  gather_facts: false
  become: false
  # THE declaration of the stateful keys, their live-name aliases and OpenBao
  # fields — shared with deploy-n8n.yml's cutover guard, so the spellings this
  # pre-seed reads are BY CONSTRUCTION the spellings the guard later compares.
  vars_files:
    - vars/n8n-stateful-keys.yml
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _live_env: "{{ live_n8n_env | default(_deploy_dir + '/config/n8n.env') }}"
    _bao_url: "{{ openbao_addr }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Read the live n8n env file"
      ansible.builtin.slurp:
        src: "{{ _live_env }}"
      register: _envb
      no_log: true

    - name: "Extract the stateful values from the live env"
      # Anchored at line start ((?m)^) so a commented example assignment can
      # never be captured as the live value — the alternation over each key's
      # declared live_names comes from the shared manifest, the same data the
      # cutover guard consumes. ALL occurrences across all spellings are
      # collected so a duplicated OR cross-spelled key is refused below rather
      # than silently seeding a value the env-file parser does not use.
      ansible.builtin.set_fact:
        _matches: >-
          {{ (_matches | default({}))
             | combine({item.bao_field:
                 _txt | regex_findall('(?m)^(?:' ~ (item.live_names | join('|')) ~ ')=(.*)$')}) }}
      vars:
        _txt: "{{ _envb.content | b64decode }}"
      loop: "{{ n8n_stateful_keys }}"
      no_log: true

    - name: "Require exactly one non-empty active assignment per stateful key"
      # 0 = wrong file; >1 = ambiguous — which one the parser honours is a
      # dotenv implementation detail this play refuses to guess about. Counts
      # are reportable; the values never are.
      ansible.builtin.assert:
        that:
          - _matches[item.bao_field] | length == 1
          - _matches[item.bao_field] | first | length > 0
        fail_msg: >-
          {{ _live_env }} must hold exactly one non-empty active assignment
          for {{ item.live_names | join('/') }} — found
          x{{ _matches[item.bao_field] | length }}. Refusing to pre-seed.
      loop: "{{ n8n_stateful_keys }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Take the single values"
      ansible.builtin.set_fact:
        _seed_values: >-
          {{ (_seed_values | default({}))
             | combine({item.bao_field: _matches[item.bao_field] | first}) }}
      loop: "{{ n8n_stateful_keys }}"
      no_log: true

    - name: "Authenticate to OpenBao"  # noqa: run-once[task]
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _auth
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: "Fetch any existing n8n secrets (preserve unrelated keys)"  # noqa: run-once[task]
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/n8n"
        method: GET
        headers:
          X-Vault-Token: "{{ _auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _existing
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: "Merge the live stateful values into OpenBao (idempotent)"  # noqa: run-once[task]
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/n8n"
        method: POST
        headers:
          X-Vault-Token: "{{ _auth.json.auth.client_token }}"
        body_format: json
        body:
          data: >-
            {{ (_existing.json.data.data | default({})) | combine(_seed_values) }}
        status_code: [200]
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: "Report (values redacted)"
      ansible.builtin.debug:
        msg: >-
          Pre-seeded secret/services/n8n:
          {{ n8n_stateful_keys | map(attribute='bao_field') | join(', ') }}
          (encryption_key len {{ _seed_values['encryption_key'] | length }}).
          Now run check-secrets, then diff the rendered .env before the
          composable cutover.
