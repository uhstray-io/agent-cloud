          config_sha256: "{{ (_restore_stopped_isolation_raw.stdout | from_json).config_sha256 }}"
      no_log: true

    - name: Fingerprint stop effect and commit it to the journal
      no_log: true
      block:
        - name: Compute stop effect fingerprint
          ansible.builtin.command:
            argv: [python3, "{{ playbook_dir }}/files/o11y_restore_coordination.py"]
            stdin: "{{ {'mode': 'effect_fingerprint', 'action': 'stop', 'evidence': _restore_stop_effect, 'target': _restore_target_ref, 'record': _o11y_rc_plan.record} | to_json }}"
            stdin_add_newline: false
          register: _restore_stop_effect_fp_raw
          changed_when: false
          failed_when: false
          no_log: true
          check_mode: false

        - name: CAS complete stopped-target effect
          ansible.builtin.include_tasks: tasks/o11y-restore-coordination.yml
          vars:
            _o11y_restore_coordination_bao_url: "{{ _restore_bao_url }}"
            _o11y_restore_coordination_bao_token: "{{ _restore_bao_auth.json.auth.client_token }}"
            o11y_restore_coordination_request:
              transition: verify_effect
              declaration: "{{ _restore_declaration }}"
              target_ref: "{{ _restore_target_ref }}"
              expected_record: "{{ _o11y_rc_plan.record }}"
              expected_version: "{{ _o11y_rc_plan.expected_version | int }}"
              nonce: "{{ _restore_owner_nonce }}"
              evidence: "{{ _restore_stop_effect }}"
              action: stop
              request_fingerprint: "{{ _restore_stop_request_fingerprint }}"
              handle_type: upid
              handle: "{{ _restore_stop_submit.json.data }}"
              effect_fingerprint: "{{ (_restore_stop_effect_fp_raw.stdout | from_json).effect_fingerprint }}"

    - name: Build the private identity-bearing v3 restore receipt
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/o11y_restore_coordination.py"]
        stdin: >-
          {{ {'mode': 'build_restore_receipt',
              'record': _o11y_rc_plan.record,
              'version': _o11y_rc_plan.expected_version | int,
              'fields': {'artifact_config': _restore_artifact_layout,
                         'checker_sha256': _restore_checker_sha,
                         'checker_receipt_fingerprint': _restore_guest_receipt.receipt_fingerprint,
                         'guest_execution_pid': _restore_guest_exec_submit.json.data.pid | int,
                         'data_checks': _restore_guest_receipt,
                         'isolation_config_sha256': _restore_isolated_config_sha256}} | to_json }}
        stdin_add_newline: false
      register: _restore_sealed_receipt_raw
      changed_when: false
      failed_when: false
      no_log: true
      check_mode: false

    - name: Require the full stopped journal to seal one closed private receipt
      ansible.builtin.assert:
        that: _restore_sealed_receipt_raw.rc == 0
        fail_msg: "The isolated restore receipt could not be sealed from the verified journal."
        quiet: true
      no_log: true

    - name: Retain the exact sealed receipt
      ansible.builtin.set_fact:
        _restore_sealed_receipt: "{{ _restore_sealed_receipt_raw.stdout | from_json }}"
      no_log: true

    - name: CAS transition to awaiting receipt while retaining exact target ownership
      ansible.builtin.include_tasks: tasks/o11y-restore-coordination.yml
      vars:
        _o11y_restore_coordination_bao_url: "{{ _restore_bao_url }}"
        _o11y_restore_coordination_bao_token: "{{ _restore_bao_auth.json.auth.client_token }}"
        o11y_restore_coordination_request:
          transition: awaiting_receipt
          declaration: "{{ _restore_declaration }}"
          target_ref: "{{ _restore_target_ref }}"
          expected_record: "{{ _o11y_rc_plan.record }}"
          expected_version: "{{ _o11y_rc_plan.expected_version | int }}"
          nonce: "{{ _restore_owner_nonce }}"
          evidence: "{{ _restore_sealed_receipt }}"
          action: null
          request_fingerprint: null
          handle_type: null
          handle: null
          effect_fingerprint: null

    - name: Require exact readback of the awaiting-receipt version
      ansible.builtin.assert:
        that:
          - _o11y_rc_plan.result == 'write'
          - _o11y_rc_plan.record.phase == 'awaiting_receipt'
          - _o11y_rc_plan.record.receipt_fingerprint == _restore_sealed_receipt.receipt_fingerprint
        fail_msg: "The private receipt was not durably read back with the exact final coordination version."
        quiet: true
      no_log: true

    - name: Print the protected receipt for separate authenticated cleanup
      ansible.builtin.debug:
        msg: "{{ _restore_sealed_receipt }}"

    - name: Print only fixed public-safe verification categories
      ansible.builtin.debug:
        msg:
          status: restored_isolated
          volume_count: "{{ _restore_guest_receipt.volume_count }}"
          backend_count: "{{ _restore_guest_receipt.backend_count }}"
          grafana_integrity: "{{ _restore_guest_receipt.grafana_integrity }}"
          artifact_fingerprint: "{{ _restore_artifact_fingerprint }}"
          receipt_fingerprint: "{{ _restore_sealed_receipt.receipt_fingerprint }}"
