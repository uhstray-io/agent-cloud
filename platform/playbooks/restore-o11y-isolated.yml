              'isolated': true,
              'expected_disk_keys': (_restore_artifact_layout.disks | map(attribute='device') | list),
              'storage_id': _restore_target_storage} | to_json }}
      register: _restore_stopped_isolation_raw
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Require successful stop, stopped state, and unchanged isolation
      ansible.builtin.assert:
        that:
          - _restore_stop_task_status.json.data.status == 'stopped'
          - _restore_stop_task_status.json.data.exitstatus == 'OK'
          - (_restore_stop_readback.results | selectattr('item.name', 'equalto', 'status') | first).json.data.status == 'stopped'
          - _restore_stopped_isolation_raw.rc == 0
          - (_restore_stopped_isolation_raw.stdout | from_json).config_sha256 == _restore_isolated_config_sha256
        fail_msg: "The temporary target is not proven stopped and isolated; preserve it and its journal."
        quiet: true
      no_log: true

    - name: Build and persist stop effect proof
      ansible.builtin.set_fact:
        _restore_stop_effect:
