---
# set-semaphore-branch.yml — DEPRECATED. Use
# platform/semaphore/bootstrap-semaphore-repositories.yml instead.
#
# Why: this playbook mutates ONE shared repository record's branch. That is
# global mutable state — two people testing different branches overwrite each
# other, and any template run afterwards silently uses whatever branch was left
# set, with nothing in the run output saying which. The replacement declares a
# repository record PER branch (repositories.yml) and lets each template name the
# record it runs from, so there is no shared thing to flip.
#
# Kept, not deleted: it still works, and it is the quickest way to correct a
# single record by hand. Prefer the declarative path for anything reviewable.
#
# ── original description ────────────────────────────────────────────────────
# set-semaphore-branch.yml — flip the branch Semaphore runs playbooks from.
#
# OPERATOR-SIDE tool (run from a workstation, NOT as a Semaphore job) — managing
# Semaphore's own config from inside a Semaphore job is avoided by convention
# (cf. site-config scripts/semaphore-upgrade.sh). Invoked like setup-templates.yml:
#
#   SEMAPHORE_URL=http://localhost:3000 SEMAPHORE_TOKEN=<token> \
#     ansible-playbook platform/playbooks/set-semaphore-branch.yml -e deploy_branch=dev
#
# (SEMAPHORE_URL via an SSH-local tunnel to the Semaphore host; token from
# site-config/secrets/semaphore/semaphore_api_token.txt.)
#
# Streamlines the "batch to dev -> test on dev -> promote to main" workflow: one
# command swaps the agent-cloud repository's git_branch in Semaphore between
# `dev` and `main`, so all subsequent task runs check out that branch for the
# orchestration code. Keep prod on `main`; flip to `dev` only while testing, and
# flip back. (To also deploy a branch's monorepo to a VM, pass a deploy
# template's `service_branch` survey var — that feeds place-monorepo.)

- name: "Set Semaphore deploy branch to {{ deploy_branch | default('main') }}"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deploy_branch: "main"
    _project_id: "{{ semaphore_project_id | default(1) }}"
    _repo_name: "{{ semaphore_repo_name | default('agent-cloud') }}"
    _sem_url: "{{ semaphore_url | default(lookup('env', 'SEMAPHORE_URL'), true) | default('http://localhost:3000', true) }}"
    _sem_token: "{{ lookup('env', 'SEMAPHORE_TOKEN') }}"

  tasks:
    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - deploy_branch in ['dev', 'main']
          - (_sem_token | length) > 0
        fail_msg: >-
          Pass -e deploy_branch=dev|main and set SEMAPHORE_TOKEN (+ optional
          SEMAPHORE_URL, default http://localhost:3000) in the environment.

    - name: "Fetch the Semaphore repository named {{ _repo_name }}"
      ansible.builtin.uri:
        url: "{{ _sem_url }}/api/project/{{ _project_id }}/repositories"
        headers:
          Authorization: "Bearer {{ _sem_token }}"
        status_code: [200]
      register: _repos
      no_log: true # bearer token rides in headers

    - name: "Select the repository"
      ansible.builtin.set_fact:
        _repo: "{{ _repos.json | selectattr('name', 'equalto', _repo_name) | first }}"

    - name: "Report current branch (before)"
      ansible.builtin.debug:
        msg: "{{ _repo_name }} repo (id={{ _repo.id }}) currently on '{{ _repo.git_branch }}' -> setting '{{ deploy_branch }}'."

    - name: "Update the repository git_branch to {{ deploy_branch }}"
      ansible.builtin.uri:
        url: "{{ _sem_url }}/api/project/{{ _project_id }}/repositories/{{ _repo.id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ _sem_token }}"
          Content-Type: application/json
        # to_json keeps id/project_id/ssh_key_id as JSON ints (Semaphore rejects
        # stringified ids), mirroring setup-templates.yml.
        body: >-
          {{ {'id': (_repo.id | int),
              'name': _repo.name,
              'project_id': (_project_id | int),
              'git_url': _repo.git_url,
              'git_branch': deploy_branch,
              'ssh_key_id': (_repo.ssh_key_id | int)} | to_json }}
        status_code: [200, 204]
      no_log: true # token in headers

    - name: "Verify the branch was set"
      ansible.builtin.uri:
        url: "{{ _sem_url }}/api/project/{{ _project_id }}/repositories"
        headers:
          Authorization: "Bearer {{ _sem_token }}"
        status_code: [200]
      register: _verify
      # no_log: the request Authorization header carries the Semaphore token. Outcome stays
      # visible via the Assert+report task below — scoped-no_log pattern, not a hidden verify.
      no_log: true

    - name: "Assert + report"
      ansible.builtin.assert:
        that:
          - (_verify.json | selectattr('name', 'equalto', _repo_name) | map(attribute='git_branch') | first) == deploy_branch
        fail_msg: "Repository git_branch did not update to '{{ deploy_branch }}'."
        success_msg: >-
          Semaphore now runs {{ _repo_name }} playbooks from '{{ deploy_branch }}'.
          {{ 'TESTING on dev — remember to flip back to main for prod.' if deploy_branch == 'dev'
             else 'Production branch (main).' }}
