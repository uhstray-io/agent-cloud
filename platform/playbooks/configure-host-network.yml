---
# configure-host-network.yml — converge a host's IPv4 configuration to what the
# inventory declares.
#
# WHY THIS EXISTS. An address that lives only inside a guest drifts from the
# address the inventory claims, and nothing notices until two machines answer the
# same IP. That is not hypothetical: one host was found holding the address
# declared for a DIFFERENT host in this fleet. Different parts of the
# network had cached different MACs for .153, so one machine reached postiz while
# another reached devlog — and an orchestrated deploy authenticated against the
# wrong host for hours while every credential check passed.
#
# THE LOCKOUT PROBLEM. Changing the address of the host you are connected to drops
# that connection by definition, and a mistake leaves the host unreachable with no
# second path. `netplan try` solves this interactively by auto-reverting after a
# timeout; there is no non-interactive equivalent, so this playbook builds one:
#
#   1. render + `netplan generate` (syntax is validated BEFORE anything is applied)
#   2. back up the existing config
#   3. ARM A REVERT — a systemd timer that restores the backup and re-applies
#   4. apply, fire-and-forget, because the connection dies mid-task by design
#   5. the CONTROLLER waits for the NEW address to answer
#   6. only on success is the revert disarmed
#
# If step 5 fails, nobody has to do anything: the timer fires and the host comes
# back on its old address. The dangerous window is bounded by net_revert_seconds,
# not by an operator noticing.
#
# Declare per host in inventory:
#   net_address       "<host-ip>/<prefix>"   required, CIDR — unique per host
#   net_gateway       "<gateway-ip>"         required; declare on the group
#   net_nameservers   ["<resolver-ip>"]      optional, defaults to the gateway
#   net_interface     "ens18"                optional, autodetected when omitted
#   net_revert_seconds 180                   optional
#
# Usage: -e target_service=<inventory group>
#        -e net_confirm=true                 required; without it this is a DRY RUN
#
# A run without net_confirm renders and validates the config, prints the diff, and
# changes nothing — so the safe thing to do first is always the default.

# The sentinel default exists so the playbook PARSES without target_service set;
# it names no real group, so a run without the variable matches nothing and the
# pre-flight play above fails loudly rather than silently doing nothing.
- name: "Pre-flight: the target group must exist and contain hosts"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: "{{ target_service | default('__configure_host_network_no_target__') }}"
    preflight_group_expected: "{{ target_service | default('__configure_host_network_no_target__') }}"

# ── Phase 1: validate the declaration and render, WITHOUT applying ────────────
- name: "Phase 1: render and validate the declared network configuration"
  hosts: "{{ target_service | default('__configure_host_network_no_target__') }}"
  gather_facts: true
  become: true

  vars:
    _revert_seconds: "{{ net_revert_seconds | default(180) | int }}"
    _confirm: "{{ net_confirm | default(false) | bool }}"

  tasks:
    # The confirmation window is derived as (net_revert_seconds - 30). At 30 or
    # below that is zero or negative, so Phase 2 would get no usable window: the
    # wait returns immediately, the identity check never runs, and the revert stays
    # armed and fires over a perfectly good apply. A floor of 60 guarantees at
    # least 30s to establish SSH AND keeps the wait strictly shorter than the
    # revert, so the two can never race.
    - name: "Require a revert window long enough to confirm within"
      ansible.builtin.assert:
        that:
          - (_revert_seconds | int) >= 60
        fail_msg: >-
          net_revert_seconds is {{ _revert_seconds }}; it must be at least 60. The
          confirmation window is that value minus 30 seconds, so anything lower
          leaves no time to prove the new address works — and an unproven address
          means the revert fires after a change that actually succeeded.

    - name: "Require a complete network declaration"
      ansible.builtin.assert:
        that:
          - net_address is defined and (net_address | trim | length) > 0
          - net_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$')
          - net_gateway is defined and (net_gateway | trim | length) > 0
          - net_gateway is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
        fail_msg: >-
          Declare net_address (CIDR, e.g. <host-ip>/<prefix>) and net_gateway for
          this host in inventory. A partial declaration is refused rather than
          half-applied — a host with an address and no gateway is unreachable off
          its own subnet, which looks exactly like the lockout this playbook is
          built to avoid.

    # IDENTITY GUARD — refuse to reconfigure a host that is not the one intended.
    # This is the lesson of the incident that produced this playbook: when two
    # machines answer one address, "connect to the declared IP" reaches whichever
    # the local ARP cache points at, and reconfiguring the wrong guest is
    # unrecoverable from here. The connection is only trusted once the host says
    # its own name and that name matches the inventory entry being converged.
    #
    # net_expect_hostname overrides the comparison for a host whose OS hostname
    # legitimately differs from its inventory key.
    - name: "Ask the host what it calls itself"
      ansible.builtin.command: hostname
      register: _remote_hostname
      changed_when: false

    - name: "Refuse to continue if this is not the intended host"
      ansible.builtin.assert:
        that:
          - (_remote_hostname.stdout | trim) == (net_expect_hostname | default(inventory_hostname, true))
        fail_msg: >-
          Connected to a host calling itself '{{ _remote_hostname.stdout | trim }}'
          while converging '{{ inventory_hostname }}' at {{ ansible_host }}. Refusing
          to change its network configuration. Two machines answering one address is
          exactly how this playbook came to exist — resolve the conflict, or set
          net_expect_hostname if the OS hostname legitimately differs.
        success_msg: >-
          Host identity confirmed: {{ _remote_hostname.stdout | trim }}.

    - name: "Resolve the interface carrying the default route"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -4 route show default | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1); exit}'
        executable: /bin/bash
      register: _defroute_if
      changed_when: false

    - name: "Settle on the interface to configure"
      ansible.builtin.set_fact:
        _iface: "{{ net_interface | default((_defroute_if.stdout | trim), true) }}"

    - name: "Require an interface to have been resolved"
      ansible.builtin.assert:
        that:
          - _iface | trim | length > 0
        fail_msg: >-
          No interface carries the default route and net_interface is not set.
          Refusing to guess which NIC to reconfigure.

    - name: "Record the address the host holds now"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -4 -o addr show dev {{ _iface | quote }} | awk '{print $4; exit}'
        executable: /bin/bash
      register: _current_cidr
      changed_when: false

    - name: "Report the change this run would make"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ _iface }}): {{ (_current_cidr.stdout | trim) | default('none', true) }}
          -> {{ net_address }}
          {{ '[ALREADY CONVERGED]' if (_current_cidr.stdout | trim) == net_address
             else ('[WILL APPLY]' if _confirm else '[DRY RUN — pass -e net_confirm=true to apply]') }}

    - name: "Stop here when the declared address is already in place"
      ansible.builtin.meta: end_host
      when: (_current_cidr.stdout | trim) == net_address

    - name: "Find the netplan configuration this host actually uses"
      ansible.builtin.find:
        paths: /etc/netplan
        patterns: "*.yaml,*.yml"
      register: _netplan_files

    - name: "Require netplan"
      ansible.builtin.assert:
        that:
          - _netplan_files.files | length > 0
        fail_msg: >-
          No netplan configuration found under /etc/netplan. This playbook only
          handles netplan-managed hosts; it refuses rather than guessing at
          another network stack.

    # Held as a VARIABLE, not written to /etc/netplan. A dry run must leave no
    # trace: an earlier version staged the file on disk and relied on
    # `changed_when: false`, which hides the change from the report without
    # preventing it.
    - name: "Render the desired configuration"
      ansible.builtin.set_fact:
        _desired_config: |
          # Managed by agent-cloud configure-host-network.yml — do not edit by hand.
          # The address here is the one declared for this host in inventory; edit
          # the inventory and re-run instead, so the declaration stays the source
          # of truth rather than drifting from it.
          network:
            version: 2
            ethernets:
              {{ _iface }}:
                dhcp4: false
                addresses: [{{ net_address }}]
                routes:
                  - to: default
                    via: {{ net_gateway }}
                nameservers:
                  addresses: {{ net_nameservers | default([net_gateway], true) | to_json }}

    # Validated inside an ISOLATED ROOT. `netplan generate --root-dir` reads and
    # writes only under the directory given, so /etc/netplan is never touched by a
    # validation — not even momentarily.
    #
    # The previous approach moved the candidate into place under its real name to
    # run the check and moved it back afterwards. On a host where a prior
    # confirmed run had already installed a managed file, that OVERWROTE the
    # active configuration and then removed it, leaving the host with no managed
    # file and no copy of it — and the backup, taken later, could not restore what
    # had already been destroyed.
    - name: "Validate the rendered configuration in an isolated root"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/etc/netplan"
          cp -a /etc/netplan/. "$root/etc/netplan/" 2>/dev/null || true
          cat > "$root/etc/netplan/99-agent-cloud.yaml" <<'NETPLAN_EOF'
          {{ _desired_config }}
          NETPLAN_EOF
          chmod 600 "$root/etc/netplan/99-agent-cloud.yaml"
          netplan generate --root-dir "$root"
        executable: /bin/bash
      register: _np_validate
      changed_when: false
      failed_when: _np_validate.rc != 0

    - name: "Stop here on a dry run — nothing has been modified"
      ansible.builtin.meta: end_host
      when: not _confirm

    - name: "Back up the configuration the revert will restore"
      # Taken BEFORE the managed file is written, so it captures the state to
      # return to — including any managed file a previous confirmed run installed.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          rm -rf /var/backups/agent-cloud-netplan
          mkdir -p /var/backups/agent-cloud-netplan
          cp -a /etc/netplan/. /var/backups/agent-cloud-netplan/
        executable: /bin/bash
      changed_when: true

    - name: "ARM THE REVERT before applying anything"
      # The safety property of this playbook. A transient systemd timer restores
      # the backup and re-applies it after net_revert_seconds. It is cancelled
      # ONLY once the controller has confirmed the intended host answers on its new
      # address, so an address that does not work undoes itself without anyone
      # watching. This is the non-interactive equivalent of `netplan try`.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          # BOTH units, and reset-failed as well as stop. systemd-run --on-active
          # creates a .timer AND a .service; stopping only the timer leaves the
          # service loaded, and the next arm dies with "Unit
          # agent-cloud-netrevert.service was already loaded or has a fragment
          # file." Measured in a systemd container: second arm rc=1, and with this
          # cleanup rc=0 three runs running. That second run is not an edge case —
          # it is the retry after a revert, i.e. the exact path this playbook
          # exists to make survivable.
          systemctl stop agent-cloud-netrevert.timer agent-cloud-netrevert.service 2>/dev/null || true
          systemctl reset-failed agent-cloud-netrevert.timer agent-cloud-netrevert.service 2>/dev/null || true
          systemd-run --unit=agent-cloud-netrevert --on-active={{ _revert_seconds }} \
            /bin/bash -c 'rm -f /etc/netplan/*.yaml; \
                          cp -a /var/backups/agent-cloud-netplan/. /etc/netplan/; \
                          netplan apply'
        executable: /bin/bash
      changed_when: true

    - name: "Install the validated configuration"
      ansible.builtin.copy:
        dest: /etc/netplan/99-agent-cloud.yaml
        mode: "0600"
        content: "{{ _desired_config }}"
      changed_when: true

    - name: "Apply it (fire-and-forget — this drops our own connection)"
      # async + poll:0 on purpose. Changing the address severs the SSH session
      # mid-task, so a normal task would be reported as a failure even when the
      # change succeeded. The controller verifies the outcome in the next play.
      ansible.builtin.shell:
        cmd: netplan apply
        executable: /bin/bash
      async: 45
      poll: 0
      changed_when: true

    - name: "Publish the new address for the confirmation play"
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}-newaddr"
        groups: _netchanged
        ansible_host: "{{ net_address | regex_replace('/.*$', '') }}"
        ansible_user: "{{ ansible_user | default(omit) }}"
        # Carried forward deliberately: a host on a non-default SSH port would
        # otherwise be probed on 22, time out, and have its revert fire after a
        # perfectly good apply.
        ansible_port: "{{ ansible_port | default(22) }}"
        # The rest of the transport, for the same reason as the port. add_host starts
        # from NOTHING, so a setting Phase 1 connected with is absent here unless it is
        # named. Phase 2 runs a command ON this host to check its identity, so a target
        # reached via a key file, a jump host, or a non-default interpreter would pass
        # Phase 1, fail confirmation, and have its revert fire over an apply that
        # actually worked — the false negative this playbook exists to prevent. None of
        # these is set in this fleet today (the orchestrator supplies its key by its own
        # mechanism); they are carried so adding one later cannot quietly break it.
        ansible_connection: "{{ ansible_connection | default(omit) }}"
        ansible_private_key_file: "{{ ansible_private_key_file | default(omit) }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default(omit) }}"
        ansible_ssh_common_args: "{{ ansible_ssh_common_args | default(omit) }}"
        ansible_ssh_extra_args: "{{ ansible_ssh_extra_args | default(omit) }}"
        ansible_python_interpreter: "{{ ansible_python_interpreter | default(omit) }}"
        _orig_host: "{{ inventory_hostname }}"
        _expect_hostname: "{{ net_expect_hostname | default(inventory_hostname, true) }}"
        _revert_seconds: "{{ _revert_seconds }}"
      changed_when: false

# ── Phase 2: the CONTROLLER confirms the INTENDED host answers ────────────────
- name: "Phase 2: confirm the intended host answers on its new address"
  hosts: _netchanged
  gather_facts: false
  become: false

  tasks:
    - name: "Wait for SSH on the new address"
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: "{{ (_revert_seconds | int) - 30 }}"
        state: started
      delegate_to: localhost
      register: _newaddr
      failed_when: false

    # A host's SSH key is pinned in the CONTROLLER's known_hosts against the ADDRESS,
    # not the machine. This playbook moves a machine to a new address by design, so
    # whatever used that address before left its key behind — and the access
    # playbooks connect with StrictHostKeyChecking=accept-new, which accepts an
    # unknown key and REFUSES a changed one. The identity check below would then fail
    # for a reason unrelated to the network change, Phase 2 would not confirm, and the
    # armed revert would fire over an apply that worked.
    #
    # Not hypothetical: after one guest stopped squatting a declared address, the next
    # connection to it aborted with a host-key-mismatch warning until the stale entry
    # was dropped. Every controller that ever reached the old occupant holds one.
    #
    # Dropping it is safe here precisely BECAUSE the identity check does not rely on
    # it: that check asks the host its own name and compares it to the inventory,
    # which is a stronger claim than key continuity across an address whose occupant
    # just changed on purpose.
    - name: "Drop the controller's stale host key for the new address"
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        state: absent
      delegate_to: localhost
      changed_when: false

    - name: "Fail the run when the new address never answered"
      ansible.builtin.fail:
        msg: >-
          Nothing answered on {{ ansible_host }}:{{ ansible_port | default(22) }}.
          Nothing to undo by hand — the armed revert restores the previous
          configuration within {{ _revert_seconds }}s of the apply. Re-check the
          declaration before retrying.
      when: _newaddr.failed

    # An open port proves only that SOME machine answers at that address. If
    # another machine already holds it, connecting here would report success, the
    # intended host would keep its revert armed, and it would silently roll back —
    # while the run claimed to have succeeded. This is the same mistake the
    # identity guard in Phase 1 exists to prevent, and it needs making twice.
    - name: "Ask whoever answered what it calls itself"
      ansible.builtin.command: hostname
      register: _new_hostname
      changed_when: false

    - name: "Refuse to disarm unless it is the intended host"
      ansible.builtin.assert:
        that:
          - (_new_hostname.stdout | trim) == _expect_hostname
        fail_msg: >-
          {{ ansible_host }} answers, but it calls itself
          '{{ _new_hostname.stdout | trim }}' rather than '{{ _expect_hostname }}'.
          Another machine already holds this address. NOT disarming the revert:
          {{ _orig_host }} will restore its previous configuration on its own,
          which is the correct outcome — the address it was given is taken.
        success_msg: >-
          {{ ansible_host }} answers and identifies as {{ _expect_hostname }}.

    - name: "DISARM the revert — only now that the intended host is proven"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          systemctl stop agent-cloud-netrevert.timer 2>/dev/null || true
          systemctl reset-failed agent-cloud-netrevert.service 2>/dev/null || true
          echo disarmed
        executable: /bin/bash
      become: true
      register: _disarm
      changed_when: "'disarmed' in _disarm.stdout"

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ _orig_host }} is reachable at {{ ansible_host }}, identified itself,
          and the revert is disarmed.
