---
# clean-deploy-step-ca.yml — Destroy and redeploy step-ca from scratch.
#
# WARNING: Destroys the step-ca-data volume — this DELETES the CA root +
#          intermediate. A fresh deploy auto-initializes a NEW, different root,
#          so every client must re-trust it (make local-tls-trust) and any
#          consumer (Caddy) must re-mint its cert. Use only for a deliberate CA
#          reset. Local-dev shares one deploy tree, so the clone is NOT removed
#          (clean-service.yml branches on local_mode).
#
# Uses composable tasks/clean-service.yml then runs deploy-step-ca.yml.
#
# Refuses unless the launch names the host it resets: -e confirm_reset=<inventory
# hostname>, the one confirmation every Clean Deploy requires (tasks/assert-reset-confirmed.yml,
# also enforced by tasks/clean-service.yml). Every template that runs this asks for it with no
# default (openspec production-internal-ca, task 2.3).

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Refuse a CA reset the launch did not name"
  hosts: step_ca_svc
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    # The shared gate of every Clean Deploy (tasks/assert-reset-confirmed.yml): a reset issues a
    # new root that every client must trust again, so the launch must say which host, in its own
    # launch. Checked here as well as in clean-service.yml so it precedes the first-boot check.
    - name: "Require the run to NAME the host whose CA it destroys"
      ansible.builtin.include_tasks: tasks/assert-reset-confirmed.yml

    # The redeploy below refuses without these; checked here so a confirmed reset with
    # incomplete inventory refuses before the root is destroyed, not after.
    - name: "Refuse a reset whose redeploy would refuse"
      ansible.builtin.include_tasks: tasks/assert-step-ca-first-boot.yml

- name: "Clean step-ca deployment"
  hosts: step_ca_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
  tasks:
    - name: "Destroy existing deployment"
      ansible.builtin.include_tasks: tasks/clean-service.yml

- name: "Fresh deploy"
  import_playbook: deploy-step-ca.yml
  vars:
    _extra_var_guard_nested: true
