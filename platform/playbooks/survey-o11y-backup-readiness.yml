---
# Read-only Proxmox backup readiness survey for the declared production o11y VM.
# A listed backup is only a candidate; immutability and restore are separate gates.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Survey Proxmox backup readiness
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      # Keep aligned with resize-vm.yml until the Proxmox CA is installed on
      # the Semaphore runner; the shared inventory setting enables validation.
      validate_certs: "{{ proxmox_validate_certs | default(false) | bool }}"
      follow_redirects: none
  vars:
    _project_root: "{{ playbook_dir | dirname | dirname }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _o11y_hosts: "{{ groups['o11y_svc'] | default([]) }}"
    _o11y_host: "{{ _o11y_hosts | first | default('') }}"
    _vmid: "{{ hostvars[_o11y_host].vm_vmid | default('') if _o11y_host else '' }}"
    _node: "{{ hostvars[_o11y_host].vm_node | default('') if _o11y_host else '' }}"
  tasks:
    - name: Require an exact reviewed controller revision and production inventory declaration
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - not ansible_check_mode
          - not (local_mode | default(false) | bool)
          - _o11y_hosts | length == 1
          - _vmid | string is match('^[1-9][0-9]*$')
          - _node | string is match('^[A-Za-z0-9._-]+$')
        fail_msg: "This read-only survey requires the exact reviewed revision and one declared production o11y VM."

    - name: Read controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ _project_root }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Require exact reviewed controller revision
      ansible.builtin.assert:
        that: _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different reviewed Dev revision."

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ _project_root }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Require a clean reviewed checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "The reviewed controller checkout contains uncommitted files."

    - name: Refuse public cleartext OpenBao transport
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: Read Proxmox API credentials from OpenBao
      ansible.builtin.set_fact:
        _pve_data: "{{ lookup('community.hashi_vault.hashi_vault',
          'secret/data/services/proxmox', url=_bao_url, auth_method='approle',
          role_id=_bao_role_id, secret_id=_bao_secret_id) }}"
      no_log: true

    - name: Derive Proxmox API connection values
      ansible.builtin.set_fact:
        _pve_host: "{{ _pve_data.url | default('') }}"
        _pve_token_id: "{{ _pve_data.token_id | default('stray@pve!workflow-agent') }}"
        _pve_secret: "{{ _pve_data.api_token }}"
      no_log: true

    - name: Require Proxmox API over HTTPS
      ansible.builtin.assert:
        that: _pve_host is match('^https://')
        fail_msg: "The Proxmox API URL from OpenBao must use HTTPS."

    # Keep the credential-dependent header on each request: play-level URI
    # module defaults are rendered before these OpenBao-derived facts exist.
    - name: Read target VM record from Proxmox
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/resources?type=vm"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _pve_vms
      no_log: true
      check_mode: false

    - name: Verify the declared VM exists at its declared node
      ansible.builtin.assert:
        that:
          - _pve_vms.json.data is sequence
          - _pve_vms.json.data is not string
          - _pve_vms.json.data is not mapping
          - >-
            (_pve_vms.json.data
             | selectattr('type', 'equalto', 'qemu')
             | selectattr('vmid', 'equalto', _vmid | int)
             | selectattr('node', 'equalto', _node)
             | list | length) == 1
        fail_msg: "The declared o11y VM could not be verified on its declared Proxmox node."

    - name: Read storage available to the declared Proxmox node
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _node_storage
      no_log: true
      check_mode: false

    - name: Require a valid node storage readback
      ansible.builtin.assert:
        that:
          - _node_storage.json.data is sequence
          - _node_storage.json.data is not string
          - _node_storage.json.data is not mapping
        fail_msg: "Proxmox returned no usable storage inventory for the declared node."

    - name: Select active storage that declares backup content
      ansible.builtin.set_fact:
        _backup_storages: >-
          {{ _node_storage.json.data
             | selectattr('active', 'defined')
             | selectattr('active', 'equalto', 1)
             | selectattr('content', 'defined')
             | selectattr('content', 'search', '(^|,)backup(,|$)')
             | list }}
      no_log: true

    - name: Read backup content records for the declared VM
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage/{{ item.storage | urlencode }}/content?content=backup&vmid={{ _vmid }}"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      loop: "{{ _backup_storages }}"
      register: _backup_content_reads
      no_log: true
      failed_when: false
      check_mode: false

    - name: Summarize backup listing without exposing storage or artifact details
      ansible.builtin.set_fact:
        _backup_summary: >-
          {%- set ns = namespace(complete=true, backend_types_complete=true, artifacts=0, pbs=0, non_pbs=0) -%}
          {%- for storage in _backup_storages | default([]) -%}
          {%- if storage.type is defined and storage.type is string and (storage.type | trim | length) > 0 -%}
          {%- if storage.type | trim | lower == 'pbs' -%}
          {%- set ns.pbs = ns.pbs + 1 -%}
          {%- else -%}
          {%- set ns.non_pbs = ns.non_pbs + 1 -%}
          {%- endif -%}
          {%- else -%}
          {%- set ns.backend_types_complete = false -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for result in _backup_content_reads.results | default([]) -%}
          {%- if result.status | default(0) | int == 200
                and result.json is defined
                and result.json.data is defined
                and result.json.data is sequence
                and result.json.data is not string
                and result.json.data is not mapping -%}
          {%- set ns.artifacts = ns.artifacts + (result.json.data | length) -%}
          {%- else -%}
          {%- set ns.complete = false -%}
          {%- endif -%}
          {%- endfor -%}
          {{ {'listing_complete': ns.complete,
              'backend_types_complete': ns.backend_types_complete,
              'pbs_storage_count': ns.pbs,
              'non_pbs_storage_count': ns.non_pbs,
              'candidate_artifact_count': ns.artifacts} }}
      no_log: true

    - name: Require complete read-only backup listing
      ansible.builtin.assert:
        that:
          - _backup_summary.listing_complete | bool
          - _backup_summary.backend_types_complete | bool
        fail_msg: "Backup-content listing or storage backend classification was incomplete; no readiness result is issued."

    - name: Report sanitized backup and restore prerequisites
      ansible.builtin.debug:
        msg:
          survey: read-only
          target_vm_verified: true
          backup_capable_storage_count: "{{ _backup_storages | length | int }}"
          backup_capable_pbs_storage_count: "{{ _backup_summary.pbs_storage_count | int }}"
          backup_capable_non_pbs_storage_count: "{{ _backup_summary.non_pbs_storage_count | int }}"
          candidate_backup_artifact_count: "{{ _backup_summary.candidate_artifact_count | int }}"
          artifact_immutability_verified: false
          isolated_restore_target_verified: false
          restore_test_verified: false
          next_gate: "Verify an immutable artifact and complete an isolated restore test before any guest growth."
