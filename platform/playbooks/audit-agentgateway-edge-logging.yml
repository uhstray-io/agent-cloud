---
# Read-only Caddy edge audit for observability-estate tasks 5.7 and 5.8.

- name: Refuse extra vars that set internal names
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: Require one declared edge and the exact reviewed revision
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read the controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Require exact Dev revision and unambiguous inventory inputs
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - _controller_revision.stdout | trim == expected_repository_sha
          - _controller_changes.stdout | length == 0
          - groups.get('caddy_svc', []) | length == 1
          - groups.get('agentgateway_svc', []) | length == 1
          - hostvars[groups['caddy_svc'][0]].caddy_managed_sites is defined
          - hostvars[groups['agentgateway_svc'][0]].agw_ui_redirect_uri is defined
        fail_msg: "Require the exact clean Dev revision and one declared Caddy and agentgateway host."
        quiet: true

- name: Send a bounded callback marker through the declared HTTPS route
  hosts: agentgateway_svc
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Keep the callback URI and random marker private
      ansible.builtin.set_fact:
        _edge_audit_callback_uri: "{{ agw_ui_redirect_uri }}"
        _edge_audit_marker: "{{ lookup('password', '/dev/null length=32 chars=ascii_lowercase,digits') }}"
      no_log: true

    - name: Require a plain HTTPS callback URI without an existing query
      ansible.builtin.assert:
        that: _edge_audit_callback_uri is match('^https://[^/?#]+/[^?#]*$')
        fail_msg: "The declared agentgateway callback URI is not a plain HTTPS URL."
        quiet: true

    - name: Request the callback with a synthetic query marker
      ansible.builtin.uri:
        url: "{{ _edge_audit_callback_uri }}?o11y_audit_marker={{ _edge_audit_marker }}"
        method: GET
        return_content: false
        follow_redirects: none
        timeout: 10
        status_code: 200
      register: _edge_audit_probe
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

- name: Read and classify the live Caddy edge configuration
  hosts: caddy_svc
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    _edge_audit_engine: "{{ container_engine | default('podman') }}"
    _edge_audit_gateway_host: "{{ groups['agentgateway_svc'][0] }}"
  tasks:
    - name: Read whether the Caddy container is running
      ansible.builtin.command:
        argv:
          - "{{ _edge_audit_engine }}"
          - inspect
          - --format
          - "{{ '{{.State.Running}}' }}"
          - caddy
      register: _edge_audit_container_state
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Require Caddy container inspection and running state
      ansible.builtin.assert:
        that:
          - _edge_audit_container_state.rc == 0
          - _edge_audit_container_state.stdout | trim == 'true'
        fail_msg: >-
          Caddy edge audit refused; category={{
            'container-inspection-unavailable'
            if _edge_audit_container_state.rc != 0
            or (_edge_audit_container_state.stdout | trim not in ['true', 'false'])
            else 'container-not-running'
          }}.
        quiet: true

    - name: Read Caddy's effective admin API configuration
      ansible.builtin.command:
        argv:
          - "{{ _edge_audit_engine }}"
          - exec
          - caddy
          - wget
          - -q
          - -O
          - -
          - http://127.0.0.1:2019/config/
      register: _edge_audit_runtime_config
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Require the runtime config read to succeed
      ansible.builtin.assert:
        that:
          - _edge_audit_runtime_config.rc == 0
          - _edge_audit_runtime_config.stdout | length > 0
        fail_msg: >-
          Caddy edge audit refused; category={{
            'admin-api-unavailable'
            if _edge_audit_runtime_config.rc != 0
            else 'empty-config'
          }}.
        quiet: true

    - name: Read the Caddy container log driver configuration
      ansible.builtin.command:
        argv:
          - "{{ _edge_audit_engine }}"
          - inspect
          - --format
          - "{{ '{{json .HostConfig.LogConfig}}' }}"
          - caddy
      register: _edge_audit_container_log_config
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Read only a bounded Caddy log tail after the marker request
      ansible.builtin.command:
        argv:
          - "{{ _edge_audit_engine }}"
          - logs
          - --since
          - 2m
          - --tail
          - "500"
          - caddy
      register: _edge_audit_container_logs
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Parse protected runtime and source inputs into a fixed summary
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/audit-caddy-edge-logging.py') }}"
        stdin: >-
          {{ {
            'callback_uri': hostvars[_edge_audit_gateway_host]._edge_audit_callback_uri,
            'declared_sites': caddy_managed_sites,
            'runtime_config': _edge_audit_runtime_config.stdout,
            'container_log_config': _edge_audit_container_log_config.stdout | default(''),
            'container_log_tail': (_edge_audit_container_logs.stdout | default('')) ~ '\n' ~ (_edge_audit_container_logs.stderr | default('')),
            'logs_read_ok': _edge_audit_container_logs.rc | default(1) == 0,
            'marker': hostvars[_edge_audit_gateway_host]._edge_audit_marker,
            'probe_status': hostvars[_edge_audit_gateway_host]._edge_audit_probe.status | default(0) | int
          } | to_json }}
        stdin_add_newline: false
      register: _edge_audit_report
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an ambiguous route, access log mapping, or sink
      ansible.builtin.assert:
        that:
          - _edge_audit_report.rc == 0
          - (_edge_audit_report.stdout | from_json).status == 'classified'
        fail_msg: >-
          Caddy edge audit refused; category={{ (_edge_audit_report.stdout | default('{}', true) | from_json).reason | default('runtime-or-sink-unavailable') }}.
        quiet: true

    - name: Report bounded Caddy edge evidence
      ansible.builtin.debug:
        msg: "{{ _edge_audit_report.stdout | from_json }}"
