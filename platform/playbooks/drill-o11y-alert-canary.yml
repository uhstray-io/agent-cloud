---
# Reversible local and production delivery proof. Alert provisioning is
# temporary: the always path restores paused rules and removes the contact
# point, even when the probe fails.
- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Verify the reviewed Dev checkout before the canary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Require the exact reviewed revision
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different revision; no canary was started."

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Require a clean reviewed checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "Candidate checkout has uncommitted files; no canary was started."

- name: Prove alert delivery and restore the paused baseline
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    expected_service: "{{ _probe }}"
    expected_instance: "{{ (_probe ~ ':65535') if (local_mode | default(false) | bool) else '127.0.0.1:65535' }}"
    _delivery_marker: "o11y-delivery-status=firing service={{ _probe }}"
    _channel_id: "{{ o11y_alert_discord_channel_id | default('') | string }}"
    _auth_edge_hosts: "{{ groups['caddy_svc'] | default([]) }}"
    _auth_edge_ip: "{{ hostvars[_auth_edge_hosts[0]].ansible_host | default('') if _auth_edge_hosts | length == 1 else '' }}"
  tasks:
    - name: Require a paused baseline before the canary
      ansible.builtin.assert:
        that:
          - not (o11y_alerts_enabled | default(false) | bool)
          - not ansible_check_mode
        fail_msg: "The canary requires a paused baseline and a real Semaphore run."

    - name: Require the declared production Grafana route
      ansible.builtin.assert:
        that:
          - o11y_zone | default('') is match('^[a-z0-9.-]+$')
          - o11y_zone != 'agent-cloud.test'
          - _auth_edge_hosts | length == 1
          - _auth_edge_ip is match('^[0-9]+(\\.[0-9]+){3}$')
        fail_msg: "Production canary needs a declared DNS zone and one Caddy origin IP."
      when: not (local_mode | default(false) | bool)

    - name: Read the baseline service-down rule
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules/o11y_service_down
      register: _baseline_rule
      changed_when: false
      check_mode: false

    - name: Refuse an already active service-down rule
      ansible.builtin.assert:
        that: (_baseline_rule.stdout | from_json).isPaused | bool
        fail_msg: "The baseline rule is active; no canary state was changed."

    - name: Read baseline contact points without displaying webhook settings
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/contact-points
      register: _baseline_contacts
      changed_when: false
      no_log: true
      check_mode: false

    - name: Refuse an existing o11y contact point
      ansible.builtin.assert:
        that: >-
          _baseline_contacts.stdout | from_json |
          selectattr('uid', 'equalto', 'o11y_ops_discord') | list | length == 0
        fail_msg: "The o11y contact point is already active; no canary state was changed."

    - name: Check that the paused environment has no canary webhook line
      ansible.builtin.command:
        argv: [grep, -q, '^O11Y_ALERT_DISCORD_WEBHOOK_URL=', "{{ _deploy_dir }}/.env"]
      register: _baseline_webhook_line
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse an environment already carrying an alert webhook
      ansible.builtin.assert:
        that: _baseline_webhook_line.rc == 1
        fail_msg: "The paused environment already has a webhook line or is unreadable; no canary state was changed."

    - name: Name this canary's unique fault probe
      ansible.builtin.command:
        argv: [python3, -c, "import uuid; print('o11y-fault-probe-' + uuid.uuid4().hex[:12])"]
      register: _canary_probe_name
      delegate_to: localhost
      changed_when: false
      check_mode: false

    - name: Bind the canary alert to only its probe
      ansible.builtin.set_fact:
        _probe: "{{ _canary_probe_name.stdout }}"

    - name: Require a safe canary service label
      ansible.builtin.assert:
        that: _probe is match('^o11y-fault-probe-[0-9a-f]{12}$')

    - name: Refuse a cleartext OpenBao endpoint before the canary
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: Verify Discord delivery prerequisites before activation
      ansible.builtin.include_tasks: tasks/o11y-alert-delivery-preflight.yml

    - name: Place the reviewed checkout for local canary rendering
      ansible.builtin.include_tasks: tasks/place-monorepo.yml
      when: local_mode | default(false) | bool

    - name: Read the already deployed production revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ _monorepo_dir }}"
      register: _deployed_revision
      changed_when: false
      check_mode: false
      when: not (local_mode | default(false) | bool)

    - name: Read tracked changes in the deployed production checkout
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=no]
        chdir: "{{ _monorepo_dir }}"
      register: _deployed_changes
      changed_when: false
      check_mode: false
      when: not (local_mode | default(false) | bool)

    - name: Refuse a receiver not already deployed from the reviewed revision
      ansible.builtin.assert:
        that:
          - _deployed_revision.stdout == expected_repository_sha
          - _deployed_changes.stdout | length == 0
        fail_msg: "Deploy the clean reviewed Dev revision to the receiver before running its alert canary."
      when: not (local_mode | default(false) | bool)

    - name: Refuse to overwrite an existing production canary scrape file
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/scrape.d/o11y-prod-canary.yml"
      register: _prod_canary_file
      when: not (local_mode | default(false) | bool)

    - name: Require a clean production canary slot
      ansible.builtin.assert:
        that: not _prod_canary_file.stat.exists
        fail_msg: "A production canary scrape file already exists; restore the baseline before retrying."
      when: not (local_mode | default(false) | bool)

    - name: Refuse an unfinished production canary restoration
      ansible.builtin.stat:
        path: "{{ _deploy_dir }}/config/.o11y-alert-canary-active"
      register: _prod_canary_marker
      when: not (local_mode | default(false) | bool)

    - name: Require a cleared production canary marker
      ansible.builtin.assert:
        that: not _prod_canary_marker.stat.exists
        fail_msg: "Production canary restoration is unfinished; run Restore o11y Alert Baseline (Dev)."
      when: not (local_mode | default(false) | bool)

    - name: Require the production route values already deployed
      ansible.builtin.command:
        argv: [grep, -Fxq, "{{ item }}", "{{ _deploy_dir }}/.env"]
      loop:
        - 'O11Y_ZONE={{ o11y_zone }}'
        - 'O11Y_AUTHENTIK_EDGE_IP={{ _auth_edge_ip }}'
      changed_when: false
      check_mode: false
      when: not (local_mode | default(false) | bool)

    - name: Activate only the canary rule, prove delivery, and restore the baseline
      block:
        - name: Block normal deploys until production restoration is verified
          ansible.builtin.copy:
            dest: "{{ _deploy_dir }}/config/.o11y-alert-canary-active"
            mode: "0644"
            content: "Restore o11y Alert Baseline (Dev) before normal deployment.\n"
          when: not (local_mode | default(false) | bool)

        - name: Render a production-only unreachable scrape target
          ansible.builtin.copy:
            dest: "{{ _deploy_dir }}/config/scrape.d/o11y-prod-canary.yml"
            mode: "0644"
            content: |
              scrape_configs:
                - job_name: o11y-production-canary
                  static_configs:
                    - targets: ["127.0.0.1:65535"]
                      labels:
                        service: "{{ _probe }}"
          when: not (local_mode | default(false) | bool)

        - name: Render the temporary OpenBao-backed canary rule and contact
          ansible.builtin.include_tasks: tasks/o11y-alert-provision.yml
          vars:
            o11y_alerts_enabled: true
            o11y_alert_canary_service: "{{ _probe }}"
            o11y_canary_preserve_env: true

        - name: Restart o11y with temporary canary provisioning
          ansible.builtin.shell: |
            cd "{{ _deploy_dir }}"
            bash deploy.sh --no-pull
          environment:
            CONTAINER_ENGINE: "{{ _engine }}"
            LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
          changed_when: true
          when: not ansible_check_mode

        - name: Run the existing named fault and Discord receipt checks
          ansible.builtin.include_tasks: tasks/o11y-alert-probe.yml
          vars:
            o11y_alerts_enabled: true
            drill_expect_alert: true
            o11y_production_static_probe: "{{ not (local_mode | default(false) | bool) }}"
      always:
        - name: Restore and verify the paused baseline
          ansible.builtin.include_tasks: tasks/o11y-restore-alert-baseline.yml

    - name: Report the delivery receipt after successful restoration
      ansible.builtin.debug:
        msg: "The canary fired and reached Discord; paused rules and contact-point removal were verified."
