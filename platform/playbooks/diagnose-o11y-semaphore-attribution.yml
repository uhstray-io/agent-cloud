---
# Read-only, controller-only task-output attribution diagnostic.

- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Require the reviewed checkout"
  ansible.builtin.import_playbook: require-reviewed-checkout.yml

- name: Diagnose current Semaphore task-output attribution
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    _semaphore_url: "http://127.0.0.1:3000"
    _attribution_helper: "{{ playbook_dir }}/files/diagnose-semaphore-task-attribution.py"
  tasks:
    - name: Read the reviewed controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Report check mode without generating a nonce or reading the API
      ansible.builtin.debug:
        msg:
          status: check_mode_unverified
          reason: check_mode_skips_nonce_and_api
          metadata_context_matches: false
          template_context_matches: false
          repository_branch_dev: false
          marker_count: 0
          output_row_count: 0
      when: ansible_check_mode
      changed_when: false

    - name: Prepare one framed random attribution marker
      ansible.builtin.command:
        argv: [python3, "{{ _attribution_helper }}"]
        stdin: >-
          {{ {'mode': 'prepare',
              'task_id': semaphore_vars.task_details.id | default(''),
              'project_id': semaphore_project_id | default(''),
              'revision': _controller_revision.stdout} | to_json }}
      register: _attribution_prepared_raw
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Hold the sanitized marker result in Ansible memory
      ansible.builtin.set_fact:
        _attribution_prepared: "{{ _attribution_prepared_raw.stdout | from_json }}"
      no_log: true
      when: not ansible_check_mode

    - name: Emit the digest marker into this task's actual output
      ansible.builtin.debug:
        msg: "{{ _attribution_prepared.marker }}"
      changed_when: false
      when:
        - not ansible_check_mode
        - _attribution_prepared.status == 'prepared'

    - name: Resolve the existing controller Semaphore runtime access
      ansible.builtin.include_tasks: ../semaphore/tasks/runtime-access.yml
      when:
        - not ansible_check_mode
        - _attribution_prepared.status == 'prepared'

    - name: Read back only this task's bounded metadata and output
      ansible.builtin.command:
        argv: [python3, "{{ _attribution_helper }}"]
        stdin: >-
          {{ {'mode': 'verify',
              'api_origin': _semaphore_url,
              'token': _token,
              'task_id': semaphore_vars.task_details.id | default(''),
              'project_id': semaphore_project_id | default(''),
              'revision': _controller_revision.stdout,
              'marker': _attribution_prepared.marker,
              'nonce_hex': _attribution_prepared.nonce_hex} | to_json }}
      register: _attribution_verified_raw
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when:
        - not ansible_check_mode
        - _attribution_prepared.status == 'prepared'

    - name: Report the sanitized source-level attribution result
      ansible.builtin.debug:
        msg: "{{ _attribution_verified_raw.stdout | from_json }}"
      changed_when: false
      when:
        - not ansible_check_mode
        - _attribution_prepared.status == 'prepared'

    - name: Report an unavailable candidate without accessing the API
      ansible.builtin.debug:
        msg: "{{ _attribution_prepared }}"
      changed_when: false
      when:
        - not ansible_check_mode
        - _attribution_prepared.status != 'prepared'
