---
# promote-semaphore-admins.yml — promote every declared platform admin to a
# Semaphore admin via the Semaphore API (closes task #37).
#
# Why this exists: Semaphore 2.18.12 has NO group->role mapping, so OIDC users
# land NON-admin and an SSO'd platform-admin sees no projects until someone
# flips admin=true by hand (bootstrap-local-dev.yml notes exactly this). This
# playbook is the sanctioned, idempotent automation that replaces that manual
# grant — the code-managed equivalent of the manual UI toggle (Critical Rule #1:
# no ad-hoc changes; config flows through code).
#
# Who becomes admin is DATA, not code, and admin is derived, never hand-granted
# (plan/architecture/04-credentials-access.md, issue #604). The roster is the filter
# semaphore_admin_roster over two inventory declarations, both in top-level all.vars (this
# play runs on implicit localhost, which receives no group's vars):
#   platform_admins         the ONE administrator list, which deploy-authentik.yml renders
#                           into the Authentik platform-admins group: every person on it is a
#                           Semaphore admin under the same username (the service account is
#                           skipped). Not declared for localhost: nothing is derived.
#   semaphore_admin_users   Semaphore USERNAMES that are admins without being platform admins
#                           (the local bootstrap account, for one).
# Matching is by username only; see the matching task for why email is not accepted. No names
# are hardcoded here.
#
# API creds: env first (SEMAPHORE_URL + SEMAPHORE_TOKEN, as setup-templates.yml
# and the local bootstrap use), else OpenBao secret/services/semaphore (keys
# `url` + `api_token`) reached with the AppRole creds Semaphore injects into the
# environment (BAO_ROLE_ID/BAO_SECRET_ID + openbao_addr). The token must belong
# to a Semaphore admin (listing/updating users is admin-only).
#
# Idempotent: only users in the list who are not already admin get a PUT; a
# re-run with everyone already promoted changes nothing. Runs against the API
# only — no host connection needed.
#
# Usage: via the "Promote Semaphore Admins" Semaphore template, or:
#   ansible-playbook promote-semaphore-admins.yml \
#     -e '{"semaphore_admin_users":["alice","bob"]}'

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Promote declared platform admins to Semaphore admins (closes task #37)"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _sem_url_env: "{{ semaphore_url | default(lookup('env', 'SEMAPHORE_URL'), true) | default('', true) }}"
    _sem_token_env: "{{ lookup('env', 'SEMAPHORE_TOKEN') }}"
    _admin_users: "{{ semaphore_admin_users | default([]) | semaphore_admin_roster(platform_admins | default(none)) }}"

  tasks:
    - name: "Require a non-empty admin roster"
      ansible.builtin.assert:
        that:
          - (_admin_users | length) > 0
        fail_msg: >-
          No Semaphore admin is declared. Declare platform_admins (the administrator
          list) or semaphore_admin_users (Semaphore USERNAMES; email matching is
          deliberately unsupported) in inventory (site-config all.vars) or pass
          -e '{"semaphore_admin_users":["alice","bob"]}'.

    # ── Resolve the Semaphore API URL + token (env first, else OpenBao) ─────
    # Env (SEMAPHORE_URL/SEMAPHORE_TOKEN) wins — the setup-templates + local
    # bootstrap path. Otherwise read url + api_token from OpenBao
    # secret/services/semaphore with the AppRole creds Semaphore injects
    # (BAO_ROLE_ID/BAO_SECRET_ID + openbao_addr), via the community.hashi_vault
    # lookup — the repo's short form for a single-key read (cf.
    # distribute-ssh-keys.yml, harden-ssh.yml). Lazy Jinja means the lookup only
    # fires when the env value is absent, so an env-token run needs no OpenBao.
    - name: "Resolve the Semaphore URL + token (env first, else OpenBao AppRole lookup)"
      ansible.builtin.set_fact:
        _sem_url: >-
          {{ _sem_url_env if (_sem_url_env | length) > 0
             else lookup('community.hashi_vault.hashi_vault',
                         'secret/data/services/semaphore:url',
                         url=_bao_url, auth_method='approle',
                         role_id=_bao_role_id, secret_id=_bao_secret_id) }}
        _sem_token: >-
          {{ _sem_token_env if (_sem_token_env | length) > 0
             else lookup('community.hashi_vault.hashi_vault',
                         'secret/data/services/semaphore:api_token',
                         url=_bao_url, auth_method='approle',
                         role_id=_bao_role_id, secret_id=_bao_secret_id) }}
      no_log: true

    - name: "Require a resolved URL + token"
      ansible.builtin.assert:
        that:
          - (_sem_url | length) > 0
          - (_sem_token | length) > 0
        fail_msg: >-
          Could not resolve the Semaphore API URL/token — set SEMAPHORE_URL +
          SEMAPHORE_TOKEN in the environment, or store url + api_token at
          secret/services/semaphore in OpenBao (with the AppRole creds +
          openbao_addr in the environment).

    # ── List users + promote the declared admins not yet admin ──────────────
    - name: "List Semaphore users"
      ansible.builtin.uri:
        url: "{{ _sem_url }}/api/users"
        headers:
          Authorization: "Bearer {{ _sem_token }}"
        status_code: [200]
      register: _sem_users
      no_log: true  # bearer token rides in headers — never dump it (failure/-vvv)
      check_mode: false

    - name: "Report how many users Semaphore returned (safe — count + status only)"
      ansible.builtin.debug:
        msg: "Semaphore returned {{ _sem_users.json | length }} user(s) (HTTP {{ _sem_users.status }})."

    - name: "Compute who to promote (declared roster, not yet admin — username match ONLY)"
      # Match the declared roster by USERNAME ONLY — the stable, SSO-provisioned
      # handle a user cannot edit. Email matching is deliberately NOT offered:
      # Authentik enforces neither email uniqueness nor verification by default,
      # so a member-tier user could set a roster email on their own account and
      # be promoted on the next run. If an email-based roster is ever required,
      # it must be gated on an enforced email_verified claim + Authentik
      # email-uniqueness policy first.
      ansible.builtin.set_fact:
        _to_promote: >-
          {{ _candidates | selectattr('username', 'in', _admin_users) | list }}
      vars:
        # Semaphore returns admin as a real bool, so rejectattr('admin') drops the
        # current admins in one pass (replaces the doubled
        # selectattr('admin','equalto',false)).
        _candidates: "{{ _sem_users.json | rejectattr('admin') | list }}"

    - name: "Promote each declared admin (idempotent — already-admins are skipped)"
      ansible.builtin.uri:
        url: "{{ _sem_url }}/api/users/{{ item.id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ _sem_token }}"
          Content-Type: application/json
        body_format: json
        # to_json in Jinja keeps id an int + admin a real bool — Semaphore >=2.18
        # rejects the stringified values Ansible's non-native templating produces.
        body: >-
          {{ {'id': (item.id | int),
              'name': item.name,
              'username': item.username,
              'email': item.email,
              'admin': true,
              'external': (item.external | default(false)),
              'alert': (item.alert | default(false))} | to_json }}
        status_code: [200, 204]
      loop: "{{ _to_promote }}"
      loop_control:
        label: "{{ item.username }} <{{ item.email }}>"
      register: _sem_promoted
      changed_when: true
      # A failure here is hidden by no_log, so the status codes are judged below, where they
      # can be shown (task 9843 failed with nothing but "details hidden", #604).
      failed_when: false
      no_log: true  # bearer token rides in headers — never dump it (failure/-vvv)
      when: not ansible_check_mode

    - name: "Report the promotion PUT statuses (safe — status codes only, no token)"
      ansible.builtin.debug:
        msg: >-
          Promotion PUT statuses:
          {{ _sem_promoted.results | default([]) | map(attribute='status') | list }}
      # Under --check the promotion loop is skipped and its results carry no status.
      when: not ansible_check_mode and (_sem_promoted.results | default([]) | length) > 0

    - name: "Require Semaphore to accept every promotion"
      vars:
        _refused: >-
          {{ _to_promote | map(attribute='username')
             | zip(_sem_promoted.results | map(attribute='status'))
             | rejectattr('1', 'in', [200, 204]) | list }}
      ansible.builtin.assert:
        that: _refused | length == 0
        fail_msg: >-
          Semaphore refused these promotions (username, HTTP status; -1 means no answer): {{ _refused }}.
          401 means the token's user is not a Semaphore admin.
      when: not ansible_check_mode and (_sem_promoted.results | default([]) | length) > 0

    # A PUT the server answered is not proof it applied: read the accounts back.
    - name: "Read the Semaphore users back"
      ansible.builtin.uri:
        url: "{{ _sem_url }}/api/users"
        headers:
          Authorization: "Bearer {{ _sem_token }}"
        status_code: [200]
      register: _sem_users_after
      no_log: true  # bearer token rides in headers: never dump it (failure/-vvv)
      check_mode: false
      when: not ansible_check_mode and (_to_promote | length) > 0

    - name: "Require every promoted admin to read back as admin"
      vars:
        # Targeted accounts minus those that read back as admin, so an account missing
        # from the read-back fails too, not only one that reads back as non-admin.
        _still_not_admin: >-
          {{ _to_promote | map(attribute='username') | list
             | difference(_sem_users_after.json | selectattr('admin')
                          | map(attribute='username') | list) }}
      ansible.builtin.assert:
        that: _still_not_admin | length == 0
        fail_msg: "Semaphore accepted the promotion but these accounts are still not admin: {{ _still_not_admin }}"
      when: _sem_users_after is not skipped and _sem_users_after.json is defined

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ 'Would promote (check mode)' if ansible_check_mode else 'Promoted' }}
          {{ _to_promote | length }} user(s) to Semaphore admin this run:
          {{ _to_promote | map(attribute='username') | list }}.
          Declared admins already admin were left untouched (idempotent).
          Declared admins with no Semaphore account yet (each signs in once through
          SSO, then this runs again):
          {{ _admin_users | difference(_sem_users.json | map(attribute='username') | list) }}.
