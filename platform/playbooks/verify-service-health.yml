---
# verify-service-health.yml — workflow step service-validate: the service answers on its
# declared health path.
#
# Read-only, identical under --check. The service's inventory host declares the contract:
# service_url and health_path, or health_url when the health endpoint is not under the service
# URL or is reached differently from the executor (local-dev: the Semaphore container reaches
# services by container name on the local-dev network; health_url alone never touches the
# service's stored secrets, which service_url is written into). The step's criterion is HTTP 200, so health_status_codes (which
# admits e.g. OpenBao's sealed 503 for the fleet overview) is deliberately not read here (PR 203
# Codex review). A service with no declared health path fails: the criterion is "answers through
# its declared path", and an undeclared one cannot be checked. Validate All Services stays the
# fleet overview; it only prints, so it cannot prove a step (PR 203 review).
#
# Where the probe runs: the executor, by default. A host that publishes its port on loopback only,
# or firewalls it to the Caddy host, cannot answer the executor however healthy it is (production
# honcho answered -1). Such a host sets health_probe_on_host: true with a loopback
# health_url, and the probe runs ON the host, where the container's own healthcheck also looks.
#
# Internal CA at a pinned address: production OPA serves TLS only, under a certificate name
# (opa.<site>.<zone>) that is not in production DNS. Such a host declares health_ca_path (the CA
# bundle, on the probing host) and health_resolve_address (the address the URL's host:port is
# pinned to). The probe then runs curl with --cacert and --resolve, as deploy-opa.yml does for OPA,
# and the certificate is still verified against the URL's own name. Neither var set keeps the uri probe.
#
# Usage (Semaphore): -e target_service=honcho_svc

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Refuse a target group that matches no hosts"
  # A play whose hosts: matches nothing exits 0 with no step result, which reads as a pass
  # (PR 203 Codex review). preflight-target-group.yml refuses survey-driven groups because its
  # subject could be redirected away from the work; here the guard and the work read the SAME
  # target_service, so one override moves both, and the guard only proves the group is populated.
  hosts: localhost
  connection: local
  gather_facts: false
  # Tagged so a verify-only run (--tags verify) keeps the guard (PR 203 Codex review).
  tags: [verify]
  tasks:
    - name: "Require target_service to name a populated inventory group"
      ansible.builtin.assert:
        that: (groups.get(target_service | default(''), []) | length) > 0
        fail_msg: "target_service '{{ target_service | default('') }}' matches no hosts in this inventory: nothing would be checked."

- name: "Verify the service answers on its declared health path: {{ target_service | default('(unset)') }}"
  hosts: "{{ target_service | default('ungrouped') }}"
  gather_facts: false
  become: false
  tags: [verify]
  vars:
    _codes: [200]
    _url: >-
      {{ health_url | default('', true)
         or ((service_url | default('') ~ health_path | default(''))
             if (service_url | default('') | length > 0 and health_path | default('') | length > 0) else '') }}
    # A CA bundle or a pinned address switches the probe to curl. The uri probe runs only without them.
    _health_curl_wanted: "{{ (health_ca_path | default('', true) | length > 0) or (health_resolve_address | default('', true) | length > 0) }}"
    _url_scheme: "{{ _url | urlsplit('scheme') }}"
    _url_host: "{{ _url | urlsplit('hostname') | default('', true) }}"
    _url_port: "{{ _url | urlsplit('port') | default(('443' if _url_scheme == 'https' else '80'), true) }}"
    # A pinned address needs a URL that names a host over http or https; anything else is a declared error.
    _health_pin_invalid: "{{ (health_resolve_address | default('', true) | length > 0) and not (_url_host | length > 0 and _url_scheme in ['http', 'https']) }}"

  tasks:
    - name: "Probe the declared health path"
      ansible.builtin.uri:
        url: "{{ _url }}"
        method: GET
        status_code: "{{ _codes }}"
        timeout: 10
      register: _health
      failed_when: false
      check_mode: false
      delegate_to: "{{ inventory_hostname if (health_probe_on_host | default(false) | bool) else 'localhost' }}"
      when: _url | length > 0 and not (_health_curl_wanted | bool)

    # curl, not uri, when a CA bundle or a pinned address is declared: uri cannot pin a name to an
    # address. argv, never a shell string; the URL goes after --url, so one that starts with '-' is
    # never read as an option. No --fail: a 503 must reach the verdict as 503.
    - name: "Probe the declared health path through curl (CA bundle or pinned address)"
      ansible.builtin.command:
        argv: "{{ ['curl', '--silent', '--show-error', '--output', '/dev/null', '--write-out', '%{http_code}', '--max-time', '10']
                  + (['--cacert', health_ca_path | string] if (health_ca_path | default('', true) | length > 0) else [])
                  + (['--resolve', _url_host ~ ':' ~ _url_port ~ ':' ~ (health_resolve_address | string)] if (health_resolve_address | default('', true) | length > 0) else [])
                  + ['--url', _url] }}"
      register: _health_curl
      changed_when: false
      failed_when: false
      check_mode: false
      delegate_to: "{{ inventory_hostname if (health_probe_on_host | default(false) | bool) else 'localhost' }}"
      when: _url | length > 0 and (_health_curl_wanted | bool) and not (_health_pin_invalid | bool)

    # One status and one detail for both probes, so the verdict and the evidence read the same facts.
    # curl prints 000 when no response came, so its status counts only when it exited 0. uri reports
    # -1 when it got no response; that is no response here too.
    - name: "Normalise the probe result"
      ansible.builtin.set_fact:
        _health_status: "{{ (_health_curl.stdout | default('') | int(none)) if (_health_curl.rc | default(-1) == 0) else (none if (_health.status | default(-1) == -1) else _health.status) }}"
        _health_detail: "{{ (_health_curl.stderr_lines | default([]) | first | default('', true)) if (_health_curl.rc | default(0) != 0) else '' }}"

    - name: "Decide"
      ansible.builtin.set_fact:
        _health_errors: >-
          {{ (['no declared health_url or service_url + health_path for ' ~ inventory_hostname]
              if (_url | length == 0) else [])
             + (['health_resolve_address needs an http or https health URL with a host, not ' ~ _url]
                if (_health_pin_invalid | bool and _url | length > 0) else [])
             + ([_url ~ ' answered ' ~ (_health_status | default('no response', true)) ~ ', expected one of '
                 ~ (_codes | join(', ')) ~ ('; ' ~ _health_detail if _health_detail | length > 0 else '')]
                if (_url | length > 0 and not (_health_pin_invalid | bool) and _health_status not in _codes) else []) }}

    # emit-step-result records ONE result per play (run_once), so the recorded verdict covers the
    # whole target group: every host's errors, and a host that failed before its verdict counts as
    # a failure rather than vanishing from ansible_play_hosts (PR 203 Codex review).
    - name: "Collect the verdict across the target group"
      ansible.builtin.set_fact:
        _group_errors: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts_all -%}
            {%- if out.extend(hostvars[h]._health_errors | default([h ~ ': no health verdict (the host failed before it)'])) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: "Record the step result"
      ansible.builtin.include_tasks: tasks/emit-step-result.yml
      vars:
        step_result_step: service-validate
        step_result_status: "{{ 'pass' if (_group_errors | length == 0) else 'fail' }}"
        step_result_evidence:
          health_status: "{{ _health_status | default(none) }}"
        step_result_error: "{{ _group_errors | join('; ') }}"

    - name: "Fail when the service is not healthy on its declared path"
      ansible.builtin.fail:
        msg: "{{ _health_errors | join('; ') }}"
      when: _health_errors | length > 0
