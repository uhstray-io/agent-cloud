---
# Read-only production inventory for inference-telemetry-production task 0.2.
# o11y/deployment/compose.yml pins every container name to o11y-*.
# The legacy grafanapodman host this audit also inspected is retired (operator
# decision 2026-09-26) and removed from the private inventory; the receiver is the
# o11y VM, an agent_cloud host.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: Audit production hosts for o11y containers
  hosts: agent_cloud
  gather_facts: false
  tasks:
    - name: Read the SSH user's UID for the rootless Docker socket
      ansible.builtin.command:
        argv: [id, -u]
      vars:
        ansible_become: false
      register: o11y_audit_uid
      check_mode: false
      changed_when: false

    - name: List rootless o11y Podman containers
      ansible.builtin.command:
        argv: [podman, ps, -a, --format, "{{ '{{.Names}}' }}"]
      vars:
        ansible_become: false
      register: o11y_rootless
      check_mode: false
      changed_when: false
      failed_when: false

    - name: List rootful o11y Podman containers
      ansible.builtin.command:
        argv: [sudo, -n, podman, ps, -a, --format, "{{ '{{.Names}}' }}"]
      register: o11y_rootful
      check_mode: false
      changed_when: false
      failed_when: false

    - name: List rootless o11y Docker containers
      ansible.builtin.command:
        argv: [docker, --host, "unix:///run/user/{{ o11y_audit_uid.stdout }}/docker.sock", ps, -a, --format, "{{ '{{.Names}}' }}"]
      vars:
        ansible_become: false
      register: o11y_docker_rootless
      check_mode: false
      changed_when: false
      failed_when: false

    - name: List rootful o11y Docker containers
      ansible.builtin.command:
        argv: [sudo, -n, docker, --host, unix:///var/run/docker.sock, ps, -a, --format, "{{ '{{.Names}}' }}"]
      register: o11y_docker_rootful
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Report candidates and access results
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          rootless_rc: "{{ o11y_rootless.rc }}"
          rootless_containers: "{{ o11y_rootless.stdout_lines | select('match', '^o11y-') | list }}"
          rootless_errors: "{{ o11y_rootless.stderr_lines }}"
          rootful_rc: "{{ o11y_rootful.rc }}"
          rootful_containers: "{{ o11y_rootful.stdout_lines | select('match', '^o11y-') | list }}"
          rootful_errors: "{{ o11y_rootful.stderr_lines }}"
          docker_rootless_rc: "{{ o11y_docker_rootless.rc }}"
          docker_rootless_containers: "{{ o11y_docker_rootless.stdout_lines | select('match', '^o11y-') | list }}"
          docker_rootless_errors: "{{ o11y_docker_rootless.stderr_lines }}"
          docker_rootful_rc: "{{ o11y_docker_rootful.rc }}"
          docker_rootful_containers: "{{ o11y_docker_rootful.stdout_lines | select('match', '^o11y-') | list }}"
          docker_rootful_errors: "{{ o11y_docker_rootful.stderr_lines }}"

- name: Inspect OpenBao container state without reading secrets
  hosts: openbao
  gather_facts: false
  tasks:
    - name: List rootless OpenBao containers
      ansible.builtin.command:
        argv: [podman, ps, -a, --filter, name=openbao, --format, "{{ '{{.Names}} {{.Status}}' }}"]
      vars:
        ansible_become: false
      register: openbao_rootless
      check_mode: false
      changed_when: false
      failed_when: false

    - name: List rootful OpenBao containers
      ansible.builtin.command:
        argv: [sudo, -n, podman, ps, -a, --filter, name=openbao, --format, "{{ '{{.Names}} {{.Status}}' }}"]
      register: openbao_rootful
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Report OpenBao container states
      ansible.builtin.debug:
        msg:
          rootless_rc: "{{ openbao_rootless.rc }}"
          rootless_containers: "{{ openbao_rootless.stdout_lines }}"
          rootless_errors: "{{ openbao_rootless.stderr_lines }}"
          rootful_rc: "{{ openbao_rootful.rc }}"
          rootful_containers: "{{ openbao_rootful.stdout_lines }}"
          rootful_errors: "{{ openbao_rootful.stderr_lines }}"
