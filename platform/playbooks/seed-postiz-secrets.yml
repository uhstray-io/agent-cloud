---
# seed-postiz-secrets.yml — place the operator's social-platform application
# credentials into OpenBao at secret/services/postiz, in ONE additive run.
#
# Why this exists. deploy-postiz.yml declares these credentials as
# `type: existing` — it surfaces them to the rendered config but NEVER generates
# them, because they are the operator's own credentials registered at each social
# platform's developer console. This playbook is the code-managed way to place
# them, so no credential is ever hand-edited onto a VM or committed.
#
# Why not seed-n8n-secrets.yml's approach: that playbook slurps a live env file
# that already exists ON the target VM. These values live on the operator's
# machine, which the Semaphore runner cannot read — so they are passed in as
# extra vars instead and never touch disk anywhere.
#
# ADDITIVE + idempotent + concurrency-safe. Only the keys you actually pass are
# written, via the server-side KV-v2 merge-patch, so:
#   - the three generated secrets (signing key, the two datastore passwords)
#     already at this path are preserved
#   - a re-run with the same values writes nothing (no KV version churn)
#   - seeding one new platform later does not disturb the others
#
# Runs from the Semaphore runner (localhost), which holds the OpenBao AppRole.
#
# Usage (via Semaphore survey vars, or -e on the CLI) — pass only what you have:
#   -e seed_x_api_key=... -e seed_x_api_secret=...
#   -e seed_linkedin_client_id=... -e seed_linkedin_client_secret=...
#   -e seed_youtube_client_id=... -e seed_youtube_client_secret=...
#   -e seed_discord_client_id=... -e seed_discord_client_secret=...
#   -e seed_discord_bot_token_id=...
# Each seed_<name> lands at secret/services/postiz:postiz_<name>.
#
# REMINDER (not automatable): after seeding, update each platform's OAuth
# redirect URI at its developer console to the service's public URL. Connecting
# an account fails until that is done.
# Plan: plan/development/14-postiz-social-publishing.md

- name: "Seed postiz social-platform credentials into OpenBao"
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _bao_path: "services/postiz"
    # Every credential this playbook can place. Passing seed_<name> stores it at
    # postiz_<name>; anything not passed is left completely untouched. Extend
    # this list to support a new platform — the config template already renders
    # every slot, so no other code changes.
    _seedable:
      - x_api_key
      - x_api_secret
      - linkedin_client_id
      - linkedin_client_secret
      - youtube_client_id
      - youtube_client_secret
      - discord_client_id
      - discord_client_secret
      - discord_bot_token_id
      - reddit_client_id
      - reddit_client_secret
      - github_client_id
      - github_client_secret
      - threads_app_id
      - threads_app_secret
      - facebook_app_id
      - facebook_app_secret
      - tiktok_client_id
      - tiktok_client_secret
      - pinterest_client_id
      - pinterest_client_secret
      - dribbble_client_id
      - dribbble_client_secret
      - slack_id
      - slack_secret
      - slack_signing_secret
      - mastodon_client_id
      - mastodon_client_secret
      - beehiive_api_key
      - beehiive_publication_id

  tasks:
    # Non-secret validation stays VISIBLE so a missing URL fails readably;
    # no_log is scoped to the credential-bearing steps only.
    - name: "Validate non-secret inputs"
      ansible.builtin.assert:
        that:
          - _bao_url | length > 0
        fail_msg: "Ensure openbao_addr (or OPENBAO_ADDR) + AppRole creds are set."

    # role_id/secret_id and the seeded values cross the wire to _bao_url — refuse
    # to send secret material over public cleartext. https always allowed; http
    # only to loopback/RFC1918 (the internal OpenBao VLAN).
    - name: "Require a non-cleartext transport to OpenBao"
      ansible.builtin.assert:
        that:
          - "_bao_url is match('^(https://|http://(localhost|127\\.|10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.))')"
        fail_msg: >-
          Refusing to send secret material over public cleartext. Set openbao_addr
          to an https:// URL, or an http:// endpoint on loopback/RFC1918 (the
          internal OpenBao VLAN).

    - name: "Collect the credentials that were actually supplied"
      ansible.builtin.set_fact:
        _payload: >-
          {{ _payload | default({}) | combine(
               {('postiz_' ~ item): lookup('vars', 'seed_' ~ item)}
             ) if (lookup('vars', 'seed_' ~ item, default='') | string | length > 0) else (_payload | default({})) }}
      loop: "{{ _seedable }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    # Count only — the names, never the values. Keeps the run diagnosable
    # without printing a credential.
    - name: "Report how many credentials were supplied"
      ansible.builtin.debug:
        msg: >-
          {{ (_payload | default({})) | length }} of {{ _seedable | length }} seedable
          credentials supplied: {{ (_payload | default({})).keys() | list | sort | join(', ') }}

    - name: "Nothing to do when no credentials were supplied"
      ansible.builtin.meta: end_play
      when: (_payload | default({})) | length == 0

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      no_log: true

    # GET serves two purposes: idempotency (skip when every supplied value is
    # already stored) and path existence (404 => POST create, 200 => PATCH).
    - name: "Fetch the existing secret at secret/{{ _bao_path }}"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ _bao_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _existing
      no_log: true

    # Idempotency, stated as simply as it can be: merging the payload into what
    # is already stored either changes the dict or it does not. If it does not,
    # skip the write so a re-run does not churn a new KV version.
    - name: "Compute path existence + whether the write would change anything"
      ansible.builtin.set_fact:
        _path_exists: "{{ _existing.status == 200 }}"
        _existing_data: "{{ (_existing.json.data.data | default({})) if _existing.status == 200 else {} }}"
      no_log: true

    - name: "Decide whether a write is needed"
      ansible.builtin.set_fact:
        _needs_write: "{{ (_existing_data | combine(_payload)) != _existing_data }}"
      no_log: true

    - name: "Report whether anything changes"
      ansible.builtin.debug:
        msg: >-
          {{ 'Write needed — at least one supplied value differs from what is stored.'
             if _needs_write | bool
             else 'No write needed — every supplied value already matches OpenBao.' }}

    # Existing path: server-side JSON merge-patch. OpenBao merges the supplied
    # keys into the CURRENT version, so the three generated secrets already at
    # this path survive even if they changed after our read — which a
    # GET-combine-POST read-modify-write could clobber.
    - name: "Merge the supplied credentials via KV-v2 PATCH into secret/{{ _bao_path }}"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ _bao_path }}"
        method: PATCH
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
          Content-Type: application/merge-patch+json
        body_format: json
        body:
          data: "{{ _payload }}"
        status_code: [200]
      when:
        - _path_exists | bool
        - _needs_write | bool
      no_log: true

    # Brand-new path (postiz has never been deployed): create it. The next
    # deploy-postiz.yml run adds the generated secrets alongside these.
    - name: "Create the path with the supplied credentials at secret/{{ _bao_path }}"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/{{ _bao_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        body_format: json
        body:
          data: "{{ _payload }}"
        status_code: [200]
      when: not (_path_exists | bool)
      no_log: true

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          Seeded {{ (_payload | default({})) | length }} credential(s) into
          secret/{{ _bao_path }} ({{ 'merged into existing path' if _path_exists | bool else 'created new path' }}).
          Verify with Check Secrets, then run Deploy Postiz. Remember to update
          each platform's OAuth redirect URI at its developer console.
