---
# seed-postiz-secrets.yml — place the operator's social-platform application
# credentials into OpenBao at secret/services/postiz, in ONE additive run.
#
# Why this exists. deploy-postiz.yml declares these credentials as
# `type: existing` — it surfaces them to the rendered config but NEVER generates
# them, because they are the operator's own credentials registered at each social
# platform's developer console. This playbook is the code-managed way to place
# them, so no credential is ever hand-edited onto a VM or committed.
#
# Why not seed-n8n-secrets.yml's approach: that playbook slurps a live env file
# that already exists ON the target VM. These values live on the operator's
# machine, which the Semaphore runner cannot read — so they arrive through
# temporary encrypted Semaphore environment inputs.
#
# ADDITIVE + idempotent + concurrency-safe. Only the keys you actually pass are
# written, via the server-side KV-v2 merge-patch, so:
#   - the three generated secrets (signing key, the two datastore passwords)
#     already at this path are preserved
#   - a re-run with the same values writes nothing (no KV version churn)
#   - seeding one new platform later does not disturb the others
#
# Runs from the Semaphore runner (localhost), which holds the OpenBao AppRole.
# postiz_verify_access_only=true authenticates and reads the fixed secret path,
# then exits before any write, even when provider inputs are present.
#
# Credential input — supply only what you have, never through survey variables:
# Supply each credential as a Semaphore environment SECRET named after the key,
# upper-cased (seed_x_api_key -> SEED_X_API_KEY). Semaphore encrypts environment
# secrets at rest and does not return their values over its API. Do NOT pass them
# as launch-time extra vars under Semaphore: it persists the extra-var JSON and
# serves it back over the API, which puts a live social-platform credential in
# plaintext outside OpenBao. The environment wins over the extra var, so a stray
# `-e` cannot override a configured secret.
#
# The extra-var form below is for a LOCAL run only, where the value comes from
# site-config and nothing persists it:
#   -e seed_x_api_key=... -e seed_x_api_secret=...
#   -e seed_linkedin_client_id=... -e seed_linkedin_client_secret=...
#   -e seed_youtube_client_id=... -e seed_youtube_client_secret=...
#   -e seed_discord_client_id=... -e seed_discord_client_secret=...
#   -e seed_discord_bot_token_id=...
# Each seed_<name> lands at secret/services/postiz:postiz_<name>.
#
# REMINDER (not automatable): after seeding, update each platform's OAuth
# redirect URI at its developer console to the service's public URL. Connecting
# an account fails until that is done.
# Plan: plan/development/14-postiz-social-publishing.md

- name: "Seed postiz social-platform credentials into OpenBao"
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _bao_path: "services/postiz"
    # Every credential this playbook can place. Passing seed_<name> stores it at
    # postiz_<name>; anything not passed is left completely untouched. Extend
    # this list to support a new platform — the config template already renders
    # every slot, so no other code changes.
    _seedable:
      - x_api_key
      - x_api_secret
      - linkedin_client_id
      - linkedin_client_secret
      - youtube_client_id
      - youtube_client_secret
      - discord_client_id
      - discord_client_secret
      - discord_bot_token_id
      - reddit_client_id
      - reddit_client_secret
      - github_client_id
      - github_client_secret
      - threads_app_id
      - threads_app_secret
      - facebook_app_id
      - facebook_app_secret
      - tiktok_client_id
      - tiktok_client_secret
      - pinterest_client_id
      - pinterest_client_secret
      - dribbble_client_id
      - dribbble_client_secret
      - slack_id
      - slack_secret
      - slack_signing_secret
      - mastodon_client_id
      - mastodon_client_secret
      - beehiive_api_key
      - beehiive_publication_id
      - tumblr_client_id
      - tumblr_client_secret
      # Listmonk's non-secret domain and list id are inventory vars
      # (postiz_listmonk_domain / postiz_listmonk_list_id), not secrets.
      - listmonk_user
      - listmonk_api_key
    # Each credential's Semaphore environment input name (x_api_key -> SEED_X_API_KEY). The
    # ONE derivation: the lookup below and the undeclared-input guard both read it.
    _seed_env: "{{ dict(_seedable | zip(_seedable | map('upper') | map('regex_replace', '^', 'SEED_'))) }}"

  tasks:
    # Non-secret validation stays VISIBLE so a missing URL fails readably;
    # no_log is scoped to the credential-bearing steps only.
    - name: "Validate non-secret inputs"
      ansible.builtin.assert:
        that:
          - _bao_url | length > 0
        fail_msg: "Ensure openbao_addr (or OPENBAO_ADDR) + AppRole creds are set."

    # role_id/secret_id and the seeded values cross the wire to _bao_url — refuse
    # to send secret material over public cleartext. https always allowed; http
    # only to loopback/RFC1918 (the internal OpenBao VLAN).
    - name: "Refuse a cleartext OpenBao endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"
    - name: "Collect the credentials that were actually supplied"
      vars:
        _env_name: "{{ _seed_env[item] }}"
        _supplied: "{{ lookup('env', _env_name)
                       | default(lookup('vars', 'seed_' ~ item, default=''), true) }}"
      ansible.builtin.set_fact:
        _payload: >-
          {{ _payload | default({}) | combine(
               {('postiz_' ~ item): _supplied}
             ) if (_supplied | string | length > 0) else (_payload | default({})) }}
      loop: "{{ _seedable }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    # Count only — the names, never the values. Keeps the run diagnosable
    # without printing a credential.
    - name: "Report how many credentials were supplied"
      ansible.builtin.debug:
        msg: >-
          {{ (_payload | default({})) | length }} of {{ _seedable | length }} seedable
          credentials supplied: {{ (_payload | default({})).keys() | list | sort | join(', ') }}

    - name: "Nothing to do when no credentials were supplied"
      ansible.builtin.meta: end_play
      when:
        - (_payload | default({})) | length == 0
        - not (postiz_verify_access_only | default(false) | bool)

    - name: "Refuse an OpenBao address that is not the inventory's"
      ansible.builtin.include_tasks: tasks/assert-bao-addr-declared.yml

    - name: "Refuse a seed input this template does not declare"
      ansible.builtin.include_tasks: tasks/assert-seed-inputs-declared.yml
      vars:
        _si_allowed: "{{ _seed_env.values() | list }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        follow_redirects: none
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      no_log: true
      changed_when: false
      check_mode: false

    # OpenBao answers 404 for a missing path AND for one the token cannot see, so a read
    # proves nothing on first install; the capabilities decide.
    - name: "Prove this AppRole may seed the path (capabilities, no write)"
      ansible.builtin.include_tasks: tasks/assert-bao-seed-access.yml
      vars:
        _sa_url: "{{ _bao_url }}"
        _sa_token: "{{ _bao_auth.json.auth.client_token }}"
        _sa_path: "{{ _bao_path }}"
      when: postiz_verify_access_only | default(false) | bool

    - name: "Report read-only credential access"
      ansible.builtin.debug:
        msg: "Read-only Postiz access verified; no secret-store write requested."
      when: postiz_verify_access_only | default(false) | bool

    - name: "End read-only verification before every secret-store write"
      ansible.builtin.meta: end_play
      when: postiz_verify_access_only | default(false) | bool

    # tasks/bao-merge-keys.yml is THE merge-patch implementation: one read for
    # idempotency (a re-run with the same values writes nothing), a server-side
    # merge-patch into an existing path (the three generated secrets survive even if
    # they changed after the read), an atomic create (CAS 0) on a new one with the
    # create-race merge, and a verified read-back after any write. This playbook kept
    # its own copy of all of that until 2026-09-25 (review of PR #205).
    - name: "Merge the supplied credentials into secret/{{ _bao_path }}"
      ansible.builtin.include_tasks: tasks/bao-merge-keys.yml
      vars:
        _bm_url: "{{ _bao_url }}"
        _bm_token: "{{ _bao_auth.json.auth.client_token }}"
        _bm_path: "{{ _bao_path }}"
        _bm_data: "{{ _payload }}"

    - name: "Report"
      vars:
        _outcome: >-
          {{ 'check mode, nothing written: would seed' if ansible_check_mode
             else ('Seeded' if _bm_changed | bool else 'Already stored, nothing written:') }}
      ansible.builtin.debug:
        msg: >-
          {{ _outcome }} {{ (_payload | default({})) | length }} credential(s) into
          secret/{{ _bao_path }} ({{ 'new path' if _bm_existing.status == 404 else 'existing path' }}).
          Verify with Check Secrets, then run Deploy Postiz. Remember to update
          each platform's OAuth redirect URI at its developer console.
