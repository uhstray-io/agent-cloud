---
# distribute-ssh-keys.yml — Deploy SSH keys from OpenBao to authorized_keys
#
# Safe, additive, no sudo required. Does NOT modify sshd_config.
# After running this, verify key auth works, then run harden-ssh.yml separately.
#
# Usage: -e "target_service=agent_cloud"

# ── Bootstrap: a freshly built VM has no key yet ──────────────────────────────
# This playbook installs authorized_keys over a connection it does not create, so
# on a host that was not provisioned with a cloud-init key it had no way in at
# all: `Permission denied (publickey,password)`. store-ssh-password.yml has always
# written `login_password` to OpenBao for exactly this, but nothing ever read it.
#
# The password is injected with add_host rather than set as a play var, because a
# play var cannot be conditional. An EMPTY `ansible_password` is not harmless: it
# makes Ansible shell out to sshpass, so every already-keyed host would fail on a
# runner without sshpass installed. add_host sets the var only when a password
# actually exists, leaving keyed hosts on exactly the path they use today.
#
# SSH offers publickey before password, so this only ever adds a fallback — a host
# that already trusts the key still authenticates by key, and once harden-ssh has
# disabled password auth the var is simply never used.
#
# From OpenBao, never an extra var: Semaphore persists a task's extra-var JSON and
# serves it back over its API indefinitely.
- name: "Resolve the bootstrap login password (controller-side)"
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    # This password is strictly an ENHANCEMENT — a host that is already keyed does
    # not need it — so failing to read it must never be worse than not looking.
    # block/rescue rather than errors='ignore' alone, because that option only
    # covers a vault-level error: a missing hvac library, bad AppRole creds or an
    # unreachable OpenBao all raise while the task's arguments are being
    # templated, which aborts the play outright. That is the same abort class as
    # the undefined-key-path failure fixed in verify-host-access.yml, and here it
    # would break key-auth hosts that worked fine before this play existed.
    - name: "Read login_password from OpenBao (absent is fine)"
      block:
        - name: "Attempt the read"
          ansible.builtin.set_fact:
            _bootstrap_pw: "{{ lookup('community.hashi_vault.hashi_vault',
              'secret/data/services/ssh:login_password',
              url=_bao_url, auth_method='approle',
              role_id=_bao_role_id, secret_id=_bao_secret_id,
              errors='ignore') | default('', true) }}"
          no_log: true
      rescue:
        - name: "No password fallback — carry on with key auth only"
          ansible.builtin.set_fact:
            _bootstrap_pw: ""

        - name: "Say so, so a failed read is never silent"
          ansible.builtin.debug:
            msg: >-
              Could not read secret/services/ssh:login_password — continuing with
              key auth only. Harmless for a host that already trusts the key; if
              this host has no key yet, fix the OpenBao read and re-run.

    - name: "Offer it as a password fallback to the target hosts"
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_password: "{{ _bootstrap_pw }}"
      loop: "{{ groups[target_service] | default([]) }}"
      when: _bootstrap_pw | length > 0
      changed_when: false
      no_log: true

    - name: "Report whether a fallback is available (never the value)"
      ansible.builtin.debug:
        msg: >-
          {{ 'A bootstrap password is available as a fallback for '
             ~ (groups[target_service] | default([]) | length) ~ ' host(s); key auth
             is still tried first.'
             if (_bootstrap_pw | length > 0)
             else 'No login_password in OpenBao — key auth only. If the host has no
                   key yet, run Store SSH Password first.' }}

- name: "Distribute SSH keys to {{ target_service | default('(unset)') }}"
  hosts: "{{ target_service }}"
  gather_facts: false
  become: false
  vars:
    target_service: "ungrouped"
    _ssh_user: "{{ ansible_user }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Validate service_name is defined"
      ansible.builtin.assert:
        that:
          - service_name is defined
        fail_msg: "Host must have service_name defined in inventory"

    - name: "Fetch management SSH public key from OpenBao"
      ansible.builtin.set_fact:
        _mgmt_pub_key: "{{ lookup('community.hashi_vault.hashi_vault',
          'secret/data/services/ssh:public_key',
          url=_bao_url, auth_method='approle',
          role_id=_bao_role_id, secret_id=_bao_secret_id) }}"

    - name: "Fetch per-service SSH public key from OpenBao"
      ansible.builtin.set_fact:
        _svc_pub_key: "{{ lookup('community.hashi_vault.hashi_vault',
          'secret/data/services/ssh/' + service_name + ':public_key',
          url=_bao_url, auth_method='approle',
          role_id=_bao_role_id, secret_id=_bao_secret_id) }}"

    - name: "Ensure .ssh directory exists"
      ansible.builtin.file:
        path: "/home/{{ _ssh_user }}/.ssh"
        state: directory
        owner: "{{ _ssh_user }}"
        group: "{{ _ssh_user }}"
        mode: "0700"

    - name: "Deploy management SSH public key"
      ansible.posix.authorized_key:
        user: "{{ _ssh_user }}"
        key: "{{ _mgmt_pub_key }}"
        state: present

    - name: "Deploy per-service SSH public key"
      ansible.posix.authorized_key:
        user: "{{ _ssh_user }}"
        key: "{{ _svc_pub_key }}"
        state: present

    - name: "Show authorized_keys"
      ansible.builtin.shell: |
        cat /home/{{ _ssh_user }}/.ssh/authorized_keys
      register: _auth_keys
      changed_when: false

    - name: "Report"
      ansible.builtin.debug:
        msg: "{{ service_name }}: {{ _auth_keys.stdout_lines | length }} keys deployed"

# ── Verify key auth works ────────────────────────────────────────────────────
- name: "Verify SSH key auth"
  hosts: "{{ target_service }}"
  gather_facts: false
  become: false
  vars:
    target_service: "ungrouped"
    _ssh_user: "{{ ansible_user }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Fetch management private key from OpenBao"
      ansible.builtin.set_fact:
        _mgmt_priv_key: "{{ lookup('community.hashi_vault.hashi_vault',
          'secret/data/services/ssh:private_key',
          url=_bao_url, auth_method='approle',
          role_id=_bao_role_id, secret_id=_bao_secret_id) }}"

    - name: "Write key to temp file"
      ansible.builtin.tempfile:
        state: file
        prefix: ".mgmt_key_"
      register: _key_file
      delegate_to: localhost

    - name: "Set key contents"
      ansible.builtin.copy:
        content: "{{ _mgmt_priv_key }}\n"
        dest: "{{ _key_file.path }}"
        mode: "0600"
      delegate_to: localhost
      no_log: true

    - name: "Test SSH key auth to host — {{ service_name }}"
      ansible.builtin.command:
        cmd: >
          ssh -i {{ _key_file.path }}
              -o BatchMode=yes
              -o ConnectTimeout=10
              -o StrictHostKeyChecking=accept-new
              -o PasswordAuthentication=no
              -o PubkeyAuthentication=yes
              {{ _ssh_user }}@{{ ansible_host | default(inventory_hostname) }}
              echo KEY_AUTH_OK
      delegate_to: localhost
      register: _key_test
      failed_when: "'KEY_AUTH_OK' not in _key_test.stdout"
      changed_when: false

    - name: "Result"
      ansible.builtin.debug:
        msg: "{{ service_name }}: SSH key auth {{ 'CONFIRMED' if _key_test.rc == 0 else 'FAILED' }}"

    - name: "Remove temp key"
      ansible.builtin.file:
        path: "{{ _key_file.path }}"
        state: absent
      delegate_to: localhost
