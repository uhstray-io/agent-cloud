---
# Reconcile the declared o11y VM into one existing explicit-VMID backup job.
# The selected job ID and VM identity are private inventory, never launch vars.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Reconcile the declared o11y backup job
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      # Match the existing Proxmox playbooks until the PVE CA is installed on
      # the Semaphore runner; private inventory controls certificate checks.
      validate_certs: "{{ proxmox_validate_certs | default(false) | bool }}"
      follow_redirects: none
  vars:
    _project_root: "{{ playbook_dir | dirname | dirname }}"
    _planner: "{{ playbook_dir }}/files/reconcile_proxmox_backup_job.py"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _o11y_hosts: "{{ groups['o11y_svc'] | default([]) }}"
    _o11y_host: "{{ _o11y_hosts | first | default('') }}"
    _vmid: "{{ hostvars[_o11y_host].vm_vmid | default('') | string if _o11y_host else '' }}"
    _node: "{{ hostvars[_o11y_host].vm_node | default('') | string if _o11y_host else '' }}"
    _backup_job_id: "{{ hostvars[_o11y_host].o11y_backup_job_id | default('') | string if _o11y_host else '' }}"
    _inspect_only: "{{ inspect_only | default('true') | bool }}"
  tasks:
    - name: Require the reviewed Dev revision and exact private o11y declarations
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - not (local_mode | default(false) | bool)
          - _o11y_hosts | length == 1
          - _vmid is match('^(?:[1-9][0-9]{2,8})$')
          - _node is match('^[A-Za-z0-9._-]+$')
          - inspect_only | default('true') | string | lower in ['true', 'false']
        fail_msg: >-
          Backup-job reconciliation requires one declared production o11y VM,
          a valid inspect-only choice, and the exact reviewed Dev revision.

    - name: Require the private selected job ID for apply mode
      ansible.builtin.assert:
        that: _backup_job_id is match('^[A-Za-z0-9._-]{1,64}$')
        fail_msg: "Apply mode requires one backup-job ID declared on the o11y inventory host."
      when: not _inspect_only

    - name: Read controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ _project_root }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Require the exact reviewed controller revision
      ansible.builtin.assert:
        that: _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different reviewed Dev revision."

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ _project_root }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Require a clean reviewed checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "The reviewed controller checkout contains uncommitted files."

    - name: Refuse public cleartext OpenBao transport
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: Read Proxmox API credentials from OpenBao
      ansible.builtin.set_fact:
        _pve_data: "{{ lookup('community.hashi_vault.hashi_vault',
          'secret/data/services/proxmox', url=_bao_url, auth_method='approle',
          role_id=_bao_role_id, secret_id=_bao_secret_id) }}"
      no_log: true

    - name: Derive Proxmox API connection values
      ansible.builtin.set_fact:
        _pve_host: "{{ _pve_data.url | default('') }}"
        _pve_token_id: "{{ _pve_data.token_id | default('') }}"
        _pve_secret: "{{ _pve_data.api_token | default('') }}"
      no_log: true

    - name: Require an HTTPS Proxmox API URL and a complete token
      ansible.builtin.assert:
        that:
          - _pve_host is match('^https://')
          - _pve_token_id | length > 0
          - _pve_secret | length > 0
        fail_msg: >-
          secret/services/proxmox must give an HTTPS url, a token_id
          (<user>@<realm>!<token-name>) and api_token; there is no built-in token id.

    - name: Read VM inventory from Proxmox
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/resources?type=vm"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _pve_vms
      no_log: true
      check_mode: false

    - name: Verify the declared o11y VM exists on its declared node
      ansible.builtin.assert:
        that:
          - _pve_vms.json.data is sequence
          - _pve_vms.json.data is not string
          - _pve_vms.json.data is not mapping
          - >-
            (_pve_vms.json.data
             | selectattr('type', 'equalto', 'qemu')
             | selectattr('vmid', 'equalto', _vmid | int)
             | selectattr('node', 'equalto', _node)
             | list | length) == 1
        fail_msg: "The declared o11y VM could not be verified on its declared Proxmox node."

    - name: Read Proxmox backup-job list before inspection
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/backup"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_jobs
      no_log: true
      check_mode: false

    - name: Require a usable backup-job list
      ansible.builtin.assert:
        that:
          - _backup_jobs.json.data is sequence
          - _backup_jobs.json.data is not string
          - _backup_jobs.json.data is not mapping
        fail_msg: "Proxmox did not return a usable backup-job list."

    - name: Build a sanitized backup-job candidate report
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", inspect]
        stdin: >-
          {{ {'job_id': _backup_job_id, 'vmid': _vmid,
              'jobs': _backup_jobs.json.data} | to_json }}
      register: _backup_inspection_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require safe backup-job inspection data
      ansible.builtin.assert:
        that: _backup_inspection_result.rc == 0
        fail_msg: >-
          Backup-job inspection refused:
          {{ ((_backup_inspection_result.stdout | from_json).refusal
              | default('Proxmox returned invalid inspection data.')) }}

    - name: Keep the sanitized selected-job inspection private to this run
      ansible.builtin.set_fact:
        _backup_inspection: "{{ _backup_inspection_result.stdout | from_json }}"
      no_log: true

    - name: Read the privately selected backup-job detail for inspection
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/backup/{{ _backup_job_id }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_inspect_job_detail
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - _inspect_only
        - _backup_inspection.selected_job.match == 'unique'

    - name: Read storage available to the declared node for destination inspection
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/storage"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_node_storage
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - _inspect_only
        - _backup_inspection.selected_job.match == 'unique'

    - name: Summarize the selected job destination without exposing its identity
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", storage-summary]
        stdin: >-
          {{ {'job_id': _backup_job_id,
              'jobs': _backup_jobs.json.data,
              'job_detail_response': {
                'status': _backup_inspect_job_detail.status | default(0),
                'json': _backup_inspect_job_detail.json | default({})
              },
              'storage_response': {
                'status': _backup_node_storage.status | default(0),
                'json': _backup_node_storage.json | default({})
              }} | to_json }}
      register: _backup_selected_destination_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the sanitized selected-destination state
      ansible.builtin.set_fact:
        _backup_selected_destination: "{{ _backup_selected_destination_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read effective permissions on the declared Proxmox node
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/access/permissions?path={{ ('/nodes/' ~ _node) | urlencode }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_history_permissions
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Plan bounded archived backup-task history inspection
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", history-query]
        stdin: >-
          {{ {'node': _node, 'vmid': _vmid,
              'permissions_response': {
                'status': _backup_history_permissions.status | default(0),
                'json': {'data': _backup_history_permissions.json.data | default({})}
              }} | to_json }}
      register: _backup_history_query_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the bounded backup-task history query private to this run
      ansible.builtin.set_fact:
        _backup_history_query: "{{ _backup_history_query_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read pvescheduler state after verified node-scoped permission
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/nodes/{{ _node }}/services/pvescheduler/state"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_scheduler_state
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - _inspect_only
        - _backup_history_query.read_allowed | default(false) | bool

    - name: Summarize pvescheduler state without exposing the API response
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", scheduler-state]
        stdin: >-
          {{ {'permissions_verified': _backup_history_query.read_allowed | default(false) | bool,
              'response': {
                'status': _backup_scheduler_state.status | default(0),
                'json': _backup_scheduler_state.json | default({})
              }} | to_json }}
      register: _backup_scheduler_state_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the sanitized scheduler state private to this run
      ansible.builtin.set_fact:
        _backup_scheduler_state_summary: "{{ _backup_scheduler_state_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read the first archived vzdump task page
      ansible.builtin.uri:
        url: >-
          {{ _pve_host ~ '/api2/json/nodes/' ~ _node ~ '/tasks?source=archive&typefilter=vzdump&vmid='
             ~ _vmid ~ '&since=' ~ _backup_history_query.query.since
             ~ '&until=' ~ _backup_history_query.query.until ~ '&start=0&limit=50' }}
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_history_first
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only and _backup_history_query.read_allowed | bool

    - name: Plan remaining bounded task-history pages
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", history-pages]
        stdin: >-
          {{ {'read_allowed': _backup_history_query.read_allowed | default(false),
              'first_page': {
                'status': _backup_history_first.status | default(0),
                'json': _backup_history_first.json | default({})
              }} | to_json }}
      register: _backup_history_pages_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the task-history pagination plan private to this run
      ansible.builtin.set_fact:
        _backup_history_pages: "{{ _backup_history_pages_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read later archived vzdump task pages
      ansible.builtin.uri:
        url: >-
          {{ _pve_host ~ '/api2/json/nodes/' ~ _node ~ '/tasks?source=archive&typefilter=vzdump&vmid='
             ~ _vmid ~ '&since=' ~ _backup_history_query.query.since
             ~ '&until=' ~ _backup_history_query.query.until ~ '&start=' ~ item ~ '&limit=50' }}
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      loop: "{{ _backup_history_pages.page_starts }}"
      register: _backup_history_later
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - _inspect_only
        - _backup_history_query.read_allowed | bool

    - name: Summarize archived task history without exposing task identity or details
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", history-summary]
        stdin: >-
          {{ {'plan': _backup_history_query,
              'first_page': {
                'status': _backup_history_first.status | default(0),
                'json': _backup_history_first.json | default({})
              },
              'later_pages': _backup_history_later.results | default([])} | to_json }}
      register: _backup_history_summary_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the sanitized task-history summary private to this run
      ansible.builtin.set_fact:
        _backup_history_summary: "{{ _backup_history_summary_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Plan bounded node-wide archived vzdump history inspection
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", node-history-query]
        stdin: >-
          {{ {'node': _node, 'vmid': _vmid,
              'permissions_response': {
                'status': _backup_history_permissions.status | default(0),
                'json': {'data': _backup_history_permissions.json.data | default({})}
              }} | to_json }}
      register: _backup_node_history_query_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the bounded node-history query private to this run
      ansible.builtin.set_fact:
        _backup_node_history_query: "{{ _backup_node_history_query_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read the first node-wide archived vzdump task page
      ansible.builtin.uri:
        url: >-
          {{ _pve_host ~ '/api2/json/nodes/' ~ _node ~ '/tasks?source=archive&typefilter=vzdump&since='
             ~ _backup_node_history_query.query.since ~ '&until=' ~ _backup_node_history_query.query.until
             ~ '&start=0&limit=50' }}
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_node_history_first
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only and _backup_node_history_query.read_allowed | bool

    - name: Plan remaining bounded node-history pages
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", history-pages]
        stdin: >-
          {{ {'read_allowed': _backup_node_history_query.read_allowed | default(false),
              'first_page': {
                'status': _backup_node_history_first.status | default(0),
                'json': _backup_node_history_first.json | default({})
              }} | to_json }}
      register: _backup_node_history_pages_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the node-history pagination plan private to this run
      ansible.builtin.set_fact:
        _backup_node_history_pages: "{{ _backup_node_history_pages_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read later node-wide archived vzdump task pages
      ansible.builtin.uri:
        url: >-
          {{ _pve_host ~ '/api2/json/nodes/' ~ _node ~ '/tasks?source=archive&typefilter=vzdump&since='
             ~ _backup_node_history_query.query.since ~ '&until=' ~ _backup_node_history_query.query.until
             ~ '&start=' ~ item ~ '&limit=50' }}
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      loop: "{{ _backup_node_history_pages.page_starts }}"
      register: _backup_node_history_later
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - _inspect_only
        - _backup_node_history_query.read_allowed | bool

    - name: Summarize node-wide archived task history without task identity or details
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", node-history-summary]
        stdin: >-
          {{ {'plan': _backup_node_history_query,
              'first_page': {
                'status': _backup_node_history_first.status | default(0),
                'json': _backup_node_history_first.json | default({})
              },
              'later_pages': _backup_node_history_later.results | default([])} | to_json }}
      register: _backup_node_history_summary_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep the sanitized node-history summary private to this run
      ansible.builtin.set_fact:
        _backup_node_history_summary: "{{ _backup_node_history_summary_result.stdout | from_json }}"
      when: _inspect_only

    - name: Select one recent failed node task for a bounded diagnostic
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", node-failure-plan]
        stdin: >-
          {{ {'plan': _backup_node_history_query,
              'first_page': {
                'status': _backup_node_history_first.status | default(0),
                'json': _backup_node_history_first.json | default({})
              },
              'later_pages': _backup_node_history_later.results | default([])} | to_json }}
      register: _backup_node_failure_plan_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep private node-task diagnostic selection
      ansible.builtin.set_fact:
        _backup_node_failure_plan: "{{ _backup_node_failure_plan_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read one task-log metadata line for a recent unique failure
      ansible.builtin.uri:
        url: "{{ _pve_host ~ _backup_node_failure_plan.metadata_path }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_node_failure_metadata
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only and _backup_node_failure_plan.read_allowed | default(false) | bool

    - name: Compare task metadata with private selected backup identity
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", node-failure-identity]
        stdin: >-
          {{ {'job_id': _backup_job_id, 'vmid': _vmid,
              'jobs': _backup_jobs.json.data,
              'job_detail_response': {
                'status': _backup_inspect_job_detail.status | default(0),
                'json': _backup_inspect_job_detail.json | default({})
              },
              'metadata_response': {
                'status': _backup_node_failure_metadata.status | default(0),
                'json': _backup_node_failure_metadata.json | default({})
              }} | to_json }}
      register: _backup_node_failure_identity_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep sanitized task identity comparisons
      ansible.builtin.set_fact:
        _backup_node_failure_identity: "{{ _backup_node_failure_identity_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Plan the bounded final task-log page
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", node-failure-pages]
        stdin: >-
          {{ {'read_allowed': _backup_node_failure_plan.read_allowed | default(false),
              'diagnostic': _backup_node_failure_plan.diagnostic | default(None),
              'metadata_path': _backup_node_failure_plan.metadata_path | default(''),
              'metadata_response': {
                'status': _backup_node_failure_metadata.status | default(0),
                'json': _backup_node_failure_metadata.json | default({})
              }} | to_json }}
      register: _backup_node_failure_pages_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep private task-log pagination plan
      ansible.builtin.set_fact:
        _backup_node_failure_pages: "{{ _backup_node_failure_pages_result.stdout | from_json }}"
      no_log: true
      when: _inspect_only

    - name: Read the bounded final task-log lines
      ansible.builtin.uri:
        url: "{{ _pve_host ~ _backup_node_failure_pages.log_path }}"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_node_failure_log
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only and _backup_node_failure_pages.read_allowed | default(false) | bool

    - name: Classify task log into a fixed failure hint
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", node-failure-summary]
        stdin: >-
          {{ {'page_plan': _backup_node_failure_pages,
              'log_response': {
                'status': _backup_node_failure_log.status | default(0),
                'json': _backup_node_failure_log.json | default({})
              }} | to_json }}
      register: _backup_node_failure_summary_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: _inspect_only

    - name: Keep sanitized node-task failure diagnostic
      ansible.builtin.set_fact:
        _backup_node_failure_diagnostic: "{{ _backup_node_failure_summary_result.stdout | from_json }}"
      when: _inspect_only

    - name: Report sanitized selected backup-job status
      ansible.builtin.debug:
        msg:
          backup_job_reconciliation: inspect_only
          candidate_count: "{{ _backup_inspection.candidate_count }}"
          selected_backup_job: "{{ _backup_inspection.selected_job }}"
          backup_task_history: "{{ _backup_history_summary }}"
          proxmox_node_task_history: "{{ _backup_node_history_summary }}"
          proxmox_node_task_failure_diagnostic: "{{ _backup_node_failure_diagnostic }}"
          proxmox_node_task_identity: "{{ _backup_node_failure_identity }}"
          selected_backup_destination: "{{ _backup_selected_destination }}"
          proxmox_scheduler_state: "{{ _backup_scheduler_state_summary }}"
      when: _inspect_only

    - name: End after read-only backup-job inspection
      ansible.builtin.meta: end_play
      when: _inspect_only

    - name: Require one exact private selected backup job
      ansible.builtin.assert:
        that:
          - >-
            (_backup_jobs.json.data
             | selectattr('id', 'equalto', _backup_job_id)
             | list | length) == 1
        fail_msg: "The private backup-job ID is ambiguous or absent from Proxmox."
      when: not _inspect_only

    - name: Read the selected backup-job detail
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/backup/{{ _backup_job_id }}"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_job_detail
      no_log: true
      check_mode: false

    - name: Plan an explicit-VMID-only reconciliation
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", plan]
        stdin: >-
          {{ {'job_id': _backup_job_id, 'vmid': _vmid,
              'jobs': _backup_jobs.json.data,
              'detail': _backup_job_detail.json.data} | to_json }}
      register: _backup_plan_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require a safe explicit-VMID backup-job plan
      ansible.builtin.assert:
        that: _backup_plan_result.rc == 0
        fail_msg: >-
          Backup-job planning refused:
          {{ ((_backup_plan_result.stdout | from_json).refusal
              | default('Proxmox returned invalid planning data.')) }}
          No Proxmox write was attempted.

    - name: Keep the validated backup-job plan private to this run
      ansible.builtin.set_fact:
        _backup_plan: "{{ _backup_plan_result.stdout | from_json }}"
      no_log: true

    - name: Report a check-mode backup-job preview
      ansible.builtin.debug:
        msg:
          backup_job_reconciliation: check_mode
          would_change: "{{ _backup_plan.changed | bool }}"
          current_member_count: "{{ _backup_plan.before_vmids | length }}"
          planned_member_count: "{{ _backup_plan.desired_vmids | length }}"
          target_already_member: "{{ not (_backup_plan.changed | bool) }}"
      when: ansible_check_mode

    - name: Refresh the selected backup job immediately before a write
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/backup/{{ _backup_job_id }}"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_job_before_write
      no_log: true
      check_mode: false
      when:
        - _backup_plan.changed | bool
        - not ansible_check_mode

    - name: Compare the fresh backup-job state with the initial inspection
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", recheck]
        stdin: >-
          {{ {'plan': _backup_plan,
              'detail': _backup_job_before_write.json.data} | to_json }}
      register: _backup_recheck_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when:
        - _backup_plan.changed | bool
        - not ansible_check_mode

    - name: Refuse a backup job changed after inspection
      ansible.builtin.assert:
        that: _backup_recheck_result.rc == 0
        fail_msg: >-
          Backup-job pre-write check refused:
          {{ ((_backup_recheck_result.stdout | from_json).refusal
              | default('The selected backup job failed its safety recheck.')) }}
          No Proxmox write was attempted.
      when:
        - _backup_plan.changed | bool
        - not ansible_check_mode

    - name: Add the o11y VM to the explicit VMID list
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/backup/{{ _backup_job_id }}"
        method: PUT
        body_format: form-urlencoded
        body:
          vmid: "{{ _backup_plan.desired_vmid }}"
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_job_put
      no_log: true
      changed_when: true
      when:
        - _backup_plan.changed | bool
        - not ansible_check_mode

    - name: Read the backup-job state after reconciliation
      ansible.builtin.uri:
        url: "{{ _pve_host }}/api2/json/cluster/backup/{{ _backup_job_id }}"
        method: GET
        status_code: 200
        headers:
          Authorization: "PVEAPIToken={{ _pve_token_id }}={{ _pve_secret }}"
      register: _backup_job_after
      no_log: true
      check_mode: false
      when: not ansible_check_mode

    - name: Verify exact membership and preserved options
      ansible.builtin.command:
        argv: [python3, "{{ _planner }}", verify]
        stdin: >-
          {{ {'plan': _backup_plan,
              'detail': _backup_job_after.json.data} | to_json }}
      register: _backup_verify_result
      failed_when: false
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Require exact backup-job readback
      ansible.builtin.assert:
        that: _backup_verify_result.rc == 0
        fail_msg: >-
          Backup-job readback refused:
          {{ ((_backup_verify_result.stdout | from_json).refusal
              | default('Proxmox returned invalid readback data.')) }}
      when: not ansible_check_mode

    - name: Keep the sanitized backup-job readback summary
      ansible.builtin.set_fact:
        _backup_verified: "{{ _backup_verify_result.stdout | from_json }}"
      no_log: true
      when: not ansible_check_mode

    - name: Report the verified backup-job reconciliation
      ansible.builtin.debug:
        msg:
          backup_job_reconciliation: verified
          changed: "{{ _backup_plan.changed | bool }}"
          target_member: "{{ _backup_verified.target_member | bool }}"
          final_member_count: "{{ _backup_verified.member_count | int }}"
      when: not ansible_check_mode
