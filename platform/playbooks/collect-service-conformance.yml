---
# collect-service-conformance.yml — the service deployment workflow's conformance collector.
#
# Change service-deployment-workflow task 7.5; spec platform/service-onboarding-workflow,
# "Per-service conformance is tracked and reported". Runs INSIDE the Semaphore controller on
# a schedule and is the ONLY writer of the workflow status (single-writer test):
#
#   read   each WORKFLOW template's own task history (its newest 1000 tasks), then the raw
#          output of only the newest finished task per (template, service). Reading per
#          template, not the project-wide list, keeps a service visible however busy the
#          project is (this collector alone runs 96 times a day). A template whose history
#          fills the window is reported (`history_window_full`) and marks the services it can
#          affect `history_incomplete`; each service's status already in NetBox is merged
#          UNDER this run's results, so a result older than the window is kept in NetBox, the
#          report and Loki alike, never erased (PR 195 and PR 258 Codex reviews).
#   parse  workflows/service-onboarding/lib/step_results.py (select / pick / aggregate): latest
#          result per service and step; a failed task with no result counts as `fail` with
#          its last 20 lines. A service is named by its inventory group's service_name (its first
#          tracked host's, so a skipped host listed first does not hide the group); a host
#          that sets the host var `service_conformance_tracked: false` (default true; the string
#          "false" counts) is skipped, so a non-service host carrying a service_name never
#          appears as a service that has not run.
#   write  NetBox custom fields on each service's VM (declared in
#          workflows/service-onboarding/netbox-custom-fields.yml), with the scoped
#          workflow-collector token (view/change VMs only); in local-dev, one direct Loki line
#          per step; in production, OTLP/HTTP to the dedicated private Alloy receiver, with
#          task details in the record body and only job/service/step/status as Loki labels
#
# A NetBox that is down or holds no VM for a service never fails the run: the collector
# records what it could not write and tries again next interval (spec scenario "NetBox outage
# does not block deployment"). Its own step result is not a workflow step, so it records the
# aggregate with set_stats under `conformance` instead.
#
# The read-only REPORT (spec: each failed step with its criteria not met, error context, undo
# and task, plus every unreviewed step) is this playbook's dry run: `conformance.report` in
# the task output, with nothing written anywhere.
#
# Controller API: fixed loopback, like the survey publisher; the OpenBao-sourced token never
# goes to a caller-chosen address. Dry run (--check): reads and parses, writes nothing.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

#
# NOT YET: the spec's collector also reads Prometheus, as the evidence for the
# instrument-host and instrument-service steps. Those steps have no executor yet
# (registry `executor: null`), so there is nothing to observe; the Prometheus read lands
# with them (tasks.md 7.5, review of PR #195). Until then those steps show no result,
# never a pass.
- name: "Collect service deployment workflow conformance"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _semaphore_url: "http://127.0.0.1:3000"
    _pid: "{{ semaphore_project_id | default(1) }}"
    _workflow: "{{ playbook_dir }}/../workflows/service-onboarding"
    _parser: "{{ _workflow }}/lib/step_results.py"
    _registry: "{{ (lookup('file', _workflow ~ '/registry.yml') | from_yaml).steps }}"
    # The closed per-service deploy list OPA grants: only these are the "Deploy {service}" step.
    _deploy_templates: >-
      {{ (lookup('file', playbook_dir ~ '/../services/opa/deployment/policies/agentcloud/data.json') | from_json)
         .catalog['service-agent'].service_deploy_templates }}
    _netbox_url: "{{ netbox_url | default(hostvars[groups['netbox_svc'][0]].service_url if (groups['netbox_svc'] | default([])) else '') }}"
    _o11y_bind: "{{ (hostvars[groups['o11y_svc'][0]].o11y_otlp_bind if groups.get('o11y_svc', []) | length == 1 else '') | default('') }}"
    _o11y_private_ipv4_pattern: >-
      (?x)\A(?:
      10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])
      |192\.168\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])
      |172\.(?:1[6-9]|2[0-9]|3[01])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])
      )\Z
    _semaphore_host: "{{ groups.get('semaphore_svc', []) | first | default('') }}"
    _collector_otlp_url: "{{ hostvars.get(_semaphore_host, {}).get('collector_otlp_url', '') }}"

  tasks:
    - name: "Refuse a controller API destination override before authentication"
      ansible.builtin.assert:
        # Both the public override and the URL the requests actually use (Codex review of #276).
        that:
          - _semaphore_url == 'http://127.0.0.1:3000'
          - (semaphore_url | default(_semaphore_url)) == 'http://127.0.0.1:3000'
        fail_msg: "The collector may only use the controller's fixed loopback API."

    # An unparsed inventory empties every group; name that before the OTLP guard reads them.
    - name: "Require the inventory to have parsed"
      ansible.builtin.include_tasks: tasks/require-parsed-inventory.yml
      when: not (local_mode | default(false) | bool)

    - name: "Require the exact private Alloy OTLP/HTTP destination in production"
      ansible.builtin.assert:
        that:
          - groups.get('o11y_svc', []) | length == 1
          - _o11y_bind is match(_o11y_private_ipv4_pattern)
          - groups.get('semaphore_svc', []) | length == 1
          - _collector_otlp_url == 'http://' ~ _o11y_bind ~ ':4318/v1/logs'
        fail_msg: "Production conformance delivery requires collector_otlp_url to match the declared private Alloy OTLP/HTTP receiver."
      when: not (local_mode | default(false) | bool)

    - name: "Semaphore runtime access (injected token, or the controller AppRole)"
      ansible.builtin.include_tasks: ../semaphore/tasks/runtime-access.yml

    - name: "Read the template catalog"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _pid }}/templates"
        headers:
          Authorization: "Bearer {{ _token }}"
      register: _templates
      check_mode: false
      no_log: true

    - name: "Map each inventory host to its service name"
      # Plain names only: hostvars themselves never go to the parser.
      ansible.builtin.set_fact:
        _host_services: "{{ _host_services | default({}) | combine({item: hostvars[item].service_name}) }}"
      loop: "{{ groups['all'] }}"
      # A host that sets `service_conformance_tracked: false` is not a workflow service (a drill
      # host that borrows a service_name): it contributes none, so no group, no VM lookup and no
      # "never run" row exists for it. Every consumer reads this map, so this is the one cut.
      when:
        - hostvars[item].service_name is defined
        - hostvars[item].service_conformance_tracked | default(true) | bool

    - name: "Select the workflow templates"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'select', 'registry': _registry, 'templates': _templates.json, 'deploy_templates': _deploy_templates,
              'groups': groups, 'host_services': _host_services | default({})} | to_json }}
      register: _select
      changed_when: false
      check_mode: false

    - name: "Read each workflow template's task history"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _pid }}/templates/{{ item }}/tasks"
        headers:
          Authorization: "Bearer {{ _token }}"
      loop: "{{ (_select.stdout | from_json).template_ids }}"
      register: _histories
      check_mode: false
      no_log: true

    - name: "Pick the newest finished task per template and service"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'pick', 'groups': groups, 'host_services': _host_services | default({}),
              'histories': _histories.results | map(attribute='json') | list} | to_json }}
      register: _pick
      changed_when: false
      check_mode: false

    - name: "Read each picked task's output"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _pid }}/tasks/{{ item.id }}/raw_output"
        headers:
          Authorization: "Bearer {{ _token }}"
        return_content: true
      loop: "{{ (_pick.stdout | from_json).tasks }}"
      loop_control:
        label: "task {{ item.id }}"
      register: _outputs
      check_mode: false
      no_log: true

    # ── NetBox ──────────────────────────────────────────────────────────────────────────
    - name: "NetBox: read the collector token"
      when: _netbox_url | length > 0
      block:
        - name: "Refuse a cleartext NetBox endpoint before any token goes to it"
          ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
          vars:
            _assert_bao_url: "{{ _netbox_url }}"
            _assert_url_label: "NetBox"

        - name: "Refuse a cleartext secret-store endpoint"
          ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
          vars:
            _assert_bao_url: "{{ _runtime_bao_url }}"

        - name: "Authenticate to OpenBao (AppRole), unless runtime access already did"
          ansible.builtin.uri:
            url: "{{ _runtime_bao_url }}/v1/auth/approle/login"
            method: POST
            body_format: json
            body:
              role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
              secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
            follow_redirects: none
          register: _bao_auth
          when: _runtime_login.json is not defined
          changed_when: false
          check_mode: false
          no_log: true

        - name: "Read the NetBox secret"
          ansible.builtin.uri:
            url: "{{ _runtime_bao_url }}/v1/secret/data/services/netbox"
            headers:
              X-Vault-Token: "{{ (_runtime_login.json | default(_bao_auth.json)).auth.client_token }}"
            unredirected_headers: [X-Vault-Token]
            follow_redirects: none
          register: _nb_secret
          check_mode: false
          no_log: true

        - name: "Build the NetBox API headers"
          ansible.builtin.include_tasks: tasks/netbox-api-headers.yml
          vars:
            _nb_token: "{{ _nb_secret.json.data.data.collector_api_token | default('') }}"
          when: (_nb_secret.json.data.data.collector_api_token | default('')) | length > 0

    - name: "NetBox: find each service's VM"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/virtualization/virtual-machines/?name={{ (collector_vm_names | default({}))[item] | default(item) | urlencode }}"
        headers: "{{ _nb_headers }}"
        status_code: [200]
      # Every inventoried service, including one that has not run a step yet (review of PR
      # #229), as the PARSER keys them (first tracked host of each group): the write indexes the
      # aggregate by these names, so any other list could reach a service it lacks.
      loop: "{{ (_select.stdout | from_json).inventory_services }}"
      register: _vms
      failed_when: false
      check_mode: false
      no_log: true
      when: _nb_headers is defined

    - name: "NetBox: keep only bounded lookup data"
      ansible.builtin.set_fact:
        # Whitelist only the fields needed to prove a complete list read and select a unique
        # VM. Registered uri results can carry token-bearing request headers (PR 195 review).
        _netbox_results: >-
          {%- set out = [] -%}
          {%- for r in (_vms | default({})).results | default([]) -%}
            {%- set response = r.json | default({}) -%}
            {%- set page_terminal = none -%}
            {%- if response is mapping and 'next' in response -%}
              {%- set page_terminal = response.get('next') is none -%}
            {%- endif -%}
            {%- set rows = [] -%}
            {%- if response.results is defined and response.results is sequence and response.results is not string and response.results is not mapping -%}
              {%- for vm in response.results -%}
                {%- if vm is mapping -%}
                  {%- set fields = vm.custom_fields | default({}) -%}
                  {%- set status = fields.ac_workflow_status | default({}, true) if fields is mapping else none -%}
                  {%- if rows.append({'id': vm.id | default(none),
                                      'custom_fields': ({'ac_workflow_status': status} if fields is mapping else none)}) -%}{%- endif -%}
                {%- else -%}
                  {%- if rows.append(none) -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set safe_rows = rows -%}
            {%- else -%}
              {%- set safe_rows = none -%}
            {%- endif -%}
            {%- if out.append({'item': r.item | default(none), 'status': r.status | default(none),
                               'json': {'count': (response.get('count') if response is mapping else none),
                                        'next_is_terminal': page_terminal,
                                        'results': safe_rows}}) -%}{%- endif -%}
          {%- endfor -%}{{ out }}

    - name: "NetBox: classify complete reads and unique matches"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'netbox',
              'expected_services': ((_select.stdout | from_json).inventory_services if _netbox_url | length > 0 else []),
              'results': _netbox_results} | to_json }}
      register: _netbox_classification
      changed_when: false
      check_mode: false

    - name: "NetBox: hold classified lookup outcomes"
      ansible.builtin.set_fact:
        _netbox_state: "{{ _netbox_classification.stdout | from_json }}"
        _vm_found: "{{ (_netbox_classification.stdout | from_json).found }}"
        _vm_missing: "{{ (_netbox_classification.stdout | from_json).missing }}"
        _vm_ambiguous: "{{ (_netbox_classification.stdout | from_json).ambiguous }}"
        _vm_unknown: "{{ (_netbox_classification.stdout | from_json).unknown }}"

    # ── the aggregate: after the NetBox read, which supplies what it retains ────────────
    - name: "Aggregate: latest result per service and step"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'aggregate', 'registry': _registry, 'templates': _templates.json, 'deploy_templates': _deploy_templates,
              'fetched': _fetched, 'window_full': (_pick.stdout | from_json).window_full, 'retained': _retained,
              'groups': groups, 'host_services': _host_services | default({}),
              'now_ns': (now(utc=true).timestamp() * 1000000000) | int} | to_json }}
      register: _aggregate_run
      changed_when: false
      check_mode: false
      vars:
        # The status each service's NetBox VM already holds: merged UNDER this run's results, so
        # a step whose last run is older than the history window keeps its status in NetBox, the
        # report and Loki alike (PR 258 Codex review). Empty when NetBox is not configured.
        _retained: "{{ _vm_found | default([]) | items2dict(key_name='item', value_name='status') }}"
        # Only the picked task, the response body and its status: a registered uri result also
        # carries the request, the Semaphore token in its headers, and a failed command prints
        # its stdin (PR 195 Codex review).
        _fetched: >-
          {%- set out = [] -%}
          {%- for r in _outputs.results | default([]) -%}
            {%- if out.append({'item': r.item, 'content': r.content | default(''), 'status': r.status | default(0)}) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: "Hold the aggregate"
      ansible.builtin.set_fact:
        _agg: "{{ _aggregate_run.stdout | from_json }}"

    - name: "Record the aggregate for the report and the dashboard"
      ansible.builtin.set_stats:
        data:
          conformance: "{{ _agg | dict2items | rejectattr('key', 'in', ['loki_streams', 'otlp_payload']) | items2dict }}"
        per_host: false
        aggregate: false

    - name: "NetBox: write each service's workflow status"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/virtualization/virtual-machines/{{ item.id }}/"
        method: PATCH
        headers: "{{ _nb_headers }}"
        body_format: json
        body:
          custom_fields:
            # Already merged with what the VM held (the parser's `retained`).
            ac_workflow_status: "{{ _agg.status_by_service[item.item] }}"
            ac_failed_steps: "{{ _agg.failed_steps[item.item] | join(',') }}"
            ac_last_run: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        status_code: [200]
      loop: "{{ _vm_found }}"
      loop_control:
        label: "{{ item.item }}"
      register: _nb_writes
      changed_when: true
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: "NetBox: keep bounded write outcomes for the completion gate"
      ansible.builtin.set_fact:
        _netbox_write_results: >-
          {%- set out = [] -%}
          {%- for r in (_nb_writes | default({})).results | default([]) -%}
            {%- if out.append({'item': r.item.item | default(none), 'status': r.status | default(none),
                               'failed': r.failed | default(false), 'skipped': r.skipped | default(false)}) -%}{%- endif -%}
          {%- endfor -%}{{ out }}

    - name: "Completion: require complete NetBox reads and successful unique-match writes"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'completion', 'netbox_read_complete': _netbox_state.complete,
              'required_services': _vm_found | map(attribute='item') | list,
              'write_results': _netbox_write_results} | to_json }}
      register: _completion_gate
      changed_when: false
      check_mode: false

    - name: "Completion: hold the required-work result"
      ansible.builtin.set_fact:
        _completion_ready: "{{ not ansible_check_mode and (_completion_gate.stdout | from_json).eligible }}"

    # Local-dev retains the loopback direct-Loki path; production uses the private OTLP receiver.
    # The shared push task; an unreachable Loki never fails the collector (it reports instead).
    - name: "Local Loki: one line per step result"
      ansible.builtin.include_tasks: tasks/push-loki-lines.yml
      vars:
        push_loki_url: "{{ collector_loki_url }}"
        push_loki_streams: "{{ _agg.loki_streams }}"
        push_loki_must_succeed: false
      when:
        - not ansible_check_mode
        - local_mode | default(false) | bool
        - collector_loki_url is defined
        - _agg.loki_streams | length > 0

    - name: "Production Alloy: deliver conformance records over OTLP/HTTP"
      ansible.builtin.uri:
        url: "{{ _collector_otlp_url }}"
        method: POST
        body_format: json
        body: "{{ _agg.otlp_payload }}"
        headers:
          Content-Type: application/json
        status_code: [200]
      register: _otlp
      changed_when: true
      failed_when: false
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)
        - _agg.otlp_payload.resourceLogs | length > 0

    - name: "Classify the OTLP response without exposing its body"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {%- set response = _otlp | default({}) -%}
          {%- set body = response.get('json') -%}
          {%- set partial = (body.get('partialSuccess') if body is mapping else none) -%}
          {{ {'mode': 'otlp_ack',
              'status': (response.get('status') if response.get('status') is integer and response.get('status') is not boolean else none),
              'content_type_valid': (response.get('content_type', '') | default('', true) | trim | lower == 'application/json'),
              'body_is_object': body is mapping,
              'body_fields_known': (body is mapping and (body.keys() | list | difference(['partialSuccess']) | length == 0)),
              'partial_success_present': (body is mapping and 'partialSuccess' in body),
              'partial_success_is_object': partial is mapping,
              'partial_fields_known': (partial is mapping and (partial.keys() | list | difference(['rejectedLogRecords', 'errorMessage']) | length == 0)),
              'rejected_present': (partial is mapping and 'rejectedLogRecords' in partial),
              'rejected_records': (partial.get('rejectedLogRecords') if partial is mapping and
                                   ((partial.get('rejectedLogRecords') is integer and partial.get('rejectedLogRecords') is not boolean and
                                     0 <= partial.get('rejectedLogRecords') <= 9223372036854775807) or
                                    (partial.get('rejectedLogRecords') is string and
                                     partial.get('rejectedLogRecords') is match('^(0|[1-9][0-9]{0,18})$'))) else none),
              'warning_present': (partial is mapping and 'errorMessage' in partial),
              'warning_valid': (partial is mapping and partial.get('errorMessage') is string and
                                partial.get('errorMessage') | length > 0)} | to_json }}
      register: _otlp_delivery_classification
      changed_when: false
      check_mode: false

    - name: "Completion: hold the classified OTLP acknowledgement"
      ansible.builtin.set_fact:
        _otlp_delivery_ack: "{{ (_otlp_delivery_classification.stdout | from_json).accepted }}"
        _otlp_delivery_ok: "{{ (_otlp_delivery_classification.stdout | from_json).accepted }}"

    - name: "Completion: capture conformance transport result"
      ansible.builtin.set_fact:
        _conformance_loki_status: "{{ (_push_loki_result | default({})).status | default(0) | int }}"
        _conformance_loki_skipped: "{{ _push_loki_result is not defined or _push_loki_result is skipped }}"

    - name: "Completion: classify prior data delivery"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'completion_delivery', 'required_work_ok': _completion_ready,
              'transport': ('local_loki' if local_mode | default(false) | bool else 'production_otlp'),
              'transport_configured': ((collector_loki_url is defined and collector_loki_url | length > 0)
                                       if local_mode | default(false) | bool else true),
              'record_count': _agg.loki_streams | length,
              'response_status': (((_push_loki_result | default({})).status | default(none)) if local_mode | default(false) | bool
                                  else none),
              'otlp_acknowledged': _otlp_delivery_ack | default(false)} | to_json }}
      register: _completion_delivery_gate
      changed_when: false
      check_mode: false

    - name: "Completion: hold publication boundary"
      ansible.builtin.set_fact:
        _completion_publish_ready: "{{ (_completion_delivery_gate.stdout | from_json).eligible }}"

    - name: "Completion: build separate receipt payload"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'receipt', 'now_ns': (now(utc=true).timestamp() * 1000000000) | int} | to_json }}
      register: _completion_receipt_run
      changed_when: false
      check_mode: false

    - name: "Completion: hold receipt payload"
      ansible.builtin.set_fact:
        _completion_receipt: "{{ _completion_receipt_run.stdout | from_json }}"

    - name: "Local Loki: publish collector completion receipt"
      ansible.builtin.include_tasks: tasks/push-loki-lines.yml
      vars:
        push_loki_url: "{{ collector_loki_url }}"
        push_loki_streams: "{{ _completion_receipt.streams }}"
        push_loki_must_succeed: false
      when:
        - not ansible_check_mode
        - local_mode | default(false) | bool
        - collector_loki_url is defined
        - _completion_publish_ready

    - name: "Production Alloy: publish collector completion receipt"
      ansible.builtin.uri:
        url: "{{ _collector_otlp_url }}"
        method: POST
        body_format: json
        body: "{{ _completion_receipt.otlp_payload }}"
        headers:
          Content-Type: application/json
        status_code: [200]
      register: _otlp_receipt
      changed_when: true
      failed_when: false
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)
        - _completion_publish_ready

    - name: "Completion: classify final receipt response"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {%- set response = _otlp_receipt | default({}) -%}
          {%- set body = response.get('json') -%}
          {%- set partial = (body.get('partialSuccess') if body is mapping else none) -%}
          {{ {'mode': 'otlp_ack',
              'status': (response.get('status') if response.get('status') is integer and response.get('status') is not boolean else none),
              'content_type_valid': (response.get('content_type', '') | default('', true) | trim | lower == 'application/json'),
              'body_is_object': body is mapping,
              'body_fields_known': (body is mapping and (body.keys() | list | difference(['partialSuccess']) | length == 0)),
              'partial_success_present': (body is mapping and 'partialSuccess' in body),
              'partial_success_is_object': partial is mapping,
              'partial_fields_known': (partial is mapping and (partial.keys() | list | difference(['rejectedLogRecords', 'errorMessage']) | length == 0)),
              'rejected_present': (partial is mapping and 'rejectedLogRecords' in partial),
              'rejected_records': (partial.get('rejectedLogRecords') if partial is mapping and
                                   ((partial.get('rejectedLogRecords') is integer and partial.get('rejectedLogRecords') is not boolean and
                                     0 <= partial.get('rejectedLogRecords') <= 9223372036854775807) or
                                    (partial.get('rejectedLogRecords') is string and
                                     partial.get('rejectedLogRecords') is match('^(0|[1-9][0-9]{0,18})$'))) else none),
              'warning_present': (partial is mapping and 'errorMessage' in partial),
              'warning_valid': (partial is mapping and partial.get('errorMessage') is string and
                                partial.get('errorMessage') | length > 0)} | to_json }}
      register: _completion_receipt_delivery
      changed_when: false
      check_mode: false

    - name: "Completion: hold final receipt result"
      ansible.builtin.set_fact:
        _completion_receipt_ack: "{{ (_completion_receipt_delivery.stdout | from_json).accepted }}"

    - name: "Completion: classify final receipt publication"
      ansible.builtin.command:
        argv: [python3, "{{ _parser }}"]
        stdin: >-
          {{ {'mode': 'completion_delivery', 'required_work_ok': _completion_publish_ready,
              'transport': ('local_loki' if local_mode | default(false) | bool else 'production_otlp'),
              'transport_configured': true, 'record_count': 1,
              'response_status': (((_push_loki_result | default({})).status | default(none)) if local_mode | default(false) | bool else none),
              'otlp_acknowledged': _completion_receipt_ack} | to_json }}
      register: _completion_receipt_gate
      changed_when: false
      check_mode: false

    - name: "Completion: hold final receipt publication result"
      ansible.builtin.set_fact:
        _completion_receipt_delivery_ok: "{{ (_completion_receipt_gate.stdout | from_json).eligible }}"

    - name: "Report"
      ansible.builtin.debug:
        msg:
          report: "{{ _agg.report }}"
          netbox_written: "{{ _nb_writes.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'equalto', 200) | map(attribute='item.item') | list }}"
          netbox_no_vm: "{{ _vm_missing }}"
          netbox_ambiguous_vm: "{{ _vm_ambiguous }}"
          # Templates whose history filled the read window: their older runs were not read.
          history_window_full: "{{ (_pick.stdout | from_json).window_full }}"
          netbox_read_unknown: "{{ _vm_unknown }}"
          loki: "{{ 'pushed' if _conformance_loki_status == 204 else ('skipped' if _conformance_loki_skipped else 'failed') }}"
          otlp: >-
            {{ 'check mode' if ansible_check_mode else
               ('no records' if _agg.otlp_payload.resourceLogs | length == 0 else
                ('skipped' if local_mode | default(false) | bool else
                 ('delivered' if _otlp_delivery_ok | default(false) | bool else 'failed/UNKNOWN'))) }}
          completion_receipt: >-
            {{- 'not_attempted' if (not _completion_publish_ready or ansible_check_mode or
                ((local_mode | default(false) | bool) and _push_loki_result is skipped) or
                (not (local_mode | default(false) | bool) and _otlp_receipt is skipped)) else
                ('acknowledged' if
                  ((local_mode | default(false) | bool and (_push_loki_result.status | default(0) | int == 204)) or
                   (not (local_mode | default(false) | bool) and (_completion_receipt_delivery_ok | default(false) | bool)))
                 else 'failed/UNKNOWN') -}}

    - name: "Fail after reporting unsuccessful production OTLP delivery"
      ansible.builtin.fail:
        msg: "Conformance OTLP delivery failed; see the preceding report for status."
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)
        - _agg.otlp_payload.resourceLogs | length > 0
        - not (_otlp_delivery_ok | default(false) | bool)

    - name: "Fail after reporting unsuccessful production completion receipt publication"
      ansible.builtin.fail:
        msg: "Completion receipt publication failed or is unknown; see the preceding report for status."
      when:
        - not ansible_check_mode
        - not (local_mode | default(false) | bool)
        - _completion_publish_ready
        - not (_completion_receipt_delivery_ok | default(false) | bool)
