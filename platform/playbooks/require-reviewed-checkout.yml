---
# Generic, non-writing consistency gate for a pinned checkout. Callers may request
# exact helper payloads; no remote-ref policy is imposed by this shared playbook.
- name: "Require the reviewed checkout"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    _reviewed_checkout_root: "{{ playbook_dir | dirname | dirname }}"
    _reviewed_checkout_requested_payloads: "{{ _reviewed_checkout_payload_paths | default([]) }}"
  tasks:
    - name: "Require an exact reviewed commit"
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - _reviewed_checkout_requested_payloads is sequence
          - _reviewed_checkout_requested_payloads is not string
          - _reviewed_checkout_requested_payloads | length <= 8
        fail_msg: "Pass expected_repository_sha: the full 40-character commit the review approved."
        quiet: true
      tags: [always]

    - name: "Compare checkout bytes with the reviewed commit"
      ansible.builtin.command:
        argv:
          - python3
          - "-"
          - --checkout
          - "{{ _reviewed_checkout_root }}"
          - --expected-sha
          - "{{ expected_repository_sha }}"
          - --payload-paths
          - "{{ _reviewed_checkout_requested_payloads | to_json }}"
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/reviewed-checkout.py', rstrip=false) }}"
        stdin_add_newline: false
      register: _reviewed_checkout_raw
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      tags: [always]

    - name: "Require pinned index and worktree bytes"
      ansible.builtin.assert:
        that:
          - _reviewed_checkout_raw.rc | default(1) == 0
          - (_reviewed_checkout_raw.stdout | default('{}') | from_json).status == 'checkout_consistent'
          - (_reviewed_checkout_raw.stdout | from_json).revision == expected_repository_sha
          - (_reviewed_checkout_raw.stdout | from_json).index_matches_revision == true
          - (_reviewed_checkout_raw.stdout | from_json).tracked_bytes_match_revision == true
          - (_reviewed_checkout_raw.stdout | from_json).payloads.keys() | list | sort == _reviewed_checkout_requested_payloads | sort
        fail_msg: "The checkout does not match the reviewed commit or its bounded verifier refused it."
        quiet: true
      no_log: true
      tags: [always]

    - name: "Retain only requested verified helper bytes"
      ansible.builtin.set_fact:
        _reviewed_checkout_payloads: "{{ (_reviewed_checkout_raw.stdout | from_json).payloads }}"
      no_log: true
      tags: [always]
