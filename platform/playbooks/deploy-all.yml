---
# deploy-all.yml — Deploy all services in dependency order
# This is the main playbook Semaphore runs for a full deployment.
#
# Phase 1: OpenBao (secrets backbone — must be first)
# Phase 2: NetBox (infrastructure modeling)
#
# Each phase clones the agent-cloud monorepo and runs the service deploy.sh.
# GitHub deploy key fetched once from OpenBao, reused across phases.

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

# Every group deploy-all touches must be populated: a missing one would skip its
# phase and still exit 0 (docs/MISTAKES.md 2.21).
- name: "Pre-flight: openbao_svc is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: openbao_svc
    # Paired so one `-e preflight_group=` cannot redirect the guard (MISTAKES 2.21).
    preflight_group_expected: openbao_svc

- name: "Pre-flight: netbox_svc is real"
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: netbox_svc
    # Paired so one `-e preflight_group=` cannot redirect the guard (MISTAKES 2.21).
    preflight_group_expected: netbox_svc

# ── Phase 1: OpenBao ────────────────────────────────────────────────────
- name: "Phase 1: Deploy OpenBao (secrets backbone)"
  hosts: openbao_svc
  gather_facts: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud', true) }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
  tasks:
    - name: "Deploy OpenBao"
      ansible.builtin.include_tasks: tasks/clone-and-deploy.yml

# ── Phase 2: NetBox ─────────────────────────────────────────────────────
- name: "Phase 2: Deploy NetBox"
  hosts: netbox_svc
  gather_facts: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud', true) }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
  tasks:
    - name: "Deploy NetBox"
      ansible.builtin.include_tasks: tasks/clone-and-deploy.yml
