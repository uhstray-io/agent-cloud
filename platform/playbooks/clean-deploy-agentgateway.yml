---
# clean-deploy-agentgateway.yml — Destroy and redeploy agentgateway from scratch.
#
# Removes both containers, the budget-usage Postgres volume and the rendered
# .env/config.yaml, then deploys fresh. Client keys, the db password and the
# upstream key live in OpenBao and come back unchanged, so no client has to
# re-enrol; the ONLY state lost is every identity's current budget window, which
# restarts from zero.
# Local-dev shares one deploy tree, so the clone is NOT removed (clean-service.yml
# branches on local_mode).
#
# Uses composable tasks/clean-service.yml then runs deploy-agentgateway.yml.

- name: "Clean agentgateway deployment"
  hosts: agentgateway_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
  tasks:
    - name: "Destroy existing deployment"
      ansible.builtin.include_tasks: tasks/clean-service.yml

- name: "Fresh deploy"
  import_playbook: deploy-agentgateway.yml
