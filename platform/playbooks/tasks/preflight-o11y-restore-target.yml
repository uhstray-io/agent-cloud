# Credential-free input and destination preflight for the protected restore target.
# Runs before any AppRole/OpenBao secret lookup, then is reused by the full guard.
- name: "Restore-target preflight: reject launch aliases and pin private OpenBao destination"
  vars:
    _o11y_rt_preflight_bao_hosts: "{{ groups['openbao_svc'] | default([]) }}"
    _o11y_rt_preflight_bao_host: "{{ (groups['openbao_svc'] | default([]) | first) | default('') }}"
    _o11y_rt_preflight_bao_url: "{{ hostvars[(groups['openbao_svc'] | default([]) | first)].service_url | default('') if (groups['openbao_svc'] | default([]) | length == 1) else '' }}"
    _o11y_rt_preflight_protected_extra_vars:
      - openbao_addr
      - service_url
      - bao_role_id
      - bao_secret_id
      - BAO_ROLE_ID
      - BAO_SECRET_ID
      - o11y_restore_target_vmid
      - o11y_restore_target_node
      - o11y_restore_target_storage_id
      - o11y_restore_target_network_mode
      - o11y_restore_target_headroom_percent
  ansible.builtin.assert:
    that:
      - _o11y_rt_preflight_bao_hosts | length == 1
      - _o11y_rt_preflight_bao_url is string and _o11y_rt_preflight_bao_url is match('^https?://[^/?#]+(?::[0-9]{1,5})?$')
      - openbao_addr | default('') == _o11y_rt_preflight_bao_url
      - _o11y_rt_preflight_protected_extra_vars | intersect('' | extra_var_names) | length == 0
    fail_msg: "Restore-target preflight requires the fixed private OpenBao endpoint and rejects launch-supplied credentials or target declaration values."
    quiet: true
  tags: [always]

- name: "Restore-target preflight: validate the fixed endpoint transport"
  ansible.builtin.include_tasks: assert-bao-transport.yml
  vars:
    _assert_bao_url: "{{ hostvars[(groups['openbao_svc'] | default([]) | first)].service_url | default('') if (groups['openbao_svc'] | default([]) | length == 1) else '' }}"
  tags: [always]
