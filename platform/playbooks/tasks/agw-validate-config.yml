---
# agw-validate-config.yml — validate one agentgateway config file with the pinned image
# (observability-estate task 5.7), shared by the deploy and the inference-route rollback so the
# two cannot drift: both refuse BEFORE any container is recreated, on the same evidence.
#
# Runs the exact local v1.5.0 image's `--validate-only` against a file in the deploy directory,
# with the same read-only ./certs mount, trust bundle and user mapping Compose gives the gateway.
# The validator's output can echo configuration text, so it is never shown: the run is no_log and
# the failure carries only an allowlisted category and the exit code class.
#
# Caller provides (play vars): _deploy_dir, _tls; for TLS under local-dev, _key_owner (the deploy
# account's uid:gid); and when listener TLS or local-dev needs it, ./certs already distributed.
# The caller pulls the image first if it wants a fresh one: this file only reads the local ID.
# Include vars:
#   _agw_vc_config         file name inside _deploy_dir to validate (config.yaml, config.yaml.previous)
#   _agw_vc_refusal        the refusal sentence the failure begins with; the category follows
#   _agw_vc_in_check_mode  optional, default false. true runs the validation under --check too:
#                          it only reads (a throwaway `run --rm` against a read-only mount), so a
#                          dry run can prove the step the real run would otherwise be first to hit.
# Sets: _agw_validated_image_id (the deploy's later plays compare the running image with it),
# _agw_config_validation (protected), _agw_validation_safe_category.

- name: "Read the resolved local v1.5.0 image ID for validation"
  ansible.builtin.command:
    argv:
      - "{{ container_engine | default('podman') }}"
      - image
      - inspect
      - --format
      - "{{ '{{.Id}}' }}"
      - cr.agentgateway.dev/agentgateway:v1.5.0
  register: _agw_validated_image_id
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)

- name: "Require an exact local image ID before config validation"
  ansible.builtin.assert:
    that:
      - _agw_validated_image_id.rc == 0
      - (_agw_validated_image_id.stdout | trim | regex_replace('^sha256:', '')) is match('^[0-9a-f]{64}$')
    fail_msg: "The reviewed v1.5.0 image ID is unavailable after the pre-validation pull."
    quiet: true
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)

# Task 5.7: exercise the exact pulled local binary against the rendered config before
# deploy.sh can recreate either container. Run after certificate/trust preparation
# because the validation container gets the same read-only ./certs mount as Compose.
# The env file is passed by path (never expanded into argv); diagnostics are hidden
# because parser errors may contain configuration text.
- name: "Require the reviewed agentgateway v1.5.0 image pin"
  ansible.builtin.assert:
    that:
      - agw_image | default('cr.agentgateway.dev/agentgateway:v1.5.0') == 'cr.agentgateway.dev/agentgateway:v1.5.0'
    fail_msg: "Observability-estate task 5.7 validates only cr.agentgateway.dev/agentgateway:v1.5.0; review an image-pin change separately."
    quiet: true
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)

# Local OIDC discovery resolves Authentik's alias on local-dev; production uses Podman's default network.
# Validation checks config acceptance, not parity with the runtime Compose networks.
- name: "Validate the rendered config with the pinned v1.5.0 image before container recreation"
  ansible.builtin.command:
    argv: >-
      {{ [container_engine | default('podman'), 'run', '--pull=never', '--rm']
         + (['--network', 'local-dev'] if (local_mode | default(false) | bool) else [])
         + [
          '--env-file', _deploy_dir ~ '/.env', '--volume', _deploy_dir ~ '/' ~ _agw_vc_config ~ ':/config.yaml:ro']
         + (['--volume', _deploy_dir ~ '/certs:/certs:ro'] if (_tls or (local_mode | default(false) | bool)) else [])
         + (['--env', 'SSL_CERT_FILE=/certs/step-ca-bundle.crt'] if (local_mode | default(false) | bool) else [])
         + (['--security-opt', 'label=disable'] if (local_mode | default(false) | bool) else [])
         + (['--userns=keep-id:uid=65532,gid=65532'] if (_tls and not (local_mode | default(false) | bool)) else [])
         + (['--user', _key_owner.stdout] if (_tls and (local_mode | default(false) | bool)) else [])
         + [_agw_validated_image_id.stdout | trim, '--validate-only', '-f', '/config.yaml'] }}
  register: _agw_config_validation
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)

# Classify only known diagnostic patterns. The input can contain rendered values, so
# the task is no_log and its output is restricted to fixed labels plus the exit code.
- name: "Classify the validator result without exposing its output"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import base64
        import re
        import sys

        try:
            encoded_payload = sys.stdin.buffer.read(4_194_305)
            if len(encoded_payload) > 4_194_304:
                raise ValueError
            payload = base64.b64decode(encoded_payload, validate=True)
            result = json.loads(payload)
            raw_rc = result.get("rc", -1)
            if type(raw_rc) is not int or not -255 <= raw_rc <= 255:
                raise ValueError
            rc = raw_rc
            output = "\n".join(
                str(result.get(key, ""))[:65536] for key in ("stdout", "stderr")
            ).lower()
            categories = (
                (
                    "invalid-endpoint-error",
                    r"\binvalid (?:url|uri|endpoint|host:port)\b|"
                    r"\bmalformed (?:url|uri|endpoint)\b|"
                    r"\b(?:url|uri|endpoint) parse error\b|"
                    r"\bfailed to parse (?:url|uri|endpoint)\b",
                ),
                (
                    "config-type-variant-error",
                    r"invalid type|wrong type|expected (?:a |an )?(?:sequence|mapping|scalar)|"
                    r"unknown variant",
                ),
                (
                    "environment-reference-error",
                    r"\bmissing environment variable\b|"
                    r"\benvironment variable(?:\s+['\"`]?[a-z_][\w.$/-]*['\"`]?)?\s+"
                    r"(?:is\s+)?(?:not found|not set|undefined|missing)\b|"
                    r"\b(?:not found|not set|undefined|missing) environment variable\b",
                ),
                ("file-mount-permission-error", r"permission denied|operation not permitted|access denied|read-only file system"),
                (
                    "resource-certificate-load-error",
                    r"(?:failed|unable|cannot|could not) (?:to )?(?:load|open|read) "
                    r"(?:the )?(?:resource|certificate|cert|key|file|trust|ca)\b|"
                    r"(?:failed|unable|cannot|could not) (?:to )?parse "
                    r"(?:the )?(?:resource|certificate|cert|private key|trust bundle|ca)\b|"
                    r"\b(?:certificate|cert file|private key|trust bundle) "
                    r"(?:load|read|parse) (?:failed|error)\b",
                ),
                ("cli-argument-error", r"unknown (?:flag|option)|unrecognized (?:flag|option)|flag provided but not defined|unexpected argument|requires an argument|usage:"),
                ("network-dependency-error", r"connection refused|connection reset|no route to host|temporary failure in name resolution|no such host|deadline exceeded|i/o timeout"),
                (
                    "config-schema-error",
                    r"unknown field|unknown key|failed to parse (?:yaml|configuration|config)|"
                    r"schema validation|invalid (?:yaml|configuration|config)",
                ),
            )
            if rc == 125:
                category = "container-runtime-error"
            elif rc == 126:
                category = "validator-not-executable"
            elif rc == 127:
                category = "validator-command-not-found"
            elif rc < 0:
                category = "validator-result-unavailable"
            elif rc == 0:
                category = "accepted"
            else:
                clauses = tuple(
                    clause
                    for clause in re.split(r"[;\r\n]+|(?<=[.!?])\s+", output)
                    if clause
                )
                category = next(
                    (
                        name
                        for name, pattern in categories
                        if any(re.search(pattern, clause) for clause in clauses)
                    ),
                    None,
                )
                if category is None:
                    category = {
                        1: "validator-nonzero-exit-1",
                        2: "validator-nonzero-exit-2",
                        3: "validator-nonzero-exit-3",
                        4: "validator-nonzero-exit-4",
                    }.get(rc, "validator-nonzero-exit-other")
            print(f"{category}|{rc}")
        except Exception:
            print("diagnostic-unavailable|-1")
    stdin: >-
      {{ {'rc': _agw_config_validation.rc | default(-1),
          'stdout': _agw_config_validation.stdout | default(''),
          'stderr': _agw_config_validation.stderr | default('')} | to_json | b64encode }}
    stdin_add_newline: false
  register: _agw_validation_diagnostic
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)

- name: "Normalize validator diagnostics to a protected allowlisted category"
  ansible.builtin.set_fact:
    _agw_validation_safe_category: >-
      {% set candidate = (_agw_validation_diagnostic.stdout | default('diagnostic-unavailable|-1', true) | trim).split('|') | first %}
      {{ candidate if candidate in [
        'container-runtime-error', 'validator-not-executable', 'validator-command-not-found',
        'validator-result-unavailable', 'accepted', 'config-schema-error',
        'config-type-variant-error', 'environment-reference-error',
        'invalid-endpoint-error', 'resource-certificate-load-error',
        'file-mount-permission-error', 'cli-argument-error', 'network-dependency-error',
        'validator-nonzero-exit-1', 'validator-nonzero-exit-2',
        'validator-nonzero-exit-3', 'validator-nonzero-exit-4',
        'validator-nonzero-exit-other', 'diagnostic-unavailable'
      ] else 'diagnostic-unavailable' }}
  changed_when: false
  no_log: true
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)

- name: "Refuse container recreation when the pinned image rejects rendered config"
  ansible.builtin.assert:
    that:
      - _agw_config_validation.rc == 0
    fail_msg: >-
      {{ _agw_vc_refusal }}
      (category={{ _agw_validation_safe_category | default('diagnostic-unavailable', true) }}).
      Validator output is suppressed because it may include configuration values.
    success_msg: "Pinned agentgateway v1.5.0 accepted rendered config before container lifecycle."
    quiet: true
  when: not ansible_check_mode or (_agw_vc_in_check_mode | default(false) | bool)
