---
# assert-reset-confirmed.yml — Refuse a destructive reset the launch did not name.
#
# A Clean Deploy wipes a service's containers, volumes and clone, so a launch must say WHICH
# host it means to wipe: -e confirm_reset=<host>. A template that only says "Clean Deploy X" is
# one mis-click from production data (a main-bound Clean Deploy n8n carried no gate at all).
# Included first by tasks/clean-service.yml, so every Clean Deploy refuses before any teardown
# task; clean-deploy-o11y.yml and clean-deploy-step-ca.yml include it earlier still, so their
# own pre-destroy gates (reviewed commit, first-boot settings) are not reached by an
# unconfirmed launch.
#
# The expected value is the play's real host list, taken from ansible_play_hosts_all, never
# inventory_hostname: an extra var can set the latter (`-e inventory_hostname=x`), so a
# forged name plus a matching confirm would pass. ansible_play_hosts_all cannot be set from
# outside the run (checked in tasks/clean-service.yml's notes). A play that targets several
# hosts is confirmed by the sorted, comma-joined list of all of them.
#
# An extra var is a template rendered afresh at every read (docs/MISTAKES.md 1.15), so the
# confirmation is rendered once into a fact and the assert reads the fact.
#
# Expected variables: confirm_reset (the launch's -e / Semaphore survey value)

- name: "Pin the confirmation and the hosts it must name, each read once"
  ansible.builtin.set_fact:
    _reset_confirm: "{{ confirm_reset | default('') | string }}"
    _reset_hosts: "{{ ansible_play_hosts_all | sort | join(',') }}"

- name: "Refuse a reset the launch did not name"
  ansible.builtin.assert:
    that:
      - _reset_hosts | length > 0
      - _reset_confirm == _reset_hosts
    fail_msg: >-
      Refusing: pass -e confirm_reset={{ _reset_hosts }} to destroy this host's service data
      (containers, volumes and the checkout). Nothing was removed.
    quiet: true
