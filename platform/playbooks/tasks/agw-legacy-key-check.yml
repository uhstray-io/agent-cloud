---
# agw-legacy-key-check.yml — shared-key retirement for agentgateway (gateway task 5.1).
#
# The credential half of the retirement, isolated so deploy-agentgateway.yml stays free of
# no_log. Included after manage-secrets, so `_resolved` holds vllm_api_key and
# `_legacy_fp_recorded` (a play var over manage-secrets' store read) holds the recorded
# fingerprint, or '' before the first recording.
#
# How "the pre-rotation value" is known: during the grace period the deploy records the shared
# vLLM key's sha256 fingerprint ONCE into secret/services/<service>:legacy_shared_key_sha256, by a
# compare-and-swap that only writes while the field is absent, so neither a later run nor an
# overlapping one overwrites it. A later rotation of vllm_api_key leaves the old key's fingerprint
# behind. This file only computes booleans; the deploy's last play (Phase 4) fails on them, after
# the gateway has been recreated without the expired identity. No value or hash is ever printed.
#
# Rotating the key at vLLM and in OpenBao is dgx-spark's (it owns VLLM_API_KEY); this file only
# lets the deploy refuse to call the retirement done until that has happened.
#
# Caller provides: _resolved (manage-secrets), _legacy_fp_recorded, _legacy_shared_active,
# _legacy_shared_retired, _bao_url, _bao_auth, service_name.
# Sets for Phase 4: _legacy_shared_retired_now, _legacy_fp_missing, _legacy_key_unrotated.

- name: "Compare the vLLM key with the recorded shared-key fingerprint"
  ansible.builtin.set_fact:
    _legacy_fp_live: "{{ (_resolved.vllm_api_key | default('') | hash('sha256')) if (_resolved.vllm_api_key | default('') | length > 0) else '' }}"
    _legacy_fp_stored: "{{ _legacy_fp_recorded | default('', true) }}"
  no_log: true

- name: "Reduce the comparison to booleans"
  ansible.builtin.set_fact:
    _legacy_shared_retired_now: "{{ _legacy_shared_retired | bool }}"
    _legacy_fp_missing: "{{ _legacy_fp_stored | length == 0 }}"
    _legacy_key_unrotated: "{{ _legacy_fp_stored | length > 0 and _legacy_fp_stored == _legacy_fp_live }}"
  no_log: true

# Recorded once, while the shared key is still the vLLM key. Guarded on the field's ABSENCE
# (bao-merge-keys compares the live value with none and writes at the version it read), so a
# fingerprint another run recorded after manage-secrets' read fails this run instead of being
# overwritten. Skipped in check mode (a write).
- name: "Record the shared key's fingerprint (once, during the grace period)"
  ansible.builtin.include_tasks: bao-merge-keys.yml
  vars:
    _bm_url: "{{ _bao_url }}"
    _bm_token: "{{ _bao_auth.json.auth.client_token }}"
    _bm_path: "services/{{ service_name }}"
    _bm_data: "{{ {'legacy_shared_key_sha256': _legacy_fp_live} }}"
    _bm_guard_key: legacy_shared_key_sha256
    _bm_guard_value: null
    _bm_on_missing: fail
    _bm_missing_msg: "secret/services/{{ service_name }} does not exist; manage-secrets should have created it."
  when:
    - _legacy_shared_active | bool
    - _legacy_fp_missing | bool
    - _legacy_fp_live | length > 0
    - not ansible_check_mode
