---
- name: Read the agent-cloud alert folder for target rule validation
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - sh
      - -c
      - >-
        printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
        curl -fsS --config - http://127.0.0.1:3000/api/folders
  register: _expected_target_folders
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate active expected-target rules and retired tombstones privately
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/files/summarize-o11y-scrape-baseline.py"
      - --validate-active-expected-target-rules
    stdin: >-
      {{ {'reviewed': true,
          'targets': (o11y_expected_metrics_targets | default([])
            if o11y_alerts_enabled | default(false) | bool and
               o11y_expected_metrics_targets_reviewed | default(false) | bool else []),
          'retired_uids': o11y_expected_metrics_targets_retired_uids | default([]),
          'live_rules': (o11y_live_expected_rules_json | from_json |
            selectattr('uid', 'match', '^o11y_missing_') | list),
          'live_folders': (_expected_target_folders.stdout | from_json)} | to_json }}
  delegate_to: localhost
  register: _expected_target_rule_validation
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Require active target declarations and inert retired tombstones to match
  ansible.builtin.assert:
    that:
      - _expected_target_rule_validation.rc == 0
      - (_expected_target_rule_validation.stdout | from_json).status == 'validated'
    fail_msg: "Expected-target alert rules do not match the reviewed active and retired declarations."
    quiet: true
  no_log: true
