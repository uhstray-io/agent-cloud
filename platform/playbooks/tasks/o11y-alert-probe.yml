---
# Shared fault and Discord receipt path. Local uses a disposable container;
# production uses the canary's temporary static Prometheus scrape declaration.
- name: Create a unique identity for this drill run
  ansible.builtin.command:
    argv: [python3, -c, "import uuid; print(uuid.uuid4().hex[:12])"]
  register: _probe_nonce
  delegate_to: localhost
  changed_when: false
  when: _probe is not defined
  check_mode: false

- name: Name this run's disposable probe
  ansible.builtin.set_fact:
    _probe: "o11y-fault-probe-{{ _probe_nonce.stdout }}"
  when: _probe is not defined

- name: Require a declared fault-probe mechanism
  ansible.builtin.assert:
    that: (local_mode | default(false) | bool) or (o11y_production_static_probe | default(false) | bool)
    fail_msg: "The unreachable-endpoint drill needs local mode or the production static probe."

- name: Bind the expected scrape instances for this probe
  ansible.builtin.set_fact:
    _probe_expected_instances: "{{ o11y_probe_expected_instances | default([expected_instance]) }}"

- name: Require alerting to be enabled for the alert drill
  ansible.builtin.assert:
    that: o11y_alerts_enabled | default(false) | bool
    fail_msg: "Enable the OpenBao-backed alert contact point before the alert drill."
  when: drill_expect_alert | default(false) | bool

- name: Read the provisioned service-down rule before the alert drill
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - sh
      - -c
      - >-
        printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
        curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules/o11y_service_down
  register: _service_down_rule
  changed_when: false
  when: drill_expect_alert | default(false) | bool
  check_mode: false
  no_log: true

- name: Require an active provisioned rule before injecting the alert fault
  ansible.builtin.assert:
    that: not ((_service_down_rule.stdout | from_json).isPaused | bool)
    fail_msg: "The provisioned service-down rule is paused; no alert fault was injected."
  when: drill_expect_alert | default(false) | bool
  no_log: true

- name: Exercise the declared unreachable endpoint
  block:
    - name: Refuse to adopt a pre-existing probe container
      ansible.builtin.command:
        argv: ["{{ _engine }}", container, exists, "{{ _probe }}"]
      register: _probe_exists
      changed_when: false
      failed_when: _probe_exists.rc not in [0, 1]
      check_mode: false
      when: local_mode | default(false) | bool

    - name: Require an unused probe name
      ansible.builtin.assert:
        that: _probe_exists.rc == 1
        fail_msg: "{{ _probe }} already exists; refusing to remove another task's container."
      when: local_mode | default(false) | bool

    - name: Start the opted-in probe with no metrics listener
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - run
          - --rm
          - -d
          - --network=local-dev
          - --label=prometheus.io/scrape=true
          - --label=prometheus.io/port=65535
          - "--name={{ _probe }}"
          - docker.io/library/alpine:3.20
          - sh
          - -c
          - "echo {{ _probe }}-ready; sleep 900"
      register: _probe_run
      changed_when: true
      when:
        - not ansible_check_mode
        - local_mode | default(false) | bool

    - name: Wait for the declared failed scrape
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - wget
          - -q
          - -O
          - "-"
          - "http://prometheus:9090/api/v1/query?query={{ ('up{service=\"' ~ expected_service ~ '\"}') | urlencode }}"
      register: _probe_scrapes
      changed_when: false
      # Podman discovery, the 15s scrape, and remote write may span a minute.
      retries: 24
      delay: 5
      no_log: true
      until: >-
        _probe_scrapes.rc == 0 and
        ((o11y_grouped_probe | default(false) | bool and
          ((_probe_scrapes.stdout | from_json).data.result |
           map(attribute='metric.instance') | list | sort) == (_probe_expected_instances | sort) and
          ((_probe_scrapes.stdout | from_json).data.result |
           selectattr('metric.cluster', 'defined') |
           selectattr('metric.cluster', 'equalto', _drill_cluster) |
           selectattr('metric.environment', 'defined') |
           selectattr('metric.environment', 'equalto', _drill_environment) |
           selectattr('value.1', 'equalto', '0') |
           map(attribute='metric.instance') | list | sort) == (_probe_expected_instances | sort)) or
         (not (o11y_grouped_probe | default(false) | bool) and
          ((_probe_scrapes.stdout | from_json).data.result |
           selectattr('metric.instance', 'equalto', expected_instance) |
           selectattr('value.1', 'equalto', '0') | list | length) == 1))
      when: not ansible_check_mode

    - name: Require the onboarding verifier to refuse the named endpoint
      no_log: true
      block:
        - name: Run the same metrics gate used by service onboarding
          ansible.builtin.include_tasks: verify-o11y-metrics.yml

        - name: Refuse a false-green verifier
          ansible.builtin.fail:
            msg: "The onboarding verifier accepted unreachable {{ expected_instance }}."
      rescue:
        - name: Require the refusal to name the unreachable endpoint
          ansible.builtin.assert:
            that:
              - expected_service in ansible_failed_result.msg
              - "'failing instances=' in ansible_failed_result.msg"
              - ("'" ~ expected_instance ~ "'") in (ansible_failed_result.msg.split('failing instances=', 1)[1].split(';', 1)[0])
            fail_msg: "The verifier failed without naming the unreachable service and endpoint."
          no_log: true

    - name: Report the expected verification failure without target identity
      ansible.builtin.debug:
        msg: "Verified refusal: the unreachable metrics target was rejected."
      when: not ansible_check_mode

    - name: Wait for Grafana's service-down rule to fire for the probe
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/prometheus/grafana/api/v1/alerts
      register: _firing_alerts
      changed_when: false
      retries: 36
      delay: 10
      no_log: true
      until: >-
        _firing_alerts.rc == 0 and
        ((o11y_grouped_probe | default(false) | bool and
          ((_firing_alerts.stdout | from_json).data.alerts |
           selectattr('labels', 'defined') |
           selectattr('labels.service', 'defined') |
           selectattr('labels.service', 'equalto', expected_service) |
          selectattr('labels.__alert_rule_uid__', 'defined') |
          selectattr('labels.__alert_rule_uid__', 'equalto', 'o11y_service_down') |
           selectattr('labels.cluster', 'defined') |
           selectattr('labels.cluster', 'equalto', _drill_cluster) |
           selectattr('labels.environment', 'defined') |
           selectattr('labels.environment', 'equalto', _drill_environment) |
           selectattr('state', 'match', '^(Alerting|firing)$') |
           map(attribute='labels.instance') | list | sort) == (_probe_expected_instances | sort)) or
         (not (o11y_grouped_probe | default(false) | bool) and
          ((_firing_alerts.stdout | from_json).data.alerts |
           selectattr('labels', 'defined') |
           selectattr('labels.service', 'defined') |
           selectattr('labels.service', 'equalto', expected_service) |
           selectattr('state', 'match', '^(Alerting|firing)$') | list | length) > 0))
      when: not ansible_check_mode and (drill_expect_alert | default(false) | bool)

    - name: Wait for the matching Discord webhook message
      ansible.builtin.uri:
        url: >-
          https://discord.com/api/v10/channels/{{ _channel_id }}/messages?limit=100{{ '&after=' ~ _before_messages.json[0].id if _before_messages.json | length > 0 else '' }}
        headers:
          Authorization: "Bot {{ _discord_secret.json.data.data.bot_token }}"
          User-Agent: "DiscordBot (https://github.com/uhstray-io/agent-cloud, 1.0)"
        status_code: [200]
      register: _discord_messages
      delegate_to: localhost
      retries: 60
      delay: 5
      until: >-
        ((_discord_messages.json | default([]) |
          selectattr('webhook_id', 'defined') |
          selectattr('webhook_id', 'equalto', _webhook_id) |
          list | to_json) is search(_delivery_marker)) and
        (not (o11y_grouped_probe | default(false) | bool) or
          (_discord_messages.json | default([]) |
           selectattr('webhook_id', 'defined') |
           selectattr('webhook_id', 'equalto', _webhook_id) |
           selectattr('content', 'defined') |
           selectattr('content', 'search', _delivery_marker) |
           list | length) == 1 and
          (_discord_messages.json | default([]) |
             selectattr('webhook_id', 'defined') |
             selectattr('webhook_id', 'equalto', _webhook_id) |
             selectattr('content', 'defined') |
             selectattr('content', 'search', _delivery_marker) |
             map(attribute='content') | list | first | default('')).splitlines() |
             select('equalto', _delivery_marker) | list | length == (_probe_expected_instances | length) and
          ((' - instance = ' ~ _probe_expected_instances[0]) in
             (_discord_messages.json | default([]) |
               selectattr('webhook_id', 'defined') |
               selectattr('webhook_id', 'equalto', _webhook_id) |
               selectattr('content', 'defined') |
               selectattr('content', 'search', _delivery_marker) |
               map(attribute='content') | list | first | default('')).splitlines()) and
          ((' - instance = ' ~ _probe_expected_instances[1]) in
             (_discord_messages.json | default([]) |
               selectattr('webhook_id', 'defined') |
               selectattr('webhook_id', 'equalto', _webhook_id) |
               selectattr('content', 'defined') |
               selectattr('content', 'search', _delivery_marker) |
               map(attribute='content') | list | first | default('')).splitlines()) and
          ((_discord_messages.json | default([]) |
             selectattr('webhook_id', 'defined') |
             selectattr('webhook_id', 'equalto', _webhook_id) |
             selectattr('content', 'defined') |
             selectattr('content', 'search', _delivery_marker) |
             map(attribute='content') | list | first | default('')).splitlines() |
             select('search', '/d/service-overview[?]var-service=' ~ expected_service ~ '$') | list | length > 0))
      no_log: true
      ignore_errors: true
      when: not ansible_check_mode and (drill_expect_alert | default(false) | bool)

    - name: Count the matching Discord receipt without retaining its content
      ansible.builtin.set_fact:
        _discord_receipt_summary:
          succeeded: "{{ _discord_messages is succeeded }}"
          webhook_message_count: >-
            {{ _discord_messages.json | default([]) |
               selectattr('webhook_id', 'defined') |
               selectattr('webhook_id', 'equalto', _webhook_id) | list | length }}
          readable_message_count: >-
            {{ _discord_messages.json | default([]) |
               selectattr('webhook_id', 'defined') |
               selectattr('webhook_id', 'equalto', _webhook_id) |
               selectattr('content', 'defined') |
               rejectattr('content', 'equalto', '') | list | length }}
          grouped_message_count: >-
            {{ _discord_messages.json | default([]) |
               selectattr('webhook_id', 'defined') |
               selectattr('webhook_id', 'equalto', _webhook_id) |
               selectattr('content', 'defined') |
               selectattr('content', 'search', _delivery_marker) | list | length }}
          grouped_details_present: >-
            {%- set owned = _discord_messages.json | default([]) |
               selectattr('webhook_id', 'defined') |
               selectattr('webhook_id', 'equalto', _webhook_id) |
               selectattr('content', 'defined') |
               selectattr('content', 'search', _delivery_marker) | list %}
            {%- set content = owned[0].content if owned | length == 1 else '' -%}
            {{ not (o11y_grouped_probe | default(false) | bool) or (owned | length == 1 and
               (content.splitlines() | select('equalto', _delivery_marker) | list | length == (_probe_expected_instances | length)) and
               ((' - instance = ' ~ _probe_expected_instances[0]) in content.splitlines()) and
               ((' - instance = ' ~ _probe_expected_instances[1]) in content.splitlines()) and
               (content.splitlines() | select('search', '/d/service-overview[?]var-service=' ~ expected_service ~ '$') | list | length > 0)) }}
      no_log: true
      when: drill_expect_alert | default(false) | bool

    - name: Require a readable firing receipt from the owned webhook
      ansible.builtin.assert:
        that:
          - _discord_receipt_summary.succeeded | bool
          - _discord_receipt_summary.webhook_message_count | int > 0
          - _discord_receipt_summary.readable_message_count | int > 0
          - not (o11y_grouped_probe | default(false) | bool) or _discord_receipt_summary.grouped_message_count | int == 1
          - not (o11y_grouped_probe | default(false) | bool) or _discord_receipt_summary.grouped_details_present | bool
        fail_msg: >-
          Discord firing receipt was incomplete after the wait: webhook messages={{
          _discord_receipt_summary.webhook_message_count }}, readable messages={{
          _discord_receipt_summary.readable_message_count }}, owned messages={{
          _discord_receipt_summary.grouped_message_count }}.
        quiet: true
      when: drill_expect_alert | default(false) | bool

    - name: Report the fired rule and confirmed Discord receipt
      ansible.builtin.debug:
        msg: "Grafana fired for the drill and the matching delivery receipt was confirmed."
      when: drill_expect_alert | default(false) | bool
  always:
    - name: Remove only the probe started by this drill
      ansible.builtin.command:
        argv: ["{{ _engine }}", rm, -f, "{{ _probe }}"]
      when:
        - not ansible_check_mode
        - local_mode | default(false) | bool
        - (_probe_run.rc | default(1)) == 0
      changed_when: true
