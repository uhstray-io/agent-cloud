---
# Shared disposable probe and Discord receipt path for the ordinary and canary drills.
- name: Create a unique identity for this drill run
  ansible.builtin.command:
    argv: [python3, -c, "import uuid; print(uuid.uuid4().hex[:12])"]
  register: _probe_nonce
  delegate_to: localhost
  changed_when: false
  when: _probe is not defined

- name: Name this run's disposable probe
  ansible.builtin.set_fact:
    _probe: "o11y-fault-probe-{{ _probe_nonce.stdout }}"
  when: _probe is not defined

- name: Require local mode before creating a disposable probe
  ansible.builtin.assert:
    that: local_mode | default(false) | bool
    fail_msg: "The unreachable-endpoint drill is local-only."

- name: Require alerting to be enabled for the alert drill
  ansible.builtin.assert:
    that: o11y_alerts_enabled | default(false) | bool
    fail_msg: "Enable the OpenBao-backed local alert contact point before the alert drill."
  when: drill_expect_alert | default(false) | bool

- name: Read the provisioned service-down rule before the alert drill
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - sh
      - -c
      - >-
        printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
        curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules/o11y_service_down
  register: _service_down_rule
  changed_when: false
  when: drill_expect_alert | default(false) | bool

- name: Require an active provisioned rule before injecting the alert fault
  ansible.builtin.assert:
    that: not ((_service_down_rule.stdout | from_json).isPaused | bool)
    fail_msg: "The provisioned service-down rule is paused; no alert fault was injected."
  when: drill_expect_alert | default(false) | bool

- name: Require the declared Discord receipt channel
  ansible.builtin.assert:
    that:
      - _channel_id is match('^[0-9]{17,21}$')
      - _bao_url | length > 0
    fail_msg: "Declare the Discord alert channel and OpenBao endpoint before the delivery drill."
  when: drill_expect_alert | default(false) | bool

- name: Refuse a cleartext OpenBao endpoint before the delivery drill
  ansible.builtin.include_tasks: assert-bao-transport.yml
  vars:
    _assert_bao_url: "{{ _bao_url }}"
  when: drill_expect_alert | default(false) | bool

- name: Authenticate to OpenBao for the delivery drill
  ansible.builtin.uri:
    url: "{{ _bao_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ _bao_role_id }}"
      secret_id: "{{ _bao_secret_id }}"
    status_code: [200]
  register: _bao_auth
  delegate_to: localhost
  no_log: true
  when: drill_expect_alert | default(false) | bool

- name: Read the Discord bot credential for message receipt
  ansible.builtin.uri:
    url: "{{ _bao_url }}/v1/secret/data/services/discord"
    headers:
      X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
    status_code: [200]
  register: _discord_secret
  delegate_to: localhost
  no_log: true
  when: drill_expect_alert | default(false) | bool

- name: Read the provisioned alert webhook identity
  ansible.builtin.uri:
    url: "{{ _bao_url }}/v1/secret/data/services/o11y"
    headers:
      X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
    status_code: [200]
  register: _o11y_secret
  delegate_to: localhost
  no_log: true
  when: drill_expect_alert | default(false) | bool

- name: Require the bot token and a stored Discord webhook
  ansible.builtin.assert:
    that:
      - _discord_secret.json.data.data.bot_token | default('') | length > 0
      - not (_discord_secret.json.data.data.bot_token | default('')).startswith('REPLACE_WITH_')
      - _o11y_secret.json.data.data.alert_discord_webhook_url | default('') | urlsplit('hostname') == 'discord.com'
      - _o11y_secret.json.data.data.alert_discord_webhook_url | default('') | urlsplit('path') is match('^/api/webhooks/[0-9]{17,21}/[^/]+$')
    fail_msg: "Seed the bot token and the declared Discord webhook before the delivery drill."
  no_log: true
  when: drill_expect_alert | default(false) | bool

- name: Extract the stored webhook identity without its token
  ansible.builtin.set_fact:
    _webhook_id: "{{ _o11y_secret.json.data.data.alert_discord_webhook_url | regex_search('(?<=/webhooks/)[0-9]+') }}"
  no_log: true
  when: drill_expect_alert | default(false) | bool

- name: Mark the last Discord message before the probe
  ansible.builtin.uri:
    url: "https://discord.com/api/v10/channels/{{ _channel_id }}/messages?limit=1"
    headers:
      Authorization: "Bot {{ _discord_secret.json.data.data.bot_token }}"
      User-Agent: "DiscordBot (https://github.com/uhstray-io/agent-cloud, 1.0)"
    status_code: [200]
  register: _before_messages
  delegate_to: localhost
  no_log: true
  ignore_errors: true
  when: drill_expect_alert | default(false) | bool

- name: Require Discord message-history access before the probe
  ansible.builtin.assert:
    that: _before_messages is succeeded
    fail_msg: "Discord message-history read failed with HTTP {{ _before_messages.status | default('unknown') }}; no fault probe was started."
  when: drill_expect_alert | default(false) | bool

- name: Exercise the declared unreachable endpoint
  block:
    - name: Refuse to adopt a pre-existing probe container
      ansible.builtin.command:
        argv: ["{{ _engine }}", container, exists, "{{ _probe }}"]
      register: _probe_exists
      changed_when: false
      failed_when: _probe_exists.rc not in [0, 1]

    - name: Require an unused probe name
      ansible.builtin.assert:
        that: _probe_exists.rc == 1
        fail_msg: "{{ _probe }} already exists; refusing to remove another task's container."

    - name: Start the opted-in probe with no metrics listener
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - run
          - --rm
          - -d
          - --network=local-dev
          - --label=prometheus.io/scrape=true
          - --label=prometheus.io/port=65535
          - "--name={{ _probe }}"
          - docker.io/library/alpine:3.20
          - sh
          - -c
          - "echo {{ _probe }}-ready; sleep 900"
      register: _probe_run
      changed_when: true

    - name: Wait for Alloy to report the failed scrape
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - wget
          - -q
          - -O
          - "-"
          - "http://prometheus:9090/api/v1/query?query={{ ('up{service=\"' ~ expected_service ~ '\"}') | urlencode }}"
      register: _probe_scrapes
      changed_when: false
      # Podman discovery, the 15s scrape, and remote write may span a minute.
      retries: 24
      delay: 5
      until: >-
        _probe_scrapes.rc == 0 and
        ((_probe_scrapes.stdout | from_json).data.result |
         selectattr('metric.instance', 'equalto', expected_instance) |
         selectattr('value.1', 'equalto', '0') | list | length) == 1

    - name: Require the onboarding verifier to refuse the named endpoint
      block:
        - name: Run the same metrics gate used by service onboarding
          ansible.builtin.include_tasks: verify-o11y-metrics.yml

        - name: Refuse a false-green verifier
          ansible.builtin.fail:
            msg: "The onboarding verifier accepted unreachable {{ expected_instance }}."
      rescue:
        - name: Require the refusal to name the unreachable endpoint
          ansible.builtin.assert:
            that:
              - expected_service in ansible_failed_result.msg
              - "'failing instances=' in ansible_failed_result.msg"
              - ("'" ~ expected_instance ~ "'") in (ansible_failed_result.msg.split('failing instances=', 1)[1].split(';', 1)[0])
            fail_msg: "The verifier failed without naming the unreachable service and endpoint."

        - name: Report the expected verification failure
          ansible.builtin.debug:
            msg: "Verified refusal: {{ expected_service }} at {{ expected_instance }} reported up=0."

    - name: Wait for Grafana's service-down rule to fire for the probe
      ansible.builtin.command:
        argv:
          - "{{ _engine }}"
          - exec
          - o11y-grafana
          - sh
          - -c
          - >-
            printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
            curl -fsS --config - http://127.0.0.1:3000/api/prometheus/grafana/api/v1/alerts
      register: _firing_alerts
      changed_when: false
      retries: 36
      delay: 10
      until: >-
        _firing_alerts.rc == 0 and
        ((_firing_alerts.stdout | from_json).data.alerts |
         selectattr('labels.service', 'equalto', expected_service) |
         selectattr('state', 'match', '^(Alerting|firing)$') | list | length) > 0
      when: drill_expect_alert | default(false) | bool

    - name: Wait for the matching Discord webhook message
      ansible.builtin.uri:
        url: >-
          https://discord.com/api/v10/channels/{{ _channel_id }}/messages?limit=100{{ '&after=' ~ _before_messages.json[0].id if _before_messages.json | length > 0 else '' }}
        headers:
          Authorization: "Bot {{ _discord_secret.json.data.data.bot_token }}"
          User-Agent: "DiscordBot (https://github.com/uhstray-io/agent-cloud, 1.0)"
        status_code: [200]
      register: _discord_messages
      delegate_to: localhost
      retries: 60
      delay: 5
      until: >-
        (_discord_messages.json | default([]) |
         selectattr('webhook_id', 'defined') |
         selectattr('webhook_id', 'equalto', _webhook_id) |
         list | to_json) is search(_delivery_marker)
      no_log: true
      ignore_errors: true
      when: drill_expect_alert | default(false) | bool

    - name: Require a readable firing receipt from the owned webhook
      ansible.builtin.assert:
        that: _discord_messages is succeeded
        fail_msg: >-
          Discord firing receipt absent after the wait: webhook messages={{
          _discord_messages.json | default([]) |
          selectattr('webhook_id', 'defined') |
          selectattr('webhook_id', 'equalto', _webhook_id) |
          list | length }}, readable messages={{
          _discord_messages.json | default([]) |
          selectattr('webhook_id', 'defined') |
          selectattr('webhook_id', 'equalto', _webhook_id) |
          selectattr('content', 'defined') |
          rejectattr('content', 'equalto', '') |
          list | length }}. Check bot message-history and message-content access.
      when: drill_expect_alert | default(false) | bool

    - name: Report the fired rule and confirmed Discord receipt
      ansible.builtin.debug:
        msg: "Grafana fired for {{ expected_service }} and its dedicated webhook delivered a matching Discord message."
      when: drill_expect_alert | default(false) | bool
  always:
    - name: Remove only the probe started by this drill
      ansible.builtin.command:
        argv: ["{{ _engine }}", rm, -f, "{{ _probe }}"]
      when: _probe_run is defined and _probe_run.rc == 0
      changed_when: true
