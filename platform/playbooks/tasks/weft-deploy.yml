---
# weft-deploy.yml — ONE deploy of one weft host (a workspace or a front door) to the release it is
# pinned to, the same steps for staging, for each workspace in a rollout, and for a front door
# (weft's docs/cicd.md §6.1):
#
#   preflight   verify the pinned release.json and every image, pull, check the disk
#   stop        orchestrator, capture, board (a front door: its one container)
#   back up     the binary's own `backup --before-deploy`; a copy that does not verify stops the
#               deploy here and starts what was running again
#   deploy      render .env (and weft.toml) for the new digests, start: board, orchestrator, capture
#   health      within weft_health_minutes (5)
#   watch       weft_watch_minutes (15): no container restarts, health still passes
#
# A failure in health or the watch FAILS THE RUN and leaves the host as it is, so a rollout stops
# at that host. Nothing goes back by itself: what to go back to is the host's previous pin, which is
# in site-config's history, and a person decides. They revert the pin and launch "Roll Back weft
# Host" with the backup set this run printed (rollback-weft-host.yml). The run says so.
#
# A host already running its pin is left alone, so re-launching a rollout continues it where it
# stopped. weft_force_redeploy deploys it again anyway.
#
# Caller passes (and loads vars/weft.yml):
#   weft_release          the host's pin (tasks/weft-release.yml)
#   _weft_role            workspace | door
#   _weft_state_dir       the role's state directory on the VM (root's; vars/weft.yml)
#   _weft_deploy_dir      the role's service directory in the monorepo clone on the VM
#   _weft_label           how the messages name this host ("workspace <id>" / "front door")
#   _weft_health_argv     the role's health command, run from _weft_deploy_dir

- name: "Preflight: release.json, signatures and images"
  ansible.builtin.include_tasks: weft-release.yml

- name: "Check mode: report and stop here"
  ansible.builtin.debug:
    msg: "check mode: {{ _weft_label }} would be deployed to {{ weft_release }}; nothing was stopped, backed up or started."
  when: ansible_check_mode

- name: "Check mode: end this host"
  ansible.builtin.meta: end_host
  when: ansible_check_mode

# What runs now, as the containers report it. Used only to leave a host on its pin alone, and to
# name the backup set: neither chooses an image, so a forged answer can at worst skip a deploy,
# which the run reports.
- name: "Read the image each of this role's containers runs"
  ansible.builtin.command:
    argv: [bash, deploy.sh, images]
    chdir: "{{ _weft_deploy_dir }}"
  environment: "{{ _weft_deploy_env }}"
  register: _weft_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Read the release the rendered .env names"
  ansible.builtin.command:
    argv: [sed, -n, 's/^WEFT_RELEASE=//p', "{{ _weft_deploy_dir }}/.env"]
  register: _weft_env_release
  changed_when: false
  failed_when: false
  check_mode: false

# The deploy's own record of how its last run on this host ended: "deploying <digest>" before the
# stop, "healthy <digest>" only after the watch passed. Root's, in the state directory no
# container mounts. Without it a host whose deploy failed its watch would be running the pinned
# image, and a re-launch would take it for a host already on its pin and pass.
- name: "Read how the last deploy on this host ended"
  ansible.builtin.command:
    argv: [cat, "{{ _weft_state_dir }}/deploy.state"]
  register: _weft_marker
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Name the two versions"
  ansible.builtin.set_fact:
    _weft_to: "{{ _weft_release_name }}"
    _weft_from: "{{ (_weft_env_release.stdout | default('') | trim) or 'none' }}"
    # Healthy at the pinned digest, by the deploy's own record, AND every container running the
    # release's image (deploy.sh images prints one "<image> <running>" line per container).
    _weft_on_pin: >-
      {{ (_weft_marker.stdout | default('') | trim) == ('healthy ' ~ _weft_release_digest)
         and _weft_running.rc == 0
         and (_weft_running.stdout_lines | length) > 0
         and (_weft_running.stdout_lines | reject('equalto', _weft_images[_weft_images_by_role[_weft_role][0]] ~ ' true') | list | length) == 0 }}

- name: "Leave alone a host already on its pin"
  ansible.builtin.debug:
    msg: "{{ _weft_label }} already runs {{ _weft_to }} (release.json {{ _weft_release_digest }}); weft_force_redeploy deploys it again."
  when:
    - _weft_on_pin | bool
    - not (weft_force_redeploy | default(false) | bool)

- name: "End this host: already on its pin"
  ansible.builtin.meta: end_host
  when:
    - _weft_on_pin | bool
    - not (weft_force_redeploy | default(false) | bool)

- name: "Find the data a backup must copy"
  ansible.builtin.stat:
    path: "{{ _weft_data_dir }}/{{ 'weft.db' if _weft_role == 'workspace' else 'front-door.db' }}"
  register: _weft_data

- name: "Read the free space beside it"
  ansible.builtin.command:
    argv: [df, --output=avail, -B1, "{{ _weft_data_dir }}"]
  register: _weft_df
  changed_when: false
  check_mode: false

- name: "Require room for the backup: twice the data"
  ansible.builtin.assert:
    that:
      - (_weft_df.stdout_lines | last | trim | int) > 2 * (_weft_data.stat.size | default(0) | int)
    fail_msg: >-
      {{ _weft_label }} has {{ _weft_df.stdout_lines | last | trim }} bytes free beside a
      {{ _weft_data.stat.size | default(0) }}-byte database: not enough for the backup copy.
      Nothing was stopped.

# Fetched and checked against the signed sum before anything stops: a model that cannot be had
# leaves the running release alone.
- name: "Workspace: the release's whisper model, before the stop"
  ansible.builtin.include_tasks: weft-whisper-model.yml
  when: _weft_role == 'workspace'

# Before the stop, and after every check that changes nothing: a second deploy or a person's
# rollback of this host is refused here, by name, with nothing stopped (tasks/weft-lock.yml).
- name: "Take the deploy lock"
  ansible.builtin.include_tasks: weft-lock.yml
  vars:
    _wl_action: take

- name: "Mark this host deploying {{ _weft_release_digest }}"
  ansible.builtin.copy:
    content: "deploying {{ _weft_release_digest }}\n"
    dest: "{{ _weft_state_dir }}/deploy.state"
    owner: "{{ _weft_state_owner }}"
    group: "{{ _weft_state_group }}"
    mode: "0644"
  become: true
  when: not ansible_check_mode

- name: "Stop and back up"
  block:
    # Unconditional, and safe on a fresh host: .env is rendered further down, and `deploy.sh stop`
    # with no .env says nothing runs and exits 0 (agent-cloud#890 B1).
    - name: "Stop {{ _weft_label }}"
      ansible.builtin.command:
        argv: [bash, deploy.sh, stop]
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      changed_when: true
      when: not ansible_check_mode

    - name: "Back up before deploying {{ _weft_to }}"
      ansible.builtin.command:
        argv: [bash, deploy.sh, backup, --from, "{{ _weft_from }}", --to, "{{ _weft_to }}"]
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      register: _weft_backup
      changed_when: true
      when:
        - _weft_data.stat.exists
        - not ansible_check_mode

    - name: "Keep the backup set's path"
      ansible.builtin.set_fact:
        _weft_backup_set: "{{ (_weft_backup.stdout_lines | default([''])) | last }}"
      when: _weft_data.stat.exists

  rescue:
    - name: "Keep the step that failed"
      ansible.builtin.set_fact:
        _weft_failed_step: "{{ ansible_failed_task.name | default('unknown step') }}"

    - name: "Start what was running again"
      ansible.builtin.command:
        argv: [bash, deploy.sh, up]
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      changed_when: true
      when:
        - _weft_from != 'none'
        - not ansible_check_mode

    - name: "Release the deploy lock (backup failed)"
      ansible.builtin.include_tasks: weft-lock.yml
      vars:
        _wl_action: release

    - name: "Fail: the backup did not verify"
      ansible.builtin.fail:
        msg: >-
          {{ _weft_label }} was not deployed to {{ _weft_to }}: '{{ _weft_failed_step }}'
          failed before anything changed. It is still on {{ _weft_from }}.

- name: "Note when the deploy started (health counts passes after this)"
  ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%SZ
  register: _weft_started
  changed_when: false
  check_mode: false

- name: "Deploy, check and watch"
  block:
    - name: "Render .env for {{ _weft_to }}"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/weft-{{ _weft_role }}/deployment/templates/{{ _weft_role }}.env.j2"
        dest: "{{ _weft_deploy_dir }}/.env"
        mode: "0600"

    - name: "Workspace: weft.toml for {{ _weft_to }}"
      ansible.builtin.include_tasks: weft-workspace-files.yml
      when: _weft_role == 'workspace'

    - name: "Start the new release, {{ _weft_to }}"
      ansible.builtin.command:
        argv: [bash, deploy.sh, up]
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      changed_when: true
      when: not ansible_check_mode

    - name: "Health, within the window in minutes: {{ _weft_health_minutes }}"
      ansible.builtin.command:
        argv: "{{ _weft_health_argv }}"
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      register: _weft_health
      changed_when: false
      check_mode: false
      retries: "{{ (_weft_health_minutes | int) * 6 }}"
      delay: 10
      until: _weft_health.rc == 0

    - name: "Front door: the page answers through the edge"
      ansible.builtin.uri:
        url: "https://{{ weft_domain }}/"
        status_code: [200]
        timeout: 15
      delegate_to: localhost
      check_mode: false
      when: _weft_role == 'door'

    - name: "Restart counts at the start of the watch"
      ansible.builtin.command:
        argv: [bash, deploy.sh, restarts]
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      register: _weft_restarts_before
      changed_when: false
      check_mode: false

    - name: "Watch, in minutes: {{ _weft_watch_minutes }}"
      ansible.builtin.pause:
        minutes: "{{ _weft_watch_minutes | int }}"
      when: (_weft_watch_minutes | int) > 0

    - name: "Restart counts at the end of the watch"
      ansible.builtin.command:
        argv: [bash, deploy.sh, restarts]
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      register: _weft_restarts_after
      changed_when: false
      check_mode: false
      # A crash loop looks like "up" at any single moment; a count that moved is the evidence.
      failed_when: >-
        _weft_restarts_after.rc != 0
        or _weft_restarts_after.stdout != _weft_restarts_before.stdout
        or 'missing' in _weft_restarts_after.stdout

    - name: "Health, again, at the end of the watch"
      ansible.builtin.command:
        argv: "{{ _weft_health_argv }}"
        chdir: "{{ _weft_deploy_dir }}"
      environment: "{{ _weft_deploy_env }}"
      changed_when: false
      check_mode: false

    # Only here: the one state in which a re-launch may leave this host alone.
    - name: "Mark this host healthy at {{ _weft_release_digest }}"
      ansible.builtin.copy:
        content: "healthy {{ _weft_release_digest }}\n"
        dest: "{{ _weft_state_dir }}/deploy.state"
        owner: "{{ _weft_state_owner }}"
        group: "{{ _weft_state_group }}"
        mode: "0644"
      become: true
      when: not ansible_check_mode

    - name: "Release the deploy lock"
      ansible.builtin.include_tasks: weft-lock.yml
      vars:
        _wl_action: release

    - name: "Report {{ _weft_label }}"
      ansible.builtin.debug:
        msg: "{{ _weft_label }} is on {{ _weft_to }} (from {{ _weft_from }}), healthy after a {{ _weft_watch_minutes }}-minute watch."

  rescue:
    # No automatic rollback: the previous release is the host's previous pin, a person's choice
    # in site-config, and going back restores data. The host is left as it is, and the run fails so
    # a rollout goes no further.
    - name: "Keep the step that failed"
      ansible.builtin.set_fact:
        _weft_failed_step: "{{ ansible_failed_task.name | default('unknown step') }}"

    - name: "Release the deploy lock (deploy failed)"
      ansible.builtin.include_tasks: weft-lock.yml
      vars:
        _wl_action: release

    - name: "Fail: {{ _weft_to }} failed on {{ _weft_label }}"
      ansible.builtin.fail:
        msg: >-
          {{ _weft_label }}: {{ _weft_to }} failed '{{ _weft_failed_step }}'
          and is left as it is; nothing was rolled back and nothing was deleted.
          {{ ('The backup taken before it is ' ~ _weft_backup_set ~ '. ') if (_weft_backup_set | default('') | length > 0) else '' }}To
          go back to {{ _weft_from }}: revert this host's weft_release in site-config, sync the
          inventory, then launch Roll Back weft Host with this host and that backup set.
