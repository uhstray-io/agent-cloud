---
# resolve-become-password.yml — make privilege escalation possible on a host that
# has NOT been hardened yet.
#
# WHY THIS EXISTS. A host that has not been through harden-ssh.yml has no
# NOPASSWD sudo, so sudo asks for a password. Ansible raises "Missing sudo
# password" from the become plugin BEFORE any module runs — including during fact
# gathering, when the play declares `become: true` at play level. So the failure
# is not a task failure and `failed_when`/`ignore_errors` on individual tasks
# cannot catch it: the play simply dies at "Gathering Facts" with ok=0.
#
# Measured 2026-08-25 against a freshly keyed host: `install-podman.yml` failed
# exactly that way, and the access gate that was supposed to clear the host for
# hardening failed the same way one step later. Of the six playbooks that escalate
# at play level, only harden-ssh.yml fetched the password — so every other one was
# unusable on precisely the hosts they exist to prepare.
#
# It is a chicken-and-egg by construction: the steps that MAKE escalation
# passwordless cannot themselves assume passwordless escalation.
#
# Include this as the FIRST task of any play that escalates on a host which may
# not be hardened yet:
#
#   tasks:
#     - name: "Resolve the sudo password for an unhardened host"
#       ansible.builtin.include_tasks: tasks/resolve-become-password.yml
#
# On an already-hardened host the value is simply unused, so including it is
# always safe. Absence is NOT fatal here — it is reported, and the play fails
# later with sudo's own error, which is the honest place for it to fail.
#
# Requires: openbao_addr (or OPENBAO_ADDR) and AppRole credentials in the
# environment, which every Semaphore-run play already has.

- name: "Fetch the sudo password from the secret store"
  # become:false — this fetch must not itself need the escalation it is enabling.
  # The same path harden-ssh.yml reads, so the step that REMOVES the password path
  # and the steps that run before it cannot disagree about where it lives; a
  # disagreement would let a host be prepared and then fail to harden.
  ansible.builtin.set_fact:
    _resolved_become_pw: >-
      {{ lookup('community.hashi_vault.hashi_vault',
           'secret/data/services/ssh:become_password',
           url=(openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true)),
           auth_method='approle',
           role_id=(bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true)),
           secret_id=(bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true)),
           errors='ignore') | default('', true) }}
  become: false
  no_log: true
  failed_when: false

- name: "Use it for escalation when one was found"
  ansible.builtin.set_fact:
    ansible_become_password: "{{ _resolved_become_pw }}"
  become: false
  no_log: true
  when: (_resolved_become_pw | default('') | length) > 0

- name: "Report whether escalation has a password available (never the value)"
  ansible.builtin.debug:
    msg: >-
      sudo password {{ 'resolved from the secret store' if (_resolved_become_pw | default('') | length) > 0
                       else 'NOT available — escalation will work only if this host already has
                             passwordless sudo. If it does not, this play fails at its first
                             privileged task; run the playbook that records the bootstrap
                             credential first.' }}
  become: false
