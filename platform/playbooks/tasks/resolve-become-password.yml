---
# resolve-become-password.yml — make privilege escalation possible on a host that
# has NOT been hardened yet.
#
# WHY THIS EXISTS. A host that has not been through harden-ssh.yml has no
# NOPASSWD sudo, so sudo asks for a password. Ansible raises "Missing sudo
# password" from the become plugin BEFORE any module runs, so it is not a task
# failure and no per-task `failed_when` can catch it.
#
# Measured 2026-08-25 against a freshly keyed host: `install-podman.yml` died at
# "Gathering Facts" with ok=0, and the access gate that was meant to clear that
# host for hardening died the same way one step later. Of the six playbooks that
# escalate at play level, only harden-ssh.yml resolved the password — so every
# other one was unusable on precisely the hosts they exist to prepare.
#
# It is a chicken-and-egg by construction: the steps that MAKE escalation
# passwordless cannot themselves assume passwordless escalation.
#
# ── HOW TO USE IT, AND THE PART THAT IS EASY TO GET WRONG ────────────────────
#
# FACT GATHERING HAPPENS BEFORE TASKS. A play with `become: true` and fact
# gathering left on escalates during gathering, so this file cannot help it —
# the play is already dead before task 1. Being "the first task" is not enough,
# and a first version of this change made exactly that mistake: the include was
# first, the tests asserted it was first, and all three plays would still have
# failed. harden-ssh.yml works because it sets `gather_facts: false`.
#
# So a calling play MUST disable automatic gathering and gather explicitly after:
#
#   - name: "Install X on {{ target_service }}"
#     hosts: "{{ target_service }}"
#     gather_facts: false            # REQUIRED — see above
#     become: true
#     tasks:
#       - name: "Resolve the sudo password (host may not be hardened yet)"
#         ansible.builtin.include_tasks: tasks/resolve-become-password.yml
#       - name: "Gather facts now that escalation is possible"
#         ansible.builtin.setup
#
# On an already-hardened host the value is simply unused, so including this is
# always safe. Absence is NOT fatal here — it is reported, and the play fails
# later with sudo's own error, which is the honest place for it to fail.
#
# Requires: openbao_addr (or OPENBAO_ADDR) and AppRole credentials in the
# environment, which every Semaphore-run play already has.

- name: "Resolve the secret-store address"
  ansible.builtin.set_fact:
    _rbp_bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
  become: false

# The AppRole secret_id, the token returned, and the sudo password itself all
# cross this connection, so the shared transport guard applies here as it does to
# every other play that reaches the secret store. Skipped when no address is
# configured at all, because that case is already handled as "no password
# available" below rather than as a transport violation.
- name: "Refuse a cleartext secret-store endpoint"
  ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
  vars:
    _assert_bao_url: "{{ _rbp_bao_url }}"
  when: _rbp_bao_url | length > 0
  # become:false is stated rather than relied upon. The guard is one `assert`,
  # which Ansible evaluates on the controller and never runs as a privileged
  # module on the target — measured: an assert task under play-level `become: true`
  # returns ok on a host that still requires a sudo password, so it cannot fail on
  # escalation. But this file runs from plays that DO escalate at play level, and
  # if the guard ever grew a task that touches the target, it would inherit that
  # escalation and fail here — before the lookup below has supplied the password.
  # One line makes the precondition explicit instead of depending on `assert`
  # staying connection-free.
  become: false

- name: "Fetch the sudo password from the secret store"
  # become:false — this fetch must not itself need the escalation it is enabling.
  # The same path harden-ssh.yml reads, so the step that REMOVES the password path
  # and the steps that run before it cannot disagree about where it lives; a
  # disagreement would let a host be prepared and then fail to harden.
  ansible.builtin.set_fact:
    _resolved_become_pw: >-
      {{ lookup('community.hashi_vault.hashi_vault',
           'secret/data/services/ssh:become_password',
           url=_rbp_bao_url,
           auth_method='approle',
           role_id=(bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true)),
           secret_id=(bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true)),
           errors='ignore') | default('', true) }}
  become: false
  no_log: true
  failed_when: false
  when: _rbp_bao_url | length > 0

- name: "Use it for escalation when one was found"
  ansible.builtin.set_fact:
    ansible_become_password: "{{ _resolved_become_pw }}"
  become: false
  no_log: true
  when: (_resolved_become_pw | default('') | length) > 0

- name: "Report whether escalation has a password available (never the value)"
  ansible.builtin.debug:
    msg: >-
      sudo password {{ 'resolved from the secret store' if (_resolved_become_pw | default('') | length) > 0
                       else 'NOT available — escalation will work only if this host already has
                             passwordless sudo. If it does not, this play fails at its first
                             privileged task; run the playbook that records the bootstrap
                             credential first.' }}
  become: false
