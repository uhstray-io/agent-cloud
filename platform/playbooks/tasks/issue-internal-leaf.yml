---
# issue-internal-leaf.yml — issue ONE declared leaf certificate from the internal CA, with
# its private key generated on the consumer and never moved (openspec production-internal-ca
# tasks 4.1 and 4.2; design decisions 3, 4 and 7).
#
#   consumer (the play host)            CA host (_mint_ca_host)
#   ─────────────────────────           ───────────────────────
#   key + request (openssl) ──request──▶ step ca sign, issuer-<profile>
#   <dir>/<serial>/{cert,key}.pem ◀─cert─
#   <dir>/current ─▶ <serial>   (one rename; the previous serial directory is kept)
#
# Only the request and the certificate cross hosts, and both are public. The issuing
# provisioner's password is read from OpenBao on the controller and handed to the CA
# container on stdin, in a hidden task. Included by mint-internal-cert.yml when `_mint_name`
# is set; the wildcard path there is unchanged.
#
# Required vars:
#   _mint_name       a leaf in site-config's `internal_leaves` whose `host` is this play host
# Optional vars:
#   _mint_ca_host    inventory host running the step-ca container (default: the play host)
#   _mint_reissue    issue even when <dir>/current holds a certificate (default: false)
#   _mint_ca_name    step-ca container name (default: step-ca)
#
# The declaration (all-hosts site-config variable, design decision 4):
#   internal_leaves:
#     - {name: caddy, host: <inventory host>, dir: <absolute directory>, profile: client,
#        sans: [vm01.caddy.<site>.<zone>, caddy.<site>.<zone>], reload: <action>}
# Every SAN must be a lowercase DNS name without a wildcard under `<dns_site>.<dns_zone>`;
# the CA's own name policy (deploy-step-ca.yml) allows exactly the declared SANs as well.

- name: "Find the declared leaf {{ _mint_name }}"
  ansible.builtin.set_fact:
    _leaf_matches: "{{ internal_leaves | default([]) | selectattr('name', 'equalto', _mint_name) | list }}"

# Task 4.2: nothing reaches the CA for a name, a host or a directory the declaration does
# not hold. The same name rule as the CA's policy, so the two cannot disagree.
- name: "Refuse a leaf that is not declared for this host"
  ansible.builtin.assert:
    that:
      - _leaf_matches | length == 1
      - _leaf_matches[0].host == inventory_hostname
      - _leaf_matches[0].profile in ['server', 'client']
      - _leaf_matches[0].dir is match('^/[^\\s]*$')
      - (_leaf_matches[0].sans | default([]) | length) > 0
      - (dns_site | default('') | length) > 0 and (dns_zone | default('') | length) > 0
      - _leaf_matches[0].sans | reject('match', '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$') | list | length == 0
      - _leaf_matches[0].sans | reject('search', '\\.' ~ ((dns_site | default('')) ~ '.' ~ (dns_zone | default(''))) | regex_escape ~ '$') | list | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: `{{ _mint_name }}` must be declared exactly once in internal_leaves
      for this host, with a server or client profile, an absolute dir, and SANs that are plain
      lowercase names under {{ dns_site | default('<dns_site>') }}.{{ dns_zone | default('<dns_zone>') }}.
      Found {{ _leaf_matches | length }} declaration(s).
    quiet: true

- name: "Name the leaf's parameters"
  ansible.builtin.set_fact:
    _leaf: "{{ _leaf_matches[0] }}"
    _leaf_ca_host: "{{ _mint_ca_host | default(inventory_hostname) }}"
    _leaf_ca_engine: "{{ hostvars[_mint_ca_host | default(inventory_hostname)].container_engine | default('podman') }}"

- name: "Does the leaf already have a current certificate"
  ansible.builtin.stat:
    path: "{{ _leaf.dir }}/current/cert.pem"
  register: _leaf_current

- name: "Report the issuance decision"
  ansible.builtin.debug:
    msg: >-
      {{ _mint_name }} ({{ _leaf.profile }}, {{ _leaf.sans | join(', ') }}):
      {{ 'issuing a new certificate' if (not _leaf_current.stat.exists or (_mint_reissue | default(false) | bool))
         else 'current certificate kept; pass _mint_reissue=true to replace it' }}
      {{- ' (check mode: nothing is written)' if ansible_check_mode else '' }}

- name: "Issue the leaf"
  when: not _leaf_current.stat.exists or (_mint_reissue | default(false) | bool)
  block:
    - name: "Refuse a consumer without openssl (it is not installed from here)"
      ansible.builtin.command: openssl version
      changed_when: false
      check_mode: false

    - name: "Resolve the secret-store address"
      ansible.builtin.set_fact:
        _leaf_bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _leaf_bao_url }}"

    # Credential task: the issuer's password, from the path deploy-step-ca.yml stores it at.
    - name: "Read the issuing provisioner's password"
      ansible.builtin.set_fact:
        _leaf_issuer_pw: >-
          {{ lookup('community.hashi_vault.hashi_vault',
               'secret/data/services/step-ca:issuer_' ~ _leaf.profile ~ '_password',
               url=_leaf_bao_url,
               auth_method='approle',
               role_id=(bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true)),
               secret_id=(bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true))) }}
      no_log: true
      when: not ansible_check_mode

    # The key never leaves this directory: generated here, moved into the serial directory
    # below, never read by any task.
    - name: "Generate the key and the certificate request on the consumer"
      ansible.builtin.shell: |
        set -eu
        umask 077
        mkdir -p "{{ _leaf.dir }}/.pending"
        openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout "{{ _leaf.dir }}/.pending/key.pem" -out "{{ _leaf.dir }}/.pending/request.csr" \
          -subj "/CN={{ _leaf.sans[0] }}" \
          -addext "subjectAltName={{ _leaf.sans | map('regex_replace', '^', 'DNS:') | join(',') }}" 2>/dev/null
        cat "{{ _leaf.dir }}/.pending/request.csr"
      register: _leaf_csr
      changed_when: true
      when: not ansible_check_mode

    # Credential task: the password and the request share stdin (password first line).
    # The certificate (public) is the only output; step's own error, if any, goes to stdout
    # prefixed so a visible task below can report it without this result being printed.
    - name: "Sign the request on the CA host with issuer-{{ _leaf.profile }}"
      ansible.builtin.command:
        argv:
          - "{{ _leaf_ca_engine }}"
          - exec
          - -i
          - "{{ _mint_ca_name | default('step-ca') }}"
          - sh
          - -c
          - >-
            umask 077; IFS= read -r pw; printf '%s' "$pw" > /tmp/ipw.$$; cat > /tmp/req.$$.csr;
            if step ca sign /tmp/req.$$.csr /tmp/crt.$$ --provisioner "$0"
            --provisioner-password-file /tmp/ipw.$$ --ca-url https://localhost:9000
            --root /home/step/certs/root_ca.crt --force >/dev/null 2>/tmp/err.$$;
            then cat /tmp/crt.$$; rc=0; else echo "SIGNERR: $(tail -1 /tmp/err.$$)"; rc=1; fi;
            rm -f /tmp/ipw.$$ /tmp/req.$$.csr /tmp/crt.$$ /tmp/err.$$; exit $rc
          - "issuer-{{ _leaf.profile }}"
        stdin: "{{ _leaf_issuer_pw }}\n{{ _leaf_csr.stdout }}"
        stdin_add_newline: true
      delegate_to: "{{ _leaf_ca_host }}"
      register: _leaf_signed
      changed_when: true
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: "Refuse a request the CA did not sign"
      ansible.builtin.assert:
        that:
          - _leaf_signed.rc == 0
          - "'-----BEGIN CERTIFICATE-----' in _leaf_signed.stdout"
        fail_msg: >-
          {{ _mint_name }}: the CA refused the request:
          {{ _leaf_signed.stdout_lines | select('match', '^SIGNERR: ') | first | default('no reason given') }}
        quiet: true
      when: not ansible_check_mode

    # A fresh directory per certificate, then `current` replaced in one rename, so a reader
    # never sees a new certificate beside an old key (design decision 7). The link is
    # relative, so it resolves inside a container that mounts the parent directory.
    - name: "Place the certificate and key under their serial, then swap current"
      ansible.builtin.shell: |
        set -eu
        cd "{{ _leaf.dir }}"
        umask 077
        cat > .pending/cert.pem
        serial=$(openssl x509 -in .pending/cert.pem -noout -serial | cut -d= -f2)
        prev=$(readlink current 2>/dev/null || true)
        mkdir "$serial"
        mv .pending/cert.pem .pending/key.pem "$serial/"
        chmod 0644 "$serial/cert.pem"
        rm -f .pending/request.csr
        ln -s "$serial" .current.new
        python3 -c 'import os; os.replace(".current.new", "current")'
        # Only serial directories are pruned (hex, as openssl prints a serial): `dir` may hold
        # other files, and nothing but the serial directories made here may be removed.
        for d in */; do
          d=${d%/}
          case "$d" in *[!0-9A-F]*) continue ;; esac
          [ "$d" = "$serial" ] || [ "$d" = "$prev" ] || rm -rf -- "$d"
        done
        echo "$serial"
      args:
        stdin: "{{ _leaf_signed.stdout }}"
      register: _leaf_placed
      changed_when: true
      when: not ansible_check_mode

    - name: "Report the issued leaf"
      ansible.builtin.debug:
        msg: "{{ _mint_name }}: serial {{ _leaf_placed.stdout | trim }} at {{ _leaf.dir }}/current"
      when: not ansible_check_mode
