---
- name: Ensure PBS API and proxy services are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - proxmox-backup.service
    - proxmox-backup-proxy.service
  loop_control:
    label: "{{ item }}"

- name: Wait for the PBS HTTPS API version endpoint
  ansible.builtin.uri:
    url: https://127.0.0.1:8007/api2/json/version
    method: GET
    validate_certs: false
    status_code: 200
    return_content: true
  register: _pbs_api_health
  retries: 12
  delay: 5
  until: _pbs_api_health.status | default(0) == 200
  changed_when: false
  check_mode: false

- name: Read PBS datastore list
  ansible.builtin.command:
    argv: [proxmox-backup-manager, datastore, list, --output-format, json]
  register: _pbs_datastore_list
  changed_when: false
  check_mode: false

- name: Parse existing PBS datastore identities
  ansible.builtin.set_fact:
    _pbs_datastores: "{{ _pbs_datastore_list.stdout | from_json }}"

- name: Require supported datastore list output
  ansible.builtin.assert:
    that:
      - _pbs_datastores is sequence
      - _pbs_datastores is not string
      - _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length <= 1
      - >-
        (_pbs_datastores | selectattr('path', 'defined') | selectattr('path', 'equalto', _pbs_datastore_path)
        | rejectattr('name', 'equalto', _pbs_datastore) | list | length) == 0
    fail_msg: "PBS datastore list is malformed or contains a duplicate managed datastore."
    quiet: true

- name: Read current managed datastore configuration
  ansible.builtin.command:
    argv: [proxmox-backup-manager, datastore, show, "{{ _pbs_datastore }}", --output-format, json]
  register: _pbs_datastore_current
  changed_when: false
  failed_when: false
  check_mode: false
  when: _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 1

- name: Refuse a datastore name already bound to another path
  ansible.builtin.assert:
    that:
      - (_pbs_datastore_current.stdout | from_json).path == _pbs_datastore_path
      - (_pbs_datastore_current.stdout | from_json).get('maintenance-mode', '') | default('', true) == ''
    fail_msg: "The managed datastore is bound to a different path or is in maintenance mode; preserve and inspect it manually."
    quiet: true
  when: _pbs_datastore_current is not skipped

- name: Hash the checked-out guest path helper from the reviewed repository
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/files/prepare_pbs_guest_disk.py"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  run_once: true
  register: _pbs_guest_path_helper_source
  changed_when: false
  check_mode: false

- name: Read back the installed guest path helper checksum
  ansible.builtin.stat:
    path: /usr/local/lib/agent-cloud-prepare-pbs-guest-disk.py
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: _pbs_guest_path_helper_installed
  changed_when: false
  check_mode: false

- name: Require the installed guest helper to match the reviewed source bytes
  ansible.builtin.assert:
    that:
      - _pbs_guest_path_helper_source.stat.isreg | default(false)
      - not (_pbs_guest_path_helper_source.stat.islnk | default(false))
      - _pbs_guest_path_helper_installed.stat.isreg | default(false)
      - not (_pbs_guest_path_helper_installed.stat.islnk | default(false))
      - _pbs_guest_path_helper_installed.stat.checksum == _pbs_guest_path_helper_source.stat.checksum
    fail_msg: "The installed PBS guest path helper is missing, not a regular file, or differs from the reviewed source."
    quiet: true

- name: Re-prove the data mount immediately before datastore path validation
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/files/assert_pbs_data_mount.py --vmid {{ _pbs_vmid | quote }}"
  register: _pbs_mount_before_datastore
  changed_when: false
  check_mode: false

- name: Require the pre-write mount UUID to match the initial proof
  ansible.builtin.assert:
    that:
      - (_pbs_mount_before_datastore.stdout | from_json).uuid == (_pbs_mount_identity.stdout | from_json).uuid
      - (_pbs_mount_before_datastore.stdout | from_json).target == _pbs_datastore_path | dirname
    fail_msg: "The PBS data mount changed during configuration; no datastore change is allowed."
    quiet: true
  when: _pbs_mount_before_datastore is not skipped

- name: Prove datastore path containment on the pinned data filesystem
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/lib/agent-cloud-prepare-pbs-guest-disk.py
      - --validate-datastore-path
      - --mountpoint
      - "{{ (_pbs_mount_before_datastore.stdout | from_json).target }}"
      - --datastore-path
      - "{{ _pbs_datastore_path }}"
  register: _pbs_datastore_path_containment
  changed_when: false
  check_mode: false

- name: Require the guest helper to validate the datastore path
  ansible.builtin.assert:
    that:
      - (_pbs_datastore_path_containment.stdout | from_json).datastore_path == 'validated'
    fail_msg: "The PBS datastore path is not a real direct child of the pinned data mount."
    quiet: true

- name: Inspect the datastore path before creating it
  ansible.builtin.stat:
    path: "{{ _pbs_datastore_path }}"
  register: _pbs_datastore_path_stat
  when: _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 0

- name: Check existing unclaimed datastore directory contents
  ansible.builtin.find:
    paths: "{{ _pbs_datastore_path }}"
    recurse: false
    hidden: true
    file_type: any
  register: _pbs_datastore_path_contents
  when:
    - _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 0
    - _pbs_datastore_path_stat.stat.exists
    - _pbs_datastore_path_stat.stat.isdir

- name: Preserve unknown content instead of registering it as a datastore
  ansible.builtin.assert:
    that:
      - _pbs_datastore_path_stat.stat.isdir | default(false)
      - _pbs_datastore_path_contents.matched | default(0) == 0
    fail_msg: "The PBS datastore path already has content or is not a directory; it will not be adopted or changed."
    quiet: true
  when: _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 0 and _pbs_datastore_path_stat.stat.exists

- name: Ensure the new datastore directory exists on the proven mount
  ansible.builtin.file:
    path: "{{ _pbs_datastore_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"
  when: _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 0

- name: Create the PBS datastore without a prune schedule
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - create
      - "{{ _pbs_datastore }}"
      - "{{ _pbs_datastore_path }}"
      - --gc-schedule
      - "{{ _pbs_gc_schedule }}"
      - --verify-new
      - "true"
  when:
    - not ansible_check_mode
    - _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 0
  changed_when: true

- name: Reconcile datastore garbage collection and verify-new policy
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - update
      - "{{ _pbs_datastore }}"
      - --gc-schedule
      - "{{ _pbs_gc_schedule }}"
      - --verify-new
      - "true"
  when:
    - not ansible_check_mode
    - >-
      (_pbs_datastore_current.stdout | from_json).get('gc-schedule', '') != _pbs_gc_schedule
      or (_pbs_datastore_current.stdout | from_json).get('verify-new', false) | string | lower != 'true'
  changed_when: true

- name: Read verification jobs
  ansible.builtin.command:
    argv: [proxmox-backup-manager, verify-job, list, --output-format, json]
  register: _pbs_verify_jobs
  changed_when: false
  check_mode: false

- name: Parse verification job identities
  ansible.builtin.set_fact:
    _pbs_verify_job_list: "{{ _pbs_verify_jobs.stdout | from_json }}"

- name: Require a unique managed verification job
  ansible.builtin.assert:
    that:
      - _pbs_verify_job_list is sequence
      - _pbs_verify_job_list is not string
      - _pbs_verify_job_list | selectattr('id', 'equalto', _pbs_verify_job) | list | length <= 1
    fail_msg: "PBS verification job listing is malformed or duplicates the managed ID."
    quiet: true

- name: Read current managed verification job
  ansible.builtin.command:
    argv: [proxmox-backup-manager, verify-job, show, "{{ _pbs_verify_job }}", --output-format, json]
  register: _pbs_verify_job_current
  changed_when: false
  failed_when: false
  check_mode: false
  when: _pbs_verify_job_list | selectattr('id', 'equalto', _pbs_verify_job) | list | length == 1

- name: Refuse a verification job assigned to another datastore
  ansible.builtin.assert:
    that: (_pbs_verify_job_current.stdout | from_json).store == _pbs_datastore
    fail_msg: "The managed verification job is assigned to another datastore."
    quiet: true
  when: _pbs_verify_job_current is not skipped

- name: Create the weekly PBS verification job
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - verify-job
      - create
      - "{{ _pbs_verify_job }}"
      - --store
      - "{{ _pbs_datastore }}"
      - --schedule
      - "{{ _pbs_verify_schedule }}"
      - --ignore-verified
      - "true"
      - --outdated-after
      - "7"
  when:
    - not ansible_check_mode
    - _pbs_verify_job_list | selectattr('id', 'equalto', _pbs_verify_job) | list | length == 0
  changed_when: true

- name: Reconcile the managed verification schedule
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - verify-job
      - update
      - "{{ _pbs_verify_job }}"
      - --schedule
      - "{{ _pbs_verify_schedule }}"
      - --ignore-verified
      - "true"
      - --outdated-after
      - "7"
  when:
    - not ansible_check_mode
    - >-
      (_pbs_verify_job_current.stdout | from_json).get('schedule', '') != _pbs_verify_schedule
      or (_pbs_verify_job_current.stdout | from_json).get('ignore-verified', false) | string | lower != 'true'
      or (_pbs_verify_job_current.stdout | from_json).get('outdated-after', 0) | int != 7
  changed_when: true

- name: Read back datastore and verification job configuration
  ansible.builtin.command:
    argv: [proxmox-backup-manager, datastore, show, "{{ _pbs_datastore }}", --output-format, json]
  register: _pbs_datastore_readback
  changed_when: false
  check_mode: false
  when:
    - >-
      not ansible_check_mode
      or _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 1

- name: Read back verification job configuration
  ansible.builtin.command:
    argv: [proxmox-backup-manager, verify-job, show, "{{ _pbs_verify_job }}", --output-format, json]
  register: _pbs_verify_job_readback
  changed_when: false
  check_mode: false
  when:
    - >-
      not ansible_check_mode
      or _pbs_verify_job_list | selectattr('id', 'equalto', _pbs_verify_job) | list | length == 1

- name: Require the final datastore configuration
  ansible.builtin.assert:
    that:
      - (_pbs_datastore_readback.stdout | from_json).path == _pbs_datastore_path
      - (_pbs_datastore_readback.stdout | from_json).get('gc-schedule', '') == _pbs_gc_schedule
      - (_pbs_datastore_readback.stdout | from_json).get('verify-new', false) | string | lower == 'true'
      - (_pbs_datastore_readback.stdout | from_json).get('maintenance-mode', '') | default('', true) == ''
      - (_pbs_verify_job_readback.stdout | from_json).store == _pbs_datastore
      - (_pbs_verify_job_readback.stdout | from_json).get('schedule', '') == _pbs_verify_schedule
      - (_pbs_verify_job_readback.stdout | from_json).get('ignore-verified', false) | string | lower == 'true'
      - (_pbs_verify_job_readback.stdout | from_json).get('outdated-after', 0) | int == 7
    fail_msg: "PBS datastore readback does not match the declared path and maintenance policy."
    quiet: true
  when: not ansible_check_mode

- name: Report datastore creation planned in check mode
  ansible.builtin.debug:
    msg: "Datastore {{ _pbs_datastore }} would be created at {{ _pbs_datastore_path }}."
  when:
    - ansible_check_mode
    - _pbs_datastores | selectattr('name', 'equalto', _pbs_datastore) | list | length == 0

- name: Report verification job creation planned in check mode
  ansible.builtin.debug:
    msg: "Verification job {{ _pbs_verify_job }} would be created."
  when:
    - ansible_check_mode
    - _pbs_verify_job_list | selectattr('id', 'equalto', _pbs_verify_job) | list | length == 0

- name: Report PBS health and fixed datastore identity
  ansible.builtin.debug:
    msg:
      - "PBS HTTPS API: healthy"
      - "Data mount: {{ (_pbs_mount_identity.stdout | from_json).target }} ext4 UUID-backed"
      - "Datastore: {{ _pbs_datastore }} at {{ _pbs_datastore_path }}"
      - "Garbage collection: {{ _pbs_gc_schedule }}; verification: {{ _pbs_verify_schedule }}"
      - "Repository channel: {{ _pbs_repository_channel }}"
