---
# update-vault-field.yml — merge fields into a KV-v2 secret, preserving siblings.
#
# Historically hardcoded to api_token + a literal proxmox token_id, and it wrote
# with a read-modify-POST — the clobbering race every other writer's comments
# warn against. Now a thin adapter over tasks/bao-merge-keys.yml (the single
# merge-patch implementation). The proxmox token remains the DEFAULT so the
# existing caller (update-proxmox-token.yml) is unchanged: api_token always, and
# token_id only when proxmox_token_id names it. There is no literal token id —
# it names a real Proxmox user, so it comes from the run, never from this file;
# a rotation that keeps the same token leaves the stored token_id untouched.
#
# Expected variables:
#   _vault_path    — KV v2 data path (e.g. secret/data/services/proxmox)
#   _vault_fields  — dict of field -> value to merge (optional; defaults to the
#                    proxmox api_token, plus token_id when proxmox_token_id is set)
#   proxmox_api_token, proxmox_token_id — consumed only by that default
#   _bao_auth      — authenticated vault login result
#   _bao_url       — OpenBao address

- name: "Merge fields via the shared write path at {{ _vault_path }}"
  ansible.builtin.include_tasks: bao-merge-keys.yml
  vars:
    _bm_url: "{{ _bao_url }}"
    _bm_token: "{{ _bao_auth.json.auth.client_token }}"
    _bm_path: "{{ _vault_path | regex_replace('^secret/data/', '') }}"
    _bm_data: >-
      {{ _vault_fields | default({'api_token': proxmox_api_token}
         | combine({'token_id': proxmox_token_id} if (proxmox_token_id | default('') | length > 0) else {})) }}
    _bm_on_missing: create

- name: "Vault fields updated — {{ _vault_path }}"
  ansible.builtin.debug:
    msg: >-
      Merged {{ (_vault_fields | default({'api_token': 1} | combine({'token_id': 1}
      if (proxmox_token_id | default('') | length > 0) else {}))) | length }} field(s)
      at {{ _vault_path }} (changed={{ _bm_changed }})
