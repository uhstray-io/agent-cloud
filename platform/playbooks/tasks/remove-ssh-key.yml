---
# remove-ssh-key.yml — wipe what tasks/materialise-ssh-key.yml put on the runner.
#
# Include it from the `always:` of the block that included materialise-ssh-key.yml, with
# the same ssh_key_result_var, so the key goes on failure too. Safe to run when nothing
# was materialised, or when the result fact was never set.
#
# `check_mode: false` because the scratch directory was created for real during a dry
# run too; a simulated delete would leave the key on the runner (see the header of
# materialise-ssh-key.yml for why the scratch runs under --check at all).
#
# The wipe refuses any directory materialise-ssh-key.yml did not create: the path arrives
# through a fact, and a mis-set fact must not turn a cleanup step into an arbitrary
# recursive delete. It must carry the `.sshkey_` prefix AND sit directly under the temp
# root, computed here by the same expression the materialise task hands tempfile, not
# read back from the fact.

# Resolved by set_fact, not task vars: the forced write below carries no `vars:` at all, and
# each name here has exactly one pinned definition in the repository
# (test_check_mode_contract.py), so neither can be redefined around the check.
- name: "Remove SSH key: resolve the directory and the temp root"
  ansible.builtin.set_fact:
    _rsk_dir: "{{ (lookup('ansible.builtin.vars', ssh_key_result_var, default={}) | default({}, true)).dir | default('') }}"
    _rsk_root: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) | realpath }}"
  when: ssh_key_result_var is defined

- name: "Remove SSH key: wipe the runner-local scratch directory"
  ansible.builtin.file:
    path: "{{ _rsk_dir }}"
    state: absent
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  when:
    - ssh_key_result_var is defined
    - _rsk_dir | length > 0
    - (_rsk_dir | basename) is match('^\.sshkey_')
    - (_rsk_dir | realpath | dirname) == _rsk_root
