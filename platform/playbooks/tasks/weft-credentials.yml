---
# weft-credentials.yml — read the two credentials weft's pipeline itself uses into memory, on the
# controller: the Discord webhook its deploy messages go through, and (when asked) the GitHub
# token Semaphore uses to read weft's repository and record deployments. Neither ever reaches a
# weft VM, a file or a log.
#
#   secret/services/weft/discord:webhook_url   made by Seed weft Secrets (the bot makes it)
#   secret/services/weft/github:token          seeded by an operator (Seed OpenBao Key)
#
# Both paths are under `weft` for staging and the rack alike: one channel and one repository.
# The caller has already guarded the OpenBao transport.
#
# Caller passes:
#   _weft_need_github   true to read the GitHub token too
# Sets: _weft_discord_webhook, and _weft_github_token when asked.
#
# A missing key reads as empty (errors='ignore') so the assert below can name it: a lookup that
# raised inside a no_log task would fail with its message censored.

- name: "Read weft's Discord webhook (OpenBao secret/services/weft/discord)"
  ansible.builtin.set_fact:
    _weft_discord_webhook: >-
      {{ lookup('community.hashi_vault.hashi_vault',
                'secret/data/services/weft/discord:webhook_url',
                url=(openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true)),
                auth_method='approle',
                role_id=(bao_role_id | default(lookup('env', 'BAO_ROLE_ID'))),
                secret_id=(bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'))),
                errors='ignore') | default('', true) }}
  no_log: true

- name: "Read weft's GitHub token (OpenBao secret/services/weft/github)"
  ansible.builtin.set_fact:
    _weft_github_token: >-
      {{ lookup('community.hashi_vault.hashi_vault',
                'secret/data/services/weft/github:token',
                url=(openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true)),
                auth_method='approle',
                role_id=(bao_role_id | default(lookup('env', 'BAO_ROLE_ID'))),
                secret_id=(bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'))),
                errors='ignore') | default('', true) }}
  no_log: true
  when: _weft_need_github | default(false) | bool

# A deploy that can roll back must be able to say so. Refusing here, before anything changes,
# is cheaper than a silent rollback nobody hears about.
- name: "Require both before anything changes"
  ansible.builtin.assert:
    that:
      - _weft_discord_webhook | default('') | trim | length > 0
      - not (_weft_need_github | default(false) | bool) or (_weft_github_token | default('') | trim | length > 0)
    fail_msg: >-
      Missing secret/services/weft/discord:webhook_url (run Seed weft Secrets) or
      secret/services/weft/github:token (seed it with Seed OpenBao Key: a fine-grained token on
      the weft repository with contents and actions read, deployments write).
  no_log: true
