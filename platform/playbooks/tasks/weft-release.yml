---
# weft-release.yml — on the target VM: fetch the release.json a deploy is asked for, prove it and
# every image it names were signed by weft's images.yml on main, and pull those images by digest.
#
# A deploy reads release.json and never a tag (weft's docs/cicd.md §2.2). A tag is a name that can
# be moved; release.json names every image by digest, so what is pulled is what was signed and,
# for a release, what staging ran. The file itself is fetched by digest and verified before a
# single field of it is believed, because a deploy must not trust a file it cannot verify.
#
# It is never written to disk: the manifest and the release.json blob are fetched by digest to
# stdout. A file on the VM between the fetch and the read could be swapped by anything that
# can act as the deploy user, which the orchestrator can through its podman socket.
#
# Caller passes:
#   weft_release     a full 40-hex commit (staging follows main) or vX.Y.Z (a release)
#   _weft_role       workspace | door
#   _weft_state_dir  the role's deploy state directory on the VM
#   _weft_workspace_dir  (a workspace) the directory its containers mount
# with vars/weft.yml loaded. Sets:
#   _weft_release_json   the verified release.json
#   _weft_images         {image name: <registry>/<image>@sha256:...} from it
#   _weft_role_refs      this role's images (tasks/weft-verify-images.yml)
#
# Under --check nothing is fetched or pulled (each step runs a container); the caller reports
# what it would deploy and stops.

# Every deploy and every rollback reaches this first, so the rule lives here once: the directory
# that holds the deploy's record must not be one a container can write (agent-cloud#890 B2), so
# it may be neither the directory the role's containers mount nor anywhere inside it.
- name: "Refuse a state directory a container mounts"
  vars:
    _mounted: "{{ _weft_data_dir | regex_replace('/+$', '') }}"
    _state: "{{ _weft_state_dir | regex_replace('/+$', '') }}"
  ansible.builtin.assert:
    that:
      - _state is match('^/')
      - "'..' not in _state.split('/')"
      - not (_state ~ '/').startswith(_mounted ~ '/')
    fail_msg: >-
      The deploy's state directory {{ _state }} is {{ _mounted }} or inside it, and the
      {{ _weft_role }}'s containers mount that directory. The deploy record decides which image
      runs, so no container may write it: set weft_state_root apart from weft_root and
      weft_door_dir. Nothing was changed.

- name: "Require a commit or a release version"
  ansible.builtin.assert:
    that:
      - weft_release | default('') is match('^([0-9a-f]{40}|v[0-9]+\\.[0-9]+\\.[0-9]+)$')
    fail_msg: >-
      weft_release must be a full commit (what main published) or a release like v0.5.0, not
      '{{ weft_release | default('') }}'. A short commit or a branch name is a guess.

- name: "Registry login for weft's private images"
  ansible.builtin.include_tasks: registry-login.yml
  when: not (local_mode | default(false) | bool)

- name: "Read the deploy user's id (rootless podman keeps its registry login under it)"
  ansible.builtin.command: id -u
  register: _weft_uid
  changed_when: false
  check_mode: false

- name: "Locate the registry login the containers below borrow"
  ansible.builtin.set_fact:
    _weft_auth_file: "/run/user/{{ _weft_uid.stdout }}/containers/auth.json"
    _weft_release_repo: "{{ _weft_registry }}/weft-release"

- name: "Resolve release.json to a digest for {{ weft_release }}"
  ansible.builtin.command:
    argv:
      - "{{ container_engine | default('podman') }}"
      - run
      - --rm
      - --user=0
      - -v
      - "{{ _weft_auth_file }}:/auth/config.json:ro"
      - "{{ _weft_oras_image }}"
      - resolve
      - --registry-config
      - /auth/config.json
      - "{{ _weft_release_repo }}:{{ weft_release }}"
  register: _weft_resolved
  changed_when: false
  failed_when: >-
    _weft_resolved.rc != 0
    or not (_weft_resolved.stdout | trim is match('^sha256:[0-9a-f]{64}$'))
  when: not ansible_check_mode

- name: "Verify release.json was signed by weft's images.yml on main"
  ansible.builtin.include_tasks: verify-cosign.yml
  vars:
    _cosign_refs: ["{{ _weft_release_repo }}@{{ _weft_resolved.stdout | trim }}"]
    _cosign_identity: "{{ _weft_signer }}"
    _cosign_issuer: "{{ _weft_issuer }}"
    _cosign_auth_file: "{{ _weft_auth_file }}"
  when: not ansible_check_mode

# By the digest cosign just verified; oras checks what it fetched against that digest.
- name: "Fetch the verified manifest by its digest"
  ansible.builtin.command:
    argv:
      - "{{ container_engine | default('podman') }}"
      - run
      - --rm
      - --user=0
      - -v
      - "{{ _weft_auth_file }}:/auth/config.json:ro"
      - "{{ _weft_oras_image }}"
      - manifest
      - fetch
      - --registry-config
      - /auth/config.json
      - "{{ _weft_release_repo }}@{{ _weft_resolved.stdout | trim }}"
  register: _weft_manifest
  changed_when: false
  when: not ansible_check_mode

# The manifest is the one cosign verified, so its layers are trusted; the layer is chosen by
# the title oras gives a pushed file, and only by digest after that.
- name: "Take the layer titled release.json"
  ansible.builtin.set_fact:
    _weft_release_blob: >-
      {{ (_weft_manifest.stdout | from_json).layers | default([])
         | map('to_json')
         | select('search', '"org\.opencontainers\.image\.title": "release\.json"')
         | map('from_json') | map(attribute='digest') | list }}
  when: not ansible_check_mode

- name: "Require exactly one release.json layer, by digest"
  ansible.builtin.assert:
    that:
      - _weft_release_blob | length == 1
      - _weft_release_blob[0] is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The verified weft-release artifact for {{ weft_release }} does not hold exactly one layer
      titled release.json. Nothing has changed on this host.
  when: not ansible_check_mode

- name: "Fetch release.json by its digest, to stdout"
  ansible.builtin.command:
    argv:
      - "{{ container_engine | default('podman') }}"
      - run
      - --rm
      - --user=0
      - -v
      - "{{ _weft_auth_file }}:/auth/config.json:ro"
      - "{{ _weft_oras_image }}"
      - blob
      - fetch
      - --registry-config
      - /auth/config.json
      - --output
      - "-"
      - "{{ _weft_release_repo }}@{{ _weft_release_blob[0] }}"
  register: _weft_release_raw
  changed_when: false
  when: not ansible_check_mode

- name: "Parse release.json"
  ansible.builtin.set_fact:
    _weft_release_json: "{{ _weft_release_raw.stdout | from_json }}"
  when: not ansible_check_mode

- name: "Refuse a release.json that is not the one asked for"
  # The signature proves who wrote the file; these prove it is the file this deploy asked for.
  # A release names its version, and its commit is the one main published; a commit names
  # itself and no version.
  ansible.builtin.assert:
    that:
      - _weft_release_json.format == 1
      - _weft_release_json.commit is match('^[0-9a-f]{40}$')
      - (weft_release == _weft_release_json.commit) if (weft_release | length == 40) else (weft_release == _weft_release_json.version)
    fail_msg: >-
      release.json for {{ weft_release }} does not describe it: its format, commit or version is
      not what this deploy asked for. Nothing has changed on this host.
  when: not ansible_check_mode

# The signer, the role's images, the registry and every image's signature: the same check a
# rollback runs on the release it goes back to.
- name: "Verify the release's images for this role"
  ansible.builtin.include_tasks: weft-verify-images.yml
  vars:
    _wvi_release: "{{ _weft_release_json }}"
  when: not ansible_check_mode

- name: "Take the release's images"
  ansible.builtin.set_fact:
    _weft_images: "{{ _weft_release_json.images }}"
  when: not ansible_check_mode

- name: "Pull the verified images by digest"
  ansible.builtin.command:
    argv: ["{{ container_engine | default('podman') }}", pull, "{{ item }}"]
  loop: "{{ _weft_role_refs }}"
  changed_when: false
  when: not ansible_check_mode

- name: "Report the release"
  ansible.builtin.debug:
    msg: >-
      {{ ('check mode: would fetch, verify and pull weft ' ~ weft_release) if ansible_check_mode
         else ('weft ' ~ (_weft_release_json.version or _weft_release_json.commit[:12]) ~ ' (commit '
               ~ _weft_release_json.commit ~ '): release.json and '
               ~ (_weft_role_refs | length) ~ ' image(s) verified and pulled for the ' ~ _weft_role ~ '.') }}
