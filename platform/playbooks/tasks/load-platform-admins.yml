---
# load-platform-admins.yml — load the shared platform admin list for the agentgateway playbooks.
#
# vars/platform-admins.yml defines `_platform_admins` (the resolved list: an inventory
# `platform_admins` if set, else the default built from the per-user vars). The gateway derives one
# personal identity per entry (vars/secret-declarations/agentgateway.yml, `agw_identities`), but only
# when `agw_admin_identities_enabled` is true (default false): the list is non-empty by default, so a
# gateway deploy would otherwise mint a key for every admin before the operator rollout.
#
# Included by every play that reads `agw_identities`, so they cannot disagree about who exists:
# deploy-agentgateway.yml, manage-agentgateway-client-key.yml, rollback-inference-route.yml,
# run-agw-conformance.yml, check-secrets.yml (agentgateway only). With the gate off nothing is read. With it on and the file absent, the
# run says so and derives nothing from the file (`_platform_admins` stays undefined: an inventory
# `platform_admins`, which the file would have resolved to anyway, still applies, else the list is empty).

# With the gate on, `platform_admins` must be declared in the inventory for this host. The shared
# file's own default is built from per-user vars that exist only on the Authentik host, so on the
# gateway it would derive placeholder usernames; the declaration does not derive from it. The check
# reads the inventory's `platform_admins`, not `_platform_admins`, and runs before anything is read
# or written.
- name: "Require a declared platform admin list when admin identities are enabled"
  ansible.builtin.assert:
    that: platform_admins is defined
    fail_msg: >-
      agw_admin_identities_enabled is true but platform_admins is not declared for this host: declare
      the admin list in the inventory (the default in the shared admin file is built from per-user vars
      that exist only on the Authentik host and would derive placeholder usernames).
    quiet: true
  when: agw_admin_identities_enabled | default(false) | bool

- name: "Find the shared platform admin list"
  ansible.builtin.set_fact:
    _agw_admins_file: "{{ lookup('ansible.builtin.first_found', ['vars/platform-admins.yml'], paths=[playbook_dir], skip=True) | default('', true) }}"
  when: agw_admin_identities_enabled | default(false) | bool

- name: "Load the shared platform admin list"
  ansible.builtin.include_vars:
    file: "{{ _agw_admins_file }}"
  when:
    - agw_admin_identities_enabled | default(false) | bool
    - _agw_admins_file | length > 0

- name: "Report that the shared platform admin list is missing"
  ansible.builtin.debug:
    msg: >-
      agw_admin_identities_enabled is true but vars/platform-admins.yml was not found next to the
      playbooks: admin list file absent, no admin identities are derived from it (an inventory
      platform_admins, if set, still applies).
  when:
    - agw_admin_identities_enabled | default(false) | bool
    - _agw_admins_file | length == 0
