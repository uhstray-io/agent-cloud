---
# clean-service.yml — Destroy a service's containers, volumes, and clone
#
# WARNING: Destroys ALL data for the service (database, volumes, containers).
#
# Two modes (CLAUDE.md "one codebase, no forks"):
#   - PROD (default): per-VM, per-service clone at /home/<user>/agent-cloud —
#     teardown removes the clone too, with `become` (it may hold root-owned
#     files).
#   - LOCAL (`local_mode: true`): every local service deploys from ONE shared
#     dir (/var/lib/agent-cloud-deploy/agent-cloud), so removing it would break
#     sibling services — skip the clone removal (place-monorepo re-copies the
#     tree on the next deploy). No `become` (the semaphore user drives the VM
#     engine over the mounted socket); `compose down -v` targets the project by
#     the compose `name:` field, NOT --project-name service_name (which
#     mismatches services whose project name differs, e.g. caddy).
#
# Expected variables:
#   service_name, monorepo_deploy_path, _monorepo_dir
#   container_engine (optional, defaults to docker)
#   local_mode (optional, defaults to false)

- name: "Assert required variables for clean-service"
  ansible.builtin.assert:
    that:
      - service_name is defined
      - service_name | length > 0
      - monorepo_deploy_path is defined
      - monorepo_deploy_path | length > 0
      - _monorepo_dir is defined
      - _monorepo_dir | length > 0
    fail_msg: "clean-service.yml requires service_name, monorepo_deploy_path, and _monorepo_dir."

# ── Pin and check what the teardown deletes and runs ────────────────────────
# `_monorepo_dir` comes from `local_monorepo_dir`, a public variable: an extra var sets it,
# and refuse-internal-extra-vars.yml cannot tell that from the inventory declaration (it
# only sees `_`-prefixed names). The prod branch deletes that directory with `become`, and
# both branches (and the verify step) interpolate it, `monorepo_deploy_path`, `service_name`
# and `container_engine` into shell scripts, so `-e local_monorepo_dir=<any path>` (with
# `-e ansible_connection=local` it runs on the controller) chose what was deleted, and a
# shell word in any of them chose what ran. The prod clone is not a free choice: it is the
# per-VM checkout every prod deploy places, /home/<ansible_user>/agent-cloud, so anything
# else is refused before the first task that uses it. The convenience symlink removed below
# is likewise /home/<ansible_user>/<service_name>, built from those two, not from the public
# `local_home_dir`. Names must be plain (no `/`, no leading `.`, so no `..`). Local mode has
# no fixed tree (the genesis dir is the operator's), so there it must only be a shell-safe
# absolute path.
#
# An extra var is a template rendered afresh at every read (docs/MISTAKES.md 1.15), so a
# check that reads a name and tasks that read it again can see two values. The facts below
# render each name ONCE; the checks, every `when` below (`local_mode` included: a forgery
# that reads false for the deletion and true for the check would skip one and run the other),
# the path removals and every shell script read the facts, never the public names (the
# placeholders test_service_o11y.bats substitutes are the fact names). Underscore names
# cannot be set from outside the run (refuse-internal-extra-vars.yml).
- name: "Pin the teardown's identity, connection and inputs, each read once"
  ansible.builtin.set_fact:
    # The connection the run would use for this host when nothing in its variables names one: the
    # default, or the command line's -c. Only read for a host that sets no ansible_connection.
    _clean_conn: "{{ ansible_connection | default('ssh') }}"
    # Whether any host of the play that is not local-dev SETS ansible_connection at all: the key's
    # presence in hostvars, which no template can change between the check and the connection.
    _clean_conn_set: "{{ ansible_play_hosts_all | reject('match', '^[A-Za-z0-9._-]+-local\\Z') | map('extract', hostvars) | map('list') | select('contains', 'ansible_connection') | list | length > 0 }}"
    _clean_all_local: "{{ ansible_play_hosts_all | reject('match', '^[A-Za-z0-9._-]+-local\\Z') | list | length == 0 }}"
    _clean_mode_set: "{{ local_mode | default('unset') }}"
    _clean_user: "{{ ansible_user | default('deploy') }}"
    _clean_service: "{{ service_name }}"
    _clean_dir: "{{ _monorepo_dir }}"
    _clean_path: "{{ monorepo_deploy_path }}"
    _clean_engine_set: "{{ container_engine | default('') }}"

- name: "Derive the mode and the engines from the pinned values"
  ansible.builtin.set_fact:
    # The mode is the hosts' identity, never the public `local_mode`: see the checks below.
    _clean_local_mode: "{{ _clean_all_local }}"
    _clean_engine: "{{ _clean_engine_set if _clean_engine_set | length > 0 else 'docker' }}"
    _clean_local_engine: "{{ _clean_engine_set if _clean_engine_set | length > 0 else 'podman' }}"

# WHERE and WHICH are decided by the inventory, never by an extra var. Every public variable
# can be set by `-e`; so can the magic names inventory_hostname, group_names, inventory_file
# and inventory_dir (verified on ansible-core 2.21 with a scratch play). What it cannot set
# are `groups`, `ansible_play_hosts` and `ansible_play_hosts_all` (also verified), so the
# checks key on those:
#
#  - a LOCAL-DEV host is one named `<service>-local`, which every local-dev inventory does
#    (platform/inventory/local-dev.yml.example and the inventory bootstrap-local-dev.yml hands
#    Semaphore) and no production host does. The teardown is local-mode only for such a host:
#    `local_mode` is read back, and a value that disagrees is refused, but never chooses the
#    branch (forged `true` on a prod host skipped the prod checks and ran `compose down -v`
#    in a launcher-chosen tree);
#  - any other host must reach the machine it names, over the default ssh, and must not SET
#    ansible_connection at all. A value check cannot hold: an extra var is a template rendered
#    afresh at every read, so one can read `ssh` where this checks and `local` where Ansible
#    connects (docs/MISTAKES.md 1.15), and an exact-match allowlist on a normalised name passes
#    `<other namespace>.ssh`, a different plugin. Whether the KEY is present in hostvars is not
#    something a template can change, the principle refuse-internal-extra-vars.yml uses for `_`
#    names. Production inventories set no ansible_connection (site-config origin/main
#    production.yml, checked) and a local-dev host keeps its `local`. What remains readable is the
#    command line's -c, which is a plain string, not a template: it must be ssh. The limit: a
#    production host cannot declare a connection of its own (a jump or proxy setup would use
#    ansible_ssh_common_args, which is not refused) without extending this check in code;
#  - the host must belong to the service's own group, `<service_name>_svc` (hyphens as
#    underscores, as the inventories name them), and the deploy path must be that service's own
#    (`platform/services/<service>/deployment` or `agents/<service>/deployment`), so
#    `-e service_name=` or `-e monorepo_deploy_path=` cannot aim the teardown at another
#    service's project or at a directory named like one.
- name: "Refuse a host that is neither a local-dev host nor on the default ssh connection"
  ansible.builtin.assert:
    that: _clean_all_local or (not _clean_conn_set and _clean_conn == 'ssh')
    fail_msg: >-
      Refusing: {{ inventory_hostname }} is not a local-dev host (named <service>-local by the
      local inventories) but its connection is not the default ssh: ansible_connection is
      {{ 'set on a host of this play (any value, any spelling)' if _clean_conn_set else 'unset there, and the command line gives ' ~ _clean_conn }}.
      A teardown over any other connection would run compose down -v, the container removal and
      the clone removal on the controller. Nothing was removed.
    quiet: true

- name: "Refuse a local_mode that disagrees with the hosts' identity"
  ansible.builtin.assert:
    that: _clean_mode_set == 'unset' or (_clean_mode_set | bool) == _clean_local_mode
    fail_msg: >-
      Refusing: the teardown for {{ _clean_service }} has local_mode {{ _clean_mode_set }}, but
      the hosts of this play are {{ 'all' if _clean_local_mode else 'not all' }} local-dev hosts
      (named <service>-local). The mode follows the hosts, not the variable. Nothing was removed.
    quiet: true

- name: "Refuse a teardown whose service, deploy path or engine is not a plain name"
  ansible.builtin.assert:
    that:
      - _clean_service is match('^[A-Za-z0-9][A-Za-z0-9._-]*\\Z')
      - _clean_path is match('^[A-Za-z0-9][A-Za-z0-9._/-]*\\Z')
      - "'..' not in _clean_path"
      - _clean_engine in ['docker', 'podman']
      - _clean_local_engine in ['docker', 'podman']
    fail_msg: >-
      Refusing: the teardown for {{ _clean_service }} needs a plain service name and deploy
      path (letters, digits, `.`, `_`, `-`, and `/` in the path; no `..`) and the engine docker
      or podman. Nothing was removed.
    quiet: true

- name: "Refuse a teardown aimed at a service the hosts do not run"
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | difference(groups.get((_clean_service | replace('-', '_')) ~ '_svc', [])) | length == 0
      - _clean_path in ['platform/services/' ~ _clean_service ~ '/deployment', 'agents/' ~ _clean_service ~ '/deployment']
    fail_msg: >-
      Refusing: the teardown for {{ _clean_service }}: the hosts of this play are not all in
      {{ _clean_service | replace('-', '_') }}_svc, or {{ _clean_path }} is not {{ _clean_service }}'s own
      deployment directory
      (platform/services/{{ _clean_service }}/deployment or agents/{{ _clean_service }}/deployment).
      service_name and monorepo_deploy_path are declared by the inventory. Nothing was removed.
    quiet: true

- name: "Refuse a prod teardown whose clone the inventory did not declare"
  ansible.builtin.assert:
    that:
      - _clean_user is match('^[A-Za-z0-9_][A-Za-z0-9._-]*\\Z')
      - _clean_dir == '/home/' ~ _clean_user ~ '/agent-cloud'
    fail_msg: >-
      Refusing: the teardown for {{ _clean_service }} removes /home/{{ _clean_user }}/agent-cloud,
      not {{ _clean_dir }}. local_monorepo_dir is for local mode (inventory local_mode: true);
      a prod host that checks the repo out elsewhere needs this guard extended in code. Nothing
      was removed.
    quiet: true
  when: not _clean_local_mode

- name: "Refuse a local teardown whose tree is not a shell-safe absolute path"
  ansible.builtin.assert:
    that: _clean_dir is match('^/[A-Za-z0-9._/ +@-]+\\Z')
    fail_msg: >-
      Refusing: the local teardown for {{ _clean_service }} runs its compose commands from
      {{ _clean_dir }}, which must be an absolute path of letters, digits, spaces and
      `. _ / + @ -` only. Nothing was removed.
    quiet: true
  when: _clean_local_mode

# ── PROD teardown (per-VM clone) ────────────────────────────────────────────
- name: "Stop and remove containers + volumes (prod) for {{ service_name }}"
  ansible.builtin.shell: |
    set -o pipefail
    DEPLOY_DIR="{{ _clean_dir }}/{{ _clean_path }}"
    ENGINE="{{ _clean_engine }}"
    # The SUPERSET of compose files, not just the base: a service/volume that
    # exists only in an overlay (compose.local.yml, compose.search.yml) is
    # invisible to a base-only `down -v` and survives a "destroy everything"
    # rebuild carrying stale state. Extra -f files are harmless on teardown.
    COMPOSE_ARGS=""
    for f in docker-compose.yml compose.yml; do
      [ -f "${DEPLOY_DIR}/${f}" ] && COMPOSE_ARGS="-f ${f}" && break
    done
    if [ -n "$COMPOSE_ARGS" ]; then
      for f in "${DEPLOY_DIR}"/compose.*.yml; do
        # compose.local.yml is EXCLUDED here: it is part of the repo files on a
        # prod clone too, and it references local-only externals (the local-dev
        # network) that do not exist on a prod host — a model compose may refuse
        # wholesale, turning `down -v` into a silent no-op under the `|| true`.
        case "$(basename "$f")" in compose.local.yml) continue ;; esac
        [ -f "$f" ] && COMPOSE_ARGS="$COMPOSE_ARGS -f $(basename "$f")"
      done
      cd "$DEPLOY_DIR"
      $ENGINE compose --project-name {{ _clean_service }} $COMPOSE_ARGS down -v || exit $?
    fi
    # Remove any containers with the service name prefix
    $ENGINE ps -a --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | grep "^{{ _clean_service | regex_escape }}" | xargs -r $ENGINE rm -f 2>/dev/null || true
  args:
    executable: /bin/bash   # `set -o pipefail` needs bash (Ubuntu /bin/sh is dash)
  become: true
  register: _clean
  changed_when: true
  when:
    - not ansible_check_mode
    - not _clean_local_mode

# ── LOCAL teardown (shared deploy dir; keep the tree) ───────────────────────
- name: "Stop and remove containers + volumes (local) for {{ service_name }}"
  ansible.builtin.shell: |
    set -o pipefail
    DEPLOY_DIR="{{ _clean_dir }}/{{ _clean_path }}"
    ENGINE="{{ _clean_local_engine }}"
    # Superset of compose files — see the prod branch above for why.
    COMPOSE_ARGS=""
    for f in docker-compose.yml compose.yml; do
      [ -f "${DEPLOY_DIR}/${f}" ] && COMPOSE_ARGS="-f ${f}" && break
    done
    if [ -n "$COMPOSE_ARGS" ]; then
      for f in "${DEPLOY_DIR}"/compose.*.yml; do
        # A production overlay can require inventory-only values that local
        # .env never has. It is not part of the local Compose project.
        case "$(basename "$f")" in compose.prod.yml) continue ;; esac
        [ -f "$f" ] && COMPOSE_ARGS="$COMPOSE_ARGS -f $(basename "$f")"
      done
      cd "$DEPLOY_DIR"
      # No --project-name: let the compose `name:` field set the project (matches
      # how deploy.sh brought it up) so the right volumes are removed.
      $ENGINE compose $COMPOSE_ARGS down -v || exit $?
    fi
    $ENGINE ps -a --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | grep "^{{ _clean_service | regex_escape }}" | xargs -r $ENGINE rm -f 2>/dev/null || true
  args:
    executable: /bin/bash   # `set -o pipefail` needs bash (Ubuntu /bin/sh is dash)
  register: _clean_local
  changed_when: true
  when:
    - not ansible_check_mode
    - _clean_local_mode

# ── Clone removal — PROD only (local shares the tree) ───────────────────────
- name: "Remove agent-cloud clone (prod; may contain root-owned files)"
  ansible.builtin.file:
    path: "{{ _clean_dir }}"
    state: absent
  become: true
  when: not _clean_local_mode

# `file state=absent` removes a directory and everything under it, so it is only ever pointed at
# something proven to be a link: the path is /home/<user>/<service>, which a real directory of that
# name (a home folder called like the service) would otherwise lose.
- name: "Look for the convenience symlink (prod)"
  ansible.builtin.stat:
    path: "/home/{{ _clean_user }}/{{ _clean_service }}"
    follow: false
  register: _clean_link
  when: not _clean_local_mode

- name: "Remove convenience symlink (prod)"
  ansible.builtin.file:
    path: "/home/{{ _clean_user }}/{{ _clean_service }}"
    state: absent
  when:
    - not _clean_local_mode
    - _clean_link.stat.islnk | default(false)

# ── Verify (both modes) ─────────────────────────────────────────────────────
- name: "Verify clean"
  ansible.builtin.shell: |
    set -o pipefail
    {{ _clean_engine }} volume ls 2>/dev/null | grep {{ _clean_service }} || echo "No {{ _clean_service }} volumes"
    {{ _clean_engine }} ps -a 2>/dev/null | grep {{ _clean_service }} || echo "No {{ _clean_service }} containers"
  args:
    executable: /bin/bash   # `set -o pipefail` needs bash (Ubuntu /bin/sh is dash)
  register: _verify
  changed_when: false
  check_mode: false

- name: "Clean state"
  ansible.builtin.debug:
    var: _verify.stdout_lines
