---
# clean-service.yml — Destroy a service's containers, volumes, and clone
#
# WARNING: Destroys ALL data for the service (database, volumes, containers).
#
# Two modes (CLAUDE.md "one codebase, no forks"):
#   - PROD (default): per-VM, per-service clone at /home/<user>/agent-cloud —
#     teardown removes the clone too, with `become` (it may hold root-owned
#     files).
#   - LOCAL (`local_mode: true`): every local service deploys from ONE shared
#     dir (/var/lib/agent-cloud-deploy/agent-cloud), so removing it would break
#     sibling services — skip the clone removal (place-monorepo re-copies the
#     tree on the next deploy). No `become` (the semaphore user drives the VM
#     engine over the mounted socket); `compose down -v` targets the project by
#     the compose `name:` field, NOT --project-name service_name (which
#     mismatches services whose project name differs, e.g. caddy).
#
# Expected variables:
#   service_name, monorepo_deploy_path, _monorepo_dir
#   container_engine (optional, defaults to docker)
#   local_mode (optional, defaults to false)

- name: "Assert required variables for clean-service"
  ansible.builtin.assert:
    that:
      - service_name is defined
      - service_name | length > 0
      - monorepo_deploy_path is defined
      - monorepo_deploy_path | length > 0
      - _monorepo_dir is defined
      - _monorepo_dir | length > 0
    fail_msg: "clean-service.yml requires service_name, monorepo_deploy_path, and _monorepo_dir."

# ── Pin and check what the prod teardown deletes and runs (prod) ────────────
# `_monorepo_dir` comes from `local_monorepo_dir`, a public variable: an extra var sets it,
# and refuse-internal-extra-vars.yml cannot tell that from the inventory declaration (it
# only sees `_`-prefixed names). The prod branch deletes that directory with `become` and
# interpolates it, `monorepo_deploy_path`, `service_name` and `container_engine` into a root
# shell script, so `-e local_monorepo_dir=<any path>` (with `-e ansible_connection=local` it
# runs on the controller) chose what was deleted, and a shell word in any of the four chose
# what ran. The prod clone is not a free choice: it is the per-VM checkout every prod deploy
# places, /home/<ansible_user>/agent-cloud, so anything else is refused before the first
# task that uses it. The convenience symlink removed below is likewise
# /home/<ansible_user>/<service_name>, built from those two, not from the public
# `local_home_dir`. Both must be plain names (no `/`, no leading `.`, so no `..`).
#
# An extra var is a template rendered afresh at every read (docs/MISTAKES.md 1.15), so a
# check that reads a name and tasks that read it again can see two values. The facts below
# render each name ONCE; the check, the `when` of every task below (`local_mode` included: a
# forgery that reads false for the deletion and true for the check would skip one and run the
# other) and the two path removals read the facts. Underscore names cannot be set from
# outside the run (refuse-internal-extra-vars.yml). The prod
# shell script still renders the public names itself, because test_service_o11y.bats
# substitutes those exact placeholders into it; a stateful template could therefore show the
# check one value and that script another, so reading the facts there is the follow-up once
# that test is updated. Local mode keeps the shared genesis tree, deletes nothing, and is
# not checked here.
- name: "Pin the teardown's mode and the prod inputs, each read once"
  ansible.builtin.set_fact:
    _clean_local_mode: "{{ local_mode | default(false) | bool }}"
    _clean_connection: "{{ ansible_connection | default('ssh') }}"
    _clean_prod_user: "{{ ansible_user | default('deploy') }}"
    _clean_prod_service: "{{ service_name }}"
    _clean_prod_dir: "{{ _monorepo_dir }}"
    _clean_prod_path: "{{ monorepo_deploy_path }}"
    _clean_prod_engine: "{{ container_engine | default('docker') }}"

# A controller-local connection runs every teardown task below ON THE CONTROLLER: the
# compose `down -v`, the `rm -f` of every container whose name starts with the service name,
# and the clone removal. `ansible_connection` is a public variable, so `-e
# ansible_connection=local` moves a prod host's destroy there, and no variable an extra var can
# set says the host is a local-dev one (local_mode, local_monorepo_dir are as forgeable, and so
# are the magic names inventory_hostname, group_names and inventory_file: verified on
# ansible-core 2.21 with a scratch play). What it cannot set is `ansible_play_hosts_all`, the
# real names of the hosts this play runs on (also verified). Every local-dev inventory names
# its hosts `<service>-local` (platform/inventory/local-dev.yml.example, and the inventory
# bootstrap-local-dev.yml hands Semaphore); no production host carries that suffix. So a local
# connection is accepted only when every host of the play is so named.
- name: "Refuse a controller-local teardown of a host that is not a local-dev host"
  ansible.builtin.assert:
    that: >-
      _clean_connection != 'local' or
      (ansible_play_hosts_all | reject('match', '^[A-Za-z0-9._-]+-local\\Z') | list | length == 0)
    fail_msg: >-
      Refusing: {{ inventory_hostname }} resolves to a controller-local connection, which would
      run this teardown (compose down -v, container removal, clone removal) on the controller,
      and only a play whose hosts are all local-dev hosts (named <service>-local by the local
      inventories) may. Nothing was removed.
    quiet: true

- name: "Refuse a prod teardown whose inputs the inventory did not declare"
  ansible.builtin.assert:
    that:
      - _clean_prod_user is match('^[A-Za-z0-9_][A-Za-z0-9._-]*\\Z')
      - _clean_prod_service is match('^[A-Za-z0-9][A-Za-z0-9._-]*\\Z')
      - _clean_prod_path is match('^[A-Za-z0-9][A-Za-z0-9._/-]*\\Z')
      - "'..' not in _clean_prod_path"
      - _clean_prod_engine in ['docker', 'podman']
      - _clean_prod_dir == '/home/' ~ _clean_prod_user ~ '/agent-cloud'
    fail_msg: >-
      Refusing: the prod teardown for {{ _clean_prod_service }} removes
      /home/{{ _clean_prod_user }}/agent-cloud, not {{ _clean_prod_dir }}; names must be plain
      and the engine docker or podman. local_monorepo_dir is for local mode (inventory
      local_mode: true); a prod host that checks the repo out elsewhere needs this guard
      extended in code. Nothing was removed.
    quiet: true
  when: not _clean_local_mode

# ── PROD teardown (per-VM clone) ────────────────────────────────────────────
- name: "Stop and remove containers + volumes (prod) for {{ service_name }}"
  ansible.builtin.shell: |
    set -o pipefail
    DEPLOY_DIR="{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    ENGINE="{{ container_engine | default('docker') }}"
    # The SUPERSET of compose files, not just the base: a service/volume that
    # exists only in an overlay (compose.local.yml, compose.search.yml) is
    # invisible to a base-only `down -v` and survives a "destroy everything"
    # rebuild carrying stale state. Extra -f files are harmless on teardown.
    COMPOSE_ARGS=""
    for f in docker-compose.yml compose.yml; do
      [ -f "${DEPLOY_DIR}/${f}" ] && COMPOSE_ARGS="-f ${f}" && break
    done
    if [ -n "$COMPOSE_ARGS" ]; then
      for f in "${DEPLOY_DIR}"/compose.*.yml; do
        # compose.local.yml is EXCLUDED here: it is part of the repo files on a
        # prod clone too, and it references local-only externals (the local-dev
        # network) that do not exist on a prod host — a model compose may refuse
        # wholesale, turning `down -v` into a silent no-op under the `|| true`.
        case "$(basename "$f")" in compose.local.yml) continue ;; esac
        [ -f "$f" ] && COMPOSE_ARGS="$COMPOSE_ARGS -f $(basename "$f")"
      done
      cd "$DEPLOY_DIR"
      $ENGINE compose --project-name {{ service_name }} $COMPOSE_ARGS down -v || exit $?
    fi
    # Remove any containers with the service name prefix
    $ENGINE ps -a --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | grep "^{{ service_name }}" | xargs -r $ENGINE rm -f 2>/dev/null || true
  args:
    executable: /bin/bash   # `set -o pipefail` needs bash (Ubuntu /bin/sh is dash)
  become: true
  register: _clean
  changed_when: true
  when:
    - not ansible_check_mode
    - not _clean_local_mode

# ── LOCAL teardown (shared deploy dir; keep the tree) ───────────────────────
- name: "Stop and remove containers + volumes (local) for {{ service_name }}"
  ansible.builtin.shell: |
    set -o pipefail
    DEPLOY_DIR="{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    ENGINE="{{ container_engine | default('podman') }}"
    # Superset of compose files — see the prod branch above for why.
    COMPOSE_ARGS=""
    for f in docker-compose.yml compose.yml; do
      [ -f "${DEPLOY_DIR}/${f}" ] && COMPOSE_ARGS="-f ${f}" && break
    done
    if [ -n "$COMPOSE_ARGS" ]; then
      for f in "${DEPLOY_DIR}"/compose.*.yml; do
        # A production overlay can require inventory-only values that local
        # .env never has. It is not part of the local Compose project.
        case "$(basename "$f")" in compose.prod.yml) continue ;; esac
        [ -f "$f" ] && COMPOSE_ARGS="$COMPOSE_ARGS -f $(basename "$f")"
      done
      cd "$DEPLOY_DIR"
      # No --project-name: let the compose `name:` field set the project (matches
      # how deploy.sh brought it up) so the right volumes are removed.
      $ENGINE compose $COMPOSE_ARGS down -v || exit $?
    fi
    $ENGINE ps -a --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | grep "^{{ service_name }}" | xargs -r $ENGINE rm -f 2>/dev/null || true
  args:
    executable: /bin/bash   # `set -o pipefail` needs bash (Ubuntu /bin/sh is dash)
  register: _clean_local
  changed_when: true
  when:
    - not ansible_check_mode
    - _clean_local_mode

# ── Clone removal — PROD only (local shares the tree) ───────────────────────
- name: "Remove agent-cloud clone (prod; may contain root-owned files)"
  ansible.builtin.file:
    path: "{{ _clean_prod_dir }}"
    state: absent
  become: true
  when: not _clean_local_mode

- name: "Remove convenience symlink (prod)"
  ansible.builtin.file:
    path: "/home/{{ _clean_prod_user }}/{{ _clean_prod_service }}"
    state: absent
  when: not _clean_local_mode

# ── Verify (both modes) ─────────────────────────────────────────────────────
- name: "Verify clean"
  ansible.builtin.shell: |
    set -o pipefail
    {{ container_engine | default('docker') }} volume ls 2>/dev/null | grep {{ service_name }} || echo "No {{ service_name }} volumes"
    {{ container_engine | default('docker') }} ps -a 2>/dev/null | grep {{ service_name }} || echo "No {{ service_name }} containers"
  args:
    executable: /bin/bash   # `set -o pipefail` needs bash (Ubuntu /bin/sh is dash)
  register: _verify
  changed_when: false
  check_mode: false

- name: "Clean state"
  ansible.builtin.debug:
    var: _verify.stdout_lines
