---
# weft-github-deployment.yml — record a healthy staging deploy on weft's repository as a GitHub
# deployment, from inside the rack. weft's release.yml refuses a commit whose `staging` deployment
# is not `success`, so this record is what lets a commit that ran healthily on staging be
# released. Written only after both staging hosts passed their watch: a failed run records nothing.
#
# Semaphore writes to GitHub here and GitHub never reaches Semaphore (no GitHub job holds a deploy
# credential). The token is _weft_github_token, minted for this run by weft-github-app-token.yml.
#
# Caller passes _wgd_sha (a full commit) and _wgd_description (<= 140 chars). Every request
# carries the token, so each is no_log; the report prints the id.

- name: "Create the GitHub deployment"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ _weft_repo }}/deployments"
    method: POST
    headers:
      Authorization: "Bearer {{ _weft_github_token }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    body_format: json
    body:
      ref: "{{ _wgd_sha }}"
      environment: staging
      # No merge into the default branch and no required statuses: this records a deploy of an
      # exact commit that already passed its checks; it asks GitHub to do nothing.
      auto_merge: false
      required_contexts: []
      transient_environment: false
      production_environment: false
      description: "Semaphore: staging deploy of {{ _wgd_sha[:12] }}"
    status_code: [201]
    follow_redirects: none
  register: _wgd_created
  no_log: true
  when: not ansible_check_mode

- name: "Mark it a success"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ _weft_repo }}/deployments/{{ _wgd_created.json.id }}/statuses"
    method: POST
    headers:
      Authorization: "Bearer {{ _weft_github_token }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    body_format: json
    body:
      state: success
      description: "{{ _wgd_description | default('') | truncate(140, true, '…', 0) }}"
    status_code: [201]
    follow_redirects: none
  no_log: true
  when: not ansible_check_mode

- name: "Report the GitHub deployment"
  ansible.builtin.debug:
    msg: "GitHub deployment {{ _wgd_created.json.id }} records staging healthy on {{ _wgd_sha }}."
