---
# manage-secrets.yml — OpenBao-driven secret lifecycle
#
# 1. Fetches existing secrets from OpenBao (reuses if present)
# 2. Generates missing secrets (random/django, per _secret_definitions)
# 3. Stores all secrets back to OpenBao (source of truth)
# 4. Templates env files on VM from secrets (compose-ready)
#
# Expected variables:
#   service_name, monorepo_deploy_path, _monorepo_dir
#   _bao_url, _bao_role_id, _bao_secret_id
#   _secret_definitions  — [{name, type, length}]
#       type: random    generate a random alphanumeric of `length` when absent
#             django    generate a Django-style SECRET_KEY when absent
#             existing   NEVER generate — reuse the stored value, or render
#                        empty when the key is absent. For values a SEPARATE,
#                        deliberate step puts in OpenBao (an operator-owned API
#                        credential seeded by a seed-*-secrets playbook), which
#                        this task must surface to the templates but must never
#                        invent. Declaring them is required: `secrets` is built
#                        from _secret_definitions, so a key present in OpenBao
#                        but undeclared here is silently dropped from the
#                        rendered template.
#   _env_templates       — [{src, dest}] Jinja2 templates to render.
#                        `dest` is joined onto the deploy dir and parent
#                        directories are NOT created — a dest in a subdirectory
#                        needs that directory to exist first.
#   _service_url         — stored alongside secrets (optional)

- name: "Authenticate to OpenBao"
  ansible.builtin.uri:
    url: "{{ _bao_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ _bao_role_id }}"
      secret_id: "{{ _bao_secret_id }}"
    status_code: [200]
  register: _bao_auth
  delegate_to: localhost
  run_once: true
  no_log: true

- name: "Fetch existing secrets from OpenBao"
  ansible.builtin.uri:
    url: "{{ _bao_url }}/v1/secret/data/services/{{ service_name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
    status_code: [200, 404]
  register: _bao_existing
  delegate_to: localhost
  run_once: true
  no_log: true

- name: "Set existing secrets"
  ansible.builtin.set_fact:
    _existing: "{{ _bao_existing.json.data.data | default({}) }}"
  no_log: true

- name: "Resolve secrets (reuse existing, generate missing)"
  ansible.builtin.set_fact:
    _resolved: >-
      {{ _resolved | default({}) | combine({
        item.name: (
          _existing[item.name]
          if (_existing[item.name] | default('') | length > 0)
          else (
            lookup('password', '/dev/null length=' ~ (item.length | default(32)) ~ ' chars=ascii_letters,digits')
            if item.type == 'random'
            else (
              lookup('password', '/dev/null length=' ~ (item.length | default(50)) ~ ' chars=ascii_letters,digits,.-_')
              if item.type == 'django'
              else ''
            )
          )
        )
      }) }}
  loop: "{{ _secret_definitions }}"
  loop_control:
    label: "{{ item.name }}: {{ 'reuse' if (_existing[item.name] | default('') | length > 0) else item.type }}"
  no_log: true

- name: "Add service URL"
  ansible.builtin.set_fact:
    _resolved: "{{ _resolved | combine({'url': _service_url | default(service_url | default(''))}) }}"
  when: _service_url is defined or service_url is defined

# Shared secrets: read specific keys from ANOTHER service's path (read-only,
# never stored back here). For cross-service secrets like an OIDC client secret
# that the IdP (authentik) owns and a client (grafana/netbox) must match.
#   _shared_reads: [{from_service: authentik, read_keys: [grafana_oidc_client_secret]}]
# The requested keys are merged flat into `secrets` for the env templates.
# (Field is `read_keys`, NOT `keys` — `item.keys` in Jinja returns the dict's
# built-in .keys method, not a field named "keys".)
- name: "Fetch shared secrets from other services (read-only)"
  ansible.builtin.uri:
    url: "{{ _bao_url }}/v1/secret/data/services/{{ item.from_service }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
    status_code: [200, 404]
  loop: "{{ _shared_reads | default([]) }}"
  loop_control:
    label: "{{ item.from_service }}: {{ item.read_keys | join(',') }}"
  register: _shared_results
  delegate_to: localhost
  run_once: true
  no_log: true
  when: _shared_reads | default([]) | length > 0

- name: "Validate requested shared secrets exist and do not shadow local secrets"
  # A typo in `_shared_reads` (or a missing source key) would otherwise extract to
  # an empty value and silently break OIDC/env wiring; a shared key colliding with
  # a locally-managed `_resolved` key would silently shadow the service-owned one.
  ansible.builtin.assert:
    that:
      - item.1.status == 200
      - (item.0.read_keys | difference((item.1.json.data.data | default({})).keys() | list)) | length == 0
      - (item.0.read_keys | intersect((_resolved | default({})).keys() | list)) | length == 0
    fail_msg: >-
      Shared secret read from {{ item.0.from_service }} is missing requested keys
      or shadows a local {{ service_name }} secret.
  loop: "{{ _shared_reads | default([]) | zip(_shared_results.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.from_service }}"
  no_log: true
  when: _shared_reads | default([]) | length > 0

- name: "Validate shared keys are unique across _shared_reads"
  # Two source services requesting the same key name would silently clobber each
  # other in the combine() below (last writer wins); fail fast on the collision.
  ansible.builtin.assert:
    that:
      - (_shared_reads | map(attribute='read_keys') | flatten | list | length)
        == (_shared_reads | map(attribute='read_keys') | flatten | unique | list | length)
    fail_msg: "Duplicate key names across _shared_reads would silently override merged shared secrets."
  when: _shared_reads | default([]) | length > 0

- name: "Merge requested shared keys into resolved (not stored back)"
  ansible.builtin.set_fact:
    _shared: >-
      {{ _shared | default({}) | combine(
        dict(item.0.read_keys | zip(item.0.read_keys | map('extract', (item.1.json.data.data | default({}))) | list))
      ) }}
  loop: "{{ _shared_reads | default([]) | zip(_shared_results.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.from_service }}"
  no_log: true
  when: _shared_reads | default([]) | length > 0

- name: "Store all secrets in OpenBao (merge — siblings preserved)"
  # Through the shared merge-patch task, NOT a whole-document POST. The POST
  # this replaced wrote `_resolved` as the full document, silently DELETING
  # every key at the path that _secret_definitions does not declare — measured:
  # a deploy re-run erased the service's post-deploy `n8n_api_key` from the
  # store (docs/MISTAKES.md 10.11). Post-deploy keys (captured API keys,
  # operator-seeded credentials) legitimately live beside the deploy-managed
  # ones; the deploy owns its declared keys, never the whole path.
  # Sibling task in this directory; resolves relative to this file.
  ansible.builtin.include_tasks: bao-merge-keys.yml
  vars:
    _bm_url: "{{ _bao_url }}"
    _bm_token: "{{ _bao_auth.json.auth.client_token }}"
    _bm_path: "services/{{ service_name }}"
    _bm_data: "{{ _resolved }}"
  run_once: true

- name: "Template env files on VM"
  ansible.builtin.template:
    # Defaults to platform/services/<name>/deployment/templates (unchanged for
    # existing services). Agent services under agents/ pass _templates_src.
    src: "{{ _templates_src | default(playbook_dir ~ '/../services/' ~ service_name ~ '/deployment/templates') }}/{{ item.src }}"
    dest: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ _env_templates | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  vars:
    secrets: "{{ _resolved | combine(_shared | default({})) }}"

- name: "Report"
  ansible.builtin.debug:
    msg: >-
      {{ service_name }}: {{ _resolved | dict2items | selectattr('value') | list | length }} secrets managed,
      {{ _env_templates | default([]) | length }} env files templated
