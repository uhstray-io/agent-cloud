- name: Freeze the strict observation query end
  ansible.builtin.set_fact:
    _coverage_query_end: "{{ now(utc=true).timestamp() | int }}"

- name: Derive the strict observation query start
  ansible.builtin.set_fact:
    _coverage_query_start: "{{ (_coverage_query_end | int) - observation_window_seconds }}"

- name: Query the exact Loki target selector
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - wget
      - -q
      - -O
      - "-"
      - "http://loki:3100/loki/api/v1/query_range?query={{ signal_selector | urlencode }}&start={{ (_coverage_query_start | int) * 1000000000 }}&end={{ (_coverage_query_end | int) * 1000000000 }}&direction=backward&limit=1"
  register: _exact_logs
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  when: expected_signal == 'logs'

- name: Query the exact Prometheus target selector
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - wget
      - -q
      - -O
      - "-"
      - "http://prometheus:9090/api/v1/query?query={{ (signal_selector ~ '[' ~ observation_window_seconds ~ 's]') | urlencode }}&time={{ _coverage_query_end }}"
  register: _exact_prometheus
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  when: expected_signal in ['metrics', 'health']

- name: Query the exact Tempo target selector
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - wget
      - -q
      - -O
      - "-"
      - "http://tempo:3200/api/search?q={{ signal_selector | urlencode }}&start={{ _coverage_query_start }}&end={{ _coverage_query_end }}&limit=1&sps=1"
  register: _exact_traces
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  when: expected_signal == 'traces'

- name: Query the exact Pyroscope profile selector
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - wget
      - -q
      - -O
      - "-"
      - -T
      - "10"
      - "--header=Content-Type: application/json"
      - "--post-data={{ {
          'profileTypeID': _coverage_target.signals.profiles.profile_type_id,
          'labelSelector': signal_selector,
          'start': (_coverage_query_start | int) * 1000,
          'end': (_coverage_query_end | int) * 1000,
          'groupBy': ['target_id'],
          'limit': 1,
          'step': 60
        } | to_json }}"
      - "http://pyroscope:4040/querier.v1.QuerierService/SelectSeries"
  register: _exact_profiles
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  when: expected_signal == 'profiles'

- name: Protect the selected backend response for common validation
  ansible.builtin.set_fact:
    _coverage_backend_response: "{{
      _exact_logs.stdout | default('') if expected_signal == 'logs' else
      _exact_prometheus.stdout | default('') if expected_signal in ['metrics', 'health'] else
      _exact_traces.stdout | default('') if expected_signal == 'traces' else
      _exact_profiles.stdout | default('')
    }}"
    _coverage_backend_rc: "{{
      _exact_logs.rc | default(127) if expected_signal == 'logs' else
      _exact_prometheus.rc | default(127) if expected_signal in ['metrics', 'health'] else
      _exact_traces.rc | default(127) if expected_signal == 'traces' else
      _exact_profiles.rc | default(127)
    }}"
  no_log: true

- name: Capture the strict observation time after the backend response
  ansible.builtin.set_fact:
    _coverage_observed_at: "{{ now(utc=true).timestamp() | int }}"

- name: Validate the strict signal response without exposing backend content
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/files/o11y-coverage-census.py"
      - --validate-signal-observation
    stdin: "{{ {
      'response': _coverage_backend_response,
      'command_rc': _coverage_backend_rc | int,
      'target_id': expected_target_id,
      'signal': expected_signal,
      'query_start': _coverage_query_start | int,
      'query_end': _coverage_query_end | int,
      'observed_at': _coverage_observed_at | int,
      'window_seconds': observation_window_seconds,
      'requested_freshness_seconds': freshness_seconds,
      'declared_freshness_seconds': _coverage_target.signals[expected_signal].freshness_seconds
    } | to_json }}"
  delegate_to: localhost
  register: _validated_observation
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true

- name: Promote only the fixed validation status
  ansible.builtin.set_fact:
    _coverage_observation_status: "{{ (_validated_observation.stdout | from_json).status }}"
  # A malformed parse can echo the protected validator stdout.
  no_log: true

- name: Require the strict signal observation
  ansible.builtin.assert:
    that: _coverage_observation_status == 'verified'
    fail_msg: "Strict signal observation refused."

- name: Emit sanitized unattributed observation metadata
  ansible.builtin.set_stats:
    data:
      o11y_coverage_observation:
        status: observed
        target_id: "{{ expected_target_id }}"
        signal: "{{ expected_signal }}"
        repository_sha: "{{ expected_repository_sha }}"
        inventory_revision: "{{ expected_inventory_revision }}"
        observation_window_seconds: "{{ observation_window_seconds }}"
        freshness_seconds: "{{ freshness_seconds }}"
        task_reference_unattributed: true
        query_ended_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(_coverage_query_end | int, utc=true) }}"
        observed_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(_coverage_observed_at | int, utc=true) }}"
