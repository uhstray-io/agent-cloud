---
# Reused by the canary's always path and the independent interruption recovery.
- name: Render the paused OpenBao-backed baseline
  ansible.builtin.include_tasks: o11y-alert-provision.yml
  vars:
    o11y_alerts_enabled: false

- name: Restart o11y with the paused baseline
  ansible.builtin.shell: |
    cd "{{ _deploy_dir }}"
    bash deploy.sh --no-pull
  environment:
    CONTAINER_ENGINE: "{{ _engine }}"
    LOCAL_MODE: "true"
  changed_when: true

- name: Read the restored service-down rule
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - sh
      - -c
      - >-
        printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
        curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules/o11y_service_down
  register: _restored_rule
  changed_when: false

- name: Require the service-down rule to be paused again
  ansible.builtin.assert:
    that: (_restored_rule.stdout | from_json).isPaused | bool
    fail_msg: "The canary could not restore paused alerts; run Restore o11y Alert Baseline (Dev)."

- name: Read all restored o11y alert rules
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - sh
      - -c
      - >-
        printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
        curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/alert-rules
  register: _restored_rules
  changed_when: false

- name: Require every o11y rule to be paused again
  ansible.builtin.assert:
    that:
      - _o11y_rules | length > 0
      - _o11y_rules | rejectattr('isPaused', 'equalto', true) | list | length == 0
    fail_msg: "An o11y rule is still active; run Restore o11y Alert Baseline (Dev)."
  vars:
    _o11y_rules: "{{ _restored_rules.stdout | from_json | selectattr('uid', 'match', '^o11y_') | list }}"

- name: Read restored Grafana contact points without displaying webhook settings
  ansible.builtin.command:
    argv:
      - "{{ _engine }}"
      - exec
      - o11y-grafana
      - sh
      - -c
      - >-
        printf 'user = "admin:%s"\n' "$GF_SECURITY_ADMIN_PASSWORD" |
        curl -fsS --config - http://127.0.0.1:3000/api/v1/provisioning/contact-points
  register: _restored_contacts
  changed_when: false
  no_log: true

- name: Require the canary contact point to be absent again
  ansible.builtin.assert:
    that: >-
      _restored_contacts.stdout | from_json |
      selectattr('uid', 'equalto', 'o11y_ops_discord') | list | length == 0
    fail_msg: "The canary contact point remains active; run Restore o11y Alert Baseline (Dev)."
