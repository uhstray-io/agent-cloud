---
# assert-bao-transport.yml — refuse to send secret material over public cleartext.
#
# Include this at the top of any play that reaches OpenBao. The AppRole secret_id,
# the client token OpenBao returns, and whatever secret is being read or written
# all cross that connection, so a public http:// endpoint exposes them to anyone
# on the path.
#
# http:// IS allowed to loopback and RFC1918, because the platform's OpenBao sits
# on an internal VLAN and is reached at an http:// address. Requiring https
# outright would break every real run.
#
# http:// to a SINGLE-LABEL hostname (no dots) is allowed ONLY under local_mode:
# local-dev reaches its store as http://local-openbao:8200 on the genesis podman
# network. It is NOT allowed unconditionally, because a resolver with a `search`
# suffix in resolv.conf can turn a bare name into a public FQDN — the exact class
# the anchored pattern exists to refuse. local_mode is the inventory axis that
# actually distinguishes the two cases. The trailing delimiter still applies, so
# http://name@evil.example is refused: the name before @ is userinfo, and the
# request would go to the public host after it.
#
# Anchored on COMPLETE addresses with a trailing delimiter. A prefix match like
# `http://10\.` also accepts http://10.evil.example/ — a public host whose name
# merely starts with a private-looking octet.
#
# Extracted to one file rather than copied per play: the rule was already stated
# in three playbooks, and three more plays needed it. Six independently-worded
# copies of a security check drift, and the drift is silent.
#
# Caller passes:
#   _assert_bao_url   the resolved base URL to check
#   _assert_url_label optional name of the endpoint, for the message (default "OpenBao").
#                     The RULE is not OpenBao-specific — any endpoint that receives secret
#                     material in a header or body wants it — so the label exists to keep
#                     the failure message accurate when another caller reuses this.
#
# Usage:
#   - name: "Refuse a cleartext OpenBao endpoint"
#     ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
#     vars:
#       _assert_bao_url: "{{ _bao_url }}"

- name: "Require a non-cleartext transport to {{ _assert_url_label | default('OpenBao') }}"
  # become:false lives HERE, on the guard's own task, and not on the include in
  # any caller. `become` is not a valid attribute for a TaskInclude — a dynamic
  # include_tasks carrying it makes the file unparseable at RUNTIME, which no
  # syntax check catches because dynamic includes are not parsed until reached
  # (measured on ansible-core 2.21.0; see docs/MISTAKES.md 2.17).
  #
  # It is stated rather than relied upon. assert evaluates on the controller and
  # never runs as a privileged module on the target, so today it cannot fail on
  # escalation. But this guard is included by plays that escalate at PLAY level
  # and run it BEFORE a sudo password is available; if it ever grew a task that
  # touches the target, it would inherit that escalation and fail there. One line
  # makes the precondition explicit for every caller at once.
  become: false
  vars:
    # Named vars so neither regex line breaks the 200-char limit — a folded
    # scalar would join with spaces INSERTED INTO the pattern. The behavioural
    # table in test_credential_leaks.bats compiles both, exactly as decoded here.
    _pat_strict: '^(https://|http://(localhost|127(\.[0-9]{1,3}){3}|10(\.[0-9]{1,3}){3}|192\.168(\.[0-9]{1,3}){2}|172\.(1[6-9]|2[0-9]|3[01])(\.[0-9]{1,3}){2})(?::[0-9]{1,5})?(?:/|$))'
    _pat_single_label: '^http://[A-Za-z][A-Za-z0-9-]*(?::[0-9]{1,5})?(?:/|$)'
  ansible.builtin.assert:
    that:
      - >-
        _assert_bao_url is match(_pat_strict)
        or ((local_mode | default(false) | bool)
            and _assert_bao_url is match(_pat_single_label))
    fail_msg: >-
      Refusing to send secret material to {{ _assert_url_label | default('OpenBao') }}
      over public cleartext ({{ _assert_bao_url
      | default('<unset>') }}). Set openbao_addr to an https:// URL, or an
      http:// endpoint on loopback/RFC1918 (the internal OpenBao VLAN).
