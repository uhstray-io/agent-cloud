---
# site-config-push.yml — stage ONE path in the site-config clone, commit if it
# changed, push the branch, and say what moved (names and counts, never values).
#
# Pairs with site-config-clone.yml, which set _sc_clone, _sc_branch, _sc_git_env.
#
# Caller passes:
#   _sc_add_path        path RELATIVE to the clone to stage — scoped, never -A
#   _sc_commit_subject  first commit line
#   _sc_commit_body     second commit line (what and from where; never a value)
#   _sc_report_what     short human phrase for the final report

- name: "Stage only the path this run wrote"
  # Scoped, never `git add -A`. The clone is shallow and clean, but a blanket add
  # is how unrelated working state gets swept into a credentials commit.
  ansible.builtin.command:
    argv: ["git", "add", "--", "{{ _sc_add_path }}"]
    chdir: "{{ _sc_clone }}"
  changed_when: true
  when: not ansible_check_mode

- name: "Is there anything to commit?"
  ansible.builtin.command:
    cmd: "git diff --cached --quiet"
    chdir: "{{ _sc_clone }}"
  register: _sc_staged
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "Commit"
  # argv: the quotes that look like they protect the message are consumed by
  # YAML, not by a shell — `command` never invokes one.
  ansible.builtin.command:
    argv:
      - git
      - commit
      - "-m"
      - "{{ _sc_commit_subject }}"
      - "-m"
      - "{{ _sc_commit_body }}"
    chdir: "{{ _sc_clone }}"
  when:
    - not ansible_check_mode
    - _sc_staged.rc != 0
  changed_when: true

- name: "Recheck the reviewed integration tip before a guarded push"
  ansible.builtin.command:
    argv: [git, ls-remote, --heads, origin, "refs/heads/{{ _sc_guarded_base_branch }}"]
    chdir: "{{ _sc_clone }}"
  environment: "{{ _sc_git_env }}"
  register: _sc_before_push_base
  changed_when: false
  when:
    - not ansible_check_mode
    - _sc_guarded_base_branch is defined
    - _sc_staged.rc != 0

- name: "Check that the guarded branch is still absent"
  ansible.builtin.command:
    argv: [git, ls-remote, --heads, origin, "refs/heads/{{ _sc_branch }}"]
    chdir: "{{ _sc_clone }}"
  environment: "{{ _sc_git_env }}"
  register: _sc_before_push_branch
  changed_when: false
  when:
    - not ansible_check_mode
    - _sc_guarded_base_branch is defined
    - _sc_staged.rc != 0

- name: "Require unchanged integration tip and absent proposal branch"
  ansible.builtin.assert:
    that:
      - _sc_before_push_base.stdout.split() | length == 1
      - _sc_before_push_base.stdout.split()[0] == _sc_reviewed_base_sha
      - _sc_before_push_branch.stdout | length == 0
    fail_msg: "The site-config base changed or the proposal branch already exists."
  when:
    - not ansible_check_mode
    - _sc_guarded_base_branch is defined
    - _sc_staged.rc != 0

- name: "Push the branch"
  ansible.builtin.command:
    cmd: "git push origin {{ _sc_branch }}"
    chdir: "{{ _sc_clone }}"
  environment: "{{ _sc_git_env }}"
  when:
    - not ansible_check_mode
    - _sc_staged.rc != 0
  changed_when: true

- name: "Read the proposal commit for guarded push verification"
  ansible.builtin.command:
    argv: [git, rev-parse, HEAD]
    chdir: "{{ _sc_clone }}"
  register: _sc_push_head
  changed_when: false
  when:
    - not ansible_check_mode
    - _sc_guarded_base_branch is defined
    - _sc_staged.rc != 0

- name: "Verify guarded branch and integration tip after push"
  ansible.builtin.command:
    argv: [git, ls-remote, --heads, origin, "refs/heads/{{ item.ref }}"]
    chdir: "{{ _sc_clone }}"
  environment: "{{ _sc_git_env }}"
  loop:
    - {ref: "{{ _sc_branch }}"}
    - {ref: "{{ _sc_guarded_base_branch | default('') }}"}
  register: _sc_after_push_refs
  changed_when: false
  when:
    - not ansible_check_mode
    - _sc_guarded_base_branch is defined
    - _sc_staged.rc != 0

- name: "Require exact guarded push readback"
  ansible.builtin.assert:
    that:
      - (_sc_after_push_refs.results[0].stdout.split() | first | default('')) == _sc_push_head.stdout
      - (_sc_after_push_refs.results[1].stdout.split() | first | default('')) == _sc_reviewed_base_sha
    fail_msg: "The guarded site-config push could not be verified against its reviewed base."
  when:
    - not ansible_check_mode
    - _sc_guarded_base_branch is defined
    - _sc_staged.rc != 0

- name: "Report"
  ansible.builtin.debug:
    msg: >-
      {{ ('Pushed branch ' ~ _sc_branch ~ ' to site-config: ' ~ _sc_report_what
          ~ '. Open a PR there to keep it.')
         if _sc_staged.rc != 0
         else ('No change — site-config already holds ' ~ _sc_report_what ~ '. Nothing pushed.') }}
