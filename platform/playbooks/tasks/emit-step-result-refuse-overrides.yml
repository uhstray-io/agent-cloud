---
# emit-step-result-refuse-overrides.yml — included ONLY by emit-step-result.yml, with every
# one of its inputs set to the probe value as include params. Do not include it elsewhere.
#
# An extra var outranks include params (ansible-core variable precedence: 21 "include
# params", 22 "Extra vars" — always win;
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html#understanding-variable-precedence),
# so `-e step_result_status=pass` would replace the status every executor computes and
# forge the result the conformance collector writes to NetBox and Loki. Include params
# are the top rank below extra vars, so a name read back here as anything but the probe
# is held by an extra var. The probe values are scoped to this include and never reach
# the record.
#
# The name arrives as the loop variable: an extra var does not replace a loop's own
# variable (see tasks/refuse-var-overrides.yml), while a list held in an ordinary var
# could be swapped for a harmless one.

- name: "Step result: refuse an input that an extra var sets"
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', _sr_input, default='') == '__extra_var_probe__'
    fail_msg: >-
      Refusing to record a step result: {{ _sr_input }} is set as an extra var, which
      outranks the value the executor computes and would forge the recorded result.
      Launch without -e {{ _sr_input }}.
    quiet: true
  run_once: true
  loop:
    - step_result_step
    - step_result_status
    - step_result_evidence
    - step_result_error
    - step_result_service
    - step_result_undo
    - _step_result_record
  loop_control:
    loop_var: _sr_input
