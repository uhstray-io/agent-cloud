---
# guard-stateful-cutover.yml — refuse an in-place cutover whose rendered env
# disagrees with the live legacy env on any STATEFUL value, before any
# container is touched.
#
# On a host still carrying the legacy env file, regenerated stateful secrets
# are data loss, not rotation: a re-keyed n8n encryption key makes every stored
# workflow credential permanently undecryptable; a regenerated Postgres
# password fails auth against the existing data volume. Operator vigilance is
# the thing that fails at 2am — this diff is mechanical, fails closed, and
# prints KEY NAMES ONLY. Hosts with no legacy file (greenfield) skip entirely.
#
# Shared because the same guard is prescribed for every held in-place migration
# (plan/development/09-service-migrations-tooling.md Task 0 step 4 — n8n now,
# NocoDB when unpaused); the fail-closed / no_log / names-only property set
# should be gotten right once, not re-derived per service.
#
# Caller passes:
#   _gsc_live_env      path of the LIVE legacy env file (absent -> guard skips)
#   _gsc_rendered_env  path of the freshly rendered env file
#   _gsc_keys          list of stateful keys to compare. Each entry is either a
#                      plain KEY name, or a mapping {name, live_names} when the
#                      legacy file spells the key differently (live_names lists
#                      every spelling the live side may use; default [name]).
#                      n8n's standalone prod layout names its encryption key
#                      ENCRYPTION_KEY while the rendered env says
#                      N8N_ENCRYPTION_KEY — without the alias the one value
#                      that matters most could never be verified.
#   _gsc_fix_hint      optional one-line remediation for the refusal message

- name: "Check for a live legacy env (cutover detection)"
  ansible.builtin.stat:
    path: "{{ _gsc_live_env }}"
  register: _gsc_legacy

- name: "Guard the cutover: rendered stateful values must match the live ones"
  when: _gsc_legacy.stat.exists
  block:
    - name: "Read both env files"
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ _gsc_live_env }}"
        - "{{ _gsc_rendered_env }}"
      register: _gsc_envs
      no_log: true

    - name: "Diff the stateful values (names only)"
      # One pass per key; only the NAME of a differing key survives into the
      # fact. Assignments are matched at LINE START ((?m)^KEY=) so a commented
      # example can never stand in for the real value, and ALL occurrences are
      # compared as ordered lists — a duplicate key that differs between the
      # files is a mismatch, never silently resolved by "first match wins"
      # while the env-file parser picks a different one. A key absent from
      # both files yields two empty lists, which agree vacuously. On the LIVE
      # side every declared spelling (live_names) is collected in one
      # alternation, so an aliased key duplicated across spellings is caught
      # as ambiguous exactly like a same-name duplicate.
      ansible.builtin.set_fact:
        _gsc_mismatches: >-
          {{ (_gsc_mismatches | default([]))
             + ([_gsc_name] if _gsc_live_vals != _gsc_new_vals else []) }}
        _gsc_duplicated: >-
          {{ (_gsc_duplicated | default([]))
             + ([_gsc_name] if (_gsc_live_vals | length > 1
                                or _gsc_new_vals | length > 1) else []) }}
      vars:
        _gsc_name: "{{ item.name | default(item) }}"
        _gsc_live_names: "{{ item.live_names | default([_gsc_name]) }}"
        _gsc_live_txt: "{{ _gsc_envs.results[0].content | b64decode }}"
        _gsc_new_txt: "{{ _gsc_envs.results[1].content | b64decode }}"
        _gsc_live_vals: "{{ _gsc_live_txt | regex_findall('(?m)^(?:' ~ (_gsc_live_names | join('|')) ~ ')=(.*)$') }}"
        _gsc_new_vals: "{{ _gsc_new_txt | regex_findall('(?m)^' ~ _gsc_name ~ '=(.*)$') }}"
      loop: "{{ _gsc_keys }}"
      no_log: true

    - name: "Refuse to proceed on a stateful mismatch (names only, never values)"
      # A duplicated key refuses even when both files duplicate it identically:
      # which occurrence the env-file parser honours is an implementation
      # detail this guard does not model, so an ambiguous file is a mismatch.
      ansible.builtin.assert:
        that:
          - _gsc_mismatches | length == 0
          - _gsc_duplicated | default([]) | length == 0
        fail_msg: >-
          CUTOVER REFUSED before touching the running service: the rendered
          {{ _gsc_rendered_env }} disagrees with the live {{ _gsc_live_env }}
          on {{ _gsc_mismatches | default([]) | join(', ') }}
          {{ '' if (_gsc_duplicated | default([]) | length == 0) else
          '(duplicated assignments: ' ~ (_gsc_duplicated | join(', ')) ~ ')' }}.
          {{ _gsc_fix_hint | default('Pre-seed the live values into the secret
          store, verify them, then re-run.') }} No container was restarted.
