---
# distribute-ca-root.yml — give a consuming service the step-ca trust bundle (root +
# intermediate), so it can VERIFY internal TLS. Companion to mint-internal-cert.yml, which
# gives a service a leaf to SERVE (or present) TLS with. The OIDC-reachability enabler needs
# both: an in-network OIDC client reaches the IdP at https://auth.<zone>:8443 (Caddy's
# step-ca leaf) and must trust the step-ca root to verify it.
#
# The bundle is read from the CA container on the CA host (`_ca_host`, default: the play
# host, which is the local-dev single-host case) and written on the consumer; nothing is
# copied through a file on the CA host or the controller (openspec production-internal-ca
# task 4.3, design decision 9). Both certificates are public trust anchors. The CA stays the
# only source: no copy of the production root is committed to this repository.
#
# Required vars (one of):
#   _ca_root_dest_dir   consuming service's deploy dir; bundle lands in
#                       <dir>/certs/step-ca-bundle.crt
#   _ca_bundle_dest     the bundle's full path, e.g. inside a leaf's mounted certificate
#                       directory (overrides _ca_root_dest_dir)
# Optional vars:
#   _ca_host            inventory host running the step-ca container (default: the play host)
#   _ca_engine          container engine on the CA host (default: that host's
#                       container_engine, else podman)
#   _ca_name            step-ca container name (default: step-ca)

- name: "Assert required variables for CA-root distribution"
  ansible.builtin.assert:
    that:
      - (_ca_bundle_dest | default('') | length > 0) or (_ca_root_dest_dir | default('') | length > 0)
    fail_msg: "distribute-ca-root.yml requires `_ca_root_dest_dir` (consuming service's deploy dir) or `_ca_bundle_dest`."

- name: "Name the CA host and the bundle path"
  ansible.builtin.set_fact:
    _ca_root_host: "{{ _ca_host | default(inventory_hostname) }}"
    _ca_root_engine: "{{ _ca_engine | default(hostvars[_ca_host | default(inventory_hostname)].container_engine | default('podman')) }}"
    # A conditional, not default(): default() evaluates its argument even when unused.
    _ca_root_bundle: >-
      {{ _ca_bundle_dest if (_ca_bundle_dest | default('') | length > 0)
         else (_ca_root_dest_dir ~ '/certs/step-ca-bundle.crt') }}

# Read-only, so it runs in check mode as well: a dry run then shows whether the bundle on
# the consumer would change. Root first, then intermediate: Caddy serves the leaf only, so a
# client needs both to build leaf -> intermediate -> root.
- name: "Read the root and intermediate from the CA on {{ _ca_root_host }}"
  ansible.builtin.command: >-
    {{ _ca_root_engine }} exec {{ _ca_name | default('step-ca') }}
    cat /home/step/certs/root_ca.crt /home/step/certs/intermediate_ca.crt
  delegate_to: "{{ _ca_root_host }}"
  register: _ca_root_read
  changed_when: false
  check_mode: false

- name: "Refuse a bundle that is not a root and an intermediate"
  ansible.builtin.assert:
    that:
      - _ca_root_read.stdout | regex_findall('-----BEGIN CERTIFICATE-----') | length == 2
    fail_msg: "{{ _ca_root_host }}: the CA's root and intermediate did not read back as two certificates."
    quiet: true

- name: "Ensure the bundle's directory exists"
  ansible.builtin.file:
    path: "{{ _ca_root_bundle | dirname }}"
    state: directory
    mode: "0755"

# The bundle on the consumer now; read-only, so a dry run compares too.
- name: "Read the bundle the consumer holds"
  ansible.builtin.slurp:
    src: "{{ _ca_root_bundle }}"
  register: _ca_root_current
  failed_when: false

- name: "Name the bundle's new content"
  ansible.builtin.set_fact:
    _ca_root_new: "{{ _ca_root_read.stdout }}\n"
    _ca_root_held: "{{ (_ca_root_current.content | b64decode) if (_ca_root_current.content is defined) else '' }}"

# Written IN PLACE (`cat >` truncates the same file), never replaced by a rename: a service
# that bind-mounts this one file (ERPNext's compose.local.yml does) keeps the inode it was
# started with, so a new file would stay invisible to it until the container is recreated
# (review of #367; the pinned-inode lesson in manage-caddy-sites.yml). 0644: public, and the
# unprivileged service user must read it. Only when the bundle differs (a new root after a
# reset, or a renewed intermediate), and skipped under --check.
- name: "Write the step-ca trust bundle to {{ _ca_root_bundle }}"
  ansible.builtin.shell: |
    set -eu
    cat > {{ _ca_root_bundle | quote }}
    chmod 0644 {{ _ca_root_bundle | quote }}
  args:
    stdin: "{{ _ca_root_new }}"
    stdin_add_newline: false
  changed_when: true
  when: not ansible_check_mode and _ca_root_held != _ca_root_new

- name: "Report a bundle a real run would rewrite"
  ansible.builtin.debug:
    msg: "check mode: {{ _ca_root_bundle }} would be rewritten with the CA's current root and intermediate"
  when: ansible_check_mode and _ca_root_held != _ca_root_new
