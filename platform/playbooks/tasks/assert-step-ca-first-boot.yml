---
# assert-step-ca-first-boot.yml — refuse a production CA whose first-boot settings are not
# declared (openspec production-internal-ca, task 2.2).
#
# step-ca writes its name, DNS names, admin provisioner and ACME switch into the step-ca-data
# volume on the first run and never reads them again, so a CA initialised from the local
# defaults keeps the wrong name until a reset. ACME is off unless inventory turns it on
# (local-dev does), so here it only has to not be on. Included by deploy-step-ca.yml
# before anything is written, and by clean-deploy-step-ca.yml before the root is destroyed,
# so a confirmed reset with incomplete inventory refuses instead of leaving no CA.
# Skipped in local_mode, which keeps the local defaults.

- name: "Refuse a production CA without its first-boot settings"
  ansible.builtin.assert:
    that:
      - stepca_name is defined and stepca_name is string and (stepca_name | length) > 0
      # Every health check and the provisioner list verify https://localhost:9000 against
      # the root, so localhost must be one of the CA's own names.
      - stepca_dns_names is defined and stepca_dns_names is string
      - "'localhost' in (stepca_dns_names.split(',') | map('trim') | list)"
      - (stepca_init_acme | default('false') | string) == 'false'
      - (stepca_bind | default('127.0.0.1') | string) == '127.0.0.1'
      # Phase 2.5 raises the lifetime of the provisioner named admin.
      - (stepca_provisioner | default('admin') | string) == 'admin'
    fail_msg: >-
      {{ inventory_hostname }}: declare stepca_name and stepca_dns_names (a comma-separated
      string that includes localhost), leave stepca_init_acme unset or "false", keep stepca_bind at
      127.0.0.1 and stepca_provisioner at admin, before the first production deploy. step-ca
      writes them into its volume at first boot.
    quiet: true
  when: not (local_mode | default(false) | bool)
