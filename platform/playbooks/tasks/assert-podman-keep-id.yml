---
# assert-podman-keep-id.yml — refuse a podman older than 4.3 before a deploy that runs userns keep-id.
#
# keep-id (`userns_mode: keep-id:uid=...,gid=...` in a compose overlay) needs podman 4.3 or later, and an
# older podman refuses the flag. One shared check, so every listener-TLS deploy holds the same bar: skynet's
# production HTTPS listener, OPA's opa_tls, agentgateway's listener TLS and the production launch gate.
#
# Include this AFTER tasks/place-monorepo.yml. Placement installs podman (and compose), so a fresh host has a
# podman to read. A read before placement fails with "No such file" instead of the refusal.
#
# The read is read-only and runs under --check (check_mode false), so a dry run refuses the same host a real
# run would. The assert is not skipped under --check. The caller decides whether the check applies, with the
# `when` on its include_tasks.
#
# Input: _apk_for, what needs keep-id, named in the refusal (default 'this deploy').
#
# This is the strictest form, the one platform/playbooks/deploy-skynet.yml used before the check was shared. It
# refuses a failed read and an engine other than podman, because keep-id is a podman option and another
# engine's version number would pass the comparison.

- name: "Read the podman version for userns keep-id"
  ansible.builtin.command:
    argv: ["{{ container_engine | default('podman') }}", version, --format, "{{ '{{.Client.Version}}' }}"]
  register: _apk_podman_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Refuse a podman older than 4.3 for userns keep-id"
  ansible.builtin.assert:
    that:
      # The read must succeed first: a missing podman prints no version, and the comparison would then fail on ''.
      - _apk_podman_version.rc | default(1) == 0
      # keep-id is a podman option: another engine's version number would pass the comparison.
      - (container_engine | default('podman')) == 'podman'
      - _apk_podman_version.stdout is version('4.3', '>=')
    fail_msg: >-
      {{ _apk_for | default('this deploy') }} needs podman 4.3 or later for the userns keep-id mapping. This host runs
      {{ container_engine | default('podman') }} {{ _apk_podman_version.stdout | default('') | trim | default('(no version read)', true) }}
      (read rc {{ _apk_podman_version.rc | default('unset') }}). Run Install Podman on this host, then re-run this deploy.
    quiet: true
