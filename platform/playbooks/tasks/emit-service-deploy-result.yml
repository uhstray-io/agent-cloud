---
# emit-service-deploy-result.yml — record the `service-deploy` workflow step result for a
# per-service deploy playbook. Registry step: platform/workflows/service-onboarding/registry.yml
# (criteria: the deploy verify phase passes; a second run reports no change; evidence_keys
# [verified, changed_on_rerun]). It wraps tasks/emit-step-result.yml, which owns the contract.
#
# Include it as the LAST task of the playbook's verify play, so it is reached only on hosts
# where every verify task passed:
#
#   - name: "Record the service-deploy step result"
#     ansible.builtin.include_tasks: tasks/emit-service-deploy-result.yml
#     vars:
#       service_deploy_result_var: _deploy   # NAME of the per-host var holding the deploy result
#
# `service_deploy_result_var` names a per-host variable, read for every host of the play through
# hostvars (the way deploy-authentik.yml folds its oidc-config verdicts), because the result is
# one record for the whole group. The variable holds a dict:
#
#   skipped   true when the deploy was skipped (check mode, or a run limited to other tags so
#             it never registered); absent or false otherwise
#   changed   whether the deploy changed anything on this run
#   verified  optional, default true: false when the verify phase passed only because the
#             operator accepted an unproven check (deploy-agentgateway.yml)
#
# The registered result of the deploy.sh shell task has the first two keys, so a compose
# service names it directly (`_deploy`, whose changed_when reads the DEPLOY_CHANGED line
# common.sh compose_up_if_changed prints). A caller whose result carries a credential, or that
# has to combine several tasks, sets a per-host fact holding only the keys above and names that
# (deploy-github-runner.yml, deploy-agentgateway.yml); it never passes a result that
# holds a credential.
#
# One record for the play, judged over ansible_play_hosts_all:
#
#   fail  a host of the play is missing from ansible_play_hosts (it failed or was unreachable
#         before this ran), so the group did not deploy and verify as a whole. Not judged in a
#         dry run: `meta: end_host` ("not deployed yet, stop the dry run") also removes a host
#         from ansible_play_hosts, and the two cannot be told apart, but a dry run's deploy is
#         skipped on every host anyway
#   skip  every host that reached this task had its deploy skipped (or has no result)
#   pass  otherwise
#
#   evidence verified          true when no host is missing and every host that deployed
#                              verified; false otherwise
#            changed_on_rerun  true when ANY host's deploy changed something on this run. A
#                              re-run of an unchanged service must report false, which is what
#                              the registry's second-run criterion reads; this run is the re-run
#                              when it is one.
#
# A play in which every host failed never reaches this task and records nothing; the
# conformance collector counts a run with no result as a failure.
#
# `service_deploy_result_var` is an include var only. Like emit-step-result's own inputs it is
# refused when defined anywhere else (an extra var outranks include vars and would redirect the
# read to another variable and forge the change report), so nothing may set, register or define
# it outside the include. The per-host variable it names is the caller's own.

- name: "Service-deploy result: refuse the input set as an extra var"
  ansible.builtin.assert:
    that:
      - service_deploy_result_var is defined
      - "'service_deploy_result_var' not in hostvars[inventory_hostname]"
    fail_msg: >-
      Refusing to record a service-deploy result: service_deploy_result_var is missing or defined
      outside the executor. It is reserved for emit-service-deploy-result's include vars: an extra
      var would outrank the variable name the playbook passes and forge the change report.
    quiet: true
  run_once: true

- name: "Service-deploy result: judge every host of the play"
  ansible.builtin.set_fact:
    _service_deploy_verdict: >-
      {%- set ns = namespace(ran=[], changed=[], unverified=[]) -%}
      {%- for h in ansible_play_hosts -%}
        {%- set r = hostvars[h][service_deploy_result_var] | default({}) -%}
        {%- if r is mapping and (r | length) > 0 and not (r.skipped | default(false) | bool) -%}
          {%- set ns.ran = ns.ran + [h] -%}
          {%- if r.changed | default(false) | bool -%}{%- set ns.changed = ns.changed + [h] -%}{%- endif -%}
          {%- if not (r.verified | default(true) | bool) -%}{%- set ns.unverified = ns.unverified + [h] -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'ran': ns.ran, 'changed': ns.changed, 'unverified': ns.unverified,
          'missing': ([] if ansible_check_mode else (ansible_play_hosts_all | difference(ansible_play_hosts)))} }}
  run_once: true

- name: "Service-deploy result: record the result"
  ansible.builtin.include_tasks: emit-step-result.yml
  vars:
    step_result_step: service-deploy
    step_result_status: >-
      {{ 'fail' if (_service_deploy_verdict.missing | length) > 0
         else ('pass' if (_service_deploy_verdict.ran | length) > 0 else 'skip') }}
    step_result_error: >-
      {{ ('host(s) ' ~ (_service_deploy_verdict.missing | join(', '))
          ~ ' did not reach the end of the deploy and verify phases') if (_service_deploy_verdict.missing | length) > 0 else none }}
    step_result_evidence:
      verified: "{{ (_service_deploy_verdict.missing | length) == 0 and (_service_deploy_verdict.unverified | length) == 0 }}"
      changed_on_rerun: "{{ (_service_deploy_verdict.changed | length) > 0 }}"
