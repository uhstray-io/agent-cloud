---
# validate-secrets.yml — Active credential testing against live services
#
# Fetches secrets from OpenBao and tests each against its service:
#   - DB passwords: psql connection test
#   - API tokens: HTTP request with auth
#   - Redis: redis-cli ping with auth
#
# Does NOT modify anything — read-only verification.
# Reports: VALID, INVALID, UNREACHABLE, SKIPPED
#
# Usage: -e "target_service=netbox_svc"

- name: "Validate secrets for {{ target_service | default('(unset)') }}"
  hosts: "{{ target_service }}"
  gather_facts: false
  become: false
  vars:
    target_service: "ungrouped"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"

  tasks:
    - name: "Authenticate to OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      delegate_to: localhost
      no_log: true

    - name: "Fetch secrets from OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/{{ service_name }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200, 404]
      register: _bao_data
      delegate_to: localhost
      no_log: true

    - name: "Set secrets fact"
      ansible.builtin.set_fact:
        _secrets: "{{ _bao_data.json.data.data | default({}) }}"
      no_log: true

    # Per-service credential-existence checks. No no_log: assert reports only the
    # failed condition (key name), never the value, so failures stay diagnosable.
    - name: "Validate tududi credentials exist in OpenBao"
      ansible.builtin.assert:
        that:
          - _secrets.tududi_session_secret is defined and (_secrets.tududi_session_secret | length) > 0
          - _secrets.tududi_admin_password is defined and (_secrets.tududi_admin_password | length) > 0
        fail_msg: >-
          secret/services/tududi is missing tududi_session_secret and/or
          tududi_admin_password — run deploy-tududi.yml (manage-secrets generates
          them). The OIDC client secret lives under secret/services/authentik.
        success_msg: "tududi credentials present (session secret + break-glass admin password)."
      when: service_name == 'tududi'

    - name: "Validate honcho credentials exist in OpenBao"
      ansible.builtin.assert:
        that:
          - _secrets.honcho_jwt_secret is defined and (_secrets.honcho_jwt_secret | length) > 0
          - _secrets.honcho_db_password is defined and (_secrets.honcho_db_password | length) > 0
        fail_msg: >-
          secret/services/honcho is missing honcho_jwt_secret and/or
          honcho_db_password — run deploy-honcho.yml (manage-secrets generates
          them). The Gemini key is shared-read from secret/services/nemoclaw.
        success_msg: "honcho credentials present (JWT signing secret + DB password)."
      when: service_name == 'honcho'

    - name: "Validate service URL reachable"
      ansible.builtin.uri:
        url: "{{ _secrets.url | default(service_url | default('')) }}"
        status_code: [200, 301, 302, 403]
        validate_certs: false
        timeout: 10
      register: _url_check
      ignore_errors: true
      when: _secrets.url is defined or service_url is defined

    - name: "Validate Postgres password"
      # Same two fixes as the postiz check below, which they shared as defects:
      # the password was on the command line (readable by anyone who can list
      # processes) and `| head -3` returned HEAD's status, so a REJECTED
      # credential reported VALID. environment + argv, and no pipeline.
      ansible.builtin.command:
        argv:
          - psql
          - -h
          - localhost
          - -U
          - "{{ postgres_validate_user | default('netbox') }}"
          - -d
          - "{{ postgres_validate_db | default('netbox') }}"
          - -c
          - SELECT 1
      environment:
        PGPASSWORD: "{{ _secrets.postgres_password }}"
      register: _pg_check
      ignore_errors: true
      changed_when: false
      when: _secrets.postgres_password is defined

    - name: "Validate Redis password"
      # REDISCLI_AUTH instead of `-a <password>`: redis-cli itself warns that the
      # flag is unsafe because the password lands in the process list.
      ansible.builtin.command:
        argv: [redis-cli, ping]
      environment:
        REDISCLI_AUTH: "{{ _secrets.redis_password }}"
      register: _redis_check
      ignore_errors: true
      changed_when: false
      when: _secrets.redis_password is defined

    # postiz's datastore password is service-prefixed (postiz_db_password, not
    # the generic postgres_password) and its Postgres runs in a container with no
    # host-installed psql — so it needs its own check rather than the generic one
    # above. Same shape as the netbox-specific psql call: this playbook is
    # generic in structure but per-service in its credential probes.
    - name: "Validate postiz Postgres password (in-container)"
      # Three things here are deliberate:
      #
      # 1. command with argv, NOT shell with a pipe. A `| head` pipeline returns
      #    HEAD's exit status, so a failed psql would set rc=0 and the summary
      #    below would report VALID for a credential that does not work — the
      #    exact thing this task exists to detect.
      # 2. PGPASSWORD is passed via `environment`, and `-e PGPASSWORD` forwards
      #    it by NAME. Putting `PGPASSWORD=<value>` in argv would place the
      #    password in the container-engine command line, readable by anyone who
      #    can list processes on that host.
      # 3. NO no_log. This is a verification task, and AGENTS.md scopes no_log to
      #    credential-handling steps precisely so verification stays diagnosable
      #    (a past deploy failure in this repo was censored exactly that way).
      #    The secret is not in argv any more, and Ansible does not echo the
      #    environment dict, so there is nothing left to hide here.
      ansible.builtin.command:
        argv:
          - "{{ container_engine | default('podman') }}"
          - exec
          - -e
          - PGPASSWORD
          - postiz-postgres
          - psql
          - -U
          - "{{ postiz_postgres_user | default('postiz') }}"
          - -d
          - "{{ postiz_postgres_db | default('postiz') }}"
          - -c
          - SELECT 1
      environment:
        PGPASSWORD: "{{ _secrets.postiz_db_password }}"
      register: _postiz_pg_check
      ignore_errors: true
      changed_when: false
      when: _secrets.postiz_db_password is defined

    - name: "Validation results"
      ansible.builtin.debug:
        msg: |
          {{ service_name }} secret validation:
            URL:      {{ 'VALID' if (_url_check is succeeded) else ('UNREACHABLE' if (_url_check is defined) else 'SKIPPED') }}
            Postgres: {{ 'VALID' if (_pg_check.rc | default(1) == 0) else ('INVALID' if (_pg_check is defined and _pg_check is not skipped) else 'SKIPPED') }}
            Redis:    {{ 'VALID' if ('PONG' in (_redis_check.stdout | default(''))) else ('INVALID' if (_redis_check is defined and _redis_check is not skipped) else 'SKIPPED') }}
            postiz DB: {{ 'VALID' if (_postiz_pg_check.rc | default(1) == 0) else ('INVALID' if (_postiz_pg_check is defined and _postiz_pg_check is not skipped) else 'SKIPPED') }}
