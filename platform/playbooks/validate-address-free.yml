---
# validate-address-free.yml — workflow step validate-address (plan 15, step 3).
#
# Change service-deployment-workflow task 7.3. Before provisioning, the declared address must
# not be live on the network, and NetBox must hold the service's VM record afterwards:
#   read   the pfSense ARP table (the same REST route the discovery worker's
#          get_arp_table() reads: /api/v2/diagnostics/arp_table, X-API-Key, credentials at
#          secret/services/discovery/pfsense) and Proxmox's VM list
#   judge  an address in ARP refuses the step, UNLESS the declared vmid already runs on
#          Proxmox under the declared name AND its NICs carry EVERY MAC the ARP table holds
#          for the address:
#          then the address is the service's own and the step is `skip` (already
#          provisioned), never a false refusal on a backfill
#   write  the NetBox VM record when absent: status planned, in the Proxmox cluster the
#          discovery worker maintains, under the SAME tenant and site discovery writes (its
#          inventory vars discovery_tenant_name and discovery_site_name, read from the netbox_svc
#          host). NetBox's uniqueness on a VM name is per tenant, so a record without that tenant
#          can sit beside discovery's tenanted record of the same name instead of being the same
#          object: the duplicate pattern seen on production. A declared tenant or site that NetBox
#          does not hold exactly once refuses the step; it is never omitted. Site is derived from
#          the cluster on save, and NetBox rejects a site that is not the cluster's
#          (netbox virtualization VirtualMachine.clean()), so a 400 on the create means the cluster
#          and discovery disagree on site. Token: the vm-recorder profile (view/add virtual
#          machines; view clusters, tenants and sites) from provision-netbox-automation-token. A
#          token whose permissions predate the tenant and site view grants needs a re-run of that
#          playbook with the vm-recorder profile: its permission step converges even when the
#          token already exists.
#
# Dry run (--check): every read runs and the verdict is recorded; the record is not created.
#
# Usage (Semaphore): -e target_service=<service> [-e target_host=<declaring host>]
#                    [-e netbox_vm_cluster=<name>] when NetBox holds more than one cluster

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Validate the declared address is free: {{ target_service | default('(unset)') }}"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/declared-vm.yml
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_auth:
      url: "{{ _bao_url }}"
      auth_method: approle
      role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
      secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _netbox_url: "{{ netbox_url | default(hostvars[groups['netbox_svc'][0]].service_url if (groups['netbox_svc'] | default([])) else '') }}"
    # Resolved lazily, once _pve is read; only ever used inside no_log requests.
    _pve_headers:
      Authorization: "PVEAPIToken={{ _pve.token_id }}={{ _pve.api_token }}"
    # The tenant and site discovery writes VMs under (agent.yaml.j2 renders both from these two
    # inventory vars). They are agent_cloud group vars in site-config, so the netbox_svc host
    # carries them. Empty when unset: the record is then placed without them, as before.
    _discovery_tenant_name: "{{ hostvars[groups['netbox_svc'][0]].discovery_tenant_name | default('', true) if (groups['netbox_svc'] | default([])) else '' }}"
    _discovery_site_name: "{{ hostvars[groups['netbox_svc'][0]].discovery_site_name | default('', true) if (groups['netbox_svc'] | default([])) else '' }}"

  tasks:
    - name: "Require a target service that resolves to one declaring host with an address"
      ansible.builtin.assert:
        that:
          - target_service is defined and target_service | length > 0
          - _decl_host in _group_hosts
          - target_host is defined or (_group_hosts | length == 1)
          - _ip | length > 0
          - _vmid | string | length > 0
        fail_msg: "Pass -e target_service=<service> whose <service>_svc host declares vm_ip and vm_vmid."

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Refuse a cleartext NetBox endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _netbox_url }}"
        _assert_url_label: "NetBox"

    - name: "Read the pfSense, Proxmox and NetBox credentials"
      ansible.builtin.set_fact:
        _pf: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/services/discovery/pfsense', **_bao_auth) }}"
        _pve: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/services/proxmox', **_bao_auth) }}"
        _nb_token: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/services/netbox', **_bao_auth).vm_recorder_api_token | default('') }}"
      no_log: true

    - name: "Require the vm-recorder token"
      ansible.builtin.assert:
        that: _nb_token | length > 0
        fail_msg: >-
          secret/services/netbox has no vm_recorder_api_token. Mint it once with Provision
          NetBox Automation Token, survey field Token profile = vm-recorder.
      no_log: true

    # The token id names a real Proxmox user, so it comes from the store, never a default.
    - name: "Require the stored Proxmox token id"
      ansible.builtin.assert:
        that: _pve.token_id | default('') | length > 0
        fail_msg: >-
          secret/services/proxmox has no token_id. Store the Proxmox API token id
          (<user>@<realm>!<token-name>) beside api_token; there is no built-in default.

    - name: "Build the NetBox API headers"
      ansible.builtin.include_tasks: tasks/netbox-api-headers.yml

    # ── the network ─────────────────────────────────────────────────────────────────────
    - name: "Read the pfSense ARP table"
      ansible.builtin.uri:
        url: "https://{{ _pf.host }}/api/v2/diagnostics/arp_table"
        headers:
          X-API-Key: "{{ _pf.api_key }}"
        # The discovery worker's own setting (PFSENSE_VERIFY_SSL defaults false): the
        # firewall serves its self-signed certificate.
        validate_certs: false
        status_code: [200]
      register: _arp
      check_mode: false
      no_log: true

    - name: "Read Proxmox's VM list"
      ansible.builtin.uri:
        url: "{{ _pve.url }}/api2/json/cluster/resources?type=vm"
        headers: "{{ _pve_headers }}"
        validate_certs: false
      register: _pve_vms
      check_mode: false
      no_log: true

    - name: "Judge the address"
      ansible.builtin.set_fact:
        _arp_hits: "{{ _arp_entries | selectattr('ip', 'defined') | selectattr('ip', 'equalto', _ip) | list }}"
        # The declared VM, when it RUNS: a stopped VM cannot answer ARP (PR 195 Codex review).
        _running_vm: >-
          {{ _pve_vms.json.data | selectattr('vmid', 'equalto', _vmid | int) | selectattr('name', 'equalto', _name)
             | selectattr('status', 'defined') | selectattr('status', 'equalto', 'running') | list }}
      vars:
        # pfrest v2 wraps its answer in `data`; the ARP table has come back as a list and as a
        # dict keyed by index (the worker handled both, 1c3e6ea).
        _arp_data: "{{ _arp.json.data | default(_arp.json) }}"
        _arp_entries: "{{ (_arp_data.values() | list) if (_arp_data is mapping) else _arp_data }}"

    # A running VM with the declared id and name does not prove the ARP entry is ITS: another
    # device can answer for the address (PR 195 Codex review). Its NIC MACs, from its own config,
    # must include EVERY MAC the firewall saw for the address: one foreign entry beside the VM's
    # own is a second device holding it (PR 253 CodeRabbit review).
    - name: "Read the running VM's network configuration"
      ansible.builtin.uri:
        url: "{{ _pve.url }}/api2/json/nodes/{{ _running_vm[0].node }}/qemu/{{ _vmid }}/config"
        headers: "{{ _pve_headers }}"
        validate_certs: false
      register: _vm_config
      failed_when: false
      check_mode: false
      no_log: true
      when:
        - _arp_hits | length > 0
        - _running_vm | length > 0

    # The read is no_log (its request carries the token), so its failure is checked here,
    # visibly: otherwise an unreadable config reads as "no NIC carries those MACs", the wrong cause.
    - name: "Require the VM configuration read to answer"
      ansible.builtin.assert:
        that: _vm_config.status | default(-1) == 200
        fail_msg: >-
          Proxmox answered {{ _vm_config.status | default('no response') }} reading VM
          {{ _vmid }}'s configuration (expected 200): its NIC MACs, which decide whether the
          ARP entry is its own, are unknown.
      when: _vm_config is not skipped

    - name: "Judge whether the ARP entry is the declared VM's own"
      ansible.builtin.set_fact:
        _own_vm: >-
          {{ (_running_vm | length > 0) and (_arp_hits | length > 0)
             and (_arp_hits | map(attribute='mac', default='') | map('lower') | difference(_vm_macs) | length == 0) }}
      vars:
        # Proxmox writes a NIC as net<N>: "virtio=BC:24:11:AA:BB:CC,bridge=vmbr0".
        _vm_macs: >-
          {{ _vm_config.json.data | default({}) | dict2items
             | selectattr('key', 'match', '^net[0-9]+$') | map(attribute='value')
             | map('regex_search', '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}') | select | map('lower') | list }}

    # ── the record ──────────────────────────────────────────────────────────────────────
    - name: "NetBox: find the service's VM record and the Proxmox clusters"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/{{ item }}"
        headers: "{{ _nb_headers }}"
        status_code: [200]
      loop:
        - "virtualization/virtual-machines/?name={{ _name | urlencode }}"
        - "virtualization/clusters/?limit=1000{{ ('&name=' ~ (netbox_vm_cluster | urlencode)) if netbox_vm_cluster is defined else '' }}"
      register: _nb
      # The requests carry the vm-recorder token in their headers: a failed item would print
      # them into Semaphore's retained output (PR 195 Codex review). The status is checked
      # visibly below, without the request.
      failed_when: false
      no_log: true
      check_mode: false

    - name: "Require both NetBox reads to answer"
      ansible.builtin.assert:
        that: (_nb.results | map(attribute='status', default=0) | list) == [200, 200]
        fail_msg: >-
          NetBox answered {{ _nb.results | map(attribute='status', default='no response') | list }}
          to the VM-record and cluster reads (expected 200, 200).

    - name: "Decide"
      ansible.builtin.set_fact:
        _vm_records: "{{ _nb.results[0].json.results }}"
        # The type the Proxmox discovery worker creates (CLUSTER_TYPE = "Proxmox VE").
        _clusters: "{{ _nb.results[1].json.results | selectattr('type.name', 'equalto', 'Proxmox VE') | list }}"

    # The tenant and site discovery gives the VM, looked up by name. Read only when this run
    # would create the record: an existing record is adopted as it stands.
    - name: "NetBox: find the tenant discovery places the VM under"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/tenancy/tenants/?name={{ _discovery_tenant_name | urlencode }}"
        headers: "{{ _nb_headers }}"
        status_code: [200]
      register: _nb_tenant
      # The request carries the vm-recorder token: no_log, and the status is checked visibly below.
      failed_when: false
      no_log: true
      check_mode: false
      when:
        - _vm_records | length == 0
        - _discovery_tenant_name | length > 0

    - name: "NetBox: find the site discovery places the VM at"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/dcim/sites/?name={{ _discovery_site_name | urlencode }}"
        headers: "{{ _nb_headers }}"
        status_code: [200]
      register: _nb_site
      failed_when: false
      no_log: true
      check_mode: false
      when:
        - _vm_records | length == 0
        - _discovery_site_name | length > 0

    - name: "Require the tenant and site reads to answer"
      ansible.builtin.assert:
        that:
          - _nb_tenant is skipped or _nb_tenant.status | default(-1) == 200
          - _nb_site is skipped or _nb_site.status | default(-1) == 200
        fail_msg: >-
          NetBox answered {{ _nb_tenant.status | default('skipped') }} to the tenant read and
          {{ _nb_site.status | default('skipped') }} to the site read (expected 200 for each read that ran).

    - name: "Decide: the tenant and site the record is placed under"
      ansible.builtin.set_fact:
        _tenant_found: "{{ _nb_tenant.json.results | default([]) if (_nb_tenant is not skipped) else [] }}"
        _site_found: "{{ _nb_site.json.results | default([]) if (_nb_site is not skipped) else [] }}"

    # A declared tenant or site must resolve to exactly one object, or the step refuses. Omitting
    # it instead would create the very record this placement exists to avoid.
    - name: "Decide: the record body, and whether the declared tenant and site resolve"
      ansible.builtin.set_fact:
        _placement_errors: >-
          {{ ([] if (_vm_records | length > 0) or (_discovery_tenant_name | length == 0) or (_tenant_found | length == 1)
               else ['cannot place the NetBox VM record: ' ~ (_tenant_found | length) ~ ' NetBox tenants are named '
                     ~ _discovery_tenant_name ~ ' (expected 1). Discovery seeds the tenant, so either NetBox does not hold it, '
                     ~ 'or the vm-recorder token cannot view it: re-run Provision NetBox Automation Token with Token profile = vm-recorder'])
             + ([] if (_vm_records | length > 0) or (_discovery_site_name | length == 0) or (_site_found | length == 1)
                else ['cannot place the NetBox VM record: ' ~ (_site_found | length) ~ ' NetBox sites are named '
                      ~ _discovery_site_name ~ ' (expected 1). Discovery seeds the site, so either NetBox does not hold it, '
                      ~ 'or the vm-recorder token cannot view it: re-run Provision NetBox Automation Token with Token profile = vm-recorder']) }}
        # The POST body: discovery's tenant and site when declared, and nothing more.
        _vm_body: >-
          {{ {'name': _name, 'status': 'planned',
              'cluster': (_clusters | map(attribute='id') | first) | default(none),
              'description': 'Declared by the service deployment workflow (validate-address)'}
             | combine({'tenant': _tenant_found[0].id} if (_tenant_found | length == 1) else {})
             | combine({'site': _site_found[0].id} if (_site_found | length == 1) else {}) }}

    # A second task: a set_fact cannot read a fact it is assigning in the same call, and the
    # judgement below needs _clusters (PR 195 Codex review).
    #
    # An existing record is the service's only when it is the ONE record with that name and
    # sits in a Proxmox cluster discovery maintains: the lookup filters by name alone, so a
    # same-named record elsewhere would otherwise pass as this VM's (PR 195 Codex review).
    - name: "Decide: judge the address and the record placement"
      ansible.builtin.set_fact:
        _vm_record: "{{ _vm_records[0] if (_vm_records | length == 1) else {} }}"
        _address_errors: >-
          {{ ([] if (_arp_hits | length == 0) or _own_vm
              else [_ip ~ ' answers ARP (' ~ (_arp_hits | map(attribute='mac', default='?') | join(', '))
                    ~ ') and no running VM ' ~ _vmid ~ ' named ' ~ _name ~ ' carries every one of those MACs on Proxmox: the address is in use'])
             + ([] if (_vm_records | length > 0) or (_clusters | length == 1)
                else ['cannot place the NetBox VM record: ' ~ (_clusters | length)
                      ~ ' Proxmox clusters match (discovery maintains them; pass -e netbox_vm_cluster=<name>)'])
             + ([(_vm_records | length) ~ ' NetBox VM records are named ' ~ _name
                 ~ ': refusing to guess which one discovery reconciles']
                if (_vm_records | length > 1) else [])
             + (['the NetBox VM record ' ~ _name ~ ' is in cluster '
                 ~ (_vm_records[0].cluster.name | default('none')) ~ ', not a Proxmox cluster discovery maintains'
                 ~ (' (' ~ netbox_vm_cluster ~ ')' if netbox_vm_cluster is defined else '')]
                if (_vm_records | length == 1)
                   and ((_vm_records[0].cluster.id | default(none)) not in (_clusters | map(attribute='id') | list))
                else [])
             + _placement_errors }}

    - name: "NetBox: create the VM record (planned, in the Proxmox cluster)"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/virtualization/virtual-machines/"
        method: POST
        headers: "{{ _nb_headers }}"
        body_format: json
        body: "{{ _vm_body }}"
        status_code: [201]
      register: _created
      changed_when: true
      failed_when: false
      no_log: true
      when:
        - not ansible_check_mode
        - _address_errors | length == 0
        - _vm_record | length == 0

    - name: "Require the VM record to have been created"
      ansible.builtin.assert:
        that: _created.status | default(0) == 201
        fail_msg: "NetBox answered {{ _created.status | default('no response') }} creating the VM record (expected 201)."
      when: _created is not skipped

    - name: "Record the step result"
      ansible.builtin.include_tasks: tasks/emit-step-result.yml
      vars:
        step_result_service: "{{ target_service }}"
        step_result_step: validate-address
        step_result_status: >-
          {{ 'fail' if (_address_errors | length > 0)
             else ('skip' if _own_vm else 'pass') }}
        step_result_evidence:
          arp_present: "{{ _arp_hits | length > 0 }}"
          netbox_vm_id: "{{ _vm_record.id | default(_created.json.id | default(none)) }}"
        step_result_error: "{{ _address_errors | join('; ') }}"

    - name: "Fail when the address is not free or the record cannot be placed"
      ansible.builtin.fail:
        msg: "{{ _address_errors | join('; ') }}"
      when: _address_errors | length > 0
