---
# deploy-authentik.yml — central IdP / SSO (Authentik) deploy (composable).
#
# Phase 1: Place repo + manage-secrets (secret_key, bootstrap admin creds, DB
#          password — generated once into OpenBao, reused thereafter) + template
#          .env. The committed blueprints/ travel with the repo (config-as-code).
# Phase 2: deploy.sh — container lifecycle (pull, up postgres+redis+server+
#          worker, wait healthy; first boot migrates + applies blueprints).
# Phase 3: Verify the server is healthy + the API answers.
#
# Plan: plan/development/AUTH-SSO-DEPLOYMENT.md.

# ── Phase 1: Place repo + secrets + env ─────────────────────────────────────
- name: "Phase 1: Place repo + manage authentik secrets"
  hosts: authentik_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
    _branch: "{{ service_branch | default('main') }}"
    _bao_url: "{{ openbao_addr | default('') }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    # secret_key + DB password must be STABLE across redeploys (regenerating
    # secret_key invalidates sessions/tokens; a new DB password breaks auth) —
    # manage-secrets generates once into OpenBao and reuses on later runs.
    _secret_definitions:
      - { name: secret_key, type: random, length: 60 }
      - { name: bootstrap_password, type: random, length: 32 }
      - { name: bootstrap_token, type: random, length: 40 }
      - { name: db_password, type: random, length: 32 }
      # OIDC client secrets — Authentik owns them (it's the IdP). The matching
      # client services read them via manage-secrets `_shared_reads`. The worker
      # injects them into the OAuth2-provider blueprints via !Env.
      # (NetBox uses forward_auth locally — a proxy provider with no client
      # secret; its OIDC secret is added on the prod composable path.)
      - { name: grafana_oidc_client_secret, type: random, length: 40 }
      - { name: erpnext_oidc_client_secret, type: random, length: 40 }
      - { name: semaphore_oidc_client_secret, type: random, length: 40 }
      - { name: openbao_oidc_client_secret, type: random, length: 40 }
      - { name: tududi_oidc_client_secret, type: random, length: 40 }
      - { name: postiz_oidc_client_secret, type: random, length: 40 }
      # Day-to-day admin user (agent-cloud-admin.yaml blueprint), member of
      # platform-admins -> top role in every SSO'd app. Worker reads it via !Env.
      - { name: agent_cloud_admin_password, type: random, length: 32 }
      # Operator admin 'stray' (stray-admin.yaml) + platform service account API
      # token (service-account.yaml). Stable across redeploys; worker reads !Env.
      - { name: stray_admin_password, type: random, length: 32 }
      - { name: service_account_token, type: random, length: 60 }
      # Named platform users (platform-users.yaml). Initial passwords generated
      # once + reused (stable), OpenBao-owned; worker reads via !Env.
      - { name: wisward_password, type: random, length: 32 }
      - { name: andrew_password, type: random, length: 32 }
      - { name: jacob_password, type: random, length: 32 }
    _env_templates:
      - { src: env.j2, dest: .env, mode: "0600" }
    # Blueprints always applied regardless of environment (groups, flows, admin
    # users, service account). Per-app blueprints are selected from the catalog
    # by `authentik_apps`. zz-sso-bindings is RENDERED (not copied) from the set.
    _shared_blueprints:
      - agent-cloud.yaml
      - platform-groups.yaml
      - agent-cloud-admin.yaml
      - stray-admin.yaml
      - platform-users.yaml
      - service-account.yaml
    _authentik_tpls: "{{ playbook_dir }}/../services/authentik/deployment"

  tasks:
    # ── Retirement collision guard ───────────────────────────────────────────
    # A `state: absent` entry DELETES. platform-users.yaml keeps active and
    # retired accounts apart by using different variables, and a test refuses any
    # blueprint where one entry names another's variable. That check cannot see
    # the part that actually matters: two DIFFERENT variables can be set to the
    # SAME username in site-config, which the public repo never sees. The
    # blueprint would then create and delete one account in a single run, and
    # which wins is entry order rather than intent.
    #
    # So it is resolved here, against the values in force, BEFORE anything is
    # applied. Derived from the variable names rather than a hand-kept pairing,
    # so a user added later is covered without editing this.
    - name: "Read the username declarations out of env.j2"
      # DERIVED from the template that actually renders them, because the template
      # is where the DEFAULTS live and the defaults are the half that bites.
      #
      # `vars | dict2items` sees only variables that are DEFINED. With
      # jacob_username unset, it does not contain "jacob" — but env.j2 renders
      # JACOB_USERNAME={{ jacob_username | default('jacob') }} and the account
      # created is called jacob. A retired entry set to "jacob" would then sail
      # past a check built on defined variables and delete the account the same
      # run creates. Caught in review; the guard compares EFFECTIVE values now.
      #
      # Each match is (ENV_NAME, inventory_var, default).
      ansible.builtin.set_fact:
        _uname_decls: >-
          {{ lookup('file', playbook_dir ~ '/../services/authentik/deployment/templates/env.j2')
             | regex_findall("([A-Z0-9_]*USERNAME)=\{\{\s*([a-z0-9_]+)\s*\|\s*default\('([^']*)'\)") }}

    - name: "Resolve each declaration to the username that will actually exist"
      ansible.builtin.set_fact:
        _uname_effective: >-
          {{ (_uname_effective | default([]))
             + [{'env': item[0],
                 'value': (lookup('vars', item[1], default=item[2]) | string | trim)}] }}
      loop: "{{ _uname_decls }}"
      loop_control:
        label: "{{ item[0] }}"

    - name: "Split them into the accounts being kept and the ones being deleted"
      ansible.builtin.set_fact:
        _active_usernames: >-
          {{ _uname_effective | rejectattr('env', 'search', 'LEGACY_USERNAME$')
             | map(attribute='value') | reject('equalto', '') | list }}
        _retired_usernames: >-
          {{ _uname_effective | selectattr('env', 'search', 'LEGACY_USERNAME$')
             | map(attribute='value') | reject('equalto', '') | list }}

    - name: "Refuse to both create and delete the same account"
      ansible.builtin.assert:
        that:
          - _uname_decls | length > 0
          - (_active_usernames | intersect(_retired_usernames)) | length == 0
        fail_msg: >-
          {{ 'No USERNAME declarations found in env.j2 — this guard would pass
              vacuously, which is worse than failing.'
             if (_uname_decls | length == 0)
             else ('A retired username is also an ACTIVE username: '
                   ~ (_active_usernames | intersect(_retired_usernames) | join(', '))
                   ~ '. Applying the blueprints would create and delete that account
                   in one run. Fix the *_legacy_username value in site-config.') }}
        success_msg: >-
          {{ _retired_usernames | length }} retired username(s), none colliding
          with the {{ _active_usernames | length }} active one(s).

    - name: "Place the monorepo + ensure podman/compose"
      ansible.builtin.include_tasks: tasks/place-monorepo.yml

    - name: "Manage secrets and template env file"
      ansible.builtin.include_tasks: tasks/manage-secrets.yml

    # ── Composable blueprint selection (manifest-driven) ─────────────────────
    # Assemble blueprints-active/ from the enabled apps so prod shows only prod
    # services. Unset authentik_apps => all catalog apps (local-dev unchanged).
    # See plan/development/PROD-SSO-ROLLOUT-PLAN.md.
    - name: "Load the Authentik app catalog"
      ansible.builtin.include_vars:
        file: "{{ _authentik_tpls }}/app-catalog.yml"

    - name: "Resolve the enabled apps (default: every catalog app)"
      # default WITHOUT the boolean: only an UNDEFINED authentik_apps falls back to
      # the full catalog (local-dev). An explicit `authentik_apps: []` is a real
      # (empty) selection — do NOT treat it as unset, or "expose nothing" silently
      # becomes "expose everything".
      ansible.builtin.set_fact:
        _enabled_apps: "{{ authentik_apps | default(authentik_app_catalog.keys() | list) }}"

    - name: "Validate every enabled app exists in the catalog"
      ansible.builtin.assert:
        that:
          - item in authentik_app_catalog
        fail_msg: "authentik_apps entry '{{ item }}' is not in app-catalog.yml"
      loop: "{{ _enabled_apps }}"

    # ── Promotion safety (prod) — see app-catalog.yml "Promotion runbook" ────
    # Resolve the enabled OIDC apps' prod inputs + the post-apply verify set.
    # _verify_apps is reused by Phase 3 (host facts persist across plays).
    - name: "Resolve enabled OIDC apps' prod-required vars + verify set"
      ansible.builtin.set_fact:
        _oidc_prod_required: >-
          {{ _enabled_apps | map('extract', authentik_app_catalog)
             | selectattr('type', 'equalto', 'oidc')
             | selectattr('prod_required', 'defined')
             | map(attribute='prod_required') | flatten | list }}
        _verify_apps: >-
          {{ _enabled_apps | map('extract', authentik_app_catalog)
             | selectattr('type', 'equalto', 'oidc')
             | selectattr('verify_redirect', 'defined') | list }}

    # GUARD: refuse to promote an OIDC app to prod unless its prod URLs are set and
    # not still pointing at agent-cloud.test. Skipped for local_mode (local-dev uses
    # the blueprint defaults on purpose). This is what would have caught the semaphore
    # redirect_uri at deploy time instead of in the browser.
    - name: "Promotion guard (prod): OIDC prod URLs are set + not local-dev defaults"
      ansible.builtin.assert:
        # lookup('vars'), not the vars magic dict indexed by name: that returns the RAW string, so
        # a value that is itself a template ("{{ postiz_public_url }}/settings")
        # passes both checks below with its braces intact and the bug surfaces one
        # phase later in the verifier, where it did (2026-08-27). Resolving here
        # means a broken reference fails at the guard, before anything is applied.
        that:
          - "(lookup('vars', item, default='')) | length > 0"
          - "'agent-cloud.test' not in (lookup('vars', item, default=''))"
          - "'{{ '{{' }}' not in (lookup('vars', item, default=''))"
        fail_msg: >-
          Promotion guard: inventory var '{{ item }}' must resolve to a prod URL (in
          site-config), not an agent-cloud.test default and not an unresolved
          template. Got: {{ lookup('vars', item, default='<unset>') }}. Refusing to
          deploy — set it, or drop the app from prod authentik_apps.
        quiet: true
      loop: "{{ _oidc_prod_required }}"
      when: not (local_mode | default(false) | bool)

    # NOTE: this rebuilds the FILE set the worker applies. Authentik blueprints are
    # additive — dropping a file does NOT delete the app/provider already created in
    # the DB, so de-selected apps remain as harmless ORPHANS (no outpost binding /
    # access policy, so they grant nothing). This is intentional for the prod prune
    # (see PROD-SSO-ROLLOUT-PLAN.md). Full deprovisioning (state: absent tombstones
    # per removed slug, like openbao-oidc's tombstone) is a tracked future enhancement.
    - name: "Reset the active-blueprints dir (drop de-selected/removed apps)"
      ansible.builtin.file:
        path: "{{ _deploy_dir }}/blueprints-active"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]
      loop_control:
        label: "{{ item }}"

    # RENDERED (not copied) so environment-specific values (OIDC redirect_uris,
    # meta_launch_url) bake into the file content from inventory. Authentik gates
    # blueprint re-application on the file's content hash; a verbatim copy is
    # byte-identical local vs prod, so the worker never re-applies it and the value
    # resolved at first-apply (the local default) freezes — that is exactly why the
    # prod semaphore provider stayed on the agent-cloud.test redirect_uri. Baking the
    # URL in makes the content differ per env, which re-triggers application.
    # Blueprints with no Jinja render unchanged (verified: none use {{ }} / {% %}).
    - name: "Assemble active blueprints (shared + enabled apps) — rendered from inventory"
      ansible.builtin.template:
        src: "{{ _authentik_tpls }}/blueprints/{{ item }}"
        dest: "{{ _deploy_dir }}/blueprints-active/{{ item }}"
        mode: "0644"
      loop: "{{ _shared_blueprints + (_enabled_apps | map('extract', authentik_app_catalog, 'file') | list) }}"

    - name: "Render zz-sso-bindings from the enabled set"
      ansible.builtin.template:
        src: "{{ _authentik_tpls }}/templates/zz-sso-bindings.yaml.j2"
        dest: "{{ _deploy_dir }}/blueprints-active/zz-sso-bindings.yaml"
        mode: "0644"
      vars:
        authentik_apps: "{{ _enabled_apps }}"

    - name: "Create convenience symlink ~/authentik -> deploy dir"
      # Satisfies "a folder for authentik at ~/authentik" while keeping the
      # composable monorepo clone — ~/authentik points at the deployment dir.
      ansible.builtin.file:
        src: "{{ _deploy_dir }}"
        dest: "{{ local_home_dir | default('/home/' ~ (ansible_user | default('deploy')), true) }}/{{ service_name }}"
        state: link
        force: true
      register: _symlink_result
      # Best-effort: tolerate a permission-denied home, surface any other failure.
      failed_when: >-
        _symlink_result is failed
        and 'permission denied' not in (_symlink_result.msg | default('') | lower)

# ── Phase 2: Container lifecycle ────────────────────────────────────────────
- name: "Phase 2: Start authentik"
  hosts: authentik_svc
  gather_facts: false
  become: false
  vars:
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"

  tasks:
    - name: "Run deploy.sh (container lifecycle)"
      ansible.builtin.shell: |
        cd "{{ _deploy_dir }}"
        bash deploy.sh
      environment:
        CONTAINER_ENGINE: "{{ container_engine | default('podman') }}"
        LOCAL_MODE: "{{ 'true' if (local_mode | default(false) | bool) else '' }}"
        # Force the compose provider on the Mac-direct genesis path (§12A fix #1).
        # Empty on the Semaphore path; detect_runtime derives ([ -z ]). NOT
        # default(omit) — omit leaks its placeholder into environment (rc 127).
        COMPOSE_CMD: "{{ local_compose_cmd | default('') }}"
      register: _deploy
      changed_when: true

    - name: "Show deploy.sh output"
      ansible.builtin.debug:
        var: _deploy.stdout_lines

# ── Phase 3: Verify ─────────────────────────────────────────────────────────
- name: "Phase 3: Verify authentik"
  hosts: authentik_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    # Verify live OIDC providers against intent in prod by default; opt in for
    # local-dev via authentik_verify_oidc=true. No OIDC apps enabled => nothing to do.
    _do_oidc_verify: >-
      {{ (authentik_verify_oidc | default(not (local_mode | default(false) | bool))) | bool
         and (_verify_apps | default([]) | length > 0) }}

  tasks:
    - name: "Server healthcheck (ak healthcheck)"
      ansible.builtin.command: "{{ _engine }} exec authentik-server ak healthcheck"
      register: _ak_health
      changed_when: false
      retries: 5
      delay: 6
      until: _ak_health.rc == 0

    - name: "API answers (unauthenticated root config endpoint -> 200)"
      ansible.builtin.command: >-
        {{ _engine }} exec authentik-server
        python -c "import urllib.request,sys;
        sys.exit(0 if urllib.request.urlopen('http://localhost:9000/api/v3/root/config/', timeout=5).status == 200 else 1)"
      register: _ak_api
      changed_when: false
      retries: 5
      delay: 6
      until: _ak_api.rc == 0

    - name: "Wait for the embedded outpost to serve forward_auth (proxy-provider sync)"
      # `ak healthcheck` + the API go green BEFORE the embedded outpost finishes
      # loading proxy providers from the blueprints, so for ~a minute after deploy
      # the forward_auth gates 404 (they look broken right after a deploy/genesis,
      # and the smoke test races the sync). Gate the deploy on the gate actually
      # working: probe the outpost's Caddy auth endpoint for a committed
      # proxy-provider host until it issues the auth redirect (302). Host +
      # X-Forwarded-Proto=https are exactly what Caddy's forward_auth sends; the
      # host must match a committed forward_auth blueprint's external_host
      # (netbox-forward-auth.yaml: netbox.agent-cloud.test:8443). http.client (not
      # urllib) so the 302 is returned, not followed to the TLS-gated IdP.
      ansible.builtin.command: >-
        {{ _engine }} exec authentik-server
        python -c "import http.client,sys;
        c=http.client.HTTPConnection('localhost',9000,timeout=8);
        c.putrequest('GET','/outpost.goauthentik.io/auth/caddy',skip_host=True);
        c.putheader('Host','{{ authentik_outpost_probe_host | default('netbox.agent-cloud.test:8443') }}');
        c.putheader('X-Forwarded-Proto','https');
        c.endheaders();
        sys.exit(0 if c.getresponse().status == 302 else 1)"
      register: _ak_outpost
      changed_when: false
      retries: 20
      delay: 6
      until: _ak_outpost.rc == 0

    # ── Promotion VERIFY: live OIDC config matches intent ────────────────────
    # Query the live Authentik API and FAIL the deploy if any enabled OIDC
    # provider's redirect_uris does not carry its intended (inventory) URL. Catches
    # an object that did not actually update — e.g. a provider first created with the
    # local default that a content-unchanged blueprint never re-applied (the exact
    # semaphore failure). Runs inside authentik-server so the script reads the
    # bootstrap token from the container env (nothing secret on the command line).
    - name: "Promotion verify (prod): render the live-OIDC checker"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/authentik/deployment/templates/verify-oidc.py.j2"
        dest: /tmp/verify-oidc.py
        mode: "0644"
      when: _do_oidc_verify | bool

    - name: "Promotion verify (prod): live OIDC redirect_uris match intent"
      ansible.builtin.shell: "{{ _engine }} exec -i authentik-server python - < /tmp/verify-oidc.py"
      register: _oidc_verify
      changed_when: false
      failed_when: _oidc_verify.rc != 0
      when: _do_oidc_verify | bool

    - name: "Promotion verify: result"
      ansible.builtin.debug:
        var: _oidc_verify.stdout_lines
      when: _do_oidc_verify | bool

    # ── Blueprint + account verify (every environment) ───────────────────────
    # Blueprint application is asynchronous in the worker. Placing the files and
    # seeing a healthy server proves the files landed — not that a single account
    # was created, which is what an operator is about to hand someone a password
    # for. This reads the live state back: every custom blueprint applied
    # successfully, every declared account present and active and in a group,
    # every retired account gone. Not gated on prod: a local deploy that creates
    # nobody is just as wrong. Runs inside the container, same as the OIDC check.
    - name: "Blueprint verify: render the live-state checker"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/authentik/deployment/templates/verify-users.py.j2"
        dest: /tmp/verify-users.py
        mode: "0644"

    - name: "Blueprint verify: custom blueprints applied, declared accounts present/absent"
      ansible.builtin.shell: "{{ _engine }} exec -i authentik-server python - < /tmp/verify-users.py"
      register: _users_verify
      changed_when: false
      failed_when: _users_verify.rc != 0

    - name: "Blueprint verify: result"
      ansible.builtin.debug:
        var: _users_verify.stdout_lines

    - name: "Report"
      ansible.builtin.debug:
        msg: "authentik healthy — server up, API answering on :9000, embedded outpost serving forward_auth (behind Caddy for TLS)."

# ── Phase 4: Render + distribute Caddy fragment (prod only) ─────────────────
# auth.uhstray.io -> this VM:9000, tls internal. Skipped unless a central Caddy
# host (caddy_svc) exists AND not local_mode (local-dev routes the IdP via
# Caddyfile.local's caddy_routes, not a sites/ fragment).
- name: "Phase 4: Render + distribute Caddy fragment"
  hosts: authentik_svc
  gather_facts: false
  become: false
  vars:
    _fragment_src: "/tmp/authentik-caddy-site.caddy"
    _fragment_name: "authentik.caddy"
    # Composable sites/ model only. A flat hand-managed Caddyfile sets
    # caddy_composable=false and gets its routes via manage-caddy-sites.yml.
    _has_caddy: "{{ (groups['caddy_svc'] | default([]) | length > 0) and not (local_mode | default(false) | bool) and (caddy_composable | default(true) | bool) }}"

  tasks:
    - name: "Require public host + upstream vars before distributing to Caddy"
      ansible.builtin.assert:
        that:
          - authentik_public_host is defined
          - authentik_caddy_upstream is defined
        fail_msg: >-
          Set authentik_public_host and authentik_caddy_upstream in inventory
          before enabling Caddy distribution.
      when: _has_caddy | bool

    - name: "Render caddy-site.j2 to the Authentik host"
      # src resolved on the CONTROLLER (checked-out monorepo), not the remote clone.
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../services/authentik/deployment/templates/caddy-site.j2"
        dest: "{{ _fragment_src }}"
        mode: "0644"
      when: _has_caddy | bool

    - name: "Push fragment to central Caddy + reload"
      ansible.builtin.include_tasks: tasks/distribute-caddy-site.yml
      when: _has_caddy | bool

    - name: "Note when Caddy distribution is skipped"
      ansible.builtin.debug:
        msg: "No caddy_svc host in inventory (or local_mode) — skipping central-Caddy fragment distribution."
      when: not (_has_caddy | bool)
