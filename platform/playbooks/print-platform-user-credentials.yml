---
# print-platform-user-credentials.yml — read the initial login for one or more
# platform users out of OpenBao and PRINT it, so an operator can hand it over.
#
# The name says "print" because that is the whole hazard. Everything a Semaphore
# job writes to stdout is stored in that task's output and stays there. This
# playbook therefore does something the rest of this repo never does on purpose:
# it puts a live credential somewhere durable and readable. That is a deliberate,
# gated exception, not a pattern to copy.
#
# WHY IT EXISTS. Initial passwords are generated by OpenBao and reused, so nobody
# — including the operator — ever sees one. Authentik's own answer is an
# enrollment or recovery link, which needs prod SMTP (see platform-users.yaml,
# "FUTURE"). Until that exists, handing someone their first login means reading it
# back, and the only credential that can read it is the AppRole Semaphore holds.
# A workstation cannot: the AppRole pairs stored in site-config are stale.
#
# RUN IT, THEN DELETE THE TASK. The exposure is bounded by how long the run is
# kept, and nothing here can delete itself. The operator-side step is:
#   DELETE /api/project/<id>/tasks/<task_id>
# Do that as soon as the credential has been captured.
#
# Prints ONLY the fields named in `credential_users`. It cannot be pointed at an
# arbitrary secret path — the path is fixed to the Authentik service secret, so a
# careless invocation cannot dump the whole store.
#
# Usage (Semaphore extra vars):
#   -e i_understand_this_prints_secrets=true -e credential_users=jacob,andrew

- name: "Print platform user initial credentials (GATED — output is durable)"
  hosts: localhost
  gather_facts: false
  become: false
  connection: local
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID'), true) | default('', true) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID'), true) | default('', true) }}"
    # Fixed. Not a parameter, so this cannot be aimed at another path.
    _bao_path: "secret/data/services/authentik"
    _users: "{{ (credential_users | default('')) | split(',') | map('trim') | reject('equalto', '') | list }}"

  tasks:
    - name: "Refuse unless the caller has said the quiet part out loud"
      # An explicit acknowledgement, not a boolean nobody reads. Printing a live
      # credential into durable storage should never be something a run does
      # because a default allowed it.
      ansible.builtin.assert:
        that:
          - (i_understand_this_prints_secrets | default(false) | bool)
          - _users | length > 0
          - _bao_url | length > 0
        fail_msg: >-
          This playbook PRINTS live credentials into the task output, where they
          persist until the task is deleted. Re-run with
          -e i_understand_this_prints_secrets=true and
          -e credential_users=<name>[,<name>...] if that is what you intend.

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
      register: _bao_auth
      no_log: true

    - name: "Read the Authentik service secret"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/{{ _bao_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
      register: _secret
      no_log: true

    - name: "Name the users whose password is missing, before printing anything"
      # Reported separately so a typo reads as "no such field" instead of silently
      # printing an empty password that looks like a real one.
      ansible.builtin.assert:
        that:
          - (_secret.json.data.data[item ~ '_password'] | default('')) | length > 0
        fail_msg: >-
          No {{ item }}_password at {{ _bao_path }}. Deploy Authentik first — the
          password is generated on the deploy that creates the user.
      loop: "{{ _users }}"
      no_log: true

    - name: "THE CREDENTIALS — capture these now, then DELETE this task"
      # The one deliberate exposure in this repo. Everything above is no_log'd
      # precisely so that this is the only place the material appears, and so it
      # is obvious in review which line is the one that prints.
      ansible.builtin.debug:
        msg: >-
          {{ item }} -> {{ _secret.json.data.data[item ~ '_password'] }}
      loop: "{{ _users }}"

    - name: "The part that is not optional"
      ansible.builtin.debug:
        msg:
          - "Those passwords are now stored in this Semaphore task's output."
          - "They stay there until the task is deleted. Delete it now:"
          - "  DELETE /api/project/<project_id>/tasks/<this task id>"
          - "Then have each user change their password at first login."
