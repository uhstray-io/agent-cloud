# Read-only preflight for the privately pinned PBS backing disk and one proposed data disk.
- name: Refuse internal extra vars
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: Survey PBS physical storage
  ansible.builtin.import_playbook: survey-o11y-pbs-physical-storage.yml
  vars:
    _extra_var_guard_nested: true

- name: Preflight reported thick-LVM allocation constraints
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _inspector: "{{ playbook_dir }}/files/inspect_o11y_pbs_physical_storage.py"
    _o11y_hosts: "{{ groups['o11y_svc'] | default([]) }}"
    _o11y_host: "{{ _o11y_hosts | first | default('') }}"
    _pinned_serial: "{{ hostvars[_o11y_host].proxmox_pbs_backing_disk_serial | default(none) if _o11y_host else none }}"
    _pinned_wwn: "{{ hostvars[_o11y_host].proxmox_pbs_backing_disk_wwn | default(none) if _o11y_host else none }}"
  tasks:
    - name: Reuse the shared task sequence
      ansible.builtin.import_tasks: tasks/preflight-o11y-pbs-thick-lvm-allocation.yml
