---
# provision-netbox-custom-fields.yml — converge NetBox's workflow custom fields to their
# declaration (platform/workflows/service-onboarding/netbox-custom-fields.yml).
#
# Idempotent: a field that exists with the declared type and object types is left alone;
# one that is missing is created; one whose object types differ is patched. A field with the
# declared NAME but a different TYPE is refused, never changed: NetBox stores values by type,
# and retyping would orphan every value already written.
#
# Dry run: --check (Semaphore "Dry run") reads and reports, writes nothing.
# Auth: OpenBao AppRole -> secret/services/netbox:automation_api_token (provisioned by
# provision-netbox-automation-token.yml). Only the credential tasks are no_log'd.

- name: "Converge NetBox workflow custom fields"
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _bao_url: "{{ openbao_addr | default(lookup('env', 'OPENBAO_ADDR'), true) | default(lookup('env', 'BAO_ADDR'), true) | default('', true) }}"
    _bao_role_id: "{{ bao_role_id | default(lookup('env', 'BAO_ROLE_ID')) }}"
    _bao_secret_id: "{{ bao_secret_id | default(lookup('env', 'BAO_SECRET_ID')) }}"
    _netbox_url: "{{ netbox_url | default(hostvars[groups['netbox_svc'][0]].service_url if (groups['netbox_svc'] | default([])) else '') }}"
    _token_key: "{{ netbox_token_key | default('automation_api_token') }}"
    _declared: "{{ (lookup('file', playbook_dir ~ '/../workflows/service-onboarding/netbox-custom-fields.yml') | from_yaml).custom_fields }}"

  tasks:
    - name: "Require the NetBox and OpenBao addresses"
      ansible.builtin.assert:
        that:
          - _netbox_url | length > 0
          - _bao_url | length > 0
        fail_msg: "Set netbox_url (or a netbox_svc host with service_url) and openbao_addr."

    - name: "Refuse a cleartext secret-store endpoint"
      ansible.builtin.include_tasks: tasks/assert-bao-transport.yml
      vars:
        _assert_bao_url: "{{ _bao_url }}"

    - name: "Authenticate to OpenBao (AppRole)"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ _bao_role_id }}"
          secret_id: "{{ _bao_secret_id }}"
        status_code: [200]
      register: _bao_auth
      no_log: true
      changed_when: false
      check_mode: false

    - name: "Read the NetBox automation token from OpenBao"
      ansible.builtin.uri:
        url: "{{ _bao_url }}/v1/secret/data/services/netbox"
        method: GET
        headers:
          X-Vault-Token: "{{ _bao_auth.json.auth.client_token }}"
        status_code: [200]
      register: _nb_secret
      no_log: true
      check_mode: false

    - name: "Set the NetBox auth header"
      ansible.builtin.set_fact:
        _nb_headers:
          Authorization: "Token {{ _nb_secret.json.data.data[_token_key] }}"
          Accept: application/json
      no_log: true

    - name: "Read each declared field"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/extras/custom-fields/?name={{ item.name | urlencode }}"
        method: GET
        headers: "{{ _nb_headers }}"
        status_code: [200]
      loop: "{{ _declared }}"
      loop_control:
        label: "{{ item.name }}"
      register: _cf_read
      check_mode: false

    - name: "Refuse a declared name that exists with a different type"
      ansible.builtin.assert:
        that:
          - (item.json.results | length == 0) or (item.json.results[0].type.value == item.item.type)
        fail_msg: >-
          custom field {{ item.item.name }} exists as type
          {{ item.json.results[0].type.value | default('?') }}, declared {{ item.item.type }}.
          Retyping would orphan stored values; resolve by hand.
      loop: "{{ _cf_read.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Create each missing field"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/extras/custom-fields/"
        method: POST
        headers: "{{ _nb_headers }}"
        body_format: json
        body: "{{ item.item }}"
        status_code: [201]
      loop: "{{ _cf_read.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - not ansible_check_mode
        - item.json.results | length == 0
      register: _cf_created
      changed_when: true

    - name: "Patch object types that drifted"
      ansible.builtin.uri:
        url: "{{ _netbox_url }}/api/extras/custom-fields/{{ item.json.results[0].id }}/"
        method: PATCH
        headers: "{{ _nb_headers }}"
        body_format: json
        body:
          object_types: "{{ item.item.object_types }}"
        status_code: [200]
      loop: "{{ _cf_read.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - not ansible_check_mode
        - item.json.results | length > 0
        - (item.json.results[0].object_types | sort) != (item.item.object_types | sort)
      changed_when: true

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ 'check mode: ' if ansible_check_mode else '' }}declared
          {{ _declared | map(attribute='name') | join(', ') }};
          missing before this run:
          {{ _cf_read.results | selectattr('json.results', 'equalto', []) | map(attribute='item.name') | list | join(', ') or 'none' }}
