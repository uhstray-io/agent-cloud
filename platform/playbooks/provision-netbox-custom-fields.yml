---
# provision-netbox-custom-fields.yml — converge NetBox's workflow custom fields to their
# declaration (platform/workflows/service-onboarding/netbox-custom-fields.yml).
#
# Runs through the NetBox Django shell on the NetBox host, the same path as
# provision-netbox-automation-token.yml, because custom fields are platform schema: the
# scoped automation token deliberately has no permission on extras.customfield (403,
# 2026-09-22), and widening a device-writing token to schema changes would break least
# privilege.
#
# Idempotent: a field that exists with the declared type and object types is left alone; a
# missing one is created; drifted object types, label, description or group are updated. A
# field with the declared NAME but a different TYPE is refused, never retyped: NetBox stores
# values by type and retyping would orphan every value already written.
#
# Dry run: --check (Semaphore "Dry run") computes and reports the difference, writes nothing.

- name: "Converge NetBox workflow custom fields"
  hosts: netbox_svc
  gather_facts: false
  become: false
  vars:
    _manage: "{{ container_engine | default('docker') }} exec -i {{ netbox_app_container | default('netbox-netbox-1') }} /opt/netbox/netbox/manage.py shell"
    _declared: "{{ (lookup('file', playbook_dir ~ '/../workflows/service-onboarding/netbox-custom-fields.yml') | from_yaml).custom_fields }}"
    # One script, two modes: APPLY=0 only reads and reports the difference.
    _script: |
      import json
      from extras.models import CustomField
      from core.models import ObjectType
      APPLY = APPLY_FLAG
      declared = json.loads(DECLARED_JSON)
      out = {"create": [], "update": [], "unchanged": [], "refuse": []}
      for d in declared:
          types = [ObjectType.objects.get_by_natural_key(*t.split(".")) for t in d["object_types"]]
          cf = CustomField.objects.filter(name=d["name"]).first()
          if cf is not None and cf.type != d["type"]:
              out["refuse"].append(d["name"] + ": exists as " + cf.type + ", declared " + d["type"])
              continue
          if cf is None:
              out["create"].append(d["name"])
              if APPLY:
                  cf = CustomField.objects.create(name=d["name"], type=d["type"], label=d["label"],
                                                  description=d["description"], group_name=d["group_name"])
                  cf.object_types.set(types)
              continue
          have = sorted(o.app_label + "." + o.model for o in cf.object_types.all())
          drift = (have != sorted(d["object_types"]) or cf.label != d["label"]
                   or cf.description != d["description"] or cf.group_name != d["group_name"])
          if not drift:
              out["unchanged"].append(d["name"])
              continue
          out["update"].append(d["name"])
          if APPLY:
              cf.label, cf.description, cf.group_name = d["label"], d["description"], d["group_name"]
              cf.save()
              cf.object_types.set(types)
      print("CF_RESULT " + json.dumps(out))

  tasks:
    - name: "Compute the difference against the declaration (read-only)"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        {{ _script | replace('APPLY_FLAG', 'False') | replace('DECLARED_JSON', (_declared | to_json | to_json)) }}
        PYSCRIPT
      register: _cf_plan
      changed_when: false
      check_mode: false

    - name: "Parse the difference"
      # Read the keys with brackets: `_cf.update` is the dict's own update() method in Jinja,
      # not the key (the same trap manage-secrets.yml notes for `.keys`).
      ansible.builtin.set_fact:
        _cf: "{{ (_cf_plan.stdout_lines | select('match', '^CF_RESULT ') | last)[10:] | from_json }}"

    - name: "Refuse a declared name that exists with a different type"
      ansible.builtin.assert:
        that: _cf['refuse'] | length == 0
        fail_msg: "Retyping would orphan stored values; resolve by hand: {{ _cf['refuse'] | join('; ') }}"

    - name: "Apply the difference"
      ansible.builtin.shell: |
        {{ _manage }} << 'PYSCRIPT'
        {{ _script | replace('APPLY_FLAG', 'True') | replace('DECLARED_JSON', (_declared | to_json | to_json)) }}
        PYSCRIPT
      register: _cf_apply
      changed_when: true
      when:
        - not ansible_check_mode
        - (_cf['create'] | length > 0) or (_cf['update'] | length > 0)

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ 'check mode: would ' if ansible_check_mode else '' }}create
          {{ _cf['create'] | join(', ') or 'none' }}; update {{ _cf['update'] | join(', ') or 'none' }};
          unchanged {{ _cf['unchanged'] | join(', ') or 'none' }}
