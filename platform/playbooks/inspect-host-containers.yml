---
# inspect-host-containers.yml — the containers on ONE host, from each engine it has.
#
# Read-only, identical under --check. Scope: rootless podman for the connecting user and, when
# the host declares one, its dedicated `linger_user`; rootful podman; Docker. A rootless
# container owned by any other account is not seen (a rootful probe cannot list another
# user's rootless containers). For each container: name, image, state, restart policy and the
# compose working directory, which is how tasks/list-service-containers.yml selects a
# service's containers. Names and metadata only: no environment, no mounts, no labels beyond
# that one.
#
# Exists to onboard a host that carries no service group (devlog, grafanapodman) from what
# actually runs there, and to see which engine and account own a service's containers:
# rootless podman (the connecting user), rootful podman, or Docker.
#
# Usage (Semaphore): -e target_host=<inventory host or group>

- name: "Inspect the containers on {{ target_host | default('(unset)') }}"
  # An omitted target selects nothing (a name no inventory declares), never a group by
  # accident; the syntax check still needs a value to render.
  hosts: "{{ target_host | default('no-target-host-given') }}"
  gather_facts: false
  become: false
  vars:
    # One line per container: name|image|state|restart policy|compose working_dir. Built the way
    # tasks/list-service-containers.yml builds its format, and passed the same way: as an argv
    # element. Production Semaphore's Ansible re-templates `environment:` values, so a Go
    # template there fails with "unexpected '.'"; argv is not re-templated.
    _fields:
      - .Name
      - .Config.Image
      - .State.Status
      - .HostConfig.RestartPolicy.Name
      - index .Config.Labels "com.docker.compose.project.working_dir"
    _fmt: "{{ _fields | map('regex_replace', '^', '{{') | map('regex_replace', '$', '}}') | join('|') }}"
    # $1 = engine, $2 = inspect format (the argv on each probe below).
    _script: |
      ENGINE=$1 FMT=$2
      command -v "$ENGINE" >/dev/null 2>&1 || { echo "(no $ENGINE)"; exit 0; }
      ids=$("$ENGINE" ps -aq 2>/dev/null) || { echo "($ENGINE not usable here)"; exit 0; }
      [ -n "$ids" ] || { echo "(no containers)"; exit 0; }
      # shellcheck disable=SC2086
      "$ENGINE" inspect --format "$FMT" $ids

  pre_tasks:
    - name: "Require exactly one target host"
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: >-
          target_host must resolve to exactly one inventory host; it matched
          {{ ansible_play_hosts_all | length }} ({{ ansible_play_hosts_all | join(', ') }}).

  tasks:
    - name: "Rootless podman (the connecting user)"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'podman', _fmt] }}"
      register: _rootless
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Rootless podman (the host's dedicated service account)"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'podman', _fmt] }}"
      become: true
      become_user: "{{ linger_user }}"
      register: _dedicated
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - linger_user is defined
        - linger_user != (ansible_user | default(''))

    - name: "Rootful podman"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'podman', _fmt] }}"
      become: true
      register: _rootful
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Docker"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'docker', _fmt] }}"
      become: true
      register: _docker
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Report"
      ansible.builtin.debug:
        msg:
          connecting_user: "{{ ansible_user | default('(inventory default)') }}"
          rootless_podman: "{{ _rootless.stdout_lines | default([]) + _rootless.stderr_lines | default([]) }}"
          rootless_podman_dedicated_account: >-
            {{ {linger_user: _dedicated.stdout_lines | default([]) + _dedicated.stderr_lines | default([])}
               if (_dedicated is defined and _dedicated is not skipped) else 'none declared' }}
          not_seen: rootless containers of any other account
          rootful_podman: "{{ _rootful.stdout_lines | default([]) + _rootful.stderr_lines | default([]) }}"
          docker: "{{ _docker.stdout_lines | default([]) + _docker.stderr_lines | default([]) }}"
