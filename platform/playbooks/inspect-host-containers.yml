---
# inspect-host-containers.yml — the containers on ONE host, from each engine it has.
#
# Read-only, identical under --check. Scope: rootless podman for the connecting user and, when
# the host declares one, its dedicated account (`linger_user`, else `github_runner_account`);
# rootful podman; Docker. A rootless container owned by any other account is not seen (a rootful probe cannot list another
# user's rootless containers). For each container: name, image, state, restart policy and the
# compose working directory, which is how tasks/list-service-containers.yml selects a
# service's containers. Each podman probe also prints the store's graph driver name and graph
# options (from `podman info`), and nothing else from it. Names and metadata only: no
# environment, no mounts, no labels beyond that one.
#
# Exists to onboard a host that carries no service group (devlog) from what
# actually runs there, and to see which engine and account own a service's containers:
# rootless podman (the connecting user), rootful podman, or Docker.
#
# Usage (Semaphore): -e target_host=<inventory host or group>

# An extra var outranks every value this playbook computes, so refuse any that sets an
# internal (underscore-prefixed) name before anything runs (refuse-internal-extra-vars.yml).
- name: "Refuse extra vars that set internal names"
  ansible.builtin.import_playbook: refuse-internal-extra-vars.yml

- name: "Inspect the containers on {{ target_host | default('(unset)') }}"
  # An omitted target selects nothing (a name no inventory declares), never a group by
  # accident; the syntax check still needs a value to render.
  hosts: "{{ target_host | default('no-target-host-given') }}"
  gather_facts: false
  become: false
  vars:
    # One line per container: name|image|state|restart policy|compose working_dir. Built the way
    # tasks/list-service-containers.yml builds its format, and passed the same way: as an argv
    # element. Production Semaphore's Ansible re-templates `environment:` values, so a Go
    # template there fails with "unexpected '.'"; argv is not re-templated.
    _fields:
      - .Name
      - .Config.Image
      - .State.Status
      - .HostConfig.RestartPolicy.Name
      - index .Config.Labels "com.docker.compose.project.working_dir"
    _fmt: "{{ _fields | map('regex_replace', '^', '{{') | map('regex_replace', '$', '}}') | join('|') }}"
    # The podman store's graph driver name and graph options, from `podman info` (the podman
    # probes only). Built the way _fmt is, and passed the same way, as an argv element.
    _store_fields:
      - .Store.GraphDriverName
      - .Store.GraphOptions
    _store_fmt: "{{ _store_fields | map('regex_replace', '^', '{{') | map('regex_replace', '$', '}}') | join('|') }}"
    # The account the dedicated-account probe runs as: linger_user when the host declares one,
    # else the runner account the runner hosts declare (github_runner_account). Those hosts
    # declare no linger_user, because a fresh runner deploy runs tasks/enable-linger.yml before that
    # account exists, and tasks/enable-linger.yml reads linger_user. Empty when neither is declared,
    # which skips the probe. A second service with its own dedicated account adds a generic host var
    # then.
    _probe_account: "{{ linger_user | default(github_runner_account | default('')) }}"
    # $1 = engine, $2 = inspect format, $3 = podman info format (podman probes only).
    _script: |
      ENGINE=$1 FMT=$2 STORE_FMT=$3
      command -v "$ENGINE" >/dev/null 2>&1 || { echo "(no $ENGINE)"; exit 0; }
      "$ENGINE" --version 2>/dev/null
      if [ "$ENGINE" = podman ]; then
        if store=$("$ENGINE" info --format "$STORE_FMT" 2>/dev/null); then echo "store: $store"; else echo "(podman info failed)"; fi
      fi
      ids=$("$ENGINE" ps -aq 2>/dev/null) || { echo "($ENGINE not usable here)"; exit 0; }
      [ -n "$ids" ] || { echo "(no containers)"; exit 0; }
      # shellcheck disable=SC2086
      "$ENGINE" inspect --format "$FMT" $ids

  pre_tasks:
    - name: "Require exactly one target host"
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: >-
          target_host must resolve to exactly one inventory host; it matched
          {{ ansible_play_hosts_all | length }} ({{ ansible_play_hosts_all | join(', ') }}).

  tasks:
    - name: "Rootless podman (the connecting user)"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'podman', _fmt, _store_fmt] }}"
      register: _rootless
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Rootless podman (the host's dedicated service account)"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'podman', _fmt, _store_fmt] }}"
      become: true
      become_user: "{{ _probe_account }}"
      register: _dedicated
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _probe_account | length > 0
        - _probe_account != (ansible_user | default(''))

    - name: "Rootful podman"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'podman', _fmt, _store_fmt] }}"
      become: true
      register: _rootful
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Docker"
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', '-c', _script, 'inspect', 'docker', _fmt] }}"
      become: true
      register: _docker
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Report"
      ansible.builtin.debug:
        msg:
          connecting_user: "{{ ansible_user | default('(inventory default)') }}"
          rootless_podman: "{{ _rootless.stdout_lines | default([]) + _rootless.stderr_lines | default([]) }}"
          rootless_podman_dedicated_account: >-
            {{ {_probe_account: _dedicated.stdout_lines | default([]) + _dedicated.stderr_lines | default([])}
               if (_dedicated is defined and _dedicated is not skipped) else 'none declared' }}
          not_seen: rootless containers of any other account
          rootful_podman: "{{ _rootful.stdout_lines | default([]) + _rootful.stderr_lines | default([]) }}"
          docker: "{{ _docker.stdout_lines | default([]) + _docker.stderr_lines | default([]) }}"
