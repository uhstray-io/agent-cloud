---
# Idempotent recovery when a local or production canary is interrupted.
- name: Pre-flight
  ansible.builtin.import_playbook: preflight-target-group.yml
  vars:
    preflight_group: o11y_svc
    preflight_group_expected: o11y_svc

- name: Verify the reviewed Dev checkout before restoration
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the controller checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_revision
      changed_when: false
      check_mode: false

    - name: Require the exact reviewed revision
      ansible.builtin.assert:
        that:
          - expected_repository_sha | default('') is match('^[0-9a-f]{40}$')
          - _controller_revision.stdout == expected_repository_sha
        fail_msg: "Semaphore checked out a different revision; no alert baseline was changed."

    - name: Read controller checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ playbook_dir | dirname | dirname }}"
      register: _controller_changes
      changed_when: false
      check_mode: false

    - name: Require a clean reviewed checkout
      ansible.builtin.assert:
        that: _controller_changes.stdout | length == 0
        fail_msg: "Candidate checkout has uncommitted files; no alert baseline was changed."

- name: Restore paused o11y alert provisioning
  hosts: o11y_svc
  gather_facts: false
  become: false
  vars:
    _engine: "{{ container_engine | default('podman') }}"
    _monorepo_dir: "{{ local_monorepo_dir | default('/home/' ~ (ansible_user | default('deploy')) ~ '/agent-cloud') }}"
    _deploy_dir: "{{ _monorepo_dir }}/{{ monorepo_deploy_path }}"
  tasks:
    - name: Require a real run before restoration
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: "The alert-baseline restore requires a real Semaphore run."

    - name: Place the reviewed checkout for local baseline rendering
      ansible.builtin.include_tasks: tasks/place-monorepo.yml
      when: local_mode | default(false) | bool

    - name: Restore and verify paused rules with no o11y contact point
      ansible.builtin.include_tasks: tasks/o11y-restore-alert-baseline.yml
