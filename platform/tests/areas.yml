# Lane selection for the Rust suite (plan 24, D3). Read by src/lanes.rs; `testsel` prints the
# nextest filterset a lane runs for the paths a change touches.
#
# Each changed path is classified in this order:
#   1. it matches `full`: the change selects everything (see src/lanes.rs for what each lane runs);
#   2. it matches the paths of one or more areas: those areas are selected;
#   3. it matches `ignore`: it selects nothing;
#   4. otherwise it is unclassified: the push and CI lanes run everything.
#
# The test modules are the files suite/<name>.rs (build.rs declares one per file). Every module
# must appear in exactly one list: under an area's tiers or `always`, here or in an area file
# areas.d/<area>.yml (see areas.d/README.md). The repository test
# every_suite_module_is_listed_exactly_once_in_areas_yml enforces it.

# Paths whose change runs every test.
full:
  - "platform/tests/**"
  - "platform/playbooks/tasks/**"
  - ".github/workflows/**"

# Paths that select no tests on their own.
ignore:
  - "**/*.md"
  - "plan/**"
  - "docs/**"

# The security set: selected in every lane (static modules only in the commit lane). `credential_leaks`
# scans the committed files for secrets and private addresses; `ledger`
# checks that every test docs/MISTAKES.md cites exists, and docs/** selects nothing on its own.
# `local_dev_inventory` holds the local-dev inventory template to localhost-only and no credentials.
# `yaml_load` checks that every tracked YAML file loads, and plan/** and docs/** hold YAML too.
# The four modules ported from BATS (plan 24, Phase 4) guard MISTAKES-cited rules, so they are here too.
# `rust_format` checks the suite files' formatting, which `cargo fmt` cannot reach (plan 24, D10). It is
# here so that check never depends on lane selection.
always:
  static: [approle_ttl, backup_credentials, become_password_resolution, configure_host_network, credential_leaks, deploy_playbooks_preflight, destroy_vm, host_access_gate, install_podman, ledger, ledger_citation_hook, local_dev_inventory, local_netbox, manage_github_runner_group, manage_secrets, rust_format, yaml_load]

# Tiers: static, unit, cli, http, playbook. Each lists suite module names.
areas:
  restart_policy:
    paths:
      - "platform/**/*compose*.yml"
      - "platform/**/*compose*.yaml"
      - "agents/**/*compose*.yml"
      - "agents/**/*compose*.yaml"
      - "platform/playbooks/tasks/enable-linger.yml"
      - "platform/playbooks/tasks/place-monorepo.yml"
    tiers:
      static: [restart_policy]

  bootstrap_12a:
    paths:
      - "platform/playbooks/**"
      - "platform/services/authentik/deployment/**"
      - "scripts/local-dev.sh"
      - "Makefile"
    tiers:
      static: [bootstrap_12a]

  local_dev_setup:
    paths:
      - ".gitignore"
      - "Brewfile"
    tiers:
      static: [local_dev_setup]

  common_sh:
    paths:
      - "platform/lib/common.sh"
    tiers:
      cli: [common_sh]

  install_qemu_guest_agent:
    paths:
      - "platform/playbooks/install-qemu-guest-agent.yml"
    tiers:
      static: [install_qemu_guest_agent]
      playbook: [install_qemu_guest_agent_playbook]

  makefile:
    paths:
      - "Makefile"
    tiers:
      static: [makefile]

  # The suite's own tests. A change under platform/tests/ hits `full`, which is checked before
  # any area, so this area names no paths: it only gives these modules their one listing.
  test_platform:
    paths: []
    tiers:
      static: [lanes, support]
      playbook: [support_playbook]
