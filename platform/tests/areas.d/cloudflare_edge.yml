# The Cloudflare edge's static tests (plan 24, Phase 4): the MCP edge rules and record, the Grafana
# apply gate, and the edge-dns step result. They read the Cloudflare OpenTofu root, the apply
# playbooks, the Semaphore templates and the o11y tasks file as text and YAML. The playbook tier runs
# the apply playbook's dry run against a missing or stale backend config. The remaining playbook-tier
# and guard-import tests stay in Python until they are ported.
paths:
  - "platform/infra/cloudflare/**"
  - "platform/playbooks/apply-cloudflare-tofu.yml"
  - "platform/playbooks/apply-cloudflare-grafana-api-tofu.yml"
  - "platform/semaphore/templates.yml"
  - "plan/development/openspec/changes/o11y-signal-labeling-profiling-alerting/tasks.md"
tiers:
  static: [cloudflare_mcp_edge, cloudflare_grafana_plan_guard, edge_dns_step_result]
  playbook: [cloudflare_dry_run_backend_playbook]
