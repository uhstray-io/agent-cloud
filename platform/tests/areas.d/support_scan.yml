# The static-scan helpers (repo::playbook_files, yaml::strings and yaml::tasks in src/lib.rs,
# AC-958): suite/support_scan.rs pins them on fixtures, suite/support_scan_fixture.rs runs
# playbook_files over a temporary tree (its order and refusals), and suite/support_scan_python.rs
# holds all three to playbook_yaml.py on every scanned repository file.
#
# paths: playbook YAML, so a playbook-only change runs the comparison with playbook_yaml.py,
# which reads repository content. Semaphore YAML, which the comparison also reads, is left out on
# purpose while no area claims it, as in support_lift.yml: a change there stays unclassified and
# push and CI run every test. templates.yml is listed because cloudflare_edge claims it
# (areas.d/README.md, "A test that reads beyond its area"). A change under platform/tests/** is a
# full trigger anyway.
paths:
  - "platform/playbooks/**/*.yml"
  - "platform/semaphore/templates.yml"
tiers:
  static: [support_scan]
  cli: [support_scan_fixture, support_scan_python]
