# The inspect-host-containers playbook's probe script: the podman store line, the note when `podman info`
# fails, Docker's probe printing no store line, and the store format the probes pass
# (suite/inspect_host_containers.rs, cli tier); and the dedicated-account probe's account and when
# (suite/inspect_host_containers_playbook.rs, playbook tier). A change to the playbook selects this area.
paths:
  - "platform/playbooks/inspect-host-containers.yml"
  # Files its playbook chain loads (lanes test every_file_a_playbook_chain_loads_selects_its_module).
  - "platform/playbooks/refuse-internal-extra-vars.yml"
  # ansible.cfg loads every filter plugin into every playbook run (lanes test
  # every_playbook_module_runs_when_ansible_cfg_or_a_filter_plugin_changes).
  - "platform/playbooks/filter_plugins/**"
tiers:
  cli: [inspect_host_containers]
  playbook: [inspect_host_containers_playbook]
