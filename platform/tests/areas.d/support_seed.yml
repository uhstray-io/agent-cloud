# The seed harness (`src/seed.rs`, the port of `platform/tests/seed_harness.py`, AC-950) and its
# tests. `support_seed` starts a fake server and no ansible run, so it is in the http tier, as
# `support_http` is; `support_seed_playbook` runs seed playbooks against that fake in the playbook
# tier.
#
# paths: the filter plugins. support_seed_playbook runs ansible-playbook from the repository root,
# whose ansible.cfg loads platform/playbooks/filter_plugins/, so a change there must select it
# (areas.d/README.md, "A test that reads beyond its area"). A change under platform/tests/** is a
# full trigger anyway.
paths:
  - "platform/playbooks/filter_plugins/**"
tiers:
  http: [support_seed]
  playbook: [support_seed_playbook]
