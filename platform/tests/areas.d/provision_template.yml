# The template play of provision-template.yml: the unchanged Ubuntu requests, the Windows refusals,
# the Windows seed deletion and the seed's contents (suite/provision_template_playbook.rs, playbook
# tier), and the answer-file inputs. A change to the playbook or the Windows files selects this area.
paths:
  - "platform/playbooks/provision-template.yml"
  - "platform/hypervisor/proxmox/windows/**"
  # Files the lifted play includes.
  - "platform/playbooks/tasks/emit-step-result.yml"
  - "platform/playbooks/tasks/assert-bao-transport.yml"
  # Files its playbook chain loads (lanes test every_file_a_playbook_chain_loads_selects_its_module).
  - "platform/playbooks/refuse-internal-extra-vars.yml"
  - "platform/playbooks/preflight-o11y-restore-target-inputs.yml"
  - "platform/playbooks/proxmox-validate.yml"
  - "platform/playbooks/vars/proxmox-cpu-model-flags.yml"
  # ansible.cfg loads every filter plugin into every playbook run (lanes test
  # every_playbook_module_runs_when_ansible_cfg_or_a_filter_plugin_changes).
  - "platform/playbooks/filter_plugins/**"
tiers:
  playbook: [provision_template_playbook]
