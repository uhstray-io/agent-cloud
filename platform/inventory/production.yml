---
# =============================================================================
# TEMPLATE, not production. Production is site-config/inventory/production.yml
# (the private repo Semaphore syncs). Group layout, variable placement and values
# differ between the two: check a production fact there, never here
# (docs/MISTAKES.md 1.14).
# =============================================================================
# Production inventory template — replace placeholders with actual values
# Real IPs managed in private site-config repo (site-config/inventory/production.yml)
# This file is committed to a PUBLIC repo — do not add real IPs or credentials
all:
  children:
    openbao_svc:
      hosts:
        "{{ openbao_host }}":
          service_name: openbao
          service_url: "http://{{ openbao_host }}:8200"
          health_path: "/v1/sys/health"
          health_status_codes: [200, 429, 472, 473, 501, 503]
          monorepo_deploy_path: platform/services/openbao/deployment

    semaphore_svc:
      hosts:
        "{{ semaphore_host }}":
          service_name: semaphore
          service_url: "http://{{ semaphore_host }}:3000"
          health_path: "/api/ping"
          monorepo_deploy_path: platform/services/semaphore/deployment

    netbox_svc:
      hosts:
        "{{ netbox_host }}":
          service_name: netbox
          service_url: "http://{{ netbox_host }}:8000"
          health_path: "/api/status/"
          monorepo_deploy_path: platform/services/netbox/deployment

    # Central reverse proxy.
    caddy_svc:
      hosts:
        "{{ caddy_host }}":
          service_name: caddy
          service_url: "https://{{ caddy_domain | default('caddy.example.com') }}"
          monorepo_deploy_path: platform/services/caddy/deployment
          container_engine: podman

    # console_svc — the Dispatch Console (plan 17). Its host and Phase 3 values live in site-config, never here.
    # Phase 3 read-only inventory is optional: an unset URL leaves that panel "unconfigured" and reads no token.
    #   console_netbox_url: <NetBox base URL>            # token: Provision NetBox Automation Token (profile console)
    #   console_proxmox_url: <Proxmox API base URL>      # token: Provision Console Proxmox Token (PVEAuditor)
    #   console_grafana_url: https://o11y.<zone>         # base for Grafana deep links; no credential
    #   console_proxmox_ca_pem: |                        # the PUBLIC CA certificate. REQUIRED by Provision Console Proxmox
    #                                                    # Token (it refuses to mint without it). Optional for the console
    #                                                    # runtime: unset means the runtime's default trust (not yet read)
    #     -----BEGIN CERTIFICATE-----
    #   console_tenants[].orgs[].sites[].netbox_site: <NetBox site slug>   # optional; one slug per site (D23)
    # The launch gate (D49) is optional. Undeclared, none of it renders or runs.
    #   console_launch_gate_url: https://<launch gate host name>   # https only; the name the console calls
    #   console_launch_gate_ip: <launch gate IPv4 address>         # production only: the address that name maps to
    #   console_launch_dev_variants: true                          # default true (D53): template names carry " (Dev)"

    # postiz — social-media scheduling and publishing. Five containers, only the
    # app publishing a port. Native OIDC to Authentik; the automation API is
    # reached over the public host, so no direct LAN rule is needed.
    # Real address + the *.uhstray.io URLs live in site-config.
    postiz_svc:
      hosts:
        "{{ postiz_host }}":
          service_name: postiz
          service_url: "http://{{ postiz_host }}:5000"
          # /api/, not /: nginx serves / from the frontend, so a probe on /
          # stays green over a dead backend (MISTAKES 2.19). A 404 from /api/
          # proves the backend bound; a 502 proves it did not.
          health_path: "/api/"
          monorepo_deploy_path: platform/services/postiz/deployment
          container_engine: podman

  vars:
    ansible_user: "{{ ansible_user }}"
    # become is controlled per-playbook, not inventory
    monorepo_repo: "https://github.com/uhstray-io/agent-cloud.git"
    openbao_addr: "http://{{ openbao_host }}:8200"
    target_node: "{{ proxmox_node | default('alphacentauri') }}"
    vm_storage: "{{ proxmox_vm_storage | default('vm-lvms') }}"
    iso_storage: "{{ proxmox_iso_storage | default('SharedISOs') }}"
    template_vmid: 9000
