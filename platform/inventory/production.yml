---
# =============================================================================
# TEMPLATE, not production. Production is site-config/inventory/production.yml
# (the private repo Semaphore syncs). Group layout, variable placement and values
# differ between the two: check a production fact there, never here
# (docs/MISTAKES.md 1.14).
# =============================================================================
# Production inventory template — replace placeholders with actual values
# Real IPs managed in private site-config repo (site-config/inventory/production.yml)
# This file is committed to a PUBLIC repo — do not add real IPs or credentials
all:
  children:
    openbao_svc:
      hosts:
        "{{ openbao_host }}":
          service_name: openbao
          service_url: "http://{{ openbao_host }}:8200"
          health_path: "/v1/sys/health"
          health_status_codes: [200, 429, 472, 473, 501, 503]
          monorepo_deploy_path: platform/services/openbao/deployment

    nocodb_svc:
      hosts:
        "{{ nocodb_host }}":
          service_name: nocodb
          service_url: "http://{{ nocodb_host }}:8181"
          health_path: "/api/v1/health"
          monorepo_deploy_path: platform/services/nocodb/deployment

    n8n_svc:
      hosts:
        "{{ n8n_host }}":
          service_name: n8n
          service_url: "http://{{ n8n_host }}:5678"
          health_path: "/healthz"
          monorepo_deploy_path: platform/services/n8n/deployment

    semaphore_svc:
      hosts:
        "{{ semaphore_host }}":
          service_name: semaphore
          service_url: "http://{{ semaphore_host }}:3000"
          health_path: "/api/ping"
          monorepo_deploy_path: platform/services/semaphore/deployment

    netbox_svc:
      hosts:
        "{{ netbox_host }}":
          service_name: netbox
          service_url: "http://{{ netbox_host }}:8000"
          health_path: "/api/status/"
          monorepo_deploy_path: platform/services/netbox/deployment

    nemoclaw_svc:
      hosts:
        "{{ nemoclaw_host }}":
          service_name: nemoclaw
          monorepo_deploy_path: agents/nemoclaw/deployment

    # Central reverse proxy. uhhcraft's deploy renders + distributes a Caddy
    # fragment here (Phase 5) only when this group is non-empty.
    caddy_svc:
      hosts:
        "{{ caddy_host }}":
          service_name: caddy
          service_url: "https://{{ caddy_domain | default('caddy.example.com') }}"
          monorepo_deploy_path: platform/services/caddy/deployment
          container_engine: podman

    # console_svc — the Dispatch Console (plan 17). Its host and Phase 3 values live in site-config, never here.
    # Phase 3 read-only inventory is optional: an unset URL leaves that panel "unconfigured" and reads no token.
    #   console_netbox_url: <NetBox base URL>            # token: Provision NetBox Automation Token (profile console)
    #   console_proxmox_url: <Proxmox API base URL>      # token: Provision Console Proxmox Token (PVEAuditor)
    #   console_grafana_url: https://o11y.<zone>         # base for Grafana deep links; no credential
    #   console_proxmox_ca_pem: |                        # the PUBLIC CA certificate. REQUIRED by Provision Console Proxmox
    #                                                    # Token (it refuses to mint without it). Optional for the console
    #                                                    # runtime: unset means the runtime's default trust (not yet read)
    #     -----BEGIN CERTIFICATE-----
    #   console_tenants[].orgs[].sites[].netbox_site: <NetBox site slug>   # optional; one slug per site (D23)
    # The launch gate (D49) is optional. Undeclared, none of it renders or runs.
    #   console_launch_gate_url: https://<launch gate host name>   # https only; the name the console calls
    #   console_launch_gate_ip: <launch gate IPv4 address>         # production only: the address that name maps to
    #   console_launch_dev_variants: true                          # default true (D53): template names carry " (Dev)"

    # postiz — social-media scheduling and publishing. Five containers, only the
    # app publishing a port. Native OIDC to Authentik; the automation API is
    # reached over the public host, so no direct LAN rule is needed.
    # Real address + the *.uhstray.io URLs live in site-config.
    postiz_svc:
      hosts:
        "{{ postiz_host }}":
          service_name: postiz
          service_url: "http://{{ postiz_host }}:5000"
          # /api/, not /: nginx serves / from the frontend, so a probe on /
          # stays green over a dead backend (MISTAKES 2.19). A 404 from /api/
          # proves the backend bound; a 502 proves it did not.
          health_path: "/api/"
          monorepo_deploy_path: platform/services/postiz/deployment
          container_engine: podman

    uhhcraft_svc:
      hosts:
        "{{ uhhcraft_host }}":
          service_name: uhhcraft
          service_url: "https://{{ uhhcraft_domain | default('uhhcraft.example.com') }}"
          health_path: "/healthz"
          monorepo_deploy_path: platform/services/uhhcraft/deployment
          container_engine: podman
          # Non-secret config consumed by env.j2 + the Phase 5 caddy-site render.
          # Real hosts resolve from site-config; these are placeholder templates.
          uhhcraft_ai_image_url: "http://{{ inference_comfyui_host }}:8189"
          uhhcraft_ai_3d_url: "http://{{ inference_hunyuan3d_host }}:8001"
          inference_comfyui_minio_upstream: "{{ inference_comfyui_host }}:9000"
          inference_hunyuan3d_minio_upstream: "{{ inference_hunyuan3d_host }}:9000"

    inference_comfyui_svc:
      hosts:
        "{{ inference_comfyui_host }}":
          service_name: inference-comfyui
          service_url: "http://{{ inference_comfyui_host }}:8189"
          health_path: "/health"
          monorepo_deploy_path: platform/services/inference-comfyui/deployment
          container_engine: podman

    inference_hunyuan3d_svc:
      hosts:
        "{{ inference_hunyuan3d_host }}":
          service_name: inference-hunyuan3d
          service_url: "http://{{ inference_hunyuan3d_host }}:8001"
          health_path: "/health"
          monorepo_deploy_path: platform/services/inference-hunyuan3d/deployment
          container_engine: podman
          # Per-host: where Hunyuan3D-2-mini weights live on disk. Literal
          # default — site-config overrides this host var directly when the GPU
          # box stores them elsewhere. (Not `{{ hunyuan3d_weights_dir | default }}`
          # — a var defaulting to itself recurses.)
          hunyuan3d_weights_dir: "/srv/hunyuan3d/weights"

    # weft — uhstray's agent harness (plan/development/23-weft-service.md). weft_svc holds every
    # weft host, so tooling that walks *_svc groups finds them; the deploys and timers target the
    # four groups under it, and the staging pair's names are exactly weft_staging_door and
    # weft_staging_workspace (Follow weft main (Dev) reads those two and does nothing without
    # them). One front door per environment; workspaces in rollout order, uhstray's own first.
    # Every value is site-config's, and each shape is in platform/services/weft/deployment/README.md:
    #   each group:       weft_environment (rack | staging), weft_domain,
    #                     weft_secret_root (weft | weft-staging)
    #   workspace groups: weft_public_address
    #   each workspace:   weft_workspace_id, weft_workspace_name, weft_voice_udp, weft_providers,
    #                     weft_default_provider, weft_daily_tokens, weft_tracker_bot_login, weft_clones
    #   weft_door:        weft_discord_guild_id, weft_discord_channel_id
    #   all:              weft_release_approver
    weft_svc:
      children:
        weft_door:
          hosts:
            "{{ weft_door_host }}":
              service_name: weft
              service_url: "https://{{ weft_domain }}"
              health_path: "/"
              monorepo_deploy_path: platform/services/weft/deployment
              container_engine: podman
        weft_workspaces:
          hosts:
            "{{ weft_workspace_host }}":
              service_name: weft
              service_url: "https://{{ weft_workspace_name }}.{{ weft_domain }}"
              # The board's one unauthenticated route; it names the workspace's id (known_as).
              health_path: "/api/workspace"
              monorepo_deploy_path: platform/services/weft/deployment
              container_engine: podman
        weft_staging_door:
          hosts:
            "{{ weft_staging_door_host }}":
              service_name: weft
              service_url: "https://{{ weft_domain }}"
              health_path: "/"
              monorepo_deploy_path: platform/services/weft/deployment
              container_engine: podman
        weft_staging_workspace:
          hosts:
            "{{ weft_staging_workspace_host }}":
              service_name: weft
              service_url: "https://{{ weft_workspace_name }}.{{ weft_domain }}"
              health_path: "/api/workspace"
              monorepo_deploy_path: platform/services/weft/deployment
              container_engine: podman

  vars:
    ansible_user: "{{ ansible_user }}"
    # become is controlled per-playbook, not inventory
    monorepo_repo: "https://github.com/uhstray-io/agent-cloud.git"
    openbao_addr: "http://{{ openbao_host }}:8200"
    target_node: "{{ proxmox_node | default('alphacentauri') }}"
    vm_storage: "{{ proxmox_vm_storage | default('vm-lvms') }}"
    iso_storage: "{{ proxmox_iso_storage | default('SharedISOs') }}"
    template_vmid: 9000
