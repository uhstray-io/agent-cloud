# Authentik blueprint — Plane OIDC (OAuth2) provider + application.
# Config-as-code, applied by the worker. The client_secret is injected from the worker's env
# (PLANE_OIDC_CLIENT_SECRET, sourced from OpenBao via env.j2), so no secret lives in git. Plane
# reads the SAME secret via manage-secrets _shared_reads and writes it into its instance
# configuration (configure_instance.py). Plan: plan/development/16-plane-work-management.md.
#
# Shape, from Plane's own OIDC documentation (developer-docs self-hosting/govern/oidc-sso.md):
#  - Callback <public-url>/auth/oidc/callback/, logout <public-url>/auth/oidc/logout/. The
#    redirect below is Strict on the callback.
#  - Plane requires the `email` claim (userinfo) to sign a user in, so the email scope mapping
#    is load-bearing; profile carries the name and the `groups` claim.
#  - Self sign-up is off (invitation-only), so a person can sign in only once a workspace
#    invitation exists for their email; OIDC alone never creates an account.
version: 1
metadata:
  name: agent-cloud - plane OIDC
context:
  # LOCAL-DEV defaults; production sets plane_redirect_uri / plane_launch_url on the authentik
  # host in site-config (app-catalog.yml prod_required).
  plane_redirect: "{{ plane_redirect_uri | default('https://plane.agent-cloud.test:8443/auth/oidc/callback/') }}"
  plane_launch: "{{ plane_launch_url | default('https://plane.agent-cloud.test:8443/') }}"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-plane
    identifiers:
      name: plane
    attrs:
      client_type: confidential
      client_id: plane
      client_secret: !Env PLANE_OIDC_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Context plane_redirect
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: plane
    attrs:
      name: Plane
      provider: !KeyOf provider-plane
      meta_launch_url: !Context plane_launch
      open_in_new_tab: true
