# Authentik blueprint — postiz OIDC (OAuth2) provider + application.
# config-as-code, applied by the worker. The client_secret is injected from the
# worker's env (POSTIZ_OIDC_CLIENT_SECRET, sourced from OpenBao via env.j2) so no
# secret lives in git. postiz reads the SAME secret via manage-secrets
# _shared_reads. Plan: plan/development/14-postiz-social-publishing.md.
#
# Three upstream behaviours dictate the shape of this file. All three were read
# from postiz's own provider implementation, not from its documentation:
#
#  1. THE REDIRECT PATH IS NOT OURS TO CHOOSE. postiz builds the redirect as
#     `${FRONTEND_URL}/settings` in both the authorization-link and the
#     token-exchange call. There is no configurable callback path, so the Strict
#     redirect below must be exactly <public-url>/settings — not the
#     /api/oidc/callback/<slug> shape tududi uses.
#  2. THE SCOPE IS FIXED at `openid profile email` in postiz's code. The scope
#     mappings below must therefore include all three; postiz cannot be asked to
#     request fewer or more.
#  3. IDENTITY COMES FROM /userinfo, NOT AN ID TOKEN. postiz calls the userinfo
#     endpoint with the access token and reads the `email` and `sub` claims. So
#     the `email` scope mapping is LOAD-BEARING — without it postiz gets no email
#     and sign-in fails with no account created. Conversely the signing key is
#     irrelevant to this flow (no id_token is ever validated); RS256 is set only
#     for consistency with the other providers here.
#
# Unlike tududi there is no provider-slug coupling: postiz sends no slug, so the
# application slug below only affects the Authentik-side URL and launch tile.
version: 1
metadata:
  name: agent-cloud - postiz OIDC
context:
  # Rendered from inventory at deploy (deploy-authentik.yml templates this file)
  # so the content is env-specific and Authentik re-applies it on change. The
  # defaults are LOCAL-DEV ONLY — promotion to prod requires postiz_redirect_uri
  # and postiz_launch_url in site-config inventory, which the deploy's prod guard
  # asserts are set and not still pointing at agent-cloud.test.
  #
  # The redirect MUST equal <postiz_public_url>/settings (see note 1 above).
  postiz_redirect: "{{ postiz_redirect_uri | default('https://postiz.agent-cloud.test:8443/settings') }}"
  postiz_launch: "{{ postiz_launch_url | default('https://postiz.agent-cloud.test:8443/') }}"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-postiz
    identifiers:
      name: postiz
    attrs:
      client_type: confidential
      client_id: postiz
      client_secret: !Env POSTIZ_OIDC_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Context postiz_redirect
      property_mappings:
        # All three are required by postiz's hardcoded scope request; `email` in
        # particular is what /userinfo must return for sign-in to succeed.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: postiz
    attrs:
      name: Postiz
      provider: !KeyOf provider-postiz
      meta_launch_url: !Context postiz_launch
      open_in_new_tab: true
