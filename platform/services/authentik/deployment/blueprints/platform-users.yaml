# Authentik blueprint — named platform users (config-as-code, idempotent).
#
# Each entry is an authentik_core.user reconciled by the worker on every deploy
# (re-applying converges — never duplicates), mirroring stray-admin.yaml. The
# IDENTITY of each user — username, display name, email — is parameterized via
# !Env so no real person's name or address lives in this PUBLIC repo (extends
# the email-privacy pattern stray-admin.yaml already uses). The real values come
# from the worker env, templated by deploy-authentik env.j2 from the private
# site-config; the defaults here are non-PII placeholders for local-dev.
#
# Group membership is the RBAC contract (platform-groups.yaml): the access gate
# (zz-sso-bindings) admits the group, and each SSO'd service maps the groups
# claim to its own role.
#
# Initial passwords are OpenBao-generated + reused (stable across redeploys, so a
# re-apply never resets a login). FUTURE: migrate to Authentik enrollment/
# recovery links once prod SMTP is configured (D2) — then drop the *_password.
# Plan: plan/development/12-rbac-user-provisioning.md.
#
# To add a user: append an entry here, add <name>_password to deploy-authentik's
# _secret_definitions, and expose <NAME>_USERNAME/_NAME/_EMAIL/_PASSWORD in
# env.j2 (real values set in site-config).
version: 1
metadata:
  name: agent-cloud - platform users
entries:
  # User 1 — full admin, member of platform-admins (top role in every app,
  # identical tier to stray). Real identity via site-config (WISWARD_*).
  - model: authentik_core.user
    identifiers:
      username: !Env [WISWARD_USERNAME, "wisward"]
    attrs:
      name: !Env [WISWARD_NAME, "Platform Admin"]
      email: !Env [WISWARD_EMAIL, "wisward@agent-cloud.test"]
      is_active: true
      path: users
      password: !Env WISWARD_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, platform-admins]]

  # User 2 — BUSINESS tier only (platform-business): rw ERPNext, and admitted to
  # every tier-`member` app by the platform-member access gate, which is what
  # grants tududi. Real identity via site-config (ANDREW_*).
  #
  # Narrowed from platform-developers + platform-business to business alone on
  # 2026-08-26, at the operator's direction. That REMOVES the developer tier — a
  # real reduction in access, recorded here rather than left to be inferred from
  # a diff. Re-adding is one !Find line.
  - model: authentik_core.user
    identifiers:
      username: !Env [ANDREW_USERNAME, "business"]
    attrs:
      name: !Env [ANDREW_NAME, "Platform Business User"]
      email: !Env [ANDREW_EMAIL, "business@agent-cloud.test"]
      is_active: true
      path: users
      password: !Env ANDREW_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, platform-business]]

  # User 3 — full admin, member of platform-admins (Authentik superuser group;
  # top role in every SSO'd app, same tier as agent-cloud-admin and stray). Real
  # identity via site-config (JACOB_*).
  - model: authentik_core.user
    identifiers:
      username: !Env [JACOB_USERNAME, "jacob"]
    attrs:
      name: !Env [JACOB_NAME, "Platform Admin 2"]
      email: !Env [JACOB_EMAIL, "jacob@agent-cloud.test"]
      is_active: true
      path: users
      password: !Env JACOB_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, platform-admins]]

  # ── RETIRED ACCOUNTS ────────────────────────────────────────────────────────
  # `state: absent` DELETES the account Authentik matches on `identifiers`. This is
  # the deletion mechanism for this platform: declared, reviewable, and applied by
  # the same converging run as everything else — not a one-off API call that leaves
  # no record of who removed what or why.
  #
  # Why it is needed at all: a user is keyed on `username`, so changing someone's
  # username does not RENAME them, it declares a second account. The first one
  # keeps existing, keeps its group memberships, and keeps working. Retiring it has
  # to be stated.
  #
  # SAFETY. The default is a username that is never created by anything, so an
  # unset variable deletes nothing — the failure mode of a delete-by-default entry
  # is not one this platform should carry. Re-applying is idempotent: absent stays
  # absent.
  #
  # Adding one: append here, expose <NAME>_LEGACY_USERNAME in env.j2, set the real
  # value in site-config. A retired username must never equal an ACTIVE one above —
  # the same run would then create and delete the same account, and which of those
  # wins is entry order, not intent. platform/tests/test_authentik_users.bats
  # refuses that arrangement.

  # Andrew's pre-2026-08-26 account, superseded when usernames became email
  # addresses. Retired rather than left in place because it carries the
  # platform-developers tier that the replacement account deliberately drops —
  # leaving it would silently preserve the access the change exists to remove.
  - model: authentik_core.user
    state: absent
    identifiers:
      username: !Env [ANDREW_LEGACY_USERNAME, "retired-account-never-created"]
