# Authentik blueprint — Dispatch Console OIDC (OAuth2) provider + application.
# config-as-code, applied by the worker. The client_secret is injected from the
# worker's env (CONSOLE_OIDC_CLIENT_SECRET, sourced from OpenBao via env.j2) so no
# secret lives in git. The console reads the SAME secret via manage-secrets
# _shared_reads (its deploy playbook, added with the console deploy).
#
# Slug consistency: the application slug, the provider name and the client_id are
# all "console". The signing key is RS256 (the Authentik Self-signed Certificate
# default). Callback: {BASE_URL}/auth/callback (the console's own axum route).
version: 1
metadata:
  name: agent-cloud - console OIDC
context:
  # Rendered from inventory at deploy (deploy-authentik.yml templates this file) so
  # the content is env-specific and Authentik re-applies it. Default is local-dev.
  console_redirect: "{{ console_redirect_uri | default('https://console.agent-cloud.test:8443/auth/callback') }}"
  console_launch: "{{ console_launch_url | default('https://console.agent-cloud.test:8443/') }}"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-console
    identifiers:
      name: console
    attrs:
      client_type: confidential
      client_id: console
      client_secret: !Env CONSOLE_OIDC_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Context console_redirect
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        # profile carries the `groups` claim (same as agentgateway-oidc.yaml).
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: console
    attrs:
      name: Dispatch Console
      provider: !KeyOf provider-console
      meta_launch_url: !Context console_launch
      open_in_new_tab: true
  # ── Dispatch Console directory reader (plan 17 D28, task 8.2a) ──────────────
  # A VIEW-ONLY API identity the console uses to read the Authentik user and group
  # directory (its people and groups views). It is deliberately NOT platform-admins and
  # NOT superuser: the role grants authentik_core.view_user and authentik_core.view_group
  # and nothing else, so its token can read the directory and cannot create, change or
  # delete an account, group or token. The deploy's verify (templates/verify-users.py.j2)
  # proves the directory read is 200, a write is refused with 403, and this account is
  # neither superuser nor in platform-admins. The token value is CONSOLE_DIRECTORY_TOKEN,
  # from OpenBao (secret/services/authentik:console_directory_token) via env.j2.
  - model: authentik_rbac.role
    id: console-directory-reader-role
    identifiers:
      name: console-directory-reader
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.view_group
  - model: authentik_core.group
    id: console-directory-readers-group
    identifiers:
      name: console-directory-readers
    attrs:
      is_superuser: false
      # parent: null is declared on purpose. A re-apply writes each declared attribute, so this
      # resets a parent set by hand in the UI. is_superuser is resolved over every ancestor group
      # (User.all_groups, authentik/core/models.py), so a superuser parent would make the reader a
      # superuser. An attribute left undeclared is not reset, which is why the null has to be here.
      parent: null
      roles:
        - !KeyOf console-directory-reader-role
  - model: authentik_core.user
    id: console-directory-user
    identifiers:
      username: svc-console-directory
    attrs:
      name: Dispatch Console directory reader
      type: service_account
      path: users/service-accounts
      is_active: true
      groups:
        - !KeyOf console-directory-readers-group
  - model: authentik_core.token
    identifiers:
      identifier: console-directory-reader-api-token
    attrs:
      user: !KeyOf console-directory-user
      intent: api
      # The value is the OpenBao-managed CONSOLE_DIRECTORY_TOKEN in the worker env.
      key: !Env CONSOLE_DIRECTORY_TOKEN
      expiring: false
      description: Dispatch Console read-only directory token (managed in OpenBao)
