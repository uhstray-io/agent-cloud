# Authentik blueprint — tududi OIDC (OAuth2) provider + application.
# config-as-code, applied by the worker. The client_secret is injected from the
# worker's env (TUDUDI_OIDC_CLIENT_SECRET, sourced from OpenBao via env.j2) so no
# secret lives in git. tududi reads the SAME secret via manage-secrets
# _shared_reads. Plan: plan/development/11-tududi-honcho-deployment.md.
#
# Slug consistency (per the tududi Authentik doc): the application slug, tududi's
# OIDC_PROVIDER_SLUG, and the OIDC callback path are all "tududi". The signing
# key is RS256 (the Authentik Self-signed Certificate default) — tududi rejects
# ES256 and does not use PKCE. Callback: {BASE_URL}/api/oidc/callback/tududi.
version: 1
metadata:
  name: agent-cloud - tududi OIDC
context:
  # Rendered from inventory at deploy (deploy-authentik.yml templates this file) so
  # the content is env-specific and Authentik re-applies it. Default is local-dev.
  # tududi's OIDC callback is served at BASE_URL/api/oidc/callback/tududi.
  tududi_redirect: "{{ tududi_redirect_uri | default('https://todo.agent-cloud.test:8443/api/oidc/callback/tududi') }}"
  tududi_launch: "{{ tududi_launch_url | default('https://todo.agent-cloud.test:8443/') }}"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-tududi
    identifiers:
      name: tududi
    attrs:
      client_type: confidential
      client_id: tududi
      client_secret: !Env TUDUDI_OIDC_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Context tududi_redirect
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: tududi
    attrs:
      name: Tududi
      provider: !KeyOf provider-tududi
      meta_launch_url: !Context tududi_launch
      open_in_new_tab: true
