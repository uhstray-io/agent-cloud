# Slim overlay (local_mode) — appended by platform/lib/common.sh:compose().
#
# Carries what an overlay can add: a memory cap, the SELinux opt (the podman-machine VM enforces
# SELinux on the bind mounts of ./app, ./config.json and ./certs), the extra `local-dev` network so
# a local caller reaches the gate by its container name, the TLS name as a network alias on that
# network, and the uid the local process runs as. The ports come from the base file: this
# overlay does not republish them.
#
# security_opt: this overlay adds label=disable and names nothing else. The base keeps
# no-new-privileges:true. Checked with `podman-compose config` on compose.yml plus this file, under
# podman-compose 1.0.6 (apt's release on Linux hosts unless a playbook opts into another) and 1.6.0 (the
# Plane opt-in): both append the overlay's list to the base list, so both print no-new-privileges:true
# once and label=disable once. Re-check the rendered output if the pinned release changes.
#
# Local-dev only: production never loads this file (deploy.sh loads compose.prod.yml instead).

networks:
  # podman-compose requires every referenced network declared, incl. default.
  default:
  local-dev:
    external: true

services:
  launch-gate:
    mem_limit: 128m
    # The local consumer that writes certs/ is the Semaphore container, which runs as uid 1001 gid 0
    # (measured in a throwaway container on docker.io/semaphoreui/semaphore:v2.19.11). The leaf key is written
    # 0600 under that uid, and cap_drop ALL means root inside the gate cannot read it, so the process runs as
    # that uid. Production maps uid 1000 with compose.prod.yml instead.
    user: "1001:0"
    security_opt:
      - label=disable
    networks:
      default:
      local-dev:
        # The TLS name (env.j2 LAUNCH_GATE_TLS_NAME) as a network alias, so deploy-launch-gate.yml's Phase 3
        # probes reach the listener on 8443 by name from the Semaphore container. The alias exists only on the
        # local-dev network; the base file names no alias.
        aliases:
          - ${LAUNCH_GATE_TLS_NAME:?set by the deploy}
