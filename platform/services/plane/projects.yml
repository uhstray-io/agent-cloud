# projects.yml — repository -> Plane project declaration for the OpenSpec sync
# (sync-plane-projects, plan/development/openspec/changes/deploy-plane-work-management, task 4.1).
#
# One entry per Plane project. Every entry is created as a project; an enabled one also has its
# repository's OpenSpec changes read with platform/services/plane/lib/openspec_to_plane.py, which
# creates modules and work items. It is create-only: an item that already exists is never
# changed, so status, assignees and labels set in Plane survive a re-run.
#
# Fields:
#   repo        owner/name of the repository whose OpenSpec changes are read; omitted for a project
#               with no repository (its external_id is then project:<name>, and it cannot be enabled)
#   identifier  Plane project identifier: at most 10 characters, uppercase letters and digits only
#   name        Plane project name; the repository name unless a different project name was chosen
#   private     GitHub visibility of the repository, as checked with gh on 2026-10-29
#   enabled     whether the repository's OpenSpec tasks are read; false still creates the project.
#               A private repository stays false until the plane-compose GitHub App exists (task 4.4)
#
# Keys are permanent: the repo is the external_id of the project and of every module and item
# beneath it. Renaming a repo entry either stops the sync (its identifier is still taken) or, with a
# new identifier, creates a second project whose items duplicate the old one's.
#
# Every name here is already public in this repository's plan documents. A project whose name must
# stay private is declared in site-config instead, as `plane_projects_private` on the plane_svc host,
# in the same shape; the sync merges the two lists. Nothing here is a credential or an address.
plane_projects:
  - repo: uhstray-io/huhhb
    identifier: HUHHB
    name: huhhb
    private: false
    enabled: true
  - repo: uhstray-io/agent-cloud
    identifier: AC
    name: agent-cloud
    private: false
    enabled: true
  - repo: uhstray-io/zerds
    identifier: ZERDS
    name: zerds
    private: true
    enabled: false
  - repo: uhstray-io/zerds-website
    identifier: ZWEB
    name: zerds-website
    private: true
    enabled: false
  - repo: uhstray-io/weft
    identifier: WEFT
    name: weft
    private: true
    enabled: false
  - repo: uhstray-io/atlas
    identifier: ATLAS
    name: atlas
    private: true
    enabled: false
  - repo: uhstray-io/scientific-business
    identifier: SCIBIZ
    name: scientific-business
    private: true
    enabled: false
  - repo: uhstray-io/site-config
    identifier: SITECFG
    name: site-config
    private: true
    enabled: false
  # The organisation's website (Joseph, 2026-11-09: the project is named uhstray-io-website).
  - repo: uhstray-io/www
    identifier: WWW
    name: uhstray-io-website
    private: true
    enabled: false
