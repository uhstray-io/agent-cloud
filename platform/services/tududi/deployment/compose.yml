# tududi — self-hosted to-do app (Podman-compatible compose).
#
# A single rootless container backed by SQLite (named volumes). Ansible's
# deploy-tududi.yml templates .env from OpenBao (session secret + break-glass
# admin) and shared-reads the OIDC client secret from authentik BEFORE this
# stack starts. deploy.sh is container lifecycle only — no secret generation.
#
# Behind central Caddy: tududi serves plain HTTP on :3002 (Caddy terminates TLS;
# TUDUDI_TRUST_PROXY=true so SSO sessions survive the proxy). Ports are
# env-parameterized (compose overlays merge ports append-only, so the local
# loopback shift lives in .env, not compose.local.yml).
# Plan: plan/development/11-tududi-honcho-deployment.md (Service A — tududi).

name: tududi

services:
  tududi:
    image: ${TUDUDI_IMAGE:-docker.io/chrisvel/tududi:latest}
    container_name: tududi
    restart: always
    env_file:
      - .env
    ports:
      # Loopback-only by default; central Caddy proxies in. Prod sets a host
      # bind + port via .env (TUDUDI_BIND/TUDUDI_PORT) so the Caddy VM reaches it.
      - "${TUDUDI_BIND:-127.0.0.1}:${TUDUDI_PORT:-3002}:3002"
    volumes:
      # SQLite database + auto-backups, and user uploads — both persisted.
      - tududi-db:/app/backend/db
      - tududi-uploads:/app/backend/uploads
    healthcheck:
      # CMD-SHELL, not exec form: podman-compose mis-quotes ["CMD",...] lists.
      # node is guaranteed in the (Node-based) image, so no curl/wget assumption.
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://127.0.0.1:3002/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  tududi-db:
  tududi-uploads:
