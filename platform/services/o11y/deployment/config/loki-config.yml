# Loki single-binary config (committed config-as-code). Mounted read-only.
# Local-dev: filesystem storage under the loki-data volume, in-memory ring,
# no auth (behind Caddy + the local network). Plan: O11Y-DEPLOYMENT.md.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Explicit equivalents of Loki v3.3.2 ingestion defaults; aggregate caps,
  # not per-target budgets. Keep rollout gated on measured baselines.
  ingestion_rate_strategy: global
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  max_global_streams_per_user: 5000
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  max_line_size: 256KB
  max_label_names_per_series: 15
  retention_period: ${O11Y_LOKI_RETENTION:-7d}
  reject_old_samples: true
  reject_old_samples_max_age: ${O11Y_LOKI_RETENTION:-7d}
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
