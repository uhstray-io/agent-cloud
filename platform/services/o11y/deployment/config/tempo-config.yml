# Single-node Tempo. Bounded local trace retention; no port published from
# Tempo itself. Alloy is the sole OTLP ingress and Grafana queries internally.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: ${O11Y_TEMPO_RETENTION:-168h}
usage_report:
  reporting_enabled: false
