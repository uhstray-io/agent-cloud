services:
  journal-collector:
    volumes:
      - type: bind
        source: ./certs/o11y-journal
        target: /certs/journal-client
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/step-ca-bundle.crt
        target: /certs/step-ca-bundle.crt
        read_only: true
        bind:
          create_host_path: false
