# OPA — Open Policy Agent: the cross-service authorization decision point of the
# Guardrail Layer (OpenBao owns credentials, Kyverno owns k8s admission, OPA owns
# everything else — "are you allowed to do this?"). Policies are Rego under
# ./policies, mounted read-only (policy-as-code). Access: the host firewall admits the
# callers, and --authorization=basic with policies/system/authz.rego admits only the
# decision API and /health (everything else answers 401). deploy.sh is
# container-lifecycle only. Plan: plan/development/03-guardrails-governance.md (OPA section).
name: opa

services:
  opa:
    # -static = multi-arch (incl. arm64 for the podman-machine VM) distroless
    # build; the plain tag is amd64-only and crashes under emulation.
    image: ${OPA_IMAGE:-docker.io/openpolicyagent/opa:1.0.0-static}
    container_name: opa
    restart: always
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --diagnostic-addr=0.0.0.0:8282
      - --log-level=${OPA_LOG_LEVEL:-info}
      # Decision + status logs to stdout -> Docker/Alloy -> Loki (the missing
      # "unified audit of agent decisions"). Static config only; dynamic context
      # comes from each query's `input`.
      - --set=decision_logs.console=true
      - --set=status.console=true
      # Authorization: OPA asks data.system.authz.allow (policies/system/authz.rego) about every
      # request on this listener and answers 401 unless it is true. Without it, any caller the
      # firewall admits can read the data documents and query arbitrary paths.
      - --authorization=basic
      # Load ./policies as a bundle: OPA then owns every data and policy path and refuses
      # PUT/PATCH/DELETE on /v1/data and /v1/policies (HTTP 400 once the authorization policy
      # above admits the request; the authorization policy refuses them first, with 401).
      # Without it any caller that reaches the port can rewrite the guardrail; the :ro mount
      # protects only the files.
      - --bundle
      - /policies
    ports:
      # Loopback by default (prod can widen); agents on the same network reach it
      # as opa:8181. The published host port is for diagnostics + smoke checks —
      # 8281 by default (8181 is NocoDB's local bind). deploy-opa.yml passes
      # OPA_BIND/OPA_PORT from inventory.
      - "${OPA_BIND:-127.0.0.1}:${OPA_PORT:-8281}:8181"
    volumes:
      - ./policies:/policies:ro
    # No compose healthcheck: the OPA image is distroless (no shell/wget). The
    # deploy playbook verifies GET /health on :8181 instead.
