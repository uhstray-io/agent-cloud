---
# setup-templates.yml — Apply Semaphore task templates from templates.yml
#
# Reads templates.yml and creates/updates task templates via Semaphore API.
# Idempotent: existing templates updated, new ones created.
#
# IT DOES NOT DELETE. Matching is by name — PUT when the name exists, POST when it does
# not — so REMOVING a template from templates.yml does not remove it from Semaphore. The
# declaration stops describing it and it keeps running, which is worse than an orphan: it
# is an undeclared template that a later reader has no record of, still bound to whatever
# repository record it had.
#
# Consequence to know about: a template created for temporary validation (say, bound to a
# feature-branch repository record) must be deleted from Semaphore explicitly when its
# declaration is removed, and before the repository record it points at is deleted —
# otherwise its every run fails on a checkout against a record that no longer exists.
#
# Prune support was deliberately NOT added here. Semaphore currently holds
# hand-made templates that no declaration covers (e.g. the "SSH Distribute: ... (temp)"
# entries), so a prune pass would delete work this file has no knowledge of. Making that
# safe means first bringing every existing template under declaration — worth doing, and
# larger than this playbook.
#
# Usage:
#   SEMAPHORE_URL=http://... SEMAPHORE_TOKEN=... ansible-playbook setup-templates.yml
#
# Or via Semaphore environment variables.

- name: "Apply Semaphore task templates"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _semaphore_url: "{{ lookup('env', 'SEMAPHORE_URL') }}"
    _token: "{{ lookup('env', 'SEMAPHORE_TOKEN') }}"
    # Defaults match the production instance; the local-dev bootstrap overrides
    # them for the fresh local Semaphore (LOCAL-DEV-DEPLOYMENT.md Phase 0B).
    _project_id: "{{ semaphore_project_id | default(1) }}"
    _template_config: "{{ lookup('file', playbook_dir + '/templates.yml') | from_yaml }}"
    # Local-only templates are merged ONLY when explicitly requested (the local
    # bootstrap sets this); the shared templates.yml stays prod-clean.
    _templates_local: >-
      {{ (lookup('file', playbook_dir + '/templates-local.yml') | from_yaml).templates
         if (semaphore_include_local_templates | default(false) | bool) else [] }}
    _base_templates: "{{ _template_config.templates + _templates_local }}"
    # Dev variants: a template marked `dev_variant: true` in templates.yml also
    # gets a "<name> (Dev)" copy bound to the `agent-cloud dev` repository
    # record, so orchestration code can be exercised from `dev` before it is
    # promoted to `main`.
    #
    # This exists because the alternatives are both bad. Flipping a shared
    # record's branch is global mutable state (the reason
    # set-semaphore-branch.yml was deprecated). Re-pointing one template's
    # repository_id by hand is an ad-hoc API change to config that is supposed to
    # be code — it works, leaves no trace, and the next person cannot tell it
    # happened. A generated variant is declarative, reviewable, and additive.
    #
    # Variants inherit everything from their base except the name and the repo,
    # so they cannot drift from it.
    # `_generated` is an INTERNAL marker, not a templates.yml field. The suffix
    # keys off it rather than off `repository`, because `repository:` is also the
    # documented way to bind a base template directly to another record — keying
    # off its value renamed such a base to "<name> (Dev)", so `_existing_ids`
    # stopped finding the real record and left it stale. And a template setting
    # both `repository: agent-cloud dev` and `dev_variant: true` would have given
    # its base and its generated variant the same identity.
    _dev_variants: >-
      {{ _base_templates | selectattr('dev_variant', 'defined')
         | selectattr('dev_variant')
         | map('combine', {'repository': _dev_repo_name, 'dev_variant': false, '_generated': true})
         | list }}
    _dev_repo_name: "{{ semaphore_dev_repo_name | default('agent-cloud dev') }}"
    _all_templates: "{{ _base_templates + (_dev_variants | map('combine', {}) | list) }}"

  tasks:
    - name: "Validate environment"
      ansible.builtin.assert:
        that:
          - _semaphore_url | length > 0
          - _token | length > 0
        fail_msg: "Set SEMAPHORE_URL and SEMAPHORE_TOKEN environment variables"

    - name: "Get agent-cloud repository ID"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/repositories"
        headers:
          Authorization: "Bearer {{ _token }}"
      register: _repos

    # Map every repository record name -> id, so a template can NAME the record
    # (and therefore the branch) it runs from. Declared in repositories.yml and
    # applied by bootstrap-semaphore-repositories.yml. Previously this resolved a
    # single hardcoded 'agent-cloud' id, which is why testing another branch meant
    # flipping that one record's branch — global mutable state.
    - name: "Map repository names to ids"
      ansible.builtin.set_fact:
        _repo_ids: "{{ dict(_repos.json | map(attribute='name') | zip(_repos.json | map(attribute='id'))) }}"

    - name: "Require the default repository record to exist"
      ansible.builtin.assert:
        that:
          - "'agent-cloud' in _repo_ids"
        fail_msg: >-
          No Semaphore repository record named 'agent-cloud'. Run
          bootstrap-semaphore-repositories.yml first — templates bind to a
          repository record by name, so the records must exist before this.

    - name: "Reject a template that both binds to dev and requests a dev variant"
      # Both would resolve to the same repository record; the base would be
      # indistinguishable from its own generated variant. Pick one.
      ansible.builtin.assert:
        that:
          - not ((item.repository | default('')) == _dev_repo_name and (item.dev_variant | default(false)))
        fail_msg: >-
          Template '{{ item.name }}' sets both `repository: {{ _dev_repo_name }}`
          and `dev_variant: true`. Use one: bind it directly to run ONLY from dev,
          or set dev_variant to keep a main-bound base plus a generated
          '<name> (Dev)' copy.
      loop: "{{ _base_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Require every repository a template names to exist"
      ansible.builtin.assert:
        that:
          - "(item.repository | default('agent-cloud')) in _repo_ids"
        fail_msg: >-
          Template '{{ item.name }}' names repository
          '{{ item.repository | default('agent-cloud') }}', which has no record in
          Semaphore. Add it to repositories.yml and run
          bootstrap-semaphore-repositories.yml.
      loop: "{{ _all_templates }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.repository | default('agent-cloud') }}"

    - name: "Get existing templates"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/templates"
        headers:
          Authorization: "Bearer {{ _token }}"
      register: _existing

    - name: "Create or update each template"
      ansible.builtin.uri:
        url: >-
          {{ _semaphore_url }}/api/project/{{ _project_id }}/templates{{
            '/' ~ (_existing_ids | first) if (_existing_ids | length > 0) else ''
          }}
        # Both the URL and the body must key off _tpl_name, not item.name. Using
        # item.name here while the body used _tpl_name meant a dev variant of an
        # ALREADY-EXISTING template resolved the URL to its BASE's id while the
        # body carried no id — which Semaphore rejects with "template id in URL
        # and in body must be the same". Worse, had the ids lined up it would
        # have overwritten the base template with the variant's name and repo.
        method: >-
          {{ 'PUT' if (_existing_ids | length > 0) else 'POST' }}
        headers:
          Authorization: "Bearer {{ _token }}"
          Content-Type: application/json
        body_format: json
        # Body is serialized inside Jinja (to_json) so the id fields stay JSON
        # integers — Ansible's non-native templating would otherwise stringify
        # them, which Semaphore >= v2.18 rejects with a 400.
        body: "{{ _tpl_body | to_json }}"
        status_code: [200, 201, 204]
      vars:
        _existing_ids: "{{ _existing.json | selectattr('name', 'equalto', _tpl_name) | map(attribute='id') | list }}"
        # A variant is the base plus " (Dev)" — derived, never hand-written, so a
        # renamed base cannot leave an orphaned variant behind.
        _tpl_name: "{{ item.name ~ (' (Dev)' if (item._generated | default(false)) else '') }}"
        _tpl_body: >-
          {{ {'name': _tpl_name,
              'project_id': (_project_id | int),
              'inventory_id': (semaphore_inventory_id | default(2) | int),
              'repository_id': (_repo_ids[item.repository | default('agent-cloud')] | int),
              'environment_id': (semaphore_environment_id | default(2) | int),
              'playbook': item.playbook,
              'app': 'ansible',
              'autorun': false,
              'suppress_success_alerts': true}
             | combine({'id': (_existing_ids | first | int)} if (_existing_ids | length > 0) else {})
             | combine({'survey_vars': item.survey_vars} if (item.survey_vars is defined) else {}) }}
      loop: "{{ _all_templates }}"
      loop_control:
        label: "{{ item.name }}{{ ' (Dev)' if (item._generated | default(false)) else '' }}"

    - name: "Report"
      ansible.builtin.debug:
        msg: "Applied {{ _all_templates | length }} templates to Semaphore at {{ _semaphore_url }}"
