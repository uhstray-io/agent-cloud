---
# setup-templates.yml — Apply Semaphore task templates from templates.yml
#
# Reads templates.yml and creates/updates task templates via Semaphore API.
# Idempotent: existing templates updated, new ones created.
#
# IT DOES NOT DELETE. Matching is by name — PUT when the name exists, POST when it does
# not — so REMOVING a template from templates.yml does not remove it from Semaphore. The
# declaration stops describing it and it keeps running, which is worse than an orphan: it
# is an undeclared template that a later reader has no record of, still bound to whatever
# repository record it had.
#
# Consequence to know about: a template created for temporary validation (say, bound to a
# feature-branch repository record) must be deleted from Semaphore explicitly when its
# declaration is removed, and before the repository record it points at is deleted —
# otherwise its every run fails on a checkout against a record that no longer exists.
#
# Prune support was deliberately NOT added here. Semaphore currently holds
# hand-made templates that no declaration covers (e.g. the "SSH Distribute: ... (temp)"
# entries), so a prune pass would delete work this file has no knowledge of. Making that
# safe means first bringing every existing template under declaration — worth doing, and
# larger than this playbook.
#
# Usage:
#   SEMAPHORE_URL=http://... SEMAPHORE_TOKEN=... ansible-playbook setup-templates.yml
#
# Or via Semaphore environment variables.

- name: "Apply Semaphore task templates"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _semaphore_url: "{{ semaphore_url | default(lookup('env', 'SEMAPHORE_URL'), true) }}"
    # Defaults match the production instance; the local-dev bootstrap overrides
    # them for the fresh local Semaphore (LOCAL-DEV-DEPLOYMENT.md Phase 0B).
    _project_id: "{{ semaphore_project_id | default(1) }}"
    _template_config: "{{ lookup('file', playbook_dir + '/templates.yml') | from_yaml }}"
    # Local-only templates are merged ONLY when explicitly requested (the local
    # bootstrap sets this); the shared templates.yml stays prod-clean.
    #
    # Every local template is bound to the working-tree repository record HERE,
    # structurally, with one combine — never as a per-template `repository:` line
    # in templates-local.yml. A hand-kept line per template is exactly how a new
    # local template silently falls through default('agent-cloud') to GitHub main
    # and validates code that is not the code being written (MISTAKES 10.9).
    _local_repo_name: "{{ semaphore_local_repo_name | default('agent-cloud worktree') }}"
    _templates_local: >-
      {{ (((lookup('file', playbook_dir + '/templates-local.yml') | from_yaml).templates)
          | map('combine', {'repository': _local_repo_name}) | list)
         if (semaphore_include_local_templates | default(false) | bool) else [] }}
    _base_templates: "{{ _template_config.templates + _templates_local }}"
    # Dev variants: a template marked `dev_variant: true` in templates.yml also
    # gets a "<name> (Dev)" copy bound to the `agent-cloud dev` repository
    # record, so orchestration code can be exercised from `dev` before it is
    # promoted to `main`.
    #
    # This exists because the alternatives are both bad. Flipping a shared
    # record's branch is global mutable state (the reason
    # set-semaphore-branch.yml was deprecated). Re-pointing one template's
    # repository_id by hand is an ad-hoc API change to config that is supposed to
    # be code — it works, leaves no trace, and the next person cannot tell it
    # happened. A generated variant is declarative, reviewable, and additive.
    #
    # Variants inherit everything from their base except the name and the repo,
    # so they cannot drift from it.
    # `_generated` is an INTERNAL marker, not a templates.yml field. The suffix
    # keys off it rather than off `repository`, because `repository:` is also the
    # documented way to bind a base template directly to another record — keying
    # off its value renamed such a base to "<name> (Dev)", so `_existing_ids`
    # stopped finding the real record and left it stale. And a template setting
    # both `repository: agent-cloud dev` and `dev_variant: true` would have given
    # its base and its generated variant the same identity.
    _dev_variants: >-
      {{ _base_templates | selectattr('dev_variant', 'defined')
         | selectattr('dev_variant')
         | map('combine', {'repository': _dev_repo_name, 'dev_variant': false, '_generated': true})
         | list }}
    _dev_repo_name: "{{ semaphore_dev_repo_name | default('agent-cloud dev') }}"
    _all_templates: "{{ _base_templates + (_dev_variants | map('combine', {}) | list) }}"
    _scoped: "{{ semaphore_template_names is defined }}"
    _catalog_json: >-
      {% set result = [] %}
      {% for template in _all_templates %}
      {% set _ = result.append(template | combine({'_publish_name': template.name ~
          (' (Dev)' if template._generated | default(false) else '')})) %}
      {% endfor %}
      {{ result | to_json }}
    _catalog: "{{ _catalog_json | from_json }}"
    _selected_templates: >-
      {{ (_catalog | selectattr('_publish_name', 'in', semaphore_template_names) | list)
         if _scoped else _catalog }}
    _allow_scoped_create: "{{ semaphore_allow_scoped_create | default(false) | bool }}"


  tasks:
    - name: "Require exactly one declared bootstrap publisher"
      ansible.builtin.assert:
        that: _selected_templates | length == 1
        fail_msg: "The generated Dev publisher is missing or ambiguous in the declaration."
      when: _bootstrap_survey_publisher | default(false)

    - name: "Require a nonempty exact-name selection when scope is supplied"
      ansible.builtin.assert:
        that:
          - semaphore_template_names | type_debug == 'list'
          - semaphore_template_names | length > 0
          - semaphore_template_names | unique | length == semaphore_template_names | length
          - semaphore_template_names | difference(_catalog | map(attribute='_publish_name') | list) | length == 0
        fail_msg: "Supply a nonempty list of unique, exact declared template names, including any (Dev) suffix."
      when: _scoped

    - name: "Require explicit bindings for a one-template scoped bootstrap"
      ansible.builtin.assert:
        that:
          - _scoped
          - _selected_templates | length == 1
          - semaphore_project_id is defined and semaphore_project_id | int > 0
          - semaphore_inventory_id is defined and semaphore_inventory_id | int > 0
          - semaphore_environment_id is defined and semaphore_environment_id | int > 0
        fail_msg: "A scoped create needs one exact template name and verified project, inventory, and environment IDs."
      when: _allow_scoped_create

    - name: "Resolve approved Semaphore runtime access"
      ansible.builtin.include_tasks: tasks/runtime-access.yml

    - name: "Validate environment"
      ansible.builtin.assert:
        that:
          - _semaphore_url | length > 0
          - _token | length > 0
        fail_msg: "Semaphore endpoint or resolved runtime token is missing; see platform/semaphore/README.md."

    - name: "Get agent-cloud repository ID"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/repositories"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
      register: _repos
      check_mode: false

    # Map every repository record name -> id, so a template can NAME the record
    # (and therefore the branch) it runs from. Declared in repositories.yml and
    # applied by bootstrap-semaphore-repositories.yml. Previously this resolved a
    # single hardcoded 'agent-cloud' id, which is why testing another branch meant
    # flipping that one record's branch — global mutable state.
    - name: "Map repository names to ids"
      ansible.builtin.set_fact:
        _repo_ids: "{{ dict(_repos.json | map(attribute='name') | zip(_repos.json | map(attribute='id'))) }}"

    - name: "Require the default repository record to exist"
      ansible.builtin.assert:
        that:
          - "'agent-cloud' in _repo_ids"
        fail_msg: >-
          No Semaphore repository record named 'agent-cloud'. Run
          bootstrap-semaphore-repositories.yml first — templates bind to a
          repository record by name, so the records must exist before this.

    - name: "Reject a template that both binds to dev and requests a dev variant"
      # Both would resolve to the same repository record; the base would be
      # indistinguishable from its own generated variant. Pick one.
      ansible.builtin.assert:
        that:
          - not ((item.repository | default('')) == _dev_repo_name and (item.dev_variant | default(false)))
        fail_msg: >-
          Template '{{ item.name }}' sets both `repository: {{ _dev_repo_name }}`
          and `dev_variant: true`. Use one: bind it directly to run ONLY from dev,
          or set dev_variant to keep a main-bound base plus a generated
          '<name> (Dev)' copy.
      loop: "{{ _base_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Require every repository a template names to exist"
      ansible.builtin.assert:
        that:
          - "(item.repository | default('agent-cloud')) in _repo_ids"
        fail_msg: >-
          Template '{{ item.name }}' names repository
          '{{ item.repository | default('agent-cloud') }}', which has no record in
          Semaphore. Add it to repositories.yml and run
          bootstrap-semaphore-repositories.yml.
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.repository | default('agent-cloud') }}"

    - name: "Get existing templates"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/templates"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
      register: _existing
      check_mode: false

    - name: "Refuse ambiguous bootstrap records"
      ansible.builtin.assert:
        that: _existing.json | selectattr('name', 'equalto', item._publish_name) | list | length <= 1
        fail_msg: "Multiple existing publisher records have the same name."
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      when: _bootstrap_survey_publisher | default(false)

    - name: "Require the selected repository records to match their declaration"
      ansible.builtin.assert:
        that:
          - _live_repos | length == 1
          - _declared_repos | length == 1
          - (_live_repos | first).git_url == (_declared_repos | first).git_url
          - (_live_repos | first).git_branch == (_declared_repos | first).git_branch
        fail_msg: "Repository binding for '{{ item._publish_name }}' is ambiguous or differs from repositories.yml."
      vars:
        _repo_name: "{{ item.repository | default('agent-cloud') }}"
        _live_repos: "{{ _repos.json | selectattr('name', 'equalto', _repo_name) | list }}"
        _declared_repos: >-
          {{ (lookup('file', playbook_dir + '/repositories.yml') | from_yaml).repositories
             | selectattr('name', 'equalto', _repo_name) | list }}
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      when: _scoped or (_bootstrap_survey_publisher | default(false))

    - name: "Require unambiguous existing bindings before scoped publication"
      ansible.builtin.assert:
        that:
          - _matches | length <= 1
          - _matches | length == 1 or _allow_scoped_create
          - _matches | length == 0 or (_matches | first).repository_id | int == _repo_ids[item.repository | default('agent-cloud')] | int
          - _matches | length == 0 or (_matches | first).playbook == item.playbook
        fail_msg: >-
          Scoped publication requires exactly one existing '{{ item._publish_name }}'
          with the declared repository and playbook. Bootstrap or binding changes
          require a separately reviewed configuration operation.
      vars:
        _matches: "{{ _existing.json | selectattr('name', 'equalto', item._publish_name) | list }}"
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      when: _scoped

    - name: "Read complete existing selected records before publication"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/templates/{{ _match.id }}"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
      vars:
        _match: "{{ _existing.json | selectattr('name', 'equalto', item._publish_name) | first }}"
      register: _selected_records
      check_mode: false
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      when:
        - _scoped or (_bootstrap_survey_publisher | default(false))
        - _existing.json | selectattr('name', 'equalto', item._publish_name) | list | length > 0

    - name: "Choose complete records as the scoped merge source"
      ansible.builtin.set_fact:
        _merge_records: >-
          {{ (_selected_records.results | selectattr('json', 'defined') | map(attribute='json') | list)
             if (_scoped or (_bootstrap_survey_publisher | default(false))) else _existing.json }}

    - name: "Create or update each template"
      ansible.builtin.uri:
        url: >-
          {{ _semaphore_url }}/api/project/{{ _project_id }}/templates{{
            '/' ~ (_existing_ids | first) if (_existing_ids | length > 0) else ''
          }}
        # Both the URL and the body must key off _tpl_name, not item.name. Using
        # item.name here while the body used _tpl_name meant a dev variant of an
        # ALREADY-EXISTING template resolved the URL to its BASE's id while the
        # body carried no id — which Semaphore rejects with "template id in URL
        # and in body must be the same". Worse, had the ids lined up it would
        # have overwritten the base template with the variant's name and repo.
        method: >-
          {{ 'PUT' if (_existing_ids | length > 0) else 'POST' }}
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
        body_format: json
        # Body is serialized inside Jinja (to_json) so the id fields stay JSON
        # integers — Ansible's non-native templating would otherwise stringify
        # them, which Semaphore >= v2.18 rejects with a 400.
        body: "{{ _tpl_body | to_json }}"
        status_code: [200, 201, 204]
      register: _published
      changed_when: true
      when:
        - not ansible_check_mode
        - >-
          (not _scoped and not (_bootstrap_survey_publisher | default(false)))
          or (not (_tpl_body | publication_matches(_existing_template)))
      vars:
        _existing_template: "{{ (_merge_records | selectattr('name', 'equalto', _tpl_name) | list | first) | default({}) }}"
        _existing_ids: "{{ _existing.json | selectattr('name', 'equalto', _tpl_name) | map(attribute='id') | list }}"
        # A variant is the base plus " (Dev)" — derived, never hand-written, so a
        # renamed base cannot leave an orphaned variant behind.
        _tpl_name: "{{ item.name ~ (' (Dev)' if (item._generated | default(false)) else '') }}"
        _default_body: >-
          {{ {'name': _tpl_name,
              'project_id': (_project_id | int),
              'inventory_id': (semaphore_inventory_id | default(2) | int),
              'repository_id': (_repo_ids[item.repository | default('agent-cloud')] | int),
              'environment_id': (semaphore_environment_id | default(2) | int),
              'playbook': item.playbook,
              'app': 'ansible',
              'autorun': false,
              'suppress_success_alerts': true}
             | combine({'id': (_existing_ids | first | int)} if (_existing_ids | length > 0) else {})
             | combine({'survey_vars': item.survey_vars} if (item.survey_vars is defined) else {}) }}
        # Scoped publication updates declared survey fields only. The binding
        # gate above proves the execution path; all other live settings survive.
        _tpl_body: >-
          {{ (_existing_template | publication_settings
              | combine({'survey_vars': item.survey_vars | default([])}))
             if _scoped and (_existing_ids | length > 0) else _default_body }}
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item.name }}{{ ' (Dev)' if (item._generated | default(false)) else '' }}"

# ── Schedules as code ────────────────────────────────────────────────────────
    # A template may declare `schedule: { cron: "..." }` in templates.yml; it
    # is upserted here by NAME (one schedule per declared template, named after
    # it) so a cadence is reviewed in the PR that sets it, never clicked into
    # the UI. Schedules attach to the BASE template only — a (Dev) variant
    # never inherits one, so a pre-promotion schedule failing on main's absent
    # playbook stays a visible red rather than a silent double-run later.

    - name: "Re-read templates (ids for schedule binding)"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/templates"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
      register: _templates_after
      check_mode: false

    - name: "Read complete selected records after publication"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/templates/{{ item.id }}"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
      register: _selected_after
      check_mode: false
      loop: >-
        {{ _templates_after.json
           | selectattr('name', 'in', _selected_templates | map(attribute='_publish_name') | list) | list }}
      loop_control:
        label: "{{ item.name }}"
      when: _scoped or (_bootstrap_survey_publisher | default(false))

    - name: "Verify the bootstrap publisher was saved with the reviewed bindings"
      ansible.builtin.assert:
        that:
          - _matches | length == 1
          - (_matches | first).inventory_id | int == semaphore_inventory_id | int
          - (_matches | first).environment_id | int == semaphore_environment_id | int
          - (_matches | first).repository_id | int == _repo_ids[item.repository] | int
          - (_matches | first).playbook == item.playbook
          - item.survey_vars | publication_matches((_matches | first).survey_vars | default([]))
        fail_msg: "Bootstrap publisher readback failed."
      vars:
        _matches: "{{ _selected_after.results | map(attribute='json') | selectattr('name', 'equalto', item._publish_name) | list }}"
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      # Dry run: nothing was published, so a readback can only show the old record.
      when:
        - not ansible_check_mode
        - _bootstrap_survey_publisher | default(false)

    - name: "Verify scoped surveys and every preserved record setting"
      ansible.builtin.assert:
        that:
          - _after.name == item._publish_name
          - item.survey_vars | default([]) | publication_matches(_after.survey_vars | default([]))
          - (_before | publication_settings) | publication_matches(_after | publication_settings)
          - (_after | publication_settings) | publication_matches(_before | publication_settings)
        fail_msg: "Scoped publication readback failed for '{{ item._publish_name }}'."
      vars:
        _after: "{{ _selected_after.results | map(attribute='json') | selectattr('name', 'equalto', item._publish_name) | first }}"
        _before: "{{ _merge_records | selectattr('name', 'equalto', item._publish_name) | first }}"
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      when:
        - not ansible_check_mode
        - _scoped
        - _existing.json | selectattr('name', 'equalto', item._publish_name) | list | length == 1

    - name: "Verify a newly created scoped template's exact bindings"
      ansible.builtin.assert:
        that:
          - _after.name == item._publish_name
          - _after.project_id | int == semaphore_project_id | int
          - _after.inventory_id | int == semaphore_inventory_id | int
          - _after.environment_id | int == semaphore_environment_id | int
          - _after.repository_id | int == _repo_ids[item.repository | default('agent-cloud')] | int
          - _after.playbook == item.playbook
          - item.survey_vars | default([]) | publication_matches(_after.survey_vars | default([]))
        fail_msg: "Scoped template creation readback failed for '{{ item._publish_name }}'."
      vars:
        _after: "{{ _selected_after.results | map(attribute='json') | selectattr('name', 'equalto', item._publish_name) | first }}"
      loop: "{{ _selected_templates }}"
      loop_control:
        label: "{{ item._publish_name }}"
      when:
        - not ansible_check_mode
        - _scoped
        - _allow_scoped_create
        - _existing.json | selectattr('name', 'equalto', item._publish_name) | list | length == 0

    - name: "Get existing schedules"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/schedules"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
      register: _schedules
      check_mode: false
      when: not _scoped

    - name: "Create or update each declared schedule"
      ansible.builtin.uri:
        url: >-
          {{ _semaphore_url }}/api/project/{{ _project_id }}/schedules{{
            '/' ~ (_sched_ids | first) if (_sched_ids | length > 0) else ''
          }}
        method: "{{ 'PUT' if (_sched_ids | length > 0) else 'POST' }}"
        headers:
          Authorization: "Bearer {{ _token }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
        body_format: json
        body: "{{ _sched_body | to_json }}"
        status_code: [200, 201, 204]
      when:
        - not ansible_check_mode
        - not _scoped
      vars:
        _sched_ids: "{{ (_schedules.json | default([])) | selectattr('name', 'equalto', item.name) | map(attribute='id') | list }}"
        _tpl_id: "{{ (_templates_after.json | selectattr('name', 'equalto', item.name) | map(attribute='id') | list | first) }}"
        _sched_body: >-
          {{ {'project_id': (_project_id | int),
              'template_id': (_tpl_id | int),
              'name': item.name,
              'cron_format': item.schedule.cron,
              'active': (item.schedule.active | default(true) | bool)}
             | combine({'id': (_sched_ids | first | int)} if (_sched_ids | length > 0) else {}) }}
      loop: "{{ _selected_templates | selectattr('schedule', 'defined') | rejectattr('_generated', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }} ({{ item.schedule.cron }})"

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          Applied {{ _selected_templates | length }} templates
          ({{ _selected_templates | selectattr('schedule', 'defined') | rejectattr('_generated', 'defined') | list | length }}
          declared schedules; schedule publication {{ 'skipped' if _scoped else 'enabled' }})
          to Semaphore at {{ _semaphore_url }}
