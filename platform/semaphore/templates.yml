        type: string
        required: false
        default_value: "main"

  - name: Deploy tududi
    playbook: platform/playbooks/deploy-tududi.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy honcho
    playbook: platform/playbooks/deploy-honcho.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
