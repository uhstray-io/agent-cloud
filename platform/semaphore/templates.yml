# Semaphore Task Templates — Declarative configuration
# Applied by setup-templates.yml playbook
#
# Each template maps to a playbook in this monorepo.
# No secrets or sensitive data — safe for public repo.

# Per-template fields:
#   name          template name shown in Semaphore
#   playbook      path within the repo
#   survey_vars   optional launch-time inputs (NEVER for secret values —
#                 Semaphore persists survey values in its database)
#   repository    optional Semaphore repository RECORD name to bind to; omitted
#                 means 'agent-cloud' (main). Records are declared in
#                 repositories.yml and applied by
#                 bootstrap-semaphore-repositories.yml.
#   dev_variant   optional; when true, setup-templates.yml ALSO emits a
#                 "<name> (Dev)" copy bound to the `agent-cloud dev` record, so
#                 the orchestration code can be exercised from `dev` before it is
#                 promoted to `main`.
#
#                 This is the supported way to test a template from a branch.
#                 Do NOT flip a shared repository record's branch (global mutable
#                 state — why set-semaphore-branch.yml is deprecated), and do NOT
#                 re-point a template's repository_id through the API by hand:
#                 that is an ad-hoc change to config that is meant to be code,
#                 it leaves no trace, and the next person cannot tell it happened.

templates:
  # ── Deployment ─────────────────────────────────────────────────
  - name: Audit o11y Containers
    playbook: platform/playbooks/audit-o11y-containers.yml
    dev_variant: true

  # Production receiver rollout uses a reviewed dev checkout and clones that
  # exact revision onto the target before rendering secrets or starting containers.
  - name: Deploy o11y (Dev)
    playbook: platform/playbooks/deploy-o11y.yml
    repository: agent-cloud dev
    survey_vars:
      - name: service_branch
        title: "Target branch"
        description: "Branch cloned onto the receiver"
        type: string
        required: true
        default_value: "dev"
      - name: expected_repository_sha
        title: "Reviewed commit SHA"
        description: "Exact dev commit required on controller and receiver"
        type: string
        required: true

  - name: Verify o11y Service
    playbook: platform/playbooks/verify-o11y-service.yml
    dev_variant: true
    survey_vars:
      - name: expected_service
        title: "Service label"
        description: "Lowercase service identity whose fresh logs and metrics must be present"
        type: string
        required: true
      - name: expected_instance
        title: "Metrics endpoint"
        description: "Declared host:port to verify for a metrics-enabled service"
        type: string
        required: false
      - name: expect_metrics
        title: "Expect metrics"
        description: "true for a metrics-enabled service; false for a log-only service"
        type: string
        required: false
        default_value: "true"

  - name: Deploy All Services
    playbook: platform/playbooks/deploy-all.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy OpenBao
    playbook: platform/playbooks/deploy-openbao.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy NocoDB
    playbook: platform/playbooks/deploy-nocodb.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy n8n
    playbook: platform/playbooks/deploy-n8n.yml
    dev_variant: true
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Semaphore
    playbook: platform/playbooks/deploy-semaphore.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy NetBox
    playbook: platform/playbooks/deploy-netbox.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Audit NetBox Runtime
    playbook: platform/playbooks/audit-netbox-runtime.yml
    dev_variant: true

  - name: Recover NetBox Runtime (Dev)
    playbook: platform/playbooks/recover-netbox-runtime.yml
    repository: agent-cloud dev
    survey_vars:
      - name: netbox_source_apply
        title: Place reviewed Dev source
        description: "false = require the host to already run the reviewed Dev commit; true = place that exact commit before container preflight"
        type: string
        required: false
        default_value: "false"
      - name: expected_host_revision
        title: Audited host commit
        description: "Required when placing source; copy the full host commit SHA from Audit NetBox Runtime (Dev)"
        type: string
        required: false
        default_value: ""
      - name: netbox_runtime_apply
        title: Apply recovery
        description: "false = inspect and report each core container's start/recreate/noop action without changing it; true = also apply those actions"
        type: string
        required: false
        default_value: "false"

  # Build #1 (netbox-device-add): skynet requests "Create NetBox Device"; agent-cloud
  # executes it under the scoped automation token minted by the provision template.
  - name: Provision NetBox Automation Token
    playbook: platform/playbooks/provision-netbox-automation-token.yml
    dev_variant: true
    survey_vars:
      - name: replace_unrecoverable_token
        title: Replace unrecoverable token
        description: "Default false. Only when NetBox has the dedicated token but OpenBao lost its value, revoke exactly one match and mint a replacement."
        type: string
        required: false
        default_value: "false"
      # A template passes no arguments, so the identity to mint is a survey choice. Blank
      # means device-writer, the original profile.
      - name: netbox_token_profile
        title: Token profile
        description: "Blank or device-writer (skynet device create), workflow-collector (the conformance collector), or vm-recorder (validate-address)."
        type: string
        required: false

  - name: Ensure NetBox Prefix
    playbook: platform/playbooks/ensure-netbox-prefix.yml
    dev_variant: true
    survey_vars:
      - name: prefix
        title: IPv4 prefix (CIDR)
        description: "Exact management network from private site configuration"
        type: string
        required: true
      - name: prefix_apply
        title: Create missing prefix
        description: "false = report only; true = create exactly this active global prefix if absent"
        type: string
        required: false
        default_value: "false"

  # Converge the conformance collector's NetBox custom fields to their declaration
  # (platform/workflows/service-onboarding/netbox-custom-fields.yml). Idempotent;
  # "Dry run" reports without writing.
  - name: Provision NetBox Custom Fields
    playbook: platform/playbooks/provision-netbox-custom-fields.yml
    # The playbook is on dev only until promotion; the (Dev) copy runs it from there.
    dev_variant: true

  # IPAM allocation. Default run is READ-ONLY: it reports the next free addresses in a
  # prefix so a VM's address comes from the authority rather than from the inventory
  # (which records what is declared) or from eyeballing the network. Reserving is opt-in
  # AND takes explicit addresses, so two runs cannot quietly allocate different ones.
  - name: Allocate NetBox IP
    playbook: platform/playbooks/netbox-allocate-ip.yml
    # Introduced by this change, so main has no copy yet — a dev-bound variant is the
    # only way to exercise it before promotion (setup-templates.yml emits "<name> (Dev)").
    dev_variant: true
    survey_vars:
      - name: prefix
        title: "Prefix (CIDR)"
        description: "Prefix to ask for free addresses in; must already exist in NetBox"
        type: string
        required: true
      - name: count
        title: "How many"
        description: "Free addresses to report (1-32)"
        type: string
        required: false
        default_value: "2"
      - name: reserve
        title: "Reserve"
        description: "true = CREATE explicit static addresses after a live pfSense DHCP check (HTTPS router source required)"
        type: string
        required: false
        default_value: "false"
      - name: assignments
        title: "Assignments (JSON)"
        description: "[{address, dns_name, description}] — required when reserve=true"
        type: string
        required: false

  - name: Create NetBox Device
    playbook: platform/playbooks/create-netbox-device.yml
    survey_vars:
      - name: device_proposal
        title: "Device proposal (JSON)"
        description: "netbox-device-proposal JSON emitted by skynet"
        type: string
        required: true
      - name: dry_run
        title: "Dry run"
        description: "true = resolve + report, no writes"
        type: string
        required: false
        default_value: "false"

  - name: Deploy NemoClaw
    playbook: platform/playbooks/deploy-nemoclaw.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Authentik
    playbook: platform/playbooks/deploy-authentik.yml
    # The IdP's blueprints change on `dev` — new users, retired accounts, OIDC
    # clients — and every one of those is a change to who can log in where. A
    # generated "(Dev)" copy is how such a change is exercised against the live
    # instance BEFORE it is promoted, rather than promoted on the strength of a
    # green test suite alone (docs/MISTAKES.md 2.13, 2.17, 10.8: three entries,
    # one lesson — a playbook that has only been linted has never run).
    dev_variant: true
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Audit Authentik Retirements
    playbook: platform/playbooks/audit-authentik-retirements.yml
    dev_variant: true

  - name: Print User Credentials
    playbook: platform/playbooks/print-platform-user-credentials.yml
    # GATED, and it PRINTS a live credential into this task's output. Exists so an
    # operator can hand a new platform user their first login — initial passwords
    # are OpenBao-generated and otherwise never seen. Refuses without the
    # acknowledgement var; prints only <user>_password fields the users blueprint
    # declares; the store path is fixed. Semaphore keeps task output until the
    # task is deleted, so this is a deliberate, bounded exposure — not a pattern.
    # It cannot be restricted to operators here: Semaphore v2.17's Template schema
    # carries no permission field, and roles are project-wide (owner/manager/
    # task_runner/guest) — anyone who may run templates may run this one and read
    # its output. The project holds only its owner today; the durable fix is
    # backup-credentials-to-site-config.yml, which never emits a value at all.
    dev_variant: true
    survey_vars:
      - name: credential_users
        title: "Users (comma-separated blueprint names, e.g. jacob,andrew)"
        type: string
        required: true
      - name: i_understand_this_prints_secrets
        title: "Type true to confirm: this writes live passwords into the task output"
        type: string
        required: true
        default_value: "false"

  - name: Store Postiz API Key
    playbook: platform/playbooks/store-postiz-api-key.yml
    # Reads the org's API key from postiz's own Postgres (the app mints it on the
    # first authenticated request — the stored value IS the bearer token) and
    # places it at secret/services/postiz:postiz_api_key. Never printed; all
    # key-bearing steps no_log. Automation (n8n) shared-reads it from there.
    dev_variant: true

  - name: Store n8n API Key
    playbook: platform/playbooks/store-n8n-api-key.yml
    # Mints (via the seeded owner's session — no manual UI step) AND captures
    # n8n's public-API key into secret/services/n8n:n8n_api_key. Idempotent:
    # re-runs recapture the key from n8n's own Postgres instead of re-minting.
    # Never printed; all key-bearing steps no_log.
    dev_variant: true

  - name: Store tududi API Token
    playbook: platform/playbooks/store-tududi-api-token.yml
    # DB-side initial mint only; existing access is never revoked/replaced.
    # Validation-only proves the stored identity/token without writing OpenBao.
    dev_variant: true
    survey_vars:
      - name: tududi_token_validate_only
        title: "Validate existing token only"
        description: "true = prove stored token and stop; never mint, replace or revoke"
        type: string
        required: false
        default_value: "true"

  - name: Refresh tududi-sync GitHub Token
    playbook: platform/playbooks/refresh-tududi-sync-github-token.yml
    # GitHub App installation tokens live ONE HOUR: this mints a fresh one on
    # the controller (App key from OpenBao via stdin, scope preflight against
    # github-mapping.yml) and PATCHes the n8n github-sync-api credential in
    # place. Update-only: creation belongs to the sync provisioning. The
    # The cadence below is the reviewed cadence — schedules are code. Cron has
    # no true 45-minute period: `*/45` fires at :00 and :45, so the gaps
    # alternate 45 and 15 minutes — both inside the token's hour, which is
    # the property that matters.
    dev_variant: true
    schedule:
      cron: "*/45 * * * *"

  - name: Provision tududi-github Sync
    playbook: platform/playbooks/provision-tududi-github-sync.yml
    # Places the whole sync: live-validates BOTH provider credentials (named
    # failure before the engine changes), upserts the two named credentials,
    # renders the cycle workflow from the committed nine-pair mapping
    # (enabled entries), upserts + activates it, deactivates obsolete owned
    # workflows and preserves every workflow and credential. The kill switch (-e sync_enabled=false)
    # deactivates owned workflows BEFORE any validation — it works with a
    # broken mapping and dead credentials by design.
    dev_variant: true
    survey_vars:
      - name: sync_enabled
        title: "Sync enabled"
        description: "false = kill switch: deactivate the sync's workflows and stop (no validation, no render)"
        type: string
        required: false
        # A BLANK survey value renders as the empty string, and `'' | bool` is
        # FALSE — without this default, leaving the field untouched would
        # silently trip the kill switch. The playbook preserves blank-as-default
        # while also accepting an actual boolean false as a kill switch.
        default_value: "true"

  - name: Verify tududi-github Sync
    playbook: platform/playbooks/verify-tududi-github-sync.yml
    # The per-pair promotion gate (read-only, exit pass/fail per enabled
    # pair): last cycle green + the exact embedded engine reports convergence
    # + zero sync trace outside the declaration. A pair is enabled or kept
    # enabled only while this passes.
    dev_variant: true

  - name: Provision n8n Postiz Credential
    playbook: platform/playbooks/provision-n8n-postiz-credential.yml
    # Upserts the ONE postizApi credential in n8n: authenticates with
    # secret/services/n8n:n8n_api_key, shared-reads
    # secret/services/postiz:postiz_api_key (single custody — never copied), and
    # tests is-connected against the self-hosted Postiz host. Idempotent and
    # self-healing on key rotation. Local-dev without a live Postiz runs with
    # -e allow_degraded_test=true.
    dev_variant: true

  - name: Back Up Credentials to site-config
    playbook: platform/playbooks/backup-credentials-to-site-config.yml
    # Copies named fields out of OpenBao into the private repo on a NEW BRANCH per
    # run; the task output carries field NAMES, counts and the branch — never a
    # value. The deploy key is read from secret/services/ssh/site-config in the
    # same run (seeded once with Seed OpenBao Key) and lives on the runner only
    # inside the scratch dir the play always wipes.
    dev_variant: true
    survey_vars:
      - name: credential_service
        title: "Service (OpenBao path segment under secret/services/, e.g. authentik)"
        type: string
        required: true
      - name: credential_fields
        title: "Fields (comma-separated; empty = every field at the path)"
        type: string
        required: false

  - name: Back Up Service SSH Key
    playbook: platform/playbooks/backup-service-ssh-key.yml
    # Copies one per-service keypair out of OpenBao into site-config's
    # secrets/ssh/<name>/ on a new branch, with the same deploy key. Refuses a
    # mismatched pair and a differing existing file (force_overwrite to replace).
    dev_variant: true
    survey_vars:
      - name: service_name
        title: "Service (key lives at secret/services/ssh/<service>)"
        type: string
        required: true
      - name: force_overwrite
        title: "Type true to replace a DIFFERING pair already in the repo"
        type: string
        required: false
        default_value: "false"

  - name: Deploy OpenHands
    playbook: platform/playbooks/deploy-openhands.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy WisBot
    playbook: platform/playbooks/deploy-wisbot.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy tududi
    playbook: platform/playbooks/deploy-tududi.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy agentgateway
    playbook: platform/playbooks/deploy-agentgateway.yml
    # Introduced on dev (PR #191); main has no agentgateway code until promotion, so
    # the main-bound template cannot run. The "(Dev)" variant can, launched with
    # service_branch=dev so the VM checkout matches the playbook.
    dev_variant: true
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Manage agentgateway Client Key
    playbook: platform/playbooks/manage-agentgateway-client-key.yml
    # Introduced on dev (PR #191); main has no agentgateway code until promotion, so
    # the main-bound template cannot run. The "(Dev)" variant can, launched with
    # service_branch=dev so the VM checkout matches the playbook.
    dev_variant: true
    survey_vars:
      - name: client
        title: "Client identity"
        description: "Name from agw_clients (rotate) or a name already removed from it (revoke)"
        type: string
        required: true
      - name: action
        title: "Action"
        description: "rotate = new key for a declared identity; revoke = remove a retired identity's key"
        type: enum
        required: true
        values:
          - { name: "rotate", value: "rotate" }
          - { name: "revoke", value: "revoke" }
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy honcho
    playbook: platform/playbooks/deploy-honcho.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Postiz
    playbook: platform/playbooks/deploy-postiz.yml
    dev_variant: true
    # Five-container rootless stack: the app, its Postgres + Redis, and the
    # Temporal workflow engine + that engine's Postgres. The engine is what
    # executes scheduled publishing. Native Authentik OIDC in-app (not a Caddy
    # forward_auth gate) so the /api/public/v1 automation path stays usable by
    # n8n with an API key.
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy NetBox
    playbook: platform/playbooks/clean-deploy-netbox.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Orb Agent
    playbook: platform/playbooks/deploy-orb-agent.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  # pfSense sync runs as an orb-agent worker (every 15 min, no separate playbook)

  # ── WebSmith integration: UhhCraft + inference sidecars ────────
  - name: Deploy UhhCraft
    playbook: platform/playbooks/deploy-uhhcraft.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy ComfyUI Sidecar
    playbook: platform/playbooks/deploy-inference-comfyui.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"
      - name: smoke
        title: "Smoke generation"
        description: "Set to 1 to run a smoke image generation in post-deploy (uses GPU; ~5s)"
        type: string
        required: false
        default_value: "0"

  - name: Deploy Hunyuan3D Sidecar
    playbook: platform/playbooks/deploy-inference-hunyuan3d.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"
      - name: smoke
        title: "Smoke generation"
        description: "Set to 1 to run a smoke 3D generation in post-deploy (uses GPU; ~30s)"
        type: string
        required: false
        default_value: "0"

  - name: Clean Deploy UhhCraft
    playbook: platform/playbooks/clean-deploy-uhhcraft.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy WisBot
    playbook: platform/playbooks/clean-deploy-wisbot.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy OpenHands
    playbook: platform/playbooks/clean-deploy-openhands.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy Authentik
    playbook: platform/playbooks/clean-deploy-authentik.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy tududi
    playbook: platform/playbooks/clean-deploy-tududi.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy agentgateway
    playbook: platform/playbooks/clean-deploy-agentgateway.yml
    # Introduced on dev (PR #191); main has no agentgateway code until promotion, so
    # the main-bound template cannot run. The "(Dev)" variant can, launched with
    # service_branch=dev so the VM checkout matches the playbook.
    dev_variant: true
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy honcho
    playbook: platform/playbooks/clean-deploy-honcho.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  # ── Updates ────────────────────────────────────────────────────
  - name: Clean Deploy n8n
    playbook: platform/playbooks/clean-deploy-n8n.yml
    # DESTRUCTIVE: wipes n8n's containers AND volumes — the Postgres holding
    # every workflow + execution, and the n8n_data volume. Stored workflow
    # credentials only survive if the SAME N8N_ENCRYPTION_KEY is fetched back
    # from OpenBao on the rebuild (it is, unless the secret was deleted there).
    # Not a routine recovery step; for the prod cutover use Deploy n8n, never
    # this.
    dev_variant: true
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy Postiz
    playbook: platform/playbooks/clean-deploy-postiz.yml
    # DESTRUCTIVE: wipes postiz's Postgres, Redis, uploads, AND the workflow
    # engine's Postgres. Every connected social account must be re-authorized by
    # hand afterwards, so this is not a routine recovery step. API keys survive
    # (the signing secret is reused), so an n8n workflow keeps authenticating
    # against an account that no longer exists — re-issue the key after
    # re-registering. Set postiz_disable_registration back to false first, or
    # nobody can sign in to the rebuilt stack.
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Update NocoDB
    playbook: platform/playbooks/update-nocodb.yml

  - name: Update n8n
    playbook: platform/playbooks/update-n8n.yml

  - name: Update Semaphore
    playbook: platform/playbooks/update-semaphore.yml

  - name: Update NetBox
    playbook: platform/playbooks/update-netbox.yml

  - name: Update UhhCraft
    playbook: platform/playbooks/update-uhhcraft.yml

  - name: Update ComfyUI Sidecar
    playbook: platform/playbooks/update-inference-comfyui.yml

  - name: Update Hunyuan3D Sidecar
    playbook: platform/playbooks/update-inference-hunyuan3d.yml

  # ── Validation ─────────────────────────────────────────────────
  - name: Validate All Services
    playbook: platform/playbooks/validate-all.yml

  # Workflow step fw-assess: the read-only snapshot that is the firewall assessment's only
  # model input.
  - name: Snapshot Firewall
    playbook: platform/playbooks/snapshot-firewall.yml
    survey_vars:
      - name: target_service
        title: Target group
        description: Inventory group of the service to snapshot (e.g. tududi_svc)
        type: string
        required: true

  # Workflow steps service-assess and access-assess: the read-only snapshots that are each
  # assessment's only model input.
  - name: Snapshot Service Assessment
    playbook: platform/playbooks/snapshot-service-assessment.yml
    survey_vars:
      - name: target_service
        title: Target group
        description: Inventory group of the service to snapshot for the service assessment (e.g. tududi_svc)
        type: string
        required: true

  - name: Snapshot Access
    playbook: platform/playbooks/snapshot-access.yml
    survey_vars:
      - name: target_service
        title: Target group
        description: Inventory group of the service to snapshot for the access assessment (e.g. tududi_svc)
        type: string
        required: true

  # The workflow conformance collector: reads task history, writes each service's step status
  # to NetBox (and Loki when collector_loki_url is set). The only writer of that status.
  - name: Collect Service Conformance
    playbook: platform/playbooks/collect-service-conformance.yml
    # The (Dev) copy runs the collector from dev before promotion. It never carries the
    # schedule (setup-templates.yml attaches schedules to the base only), so production
    # does not get a second scheduled writer; it is launched by hand.
    dev_variant: true
    schedule:
      cron: "*/15 * * * *"

  # Workflow step systemd-enablement: every container of the service restarts on its own and,
  # for rootless podman, the deploying user has linger. Read-only.
  - name: Verify Service Persistence
    playbook: platform/playbooks/verify-service-persistence.yml
    survey_vars:
      - name: target_service
        title: Target group
        description: Inventory group of the service to check (e.g. tududi_svc)
        type: string
        required: true

  # Read-only service diagnostics, including stopped containers. The Dev
  # variant runs reviewed Dev playbook code against the production inventory.
  - name: Inspect Service Runtime
    playbook: platform/playbooks/inspect-service-runtime.yml
    dev_variant: true
    survey_vars:
      - name: target_service
        title: Target group
        description: Inventory group of the service to inspect (e.g. authentik_svc)
        type: string
        required: true

  # Workflow step service-validate: the service answers on its inventory-declared health
  # path (service_url + health_path) with HTTP 200. Read-only.
  - name: Verify Service Health
    playbook: platform/playbooks/verify-service-health.yml
    survey_vars:
      - name: target_service
        title: Target group
        description: Inventory group of the service to check (e.g. tududi_svc)
        type: string
        required: true

  # Workflow step lookup-inventory: the declared VM spec is complete, NetBox records the
  # declared address as reserved or active, and no other host claims it. Read-only.
  - name: Lookup Service Inventory
    playbook: platform/playbooks/lookup-service-inventory.yml
    survey_vars:
      - name: target_service
        title: Target service
        description: Service whose declared VM to check (its <service>_svc group declares vm_*)
        type: string
        required: true

  # Workflow step validate-address: the address is not live in pfSense ARP (unless it is the
  # service's own running VM), and the NetBox VM record exists (created planned if absent).
  - name: Validate Address Free
    playbook: platform/playbooks/validate-address-free.yml
    survey_vars:
      - name: target_service
        title: Target service
        description: Service whose declared VM to check (its <service>_svc group declares vm_*)
        type: string
        required: true

  - name: Check Discovery Pipeline
    playbook: platform/playbooks/check-discovery.yml
    survey_vars:
      - name: discovery_expected_revision
        title: "Reviewed diagnostic revision"
        description: "Full 40-character commit SHA; must match the executing controller checkout"
        type: string
        required: true
      - name: discovery_log_since
        title: "Log window start"
        description: "ISO timestamp with explicit zone, e.g. 2026-08-01T00:00:00Z"
        type: string
        required: true
      - name: discovery_log_until
        title: "Log window end"
        description: "ISO timestamp with explicit zone; collect historical evidence before redeployment"
        type: string
        required: true

  - name: Inspect Discovery Metadata
    playbook: platform/playbooks/inspect-discovery-metadata.yml
    survey_vars:
      - name: discovery_project_id
        title: "Semaphore project ID"
        description: "Explicit numeric project ID for read-only discovery binding inspection"
        type: string
        required: true

  - name: Cleanup NetBox
    playbook: platform/playbooks/cleanup-netbox.yml

  - name: Validate Proxmox Cluster
    playbook: platform/playbooks/proxmox-validate.yml
    dev_variant: true

  # ── Secrets ────────────────────────────────────────────────────
  - name: Check Secrets
    playbook: platform/playbooks/check-secrets.yml
    # target_service is REQUIRED. Without it the play matches no hosts, prints
    # "skipping: no hosts matched", and still reports SUCCESS — a false green that
    # reads exactly like a passing check. Making it a required survey var is what
    # stops that.
    survey_vars:
      - name: target_service
        title: "Target group"
        description: "Inventory group whose secrets to inventory (e.g. postiz_svc)"
        type: string
        required: true

  - name: Validate Secrets
    playbook: platform/playbooks/validate-secrets.yml

  - name: Seed Discovery Credentials
    playbook: platform/playbooks/seed-discovery-credentials.yml

  - name: Update Proxmox Token
    playbook: platform/playbooks/update-proxmox-token.yml

  - name: Sync Secrets to OpenBao
    playbook: platform/playbooks/sync-secrets-to-openbao.yml

  - name: Store SSH Password
    playbook: platform/playbooks/store-ssh-password.yml
    # This playbook already exists on main — only its template declaration was
    # missing. The variant is added anyway so the whole of Phase 1 executes one
    # branch's code: running the irreversible steps from main while the gate that
    # clears them runs from dev would mean the thing being verified is not the
    # thing being run.
    dev_variant: true
    # The FIRST step of onboarding a host: put the bootstrap login/sudo password
    # into OpenBao BEFORE anything modifies the host, so the secret store — not
    # an operator's local file — is what the automation reads from. harden-ssh
    # sources the sudo password from there to write the NOPASSWD drop-in on a host
    # that still requires one, which is why this has to come first.
    #
    # Additive: merges the password fields into secret/services/ssh without
    # touching the management keypair already at that path.
    #
    # NO survey_vars, deliberately: Semaphore PERSISTS survey values in its
    # database, so a password typed into a survey field would be stored there
    # indefinitely.
    #
    # A LAUNCH-TIME EXTRA VAR IS NOT THE ANSWER EITHER, and this comment used to
    # say it was. Semaphore persists a task's extra-var JSON exactly the same way
    # and serves it back over its API indefinitely — verified by reading a
    # completed task, whose `environment` field came back verbatim. So `-e
    # ssh_password=...` left the bootstrap credential in plaintext outside
    # OpenBao, which the platform rules forbid.
    #
    # Supply it as the SSH_PASSWORD **environment secret** instead. Semaphore
    # encrypts environment secrets at rest and does not return their values over
    # the API, and it is the same channel this playbook's OpenBao AppRole
    # credentials already arrive on. The playbook prefers the environment over the
    # extra var, so a stray `-e ssh_password=` cannot override it.
    #
    #   Project -> Environment -> (the environment this template uses)
    #     -> Secrets -> add `SSH_PASSWORD` (type: environment variable)
    #
    # The extra var still works for a LOCAL run, where the value comes from
    # site-config and nothing persists it.

  - name: Verify Host Access
    playbook: platform/playbooks/verify-host-access.yml
    # The playbook itself lands on main only at the next promotion, so the
    # main-bound base fails with "playbook could not be found" until then. The
    # dev variant is what makes the Phase 1 gate runnable beforehand — which
    # matters more for this template than most, since it is the check that
    # decides whether the irreversible hardening step is safe.
    dev_variant: true
    # READ-ONLY gate for the hardening sequence. Reports whether the host is
    # reachable, whether privilege escalation works, what sshd EFFECTIVELY allows
    # (sshd -T, so drop-ins are accounted for), how many authorized keys are in
    # place, and whether the sudo password harden-ssh needs is actually in the
    # secret store — then prints an explicit GO / NO-GO.
    #
    # Run it BEFORE harden-ssh (is it safe?), AFTER harden-ssh (did anything
    # break?), and after Apply Firewall (can we still get in?). It changes
    # nothing, so it is always safe to run.
    #
    # It cannot prove YOUR workstation still has access — only the orchestrator's
    # own path. Prove the second direction yourself before the irreversible step;
    # the single path that works might be the one about to be removed.
    survey_vars:
      - name: target_service
        title: "Target group"
        description: "Inventory group to verify (e.g. postiz_svc)"
        type: string
        required: true

  - name: Seed OpenBao Key
    playbook: platform/playbooks/seed-openbao-key.yml
    dev_variant: true
    # Merges ONE key into an existing secret path (siblings preserved), for
    # code-managed placement of a shared secret a reader deploy needs (e.g.
    # honcho reads secret/services/nemoclaw:gemini_api_key).
    #
    # The VALUE is not a survey field, because Semaphore persists survey values in
    # its database. Nor is it a launch-time extra var, which this comment used to
    # recommend: Semaphore persists a task's extra-var JSON exactly the same way
    # and serves it back over its API indefinitely. Supply it as the BAO_VALUE
    # **environment secret** — encrypted at rest, value not returned by the API,
    # the same channel the AppRole credentials already use. The playbook prefers
    # the environment, so a stray -e bao_value= cannot override it.
    #
    # ISOLATED ENVIRONMENT: BAO_VALUE is staged only in this template's own
    # environment, never in the shared one every template runs in, so no other
    # task can receive it. scripts/semaphore-seed-input.py stages it, runs one
    # task, and removes it; seed_inputs is its allowlist. First installation:
    # run Provision Seed Environment for this template, then
    # `scripts/semaphore-seed-input.py --verify-only` (the read-only access check).
    isolated_environment: OpenBao key seed inputs
    seed_inputs: [BAO_VALUE]
    seed_access_check: bao_verify_access_only
    survey_vars:
      - name: bao_path
        title: "Secret path"
        description: "KV-v2 path under secret/ to merge into (e.g. services/nemoclaw)"
        type: string
        required: true
      - name: bao_key
        title: "Key name"
        description: "Field to set/update at that path (e.g. gemini_api_key)"
        type: string
        required: true
      - name: bao_verify_access_only
        title: "Verify access without writing"
        description: "true = log in and read the path, then stop before any write"
        type: string
        default_value: "false"

  - name: Reconcile pfSense API Key
    playbook: platform/playbooks/reconcile-pfsense-api-key.yml
    dev_variant: true
    # Reads the fixed private site-config backup on the runner through the
    # OpenBao-backed deploy key. A different live key is never overwritten.
    # No credential-bearing survey or launch-time parameter is accepted.

  - name: Seed n8n Secrets
    playbook: platform/playbooks/seed-n8n-secrets.yml
    # dev_variant because the cutover RUNS FROM dev (promotion to main comes
    # after prod validation): the alias-aware seed only exists on dev, and the
    # main-record template would run the old playbook, which refuses the
    # standalone layout's ENCRYPTION_KEY spelling.
    dev_variant: true
    # Migration Task 0 for the EXISTING prod n8n: reads the live env file on
    # the host (default config/n8n.env; the standalone prod layout passes
    # -e live_n8n_env=/home/<user>/n8n/.env) and pre-seeds the STATEFUL
    # secrets (encryption_key + both Postgres passwords) into
    # secret/services/n8n, so the first composable Deploy n8n FETCHES them
    # instead of generating — re-keying N8N_ENCRYPTION_KEY makes every stored
    # workflow credential permanently undecryptable. Accepts the legacy
    # ENCRYPTION_KEY spelling; refuses a file carrying both. Non-destructive:
    # never touches the running service. Skip for greenfield hosts (nothing
    # to preserve).

  - name: Back Up n8n DB
    playbook: platform/playbooks/backup-n8n-db.yml
    # Timestamped pg_dump of an n8n Postgres container into an owner-only
    # backup dir on the VM — the rollback artifact for n8n's one-way startup
    # schema migrations. Run before EVERY n8n version bump; the cutover points
    # it at the legacy project's container via the survey var. Read-only
    # against the database; each run writes a NEW file, never overwrites.
    # Neither value is secret, so the "survey values persist" prohibition
    # does not apply.
    dev_variant: true
    survey_vars:
      - name: n8n_pg_container
        title: "Postgres container"
        description: "Container to dump (default workflow-n8n-postgres; the cutover uses the legacy project's n8n_postgres_1)"
        type: string
        required: false

  - name: Restore n8n DB
    playbook: platform/playbooks/restore-n8n-db.yml
    # DESTRUCTIVE: overwrites the composable stack's n8n database with a named
    # dump. The play hard-requires n8n_dump_file, so without this survey var
    # every UI launch would fail on task 1. Restores under --single-transaction
    # with ON_ERROR_STOP (a failed restore rolls back); the app containers are
    # restarted in an always: block, so a failed restore never also leaves the
    # service down. n8n re-runs migrations at boot. The cutover's import step
    # AND the standing upgrade rollback tool. The path is not a secret.
    dev_variant: true
    survey_vars:
      - name: n8n_dump_file
        title: "Dump file path"
        description: "Explicit dump to restore (named in Back Up n8n DB's report). Never 'the latest'."
        type: string
        required: true

  - name: Provision Seed Environment
    playbook: platform/playbooks/provision-seed-environment.yml
    # Gives ONE declared seed template (isolated_environment in this file) its own
    # environment with an encrypted copy of the controller AppRole, then binds it.
    dev_variant: true
    survey_vars:
      - name: seed_template
        title: "Seed template"
        description: "Declared base name, e.g. Seed OpenBao Key or Seed Postiz Secrets"
        type: string
        required: true
      - name: semaphore_project_id
        title: "Verified project ID"
        type: string
        required: true
      - name: semaphore_inventory_id
        title: "Verified seed inventory ID"
        type: string
        required: true
      - name: semaphore_source_environment_id
        title: "Verified current seed environment ID"
        type: string
        required: true
      - name: seed_variant
        title: "Seed variant (dev or main)"
        description: "Use dev until the seed access-verification code is promoted to main."
        type: string
        default_value: dev
        required: true

  - name: Seed Postiz Secrets
    playbook: platform/playbooks/seed-postiz-secrets.yml
    dev_variant: true
    isolated_environment: Postiz seed inputs
    seed_access_check: postiz_verify_access_only
    survey_vars:
      - name: postiz_verify_access_only
        title: "Verify access without writing secrets"
        type: string
        description: "Set true to authenticate and read the fixed path without writing secrets."
        default_value: "false"
    # Full publication binds an empty environment on first installation.
    # Run the provisioner, then the read-only survey check, before importing.
    # Places the operator's social-platform application credentials at
    # secret/services/postiz, additively (KV-v2 merge-patch), so the three
    # generated secrets already there survive. deploy-postiz.yml declares these
    # as `type: existing` — it surfaces them to the rendered config but never
    # generates them, because they are the operator's own credentials from each
    # platform's developer console.
    #
    # The only survey is a non-secret read-only switch. Semaphore PERSISTS survey
    # values, so credentials must never be declared as survey fields.
    #
    # LAUNCH-TIME EXTRA VARS ARE NOT THE ANSWER EITHER, and this comment used to
    # say they were. Semaphore persists a task's extra-var JSON the same way and
    # serves it back over its API indefinitely — so `-e seed_x_api_secret=...`
    # would leave a live social-platform credential in plaintext outside OpenBao,
    # which is the exact thing this template exists to prevent.
    #
    # Supply each credential as an **environment secret** named after its key,
    # upper-cased. Semaphore encrypts environment secrets at rest and does not
    # return their values over the API. Only the ones you have:
    #   SEED_X_API_KEY            SEED_X_API_SECRET
    #   SEED_LINKEDIN_CLIENT_ID   SEED_LINKEDIN_CLIENT_SECRET
    #   SEED_YOUTUBE_CLIENT_ID    SEED_YOUTUBE_CLIENT_SECRET
    #   SEED_DISCORD_CLIENT_ID    SEED_DISCORD_CLIENT_SECRET
    #   SEED_DISCORD_BOT_TOKEN_ID
    #
    # Use scripts/postiz-seed-input.py after provisioning and access verification;
    # it stages encrypted inputs and removes only its own inputs after completion.
    #
    # The playbook prefers the environment over the matching seed_* extra var, so
    # a stray -e cannot override a configured secret. The extra-var form remains
    # for a LOCAL run, where the value comes from site-config and nothing
    # persists it.
    # Re-running with unchanged values writes nothing. Verify with Check
    # Secrets, then run Deploy Postiz.

  - name: Seed o11y Alert Webhook
    playbook: platform/playbooks/seed-o11y-alert-webhook.yml
    dev_variant: true
    survey_vars:
      - name: expected_repository_sha
        title: "Reviewed commit SHA"
        description: "Exact checkout revision required before Discord or OpenBao access"
        type: string
        required: true
    # Reconciles a named webhook in the text channel declared by private
    # o11y_alert_discord_guild_id/o11y_alert_discord_channel_id inventory vars.
    # Reads the bot token from OpenBao and stores the webhook URL under o11y.
    # Run before enabling o11y alerts in inventory.

  - name: Drill o11y Unreachable
    playbook: platform/playbooks/drill-o11y-unreachable.yml
    dev_variant: true
    survey_vars:
      - name: expected_repository_sha
        title: "Reviewed commit SHA"
        description: "Exact Dev checkout revision required before the drill"
        type: string
        required: true
      - name: drill_expect_alert
        title: "Verify alert delivery"
        description: "Set true after the OpenBao-backed Discord contact point is enabled"
        type: string
        required: false
        default_value: "false"

  - name: Drill o11y Alert Canary (Dev)
    playbook: platform/playbooks/drill-o11y-alert-canary.yml
    repository: agent-cloud dev
    survey_vars:
      - name: expected_repository_sha
        title: "Reviewed commit SHA"
        description: "Exact Dev revision required before temporary alert activation"
        type: string
        required: true
    # Local-only. Restores paused provisioning in an always block. If the
    # controller is interrupted, run Restore o11y Alert Baseline (Dev).

  - name: Restore o11y Alert Baseline (Dev)
    playbook: platform/playbooks/restore-o11y-alert-baseline.yml
    repository: agent-cloud dev
    survey_vars:
      - name: expected_repository_sha
        title: "Reviewed commit SHA"
        description: "Exact Dev revision required for interruption recovery"
        type: string
        required: true

  - name: Mint Honcho Team JWT
    playbook: platform/playbooks/mint-honcho-team-jwt.yml
    # Mints a team-wide, workspace-scoped (uhstray) Honcho JWT via the container's
    # generate_jwt.py, stores it at secret/services/honcho/tokens/team, verifies
    # against /v3. Token is never logged. Re-running rotates the team key.
    # Runs against the honcho_svc group; no survey vars.

  - name: Apply Cloudflare Tofu
    playbook: platform/playbooks/apply-cloudflare-tofu.yml
    # Edge changes are written on a branch and have to be planned from that
    # branch before promotion, so this needs a dev-bound variant.
    dev_variant: true
    # OpenBao-wrapper around the platform/infra/cloudflare OpenTofu root: fetches
    # the CF token + R2 keys from OpenBao, runs tofu against the R2 backend.
    # tofu_action=plan (safe, default) or apply (gated change; run after review).
    survey_vars:
      - name: tofu_action
        title: "Action"
        description: "plan (read-only, default) or apply (gated change)"
        type: string
        required: false
        default_value: "plan"

  - name: Publish Semaphore Template Surveys
    playbook: platform/playbooks/publish-semaphore-templates.yml
    dev_variant: true
    survey_vars:
      - name: semaphore_template_names_json
        title: "Exact declared template names (JSON list)"
        description: "Updates existing surveys; with scoped create enabled, creates one missing declared template."
        type: string
        required: true
      - name: semaphore_allow_scoped_create
        title: "Create one missing template"
        description: "Default false. Requires one exact name and verified project, inventory, and variable-group IDs."
        type: string
        required: false
        default_value: "false"
      - name: semaphore_project_id
        title: "Verified project ID for create"
        type: string
        required: false
      - name: semaphore_inventory_id
        title: "Verified inventory ID for create"
        type: string
        required: false
      - name: semaphore_environment_id
        title: "Verified variable-group ID for create"
        type: string
        required: false

  # Initial installation remains an operator bootstrap. Once installed, the
  # publisher above uses the controller AppRole without exporting credentials.
  # Repository/inventory management remains operator-side; it is not exposed
  # by this narrowly scoped survey publisher.
  # NOTE: bootstrap-semaphore-repositories.yml (and the deprecated
  # set-semaphore-branch.yml it replaces) are OPERATOR-SIDE tools — run from a
  # workstation with SEMAPHORE_URL/SEMAPHORE_TOKEN, like setup-templates.yml.
  # These broader tools are NOT exposed as Semaphore templates. The scoped
  # controller publisher above is the bounded exception; see README.md.
  #
  # To run a template against `dev` instead of `main`, give it
  # `repository: agent-cloud dev` here — do NOT flip a shared record's branch.

  - name: Apply All OpenBao Policies
    playbook: platform/playbooks/apply-openbao-policies.yml

  - name: Apply Policy - Orb Agent
    playbook: platform/playbooks/apply-policy-orb-agent.yml

  - name: Provision AppRole - Orb Agent
    playbook: platform/playbooks/provision-orb-agent-approle.yml

  - name: Apply Policy - Semaphore
    playbook: platform/playbooks/apply-policy-semaphore.yml

  - name: Apply Policy - NemoClaw
    playbook: platform/playbooks/apply-policy-nemoclaw.yml

  - name: Apply Policy - UhhCraft
    playbook: platform/playbooks/apply-policy-uhhcraft.yml

  - name: Apply Policy - ComfyUI Sidecar
    playbook: platform/playbooks/apply-policy-inference-comfyui.yml

  - name: Apply Policy - Hunyuan3D Sidecar
    playbook: platform/playbooks/apply-policy-inference-hunyuan3d.yml

  # ── SSH ────────────────────────────────────────────────────────
  - name: Distribute SSH Keys
    playbook: platform/playbooks/distribute-ssh-keys.yml
    # Phase 1's way IN to a host that has no key yet. The dev branch reads
    # login_password from the secret store as an ansible_password fallback; main
    # has no password path at all and simply cannot reach a keyless host
    # (verified: the access gate reports "unreachable by any method"). Semaphore
    # does NOT honour a launch-time repository override — tested, the field comes
    # back null and the run still fetches main — so the variant is the only way to
    # run the fixed code.
    dev_variant: true

  - name: Harden SSH
    playbook: platform/playbooks/harden-ssh.yml
    # THE IRREVERSIBLE STEP. It must run the same branch as the gate that clears
    # it — verifying dev's code and then hardening with main's would mean the thing
    # checked is not the thing run, on the one action that can lock the host out.
    dev_variant: true

  - name: Apply Firewall
    playbook: platform/playbooks/apply-firewall.yml
    # Variant so the phase's last enforcement step matches the branch its
    # verification ran from.
    dev_variant: true
    survey_vars:
      - name: target_service
        title: "Target group"
        description: "Inventory group to firewall (e.g. openhands_svc, authentik_svc)"
        type: string
        required: true

  - name: Generate Service SSH Key
    playbook: platform/playbooks/generate-service-ssh-key.yml
    # Variant so the whole of Phase 1 executes ONE branch's code. This playbook is
    # byte-identical on main and dev today, but relying on that means the guarantee
    # quietly lapses the first time either branch moves.
    dev_variant: true
    survey_vars:
      - name: service_name
        title: "Service name"
        description: "Per-service key to create at secret/services/ssh/<name> (e.g. authentik, openhands, caddy)"
        type: string
        required: true

  - name: Manage Caddy Sites
    playbook: platform/playbooks/manage-caddy-sites.yml
    # The read-report + retire + rescue version of this playbook lives on dev; main
    # still carries the insert-only one. The (Dev) variant is how a prod route lands
    # through the current code before promotion (same pattern as Seed n8n Secrets).
    dev_variant: true
    survey_vars:
      - name: target_service
        title: "Caddy group"
        description: "Inventory group of the central Caddy (default caddy_svc)"
        type: string
        required: false
        default_value: "caddy_svc"

  - name: Wire Caddy Cloudflare Token
    playbook: platform/playbooks/wire-caddy-cloudflare-token.yml
    survey_vars:
      - name: target_service
        title: "Caddy group"
        description: "Inventory group of the central Caddy (default caddy_svc)"
        type: string
        required: false
        default_value: "caddy_svc"

  # Converge the Cloudflare DNS records public services need (A/CNAME), declared
  # per group as the `cloudflare_records` inventory var — encodes 05's manual
  # "Allocate DNS Record" step. Token: OpenBao secret/services/caddy.
  - name: Manage Cloudflare Records
    playbook: platform/playbooks/manage-cloudflare-records.yml
    survey_vars:
      - name: target_service
        title: "Records group"
        description: "Inventory group whose cloudflare_records to converge (default caddy_svc)"
        type: string
        required: false
        default_value: "caddy_svc"

  # Promote every declared platform admin (inventory var semaphore_admin_users)
  # to a Semaphore admin via the API. Sanctioned replacement for the manual
  # grant — Semaphore 2.18.12 has no group->role mapping (closes task #37).
  - name: Promote Semaphore Admins
    playbook: platform/playbooks/promote-semaphore-admins.yml

  # ── Infrastructure ─────────────────────────────────────────────
  - name: Install Docker
    playbook: platform/playbooks/install-docker.yml

  - name: Install QEMU Guest Agent
    playbook: platform/playbooks/install-qemu-guest-agent.yml
    dev_variant: true
    survey_vars:
      - name: target_service
        title: "Target VM group"
        description: "One <name>_svc inventory group of existing QEMU VMs (e.g. netbox_svc)"
        type: string
        required: true

  - name: Install Podman
    playbook: platform/playbooks/install-podman.yml
    # Variant for the same reason as Generate Service SSH Key: one branch for the
    # whole phase, rather than a guarantee that depends on files staying identical.
    dev_variant: true

  - name: Create VM Template
    playbook: platform/playbooks/provision-template.yml

  - name: Destroy VM
    playbook: platform/playbooks/destroy-vm.yml
    # DESTRUCTIVE. Inventory-first like Provision VM; refuses unless the live VM matches
    # the declaration on vmid+name+node AND the launch names the vmid in confirm_destroy.
    dev_variant: true
    survey_vars:
      - name: target_service
        title: "Target service"
        description: "Service whose <name>_svc group holds the declaration (e.g. agentgateway)"
        type: string
        required: true
      - name: target_host
        title: "Target host"
        description: "Which declared host — REQUIRED when the group declares more than one"
        type: string
        required: false
      - name: confirm_destroy
        title: "Confirm: vmid to destroy"
        description: "Type the declared vm_vmid. Anything else refuses. No default on purpose."
        type: string
        required: true

  - name: Provision VM
    playbook: platform/playbooks/provision-vm.yml
    # main's copy of this playbook predates the inventory-first fix ("make it runnable
    # from Semaphore at all"), so the dev-bound variant is the only way to exercise the
    # current code before promotion. Permanent, not a branch workaround.
    dev_variant: true
    survey_vars:
      - name: target_service
        title: "Target service"
        description: "Service whose <name>_svc group holds the declaration (e.g. github_runner)"
        type: string
        required: true
      - name: target_host
        title: "Target host"
        description: "Which declared host to provision — REQUIRED when the group declares more than one"
        type: string
        required: false

  # Pre-upgrade safety: snapshot a VM (create -> wait -> validate) before any
  # production upgrade. Creds from OpenBao (secret/services/proxmox).
  - name: Configure Host Network
    playbook: platform/playbooks/configure-host-network.yml
    dev_variant: true
    # Converges a host's IPv4 configuration to what the inventory declares. Built
    # after `devlog` was found holding `postiz`'s declared address: two machines
    # answered one IP, different ARP caches resolved it differently, and an
    # orchestrated deploy authenticated against the wrong host for hours while
    # every credential check passed.
    #
    # DRY RUN BY DEFAULT. Without `net_confirm=true` it renders, validates with
    # `netplan generate`, prints the before/after and changes nothing.
    #
    # Two safety properties, both mutation-tested:
    #  - an IDENTITY GUARD refuses to proceed unless the host states a name
    #    matching the inventory entry being converged, so a contested address
    #    cannot cause the wrong guest to be reconfigured
    #  - a REVERT IS ARMED before the apply (a transient systemd timer restoring
    #    the previous config) and disarmed only after the CONTROLLER confirms the
    #    new address answers. An address that does not work undoes itself; the
    #    exposure is bounded by net_revert_seconds rather than by someone noticing.
    survey_vars:
      - name: target_service
        title: "Service"
        description: "Inventory group whose host to converge (e.g. devlog_svc)"
        type: string
        required: true
      - name: net_confirm
        title: "Apply"
        description: "false (default) renders and validates only; true applies the change"
        type: string
        required: false
        default_value: "false"

  # ── Self-hosted GitHub Actions runners ─────────────────────────────────────
  # Runner-group access control. Converges the org's group to its declaration, so the
  # exclusion of public repositories is a reviewable diff rather than a console setting.
  # Read-only unless dry_run=false.
  - name: Manage GitHub Runner Group
    playbook: platform/playbooks/manage-github-runner-group.yml
    # Introduced by this change, so main has no copy yet — a dev-bound variant is the
    # only way to exercise it before promotion (setup-templates.yml emits "<name> (Dev)").
    dev_variant: true
    survey_vars:
      - name: dry_run
        title: "Dry run"
        description: "true = resolve + report, change nothing"
        type: string
        required: false
        default_value: "true"

  - name: Deploy GitHub Runner
    playbook: platform/playbooks/deploy-github-runner.yml
    # Introduced by this change, so main has no copy yet — a dev-bound variant is the
    # only way to exercise it before promotion (setup-templates.yml emits "<name> (Dev)").
    dev_variant: true
    survey_vars:
      - name: service_branch
        title: "Target branch"
        description: "Branch cloned onto the runner host (leave as 'main' for production)"
        type: string
        required: true
        default_value: "main"
      - name: target_service
        title: "Target group"
        description: "Inventory group holding the runner hosts (github_runner_svc)"
        type: string
        required: true
      - name: github_app_client_id
        title: "App client id"
        description: "JWT issuer — the App's client id (NOT the client secret, which is unused)"
        type: string
        required: false

  - name: Resize VM
    playbook: platform/playbooks/resize-vm.yml
    dev_variant: true
    # Converges a live VM's cores/memory/disk to the spec declared in
    # site-config/proxmox/vm-specs.yml. Edit the spec, then run this — the
    # declared file stays the source of truth rather than a number typed at
    # launch time that nobody can look up later.
    #
    # Safe by default: disk GROWTH only (Proxmox cannot shrink without data
    # loss, so a smaller declared disk is refused), and reboots are opt-in —
    # without allow_reboot the cores/memory config is written and the pending
    # change is reported instead of restarting a live service. A run with
    # allow_reboot unset is a safe way to preview the diff.
    survey_vars:
      - name: target_service
        title: "Service"
        description: "Service name as keyed in proxmox/vm-specs.yml (e.g. postiz)"
        type: string
        required: true
      - name: allow_reboot
        title: "Allow reboot"
        description: "true to stop/start the guest so cores+memory take effect now; false (default) writes config only"
        type: string
        required: false
        default_value: "false"

  - name: Snapshot VM
    playbook: platform/playbooks/snapshot-vm.yml
    survey_vars:
      - name: pve_vmid
        title: "VM ID"
        description: "Proxmox VMID to snapshot (e.g. 203 for semaphore)"
        type: int
        required: true
      - name: pve_node
        title: "PVE node"
        description: "Proxmox node the VM runs on (e.g. apollo)"
        type: string
        required: true
      - name: snapshot_name
        title: "Snapshot name"
        description: "Optional; defaults to preupgrade-<vmid>-<timestamp>"
        type: string
        required: false
