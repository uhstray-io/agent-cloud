# Semaphore Task Templates — Declarative configuration
# Applied by setup-templates.yml playbook
#
# Each template maps to a playbook in this monorepo.
# No secrets or sensitive data — safe for public repo.

templates:
  # ── Deployment ─────────────────────────────────────────────────
  - name: Deploy All Services
    playbook: platform/playbooks/deploy-all.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy OpenBao
    playbook: platform/playbooks/deploy-openbao.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy NocoDB
    playbook: platform/playbooks/deploy-nocodb.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy n8n
    playbook: platform/playbooks/deploy-n8n.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Semaphore
    playbook: platform/playbooks/deploy-semaphore.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy NetBox
    playbook: platform/playbooks/deploy-netbox.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  # Build #1 (netbox-device-add): skynet requests "Create NetBox Device"; agent-cloud
  # executes it under the scoped automation token minted by the provision template.
  - name: Provision NetBox Automation Token
    playbook: platform/playbooks/provision-netbox-automation-token.yml

  - name: Create NetBox Device
    playbook: platform/playbooks/create-netbox-device.yml
    survey_vars:
      - name: device_proposal
        title: "Device proposal (JSON)"
        description: "netbox-device-proposal JSON emitted by skynet"
        type: string
        required: true
      - name: dry_run
        title: "Dry run"
        description: "true = resolve + report, no writes"
        type: string
        required: false
        default_value: "false"

  - name: Deploy NemoClaw
    playbook: platform/playbooks/deploy-nemoclaw.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Authentik
    playbook: platform/playbooks/deploy-authentik.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy OpenHands
    playbook: platform/playbooks/deploy-openhands.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy WisBot
    playbook: platform/playbooks/deploy-wisbot.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy tududi
    playbook: platform/playbooks/deploy-tududi.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy honcho
    playbook: platform/playbooks/deploy-honcho.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Postiz
    playbook: platform/playbooks/deploy-postiz.yml
    # Five-container rootless stack: the app, its Postgres + Redis, and the
    # Temporal workflow engine + that engine's Postgres. The engine is what
    # executes scheduled publishing. Native Authentik OIDC in-app (not a Caddy
    # forward_auth gate) so the /api/public/v1 automation path stays usable by
    # n8n with an API key.
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy NetBox
    playbook: platform/playbooks/clean-deploy-netbox.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy Orb Agent
    playbook: platform/playbooks/deploy-orb-agent.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  # pfSense sync runs as an orb-agent worker (every 15 min, no separate playbook)

  # ── WebSmith integration: UhhCraft + inference sidecars ────────
  - name: Deploy UhhCraft
    playbook: platform/playbooks/deploy-uhhcraft.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Deploy ComfyUI Sidecar
    playbook: platform/playbooks/deploy-inference-comfyui.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"
      - name: smoke
        title: "Smoke generation"
        description: "Set to 1 to run a smoke image generation in post-deploy (uses GPU; ~5s)"
        type: string
        required: false
        default_value: "0"

  - name: Deploy Hunyuan3D Sidecar
    playbook: platform/playbooks/deploy-inference-hunyuan3d.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"
      - name: smoke
        title: "Smoke generation"
        description: "Set to 1 to run a smoke 3D generation in post-deploy (uses GPU; ~30s)"
        type: string
        required: false
        default_value: "0"

  - name: Clean Deploy UhhCraft
    playbook: platform/playbooks/clean-deploy-uhhcraft.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy WisBot
    playbook: platform/playbooks/clean-deploy-wisbot.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy OpenHands
    playbook: platform/playbooks/clean-deploy-openhands.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy Authentik
    playbook: platform/playbooks/clean-deploy-authentik.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy tududi
    playbook: platform/playbooks/clean-deploy-tududi.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Clean Deploy honcho
    playbook: platform/playbooks/clean-deploy-honcho.yml
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  # ── Updates ────────────────────────────────────────────────────
  - name: Clean Deploy Postiz
    playbook: platform/playbooks/clean-deploy-postiz.yml
    # DESTRUCTIVE: wipes postiz's Postgres, Redis, uploads, AND the workflow
    # engine's Postgres. Every connected social account must be re-authorized by
    # hand afterwards, so this is not a routine recovery step. API keys survive
    # (the signing secret is reused), so an n8n workflow keeps authenticating
    # against an account that no longer exists — re-issue the key after
    # re-registering. Set postiz_disable_registration back to false first, or
    # nobody can sign in to the rebuilt stack.
    survey_vars:
      - name: service_branch
        title: "Branch"
        description: "Git branch to deploy (leave as 'main' for production)"
        type: string
        required: false
        default_value: "main"

  - name: Update NocoDB
    playbook: platform/playbooks/update-nocodb.yml

  - name: Update n8n
    playbook: platform/playbooks/update-n8n.yml

  - name: Update Semaphore
    playbook: platform/playbooks/update-semaphore.yml

  - name: Update NetBox
    playbook: platform/playbooks/update-netbox.yml

  - name: Update UhhCraft
    playbook: platform/playbooks/update-uhhcraft.yml

  - name: Update ComfyUI Sidecar
    playbook: platform/playbooks/update-inference-comfyui.yml

  - name: Update Hunyuan3D Sidecar
    playbook: platform/playbooks/update-inference-hunyuan3d.yml

  # ── Validation ─────────────────────────────────────────────────
  - name: Validate All Services
    playbook: platform/playbooks/validate-all.yml

  - name: Check Discovery Pipeline
    playbook: platform/playbooks/check-discovery.yml

  - name: Cleanup NetBox
    playbook: platform/playbooks/cleanup-netbox.yml

  - name: Validate Proxmox Cluster
    playbook: platform/playbooks/proxmox-validate.yml

  # ── Secrets ────────────────────────────────────────────────────
  - name: Check Secrets
    playbook: platform/playbooks/check-secrets.yml

  - name: Validate Secrets
    playbook: platform/playbooks/validate-secrets.yml

  - name: Seed Discovery Credentials
    playbook: platform/playbooks/seed-discovery-credentials.yml

  - name: Update Proxmox Token
    playbook: platform/playbooks/update-proxmox-token.yml

  - name: Sync Secrets to OpenBao
    playbook: platform/playbooks/sync-secrets-to-openbao.yml

  - name: Seed OpenBao Key
    playbook: platform/playbooks/seed-openbao-key.yml
    # Merges ONE key into an existing secret path (siblings preserved), for
    # code-managed placement of a shared secret a reader deploy needs (e.g.
    # honcho reads secret/services/nemoclaw:gemini_api_key). bao_value is passed
    # as a launch-time extra-var (-e bao_value=...), not a stored survey field.
    survey_vars:
      - name: bao_path
        title: "Secret path"
        description: "KV-v2 path under secret/ to merge into (e.g. services/nemoclaw)"
        type: string
        required: true
      - name: bao_key
        title: "Key name"
        description: "Field to set/update at that path (e.g. gemini_api_key)"
        type: string
        required: true

  - name: Seed Postiz Secrets
    playbook: platform/playbooks/seed-postiz-secrets.yml
    # Places the operator's social-platform application credentials at
    # secret/services/postiz, additively (KV-v2 merge-patch), so the three
    # generated secrets already there survive. deploy-postiz.yml declares these
    # as `type: existing` — it surfaces them to the rendered config but never
    # generates them, because they are the operator's own credentials from each
    # platform's developer console.
    #
    # NO survey_vars, deliberately: Semaphore PERSISTS survey values in its
    # database, so a credential typed into a survey field would be stored there
    # indefinitely. Pass them as launch-time extra vars instead, only the ones
    # you have:
    #   -e seed_x_api_key=... -e seed_x_api_secret=...
    #   -e seed_linkedin_client_id=... -e seed_linkedin_client_secret=...
    #   -e seed_youtube_client_id=... -e seed_youtube_client_secret=...
    #   -e seed_discord_client_id=... -e seed_discord_client_secret=...
    #   -e seed_discord_bot_token_id=...
    # Re-running with unchanged values writes nothing. Verify with Check
    # Secrets, then run Deploy Postiz.

  - name: Mint Honcho Team JWT
    playbook: platform/playbooks/mint-honcho-team-jwt.yml
    # Mints a team-wide, workspace-scoped (uhstray) Honcho JWT via the container's
    # generate_jwt.py, stores it at secret/services/honcho/tokens/team, verifies
    # against /v3. Token is never logged. Re-running rotates the team key.
    # Runs against the honcho_svc group; no survey vars.

  - name: Apply Cloudflare Tofu
    playbook: platform/playbooks/apply-cloudflare-tofu.yml
    # OpenBao-wrapper around the platform/infra/cloudflare OpenTofu root: fetches
    # the CF token + R2 keys from OpenBao, runs tofu against the R2 backend.
    # tofu_action=plan (safe, default) or apply (gated change; run after review).
    survey_vars:
      - name: tofu_action
        title: "Action"
        description: "plan (read-only, default) or apply (gated change)"
        type: string
        required: false
        default_value: "plan"

  # NOTE: set-semaphore-branch.yml is an OPERATOR-SIDE tool (run from a
  # workstation with SEMAPHORE_URL/SEMAPHORE_TOKEN, like setup-templates.yml) —
  # deliberately NOT a Semaphore template, since managing Semaphore's own config
  # from inside a Semaphore job is avoided by convention.

  - name: Apply All OpenBao Policies
    playbook: platform/playbooks/apply-openbao-policies.yml

  - name: Apply Policy - Orb Agent
    playbook: platform/playbooks/apply-policy-orb-agent.yml

  - name: Provision AppRole - Orb Agent
    playbook: platform/playbooks/provision-orb-agent-approle.yml

  - name: Apply Policy - Semaphore
    playbook: platform/playbooks/apply-policy-semaphore.yml

  - name: Apply Policy - NemoClaw
    playbook: platform/playbooks/apply-policy-nemoclaw.yml

  - name: Apply Policy - UhhCraft
    playbook: platform/playbooks/apply-policy-uhhcraft.yml

  - name: Apply Policy - ComfyUI Sidecar
    playbook: platform/playbooks/apply-policy-inference-comfyui.yml

  - name: Apply Policy - Hunyuan3D Sidecar
    playbook: platform/playbooks/apply-policy-inference-hunyuan3d.yml

  # ── SSH ────────────────────────────────────────────────────────
  - name: Distribute SSH Keys
    playbook: platform/playbooks/distribute-ssh-keys.yml

  - name: Harden SSH
    playbook: platform/playbooks/harden-ssh.yml

  - name: Apply Firewall
    playbook: platform/playbooks/apply-firewall.yml
    survey_vars:
      - name: target_service
        title: "Target group"
        description: "Inventory group to firewall (e.g. openhands_svc, authentik_svc)"
        type: string
        required: true

  - name: Generate Service SSH Key
    playbook: platform/playbooks/generate-service-ssh-key.yml
    survey_vars:
      - name: service_name
        title: "Service name"
        description: "Per-service key to create at secret/services/ssh/<name> (e.g. authentik, openhands, caddy)"
        type: string
        required: true

  - name: Manage Caddy Sites
    playbook: platform/playbooks/manage-caddy-sites.yml
    survey_vars:
      - name: target_service
        title: "Caddy group"
        description: "Inventory group of the central Caddy (default caddy_svc)"
        type: string
        required: false
        default_value: "caddy_svc"

  - name: Wire Caddy Cloudflare Token
    playbook: platform/playbooks/wire-caddy-cloudflare-token.yml
    survey_vars:
      - name: target_service
        title: "Caddy group"
        description: "Inventory group of the central Caddy (default caddy_svc)"
        type: string
        required: false
        default_value: "caddy_svc"

  # Converge the Cloudflare DNS records public services need (A/CNAME), declared
  # per group as the `cloudflare_records` inventory var — encodes 05's manual
  # "Allocate DNS Record" step. Token: OpenBao secret/services/caddy.
  - name: Manage Cloudflare Records
    playbook: platform/playbooks/manage-cloudflare-records.yml
    survey_vars:
      - name: target_service
        title: "Records group"
        description: "Inventory group whose cloudflare_records to converge (default caddy_svc)"
        type: string
        required: false
        default_value: "caddy_svc"

  # Promote every declared platform admin (inventory var semaphore_admin_users)
  # to a Semaphore admin via the API. Sanctioned replacement for the manual
  # grant — Semaphore 2.18.12 has no group->role mapping (closes task #37).
  - name: Promote Semaphore Admins
    playbook: platform/playbooks/promote-semaphore-admins.yml

  # ── Infrastructure ─────────────────────────────────────────────
  - name: Install Docker
    playbook: platform/playbooks/install-docker.yml

  - name: Install Podman
    playbook: platform/playbooks/install-podman.yml

  - name: Create VM Template
    playbook: platform/playbooks/provision-template.yml

  - name: Provision VM
    playbook: platform/playbooks/provision-vm.yml

  # Pre-upgrade safety: snapshot a VM (create -> wait -> validate) before any
  # production upgrade. Creds from OpenBao (secret/services/proxmox).
  - name: Snapshot VM
    playbook: platform/playbooks/snapshot-vm.yml
    survey_vars:
      - name: pve_vmid
        title: "VM ID"
        description: "Proxmox VMID to snapshot (e.g. 203 for semaphore)"
        type: int
        required: true
      - name: pve_node
        title: "PVE node"
        description: "Proxmox node the VM runs on (e.g. apollo)"
        type: string
        required: true
      - name: snapshot_name
        title: "Snapshot name"
        description: "Optional; defaults to preupgrade-<vmid>-<timestamp>"
        type: string
        required: false
