---
# sync-inventory.yml — push a local inventory file into a Semaphore inventory record.
#
# WHY THIS EXISTS. Inventory is config-as-code (site-config/inventory/production.yml
# for prod, platform/inventory/local-dev.yml for local), but Semaphore stores its
# own COPY as a static-yaml record and never checks out site-config — it is a
# private repo with no deploy key attached, deliberately. So every inventory edit
# needed a human to paste the file into the Semaphore UI, which is the exact
# "manual step that lives only in someone's habits" the platform principles
# forbid: nothing records that it happened, and the orchestrator silently runs
# against a stale snapshot until someone notices.
#
# Found the hard way: a resize playbook failed because Semaphore's stored
# inventory still had no `postiz_svc` group, days after it was committed.
#
# OPERATOR-SIDE tool (run from a workstation, NOT as a Semaphore job) — managing
# Semaphore's own configuration from inside a Semaphore job is avoided by
# convention, same as setup-templates.yml and bootstrap-semaphore-repositories.yml.
#
#   SEMAPHORE_URL=https://semaphore.uhstray.io SEMAPHORE_TOKEN=<token> \
#     ansible-playbook platform/semaphore/sync-inventory.yml \
#       -e inventory_source=../site-config/inventory/production.yml \
#       -e inventory_name=production
#
# Idempotent: the record is written ONLY when its stored content differs from the
# file, so a re-run is a no-op and does not churn Semaphore's history.
#
# Safety: this pushes REAL inventory (private addresses) into Semaphore, which is
# where it already lives — but it never writes that content to this repo, and it
# refuses a source file outside the caller's filesystem or an empty one, since an
# empty push would silently blank the orchestrator's inventory.

- name: "Sync inventory into Semaphore"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _semaphore_url: "{{ lookup('env', 'SEMAPHORE_URL') }}"
    _token: "{{ lookup('env', 'SEMAPHORE_TOKEN') }}"
    _project_id: "{{ semaphore_project_id | default(1) }}"
    _name: "{{ inventory_name | default('production') }}"
    _ssh_key_id: "{{ semaphore_inventory_ssh_key_id | default(0) | int }}"

  tasks:
    - name: "Validate inputs"
      ansible.builtin.assert:
        that:
          - _semaphore_url | length > 0
          - _token | length > 0
          - inventory_source is defined
          - inventory_source | length > 0
        fail_msg: >-
          Set SEMAPHORE_URL and SEMAPHORE_TOKEN, and pass
          -e inventory_source=<path to the inventory file>
          (optionally -e inventory_name=<record name>, default 'production').

    # SEMAPHORE_TOKEN is sent as a Bearer credential on every request below, so
    # the transport matters. https always; http ONLY to loopback, which is the
    # normal operator path (an SSH-local tunnel to the Semaphore host). Same
    # shape as the OpenBao guards in the seed-* playbooks.
    - name: "Require a non-cleartext transport to Semaphore"
      ansible.builtin.assert:
        that:
          - >-
            _semaphore_url is match('^(https://|http://(localhost|127(\.[0-9]{1,3}){3})([:/]|$))')
        fail_msg: >-
          Refusing to send SEMAPHORE_TOKEN over cleartext. Use an https:// URL,
          or http://localhost:<port> via an SSH-local tunnel to the Semaphore
          host. Got a non-loopback http:// endpoint.

    - name: "Read the source inventory"
      ansible.builtin.slurp:
        src: "{{ inventory_source }}"
      register: _src

    - name: "Decode it"
      ansible.builtin.set_fact:
        _content: "{{ _src.content | b64decode }}"

    - name: "Refuse to push an empty inventory"
      # A blank push would leave the orchestrator with no hosts and every later
      # run would fail in a way that looks like a connectivity problem.
      ansible.builtin.assert:
        that:
          - _content | trim | length > 0
        fail_msg: "{{ inventory_source }} is empty — refusing to blank Semaphore's inventory."

    - name: "Sanity-check it parses as YAML"
      ansible.builtin.assert:
        that:
          - (_content | from_yaml) is mapping
        fail_msg: "{{ inventory_source }} does not parse as a YAML mapping — refusing to push it."

    # Count actual hosts using Ansible's OWN inventory parser rather than a
    # hand-rolled YAML walker. `{}` and a groups-only skeleton are both non-empty
    # strings that parse as mappings, so they cleared the checks above while
    # still being hostless — and the PUT would then have replaced Semaphore's
    # inventory with a record containing nothing to run against.
    #
    # Why the real parser: these inventories have SEVERAL top-level groups rather
    # than a single `all:` root, and `hosts:` appears at more than one depth. A
    # first attempt assumed the all/children shape and counted 0 on a perfectly
    # good file — which the refusal below then correctly blocked, but it would
    # have blocked every legitimate sync too. ansible-inventory knows the real
    # grammar; reimplementing it here would just be a second thing to get wrong.
    - name: "Enumerate hosts with ansible-inventory"
      ansible.builtin.command:
        argv: [ansible-inventory, -i, "{{ inventory_source }}", --list]
      register: _inv_list
      changed_when: false

    - name: "Count them"
      ansible.builtin.set_fact:
        _host_count: "{{ ((_inv_list.stdout | from_json)['_meta']['hostvars'] | default({})) | length }}"

    - name: "Refuse a hostless inventory"
      ansible.builtin.assert:
        that:
          - (_host_count | int) > 0
        fail_msg: >-
          {{ inventory_source }} parses but declares NO hosts. Pushing it would
          leave Semaphore with an inventory it cannot run anything against, and
          every later task would fail looking like a connectivity problem.
          Refusing.
        success_msg: "{{ inventory_source }} declares {{ _host_count }} host(s)."

    - name: "Read existing inventory records"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/inventory"
        headers:
          Authorization: "Bearer {{ _token }}"
      register: _invs

    - name: "Locate the target record"
      ansible.builtin.set_fact:
        _match: "{{ (_invs.json | selectattr('name', 'equalto', _name) | list | first) | default({}) }}"

    - name: "Require the record to exist"
      # Creating one would also need the right ssh_key_id and type, which are
      # environment-specific; a missing record is an operator decision, not
      # something to guess at.
      ansible.builtin.assert:
        that:
          - _match | length > 0
        fail_msg: >-
          No Semaphore inventory record named '{{ _name }}'. Available:
          {{ _invs.json | map(attribute='name') | list | join(', ') }}.
          Create it once in Semaphore (type static-yaml), then re-run.

    - name: "Report whether anything changes"
      ansible.builtin.debug:
        msg: >-
          {{ 'Content differs — will update record ' ~ _match.id ~ " ('" ~ _name ~ "')."
             if (_match.inventory | default('')) != _content
             else "Record " ~ _match.id ~ " ('" ~ _name ~ "') already matches the file — no write." }}

    - name: "Update the record"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/inventory/{{ _match.id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ _token }}"
        body_format: json
        body:
          id: "{{ _match.id | int }}"
          name: "{{ _name }}"
          project_id: "{{ _project_id | int }}"
          type: "{{ _match.type | default('static-yaml') }}"
          inventory: "{{ _content }}"
          ssh_key_id: "{{ _match.ssh_key_id | default(_ssh_key_id) | int }}"
          become_key_id: "{{ _match.become_key_id | default(omit) }}"
        status_code: [200, 201, 204]
      when: (_match.inventory | default('')) != _content
      changed_when: true

    - name: "Re-read to confirm"
      ansible.builtin.uri:
        url: "{{ _semaphore_url }}/api/project/{{ _project_id }}/inventory/{{ _match.id }}"
        headers:
          Authorization: "Bearer {{ _token }}"
      register: _after
      changed_when: false

    - name: "Verify the push actually landed"
      ansible.builtin.assert:
        that:
          - (_after.json.inventory | default('')) == _content
        fail_msg: >-
          Semaphore's stored inventory still differs from {{ inventory_source }}
          after the write — do not trust a later run against it.
        success_msg: >-
          Record {{ _match.id }} ('{{ _name }}') matches {{ inventory_source }}
          ({{ _content | length }} bytes).
