---
# templates-local.yml — Semaphore templates that exist ONLY on local-dev
# instances (plan/development/LOCAL-DEV-DEPLOYMENT.md).
#
# Merged by setup-templates.yml exclusively when
# `semaphore_include_local_templates: true` — which only
# platform/playbooks/bootstrap-local-dev.yml sets. The shared templates.yml
# stays prod-clean; applying THIS file to production is structurally prevented
# by that flag defaulting to false.

# EVERY template in this file is bound to the `agent-cloud worktree` repository
# record (the /workspace/agent-cloud mount at HEAD, created by
# bootstrap-local-dev.yml) — STRUCTURALLY, by setup-templates.yml's map-combine
# at the load site, so the binding cannot be forgotten on a new entry. Do NOT
# add per-template `repository:` lines here; the combine overrides them anyway.
# Why: bound to GitHub, local templates silently validate code that is not the
# code being written (MISTAKES 10.9, found 2026-08-30).
templates:
  # Local DNS (hickory-dns) — authoritative for the dev zone, forwards the rest.
  # Plan: DNS-SERVER-DEPLOYMENT.md (local half: LOCAL-DEV-DEPLOYMENT.md §5.1).
  - name: "Deploy DNS (Local)"
    playbook: platform/playbooks/deploy-dns.yml

  # step-ca — internal CA (stable root; issues certs for *.agent-cloud.test).
  - name: "Deploy step-ca (Local)"
    playbook: platform/playbooks/deploy-step-ca.yml

  # Local Caddy — internal-CA TLS, reverse-proxies the control plane by name.
  - name: "Deploy Caddy (Local)"
    playbook: platform/playbooks/deploy-caddy.yml

  # Authentik — central IdP / SSO (server+worker+Postgres+Redis behind Caddy).
  - name: "Deploy Authentik (Local)"
    playbook: platform/playbooks/deploy-authentik.yml

  # o11y — observability stack (Grafana + Prometheus + Loki + Alloy).
  - name: "Deploy o11y (Local)"
    playbook: platform/playbooks/deploy-o11y.yml

  # OPA — Guardrail-layer policy engine (agent action authorization).
  - name: "Deploy OPA (Local)"
    playbook: platform/playbooks/deploy-opa.yml

  # n8n — workflow automation (composable; greenfield locally). The legacy
  # secret-gen deploy.sh path is replaced by manage-secrets + a templated .env.
  - name: "Deploy n8n (Local)"
    playbook: platform/playbooks/deploy-n8n.yml

  # n8n Postiz substrate: mint+capture the API key, then provision the
  # postizApi credential from shared custody (local Postiz reachable on the
  # local-dev network — see n8n_postiz_credential_host in the inventory).
  - name: "Store n8n API Key (Local)"
    playbook: platform/playbooks/store-n8n-api-key.yml
  - name: "Provision n8n Postiz Credential (Local)"
    playbook: platform/playbooks/provision-n8n-postiz-credential.yml

  # tududi↔GitHub sync substrate: mint+capture the tududi token; refresh the
  # App installation token (fails NAMED until the App key is seeded — correct).
  - name: "Store tududi API Token (Local)"
    playbook: platform/playbooks/store-tududi-api-token.yml
  - name: "Refresh tududi-sync GitHub Token (Local)"
    playbook: platform/playbooks/refresh-tududi-sync-github-token.yml
  - name: "Provision tududi-github Sync (Local)"
    playbook: platform/playbooks/provision-tududi-github-sync.yml
  - name: "Verify tududi-github Sync (Local)"
    playbook: platform/playbooks/verify-tududi-github-sync.yml

  # n8n upgrade tooling (design D7): timestamped pg_dump + named-dump restore.
  # Local is where the pair is proven before it carries the prod cutover.
  # The restore hard-requires n8n_dump_file, so the survey var is declared
  # here too — without it a direct local UI launch fails on task 1.
  - name: "Back Up n8n DB (Local)"
    playbook: platform/playbooks/backup-n8n-db.yml
  - name: "Restore n8n DB (Local)"
    playbook: platform/playbooks/restore-n8n-db.yml
    survey_vars:
      - name: n8n_dump_file
        title: "Dump file path"
        description: "Explicit dump to restore (named in Back Up n8n DB's report). Never 'the latest'."
        type: string
        required: true

  # ERPNext — ERP (slim local tier; site bootstrap in post-deploy phase).
  - name: "Deploy ERPNext (Local)"
    playbook: platform/playbooks/deploy-erpnext.yml

  # tududi - self-hosted to-do app (single rootless container, SQLite; native OIDC).
  - name: "Deploy tududi (Local)"
    playbook: platform/playbooks/deploy-tududi.yml

  # honcho - memory API (api+deriver+pgvector+redis; /v3 JWT, /docs forward_auth).
  - name: "Deploy honcho (Local)"
    playbook: platform/playbooks/deploy-honcho.yml

  # postiz - social publishing (app + postgres + redis + temporal + temporal-pg;
  # native OIDC, API-key automation endpoint ungated at the edge).
  - name: "Deploy Postiz (Local)"
    playbook: platform/playbooks/deploy-postiz.yml

  # Captures the app-minted public-API key into the local OpenBao — run after
  # the first sign-in (the app mints the key on the first authenticated request).
  - name: "Store Postiz API Key (Local)"
    playbook: platform/playbooks/store-postiz-api-key.yml

  # Clean-deploy (destructive): wipe a local service's containers+volumes, then
  # redeploy. clean-service.yml is local-aware — it keeps the shared deploy tree.
  - name: "Clean Deploy DNS (Local)"
    playbook: platform/playbooks/clean-deploy-dns.yml
  - name: "Clean Deploy step-ca (Local)"
    playbook: platform/playbooks/clean-deploy-step-ca.yml
  - name: "Clean Deploy Caddy (Local)"
    playbook: platform/playbooks/clean-deploy-caddy.yml
  - name: "Clean Deploy Authentik (Local)"
    playbook: platform/playbooks/clean-deploy-authentik.yml
  - name: "Clean Deploy o11y (Local)"
    playbook: platform/playbooks/clean-deploy-o11y.yml
  - name: "Clean Deploy OPA (Local)"
    playbook: platform/playbooks/clean-deploy-opa.yml
  - name: "Clean Deploy n8n (Local)"
    playbook: platform/playbooks/clean-deploy-n8n.yml
  - name: "Clean Deploy ERPNext (Local)"
    playbook: platform/playbooks/clean-deploy-erpnext.yml
  - name: "Clean Deploy tududi (Local)"
    playbook: platform/playbooks/clean-deploy-tududi.yml
  - name: "Clean Deploy honcho (Local)"
    playbook: platform/playbooks/clean-deploy-honcho.yml
  - name: "Clean Deploy Postiz (Local)"
    playbook: platform/playbooks/clean-deploy-postiz.yml

