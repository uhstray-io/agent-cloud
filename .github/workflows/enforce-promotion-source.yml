name: Promotion Source Guard

# Enforces the platform promotion rule: `main` may only be updated by a PR from `dev`
# (feature -> dev -> main). GitHub rulesets can protect the BASE branch but cannot
# restrict a PR's HEAD branch, so this job is the enforcing half — it is wired in as a
# required status check on the `protect-main` ruleset (.github/rulesets/protect-main.json).
#
# Runs only for PRs whose base is `main`. Fails unless the head is exactly this repository's
# `dev` branch (a fork's branch of the same name is refused),
# and unless that head already contains every commit on `main`. The second check exists
# because `sync-main-to-dev.yml` cannot carry a `main`-only change to a workflow file into
# `dev` (GITHUB_TOKEN has no `workflows` permission), so a promotion from a `dev` that
# lacks it would silently revert it on `main` (docs/MISTAKES.md 10.23).
# Emergency hotfixes bypass via the ruleset's Admin break-glass actor (they can merge
# despite this check), so this is a guardrail, not an absolute lock.
# The job also enforces the release budget (policy 10); its last step carries that check.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-source:
    name: Promotion source (dev -> main)
    runs-on: ubuntu-latest
    steps:
      - name: Require the PR to originate from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          # head_ref is only the branch NAME: a fork's branch called `dev` matches it, so the
          # head repository must be this one as well.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error title=Invalid promotion source::PRs into 'main' must come from this repository's 'dev' branch, not a fork (head repository '${HEAD_REPO}', expected '${BASE_REPO}')."
            exit 1
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error title=Invalid promotion source::PRs into 'main' must come from 'dev' (got '${HEAD_REF}'). Promote via the dev -> main cycle; see AGENTS.md 'Branch Workflow'. Emergency-only: an Admin can break-glass via the protect-main ruleset."
            exit 1
          fi
          echo "OK: promotion source is 'dev' -> 'main'."

      - name: Check out the PR head (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require dev to contain every commit on main
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fetch main explicitly rather than trust what the checkout left behind.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          rc=0
          git merge-base --is-ancestor origin/main "$HEAD_SHA" || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error title=main has commits dev lacks::Merging this PR would revert $(git rev-list --count "$HEAD_SHA"..origin/main) commit(s) that are on 'main' but not on 'dev'. Merge main into dev through a feature PR first (git merge --no-ff origin/main on a branch cut from dev). sync-main-to-dev cannot push changes to workflow files, so it never carries those across."
            git log --oneline "$HEAD_SHA"..origin/main
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=Ancestry check failed::git merge-base exited ${rc} comparing origin/main with ${HEAD_SHA}."
            exit "$rc"
          fi
          echo "OK: dev contains every commit on main."

      - name: Release size
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Policy 10 R2 and R3 limits (100 pull requests, 120 files), counted by scripts/semver.py
          # release-budget: the same count the dev merge guard uses (plan 23). R12: no limit applies
          # until the v0.15.0 carry-over tag exists. origin/main is fetched by the ancestry step above.
          # Tags are fetched here, explicitly, because the transition depends on whether v0.15.0 exists.
          git fetch --no-tags origin '+refs/tags/v*:refs/tags/v*'
          BUDGET="$(python3 scripts/semver.py release-budget --main-ref origin/main --dev-ref "$HEAD_SHA")"
          echo "$BUDGET"
          export BUDGET
          python3 -c '
          import json
          import os
          import sys

          budget = json.loads(os.environ["BUDGET"])
          prs = budget["prs"]
          files = budget["files"]
          limit_prs = budget["limits"]["prs"]
          limit_files = budget["limits"]["files"]
          since = budget["from"] or "the first commit"
          if budget["transition"]:
              print("::notice title=Release budget transition::No release budget applies before the v0.15.0 carry-over release (policy 10 R12). This promotion counts {} pull requests and {} files.".format(prs, files))
          elif budget["full"]:
              print("::error title=Release over budget::{} pull requests (limit {}) and {} files (limit {}) since {}. Policy 10 R11: over the file limit, revert pull requests on dev can bring it back under; over the pull-request limit, the release ships only through the R10 break-glass, recorded in its release notes.".format(prs, limit_prs, files, limit_files, since))
              sys.exit(1)
          else:
              print("OK: {}/{} pull requests and {}/{} files since {}.".format(prs, limit_prs, files, limit_files, since))
          '
