---
name: Sync main to dev

# Auto-reconcile `dev` after every push to `main` — replaces the manual back-merge.
#
# WHY: `dev` -> `main` promotions are merge commits, which keep the two branches'
# ancestry intact, but changes can still land on `main` alone (dependabot bumps), and a
# promotion squashed to scrub sensitive content writes `dev`'s content onto `main` as a
# NEW commit with no ancestry into `dev`, freezing the `dev`<->`main` merge-base so the
# next promotion conflicts on any file changed on both sides (classically
# `platform/semaphore/templates.yml`). This job merges `main` back into `dev` favoring
# `dev` (`-X ours`: `dev`'s content is unchanged and the merge-base advances;
# non-conflicting `main`-only changes still propagate into `dev`). See CLAUDE.md
# "Why the auto-sync".
#
# LIMITATION: this job cannot carry a `main`-only change to a file under
# `.github/workflows/`. GITHUB_TOKEN has no `workflows` permission, so GitHub rejects the
# push ("refusing to allow a GitHub App to create or update workflow ... without
# `workflows` permission") and the run fails red on `main`'s Actions tab, where nobody is
# watching. That is how the setup-python/setup-go v7 bumps sat on `main` alone from
# 2026-08-28 (docs/MISTAKES.md 10.23). The promotion guard
# (`enforce-promotion-source.yml`) refuses a `dev` -> `main` PR until `main` is an ancestor
# of `dev`; merge `main` into `dev` through a feature PR to clear it.

on:
  push:
    branches: [main]

# Need write to push the reconciliation commit to `dev`.
permissions:
  contents: write

# Never run two syncs at once (they'd race on the `dev` ref).
concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  back-merge:
    name: Reconcile dev with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev (full history)
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into dev (favor dev) and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev already contains main — nothing to sync."
            exit 0
          fi
          # -X ours: dev is content-ahead of main except for main-only commits.
          # Favoring dev keeps dev's content identical on a conflict (e.g. after a
          # squashed promotion) and advances the merge-base so the next dev->main diff
          # is clean. Non-conflicting main-only changes still merge in.
          git merge -X ours --no-edit origin/main
          git push origin HEAD:dev
          echo "dev reconciled with main."
