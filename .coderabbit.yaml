# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
#
# request_changes_workflow is the enforceable hook behind the protect-main
# ruleset: when CodeRabbit requests changes it opens review threads that must be
# resolved, and the ruleset's "require conversation resolution" rule then blocks
# the merge button until they are.
# See plan/development/03-guardrails-governance.md and .github/rulesets/.
language: en-US
reviews:
  # chill keeps reviews on substantive issues — important because, with
  # request_changes_workflow + the ruleset's conversation-resolution rule, every
  # unresolved thread blocks the merge button once protect-main is active.
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # Auto-review PRs targeting dev too, not just the default branch (main). Without
    # this, base_branches defaults to [] = default-branch-only, and PRs into dev are
    # skipped — a repo .coderabbit.yaml overrides UI/dashboard branch settings, so this
    # must live here. Entries are regex; ^dev$ is anchored to match dev exactly (main is
    # always reviewed regardless). Verify on any PR with: @coderabbitai configuration
    base_branches:
      - "^dev$"
