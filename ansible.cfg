# Repository Ansible configuration. Semaphore runs ansible-playbook from the repository root
# (v2.18.12 db_lib/AnsiblePlaybook.go:24, cmd.Dir = the clone), so this file applies to the
# production controller, the local-dev controller and workstation runs alike.
# Standard: plan/architecture/08-ansible-automation-standards.md
[defaults]
# Print ansible.builtin.set_stats data at the end of every run. The workflow step result
# (tasks/emit-step-result.yml) is read from this block by the conformance collector.
show_custom_stats = True
# The default output, minus the request of every nested result: a failed loop step prints
# its item whole, and a registered uri result carries its request headers (docs/MISTAKES.md
# 4.6). Semaphore sets no stdout callback of its own (v2.17.31 db_lib/AnsiblePlaybook.go).
stdout_callback = redact_requests
callback_plugins = ./callback_plugins
# The playbook filters (platform/playbooks/filter_plugins), for every play run from the
# repository root, not only plays sitting next to that directory: the test harnesses lift a
# playbook's tasks into a play in a temp dir, which then finds them here instead of each
# harness naming the path itself. Plays in platform/semaphore still load their own
# playbook-adjacent filter_plugins as well; no filter name is defined in both.
filter_plugins = ./platform/playbooks/filter_plugins
